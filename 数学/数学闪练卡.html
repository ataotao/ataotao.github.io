  function moduleById(id) { for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === id) return MODULES[i]; return null; }

  /* ---------- 出题 ---------- */
  function gen(modId, kindId, seed) {
    var m = moduleById(modId);
    if (!m) throw new Error('未知模块 ' + modId);
    var r = mulberry32((seed >>> 0) || 1);
    if (m.items) {
      /* 大题前两步：传 kindId 就练指定得分点，不传才全场混抽。
         kind 必须写回题目：模块页统计、板块随机覆盖、记录里的题型都靠它。 */
      var it = null;
      if (kindId) for (var j = 0; j < m.items.length; j++) if (m.items[j].id === kindId) { it = m.items[j]; break; }
      if (!it) it = m.items[Math.floor(r() * m.items.length)];
      var copy = JSON.parse(JSON.stringify(it));
      copy.mod = modId;
      copy.kind = it.id;
      return shuffleChoices(copy, r);
    }
    var k = null;
    if (kindId) for (var i = 0; i < m.kinds.length; i++) if (m.kinds[i].id === kindId) { k = m.kinds[i]; break; }
    if (!k) k = m.kinds[Math.floor(r() * m.kinds.length)];
    var q = k.gen(r);
    q.mod = modId;
    /* 临时项目（本周错题）：题型带 ref/crop 时，把「卷面第几题」与原题裁切图挂到题目上；
       基础快练里同名题型不带，避免每道变式都贴一张原卷图。 */
    if (k.ref) { q.no = k.ref; if (k.refLabel) q.noLabel = k.refLabel; }
    if (k.crop) {
      /* cropKey/cropCap 写进题目：错题本只存这两个短字段，渲染时再按 key 重建大图（base64 不进 localStorage） */
      q.cropKey = k.crop.key; q.cropCap = k.crop.cap;
      var cf = cropFig(k.crop); if (cf) q.fig = cf;
    }
    return q;
  }

  /* ---------- 判分 ---------- */
  /* 全排列：只用于 expr 的可互换空位（长度 <= 3），给 judge 用 */
  function permsOf(a) {
    if (a.length <= 1) return [a.slice()];
    var out = [];
    for (var i = 0; i < a.length; i++) {
      var rest = a.slice(0, i).concat(a.slice(i + 1));
      permsOf(rest).forEach(function (p) { out.push([a[i]].concat(p)); });
    }
    return out;
  }

  function judge(q, vals) {
    var res = q.fields.map(function (f, i) {
      var v = vals[i];
      if (f.type === 'choice') return { ok: v === f.ans };
      if (f.type === 'set') {
        /* 无序：因式分解 p、q / 方程的两个根，顺序不限 */
        if (!Array.isArray(v) || v.some(function (x) { return !isFinite(x); })) return { ok: false };
        var wantS = f.ans.slice().sort(function (a, b) { return a - b; });
        var gotS = v.slice().sort(function (a, b) { return a - b; });
        return { ok: wantS.length === gotS.length && wantS.every(function (w, j) { return near(gotS[j], w, f.tol || 1e-9); }) };
      }
      if (f.type === 'expr') {
        /* 有序：写全式按模板空位逐位比；f.free 列出的空位可互换（交点式的两个根） */
        if (!Array.isArray(v) || v.length !== f.ans.length || v.some(function (x) { return !isFinite(x); })) return { ok: false };
        var free = f.free || [], perms = permsOf(free), tol = f.tol || 1e-9;
        for (var pi = 0; pi < perms.length; pi++) {
          var exp = f.ans.slice();
          for (var fk = 0; fk < free.length; fk++) exp[free[fk]] = f.ans[perms[pi][fk]];
          if (exp.every(function (w, j) { return near(v[j], w, tol); })) return { ok: true };
        }
        return { ok: false };
      }
      return { ok: isFinite(v) && near(v, f.ans, f.tol || 1e-6) };
    });
    var got = res.filter(function (x) { return x.ok; }).length;
    return { ok: got === res.length, got: got, total: res.length, res: res };
  }

  function ansText(f) {
    if (f.type === 'choice') return f.options[f.ans];
    if (f.type === 'set') {
      var nm = f.names || ['x1', 'x2'];
      return f.ans.map(function (x, i) { return (nm[i] || ('x' + (i + 1))) + ' = ' + frac(x); }).join('，');
    }
    if (f.type === 'expr') return exprText(f.form, f.ans);
    return nice(f.ans, f.unit || '');
  }
  /* 把 expr 的若干个数拼回完整式子（反馈里显示用） */
  function exprText(form, v) {
    if (form === 'vertex') {
      var h = v[1], k = v[2];
      return 'y = ' + frac(v[0]) + '(x ' + (h >= 0 ? '− ' + frac(h) : '+ ' + frac(-h)) + ')² ' + (k >= 0 ? '+ ' + frac(k) : '− ' + frac(-k));
    }
    if (form === 'line') {
      var kk = v[0], bb = v[1];
      return 'y = ' + (kk === 1 ? '' : (kk === -1 ? '−' : frac(kk))) + 'x ' + (bb >= 0 ? '+ ' + frac(bb) : '− ' + frac(-bb));
    }
    if (form === 'intercept') {
      return 'y = ' + frac(v[0]) +
        '(x ' + (v[1] >= 0 ? '− ' + frac(v[1]) : '+ ' + frac(-v[1])) + ')' +
        '(x ' + (v[2] >= 0 ? '− ' + frac(v[2]) : '+ ' + frac(-v[2])) + ')';
    }
    if (form === 'general') {
      return 'y = ' + poly2(v[0], v[1], v[2]);
    }
    return 'y = ' + v.map(frac).join(' , ');
  }

  /* ---------- 图象：答完后画出来，做「式子 ↔ 图」的验证 ---------- */
  function niceStep(span) {
    var raw = span / 6, p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), n = raw / p;
    var s = n <= 1 ? 1 : (n <= 2 ? 2 : (n <= 5 ? 5 : 10));
    return s * p;
  }
  function num(v) { return Math.round(v * 1000) / 1000; }

  function svgFor(q) {
    var f = q.fig;
    if (!f) return '';
    /* 圆/几何题用内联 SVG：与题包 fig.svg 同格式（f.svg 是 <svg> 内部片段），
       不走坐标系变换，免得把圆、扇形压扁。只画题设，不标答案。 */
    if (f.svg) {
      var rw = f.w || 360, rh = f.h || 280;
      return '<svg viewBox="0 0 ' + rw + ' ' + rh + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="题图">' +
        '<rect width="' + rw + '" height="' + rh + '" fill="#fbfcff" rx="10"/>' + f.svg + '</svg>';
    }
    var W = 360, H = 280, PAD = 30;
    var paths = [], dots = (f.dots || []).map(function (d) { return { x: d[0], y: d[1], label: d[2] || '' }; });
    var all = [];

    function addPath(arr) {
      if (!arr.length) return;
      paths.push(arr);
      arr.forEach(function (p) { all.push({ x: p[0], y: p[1] }); });
    }
    /* f.ghost：平移/变换题里「原来的那条抛物线」，画成浅灰虚线垫在下面 */
    var ghosts = [];
    function paraPts(g) {
      var sp = Math.min(4.2, Math.sqrt(9 / Math.abs(g.a)) || 3);
      var out = [];
      for (var i = 0; i <= 120; i++) {
        var x = g.h - sp + 2 * sp * i / 120;
        out.push([x, g.a * (x - g.h) * (x - g.h) + g.k]);
      }
      return out;
    }
    (f.ghost || []).forEach(function (g) {
      var arr = paraPts(g);
      ghosts.push(arr);
      arr.forEach(function (p) { all.push({ x: p[0], y: p[1] }); });
    });

    if (f.type === 'parabola') {
      var a = f.a, h = f.h, k = f.k;
      var span = Math.min(4.2, Math.sqrt(9 / Math.abs(a)) || 3);
      var lo = h - span, hi = h + span;
      /* 横坐标范围必须盖住要标的点（两根 / 顶点 / 已知点），否则曲线会在 x 轴上方断掉 */
      dots.forEach(function (d) {
        if (!isFinite(d.x)) return;
        lo = Math.min(lo, d.x - 0.5);
        hi = Math.max(hi, d.x + 0.5);
      });
      var xr = f.xr || [Math.max(h - 9, lo), Math.min(h + 9, hi)];
      var arr = [];
      for (var i = 0; i <= 120; i++) {
        var x = xr[0] + (xr[1] - xr[0]) * i / 120;
        arr.push([x, a * (x - h) * (x - h) + k]);
      }
      addPath(arr);
    } else if (f.type === 'hyperbola') {
      var m = f.xr ? Math.abs(f.xr[1]) : 6;
      [-1, 1].forEach(function (sg) {
        var arr2 = [];
        for (var j = 0; j <= 48; j++) {
          var x2 = sg * (0.3 + (m - 0.3) * j / 48);
          arr2.push([x2, f.k / x2]);
        }
        addPath(arr2);
      });
    } else if (f.type === 'segment') {
      addPath([[f.x1, f.y1], [f.x2, f.y2]]);
    } else if (f.type === 'piece') {
      var arr3 = [];
      for (var t = 0; t <= 30; t++) { var x3 = f.t1 * t / 30; arr3.push([x3, f.k1 * x3 + f.b1]); }
      addPath(arr3);
      var arr4 = [];
      for (var u = 0; u <= 40; u++) { var x4 = f.t1 + f.t1 * 2 * u / 40; arr4.push([x4, f.k2 / x4]); }
      addPath(arr4);
    }

    var xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
    all.concat(dots).forEach(function (p) {
      if (!isFinite(p.x) || !isFinite(p.y)) return;
      xmin = Math.min(xmin, p.x); xmax = Math.max(xmax, p.x);
      ymin = Math.min(ymin, p.y); ymax = Math.max(ymax, p.y);
    });
    if (!isFinite(xmin)) return '';
    if (f.type === 'points') { xmin = Math.min(xmin, 0); xmax = Math.max(xmax, 0); ymin = Math.min(ymin, 0); ymax = Math.max(ymax, 0); }

    var xspan = Math.max(1, xmax - xmin), yspan = Math.max(1, ymax - ymin);
    xmin -= xspan * 0.08; xmax += xspan * 0.08;
    ymin -= yspan * 0.08; ymax += yspan * 0.08;

    function sx(x) { return PAD + (x - xmin) / (xmax - xmin) * (W - 2 * PAD); }
    function sy(y) { return H - PAD - (y - ymin) / (ymax - ymin) * (H - 2 * PAD); }

    var s = [];
    s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="题图">');
    s.push('<rect width="' + W + '" height="' + H + '" fill="#fbfcff" rx="10"/>');

    var step = niceStep(Math.max(xmax - xmin, ymax - ymin));
    var gx, gy;
    for (gx = Math.ceil(xmin / step) * step; gx <= xmax; gx += step) {
      s.push('<line x1="' + num(sx(gx)) + '" y1="' + PAD + '" x2="' + num(sx(gx)) + '" y2="' + (H - PAD) + '" stroke="#eef1f8"/>');
    }
    for (gy = Math.ceil(ymin / step) * step; gy <= ymax; gy += step) {
      s.push('<line x1="' + PAD + '" y1="' + num(sy(gy)) + '" x2="' + (W - PAD) + '" y2="' + num(sy(gy)) + '" stroke="#eef1f8"/>');
    }

    var x0 = (ymin < 0 && ymax > 0) ? sy(0) : (H - PAD);
    var y0 = (xmin < 0 && xmax > 0) ? sx(0) : PAD;
    s.push('<line x1="' + PAD + '" y1="' + num(x0) + '" x2="' + (W - PAD) + '" y2="' + num(x0) + '" stroke="#9aa3b5" stroke-width="1.2"/>');
    s.push('<line x1="' + num(y0) + '" y1="' + PAD + '" x2="' + num(y0) + '" y2="' + (H - PAD) + '" stroke="#9aa3b5" stroke-width="1.2"/>');
    s.push('<text x="' + (W - PAD + 2) + '" y="' + (num(x0) - 4) + '" font-size="11" fill="#6b7280">x</text>');
    s.push('<text x="' + (num(y0) + 5) + '" y="' + (PAD + 8) + '" font-size="11" fill="#6b7280">y</text>');
    s.push('<text x="' + (num(y0) - 10) + '" y="' + (num(x0) + 13) + '" font-size="10" fill="#9aa3b5">O</text>');

    for (gx = Math.ceil(xmin / step) * step; gx <= xmax; gx += step) {
      if (Math.abs(gx) < step / 2) continue;
      s.push('<text x="' + num(sx(gx)) + '" y="' + (num(x0) + 12) + '" font-size="9" fill="#9aa3b5" text-anchor="middle">' + num(gx) + '</text>');
    }
    for (gy = Math.ceil(ymin / step) * step; gy <= ymax; gy += step) {
      if (Math.abs(gy) < step / 2) continue;
      s.push('<text x="' + (num(y0) - 6) + '" y="' + (num(sy(gy)) + 3) + '" font-size="9" fill="#9aa3b5" text-anchor="end">' + num(gy) + '</text>');
    }

    ghosts.forEach(function (arr) {
      var d = arr.map(function (p, i) { return (i ? 'L' : 'M') + num(sx(p[0])) + ' ' + num(sy(p[1])); }).join(' ');
      s.push('<path d="' + d + '" fill="none" stroke="#b9c0cf" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round"/>');
    });
    paths.forEach(function (arr) {
      var d = arr.map(function (p, i) { return (i ? 'L' : 'M') + num(sx(p[0])) + ' ' + num(sy(p[1])); }).join(' ');
      s.push('<path d="' + d + '" fill="none" stroke="#3b6fe0" stroke-width="2.2" stroke-linecap="round"/>');
    });

    if (f.type === 'points') {
      if (f.rays) {
        dots.forEach(function (p) {
          s.push('<line x1="' + num(sx(0)) + '" y1="' + num(sy(0)) + '" x2="' + num(sx(p.x)) + '" y2="' + num(sy(p.y)) + '" stroke="#e37400" stroke-width="1.4" stroke-dasharray="4 4"/>');
        });
      } else if (!f.dashes) {
        var c = f.dots[0], c2 = f.dots[1];
        if (c && c2) {
          s.push('<line x1="' + num(sx(c[0])) + '" y1="' + num(sy(c[1])) + '" x2="' + num(sx(c2[0])) + '" y2="' + num(sy(c2[1])) + '" stroke="#e37400" stroke-width="1.4" stroke-dasharray="4 4"/>');
        }
      }
    }

    /* 虚线：|k| 面积题里从点向坐标轴作垂线 */
    (f.dashes || []).forEach(function (seg) {
      s.push('<line x1="' + num(sx(seg[0][0])) + '" y1="' + num(sy(seg[0][1])) + '" x2="' + num(sx(seg[1][0])) + '" y2="' + num(sy(seg[1][1])) + '" stroke="#e37400" stroke-width="1.4" stroke-dasharray="4 4"/>');
    });

    dots.forEach(function (p) {
      s.push('<circle cx="' + num(sx(p.x)) + '" cy="' + num(sy(p.y)) + '" r="3.6" fill="#e37400" stroke="#fff" stroke-width="1.2"/>');
      if (p.label) {
        s.push('<text x="' + num(sx(p.x) + 6) + '" y="' + num(sy(p.y) - 7) + '" font-size="10.5" fill="#a15c00" font-weight="600">' + p.label + '</text>');
      }
    });

    s.push('</svg>');
    return s.join('');
  }

  /* ---------- 自检：每个生成器跑 N 遍，正确解必须判对、错解必须判错 ---------- */
  function selfTest(n) {
    n = n || 120;
    var fails = [], count = 0;
    MODULES.forEach(function (m) {
      var cases = m.items ? m.items : m.kinds;
      cases.forEach(function (c) {
        for (var s = 1; s <= n; s++) {
          var q;
          try { q = m.items ? JSON.parse(JSON.stringify(c)) : c.gen(mulberry32(s * 7919 + 13)); }
          catch (e) { fails.push(c.id + ' 生成异常: ' + e.message); continue; }
          count++;
          var tag = (c.id || c.title) + '#' + s;
          if (!q.prompt || /undefined|NaN/.test(q.prompt)) fails.push(tag + ' 题干异常');
          if (q.fig) {
            var svg = svgFor(q);
            if (svg.indexOf('<svg') !== 0) fails.push(tag + ' 图象为空');
            else if (/NaN|undefined/.test(svg)) fails.push(tag + ' 图象含 NaN');
          }
          if (!q.fields || !q.fields.length) { fails.push(tag + ' 无字段'); continue; }
          q.fields.forEach(function (f) {
            if (f.type === 'num' && !isFinite(f.ans)) fails.push(tag + ' 答案非数字');
            if (f.type === 'choice' && !(f.ans >= 0 && f.ans < f.options.length)) fails.push(tag + ' 选项越界');
            if (f.type === 'set' && !Array.isArray(f.ans)) fails.push(tag + ' set 答案异常');
            if (f.type === 'expr') {
              if (!Array.isArray(f.ans)) fails.push(tag + ' expr 答案异常');
              else if (!f.tpl || f.tpl.split('{}').length - 1 !== f.ans.length) fails.push(tag + ' expr 模板与空数不一致');
            }
          });
          var right = q.fields.map(function (f) {
            return f.type === 'choice' ? f.ans : ((f.type === 'set' || f.type === 'expr') ? f.ans.slice() : f.ans);
          });
          if (!judge(q, right).ok) fails.push(tag + ' 正确解被判错');
          var wrong = q.fields.map(function (f) {
            if (f.type === 'choice') return (f.ans + 1) % f.options.length;
            if (f.type === 'set' || f.type === 'expr') return f.ans.map(function (x) { return x + 1; });
            return f.ans + 1;
          });
          if (judge(q, wrong).ok) fails.push(tag + ' 错误解被判对');
          /* expr 必须按空位顺序判分：前两个空互换后，只有「与所有允许排列数值上都不同」时才断言判错 */
          q.fields.forEach(function (f, fi) {
            if (f.type !== 'expr' || f.ans.length < 2) return;
            var free = f.free || [];
            if (free.indexOf(0) >= 0 && free.indexOf(1) >= 0) return;
            var perm = right.slice();
            perm[fi] = f.ans.slice();
            perm[fi][0] = f.ans[1]; perm[fi][1] = f.ans[0];
            var allowed = [f.ans.slice()];
            if (free.length) {
              allowed = permsOf(free).map(function (pp) {
                var arr = f.ans.slice();
                for (var z = 0; z < free.length; z++) arr[free[z]] = f.ans[pp[z]];
                return arr;
              });
            }
            var same = allowed.some(function (arr) { return arr.every(function (w, j) { return near(perm[fi][j], w, 1e-9); }); });
            if (!same && judge(q, perm).ok) fails.push(tag + ' expr 空位互换仍判对（应判错）');
          });
        }
      });
    });
    return { count: count, fails: fails };
  }

  /* =====================================================================
     今日任务：规则 + 当天固定题单（纯函数，可在 node 里单测）
     规则（页面「今日任务的规则」同步显示）：
     ① 一天一套：题由「日期种子」生成，同一天打开几次都是同一套，换天才换。
     ② 固定配比：基础快练 6 = 因式分解 2 + 解方程 2 + 轮换 2；
        写解析式 8 = 顶点式 2 + 主力 4 + 次主力 2；大题前两步 3；错题回炉按到期。
     ③ 主力轮换：6 类（顶点式→交点式→反比例→线段→分段→利润）按日期轮，6 天一轮全覆盖。
     ④ 弱项覆盖：最近 8 条写解析式记录里有错题，主力换成错题那一类。
     ⑤ 难度顺序：先易后难（因式分解 → 方程 → 轮换；顶点式 → 主力 → 次主力）。
     ⑥ 同一套内题干不重复。
     ===================================================================== */
  var WRITE_ROT = ['vertex', 'intercept', 'inverse', 'segment', 'piece', 'profit', 'arch', 'axis'];
  function daySeed(key) {
    var h = 2166136261, k = String(key);
    for (var i = 0; i < k.length; i++) { h ^= k.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function kindsOf(modId) {
    var m = moduleById(modId);
    return (m && m.kinds) ? m.kinds.map(function (x) { return x.id; }) : [];
  }
  function kindName(modId, id) {
    var m = moduleById(modId);
    if (m && m.kinds) for (var i = 0; i < m.kinds.length; i++) if (m.kinds[i].id === id) return m.kinds[i].name;
    return id;
  }
  function dayIndex(key) {
    var p = String(key).split('-');
    return Math.floor(Date.UTC(+p[0], (+p[1]) - 1, +p[2]) / 86400000);
  }
  /* 把 kinds 数组按「首次出现顺序」汇总成「因式分解 2 · 解方程 2 · 判别式 2」 */
  function mixText(modId, kinds) {
    var seen = [], cnt = {};
    kinds.forEach(function (id) { if (cnt[id] == null) { cnt[id] = 0; seen.push(id); } cnt[id]++; });
    return seen.map(function (id) { return kindName(modId, id) + ' ' + cnt[id]; }).join(' · ');
  }
  function planForDay(key, weakKind) {
    var seed = daySeed(key);
    /* 轮换顺序以 WRITE_ROT 为准（页面文案写的也是这个顺序），不是模块注册顺序 */
    var rot = WRITE_ROT.filter(function (id) { return kindsOf('write').indexOf(id) >= 0; });
    if (!rot.length) rot = kindsOf('write');
    var di = dayIndex(key);
    var main = (weakKind && rot.indexOf(weakKind) >= 0) ? weakKind : rot[((di % rot.length) + rot.length) % rot.length];
    var second = rot[(rot.indexOf(main) + 1) % rot.length];
    var dk = kindsOf('drill').filter(function (id) { return id !== 'factor' && id !== 'eq'; });
    var extra = dk.length ? dk[seed % dk.length] : 'eq';
    var drillKinds = ['factor', 'factor', 'eq', 'eq', extra, extra];
    var writeKinds = ['vertex', 'vertex', main, main, main, main, second, second];
    var drillNote = mixText('drill', drillKinds), writeNote = mixText('write', writeKinds);
    return {
      day: key, seed: seed, main: main, second: second, weak: !!(weakKind && rot.indexOf(weakKind) >= 0),
      drill: { n: 6, kinds: drillKinds, note: drillNote },
      write: { n: 8, kinds: writeKinds, note: writeNote },
      entry: { n: 3, kinds: [] },
      wrong: { n: 1 },
      note: '基础快练 6：' + drillNote + '；写解析式 8：' + writeNote + '；大题前两步 3；错题回炉按到期。'
    };
  }
  /* 同一套内的去重键：题干 + 选项（选择题题干固定，靠选项区分） */
  function qKey(q) {
    return q.prompt + '|' + JSON.stringify(q.fields);
  }
  /* 当天固定题单：同 key 同 plan 必然同一套；同一套内题干不重复 */
  function dailyQueue(modId, plan) {
    var p = plan[modId] || plan.write;
    var out = [];
    if (modId === 'entry') {
      var items = moduleById('entry').items.map(function (x) { return JSON.parse(JSON.stringify(x)); });
      var r = mulberry32(plan.seed ^ 0x5bf03635);
      var r2 = mulberry32(plan.seed ^ 0x1f2e3d4c);
      items = items.map(function (x) { return { x: shuffleChoices(x, r2), k: r() }; })
        .sort(function (a, b) { return a.k - b.k; })
        .map(function (o) { return o.x; });
      return items.slice(0, p.n);
    }
    var used = {};
    for (var i = 0; i < p.n; i++) {
      var kindId = p.kinds[i] || p.kinds[0];
      var q = null, guard = 0;
      do {
        q = gen(modId, kindId, (plan.seed + i * 7919 + guard * 104729) >>> 0);
        guard++;
      } while (used[qKey(q)] && guard < 12);
      used[qKey(q)] = 1;
      out.push(q);
    }
    return out;
  }

  return {
    VERSION: VERSION, DAY: DAY,
    modules: MODULES, moduleById: moduleById,
    planForDay: planForDay, dailyQueue: dailyQueue, daySeed: daySeed, kindName: kindName,
    gen: gen, judge: judge, ansText: ansText, svgFor: svgFor, cropFig: cropFig,
    parseNum: parseNum, near: near, frac: frac, nice: nice,
    selfTest: selfTest
  };
})();
</script>

<script id="review">
/* 共享错题回炉内核（ADR-0010）
 *
 * 职责边界：只管错题条目的「调度字段」与状态转移，不碰 DOM、不碰 localStorage、
 * 不认识任何科目。题目快照（prompt/fields/explain…）、错题键生成、最短用时阈值
 * 都由各科自己提供，通过参数传进来。
 *
 * 调度字段：
 *   ts        首次入库时间戳
 *   due       下次到期时间戳（绝对毫秒）
 *   n         累计答错次数（统计/合并用，不参与间隔计算）
 *   lvl       回炉档位 1..4 → PLAN[1,3,7,14] 天
 *   okStreak  到期后连续有效答对次数 0/1/2，到 2 才移出
 *   lastOkAt  最近一次有效答对时间戳
 *   lastAt    最近一次作答时间戳（无论对错）
 *
 * 规则（任务卡 docs/plans/错题回炉规则统一-2026-11-19.md）：
 *   答错       → n+1、lvl 回退一档、连对清零、due = now + gap(lvl)*DAY
 *   有效答对   → 连对 +1；满 2 返回 'mastered'（调用方移出）；否则 lvl 进一档并重排 due
 *   无效答对   → 连对清零、重排 due；不惩罚 n/lvl
 *   跳过本次   → due 推到一天后，其余不变
 *   due 永远由「本次作答时间戳 + 新档位间隔」算出，不用日历天数、不累计欠账。
 *
 * 历史复盘：everWrong(recs, wrongMap) 只从作答流水聚合，不看调度状态；
 *   掌握后删的是 DB.wrong 条目，recs 永久留档，所以整学期「曾经错过的题」查得到。
 */
var LT_REVIEW = (function () {
  var DAY = 86400000;
  var PLAN = [1, 3, 7, 14];
  var KEEP = 2;

  function gap(lvl) { return PLAN[Math.min(PLAN.length, Math.max(1, lvl | 0)) - 1]; }

  /* 到期判断：只有due到了才允许计入连对（未到期答对不算，防同日连刷） */
  function isDue(w, now) {
    if (!w || typeof w.due !== 'number') return false;
    return w.due <= (now == null ? Date.now() : now);
  }

  /* 旧条目迁移：补齐新字段；due 原样保留，不打乱用户已有计划。
     返回 true 表示有字段被补，调用方据此决定是否保存。 */
  function migrate(w, now) {
    if (!w) return false;
    now = now == null ? Date.now() : now;
    var changed = false;
    if (typeof w.n !== 'number' || w.n < 1) { w.n = 1; changed = true; }
    if (typeof w.lvl !== 'number' || w.lvl < 1 || w.lvl > PLAN.length) {
      w.lvl = Math.min(PLAN.length, Math.max(1, w.n || 1));
      changed = true;
    }
    if (typeof w.okStreak !== 'number') { w.okStreak = 0; changed = true; }
    if (typeof w.lastOkAt !== 'number') { w.lastOkAt = 0; changed = true; }
    if (typeof w.ts !== 'number') { w.ts = now; changed = true; }
    if (typeof w.lastAt !== 'number') { w.lastAt = w.ts || now; changed = true; }
    if (typeof w.due !== 'number') { w.due = now + gap(w.lvl) * DAY; changed = true; }
    return changed;
  }

  /* 新错题条目的调度字段（各科把它和题目快照合并后存入 DB.wrong[k]） */
  function newEntry(now) {
    now = now == null ? Date.now() : now;
    return {
      ts: now, due: now + PLAN[0] * DAY, n: 1, lvl: 1,
      okStreak: 0, lastOkAt: 0, lastAt: now
    };
  }

  /* 答错：回退一档、连对清零、按当前时间戳重排到期。就地改 w 并返回它。
     首次入库的裸条目（各科 new 出的对象没有 n）按 n=1/lvl=1 处理——
     不能先 migrate 补 n=1 再 +1，否则首次答错就被记成错过 2 次。 */
  function onWrong(w, now) {
    now = now == null ? Date.now() : now;
    var fresh = typeof w.n !== 'number';
    migrate(w, now);
    if (fresh) {
      w.n = 1;
      w.lvl = 1;
    } else {
      w.n = (w.n || 1) + 1;
      w.lvl = Math.max(1, w.lvl - 1);
    }
    w.okStreak = 0;
    w.lastAt = now;
    w.due = now + gap(w.lvl) * DAY;
    return w;
  }

  /* 答对：由内核自己判定「有效」（不信任调用方的到期结论）。
     sig = { sec, minSec, hint, fixed }
       sec    本次作答用时（秒）
       minSec 本科/本题型的最短有效用时；调用方不传则 0（只看到期与提示）
       hint   是否看过提示/答案
       fixed  是否是订正提交
     返回：
       'mastered' 连对已满 2 次 → 调用方把该题从 DB.wrong 删除
       'streak'   有效但未满 2 次 → 连对 +1，已重排 due
       'invalid'  无效答对 → 连对清零，已重排 due
       'none'     错题库里没有该题
  */
  function onPass(w, sig, now) {
    if (!w) return 'none';
    now = now == null ? Date.now() : now;
    migrate(w, now);
    sig = sig || {};
    var sec = Number(sig.sec) || 0;
    var minSec = Number(sig.minSec) || 0;
    var valid = isDue(w, now) && sec >= minSec && !sig.hint && !sig.fixed;
    w.lastAt = now;
    if (!valid) {
      w.okStreak = 0;
      w.due = now + gap(w.lvl) * DAY;
      return 'invalid';
    }
    w.okStreak = (w.okStreak || 0) + 1;
    w.lastOkAt = now;
    if (w.okStreak >= KEEP) return 'mastered';
    w.lvl = Math.min(PLAN.length, w.lvl + 1);
    w.due = now + gap(w.lvl) * DAY;
    return 'streak';
  }

  /* 跳过本次（替代原「已掌握」手动删除）：只把到期推到一天后，其余不变（连对进度保留） */
  function skip(w, now) {
    if (!w) return false;
    now = now == null ? Date.now() : now;
    migrate(w, now);
    w.due = now + DAY;
    return true;
  }

  /* 取到期题：按 due 升序（最早到期优先），cap 可选 */
  function dueList(wrongMap, now, cap) {
    now = now == null ? Date.now() : now;
    var all = Object.keys(wrongMap || {}).map(function (k) {
      var w = wrongMap[k];
      migrate(w, now);
      return w;
    }).filter(function (w) { return isDue(w, now); });
    all.sort(function (a, b) { return a.due - b.due; });
    return cap ? all.slice(0, cap) : all;
  }

  /* 历史错题清单（期末复盘用）：从作答流水 recs 聚合「曾经错过」的题。
     recs 里每笔作答都带 ok/qid/ts，答错事件是永久留档的——连对达标后只删 DB.wrong
     那一条待复习条目，recs 不动，所以这里能还原整学期的错题史。
     wrongMap 只用来判「现在还在不在错题本」：新规则下移出错题本的唯一途径是
     连对 2 次有效答对，所以不在本 = 已真掌握（跳过本次不删，不会误判）。
     返回按「错次降序、最近错的时间降序」排列，每项：
       key/label/mod/kind/wrong/firstWrongAt/lastWrongAt/lastOkAt/okCount/inBook */
  function everWrong(recs, wrongMap) {
    var book = {};
    Object.keys(wrongMap || {}).forEach(function (k) {
      var w = wrongMap[k];
      if (w && w.qid) book[w.qid] = true;
    });
    var map = {};
    (recs || []).forEach(function (r) {
      if (!r || (r.ok !== true && r.ok !== false)) return;
      var k = r.qid || [r.mod || '', r.kind || '', r.kn || r.title || r.prompt || ''].join('|').slice(0, 120);
      if (!k) return;
      var e = map[k];
      if (!e) {
        e = map[k] = {
          key: k, label: String(r.kn || r.title || r.prompt || r.kind || k),
          mod: r.mod || '', kind: r.kind || '',
          wrong: 0, okCount: 0, firstWrongAt: 0, lastWrongAt: 0, lastOkAt: 0, inBook: false
        };
      }
      var t = Number(r.ts) || 0;
      if (r.ok === false) {
        e.wrong++;
        if (!e.firstWrongAt || t < e.firstWrongAt) e.firstWrongAt = t;
        if (t > e.lastWrongAt) e.lastWrongAt = t;
      } else {
        e.okCount++;
        if (t > e.lastOkAt) e.lastOkAt = t;
      }
    });
    var out = Object.keys(map).map(function (k) {
      var e = map[k];
      e.inBook = !!book[e.key];
      return e;
    }).filter(function (e) { return e.wrong > 0; });
    out.sort(function (a, b) {
      return (b.wrong - a.wrong) || (b.lastWrongAt - a.lastWrongAt);
    });
    return out;
  }

  /* 统一日期文本 YYYY-MM-DD（本地时区），报告页列表共用 */
  function dayText(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  /* 文案：错题本/报告页统一显示到期状态与连对进度 */
  function statusText(w, now) {
    if (!w) return '';
    now = now == null ? Date.now() : now;
    if (isDue(w, now)) {
      return w.okStreak ? '已到期 · 待确认 ' + w.okStreak + '/' + KEEP : '已到期';
    }
    var days = Math.ceil((w.due - now) / DAY);
    return '还有 ' + days + ' 天';
  }

  var api = {
    DAY: DAY, PLAN: PLAN, KEEP: KEEP, gap: gap,
    isDue: isDue, migrate: migrate, newEntry: newEntry,
    onWrong: onWrong, onPass: onPass, skip: skip,
    dueList: dueList, statusText: statusText,
    everWrong: everWrong, dayText: dayText
  };
  if (typeof window !== 'undefined') window.__ltReview = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();
</script>

<script id="merge">
/* 事件并集合并 · 两族共用（化学内核族 / 物理数学脚手架族）
 * ============================================================
 * 唯一合并实现：页面导入按钮与云同步都调它，不许另写一套（ADR-0007 决定 4）。
 *
 * 去重键 (ts, mod, kind, ident)，ident = prompt[:40] || kn：
 *   - 化学内核族 recs 写 prompt、无 kn（kernel.js:280）
 *   - 物理/数学脚手架族与历史导出 recs 写 kn、无 prompt（train.ui.js:790/683）
 *   取两者中有的那个，避免把脚手架族第 4 维压成空串。
 *
 * 合并不求和：并集 + 各自保留；设备态 days/lastRound/dayPlan/sess 不进载体。
 * 本文件既是 node 可 import 的 ESM，也是 build.mjs 内联进产物的源（去掉 export 行）。
 */

/** 题目标识：prompt 前 40 字优先，回退 kn，都没有则空串 */
function pickIdent(r) {
  if (!r || typeof r !== 'object') return '';
  var p = String(r.prompt || '').slice(0, 40);
  if (p) return p;
  return String(r.kn || '');
}

/** 去重键：时间戳 + 模块 + 题型 + 题目标识 */
function recSig(r) {
  if (!r || typeof r !== 'object') return '';
  return [r.ts, r.mod, r.kind, pickIdent(r)].join('|');
}

/** 合并两份 DB：recs 取并集，wrong 字段互补，meta 取 max/最早，丢弃设备态 */
function mergeRecords(base, incoming) {
  var out = { v: 1, recs: [], wrong: {}, meta: {} };
  var seen = Object.create(null);
  function addRec(r) {
    if (!r || typeof r !== 'object') return;
    var k = recSig(r);
    if (seen[k]) return;
    seen[k] = 1;
    out.recs.push(r);
  }
  ((base && base.recs) || []).forEach(addRec);
  ((incoming && incoming.recs) || []).forEach(addRec);
  out.recs.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
  /* 不截断 recs：整学期作答是期末复盘（everWrong）的原始依据，砍掉最老记录会丢历史。
     单条约 200 B，几千条在 localStorage 5 MB 配额内；与 kernel.js 的提交段口径一致。 */

  var bw = (base && base.wrong) || {}, iw = (incoming && incoming.wrong) || {};
  Object.keys(bw).forEach(function (k) { if (bw[k]) out.wrong[k] = Object.assign({}, bw[k]); });
  Object.keys(iw).forEach(function (k) {
    var b = iw[k];
    if (!b) return;
    var a = out.wrong[k];
    if (!a) { out.wrong[k] = Object.assign({}, b); return; }
    var merged = Object.assign({}, a);
    Object.keys(b).forEach(function (f) { if (merged[f] == null || merged[f] === '') merged[f] = b[f]; });
    merged.ts = Math.min(a.ts || Infinity, b.ts || Infinity);
    merged.due = Math.min(a.due || Infinity, b.due || Infinity);
    merged.n = Math.max(a.n || 1, b.n || 1);
    out.wrong[k] = merged;
  });

  var bm = (base && base.meta) || {}, im = (incoming && incoming.meta) || {};
  var bc = typeof bm.created === 'number' ? bm.created : Infinity;
  var ic = typeof im.created === 'number' ? im.created : Infinity;
  var created = Math.min(bc, ic);
  out.meta.round = Math.max(bm.round || 0, im.round || 0);
  out.meta.lastKind = Object.assign({}, bm.lastKind || {}, im.lastKind || {});
  if (created !== Infinity) out.meta.created = created;
  return out;
}
window.__ltMerge = { pickIdent: pickIdent, recSig: recSig, mergeRecords: mergeRecords };
</script>

<script id="sync">
var LT_SUBJECT = "数学";
/* 云同步编排 · 纯函数（网络 I/O 由页面薄适配层负责）
 * ============================================================
 * 真源仍是各设备浏览器（GLOSSARY 同步载体）；本模块只决定「拉全部后怎么合、写回什么」。
 * 网络适配（GitHub Contents API + PAT + sha 乐观锁）不在此处，本机测试覆盖不到，
 * 由页面侧 sync-adapter 把快照读写接到 fetch，编排保持可测。
 */

/**
 * 由本机 DB 生成写进载体的快照：只带 recs/wrong/meta，打上 deviceId，丢弃设备态。
 */
function carrierSnapshot(deviceId, db, subject) {
  var merged = mergeRecords(db, { v: 1, recs: [], wrong: {}, meta: {} });
  return {
    v: 1,
    deviceId: deviceId,
    subject: subject || subjectFromId(deviceId) || '',
    recs: merged.recs,
    wrong: merged.wrong,
    meta: merged.meta
    /* days / lastRound / dayPlan / sess 故意不带上 */

(function () {

        } catch (e) {

        }

    }
  };

        h('li', null, '同一套内题干不重复；错题按 1/3/7/14 天档位回炉，到期后连续 2 次答对才算掌握（看提示/秒答不算）；跳过几天不累计欠账。'),
        h('li', null, '「本周错题」是临时项目（一周一换）：本周卷子里做错/不会的题各练一种同类变式，随时可点，不计入上面 4 个任务。')
      )

    var stats = h('div', { class: 'grid', style: 'margin-top:12px' },

      statCard('错题待回炉', window.__ltReview.dueList(DB.wrong).length)
    );
    app.appendChild(stats);

    var mods = h('div', { class: 'grid', style: 'margin-top:16px' });
    MT.modules.forEach(function (m) {
      var card = h('div', { class: 'module' },
        h('div', { class: 'mh' }, h('span', null, m.icon), h('b', null, m.name)),
        h('div', { class: 'desc' }, m.desc),
        h('div', { class: 'kinds' }, (m.kinds || m.items.map(function (x) { return { name: x.title }; })).slice(0, 5).map(function (k) { return h('span', { class: 'kind' }, k.name); })),
        h('div', { class: 'row', style: 'margin-top:auto' },
          h('button', { class: 'btn btn-primary btn-sm', onclick: function () { startSession(m.id, null, m.id === 'entry' ? 3 : 8); } }, '开始'),
          h('button', { class: 'btn btn-sm', onclick: function () { startExample(m.id, lastKindOf(m.id)); } }, '看例题')
        )
      );
      mods.appendChild(card);
    });
    app.appendChild(mods);

    var note = h('div', { class: 'card', style: 'margin-top:16px' },
      h('div', { class: 'small' }, h('b', null, '怎么用')),
      h('ul', { class: 'small muted', style: 'margin:6px 0 0;padding-left:20px' },
        h('li', null, '不用等一个练熟再下一个：四个每天都做，顺序就是上面 1→2→3→4。'),
        h('li', null, '不会就点「提示」，提示不扣分，但会记录。'),
        h('li', null, '答错要订正：照着解析把正确答案再填一遍，对了才能下一题。'),
        h('li', null, '第一次做某类题，先点「例题」看一遍完整解答。'),
        h('li', null, '直接打字：整数、小数、1/2 都行；负号写分子前、分母前都算对。'),
        h('li', null, '打草稿点「草稿纸」；想手写就用系统输入法的手写模式。'),
        h('li', null, '时间不够：砍基础快练，保「写解析式 + 大题前两步」。')
      )
    );
    app.appendChild(note);
  }
  function statCard(label, val) { return h('div', { class: 'stat' }, h('span', null, label), h('b', null, String(val))); }

  /* ---------- 模块首页 ---------- */
  function renderModule() {
    var m = MT.moduleById(S.view);
    if (!m) { go('today'); return; }
    var head = h('div', { class: 'card' },
      h('div', { class: 'row' }, h('h2', { style: 'margin:0;font-size:19px' }, m.icon + ' ' + m.name)),
      h('p', { class: 'muted small', style: 'margin:6px 0 0' }, m.desc)
    );
    app.appendChild(head);
    /* 分组抽象：kinds（生成器题型）和 items（固定得分点）都按 group 切板块。
       这样大题前两步也能看到全部题型、单独练某一题、按板块随机练。 */
    var isItems = !m.kinds;
    var cards = m.kinds || m.items.map(function (it) {
      return { id: it.id, name: it.title, group: it.group || '' };
    });
    var groups = [], byGroup = {};
    cards.forEach(function (k) {
      var g = k.group || '';
      if (!byGroup[g]) { byGroup[g] = []; groups.push(g); }
      byGroup[g].push(k);
    });
    var showGroupHead = groups.length > 1 || (groups.length === 1 && groups[0] !== '');
    function randomBtn(arr) {
      return h('button', { class: 'btn btn-sm btn-random', onclick: function () { startGroupRandom(m.id, arr); } }, '当前板块随机题练习');
    }
    head.appendChild(h('div', { class: 'row', style: 'margin-top:12px' },
      h('button', { class: 'btn btn-primary', onclick: function () { startSession(m.id, null, m.id === 'entry' ? 3 : 8); } }, '开始一轮'),
      h('button', { class: 'btn', onclick: function () { startExample(m.id, lastKindOf(m.id)); } }, '先看例题'),
      (!showGroupHead) ? randomBtn(cards) : null
    ));
    head.appendChild(h('div', { class: 'small muted', style: 'margin-top:8px' },
      isItems
        ? '「开始一轮」从全部得分点混抽 3 个；每个得分点可单独练 1 题；板块标题右侧按该板块每个得分点各出 1 题。'
        : ('「开始一轮」按题型混抽（每次不同）；每个题型可以单独连做 3 题（专项）。' +
           (showGroupHead ? '板块标题右侧「当前板块随机题练习」按该板块题型各出 1~2 题。' : '「当前板块随机题练习」按本页题型各出 1~2 题。'))
    ));
    var list = h('div', { style: 'margin-top:4px' });
    groups.forEach(function (g) {
      if (showGroupHead && g) list.appendChild(h('div', { class: 'gsec' },
        h('b', null, g),
        h('span', null, byGroup[g].length + (isItems ? ' 个得分点' : ' 个题型')),
        h('span', null, isItems ? '每个得分点 1 题' : '每种 1~2 题'),
        randomBtn(byGroup[g])
      ));
      var grid = h('div', { class: 'grid' });
      byGroup[g].forEach(function (k) {
        var st = kindStat('new', m.id, k.id);
        grid.appendChild(h('div', { class: 'module' },
          h('div', { class: 'mh' }, h('b', null, k.name)),
          h('div', { class: 'desc small muted' }, st.n ? '练过 ' + st.n + ' 题 · 正确率 ' + pct(st.ok, st.n) + '%' : '还没练过'),
          h('div', { class: 'row', style: 'margin-top:auto' },
            h('button', { class: 'btn btn-primary btn-sm', onclick: function () { startSession(m.id, k.id, isItems ? 1 : 3); } }, isItems ? '练这个得分点' : '专项 3 题'),
            h('button', { class: 'btn btn-sm', onclick: function () { startExample(m.id, k.id); } }, '看例题')
          )
        ));
      });
      list.appendChild(grid);
    });
    app.appendChild(list);
  }
  /* 这个模块最近练过的题型（没有就返回 null，例题退化为随机） */
  function lastKindOf(mod) {
    var lk = DB.meta && DB.meta.lastKind;
    return (lk && lk[mod]) || null;
  }
  function kindStat(mode, mod, kind) {
    var rs = DB.recs.filter(function (r) { return r.mode === mode && r.mod === mod && r.kind === kind; });
    return { n: rs.length, ok: rs.filter(function (r) { return r.ok; }).length };
  }

  /* ---------- 练习 ---------- */
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function startSession(mod, kind, count) {
    if (mod === 'wrong') { startWrong(); return; }   /* 兜底：回炉走回炉入口 */
    S.mode = 'new';
    S.example = false;
    S.back = null;
    var n = count || 8;
    var sess = { mod: mod, kind: kind, total: n, done: 0, right: 0, t0: Date.now() };
    if (mod === 'entry') {
      if (kind) {
        /* 单个得分点专项：固定题只有一道，练 1 题就够，不重复三遍同样的题 */
        sess.queue = [MT.gen('entry', kind, (Math.random() * 1e9) | 0)];
        sess.total = 1;
      } else {
        var items = MT.moduleById('entry').items.map(function (x) {
          var c = JSON.parse(JSON.stringify(x)); c.mod = 'entry'; c.kind = x.id; return c;
        });
        sess.queue = shuffle(items).slice(0, n);
        sess.total = sess.queue.length;
      }
    }
    S.sess = sess;
    S.view = 'practice';
    nextQuestion();
  }
  /* 当前板块随机题：每种题型先保证 1 题，再掷骰子加 1 题（1~2 次），题数 = 板块题型数 ~ 2 倍。
     队列现场生成，「再来一轮」走 sess.replay 重放同一板块规则，不退化成全场混抽。 */
  function startGroupRandom(mod, kinds) {
    if (!kinds || !kinds.length) { startSession(mod, null, 8); return; }
    var isItems = !MT.moduleById(mod).kinds;   /* 大题前两步是固定得分点：每种只出 1 题，避免同题重复 */
    var pool = [];
    kinds.forEach(function (k) {
      pool.push(k.id);
      if (!isItems && Math.random() < 0.5) pool.push(k.id);
    });
    var ids = shuffle(pool), seen = {}, qs = [];
    ids.forEach(function (id) {
      var q, key, tries = 0;
      do {
        q = MT.gen(mod, id, (Math.random() * 1e9) | 0);
        key = id + '|' + String(q.prompt);
        tries++;
      } while (seen[key] && tries < 6);   /* 同题型出两遍时，尽量不撞同一题干 */
      seen[key] = true;
      qs.push(q);
    });
    S.mode = 'new';
    S.example = false;
    S.back = null;
    var sess = { mod: mod, kind: null, total: qs.length, done: 0, right: 0, t0: Date.now(),
      queue: qs, groupLabel: '本板块 ' + kinds.length + (isItems ? ' 个得分点 · 各 1 题' : ' 个题型 · 每种 1~2 题') };
    sess.replay = function () { startGroupRandom(mod, kinds); };
    S.sess = sess;
    S.view = 'practice';
    nextQuestion();
  }
  /* 今日任务：用当天固定题单开一轮（不是现场随机） */
  function startDaily(modId) {
    S.back = null;
    var plan = dayPlan();
    var qs = MT.dailyQueue(modId, plan);
    S.mode = 'new';
    S.example = false;
    S.sess = { mod: modId, kind: null, total: qs.length, done: 0, right: 0, t0: Date.now(), queue: qs, daily: true };
    S.view = 'practice';
    nextQuestion();
  }
  /* 弱项：最近 8 条写解析式记录里，最后一次错的题型 */
  function weakKind() {
    var ws = DB.recs.filter(function (r) { return r.mod === 'write'; }).slice(-8);
    for (var i = ws.length - 1; i >= 0; i--) if (!ws[i].ok) return ws[i].kind;
    return null;
  }
  function startWrong() {
    S.example = false;   /* 例题页残留标记必须清掉，否则回炉会显示例题 */
    S.back = null;
    /* 坏条目（缺 fields 的快照，多半是旧版本或云同步写坏）不能拿去渲染，先清掉，
       否则点「错题回炉」会直接 Cannot read properties of undefined */
    var bad = 0;
    Object.keys(DB.wrong).forEach(function (k) {
      var w = DB.wrong[k];
      if (!w || !Array.isArray(w.fields) || !w.fields.length) { delete DB.wrong[k]; bad++; }
    });
    if (bad) save();
    var now = Date.now();
    var due = window.__ltReview.dueList(DB.wrong, now);
    if (!due.length) {
      var all = Object.keys(DB.wrong).length;
      alert(all ? '错题本里有 ' + all + ' 道，但还没到期（按 1/3/7/14 天档位回炉，到期后连对 2 次才算掌握）。今天先练新的。'
        : (bad ? '有 ' + bad + ' 条错题记录已损坏，已自动清理，现在错题本是空的。' : '错题本是空的，先做几题吧。'));
      return;
    }
    S.mode = 'wrong';
    S.sess = { mod: 'wrong', kind: null, total: Math.min(due.length, 5), done: 0, right: 0, skipped: 0, t0: Date.now(), queue: due };
    S.view = 'practice';
    nextQuestion();
  }
  function nextQuestion() {
    var s = S.sess;
    if (s.done >= s.total) { S.view = 'summary'; render(); return; }
    if (S.mode === 'wrong') {
      S.q = s.queue[s.done];
    } else if (s.queue) {
      S.q = s.queue[s.done];
    } else {
      S.q = MT.gen(s.mod, s.kind, (Math.random() * 1e9) | 0);
    }
    S.res = null; S.answered = false; S.choice = {}; S.hint = false; S.draft = null; S.lastVals = null; S.t0 = Date.now();
    S.scratch = false;
    S.fix = null;
    render();
  }

  /* 例题：先看一个完整解答（题目 → 答案 → 怎么想 → 图），再开始练 */
  function startExample(mod, kind) {
    if (!MT.moduleById(mod)) mod = 'drill';   /* 兜底：未知模块用基础快练，不抛错 */
    S.example = true;
    S.mode = 'new';
    S.sess = { mod: mod, kind: kind, total: 8, done: 0, right: 0, t0: Date.now() };
    S.q = MT.gen(mod, kind, (Math.random() * 1e9) | 0);
    S.res = null; S.answered = false; S.choice = {}; S.hint = false;
    S.fix = null; S.draft = null; S.lastVals = null; S.t0 = Date.now();
    S.view = 'practice';
    render();
  }
  function renderExample() {
    var q = S.q, s = S.sess;
    app.appendChild(h('div', { class: 'row', style: 'margin-bottom:8px' },
      h('span', { class: 'pill' }, '例题'),
      h('span', { class: 'small muted' }, q.title || ''),
      h('span', { class: 'grow' }),
      h('span', { class: 'small muted' }, '先看懂，再开始练')
    ));
    var card = h('div', { class: 'card' });
    var figEx = figOf(q);
    card.appendChild(h('div', { class: 'qbody', html: fracify(q.prompt) }));
    if (figEx && figEx.need) {
      card.appendChild(h('div', { class: 'figcap' }, figEx.cap || '题图（答题时看这张）'));
      card.appendChild(h('div', { class: 'figbox', html: MT.svgFor({ fig: figEx }) }));
    }
    var ansBox = h('div', { class: 'fb good', style: 'margin-top:14px' });
    ansBox.appendChild(h('div', { class: 'ftitle' }, '答案'));
    var ul = h('ul');
    q.fields.forEach(function (f) {
      ul.appendChild(h('li', { html: (f.label ? escLt(f.label) + ' ' : '') + fracify(MT.ansText(f)) }));
    });
    ansBox.appendChild(ul);
    card.appendChild(ansBox);
    var exBox = h('div', { class: 'fb', style: 'margin-top:10px' });
    exBox.appendChild(h('div', { class: 'ftitle' }, '怎么想'));
    (q.explain || []).forEach(function (line) { exBox.appendChild(h('div', { class: 'small', html: fracify(line) })); });
    card.appendChild(exBox);
    if (figEx && !figEx.need) {
      card.appendChild(h('div', { class: 'figcap' }, figEx.cap || '图象'));
      card.appendChild(h('div', { class: 'figbox', html: MT.svgFor({ fig: figEx }) }));
    }
    card.appendChild(h('div', { class: 'row', style: 'margin-top:14px' },
      h('button', { class: 'btn btn-primary', onclick: function () {
        if (S.back) {
          /* 从练习页点进来的：回到刚才那题，别把今日题单丢掉 */
          var b = S.back; S.back = null;
          S.q = b.q; S.sess = b.sess; S.draft = b.draft; S.choice = b.choice || {}; S.hint = !!b.hint;
          S.res = null; S.answered = false; S.fix = null; S.example = false;
          S.t0 = Date.now();   /* 看例题的时间不算进这题的用时，否则报告里的「平均用时」全被撑大 */
          S.view = 'practice'; render();
          return;
        }
        startSession(s.mod, s.kind, s.mod === 'entry' ? 3 : 8);
      } }, S.back ? '看懂了，回到刚才那题' : '看懂了，开始练'),
      h('button', { class: 'btn', onclick: function () { startExample(s.mod, s.kind); } }, '换一道')
    ));
    app.appendChild(card);
  }

  function renderPractice() {
    if (S.example) { renderExample(); return; }
    var q = S.q, s = S.sess;
    if (!q) { go('today'); return; }
    var head = h('div', { class: 'row', style: 'margin-bottom:8px' },
      h('span', { class: 'pill' }, S.mode === 'wrong' ? '错题回炉' : (MT.moduleById(s.mod).name + (s.groupLabel ? ' · ' + s.groupLabel : ''))),
      h('span', { class: 'small muted' }, (q.title || '')),
      h('span', { class: 'grow' }),
      h('span', { class: 'small muted' }, Math.min(s.done + (S.answered ? 0 : 1), s.total) + ' / ' + s.total)
    );
    app.appendChild(head);
    var prog = h('div', { class: 'progress' }, h('i', { style: 'width:' + (s.done / s.total * 100) + '%' }));
    app.appendChild(prog);

    var card = h('div', { class: 'card', style: 'margin-top:12px' });
    card.appendChild(h('div', { class: 'qhead' },
      h('span', { class: 'pill' }, q.noLabel ? q.noLabel : (q.no ? qnoLabel(q.no) : (q.mod === 'entry' ? '得分点' : '新题'))),
      q.kp ? h('span', { class: 'small muted' }, q.kp.join(' · ')) : null
    ));
    card.appendChild(h('div', { class: 'qbody', html: fracify(q.prompt) }));
    var figP = figOf(q);
    if (figP && figP.need) {
      card.appendChild(h('div', { class: 'figcap' }, figP.cap || '题图（答题时看这张）'));
      card.appendChild(h('div', { class: 'figbox', html: MT.svgFor({ fig: figP }) }));
    }

    q.fields.forEach(function (f, i) {
      if (f.type === 'choice') {
        f.options.forEach(function (opt, oi) {
          var cls = 'opt';
          if (S.answered) { if (oi === f.ans) cls += ' ok'; else if (S.choice[i] === oi) cls += ' bad'; }
          else if (S.choice[i] === oi) cls += ' sel';
          card.appendChild(h('button', {
            class: cls, onclick: function () {
              if (S.answered) return;
              S.choice[i] = oi;
              S.draft = readDraft();   /* 重渲染前先存草稿，已填数字不丢 */
              render();
            }
          }, String.fromCharCode(65 + oi) + '. ' + opt));
        });
      } else if (f.type === 'expr') {
        var ewrap = h('div', { class: 'field' }, h('span', { class: 'lbl' }, f.label + '：'));
        var erow = h('div', { class: 'exprline' });
        var eparts = String(f.tpl || 'y = {}').split('{}');
        eparts.forEach(function (seg, si) {
          if (si > 0) erow.appendChild(h('input', {
            class: 'fone expr-slot', id: 'in' + i + '_' + (si - 1) + '_n', value: draftAt(i, si - 1),
            inputmode: 'text', autocomplete: 'off', spellcheck: 'false', placeholder: '?'
          }));
          if (seg) erow.appendChild(h('span', { class: 'exprtxt' }, seg));
        });
        ewrap.appendChild(erow);
        if (S.answered) ewrap.appendChild(h('span', { class: 'unit', style: 'color:' + (S.res.res[i].ok ? 'var(--ok)' : 'var(--bad)') }, S.res.res[i].ok ? '✓' : '✗'));
        card.appendChild(ewrap);
      } else if (f.type === 'set') {
        var wrap = h('div', { class: 'field' }, h('span', { class: 'lbl' }, f.label + '：'));
        for (var j = 0; j < nSlots(f); j++) {
          wrap.appendChild(numInput('in' + i + '_' + j, draftAt(i, j), S.answered ? (S.res.res[i].ok ? 'ok' : 'bad') : ''));
        }
        card.appendChild(wrap);
      } else {
        card.appendChild(h('div', { class: 'field' },
          h('span', { class: 'lbl' }, f.label),
          numInput('in' + i, draftAt(i), S.answered ? (S.res.res[i].ok ? 'ok' : 'bad') : ''),
          f.unit ? h('span', { class: 'unit' }, f.unit) : null
        ));
      }
    });

    if (!S.answered) {
      card.appendChild(h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', { class: 'btn btn-ghost btn-sm', onclick: function () { S.draft = readDraft(); S.scratch = !S.scratch; render(); } }, S.scratch ? '收起草稿' : '草稿纸'),
        h('button', { class: 'btn btn-sm', onclick: function () {
          /* 例题必须和当前这题同题型：今日任务/开始一轮的 sess.kind 是 null，要用当前题的 kind */
          var mod = S.sess.mod === 'wrong' ? ((S.q && S.q.mod) || 'drill') : S.sess.mod;
          var kind = (S.q && S.q.kind) || S.sess.kind || null;
          S.back = { q: S.q, sess: S.sess, draft: readDraft(), choice: S.choice, hint: S.hint };
          startExample(mod, kind);
        } }, '例题'),
        S.mode === 'wrong' ? h('button', { class: 'btn btn-ghost btn-sm', onclick: function () {
          /* 跳过本次：只把 due 推到明天，档位和连对都不动（规则见 工具/trainer/review.js）
             不计作答、不写记录，所以 s.right 不变，只把进度往前推一格 */
          window.__ltReview.skip(S.q, Date.now());
          save();
          S.sess.done++;
          S.sess.skipped = (S.sess.skipped || 0) + 1;
          nextQuestion();
        } }, '跳过本次') : null
      ));
      card.appendChild(h('div', { class: 'small muted' }, '负号写哪儿都算对；回车提交。'));
      if (S.scratch) card.appendChild(scratchPad());
    }

    if (q.tip && !S.answered && S.hint) card.appendChild(h('div', { class: 'tipbox', html: '提示：' + fracify(q.tip) }));

    if (!S.answered) {
      card.appendChild(h('div', { class: 'row', style: 'margin-top:16px' },
        h('button', { class: 'btn btn-primary', onclick: submit }, '提交'),
        h('button', { class: 'btn btn-ghost', onclick: function () { S.draft = readDraft(); S.hint = true; render(); } }, S.hint ? '提示已展开' : '看提示'),
        h('span', { class: 'grow' }),
        h('span', { class: 'small muted' }, '回车提交')
      ));
    } else {
      var fb = h('div', { class: 'fb ' + (S.res.ok ? 'good' : 'bad') });
      fb.appendChild(h('div', { class: 'ftitle' }, S.res.ok ? '✓ 全对' : '✗ 差一点（' + S.res.got + '/' + S.res.total + ' 个空对）'));
      var ul = h('ul');
      q.fields.forEach(function (f, i) {
        ul.appendChild(h('li', {
          html: (f.label ? escLt(f.label) + ' ' : '') + '正确答案：' + fracify(MT.ansText(f)) +
            (S.res.res[i].ok ? '' : '（你填的是 ' + fracify(rawAns(i)) + '）')
        }));
      });
      fb.appendChild(ul);
      (q.explain || []).forEach(function (line) { fb.appendChild(h('div', { class: 'small', html: fracify(line) })); });
      if (figP && !figP.need) {
        fb.appendChild(h('div', { class: 'figcap' }, '图象验证：上面的式子画出来是这样——对着图再读一遍顶点、交点、增减。'));
        fb.appendChild(h('div', { class: 'figbox', html: MT.svgFor({ fig: figP }) }));
      }
      card.appendChild(fb);

      /* 答错必须订正：把正确答案重新填一遍，对了才出现「下一题」 */
      if (S.fix && !S.fix.ok) {
        var fxb = h('div', { class: 'fb', style: 'margin-top:10px' });
        fxb.appendChild(h('div', { class: 'ftitle' }, '订正：照着上面的解析，把正确答案重新填一遍'));
        S.fix.fields.forEach(function (i) {
          var f = q.fields[i];
          if (f.type === 'expr') {
            var ew = h('div', { class: 'field' }, h('span', { class: 'lbl' }, f.label + '：'));
            var er = h('div', { class: 'exprline' });
            String(f.tpl || 'y = {}').split('{}').forEach(function (seg, si) {
              if (si > 0) er.appendChild(h('input', { class: 'fone expr-slot', id: 'fx' + i + '_' + (si - 1), placeholder: '?' }));
              if (seg) er.appendChild(h('span', { class: 'exprtxt' }, seg));
            });
            ew.appendChild(er);
            fxb.appendChild(ew);
          } else if (f.type === 'set') {
            var w = h('div', { class: 'field' }, h('span', { class: 'lbl' }, f.label + '：'));
            for (var j = 0; j < nSlots(f); j++) w.appendChild(h('input', { class: 'fone', id: 'fx' + i + '_' + j, placeholder: '数字' }));
            fxb.appendChild(w);
          } else {
            fxb.appendChild(h('div', { class: 'field' },
              h('span', { class: 'lbl' }, f.label),
              h('input', { class: 'fone', id: 'fx' + i, placeholder: '数字' }),
              f.unit ? h('span', { class: 'unit' }, f.unit) : null
            ));
          }
        });
        if (S.fix.tries) fxb.appendChild(h('div', { class: 'small', style: 'color:var(--bad)' }, '还不对（第 ' + S.fix.tries + ' 次），再对一下上面的解析。'));
        fxb.appendChild(h('div', { class: 'row', style: 'margin-top:10px' },
          h('button', { class: 'btn btn-primary btn-sm', onclick: submitFix }, '订正'),
          h('span', { class: 'small muted' }, '订正对了才能下一题')
        ));
        card.appendChild(fxb);
      } else if (S.fix && S.fix.ok) {
        card.appendChild(h('div', { class: 'small', style: 'color:var(--ok);margin-top:8px' }, '✓ 已订正'));
      }

      if (S.res.ok || !S.fix || S.fix.ok) {
        card.appendChild(h('div', { class: 'row', style: 'margin-top:14px' },
          h('button', { class: 'btn btn-primary', onclick: next }, s.done >= s.total ? '看本轮总结' : '下一题 →')
        ));
      }
    }
    app.appendChild(card);

    /* 自动聚焦第一个空：打开题就能直接打字 */
    if (!S.answered) {
      setTimeout(function () {
        var el = document.querySelector ? document.querySelector('.fone') : null;
        if (el && el.focus) { try { el.focus(); } catch (e) { } }
      }, 30);
    }
  }
  /* 一个字段要填几个数：expr 看模板空数，set 看 n */
  function nSlots(f) { return f.type === 'expr' ? (f.ans || []).length : f.n; }
  function draftAt(i, j) {
    var d = S.draft && S.draft[i];
    if (d == null) return '';
    if (j != null) d = d[j];
    return (typeof d === 'string') ? d : '';
  }
  /* 普通输入框：整数、小数、分数（1/2 或 ½）都能直接打；负号写哪儿都算对 */
  function numInput(base, val, cls) {
    var v = (val && typeof val === 'object') ? (val.n || '') : (val || '');
    return h('div', { class: 'fin ' + (cls || '') },
      h('input', {
        class: 'fone', id: base + '_n', value: v, inputmode: 'text', autocomplete: 'off', spellcheck: 'false',
        placeholder: '数字'
      })
    );
  }
  /* 草稿纸：鼠标 / 手指 / 触控笔都能写，不识别，只当纸用 */
  function scratchPad() {
    var cv = h('canvas', { class: 'pad', width: 900, height: 420 });
    var wrap = h('div', { class: 'padwrap' },
      cv,
      h('div', { class: 'row', style: 'margin-top:6px' },
        h('button', { class: 'btn btn-sm', onclick: function (e) { cv._pen = !cv._pen; e.currentTarget.textContent = cv._pen ? '工具：橡皮' : '工具：笔'; } }, '工具：笔'),
        h('button', {
          class: 'btn btn-sm', onclick: function () {
            var g = cv.getContext && cv.getContext('2d');
            if (g) g.clearRect(0, 0, cv.width, cv.height);
          }
        }, '清空')
      )
    );
    setTimeout(function () { setupCanvas(cv); }, 0);
    return wrap;
  }
  function setupCanvas(cv) {
    if (!cv.getContext) return;
    var g = cv.getContext('2d');
    var drawing = false, last = null;
    function pos(e) {
      var r = cv.getBoundingClientRect();
      var sx = cv.width / (r.width || 1), sy = cv.height / (r.height || 1);
      return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
    }
    function pen() {
      g.strokeStyle = cv._pen ? '#ffffff' : '#1b2333';
      g.fillStyle = cv._pen ? '#ffffff' : '#1b2333';
      g.lineWidth = cv._pen ? 16 : 3.5;
      g.lineCap = 'round'; g.lineJoin = 'round';
    }
    cv.addEventListener('pointerdown', function (e) {
      e.preventDefault(); drawing = true; last = pos(e); pen();
      g.beginPath(); g.arc(last.x, last.y, cv._pen ? 8 : 1.7, 0, 6.3); g.fill();
    });
    cv.addEventListener('pointermove', function (e) {
      if (!drawing) return;
      e.preventDefault();
      var p = pos(e);
      g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke();
      last = p;
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
      cv.addEventListener(ev, function () { drawing = false; });
    });
  }
  function toggleSign(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var v = String(el.value || '');
    el.value = v.charAt(0) === '-' ? v.slice(1) : '-' + v;
  }
  function readFracObj(base) {
    var el = document.getElementById(base + '_n');
    return el ? String(el.value || '') : '';
  }
  function fracVal(o) {
    return MT.parseNum(o);
  }
  /* 题干/解析走 innerHTML，但数学里的 `0<x<5`、`a<b` 会被浏览器当成标签起始，
     一路吞到下一个 `>`（`<x<5 …</span>` 整段消失，孩子看到的就是半截话）。
     这里只放行白名单标签，其余 `<` 一律转义。先把合法标签换成占位符，避免误伤。 */
  var SAFE_TAGS = /<\/?(?:br|span|b|i|sub|sup)\b[^<>]*>/gi;
  function escLt(s) {
    var keep = [];
    var t = String(s == null ? '' : s).replace(SAFE_TAGS, function (m) {
      keep.push(m);
      return '\u0001' + (keep.length - 1) + '\u0001';
    });
    t = t.replace(/</g, '&lt;');
    return t.replace(/\u0001(\d+)\u0001/g, function (m, i) { return keep[+i]; });
  }
  /* 把文本里的 1/2、-1/2、1/-2 都显示成上下结构的分数（负号统一放分子前） */
  function fracify(s) {
    return escLt(s).replace(/([−-]?)(\d+)\s*\/\s*([−-]?)(\d+)/g, function (m, sa, a, sb, b) {
      var neg = (sa === '-' || sa === '−') !== (sb === '-' || sb === '−');
      return '<span class="frac"><i>' + (neg ? '−' : '') + a + '</i><i>' + b + '</i></span>';
    });
  }
  function readDraft() {
    var out = [];
    S.q.fields.forEach(function (f, i) {
      if (f.type === 'choice') { out.push(''); return; }
      if (f.type === 'set' || f.type === 'expr') {
        var arr = [];
        for (var j = 0; j < nSlots(f); j++) arr.push(readFracObj('in' + i + '_' + j));
        out.push(arr);
      } else out.push(readFracObj('in' + i));
    });
    return out;
  }
  function rawAns(i) {
    var f = S.q.fields[i], v = (S.lastVals || [])[i];
    if (f.type === 'choice') return S.choice[i] == null ? '空' : String.fromCharCode(65 + S.choice[i]);
    if (f.type === 'set' || f.type === 'expr') {
      return (v || []).map(function (o) { return o ? String(o) : '空'; }).join('、');
    }
    return v ? String(v) : '空';
  }

  /* ---------- 当日题单快照：那天到底做了哪几题（复盘用，只留最近 14 天） ---------- */
  var SNAP_DAYS = 14;
  /* 同一天同一题可能做两遍，所以键要带时间戳；只按题干去重会把第二遍吞掉 */
  function snapKey(q) { return [q.mod || '', q.kind || '', q.p || '', q.t || 0].join('|'); }
  function snapAdd(mod, q, res, sec) {
    var k = today();
    var d = DB.days[k] || (DB.days[k] = { qs: [] });
    d.qs.push({
      mod: mod, kind: q.kind || '', kn: q.title || '',
      p: String(q.prompt || '').replace(/<br>/g, ' ').slice(0, 160),
      a: (q.fields || []).map(function (f) { return MT.ansText(f); }).join('；').slice(0, 140),
      ok: !!res.ok, sec: sec, t: Date.now()
    });
    var keys = dayKeys();
    while (keys.length > SNAP_DAYS) delete DB.days[keys.shift()];
  }

  function submit() {
    if (S.answered || S.example) return;
    var q = S.q;
    var draft = readDraft();
    /* 一个空都没填（含选择题未选）时不判分、不记记录、不进错题本 */
    var anyFilled = q.fields.some(function (f, i) {
      if (f.type === 'choice') return S.choice[i] != null;
      var d = draft[i];
      return Array.isArray(d) ? d.some(function (x) { return String(x).trim() !== ''; }) : String(d == null ? '' : d).trim() !== '';
    });
    if (!anyFilled) { alert('先填答案再提交'); return; }
    var vals = q.fields.map(function (f, i) {
      if (f.type === 'choice') return S.choice[i] == null ? null : S.choice[i];
      if (f.type === 'set' || f.type === 'expr') return draft[i].map(fracVal);
      return fracVal(draft[i]);
    });
    var res = MT.judge(q, vals);
    S.lastVals = draft;
    S.draft = draft;
    var fixIdx = [];
    if (!res.ok) {
      q.fields.forEach(function (f, i) { if (!res.res[i].ok && f.type !== 'choice') fixIdx.push(i); });
    }
    S.fix = fixIdx.length ? { fields: fixIdx, ok: false, tries: 0 } : null;
    var sec = Math.max(1, Math.round((Date.now() - S.t0) / 1000));
    S.res = res; S.answered = true;
    var s = S.sess;
    s.done++;
    if (res.ok) s.right++;
    var recMod = s.mod === 'wrong' ? (S.q.mod || 'drill') : s.mod;
    /* qid 要和历史记录兼容：entry 的 kind 现在是得分点 id，拼进去会把老记录拆成两条 */
    var qid = recMod + '.' + (q.mod === 'entry' ? '' : (q.kind || '')) + '.' + String(q.title || '');
    DB.recs.push({ ts: Date.now(), mod: recMod, kind: q.kind, kn: q.title, ok: res.ok, got: res.got, total: res.total, sec: sec, hint: S.hint, mode: S.mode, daily: !!s.daily,
      qid: qid });
    /* 记住这个模块最近练的题型：模块页「先看例题」用它，别随机抽到别的题型 */
    if (q.kind) { DB.meta.lastKind = DB.meta.lastKind || {}; DB.meta.lastKind[recMod] = q.kind; }
    snapAdd(s.mod === 'wrong' ? (S.q.mod || 'drill') : s.mod, q, res, sec);
    reviewAnswer(q, res.ok, sec, qid);   /* 统一错题回炉（ADR-0010）：连对2次+行为约束才算掌握 */
    save();
    render();
  }
  function submitFix() {
    if (!S.fix || S.fix.ok) return;
    var q = S.q, fields = [], vals = [];
    S.fix.fields.forEach(function (i) {
      var f = q.fields[i];
      fields.push(f);
      if (f.type === 'set' || f.type === 'expr') {
        var arr = [];
        for (var j = 0; j < nSlots(f); j++) {
          var el = document.getElementById('fx' + i + '_' + j);
          arr.push(MT.parseNum(el ? el.value : ''));
        }
        vals.push(arr);
      } else {
        var el2 = document.getElementById('fx' + i);
        vals.push(MT.parseNum(el2 ? el2.value : ''));
      }
    });
    var r = MT.judge({ fields: fields }, vals);
    if (r.ok) {
      S.fix.ok = true;
      var last = DB.recs[DB.recs.length - 1];
      if (last) last.fixed = true;
      save();
    } else {
      S.fix.tries++;
    }
    render();
  }

  function next() {
    if (S.sess.done >= S.sess.total) { S.view = 'summary'; render(); return; }
    nextQuestion();
  }

  /* ---------- 错题本（共享回炉内核 ADR-0010，规则只在 工具/trainer/review.js） ---------- */
  function wrongKey(q) { return q.id + '|' + String(q.prompt).slice(0, 60); }
  /* 原题裁切图（第 12 周）不进错题本：base64 动辄几十 KB，快照只存 cropKey，渲染时按 key 重建 */
  function figOf(q) {
    if (q.fig) return q.fig;
    if (q.cropKey && MT.cropFig) return MT.cropFig({ key: q.cropKey, cap: q.cropCap });
    return null;
  }
  /* 数学最短有效用时：选择/填空 3 秒，写解析式/大题前两步(entry，含单空题) 10 秒 */
  function minSecOf(q) { return (q.mod === 'write' || q.mod === 'entry' || (q.fields && q.fields.length > 1)) ? 10 : 3; }
  function reviewAnswer(q, ok, sec, qid) {
    var R = window.__ltReview, k = wrongKey(q), w = DB.wrong[k], now = Date.now();
    if (R.migrate(w, now)) save();
    if (!ok) {
      if (!w) {
        w = { id: q.id, qid: qid, mod: q.mod || S.sess.mod, kind: q.kind, title: q.title, prompt: q.prompt,
          fields: q.fields, explain: q.explain, tip: q.tip, no: q.no, noLabel: q.noLabel,
          cropKey: q.cropKey, cropCap: q.cropCap, fig: q.cropKey ? null : q.fig };
        DB.wrong[k] = w;
      }
      if (qid && !w.qid) w.qid = qid;   /* 旧条目补 qid，供历史错题清单匹配 */
      R.onWrong(w, now);
      return;
    }
    var sig = { sec: sec, minSec: minSecOf(q), hint: !!S.hint, fixed: false };
    var act = R.onPass(w, sig, now);
    if (act === 'mastered') delete DB.wrong[k];
  }

  /* ---------- 本轮总结 ---------- */
  function renderSummary() {
    var s = S.sess;
    var mins = Math.max(1, Math.round((Date.now() - s.t0) / 60000));
    /* 跳过的不算分母：否则跳过一题会把正确率拉低，孩子会以为自己做错了 */
    var answered = Math.max(0, s.total - (s.skipped || 0));
    app.appendChild(h('div', { class: 'card', style: 'text-align:center;padding:28px 18px' },
      h('div', { style: 'font-size:44px;line-height:1.1' }, s.right === s.total ? '🎉' : (s.right / s.total >= .6 ? '👍' : '💪')),
      h('h2', { style: 'margin:8px 0 4px' }, s.right + ' / ' + s.total + ' 全对'),
      h('p', { class: 'muted' }, '用时约 ' + mins + ' 分钟 · 正确率 ' + pct(s.right, answered || s.total) + '%' +
        (s.skipped ? ' · 跳过 ' + s.skipped + ' 题（明天再来）' : '')),
      h('div', { class: 'row', style: 'justify-content:center;margin-top:16px' },
        h('button', { class: 'btn btn-primary', onclick: function () {
          if (s.replay) s.replay();
          else if (s.mod === 'wrong') startWrong();
          else if (s.daily) startDaily(s.mod);
          else startSession(s.mod, s.kind, s.total);
        } }, '再来一轮'),
        h('button', { class: 'btn', onclick: function () { go('today'); } }, '回今日')
      )
    ));
    var tips = [];
    if (s.right / s.total < .6) tips.push('正确率偏低：先点「看提示」把例题看懂，再独立做一遍。');
    if (s.mod === 'write' && s.right / s.total < .8) tips.push('写解析式的目标是一次就对：设 → 代 → 求，三步各写一行。');
    if (s.mod === 'entry' && s.right / s.total < .7) tips.push('前两步的关键是「先落笔」：写出设、列出式子，比算完更重要。');
    if (tips.length) app.appendChild(h('div', { class: 'card' }, h('b', null, '下一步'), tips.map(function (t) { return h('p', { class: 'small' }, '· ' + t); })));
  }

  /* ---------- 报告 ---------- */
  function renderReport() {
    var recs = DB.recs;
    var ok = recs.filter(function (r) { return r.ok; }).length;
    var secs = recs.reduce(function (a, r) { return a + (r.sec || 0); }, 0);
    app.appendChild(h('div', { class: 'grid' },
      statCard('累计题数', recs.length),
      statCard('总正确率', recs.length ? pct(ok, recs.length) + '%' : '—'),
      statCard('累计用时', recs.length ? fmtSec(secs) : '—'),
      statCard('错题本', Object.keys(DB.wrong).length)
    ));

    /* 按模块 */
    var byMod = {};
    recs.forEach(function (r) { var k = r.mod; (byMod[k] = byMod[k] || []).push(r); });
    var t1 = h('table', { class: 'tb' }, h('tr', null, h('th', null, '模块'), h('th', { class: 'n' }, '题数'), h('th', { class: 'n' }, '正确率'), h('th', { class: 'n' }, '平均用时')));
    Object.keys(byMod).forEach(function (k) {
      var rs = byMod[k], o = rs.filter(function (r) { return r.ok; }).length;
      var name = (MT.moduleById(k) || {}).name || k;
      t1.appendChild(h('tr', null, h('td', null, name), h('td', { class: 'n' }, rs.length), h('td', { class: 'n' }, pct(o, rs.length) + '%'), h('td', { class: 'n' }, fmtSec(rs.reduce(function (a, r) { return a + r.sec; }, 0) / rs.length))));
    });
    app.appendChild(h('div', { class: 'card', style: 'margin-top:16px' }, h('h3', { style: 'margin-top:0' }, '按模块'), t1));

    /* 按题型（≥5 题才显示） */
    var byKind = {};
    recs.forEach(function (r) { (byKind[r.kn || r.kind] = byKind[r.kn || r.kind] || []).push(r); });
    var rows = Object.keys(byKind).filter(function (k) { return byKind[k].length >= 5; }).sort(function (a, b) { return byKind[a].length - byKind[b].length; });
    var t2 = h('table', { class: 'tb' }, h('tr', null, h('th', null, '题型'), h('th', { class: 'n' }, '题数'), h('th', { class: 'n' }, '正确率')));
    rows.forEach(function (k) {
      var rs = byKind[k], o = rs.filter(function (r) { return r.ok; }).length;
      t2.appendChild(h('tr', null, h('td', null, k), h('td', { class: 'n' }, rs.length), h('td', { class: 'n' }, pct(o, rs.length) + '%')));
    });
    if (!rows.length) t2.appendChild(h('tr', null, h('td', { colspan: 3, class: 'muted small' }, '每个题型练满 5 题后显示')));
    app.appendChild(h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '按题型（弱项在前）'), t2));

    /* 近 7 天 */
    var days = [], maxN = 1;
    for (var i = 6; i >= 0; i--) {
      var t = new Date(Date.now() - i * MT.DAY);
      var k = dayKey(t.getTime());
      var n = recs.filter(function (r) { return dayKey(r.ts) === k; }).length;
      maxN = Math.max(maxN, n);
      days.push({ label: (t.getMonth() + 1) + '/' + t.getDate(), n: n });
    }
    var spark = h('div', { class: 'spark' });
    days.forEach(function (x) {
      spark.appendChild(h('div', { class: 'col' },
        h('i', { style: 'height:' + Math.max(2, Math.round(x.n / maxN * 52)) + 'px' }),
        h('span', null, x.label)
      ));
    });
    app.appendChild(h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '近 7 天题数'), spark));

    /* 错题本 */
    var ws = Object.keys(DB.wrong).map(function (k) { return DB.wrong[k]; }).sort(function (a, b) { return b.ts - a.ts; }).slice(0, 10);
    var wc = h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '错题本（最近 10 条）'));
    if (!ws.length) wc.appendChild(h('div', { class: 'empty' }, '还没有错题'));
    ws.forEach(function (w) {
      var dueTxt = window.__ltReview.statusText(w);
      /* 预览只留纯文字：题干里的 <span class="muted small">、<br> 去掉后再转义，
         否则「0<x<5」这类会被 HTML 解析器吃掉半句话 */
      var brief = String(w.prompt == null ? '' : w.prompt).replace(/<[^<>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      wc.appendChild(h('div', { class: 'wrongitem' },
        h('div', { class: 'wt', html: escLt(brief.slice(0, 80)) + (brief.length > 80 ? '…' : '') }),
        h('div', { class: 'small muted' }, dueTxt)
      ));
    });
    wc.appendChild(h('div', { class: 'row', style: 'margin-top:10px' },
      h('button', { class: 'btn btn-primary btn-sm', onclick: startWrong }, '回炉到期的')
    ));
    app.appendChild(wc);

    /* 历史错题清单：从 recs 聚合整学期曾错过的题（掌握后移出错题本仍留档） */
    var hist = window.__ltReview.everWrong(DB.recs, DB.wrong);
    var hc = h('div', { class: 'card' },
      h('h3', { style: 'margin-top:0' }, '曾经错过的题（期末复盘 · ' + hist.length + ' 道）'),
      h('p', { class: 'small muted', style: 'margin:0 0 8px' }, '按错次排序。移到「已掌握」的题仍留档；错题库已清的浏览器无历史，导出 JSON 可长期保存。'));
    if (!hist.length) hc.appendChild(h('div', { class: 'empty' }, '还没有答错的记录'));
    else {
      var ht = h('table', { class: 'tb' }, h('tr', null,
        h('th', null, '题目'), h('th', { class: 'n' }, '错/对'), h('th', null, '首错'), h('th', null, '末错'), h('th', null, '状态')));
      hist.forEach(function (e) {
        ht.appendChild(h('tr', null,
          h('td', null, e.label.slice(0, 40)),
          h('td', { class: 'n' }, e.wrong + '/' + e.okCount),
          h('td', null, window.__ltReview.dayText(e.firstWrongAt)),
          h('td', null, window.__ltReview.dayText(e.lastWrongAt)),
          h('td', null, e.inBook ? '在错题本' : '已掌握')));
      });
      hc.appendChild(ht);
    }
    app.appendChild(hc);

    /* 当日题单快照（最近 14 天，按天倒序） */
    var dkeys = dayKeys().reverse();
    var dc = h('div', { class: 'card' },
      h('h3', { style: 'margin-top:0' }, '题单快照（最近 14 天）'),
      h('p', { class: 'small muted', style: 'margin:0 0 8px' }, '每天做过的题逐条留档：题干、答案、对错、用时；导出 JSON 会一起带走。'));
    if (!dkeys.length) dc.appendChild(h('div', { class: 'empty' }, '还没有记录'));
    dkeys.forEach(function (k) {
      var d = DB.days[k];
      var qs = d.qs || [];
      var okN = qs.filter(function (x) { return x.ok; }).length;
      var sum = qs.reduce(function (a, x) { return a + (x.sec || 0); }, 0);
      dc.appendChild(h('div', { class: 'snapday' },
        h('div', { class: 'snaph' }, h('b', null, k),
          h('span', { class: 'small muted' }, ' · ' + qs.length + ' 题 · 对 ' + okN + ' · ' + fmtSec(sum))),
        h('div', null, qs.map(function (x) {
          return h('div', { class: 'snapq small' },
            h('span', { class: x.ok ? 'ok' : 'bad' }, x.ok ? '✓ ' : '✗ '),
            h('span', null, (x.kn ? '[' + x.kn + '] ' : '') + x.p + ' → ' + x.a));
        }))
      ));
    });
    app.appendChild(dc);

    /* 数据 */
    var data = h('div', { class: 'card' },
      h('h3', { style: 'margin-top:0' }, '数据'),
      h('div', { class: 'row' },
        h('button', { class: 'btn btn-sm', onclick: exportJSON }, '导出 JSON'),
        h('button', { class: 'btn btn-sm', onclick: importJSON }, '导入 JSON'),
        h('button', { class: 'btn btn-sm', onclick: selfCheck }, '自检（每组 120 题）'),
        h('button', { class: 'btn btn-sm', style: 'color:#d93025', onclick: clearAll }, '清空记录')
      ),
      h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', { class: 'btn btn-sm', onclick: runSync }, '云同步（跨设备）'),
        h('button', { class: 'btn btn-sm btn-ghost', title: 'PAT 怎么生成', onclick: function () { alert(window.__ltSyncUI.patHelp); } }, 'PAT 是什么？'),
        h('input', { id: 'syncPat', type: 'password', placeholder: 'GitHub PAT（存本机）', style: 'flex:1;min-width:160px;padding:6px;border:1px solid var(--line);border-radius:8px' }),
        h('span', { id: 'syncMsg', class: 'small muted' })
      ),
      h('p', { class: 'small muted', style: 'margin-bottom:0' }, '记录只在本机浏览器；清缓存 / 换设备前先导出，放进 学习记录/。')
    );
    app.appendChild(data);
  }

  function exportJSON() {
    var blob = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    var t = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = '数学训练记录-' + t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  }
  function importJSON() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var o = JSON.parse(String(fr.result));
          if (!o || o.v !== MT.VERSION || !Array.isArray(o.recs)) throw new Error('格式不对');
          /* recs/wrong 与云同步共用同一合并函数（merge.mjs 内联），同份导入两次不翻倍。
             脚手架族 recs 带 kn 无 prompt，合并键取 prompt[:40]||kn，见 ADR-0007 决定 4。
             days 是设备态、不进云同步载体；本地导入仍需它算连续天数，故照原样合并。 */
          var before = DB.recs.length;
          var merged = window.__ltMerge.mergeRecords(DB, o);
          DB.recs = merged.recs;
          Object.keys(merged.wrong || {}).forEach(function (k) {
            var w = merged.wrong[k];
            if (!w || !Array.isArray(w.fields) || typeof w.due !== 'number') return;   /* 结构坏的错题跳过 */
            DB.wrong[k] = w;
          });
          var added = DB.recs.length - before;
          Object.keys(o.days || {}).forEach(function (k) {
            var src = o.days[k];
            if (!src || !Array.isArray(src.qs)) return;
            var dst = DB.days[k] || (DB.days[k] = { qs: [] });
            var seen = {};
            dst.qs.forEach(function (q) { if (q && typeof q === 'object') seen[snapKey(q)] = 1; });
            src.qs.forEach(function (q) {
              if (!q || typeof q !== 'object') return;
              var sk = snapKey(q);
              if (seen[sk]) return;   /* 同一份文件导两次，题单快照不该翻倍 */
              seen[sk] = 1;
              dst.qs.push(q);
            });
          });
          save(); render(); alert('已导入 ' + added + ' 条记录（重复的已跳过）');
        } catch (e) { alert('导入失败：' + e.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
  }
  function runSync() {
    if (!window.__ltSyncUI) { alert('云同步组件未加载'); return; }
    var patEl = document.getElementById('syncPat');
    if (patEl && patEl.value) window.__ltSyncUI.setPAT(patEl.value);
    window.__ltSyncUI.run();
  }
  function selfCheck() {
    var t0 = Date.now();
    var r = MT.selfTest(120);
    alert('自检：' + r.count + ' 题，' + (r.fails.length ? r.fails.length + ' 处失败\n' + r.fails.slice(0, 8).join('\n') : '全部通过') + '\n用时 ' + (Date.now() - t0) + ' ms');
  }
  function clearAll() {
    if (!confirm('清空所有记录和错题？建议先导出。')) return;
    DB = blankDB(); save(); render();
  }

  /* ---------- 启动 ---------- */
  Array.prototype.forEach.call(tabs.children, function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-go');
      if (v === 'today') { go('today'); return; }
      if (v === 'report') { go('report'); return; }
      go(v); /* 模块页：题型列表 + 例题 + 开始练 */
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || S.view !== 'practice' || S.example) return;
    e.preventDefault();
    if (!S.answered) { submit(); return; }
    if (S.fix && !S.fix.ok) { submitFix(); return; }
    next();
  });
  /* 段三：云同步适配层注入宿主接口（DB 读写/通知），报告页「云同步」按钮触发 runSync */
  if (window.__ltSyncUI) window.__ltSyncUI.init({
    getDB: function () { return DB; },
    setDB: function (d) { DB = normalizeDB(d); save(); render(); },   /* 云端回写也要过一遍规整，坏数据不能进内存 */
    notify: function (msg) { var el = document.getElementById('syncMsg'); if (el) el.textContent = msg; }
  });
  (function boot() {
    var m = (location.hash || '').match(/view=([a-z]+)/);
    var v = m && m[1];
    if (MT.moduleById(v)) { go(v); return; }   /* 模块页：drill / write / entry / week12…按注册表走，加模块不用改这里 */
    if (v === 'report') { go('report'); return; }
    go('today');
  })();

  /* 调试/自测钩子：不参与界面，供 node 里的 DOM 桩测试使用 */
  window.__mt = {
    S: S, db: function () { return DB; },
    fracify: fracify, escLt: escLt, normalizeDB: normalizeDB,
    startSession: startSession, startWrong: startWrong, startDaily: startDaily, startExample: startExample,
    startGroupRandom: startGroupRandom,
    plan: function () { return dayPlan(); },
    submit: submit, submitFix: submitFix, next: next, go: go, render: render
  };
})();
</script>
</body>
</html>
