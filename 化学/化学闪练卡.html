<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>化学闪练卡 · 人教版初三全考点</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#1b2333; --muted:#6b7280; --line:#e6e9f2;
  --brand:#0e7490; --brand-soft:#e4f2f6; --ok:#0f9d58; --ok-soft:#e8f6ee;
  --bad:#d93025; --bad-soft:#fdecea; --warn:#c26a00; --warn-soft:#fff4e2;
  --r:14px; --shadow:0 1px 2px rgba(20,30,60,.05),0 8px 24px rgba(20,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:900px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px}
.ver{font-size:11px;color:var(--muted);font-weight:600;border:1px solid var(--line);border-radius:20px;padding:1px 7px}
.top-note{font-size:12px;color:var(--muted);margin-left:auto}
nav.tabs{max-width:900px;margin:0 auto;padding:8px 16px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:8px 12px;border-radius:10px 10px 0 0;cursor:pointer;border-bottom:2px solid transparent}
nav.tabs button:hover{color:var(--ink);background:#eef1f8}
nav.tabs button.active{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}
main{padding-top:18px}
h2{font-size:19px;margin:24px 0 10px}
h3{font-size:16px;margin:16px 0 8px}
p{margin:8px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:11px;cursor:pointer;transition:transform .06s ease,background .12s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#0b6479}
.btn-ghost{background:transparent;border-color:transparent;color:var(--brand);padding:6px 8px}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.progress{height:6px;background:#eef1f8;border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .2s ease}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qbody{font-size:16px;font-weight:600;margin:12px 0;line-height:1.8}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;margin:7px 0;font:inherit;font-size:15px;cursor:pointer;transition:background .1s,border .1s}
.opt:hover{background:#f7fafc;border-color:#cbd5e1}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:#0b6b3a;font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:#a51f17}
.field{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.field .lbl{font-size:14px;color:var(--muted);min-width:70px}
.field .lbl.full{display:block;min-width:0;width:100%;font-weight:600;color:var(--ink)}
input.txt{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:170px;flex:1;background:#fff;color:var(--ink)}
input.txt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input.txt.ok{border-color:var(--ok);background:var(--ok-soft)}input.txt.bad{border-color:var(--bad);background:var(--bad-soft)}
.unit{color:var(--muted);font-size:14px}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.fb.good{background:var(--ok-soft);border:1px solid #bfe6cd}
.fb.bad{background:var(--bad-soft);border:1px solid #f3c9c4}
.fb.ftitle{font-weight:800;font-size:15px;margin-bottom:6px}
.mk{display:inline-block;width:20px;font-weight:800}.mk.ok{color:var(--ok)}.mk.bad{color:var(--bad)}
.tipbox{background:var(--warn-soft);border:1px solid #f1d9a8;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;color:#8a4b00}
.kpline{margin-top:8px;font-size:12px;color:var(--muted)}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.modcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:transform .06s,border .1s}
.modcard:hover{border-color:var(--brand);transform:translateY(-1px)}
.modcard h4{margin:0 0 4px;font-size:15px}
.modcard .d{font-size:12px;color:var(--muted);line-height:1.5}
.modcard .m{margin-top:8px;font-size:11px;color:var(--brand);font-weight:700}
.kindchip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin:4px 5px 0 0;font-size:13px;cursor:pointer;background:#fff}
.kindchip:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.statbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.statbox .k{font-size:12px;color:var(--muted)}.statbox .v{font-size:24px;font-weight:800;color:var(--brand)}
.wrongitem{border-left:3px solid var(--bad);padding-left:10px;margin:10px 0}
.due{font-size:11px;color:var(--warn);font-weight:700}
@media(max-width:560px){.qbody{font-size:15px}.statbox .v{font-size:20px}.top-note{display:none}}
@media print{nav.tabs,header.top,.btn{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in"><span class="brand">⚗ 化学闪练卡</span><span class="ver">人教版初三 · 全考点</span>
    <span class="top-note">随机出题 · 答案解析讲考点难点 · 反复练</span></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main class="wrap" id="app"></main>
<script id="core">
/* ============================================================
   化学闪练卡 · 核心逻辑（纯数据 + 出题 + 判分，不碰 DOM）
   节点：本文件由 build.mjs 内联为 core 脚本节点，check-flash.mjs 抽出跑自检
   ============================================================ */
var CH = (function () {
  'use strict';
  var VERSION = 1, DAY = 86400000;

  /* ---------- 可复现随机 ---------- */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function ri(r, a, b) { return a + Math.floor(r() * (b - a + 1)); }
  function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }
  function shuffled(r, arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function pair(r, correct, wrongs) {
    /* 1 对 3：正确项 + 从错项里取 3，打乱 */
    var opts = [correct].concat(shuffled(r, wrongs).slice(0, 3));
    opts = shuffled(r, opts);
    return { type: 'choice', options: opts, ans: opts.indexOf(correct) };
  }

  /* ---------- 输入归一 ---------- */
  function parseNum(input) {
    if (input === null || input === undefined) return NaN;
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    var s = String(input).trim();
    if (!s) return NaN;
    s = s.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[．。]/g, '.').replace(/[−－—–]/g, '-').replace(/[，,\s]/g, '');
    if (/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)) return parseFloat(s);
    var s2 = s.replace(/[A-Za-z\u4e00-\u9fa5%°()（）\/·]+$/g, '');
    if (s2 && s2 !== s && /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s2)) return parseFloat(s2);
    return NaN;
  }
  var SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁺': '+', '⁻': '-' };
  var SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  function normChem(s) {
    s = String(s == null ? '' : s);
    s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]/g, function (c) { return SUP[c] || c; });
    s = s.replace(/[₀₁₂₃₄₅₆₇₈₉]/g, function (c) { return SUB[c] || c; });
    s = s.replace(/[（）]/g, function (m) { return m === '（' ? '(' : ')'; });
    s = s.replace(/[＋]/g, '+').replace(/[－]/g, '-');
    s = s.replace(/\s+/g, '');
    return s.toLowerCase();
  }
  function fmtNum(x) {
    if (!isFinite(x)) return '?';
    return String(Math.round(x * 1000) / 1000).replace('-', '−');
  }

  /* ---------- 字段构造 ---------- */
  function cf(r, correct, wrongs, label) { var f = pair(r, correct, wrongs); f.label = label || ''; return f; }
  function nf(ans, label, unit, tol) { return { type: 'num', ans: ans, label: label || '', unit: unit || '', tol: tol == null ? 0.01 : tol }; }
  function tf(ans, label, alts) { return { type: 'text', ans: ans, label: label || '', alts: alts || [] }; }

  /* ---------- 判分 ---------- */
  function judge(q, vals) {
    var res = q.fields.map(function (f, i) {
      var v = vals[i];
      if (f.type === 'choice') return { ok: v === f.ans };
      if (f.type === 'text') {
        var s = normChem(v);
        return { ok: s === normChem(f.ans) || (f.alts || []).some(function (a) { return s === normChem(a); }) };
      }
      var x = (typeof v === 'number') ? v : parseNum(v);
      if (!isFinite(x)) return { ok: false };
      return { ok: Math.abs(x - f.ans) <= (f.tol == null ? 0.01 : f.tol) + 1e-9 };
    });
    var got = res.filter(function (x) { return x.ok; }).length;
    return { ok: got === res.length, got: got, total: res.length, res: res };
  }
  function ansText(f) {
    if (f.type === 'choice') return f.options[f.ans];
    if (f.type === 'text') return f.ans;
    return fmtNum(f.ans) + (f.unit || '');
  }

  /* ============================================================
     生成器：每个 kind 一个 gen(r)，返回
     {title, prompt, fields:[...], tip, explain:[...], kp:[...]}
     ============================================================ */

  /* ---- 第一单元 走进化学世界 ---- */
  var CHANGES = [
    { c: '铁生锈', p: '把铁丝弯成铁圈' }, { c: '食物腐烂', p: '冰雪融化' },
    { c: '蜡烛燃烧', p: '蜡烛熔化' }, { c: '纸张燃烧', p: '纸张撕碎' },
    { c: '光合作用', p: '水蒸发' }, { c: '酿酒', p: '酒精挥发' },
    { c: '火药爆炸', p: '玻璃破碎' }, { c: '呼吸作用', p: '灯泡发光' }
  ];
  function genChange(r) {
    var list = shuffled(r, CHANGES);
    var askChem = r() < 0.5;
    var target = askChem ? list[0].c : list[0].p;
    var others = [];
    for (var i = 1; i < list.length; i++) others.push(askChem ? list[i].p : list[i].c);
    var f = cf(r, target, others);
    return {
      id: 'intro.change', kind: 'change', title: askChem ? '化学变化判断' : '物理变化判断',
      prompt: '下列变化中，属于' + (askChem ? '化学变化' : '物理变化') + '的是（　）',
      fields: [f],
      tip: '判断唯一标准：有没有新物质生成。发光、放热、变色、冒气都不是判据（灯泡发光也放热）。',
      explain: [askChem ? '「' + target + '」过程中生成了原来没有的新物质，是化学变化。' : '「' + target + '」只是形状或状态改变，没有新物质生成，是物理变化。',
        '口诀：化学变化 = 有新物质；物理变化 = 仅形状 / 状态改变。'],
      kp: ['物理变化与化学变化', '第一单元', '易错：现象≠本质']
    };
  }
  function genProperty(r) {
    var chem = [['铁能生锈', ['铁是银白色固体', '水在 0℃结冰', '酒精有刺激性气味']],
      ['木材可以燃烧', ['木材是棕色', '食盐能溶于水', '铜能导电']],
      ['粮食能酿酒', ['粮食是颗粒状', '氧气无色无味', '玻璃易碎']]];
    var phys = [['酒精易挥发', ['酒精能燃烧', '铁会生锈', '食物会腐烂']],
      ['水能溶解食盐', ['水能电解生成氢气', '氢气能燃烧', '铁在潮湿空气中生锈']],
      ['铜有良好的导电性', ['铜在空气中会生成铜绿', '镁条能燃烧', '煤炭能燃烧']]];
    var useChem = r() < 0.5;
    var bank = useChem ? chem : phys;
    var it = pick(r, bank);
    var f = cf(r, it[0], it[1]);
    return {
      id: 'intro.property', kind: 'property', title: useChem ? '化学性质判断' : '物理性质判断',
      prompt: '下列描述中，属于' + (useChem ? '化学性质' : '物理性质') + '的是（　）',
      fields: [f],
      tip: '性质描述里有「能 / 会 / 可以 / 易」等多半讲性质；要不要通过化学变化才能表现出来，是区分化学 / 物理性质的关键。',
      explain: ['「' + it[0] + '」' + (useChem ? '要通过化学变化才能表现出来，属于化学性质。' : '不需要发生化学变化就能表现出来，属于物理性质。'),
        '注意区分：物理变化 / 化学变化是「正在发生的过程」，物理性质 / 化学性质是「能力」。'],
      kp: ['物理性质与化学性质', '第一单元', '易错：性质与变化混淆']
    };
  }
  function genLabBasic(r) {
    var bank = [
      { ok: '量筒读数时视线与凹液面最低处相平', bad: ['仰视读数', '俯视读数', '把量筒放在天平上称量'] },
      { ok: '给试管里的液体加热，液体不超过试管容积的 1/3', bad: ['液体装满试管', '试管口朝着自己', '用酒精灯内焰加热'] },
      { ok: '过滤时漏斗下端紧靠烧杯内壁', bad: ['漏斗下端悬空', '液面高于滤纸边缘', '用玻璃棒搅动过滤器中的液体'] },
      { ok: '用胶头滴管滴加液体时，滴管垂直悬空于试管口上方', bad: ['滴管伸入试管内', '滴管平放或倒置', '滴管口接触试管壁'] },
      { ok: '称量干燥固体药品前，两边托盘各放一张相同的纸', bad: ['用手直接拿砝码', '药品与砝码位置放反（左码右物）', '把潮湿药品直接放托盘上'] },
      { ok: '熄灭酒精灯时用灯帽盖灭', bad: ['用嘴吹灭', '用燃着的酒精灯去点另一盏', '向燃着的酒精灯内添加酒精'] }
    ];
    var it = pick(r, bank);
    return {
      id: 'intro.labbasic', kind: 'labbasic', title: '基本实验操作',
      prompt: '下列实验操作中，正确的是（　）', fields: [cf(r, it.ok, it.bad)],
      tip: '高频操作考点：量筒平视、试管液体≤1/3、滴管悬空、过滤「一贴二低三靠」、灯帽盖灭酒精灯。',
      explain: ['「' + it.ok + '」符合规范操作要求。', '三个错误选项分别违反了对应的操作要点，考查的正是实验基本功。'],
      kp: ['化学实验基本操作', '第一单元', '仪器使用与规范']
    };
  }
  function genLabAccident(r) {
    var bank = [
      { ok: '少量酒精洒在桌面着火，立即用湿抹布盖灭', bad: ['用水冲浇', '用嘴吹灭', '置之不理等它自己熄灭'] },
      { ok: '浓硫酸沾到皮肤上，先用大量水冲洗，再涂 3%～5% 的碳酸氢钠溶液', bad: ['先涂氢氧化钠溶液', '直接用干布擦掉就行', '不做任何处理'] },
      { ok: '氢氧化钠溶液沾到皮肤上，先用大量水冲洗，再涂硼酸溶液', bad: ['涂浓硫酸中和', '用酒精擦洗', '不处理'] },
      { ok: '酸洒到实验台上，可先加适量碳酸氢钠中和，再用水冲洗', bad: ['直接用手擦拭', '用氢氧化钠固体覆盖', '任其挥发'] }
    ];
    var it = pick(r, bank);
    return {
      id: 'intro.accident', kind: 'accident', title: '实验意外处理',
      prompt: '下列实验事故处理方法中，正确的是（　）', fields: [cf(r, it.ok, it.bad)],
      tip: '记牢两条：酸沾皮肤 → 大量水冲 + 碳酸氢钠；碱沾皮肤 → 大量水冲 + 硼酸。酒精着火 → 湿抹布盖灭。',
      explain: ['「' + it.ok + '」是教材要求的正确处理方法。', '处理的关键是先大量水冲稀释，再用弱酸 / 弱碱中和，绝不能用强酸强碱。'],
      kp: ['实验安全与事故处理', '第一单元']
    };
  }

  /* ---- 第二单元 我们周围的空气 ---- */
  function genAirComp(r) {
    var tabs = [
      { q: '空气中体积分数约为 78% 的气体是', a: '氮气', w: ['氧气', '二氧化碳', '稀有气体'] },
      { q: '空气中体积分数约为 21% 的气体是', a: '氧气', w: ['氮气', '二氧化碳', '稀有气体'] },
      { q: '空气中含量最多的气体是', a: '氮气', w: ['氧气', '二氧化碳', '水蒸气'] }
    ];
    var it = pick(r, tabs);
    return {
      id: 'air.comp', kind: 'comp', title: '空气的成分',
      prompt: it.q + '（　）', fields: [cf(r, it.a, it.w)],
      tip: '空气成分体积分数：氮气约 78%、氧气约 21%、稀有气体约 0.94%、二氧化碳约 0.03%。记「氮七八、氧二一」。',
      explain: ['空气是混合物，各成分体积分数近似为氮 78%、氧 21%。', '注意是体积分数不是质量分数；二氧化碳含量虽小却至关重要。'],
      kp: ['空气的成分', '第二单元', '体积分数记忆']
    };
  }
  function genO2Measure(r) {

        try { q = gen(k.mod, k.kind, seed); }

        count++;
        var tag = k.mod + '.' + k.kind + '#' + i;
        if (!q.prompt || /undefined|NaN|\[object/.test(q.prompt)) fails.push(tag + ' 题干异常: ' + q.prompt);

          if (f.type === 'choice') {
            if (!f.options || f.options.length < 2) fails.push(tag + ' 选项不足');
            if (!(f.ans >= 0 && f.ans < f.options.length)) fails.push(tag + ' 正确项下标越界');
            if (new Set(f.options).size !== f.options.length) fails.push(tag + ' 选项重复: ' + f.options.join('/'));
          } else if (f.type === 'num') {
            if (!isFinite(f.ans)) fails.push(tag + ' 数值答案非有限数');
          } else if (f.type === 'text') {
            if (!f.ans || !String(f.ans).trim()) fails.push(tag + ' 文本答案为空');
          } else fails.push(tag + ' 非法字段类型 ' + f.type);
        });
        /* 正确解必须判对（choice 用下标，num/text 用答案文本） */
        var right = q.fields.map(function (f) { return f.type === 'choice' ? f.ans : ansText(f); });
        var jr = judge(q, right);
        if (!jr.ok) fails.push(tag + ' 正确解未判对 ' + JSON.stringify(right) + ' => ' + JSON.stringify(jr.res));
        /* 明显错误解必须判错 */
        var wrong = q.fields.map(function (f) {
          if (f.type === 'choice') return f.options[(f.ans + 1) % f.options.length];
          if (f.type === 'num') return '__bad__';
          return '__zzz_bad__';
        });
        if (judge(q, wrong).ok) fails.push(tag + ' 错误解被判对');
      }
    });
    return { count: count, fails: fails, kinds: ALL_KINDS.length, modules: MODULES.length };
  }

  return {
    VERSION: VERSION, DAY: DAY, modules: MODULES, allKinds: ALL_KINDS,
    gen: gen, judge: judge, ansText: ansText, parseNum: parseNum, normChem: normChem,
    moduleById: moduleById, selfTest: selfTest
  };
})();
</script>

<script id="merge">
/* 事件并集合并 · 两族共用（化学内核族 / 物理数学脚手架族）
 * ============================================================
 * 唯一合并实现：页面导入按钮与云同步都调它，不许另写一套（ADR-0007 决定 4）。
 *
 * 去重键 (ts, mod, kind, ident)，ident = prompt[:40] || kn：
 *   - 化学内核族 recs 写 prompt、无 kn（kernel.js:280）
 *   - 物理/数学脚手架族与历史导出 recs 写 kn、无 prompt（train.ui.js:790/683）
 *   取两者中有的那个，避免把脚手架族第 4 维压成空串。
 *
 * 合并不求和：并集 + 各自保留；设备态 days/lastRound/dayPlan/sess 不进载体。
 * 本文件既是 node 可 import 的 ESM，也是 build.mjs 内联进产物的源（去掉 export 行）。
 */

/** 题目标识：prompt 前 40 字优先，回退 kn，都没有则空串 */
function pickIdent(r) {
  if (!r || typeof r !== 'object') return '';
  var p = String(r.prompt || '').slice(0, 40);
  if (p) return p;
  return String(r.kn || '');
}

/** 去重键：时间戳 + 模块 + 题型 + 题目标识 */
function recSig(r) {
  if (!r || typeof r !== 'object') return '';
  return [r.ts, r.mod, r.kind, pickIdent(r)].join('|');
}

/** 合并两份 DB：recs 取并集，wrong 字段互补，meta 取 max/最早，丢弃设备态 */
function mergeRecords(base, incoming) {
  var out = { v: 1, recs: [], wrong: {}, meta: {} };
  var seen = Object.create(null);
  function addRec(r) {
    if (!r || typeof r !== 'object') return;
    var k = recSig(r);
    if (seen[k]) return;
    seen[k] = 1;
    out.recs.push(r);
  }
  ((base && base.recs) || []).forEach(addRec);
  ((incoming && incoming.recs) || []).forEach(addRec);
  out.recs.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
  if (out.recs.length > 2000) out.recs = out.recs.slice(-1500);

  var bw = (base && base.wrong) || {}, iw = (incoming && incoming.wrong) || {};
  Object.keys(bw).forEach(function (k) { if (bw[k]) out.wrong[k] = Object.assign({}, bw[k]); });
  Object.keys(iw).forEach(function (k) {
    var b = iw[k];
    if (!b) return;
    var a = out.wrong[k];
    if (!a) { out.wrong[k] = Object.assign({}, b); return; }
    var merged = Object.assign({}, a);
    Object.keys(b).forEach(function (f) { if (merged[f] == null || merged[f] === '') merged[f] = b[f]; });
    merged.ts = Math.min(a.ts || Infinity, b.ts || Infinity);
    merged.due = Math.min(a.due || Infinity, b.due || Infinity);
    merged.n = Math.max(a.n || 1, b.n || 1);
    out.wrong[k] = merged;
  });

  var bm = (base && base.meta) || {}, im = (incoming && incoming.meta) || {};
  var bc = typeof bm.created === 'number' ? bm.created : Infinity;
  var ic = typeof im.created === 'number' ? im.created : Infinity;
  var created = Math.min(bc, ic);
  out.meta.round = Math.max(bm.round || 0, im.round || 0);
  out.meta.lastKind = Object.assign({}, bm.lastKind || {}, im.lastKind || {});
  if (created !== Infinity) out.meta.created = created;
  return out;
}
window.__ltMerge = { pickIdent: pickIdent, recSig: recSig, mergeRecords: mergeRecords };
</script>

<script id="sync">
var LT_SUBJECT = "化学";
/* 云同步编排 · 纯函数（网络 I/O 由页面薄适配层负责）
 * ============================================================
 * 真源仍是各设备浏览器（GLOSSARY 同步载体）；本模块只决定「拉全部后怎么合、写回什么」。
 * 网络适配（GitHub Contents API + PAT + sha 乐观锁）不在此处，本机测试覆盖不到，
 * 由页面侧 sync-adapter 把快照读写接到 fetch，编排保持可测。
 */

/**
 * 由本机 DB 生成写进载体的快照：只带 recs/wrong/meta，打上 deviceId，丢弃设备态。
 */
function carrierSnapshot(deviceId, db, subject) {
  var merged = mergeRecords(db, { v: 1, recs: [], wrong: {}, meta: {} });
  return {
    v: 1,
    deviceId: deviceId,
    subject: subject || subjectFromId(deviceId) || '',
    recs: merged.recs,
    wrong: merged.wrong,
    meta: merged.meta
    /* days / lastRound / dayPlan / sess 故意不带上 */
  };
}

/** 从 deviceId 前缀推断科目（形如「物理|legacy-2026-11-18」）。无前缀返回空串。 */
function subjectFromId(deviceId) {
  var s = String(deviceId || '');
  var i = s.indexOf('|');
  return i > 0 ? s.slice(0, i) : '';
}

/** 判断快照是否属于本科：优先看 subject 字段，回退 deviceId 前缀；两者都无则视为本科（兼容最老的裸快照）。 */
function belongsToSubject(snapshot, deviceId, expected) {
  if (!expected) return true;                       // 未指定科目：不过滤（老调用方）
  var tag = snapshot.subject || subjectFromId(snapshot.deviceId || deviceId);
  return tag ? tag === expected : true;
}

/**
 * 同步编排：本机 DB + 全部设备快照 → 合并后的本机 DB + 要写回的快照。
 * @param local 本机 DB（浏览器里读出的完整结构）
 * @param allSnapshots { [deviceId]: snapshot } 从载体拉到的全部快照
 * @param deviceId 本机设备标识
 * @returns {{ db, snapshot, writeTargets }}
 */
function syncPlan(local, allSnapshots, deviceId, subject) {
  var acc = { v: 1, recs: [], wrong: {}, meta: {} };
  // 本机先并入（保证本机最新作答不被远端旧快照盖掉）
  acc = mergeRecords(acc, local);
  // 再并入本科设备快照（包括自己旧的那份，取并集不会丢）；异科快照一律跳过，防串科
  var ids = Object.keys(allSnapshots || {}).sort();
  for (const id of ids) {
    var s = allSnapshots[id];
    if (s && typeof s === 'object' && belongsToSubject(s, id, subject)) acc = mergeRecords(acc, s);
  }
  // 写回：只覆盖自己那份
  var snapshot = carrierSnapshot(deviceId, acc, subject);
  var writeTargets = {};
  writeTargets[deviceId] = snapshot;
  return { db: acc, snapshot: snapshot, writeTargets: writeTargets };
}
window.__ltSync = { carrierSnapshot: carrierSnapshot, syncPlan: syncPlan, subjectFromId: subjectFromId };
/* 云同步网络适配层（内联进产物；GitHub Contents API + PAT + sha 乐观锁）
 * ============================================================
 * 本机测试覆盖不到真实 fetch，故这里刻意做薄：只负责 I/O 与提示，
 * 合并编排全部交给 window.__ltSync.syncPlan（已单测）。
 * 由各族 UI 注入宿主接口后调用：
 *   window.__ltSyncUI.init({ getDB, setDB, key, notify })
 *   window.__ltSyncUI.run()  // 点按钮触发
 * PAT 存本机浏览器；科目由 build 注入的 LT_SUBJECT 常量确定，
 * deviceId 带科目前缀、快照按科分目录 —— 三科互不污染（本次修复）。
 * sha 409 冲突时重拉→重并→重写（最多 3 次）。
 */
(function () {
  'use strict';
  var REPO = 'ataotao/ataotao.github.io_learning-records';
  var API = 'https://api.github.com/repos/' + REPO + '/contents';
  var HOST = null, BRANCH = null, CONFLICT_RETRY = 3;
  var PAT_KEY = '__lt_pat_v1';

  var PAT_HELP = '先到 GitHub → 头像 → Settings → Developer settings → Personal access tokens ' +
    '→ Fine-grained tokens 生成：只选 ' + REPO + ' 这一个仓，权限只开 Contents（读写），' +
    '把生成的令牌填这里（只显示一次）。它存在本机浏览器，随时可在 GitHub 撤销。';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} return true; }

  /** 当前科目：build 注入常量优先，宿主 subject 兜底（未注入时退化为不分科的老行为）。 */
  function subject() {
    if (typeof LT_SUBJECT !== 'undefined' && LT_SUBJECT) return LT_SUBJECT;
    return (HOST && HOST.subject) || '';
  }
  /** 快照所在子目录（按科隔离）；英文/中文科目名都做路径编码。 */
  function deviceDir(s) { return '/devices' + (s ? '/' + encodeURIComponent(s) : ''); }

  function deviceId() {
    var s = subject();
    var key = '__lt_device_id_v1' + (s ? '_' + s : '');
    var id = lsGet(key);
    if (!id) {
      id = (s ? s + '|' : '') + 'dev-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e6).toString(36);
      lsSet(key, id);
    }
    return id;
  }
  function headers() {
    return { 'Authorization': 'Bearer ' + (lsGet(PAT_KEY) || ''), 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  }

  /* 探测默认分支：失败回退 main，不写死成唯一路径 */
  async function detectBranch() {
    if (BRANCH) return BRANCH;
    try {
      var r = await fetch('https://api.github.com/repos/' + REPO, { headers: headers() });
      if (r.ok) { var j = await r.json(); BRANCH = j.default_branch || 'main'; return BRANCH; }
    } catch (e) {}
    BRANCH = 'main';
    return BRANCH;
  }

  async function pullAll(s) {
    var dir = deviceDir(s);
    var r = await fetch(API + dir, { headers: headers() });
    if (r.status === 404) {
      // 本科目录还不存在（首次同步），视为空载体（正常情况，不是错误）
      return {};
    }
    if (!r.ok) {
      var msg = r.status === 401 ? 'PAT 无效或已过期，请重新生成并填入'
        : r.status === 403 ? 'PAT 没有该仓权限（需 Contents 读写）'
          : '拉取目录失败 ' + r.status;
      throw new Error(msg);
    }
    var list = await r.json();
    var out = {}, failed = 0;
    for (const item of list) {
      if (!/\.json$/i.test(item.name)) continue;
      var fr = await fetch(item.download_url || (API + dir + '/' + encodeURIComponent(item.name)), { headers: headers() });
      if (!fr.ok) { failed++; continue; }
      try {
        var j = await fr.json();
        var key = String(j.deviceId || item.name.replace(/\.json$/, ''));
        // 双保险：目录已按科分，这里再按 deviceId 前缀过滤一次，拦住误放进来的异科快照
        var tag = j.subject || (key.indexOf('|') > 0 ? key.slice(0, key.indexOf('|')) : '');
        if (s && tag && tag !== s) { continue; }   // 明确异科：丢掉
        if (s && !tag) { j.subject = s; }          // 无标签老快照：按所在目录归科，杜绝裸快照串科
        out[key] = j;
      } catch (e) { failed++; }
    }
    if (failed) HOST && HOST.notify('有 ' + failed + ' 份快照未能读取，已跳过（下次同步会重试）');
    return out;
  }

  async function pushOne(id, snapshot, branch, s) {
    var url = API + deviceDir(s) + '/' + encodeURIComponent(
      (id.indexOf('|') > 0 ? id.slice(id.indexOf('|') + 1) : id) + '.json'
    );
    var sha = null;
    var cur = await fetch(url, { headers: headers() });
    if (cur.ok) { var cj = await cur.json(); sha = cj.sha; }
    var body = {
      message: 'sync ' + id + ' ' + new Date().toISOString(),
      content: btoa(unescape(encodeURIComponent(JSON.stringify(snapshot, null, 2)))),
      branch: branch || 'main'
    };
    if (sha) body.sha = sha;
    var r = await fetch(url, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, headers()), body: JSON.stringify(body) });
    if (r.status === 409) return false;   // 冲突：交给上层重拉重并重写
    if (!r.ok) {
      var e = await r.json().catch(function () { return {}; });
      throw new Error('写回失败 ' + r.status + (e.message ? '：' + e.message : ''));
    }
    return true;
  }

  window.__ltSyncUI = {
    init: function (host) { HOST = host; },
    setPAT: function (pat) { return lsSet(PAT_KEY, String(pat || '').trim()); },
    hasPAT: function () { return !!lsGet(PAT_KEY); },
    patHelp: PAT_HELP,
    deviceId: deviceId,
    subject: subject,
    run: async function () {
      if (!HOST) throw new Error('同步未初始化');
      if (!lsGet(PAT_KEY)) { HOST.notify('请先填入 PAT（个人访问令牌）'); return; }
      var s = subject();
      var branch = await detectBranch();
      for (var attempt = 1; attempt <= CONFLICT_RETRY; attempt++) {
        HOST.notify('正在同步…' + (attempt > 1 ? '（冲突重试 ' + attempt + '/' + CONFLICT_RETRY + '）' : ''));
        try {
          var all = await pullAll(s);
          var plan = window.__ltSync.syncPlan(HOST.getDB(), all, deviceId(), s);
          HOST.setDB(plan.db);                   // 合并结果先写回本机：即使云端失败，本机记录也不丢（ADR 决定 6）
          var wrote = await pushOne(deviceId(), plan.snapshot, branch, s);
          if (!wrote) continue;                  // 409：重拉→重并→重写（setDB 幂等，安全）

        (res.res[i].ok ? '' : '（你答：' + esc((S.vals || [])[i] == null ? '未答' : (S.vals || [])[i]) + '）') + '</div>';
    });
    h += '<div class="tipbox" style="margin-top:10px"><b>考点难点：</b>' + esc(q.tip) + '</div>';
    h += '<div style="margin-top:8px"><b>解析：</b>' + (q.explain || []).map(function (line) {
      return '<div class="small">· ' + esc(line) + '</div>';
    }).join('') + '</div>';
    h += '<div class="kpline">考点标签：' + (q.kp || []).map(function (k) { return '<span class="pill">' + esc(k) + '</span>'; }).join(' ') + '</div>';
    return h + '</div>';
  }
  function viewSummary() {
    var s = S.sess, rate = s.total ? Math.round(s.right / s.total * 100) : 0;
    return '<div class="card"><h2>本轮完成</h2>' +
      statBoxes([['做题', s.done], ['答对', s.right], ['正确率', rate + '%']]) +
      '<p class="muted small" style="margin-top:12px">' + esc(rate >= 80 ? fillTpl(T.summaryGood, { plan: PLAN.join(' / ') }) : T.summaryLow) + '</p>' +
      '<div class="row"><button class="btn btn-primary" data-act="again-round">再来一轮（新题）</button>' +
      '<button class="btn" data-go="wrong">去清错题</button><button class="btn btn-ghost" data-go="today">回今日</button></div></div>';
  }
  function viewWrong() {
    var all = Object.keys(DB.wrong).map(function (k) { return DB.wrong[k]; }).sort(function (a, b) { return a.due - b.due; });
    var due = all.filter(function (w) { return w.due <= Date.now(); });
    var list = all.map(function (w) {
      var d = Math.ceil((w.due - Date.now()) / CH.DAY);
      return '<div class="wrongitem"><div class="row"><span class="pill">' + esc(w.kindName || w.kind) + '</span>' +
        (w.due <= Date.now() ? '<span class="pill bad">待复习</span>' : '<span class="due">' + d + ' ' + T.dueUnit + '</span>') +
        '<span class="grow"></span><span class="small muted">' + T.wrongTimes + ' ' + (w.n || 1) + ' 次</span>' +
        '<button class="btn btn-ghost btn-sm" data-del="' + esc(w.key) + '">移除</button></div>' +
        '<div class="small">' + esc(w.prompt) + '</div></div>';
    }).join('');
    return '<div class="card"><div class="row"><h2 style="margin:0">错题回炉</h2><span class="pill">共 ' + all.length + ' 道</span></div>' +
      '<p class="muted small">' + esc(fillTpl(T.wrongIntro, { plan: PLAN.join(' / ') })) + '</p>' +
      '<div class="row">' + (due.length ? '<button class="btn btn-primary" data-act="wrongdue">复习到期题（' + due.length + '）</button>' : '<span class="small muted">今天没有到期错题，明天再来。</span>') +
      (all.length ? '<button class="btn" data-act="wrongall">全部错题练一遍</button>' : '') + '</div>' +
      (list || '<p class="muted">错题库是空的，先去做几题吧。</p>') + '</div>';
  }
  function viewReport() {
    var recs = DB.recs, st = stats();
    var byMod = {};
    CH.modules.forEach(function (m) { byMod[m.id] = { n: 0, ok: 0, name: m.name }; });
    recs.forEach(function (r) { var b = byMod[r.mod] || (byMod[r.mod] = { n: 0, ok: 0, name: r.mod }); b.n++; if (r.ok) b.ok++; });
    var mods = Object.keys(byMod).filter(function (k) { return byMod[k].n; }).map(function (k) {
      var b = byMod[k], rate = Math.round(b.ok / b.n * 100);
      return '<div style="margin:8px 0"><div class="row small"><b>' + esc(b.name) + '</b><span class="grow"></span>' +
        '<span class="muted">' + b.ok + '/' + b.n + ' · ' + rate + '%</span></div>' +
        '<div class="progress"><i style="width:' + rate + '%;background:' + (rate >= 80 ? 'var(--ok)' : (rate >= 60 ? 'var(--warn)' : 'var(--bad)')) + '"></i></div></div>';
    }).join('');
    var kps = {};
    recs.forEach(function (r) { (r.kp || []).forEach(function (k) { var x = kps[k] || (kps[k] = { n: 0, ok: 0 }); x.n++; if (r.ok) x.ok++; }); });
    var weak = Object.keys(kps).filter(function (k) { return kps[k].n >= 2; })
      .map(function (k) { return { k: k, rate: kps[k].ok / kps[k].n, n: kps[k].n }; })
      .sort(function (a, b) { return a.rate - b.rate; }).slice(0, 8);
    var weakHtml = weak.length ? weak.map(function (w) {
      return '<div class="row small"><span>' + esc(w.k) + '</span><span class="grow"></span>' +
        '<span class="pill ' + (w.rate >= .8 ? 'ok' : (w.rate >= .6 ? 'warn' : 'bad')) + '">' + Math.round(w.rate * 100) + '% (' + w.n + ')</span></div>';
    }).join('') : '<p class="muted small">做题满 2 次后，这里会显示最需要复习的考点。</p>';
    return '<div class="card"><h2>训练报告</h2>' +
      statBoxes([['累计做题', st.done], ['累计答对', st.right], ['总正确率', st.rate + '%'], ['错题待清', st.wrong]]) +
      '<h3>各单元正确率</h3>' + (mods || '<p class="muted small">还没有记录。</p>') +
      '<h3>薄弱考点（正确率最低）</h3>' + weakHtml +
      '<div class="row" style="margin-top:16px"><button class="btn" data-act="export">导出记录 JSON</button>' +
      '<button class="btn" data-act="import">导入记录 JSON</button>' +
      '<input type="file" id="importFile" accept="application/json,.json" style="display:none">' +
      '<button class="btn btn-ghost" data-act="reset">清空记录</button></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn btn-ghost" data-act="sync">云同步（跨设备）</button>' +
      '<button class="btn btn-ghost" data-act="pathelp" title="PAT 怎么生成">PAT 是什么？</button>' +
      '<input id="syncPat" type="password" placeholder="GitHub PAT（只填一次，存本机）" style="flex:1;min-width:180px;padding:8px;border:1px solid var(--line);border-radius:8px">' +
      '<span id="syncMsg" class="small muted"></span></div></div>';
  }

  /* ---------- 事件绑定 ---------- */
  function bind() {
    Array.prototype.forEach.call(tabsBar.querySelectorAll('[data-go]'), function (b) {
      b.onclick = function () { clearSess(); go(b.getAttribute('data-go')); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-go]'), function (b) {
      b.onclick = function () { clearSess(); go(b.getAttribute('data-go')); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-mod]'), function (c) {
      c.onclick = function () { go('mod', c.getAttribute('data-mod')); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-kind]'), function (c) {
      c.onclick = function () { startRound(S.mod, c.getAttribute('data-kind'), 10); saveSess(); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-choice]'), function (b) {
      b.onclick = function () {
        if (S.answered) return;
        var i = parseInt(b.getAttribute('data-choice'), 10);
        Array.prototype.forEach.call(app.querySelectorAll('[data-choice="' + i + '"]'), function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
        if (S.q) { S.vals = S.vals || []; S.vals[i] = parseInt(b.getAttribute('data-choice-val'), 10); }
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-del]'), function (b) {
      b.onclick = function () { removeWrong(b.getAttribute('data-del')); save(); render(); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-act]'), function (b) {
      b.onclick = function () { action(b.getAttribute('data-act')); };
    });
    var fileEl = document.getElementById('importFile');
    if (fileEl) fileEl.onchange = function () {
      var f = fileEl.files && fileEl.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { importText(String(rd.result)); };
      rd.readAsText(f, 'utf-8');
      fileEl.value = '';
    };
  }
  function action(a) {
    if (a === 'all') { startRound(null, null, 10); }
    else if (a === 'all20') { startRound(null, null, 20); }
    else if (a === 'modround') { startRound(S.mod, null, 10); }
    else if (a === 'modexample') {
      var m = CH.moduleById(S.mod), k = m && m.kinds[0];
      if (k) { S.back = { view: 'mod', mod: S.mod }; startRound(S.mod, k.id, 1, 'example'); }
    } else if (a === 'skip') {
      if (S.sess) { S.sess.total++; S.sess.done++; }
      nextQuestion(); saveSess(); return;
    } else if (a === 'submit') {
      S.vals = readVals(); submit(); saveSess(); return;
    } else if (a === 'hint') { S.hint = !S.hint; saveSess(); render(); return; }
    else if (a === 'next') { S.sess.done++; clearSess(); nextQuestion(); saveSess(); return; }
    else if (a === 'again') { S.answered = false; S.res = null; S.vals = null; saveSess(); render(); return; }
    else if (a === 'resume') { if (restore()) { render(); return; } }
    else if (a === 'wrongdue') { startRound(null, null, 20, 'wrong'); }
    else if (a === 'wrongall') { startRound(null, null, Object.keys(DB.wrong).length, 'wrongall'); }
    else if (a === 'again-round') { clearSess(); var mm = S.sess && S.sess.mod, kk = S.sess && S.sess.kind; startRound(mm, kk, 10); }
    else if (a === 'exit') { clearSess(); go('today'); return; }
    else if (a === 'export') {
      var blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
      var u = URL.createObjectURL(blob), a2 = document.createElement('a');
      a2.href = u; a2.download = T.downloadName; a2.click(); URL.revokeObjectURL(u); return;
    } else if (a === 'import') {
      document.getElementById('importFile').click(); return;
    } else if (a === 'reset') {
      if (confirm(T.resetConfirm)) { DB = emptyDB(); clearSess(); save(); render(); return; }
    } else if (a === 'sync') {
      var patEl = document.getElementById('syncPat');
      if (patEl && patEl.value) window.__ltSyncUI.setPAT(patEl.value);
      window.__ltSyncUI.run(); return;   // 异步：内部 setDB → save/render，不在此重复
    } else if (a === 'pathelp') {
      alert(window.__ltSyncUI.patHelp); return;
    }
    save(); render();
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && S.view === 'quiz') {
      e.preventDefault();
      if (S.answered) action('next'); else action('submit');
    }
    if (e.key === 'Escape' && S.view === 'quiz') action('exit');
  });
  window.addEventListener('hashchange', function () {
    var p = parseHash(), v = p.view;
    if (v === 'today') go('today'); else if (v === 'wrong') go('wrong');
    else if (v === 'report') go('report');
    else if (v === 'mod' && p.m) go('mod', p.m, p.k || null);
  });

  /* 段三：云同步适配层注入宿主接口（DB 读写/通知），按钮 data-act="sync" 触发 */
  if (window.__ltSyncUI) window.__ltSyncUI.init({
    getDB: function () { return DB; },
    setDB: function (d) { DB = d; save(); render(); },
    notify: function (msg) { var el = document.getElementById('syncMsg'); if (el) el.textContent = msg; }
  });

  /* 启动即读 hash；带 hash 进入不恢复上次位置（契约） */
  boot();
  window[CFG.global] = { S: S, DB: DB, CH: CH, go: go, startRound: startRound, action: action,
    save: save, load: load, render: render, mergeRecords: mergeRecords, importText: importText };
})();
</script>
