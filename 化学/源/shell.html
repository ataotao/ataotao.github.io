<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>化学思维脚手架 · 九上</title>
<style>
:root{
  --acc:#0e7490; --acc2:#0b5c73; --acc-soft:#e6f4f8;
  --bg:#fbfaf7; --card:#ffffff; --line:#e6e2da; --ink:#26211c; --mut:#6f665a;
  --ok:#1a7f4b; --ok-soft:#e8f6ee; --bad:#c0392b; --bad-soft:#fdeceb;
  --warn:#b07b12; --warn-soft:#fdf4e3;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.72 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
header.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header.top h1{font-size:26px;margin:0;letter-spacing:.5px}
header.top .sub{color:var(--mut);font-size:13px;margin-top:2px}
.pill{
  margin-left:auto;background:var(--acc-soft);color:var(--acc2);border:1px solid #cfe6ee;
  border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;white-space:nowrap;
}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:24px;position:sticky;top:0;background:var(--bg);z-index:9;padding-top:4px}
nav.tabs button{
  appearance:none;border:0;background:transparent;font:inherit;font-size:15px;color:var(--mut);
  padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;border-radius:8px 8px 0 0;
}
nav.tabs button:hover{background:#f3f0ea;color:var(--ink)}
nav.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc);font-weight:600;background:transparent}
section.view{display:none}
section.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:17px}
.card h4{margin:16px 0 6px;font-size:15px;color:var(--acc2)}
.card p{margin:8px 0}
.mut{color:var(--mut);font-size:13.5px}
.small{font-size:13px}

.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.scorebox .k{font-size:12.5px;color:var(--mut);letter-spacing:.4px}
.scorebox .v{font-size:26px;font-weight:700;color:var(--acc2);line-height:1.3}
.scorebox .v small{font-size:14px;font-weight:500;color:var(--mut)}

.lead{background:linear-gradient(180deg,#f2fafc,#ffffff);border:1px solid #d5eaf1;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.lead b{color:var(--acc2)}

ul.tight{margin:6px 0 6px 0;padding-left:20px}
ul.tight li{margin:4px 0}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--mut);font-weight:600;background:#faf8f4;letter-spacing:.3px}
tr:last-child td{border-bottom:0}
td.no{width:44px;color:var(--mut);font-variant-numeric:tabular-nums}
td.ans{width:64px;font-weight:700;letter-spacing:1px}
.tag-ok{color:var(--ok);font-weight:700}
.tag-bad{color:var(--bad);font-weight:700}
.tag-pend{color:var(--warn);font-weight:700}

.qt{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);overflow:hidden}
.qt summary{cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:600;list-style:none}
.qt summary::-webkit-details-marker{display:none}
.qt summary::before{content:"▸";color:var(--mut);font-size:12px;transition:transform .15s}
.qt[open] summary::before{transform:rotate(90deg)}
.qt .body{padding:0 16px 16px;border-top:1px dashed var(--line);margin-top:2px}
.qt .stem{margin-top:12px;color:var(--ink)}
.qt .why{background:#faf8f4;border-left:3px solid var(--acc);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:12px;font-size:14px;white-space:pre-wrap}
.qt .why b{color:var(--acc2)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:#f1eee8;color:var(--mut);margin-left:auto;font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.pend{background:var(--warn-soft);color:var(--warn)}

.blanks{display:grid;gap:8px;margin-top:12px}
.blankrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfbf9}
.blankrow .q{font-size:14px}
.blankrow .line{font-size:13.5px;color:var(--mut);margin-top:4px}
.blankrow .line em{font-style:normal;color:var(--ink);font-weight:600}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}

.mod{border-left:4px solid var(--acc);padding-left:14px;margin:22px 0}
.mod h3{margin:0 0 4px;font-size:17px}
.mod .gist{color:var(--mut);font-size:13px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:14px}
.kv b{color:var(--acc2);font-weight:600}

.tpl{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);margin-bottom:12px}
.tpl h4{margin:0 0 6px;color:var(--acc2);font-size:15px}
.steps{counter-reset:s;margin:8px 0 0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:26px;margin:6px 0;font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;background:var(--acc-soft);color:var(--acc2);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}

.drillbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.btn{appearance:none;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;font-size:14px;padding:8px 16px;border-radius:9px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--acc2);border-color:#cfe0e6}
.btn:hover{filter:brightness(1.06)}
.prog{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.qcard .qn{font-size:12.5px;color:var(--mut);margin-bottom:6px}
.qcard .stem{font-size:16px;font-weight:600;margin-bottom:14px;line-height:1.7}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;background:#fdfcfa;transition:.12s}
.opt:hover{border-color:#bfd8e0;background:#f7fbfc}
.opt .l{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1px solid #cfc7ba;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);margin-top:2px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.dim{opacity:.62}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;display:none;white-space:pre-wrap}
.fb.on{display:block}
.fb.ok{background:var(--ok-soft);border:1px solid #bfe3ce}
.fb.bad{background:var(--bad-soft);border:1px solid #f0c9c5}
.fb b{color:var(--acc2)}

/* 错题回炉：分子/离子速记卡 */
.refcard{margin:-2px 0 14px;border:1px solid #cfe6ee;border-radius:12px;background:#f2fafc;overflow:hidden}
.refcard>summary{cursor:pointer;padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--acc2);list-style:none;display:flex;align-items:center;gap:8px}
.refcard>summary::-webkit-details-marker{display:none}
.refcard>summary::before{content:"▸";font-size:11px;transition:transform .15s}
.refcard[open]>summary::before{transform:rotate(90deg)}
.refcard .refbody{padding:0 14px 13px;border-top:1px dashed #cfe6ee}
.refcard .reflead{font-size:13px;color:var(--mut);margin:10px 0 8px}
.refcard table{font-size:13px;background:transparent}
.refcard th,.refcard td{padding:6px 8px;border-bottom:1px solid #dceef4;vertical-align:top;background:transparent}
.refcard th{background:#e6f4f8;font-size:12.5px;white-space:nowrap}
.refcard tr:last-child td{border-bottom:0}
.refcard td:first-child{white-space:nowrap;color:var(--acc2)}
.refcard .refsub{margin:12px 0 5px;font-size:13px;color:var(--acc2);font-weight:600}
.refcard .reflines{margin:0;padding-left:18px;font-size:13px}
.refcard .reflines li{margin:3px 0}
.refcard .ionline{font-size:13px;margin:3px 0;padding-left:2px}
.refcard .ionline b{color:var(--acc2)}
.refcard .reftips{margin:10px 0 0;padding:9px 12px;background:#fff;border-left:3px solid var(--warn);border-radius:0 8px 8px 0;font-size:12.5px}
.refcard .reftips li{margin:4px 0}
.refcard .reftips b{color:var(--acc2)}

.empty{color:var(--mut);font-size:14px;padding:10px 0}
kbd{background:#f1eee8;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;font-family:inherit}
hr.sep{border:0;border-top:1px dashed var(--line);margin:18px 0}

/* ⑥ 原卷重做 */
.paper-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.paper-head h3{margin:0}
.paper-meta{font-size:13px;color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:12px}
.thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#faf8f4;cursor:zoom-in;transition:transform .12s,border-color .12s}
.thumb:hover{transform:translateY(-2px);border-color:var(--acc)}
.thumb img{display:block;width:100%;height:168px;object-fit:cover;object-position:top center}
.thumb .cap{font-size:12.5px;color:var(--mut);padding:6px 8px;text-align:center;background:var(--card)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:8px;background:var(--acc);color:#fff;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--acc2);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.06)}
.lightbox{position:fixed;inset:0;background:rgba(22,20,18,.92);display:none;align-items:center;justify-content:center;z-index:99;gap:12px;padding:16px}
.lightbox.on{display:flex}
.lightbox img{max-width:88vw;max-height:86vh;object-fit:contain;background:#fff}
.lbbtn{appearance:none;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;width:42px;height:42px;border-radius:50%;cursor:pointer;flex:none}
.lbbtn:hover{background:rgba(255,255,255,.28)}
.lbclose{position:fixed;top:14px;right:18px;font-size:14px;width:auto;height:auto;padding:6px 12px}
/* 逐题练习 */
.practice-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.practice-bar .grow{flex:1}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.qnav button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.qnav button.cur{border-color:var(--acc);color:#fff;background:var(--acc);font-weight:700}
.qnav button.done{background:var(--ok-soft);border-color:#bfe3cd;color:var(--ok)}
.qnav button.wrong{background:var(--bad-soft);border-color:#f2c9c4;color:var(--bad)}
.qnav button.self{background:var(--warn-soft);border-color:#efdca9;color:var(--warn)}
.prac-q{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card)}
.prac-q .stem{font-size:15.5px;line-height:1.8;margin:10px 0 14px}
.srcimg{border:1px dashed var(--line);border-radius:10px;background:#faf8f4;padding:8px;margin:8px 0 14px}
.srcimg summary{cursor:pointer;font-size:13px;color:var(--acc2);font-weight:600}
.srcimg .shots{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.crop{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
.crop .fill{position:absolute;background-repeat:no-repeat;background-size:100% 100%}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px 12px;margin:6px 0;font:inherit;font-size:14.5px;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.blankrow{margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:9px}
.blankrow .ask{font-size:14px;margin-bottom:6px}
.blankrow input,.blankrow textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.blankrow textarea{min-height:64px;resize:vertical}
.verdict{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:13.5px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.self{background:var(--warn-soft);color:var(--warn)}
.ansbox{margin-top:8px;padding:10px 12px;background:#f7f5f0;border:1px solid var(--line);border-radius:9px;font-size:13.5px}

/* 采分点自检 */
.ptbox{margin-top:10px;background:var(--warn-soft);border:1px solid #efdca9;border-radius:9px;padding:10px 12px}
.pthd{font-size:13px;font-weight:700;color:var(--warn);margin-bottom:7px}
.ptgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:5px}
.ptitem{display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.5;padding:5px 9px;border-radius:7px;background:#fff;border:1px solid #f0e3c8;cursor:pointer}
.blankrow .ptbox .ptitem input[type=checkbox]{width:14px;height:14px;flex:none;margin:3px 0 0}
.ptitem span{flex:1;min-width:0}
.ptitem.on{background:var(--ok-soft);border-color:#bfe3cd;color:var(--ok)}
.ptitem.miss{background:var(--bad-soft);border-color:#f2c9c4;color:var(--bad)}
.ptsum{margin-top:8px;font-size:12.5px;color:var(--mut)}
.ptsum b{color:var(--warn)}

/* 答题要素 + 错空复盘 */
.wtab td,.wtab th{vertical-align:top}
.wtab .qcol{width:96px;font-weight:700;color:var(--acc2);font-size:13px}
.wcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fcfbf9}
.wcard .wt{font-size:12.5px;color:var(--acc2);font-weight:700;margin-bottom:5px}
.wcard .wt .k{background:var(--acc-soft);border-radius:5px;padding:1px 6px;margin-right:6px;color:var(--acc2)}
.wcard .wl{font-size:13.5px;margin:3px 0}
.wcard .wl .lab{color:var(--mut);font-size:12.5px;margin-right:4px}
.wcard .wl .bad{color:var(--bad);font-weight:600}
.wcard .wl .good{color:var(--ok);font-weight:600}
.errow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.errow button{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
.errow button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.errbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.errbar .eb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px}
.errbar .eb b{color:var(--acc2);font-size:16px;margin-left:4px}
.errbar .eb.top{border-color:var(--acc);background:var(--acc-soft)}
@media(max-width:640px){
  .wtab thead{display:none}
  .wtab,.wtab tbody,.wtab tr,.wtab td{display:block;width:auto}
  .wtab tr{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px;background:#fcfbf9}
  .wtab td{border:0;padding:3px 0;font-size:13px}
  .wtab td.qcol{font-size:14.5px;font-weight:700;margin-bottom:3px}
  .wtab td[data-l]:before{content:attr(data-l);display:inline-block;min-width:66px;color:var(--mut);font-size:12px}
  .errbar .eb{padding:5px 10px;font-size:12.5px}
}
#print-area{display:none}
@media print{
  body *{visibility:hidden!important}
  #print-area,#print-area *{visibility:visible!important}
  #print-area{display:block!important;position:absolute;left:0;top:0;width:100%;color:#000;font-size:12pt}
  #print-area img{max-width:100%;page-break-after:always}
  #print-area .phead{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  #print-area .q{margin:10px 0;page-break-inside:avoid}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>化学 · 思维脚手架</h1>
      <div class="sub">九上 · 期中诊断 + 知识框架 + 题型模板 + 错题回炉 + 原卷重做</div>
    </div>
    <div class="pill" id="pill">—</div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <section class="view" id="v-diag"></section>
  <section class="view" id="v-map"></section>
  <section class="view" id="v-method"></section>
  <section class="view" id="v-drill"></section>
  <section class="view" id="v-paper"></section>
  <section class="view" id="v-doc"></section>

</div>

<div class="lightbox" id="lightbox" role="dialog" aria-label="原卷放大">
  <button class="lbbtn" id="lb-prev" title="上一张">‹</button>
  <img id="lb-img" src="" alt="原卷">
  <button class="lbbtn" id="lb-next" title="下一张">›</button>
  <button class="btn ghost lbclose" id="lb-close">关闭（Esc）</button>
</div>
<div id="print-area" aria-hidden="true"></div>

<script>
/*__DATA__*/
</script>
<script>
(function () {
  'use strict';

  var D = window.__DATA__ || { exam: { questions: [] }, drill: { items: [] }, papers: [], banks: {} };
  var EXAM = D.exam, DRILL = D.drill, PAPERS = D.papers || [], BANKS = D.banks || {};
  var KEY = 'chemScaffold.v1';

  // ---------- 存储 ----------
  function load() {
    try { var v = JSON.parse(localStorage.getItem(KEY) || 'null'); return v || { stat: {}, days: {} }; }
    catch (e) { return { stat: {}, days: {} }; }
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  var S = load();

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function logAnswer(id, ok) {
    var st = S.stat[id] || (S.stat[id] = { att: 0, ok: 0, wrong: 0, at: 0 });
    st.att++; if (ok) st.ok++; else st.wrong++;
    st.at = Date.now();
    var k = todayKey();
    var d = S.days[k] || (S.days[k] = { n: 0, ok: 0 });
    d.n++; if (ok) d.ok++;
    save(S);
  }

  // ---------- 统计 ----------
  var QS = EXAM.questions || [];
  var CHOICE = QS.filter(function (q) { return q.type === 'choice'; });
  var FILLS = QS.filter(function (q) { return q.type === 'fill'; });
  var isPend = function (b) { return /待核|无法判/.test(String(b.mine || '')); };

  function score() {
    var cOk = 0, cPts = 0;
    CHOICE.forEach(function (q) { cPts += q.pts; if (q.ok) cOk += q.pts; });
    var fPts = 0, fGet = 0, fPend = 0;
    FILLS.forEach(function (q) {
      fPts += q.pts;
      var per = q.pts / q.blanks.length;
      q.blanks.forEach(function (b) { if (b.ok) fGet += per; if (isPend(b)) fPend++; });
    });
    return { cPts: cPts, cOk: cOk, fPts: fPts, fGet: fGet, fPend: fPend, total: cPts + fPts, get: cOk + fGet };
  }

  // 官方成绩单（批改系统实际给分），替代逐空估算用于对外呈现
  var OFFICIAL = EXAM.meta.score || null;
  var OFFICIAL_BY_Q = (function () {
    var map = {};
    ((OFFICIAL && OFFICIAL.parts) || []).forEach(function (p) {

  // 十条答题要素：问法 → 必写什么 → 他的原答 → 该有的样子
  var TPLW = [

    ['作用类', '写全 2–3 件事：吸收什么、防止什么、帮助什么', '「分子在不停降温」', '「吸收 P₂O₅ 白烟、防止污染空气、降温助冷」'],
    ['微观解释', '必须点到「分子／原子」，并指明「间隔／运动／种类／构成」哪一项变了', '「物理变化」', '「分子间隔变大，分子本身没有变」'],
    ['名称类', '只写名称（仪器／操作／方法），不写用途、不写变化类型', '「通过分液漏斗控制」', '「量筒」'],

    ['控制变量与条件', '先说「只变了什么」，答案填「变的那一项」；问条件要写全（谁＋多少）', '「催化剂」', '「过氧化氢溶液的浓度」'],
    ['判断 + 理由', '两问问两答：先给标号，再给判据（元素守恒／活动性／有无新物质）', '选 C，理由写「二氧化锰」', '「D，反应物里没有碳元素」'],
    ['画图（微观）', '先数原子总数，再画分子，只画题目要求的那一侧', '已画，但看不出对不对', '「反应前画 3 个 O₂，每个 2 个氧原子」']

  // 错因归类（本地保存，不进训练统计）
  var ERRS = ['不知道', '术语不准', '答非所问', '漏要素', '写法错', '读题漏条件'];
  var ERRK = 'chemScaffold.err.v1';
  function errAll() { try { return JSON.parse(localStorage.getItem(ERRK) || '{}') || {}; } catch (e) { return {}; } }
  function errPut(o) { try { localStorage.setItem(ERRK, JSON.stringify(o)); } catch (e) {} }

  function renderErrors() {
    var box = document.getElementById('errbox');
    if (!box) return;
    var map = errAll(), rows = [];
    FILLS.forEach(function (q) {
      (q.blanks || []).forEach(function (b) {
        if (b.ok) return;
        rows.push({ id: q.no + '|' + b.k, no: q.no, k: b.k, ask: b.ask, mine: b.mine || '', ans: b.ans, qt: b.qt || '' });
      });
    });
    var counts = {}, marked = 0;
    ERRS.forEach(function (e) { counts[e] = 0; });
    rows.forEach(function (r) { var e = map[r.id]; if (e) { counts[e] = (counts[e] || 0) + 1; marked++; } });

    var bar = '<div class="errbar">';
    ERRS.forEach(function (e) { bar += '<div class="eb"><span>' + e + '</span><b>' + counts[e] + '</b></div>'; });
    bar += '</div>';

    var top = ERRS.slice().sort(function (a, b) { return counts[b] - counts[a]; })[0];
    var note;
    if (marked < 5) {
      note = '<p class="mut small">已标记 ' + marked + ' / ' + rows.length + ' 个错空。标到 5 个以上，这里会自动给结论。</p>';
    } else if (top === '不知道') {
      note = '<p class="small"><b>最大错因：' + top + '（' + counts[top] + ' 个）</b>——这是真知识缺口，回闪练卡按单元补，补完回来重标。</p>';
    } else {
      note = '<p class="small"><b>最大错因：' + top + '（' + counts[top] + ' 个，占 ' +
        Math.round(counts[top] / marked * 100) + '%）</b>——这不是知识缺口，别再加大刷题量；照上面的要素表练写法。</p>';
    }

    var cards = rows.map(function (r) {
      var cur = map[r.id] || '';
      return '<div class="wcard">' +
        '<div class="wt"><span class="k">第 ' + r.no + ' 题 ' + esc(r.k) + '</span>' + esc(r.qt || '短空') + '</div>' +
        '<div class="wl"><span class="lab">问</span>' + esc(r.ask) + '</div>' +
        '<div class="wl"><span class="lab">你写</span><span class="bad">' + esc(r.mine || '（空白）') + '</span></div>' +
        '<div class="wl"><span class="lab">该写</span><span class="good">' + esc(r.ans) + '</span></div>' +
        '<div class="errow">' + ERRS.map(function (e) {
          return '<button data-err="' + esc(r.id) + '" data-lab="' + e + '"' + (cur === e ? ' class="on"' : '') + '>' + e + '</button>';
        }).join('') + '</div></div>';
    }).join('');

    box.innerHTML = bar + note + cards;

    Array.prototype.forEach.call(box.querySelectorAll('[data-err]'), function (btn) {
      btn.onclick = function () {
        var m = errAll(), id = btn.dataset.err, lab = btn.dataset.lab;
        if (m[id] === lab) delete m[id]; else m[id] = lab;
        errPut(m);
        renderErrors();
      };
    });
  }

  // ---------- ④ 错题回炉 ----------
  var drillList = 'all', dq = null, dTotal = 0, dRight = 0, dAnswered = false;

  function pickQueue() {
    var items = DRILL.items || [];
    var wrongIds = {};
    Object.keys(S.stat).forEach(function (id) { if (S.stat[id].wrong > 0) wrongIds[id] = 1; });
    var pool = drillList === 'wrong' ? items.filter(function (it) { return wrongIds[it.id]; }) : items.slice();
    if (!pool.length) pool = items.slice();
    return pool;
  }

  function renderDrill(reset) {

      '<button class="btn" id="d-start">重新开始</button>' +

  // 分子/离子判断等题的随题速记卡（内容来自 drill.json 的 refs）
  function renderRef(key) {
    var r = (DRILL.refs || {})[key];
    if (!r) return '';
    var h = '<details class="refcard"><summary>' + r.title + ' · 点开速记</summary><div class="refbody">';
    if (r.lead) h += '<div class="reflead">' + r.lead + '</div>';
    if (r.rows && r.rows.length) {
      h += '<table><thead><tr>';
      (r.cols || []).forEach(function (c) { h += '<th>' + c + '</th>'; });
      h += '</tr></thead><tbody>';
      r.rows.forEach(function (row) {
        h += '<tr>';
        row.forEach(function (cell) { h += '<td>' + cell + '</td>'; });
        h += '</tr>';
      });
      h += '</tbody></table>';
    }
    if (r.ionTitle) h += '<div class="refsub">' + r.ionTitle + '</div>';
    (r.ions || []).forEach(function (pair) {
      h += '<div class="ionline"><b>' + pair[0] + '：</b>' + pair[1] + '</div>';
    });
    if (r.groupTitle) h += '<div class="refsub">' + r.groupTitle + '</div>';

      h += '<ul class="reflines">';

    }
    return h + '</div></details>';

  var dIdx = 0;
  function nextDrill() {
    var body = document.getElementById('d-body');
    if (!body) return;
    if (!dq.length) { body.innerHTML = '<div class="empty">没有题目。</div>'; return; }
    if (dIdx >= dq.length) {
      body.innerHTML = '<div class="card" style="text-align:center"><h3>这一轮做完了</h3>' +
        '<p>本轮 ' + dTotal + ' 题，答对 <b>' + dRight + '</b> 题，正确率 ' +
        Math.round(dRight / Math.max(1, dTotal) * 100) + '%</p>' +

        '<button class="btn" id="again">再来一轮</button></div>';
      document.getElementById('again').onclick = function () { dIdx = 0; dq = pickQueue(); dTotal = 0; dRight = 0; nextDrill(); };
      updateProg();
      return;
    }
    var it = dq[dIdx];
    dAnswered = false;
    var h = '<div class="qcard">' +
      '<div class="qn">第 ' + (dIdx + 1) + ' / ' + dq.length + ' 题　·　' + it.tag + '</div>' +
      '<div class="stem">' + it.q + '</div>' +

        Array.prototype.forEach.call(body.querySelectorAll('.opt'), function (x) {
          var j = Number(x.dataset.i);

          else x.classList.add('dim');

        dTotal++; if (ok) dRight++;
        logAnswer(it.id, ok);
        updateProg();

        btn.style.marginTop = '12px';
        btn.onclick = function () { dIdx++; nextDrill(); };
        fb.appendChild(document.createElement('br'));
        fb.appendChild(btn);
      };
    });
    updateProg();
  }

  // ---------- ⑥ 原卷重做 ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  // 用题库生成不含手写答案的干净重做卷；没有题库的卷子退回原图打印

  // ---- 快速练习状态：chemPractice.v1（与 chemScaffold.v1 分开，互不干扰） ----
  var PKEY = 'chemPractice.v1';
  function pload() {
    try { var v = JSON.parse(localStorage.getItem(PKEY) || 'null'); return v || {}; }
    catch (e) { return {}; }
  }
  function psave(v) { try { localStorage.setItem(PKEY, JSON.stringify(v)); } catch (e) {} }
  var PS = pload();
  var curPaper = PAPERS.length ? PAPERS[0] : null;
  var curNo = 1, practiceMode = 'practice';

  // 答案归一化：全角→半角、去空格、去「约/大约」与括号说明、常见等价符号
  function normAns(s) {
    s = String(s == null ? '' : s)
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[\s　]/g, '')
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/^(约|大约|约为)/, '')
      .replace(/[∶：]/g, ':').replace(/[＋]/g, '+').replace(/[－—–]/g, '-')
      .replace(/[，、,]/g, ',').replace(/[。．]/g, '.').replace(/[％%]/g, '%')
      .toLowerCase();
    return s;
  }
  function ansVariants(a) {
    var raw = String(a == null ? '' : a);
    var out = [raw, raw.replace(/[（(][^）)]*[）)]/g, '')];
    return out.filter(Boolean).map(normAns).filter(Boolean);
  }
  function blankIsEssay(b) {
    var a = String(b.ans || '');
    return a.length > 12 || /[；;，,。]/.test(a.replace(/[（(][^）)]*[）)]/g, ''));
  }
  function cropHtml(paper, no) {
    var segs = (paper.crops || {})[String(no)] || [];
    if (!segs.length) return '';
    var size = paper.pageSize || [1400, 1050];
    var allSegs = [];
    segs.forEach(function (s, i) {
      var b = s.box, bw = b[2] - b[0], bh = b[3] - b[1];
      allSegs.push({ id: paper.id, file: s.page + '.webp', label: '题目原图 ' + (i + 1) });
    });
    var shots = segs.map(function (s, i) {
      var b = s.box, bw = b[2] - b[0], bh = b[3] - b[1];
      return '<div class="crop" data-crop="' + i + '" style="aspect-ratio:' + bw + '/' + bh + '">' +
        '<div class="fill" style="background-image:url(images/试卷/' + esc(paper.id) + '/' + esc(s.page) + '.webp);' +
        'width:' + (size[0] / bw * 100).toFixed(3) + '%;height:' + (size[1] / bh * 100).toFixed(3) + '%;' +
        'left:' + (-b[0] / bw * 100).toFixed(3) + '%;top:' + (-b[1] / bh * 100).toFixed(3) + '%"></div></div>';
    }).join('');
    return '<details class="srcimg" open><summary>题目原图（点图看整页放大）</summary><div class="shots">' + shots + '</div></details>';
  }
  function paperQuestions() {
    if (!curPaper) return [];
    var bank = curPaper.bank && BANKS[curPaper.bank];
    return (bank && bank.questions) || [];
  }
  function qState(no) {
    var pid = curPaper.id;
    PS[pid] = PS[pid] || { cur: 1, ans: {} };
    PS[pid].ans[no] = PS[pid].ans[no] || emptyAns();
    var st = PS[pid].ans[no];
    st.pts = st.pts || {};
    return st;
  }
  function emptyAns() { return { pick: '', inputs: {}, checks: {}, reveal: {}, self: {}, pts: {} }; }
  function qStatus(q, st) {
    st = st || emptyAns();
    st.checks = st.checks || {}; st.reveal = st.reveal || {}; st.self = st.self || {}; st.inputs = st.inputs || {}; st.pts = st.pts || {};
    if (q.type === 'choice') return st.pick ? (st.pick === q.ans ? 'right' : 'wrong') : '';
    var blanks = q.blanks || [], n = 0, done = 0, bad = 0, self = 0;
    blanks.forEach(function (b, i) {
      n++;
      if (blankIsEssay(b)) { if (st.reveal[i]) { done++; self++; } }
      else if (st.checks[i]) { done++; if (!st.checks[i]) bad++; }
    });
    if (!done) return '';
    if (bad) return 'wrong';
    return done >= n ? (self && !bad ? 'self' : 'right') : 'doing';
  }
  function renderPractice() {
    var el = document.getElementById('v-paper');
    if (!curPaper) {
      el.innerHTML = '<div class="card"><h3>原卷重做</h3><p class="mut">还没有补录卷子。用 <kbd>node 工具/ingest-paper.mjs "&lt;源目录&gt;" &lt;id&gt;</kbd> 补录一份。</p></div>';
      return;
    }
    var qs = paperQuestions();
    if (!qs.length) { el.innerHTML = '<div class="card"><h3>原卷重做</h3><p class="mut">这份卷子还没有录入题库，暂时只能看原图与打印。</p></div>'; return; }
    if (curNo > qs.length) curNo = qs.length;
    var st = qState(curNo);
    PS[curPaper.id].cur = curNo; psave(PS);

    var doneN = qs.filter(function (q) { var s = qStatus(q, PS[curPaper.id].ans[q.no] || emptyAns()); return s && s !== 'doing'; }).length;
    var nav = qs.map(function (q) {
      var s = qStatus(q, PS[curPaper.id].ans[q.no] || {});
      return '<button data-goto="' + q.no + '" class="' + (q.no === curNo ? 'cur' : (s || '')) + '" title="第 ' + q.no + ' 题">' + q.no + '</button>';
    }).join('');

    var q = qs.filter(function (x) { return x.no === curNo; })[0] || qs[0];
    var body = '<div class="prac-q"><h3 style="margin:0">第 ' + q.no + ' / ' + qs.length + ' 题　<span class="mut small">' +
      (q.type === 'choice' ? '选择题 · ' + q.pts + ' 分' : '填空题 · ' + q.pts + ' 分') + '　' + esc(q.tag || '') + '</span></h3>' +
      cropHtml(curPaper, q.no) + '<div class="stem">' + esc(q.stem) + '</div>';

    if (q.type === 'choice') {
      body += '<div>' + (q.options || []).map(function (o, i) {
        var L = 'ABCD'[i], cls = '';
        if (st.pick) {
          if (L === q.ans) cls = 'right';
          else if (L === st.pick) cls = 'bad';
        } else if (st.pick === L) cls = 'sel';
        return '<button class="opt ' + cls + '" data-pick="' + L + '">' + L + '．' + esc(o) +
          (st.pick && L === q.ans ? '　✅ 正确' : '') + (st.pick && L === st.pick && L !== q.ans ? '　✗ 你选的' : '') + '</button>';
      }).join('') + '</div>';
      if (st.pick) {
        body += '<div class="verdict ' + (st.pick === q.ans ? 'ok' : 'bad') + '">' +
          (st.pick === q.ans ? '✓ 答对了' : '✗ 答错了，正确答案是 ' + q.ans) +
          '　<button class="btn ghost" data-resetq="1" style="padding:3px 9px">重做本题</button></div>' +
          '<div class="ansbox"><b>为什么</b>：' + esc(q.why || '') + '</div>';
      }
    } else {
      body += '<div class="mut small">短空直接核对；长填空先逐条勾「必须写到的要素」，再点看答案——不勾就看不到自己漏了什么。</div>';
      (q.blanks || []).forEach(function (b, i) {
        var essay = blankIsEssay(b), v = st.inputs[i] || '', ck = st.checks[i], rev = st.reveal[i];
        var plist = b.pts || [], ppick = st.pts[i] || {}, pcnt = 0;
        plist.forEach(function (_, j) { if (ppick[j]) pcnt++; });
        var ptHtml = '';
        if (essay && plist.length) {
          ptHtml = '<div class="ptbox"><div class="pthd">写完先自检 · 这空必须写到（逐条勾）</div><div class="ptgrid">' +
            plist.map(function (t, j) {
              return '<label class="ptitem' + (ppick[j] ? ' on' : (rev ? ' miss' : '')) + '">' +
                '<input type="checkbox" data-pt="' + i + ':' + j + '"' + (ppick[j] ? ' checked' : '') + '>' +
                '<span>' + esc(t) + '</span></label>';
            }).join('') + '</div>' +
            '<div class="ptsum">已勾 ' + pcnt + ' / ' + plist.length +
            (pcnt < plist.length ? '　<b>还差 ' + (plist.length - pcnt) + ' 条，先在答案里补上再对</b>' : '　✓ 要素齐了') +
            '</div></div>';
        }
        body += '<div class="blankrow"><div class="ask"><b>' + esc(b.k) + '</b>　' + esc(b.ask) + '</div>' +
          (essay
            ? '<textarea data-input="' + i + '" placeholder="在此写出你的答案">' + esc(v) + '</textarea>'
            : '<input data-input="' + i + '" value="' + esc(v) + '" placeholder="填入答案">') +
          ptHtml +
          '<div style="margin-top:8px">' +
          (essay
            ? '<button class="btn ghost" data-reveal="' + i + '" style="padding:5px 10px">' +
              (rev ? '收起答案' : '看答案自评' + (plist.length ? '（要素 ' + pcnt + '/' + plist.length + '）' : '')) + '</button>'
            : '<button class="btn" data-check="' + i + '" style="padding:5px 10px">核对这一空</button>') +
          (ck ? '<span class="' + (ck ? 'tag-ok' : 'tag-bad') + '" style="margin-left:10px">' + (ck ? '✓ 正确' : '✗ 再看答案') + '</span>' : '') +
          '</div>';
        if (rev) {
          body += '<div class="ansbox"><b>参考答案</b>：' + esc(b.ans) +
            '<div style="margin-top:6px"><b>理由</b>：' + esc(b.why || '') + '</div>' +
            '<div style="margin-top:8px">自己判断：<button class="btn ghost" data-self="' + i + ':ok" style="padding:3px 9px">✓ 我答对了</button> ' +
            '<button class="btn ghost" data-self="' + i + ':no" style="padding:3px 9px">✗ 还要复习</button>' +
            (st.self[i] ? '　<span class="' + (st.self[i] === 'ok' ? 'tag-ok' : 'tag-bad') + '">' + (st.self[i] === 'ok' ? '已记为对' : '已记为待复习') + '</span>' : '') +
            '</div></div>';
        }
        body += '</div>';
      });
    }
    body += '<div class="verdict self">已练 ' + doneN + ' / ' + qs.length + ' 题。作答自动存在本机，刷新可续。</div></div>';

    el.innerHTML = '<div class="practice-bar"><b>' + esc(curPaper.title) + '</b>' +
      '<span class="grow"></span><button class="btn ghost" id="pm-gallery">看整卷原图</button>' +
      '<button class="btn ghost" id="pm-print">打印空白卷</button></div>' +
      '<div class="qnav">' + nav + '</div>' + body +
      '<div class="practice-bar"><button class="btn ghost" id="pq-prev">← 上一题</button><span class="grow"></span>' +
      '<button class="btn" id="pq-next">下一题 →</button></div>';

    // 事件绑定
    Array.prototype.forEach.call(el.querySelectorAll('[data-goto]'), function (b) {
      b.onclick = function () { curNo = parseInt(b.dataset.goto, 10); renderPractice(); window.scrollTo({ top: 0, behavior: 'auto' }); };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-pick]'), function (b) {
      b.onclick = function () { st.pick = b.dataset.pick; psave(PS); renderPractice(); };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-input]'), function (t) {
      t.oninput = function () { st.inputs[t.dataset.input] = t.value; psave(PS); };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-check]'), function (b) {
      b.onclick = function () {
        var i = b.dataset.check, bk = q.blanks[i];
        var u = normAns(st.inputs[i] || '');
        var ok = !!u && ansVariants(bk.ans).some(function (a) { return a === u || (!isNaN(parseFloat(a)) && Math.abs(parseFloat(a) - parseFloat(u)) <= 0.02); });
        st.checks[i] = ok; psave(PS); renderPractice();
      };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-reveal]'), function (b) {
      b.onclick = function () { var i = b.dataset.reveal; st.reveal[i] = !st.reveal[i]; psave(PS); renderPractice(); };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-pt]'), function (cb) {
      cb.onchange = function () {
        var p = cb.dataset.pt.split(':'), i = p[0], j = p[1];
        st.pts[i] = st.pts[i] || {};
        st.pts[i][j] = cb.checked;
        psave(PS);
        renderPractice();
      };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-self]'), function (b) {
      b.onclick = function () { var p = b.dataset.self.split(':'); st.self[p[0]] = p[1]; psave(PS); renderPractice(); };
    });
    var rq = el.querySelector('[data-resetq]');
    if (rq) rq.onclick = function () { st.pick = ''; psave(PS); renderPractice(); };
    el.querySelector('#pq-prev').onclick = function () { if (curNo > 1) { curNo--; renderPractice(); window.scrollTo({ top: 0, behavior: 'auto' }); } };
    el.querySelector('#pq-next').onclick = function () { if (curNo < qs.length) { curNo++; renderPractice(); window.scrollTo({ top: 0, behavior: 'auto' }); } };
    el.querySelector('#pm-gallery').onclick = function () { practiceMode = 'gallery'; renderPaper(); };
    el.querySelector('#pm-print').onclick = function () { printPaper(curPaper.id); };
    Array.prototype.forEach.call(el.querySelectorAll('[data-crop]'), function (c) {
      c.onclick = function () {
        var segs = curPaper.crops[String(curNo)] || [];
        var list = segs.map(function (s) { return { id: curPaper.id, file: s.page + '.webp', label: s.page }; });
        openLightbox(list, parseInt(c.dataset.crop, 10));
      };
    });
  }

  function renderGallery() {
    var el = document.getElementById('v-paper');
    var html = '<div class="practice-bar"><b>整卷原图</b><span class="grow"></span>' +
      '<button class="btn" id="pg-back">← 回到逐题练习</button></div>' +
      '<div class="card"><p class="mut small">点缩略图看整页；原卷 JPG 只在 OneDrive 留档，页面读压缩后的 webp。</p>';
    PAPERS.forEach(function (p) {
      var list = p.images.map(function (im) { return { id: p.id, file: im.file, label: im.label }; });
      html += '<div class="card"><div class="paper-head"><h3>' + esc(p.title) + '</h3>' +
        '<span class="paper-meta">' + esc(p.date || '') + '　·　' + list.length + ' 张图</span></div>' +
        '<div class="thumbs">' + list.map(function (im, i) {
          return '<div class="thumb" data-open="' + i + '" data-paper="' + esc(p.id) + '">' +
            '<img loading="lazy" src="images/试卷/' + esc(p.id) + '/' + esc(im.file) + '" alt="' + esc(im.label) + '">' +
            '<div class="cap">' + esc(im.label) + '</div></div>';
        }).join('') + '</div>' +
        '<div class="btnrow"><button class="btn ghost" data-print="' + esc(p.id) + '">打印空白重做卷</button>' +
        '<button class="btn ghost" data-print-raw="' + esc(p.id) + '">打印原图（含手写）</button></div></div>';
    });
    el.innerHTML = html + '</div>';
    el.querySelector('#pg-back').onclick = function () { practiceMode = 'practice'; renderPaper(); };
    Array.prototype.forEach.call(el.querySelectorAll('[data-open]'), function (t) {
      t.onclick = function () {
        var p = PAPERS.filter(function (x) { return x.id === t.dataset.paper; })[0];
        var list = p.images.map(function (im) { return { id: p.id, file: im.file, label: im.label }; });
        openLightbox(list, parseInt(t.dataset.open, 10));
      };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-print]'), function (b) { b.onclick = function () { printPaper(b.dataset.print); }; });
    Array.prototype.forEach.call(el.querySelectorAll('[data-print-raw]'), function (b) {
      b.onclick = function () {
        var p = PAPERS.filter(function (x) { return x.id === b.dataset.printRaw; })[0];
        var area = document.getElementById('print-area');
        area.innerHTML = '<div class="phead"><h2>' + esc(p.title) + '（原卷）</h2></div>' +
          p.images.map(function (im) { return '<img src="images/试卷/' + esc(p.id) + '/' + esc(im.file) + '">'; }).join('');
        window.print();
      };
    });
  }
  function renderPaper() {
    if (practiceMode === 'gallery' || !paperQuestions().length) renderGallery();
    else renderPractice();
  }

  document.getElementById('lb-close').onclick = closeLightbox;
  document.getElementById('lb-prev').onclick = function () { lbAt = (lbAt - 1 + lbList.length) % lbList.length; showLightbox(); };
  document.getElementById('lb-next').onclick = function () { lbAt = (lbAt + 1) % lbList.length; showLightbox(); };
  document.getElementById('lightbox').onclick = function (e) { if (e.target.id === 'lightbox') closeLightbox(); };
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('lightbox').classList.contains('on')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') { lbAt = (lbAt - 1 + lbList.length) % lbList.length; showLightbox(); }
    if (e.key === 'ArrowRight') { lbAt = (lbAt + 1) % lbList.length; showLightbox(); }
  });

  // ---------- ⑤ 说明 ----------
  function renderDoc() {
    var el = document.getElementById('v-doc');
    var s = score();
    var o = officialView(s);
    el.innerHTML =
      '<div class="card"><h3>这份脚手架是什么</h3>' +
      '<p>它由一张真实卷子长出来：<b>2026—2027 学年第一学期 初三级化学科期中考试</b>（8 页 / 60 分）。' +
      '前四个页签分别对应四件事，第五个是本说明：</p>' +
      '<ul class="tight">' +
      '<li><b>期中诊断</b>：逐题对答案、逐空说明为什么，以及失分归因。</li>' +
      '<li><b>知识框架</b>：九上六个板块的判据清单，做题卡住时回来查。</li>' +
      '<li><b>题型模板</b>：五类题型的固定步骤，认题型比背知识更快提分。</li>' +
      '<li><b>错题回炉</b>：' + (DRILL.items || []).length + ' 道点选即判的题，全部由本次失分点衍生；答错自动进错题库。</li>' +
      '<li><b>原卷重做</b>：逐题练习——选择题点选即判、填空题输入核对、解答题写完看答案自评；每题都能展开该题在原卷上的原图。作答存本机 <kbd>chemPractice.v1</kbd>。</li>' +
      '</ul></div>' +

      '<div class="card"><h3>口径与约定</h3>' +
      '<p class="small">① <b>成绩以批改系统为准</b>：总分 ' + o.total + '/' + o.full + '（等级 ' + o.grade + '），客观分 ' + o.objective + '/' + s.cPts +
      '，解答题 ' + o.subjective + '/' + s.fPts + '，明细见「期中诊断」页。逐空 ✓/✗ 是卷面核对用的教辅标注，' +
      '「每空均分」估算 ≈' + Math.round(s.fGet) + ' 只用来定位失分点，<b>不作为成绩</b>。</p>' +
      '<p class="small">② 有几处参考答案本身存在合理歧义（第 13⑤ 质量比、第 14(5) 选 A 还是 D），已在题目里标注「以老师讲评为准」。</p>' +
      '<p class="small">③ 手写无法辨认的空仍标「待核」（' + s.fPend + ' 空），只影响卷面核对，不影响上面的官方成绩。</p>' +
      '<p class="small">④ 记录存在本机 localStorage（键 <kbd>chemScaffold.v1</kbd>），' +
      '「开始.html」的「今天做什么」会读它，也可以在开始页一键备份。</p></div>' +

      '<div class="card"><h3>原始材料</h3>' +
      '<p class="small">卷子与答题卡照片（6 张 JPG）保存在：<br><span class="mut">C:/Users/tzvuf/OneDrive/陶宸欣/学习资料/题库/化学/2026-2027学年第一学期期中考试/</span></p>' +
      '<p class="small">题目与批改数据（可复用、可改）在 <b>化学/题库/2026-2027期中卷.json</b>；闪练题在 <b>化学/源/data/drill.json</b>。</p>' +
      '<p class="small mut">本页是产物，不要手改：改源之后在 <b>化学/</b> 下跑 <kbd>node 工具/build.mjs</kbd> 重建。</p></div>' +

      '<div class="card"><h3>接下来的三次练习（建议）</h3>' +
      '<ol class="steps">' +
      '<li>今天：错题回炉一轮（约 10 分钟），错的当晚再刷一遍「只练错题」。</li>' +
      '<li>本周：把「三、物质构成的奥秘」那张表抄一遍，重点是化学式交叉法与化合价列式。</li>' +
      '<li>考前：只做题型模板二、四（微观示意图、图像题），这两类是本次失分最集中的。</li>' +
      '</ol></div>';
  }

  // ---------- 启动 ----------
  buildTabs();
  renderDiag();
  renderMap();
  renderMethod();
  renderDoc();
  renderPaper();
  renderDrill(true);
  var s0 = score();
  var o0 = officialView(s0);
  document.getElementById('pill').textContent = '本次 ' + o0.total + ' / ' + o0.full + '（' + o0.grade + '）';
  readHash();
  go(cur, { keep: true });
  if (!location.hash) go('diag');
})();
