<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>核心考点训练</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf8; --ink:#22201d; --sub:#6b6560; --line:#e2ddd2;
  --acc:#1f6f8b; --acc-soft:#e3eff4; --ok:#1f7a4d; --ok-soft:#e2f3e9;
  --bad:#b3352c; --bad-soft:#fbe7e4; --warn:#b06a11; --warn-soft:#fdf0dc;
  --r:14px; --sh:0 2px 10px rgba(40,35,30,.07);
}
html[data-subj="历史"]{ --acc:#9a5b18; --acc-soft:#f6ecdd; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.75 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button,select,input{font-family:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 90px}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:860px;margin:0 auto;padding:10px 14px 0}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{font-size:17px;letter-spacing:.3px}
.brand span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);
  padding:7px 13px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s;
}
.tabs button:hover{border-color:var(--acc);color:var(--acc)}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

/* ---------- 统计条 ---------- */
.bar{display:flex;flex-direction:column;gap:7px;margin:12px 0 4px;font-size:13px;color:var(--sub)}
.bar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill b{color:var(--ink);font-size:14px}
.pill.ok b{color:var(--ok)} .pill.bad b{color:var(--bad)}
.bar select{font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);max-width:190px}
.bar select#fs{max-width:118px}
.bar .sp{flex:1}
.linkbtn{background:none;border:0;color:var(--acc);font-size:13px;cursor:pointer;padding:4px 2px;text-decoration:underline dotted}
.prog{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 0}
.prog>i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 18px 16px;margin-top:14px}
.meta{display:flex;align-items:baseline;gap:10px;font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:10px;word-break:break-word}
.meta .mt{flex:1 1 auto;min-width:0}
.meta .mr{flex:0 0 auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.meta .u{color:var(--acc);font-weight:600}
.meta .pg a{color:var(--sub);text-decoration:none;border-bottom:1px dotted var(--line)}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px;vertical-align:2px}
.q{font-size:19px;line-height:1.65;font-weight:600;margin:0 0 4px}
.q .tag{display:inline-block;font-size:12px;font-weight:500;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:1px 7px;margin-right:7px;vertical-align:2px}
.ans{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.ans .ln{margin:0 0 9px;line-height:1.95}
.ans .ln:last-child{margin-bottom:0}
.ans .lead{color:var(--sub);font-size:12px;margin:0 0 8px}
.kw{font-style:normal;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:0 3px;box-decoration-break:clone}
.hidekw .kw{color:transparent;background:#efece5;border-radius:4px;cursor:pointer;user-select:none}
.hidekw .kw:hover{color:var(--bad);background:var(--bad-soft)}
.warn{margin-top:8px;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:7px 12px;font-size:13.5px;color:#6d4a12;line-height:1.7}
.warn b{color:var(--warn);margin-right:5px;font-size:12px}
.warn.k-必背{background:var(--acc-soft);border-left-color:var(--acc);color:#1c4a5c}
.warn.k-必背 b{color:var(--acc)}
.warn.k-注意{background:#fdf6e3;border-left-color:#d9a520;color:#6b5312}
.warn.k-注意 b{color:#b8860b}
.warn.k-补充{background:#f3f1ec;border-left-color:#c6bfb2;color:var(--sub);font-size:12.5px}
.warn.k-补充 b{color:#9a9288}
table.tb{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;line-height:1.7}
table.tb th{background:var(--acc-soft);color:var(--acc);font-weight:600;font-size:13px}

/* ---------- 填空 ---------- */
.bi{
  font-size:15px;padding:0 6px;margin:0 2px;border:0;border-bottom:2px dashed var(--acc);
  background:transparent;border-radius:5px 5px 0 0;color:var(--ink);text-align:center;min-width:56px;
}
.bi::placeholder{color:#bdb7ac}
.bi:focus{outline:2px solid var(--acc);outline-offset:1px;background:#fff;border-bottom-style:solid}
.bi.ok{background:var(--ok-soft);border-bottom-style:solid}
.bi.bad{background:var(--bad-soft);border-bottom-style:solid;text-decoration:line-through}
.given{color:var(--ok);font-weight:700;white-space:nowrap}
.given::before{content:"→";font-weight:400;color:var(--sub);margin:0 1px}

/* ---------- 选项 ---------- */
.opts{display:grid;gap:9px;margin-top:14px}
.opts button{
  text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-size:16px;line-height:1.6;cursor:pointer;transition:.12s;color:var(--ink);
}
.opts button:hover{border-color:var(--acc);background:var(--acc-soft)}
.opts button:disabled{cursor:default;opacity:.9}
.opts button.c{background:var(--ok-soft);border-color:var(--ok);font-weight:700;color:var(--ok)}
.opts button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opts button .kk{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;background:var(--bg);font-size:12px;margin-right:9px;color:var(--sub)}

/* ---------- 底部操作 ---------- */
.acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.p:hover{filter:brightness(1.08);color:#fff}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.verdict{margin-top:14px;border-radius:10px;padding:11px 14px;font-size:15px;line-height:1.7}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bfe3cd}
.verdict.bad{background:var(--bad-soft);color:var(--bad);border:1px solid #f0c8c2}
.verdict b{font-size:16px}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--sub)}
.nav .btn{flex:0 0 auto}
.empty{text-align:center;color:var(--sub);padding:46px 10px;font-size:15px;line-height:2}
.empty .big{font-size:34px;display:block;margin-bottom:6px}

/* ---------- 清单 ---------- */
.unitbox{margin-top:16px}
.unitbox>h3{font-size:15px;margin:0 0 8px;padding:8px 12px;background:var(--acc-soft);color:var(--acc);border-radius:9px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.unitbox>h3 span{font-size:12px;font-weight:400;color:var(--sub)}
details.k{margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
details.k>summary{cursor:pointer;padding:11px 14px;font-size:15px;font-weight:600;line-height:1.6;list-style:none;display:flex;gap:8px;align-items:flex-start}
details.k>summary::-webkit-details-marker{display:none}
details.k>summary::before{content:"▸";color:var(--acc);flex:0 0 auto;transition:.15s}
details.k[open]>summary::before{transform:rotate(90deg)}
details.k>summary:hover{background:var(--acc-soft)}
details.k .bd{padding:0 14px 14px}
.lv{flex:0 0 auto;font-size:11px;font-weight:500;border-radius:6px;padding:1px 7px;margin-top:4px}
.lv0{background:#eee;color:#8b8b8b}.lv1{background:var(--warn-soft);color:var(--warn)}
.lv2{background:var(--acc-soft);color:var(--acc)}.lv3{background:var(--ok-soft);color:var(--ok)}
.lv4{background:var(--bad-soft);color:var(--bad)}
.searchbox{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;margin-top:12px}
.report{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:16px}
.report h3{margin:0 0 8px;font-size:15px}
.report ul{margin:0;padding-left:20px;font-size:14px;line-height:1.9}
.report li b{color:var(--bad)}
.ubars{margin:8px 0 0}
.ubar{display:flex;align-items:center;gap:9px;font-size:13px;margin:5px 0;color:var(--sub)}
.ubar .nm{flex:0 0 246px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubar .tr{flex:1;height:7px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.ubar .tr i{display:block;height:100%;background:var(--ok);width:0}
.ubar .pc{flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}

@media (max-width:520px){
  .q{font-size:17.5px}
  .card{padding:15px 13px 13px}
  .brand b{font-size:15px}
  .pill{padding:2px 9px}
  .ubar .nm{flex-basis:150px}
}
@media print{
  header,.tabs,.bar,.acts,.nav,.searchbox{display:none!important}
  body{background:#fff}
  .card,details.k,.unitbox{box-shadow:none;break-inside:avoid}
  details.k .bd{display:block!important}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><b id="ttl">核心考点训练</b><span id="sb"></span></div>
    <div class="tabs" id="tabs">
      <button data-mode="recite" aria-selected="true">① 翻卡背</button>
      <button data-mode="cloze">② 填空闯</button>
      <button data-mode="choice">③ 四选一</button>
      <button data-mode="wrong">④ 错题强化</button>
      <button data-mode="list">⑤ 清单</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="bar" id="bar"></div>
  <div class="prog" id="prog" hidden><i></i></div>
  <main id="stage"></main>
</div>

o":"7","q":"亚历山大东征的影响是什么？（如何评价）","a":["①消极：具有【侵略性质】，给东方人民带来【深重灾难】；②积极：促进了【东西方文化的大交汇】。"],"star":2},{"id":"ls-p3-05","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点4 古希腊文化","no":"8","q":"古希腊文学的代表作品是什么？","a":["《【荷马史诗】》（了解【早期希腊社会】的主要文献）。"],"star":1},{"id":"ls-p3-06","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点4 古希腊文化","no":"9","q":"古希腊雕塑的代表作品有哪些？","a":["【奥林匹亚神庙中的宙斯像】、《【掷铁饼者】》。"],"star":1},{"id":"ls-p3-07","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点4 古希腊文化","no":"10","q":"古希腊建筑的代表是什么？","a":["【雅典帕特农神庙】。"],"star":1},{"id":"ls-p3-08","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点4 古希腊文化","no":"11","q":"古希腊哲学的代表人物及其主张、成就是什么？","a":["【苏格拉底】（主张“【认识你自己】”）、【亚里士多德】（【百科全书式】的学者，创立【逻辑学】）。"],"star":1,"warn":"古希腊文化在哲学、文学、建筑等方面成就辉煌"},{"id":"ls-p3-08b","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"本课必背一句话","q":"第5课 古代希腊的「本课必背一句话」是什么？","a":["雅典民主政治是西方民主的源头，但实质是奴隶主阶级的民主"],"star":2},{"id":"ls-p3-09","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点1 罗马共和国","no":"1","q":"罗马共和国建立于何时？","a":["【公元前509年】建立罗马共和国。"],"star":1},{"id":"ls-p3-10","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点1 罗马共和国","no":"2","q":"罗马共和国的统治机构有哪些？","a":["【元老院】（掌握国家实际权力）、【执政官】、【公民大会】。"],"star":1},{"id":"ls-p3-11","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点2 罗马帝国","no":"3","q":"罗马帝国是怎样建立的？","a":["【公元前27年】，【屋大维】首创“【元首制】”，罗马共和国演变为【罗马帝国】。"],"star":1},{"id":"ls-p3-12","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点2 罗马帝国","no":"4","q":"罗马帝国的鼎盛情况如何？","a":["【2世纪】，地跨【欧亚非三洲】，【地中海】成为罗马帝国的“【内湖】”。"],"star":1},{"id":"ls-p3-13","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点2 罗马帝国","no":"5","q":"罗马帝国是怎样衰亡的？（西罗马帝国灭亡的标志意义）","a":["【395年】分裂；【476年】【西罗马帝国】灭亡，标志着【西欧奴隶社会】的结束，进入【封建社会】。"],"star":1},{"id":"ls-p3-14","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点3 古罗马文化","no":"6","q":"古罗马的历法成就是什么？","a":["【凯撒】命人编制“【儒略历】”（今天【公历】的基础）。"],"star":1},{"id":"ls-p3-15","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点3 古罗马文化","no":"7","q":"古罗马建筑的代表有哪些？","a":["【大竞技场】、【引水道工程】、【凯旋门】、【万神庙】。"],"star":1},{"id":"ls-p3-16","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点3 古罗马文化","no":"8","q":"古罗马的法律成就及其地位是什么？","a":["【罗马法体系完备】，是后世【欧洲法学的渊源】。（《【十二铜表法】》是罗马法制建设的【第一步】。）"],"star":1},{"id":"ls-p3-17","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点3 古罗马文化","no":"9","q":"古罗马的史学成就有哪些？","a":["【李维】：《【罗马史】》（记述罗马建城以来的历史）。","【塔西佗】：《【日耳曼尼亚志】》（记载了日耳曼人的早期情况）。"],"star":2,"warn":"古罗马的儒略历、罗马法以及文学史学成就对后世影响深远"},{"id":"ls-p3-17b","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"本课必背一句话","q":"第6课 古代罗马的「本课必背一句话」是什么？","a":["屋大维建立罗马帝国，西罗马帝国的灭亡标志着西欧进入封建社会"],"star":2},{"id":"ls-p4-01","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点1 基督教的兴起","no":"1","q":"基督教创立的时间、地点和创始人是什么？","a":["【1世纪】，创立于【巴勒斯坦地区】，创始人是【耶稣】。"],"star":1},{"id":"ls-p4-02","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点1 基督教的兴起","no":"2","q":"基督教是怎样发展的？","a":["【4世纪末】，基督教成为【罗马帝国的国教】。"],"star":1},{"id":"ls-p4-03","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点2 法兰克王国","no":"3","q":"法兰克王国建立于何时？由谁建立？","a":["【481年】，【克洛维】建立法兰克王国。"],"star":1},{"id":"ls-p4-04","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点2 法兰克王国","no":"4","q":"克洛维的统治措施有哪些？","a":["①【皈依基督教】，承认【罗马教会】在欧洲的重要地位；②【保留了原来罗马大地主的土地】；③把【国有土地和无主土地】赐给亲兵和教会，取得了罗马教会和信奉基督教的【高卢罗马人】的支持。"],"star":1},{"id":"ls-p4-05","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点3 封君封臣制度","no":"5","q":"封君封臣制度是怎样形成的？","a":["【8世纪前期】，以【土地封赐】为纽带，形成封君封臣制度。"],"star":1},{"id":"ls-p4-06","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点3 封君封臣制度","no":"6","q":"封君与封臣的关系是什么？","a":["①封臣对封君要【忠诚、服兵役】；②封君对封臣要【保护封臣的人身安全和生活】。"],"star":1},{"id":"ls-p4-07","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点3 封君封臣制度","no":"7","q":"封君封臣制度的特点是什么？","a":["①以【土地的封赐】为纽带；②【等级森严】；③“【我的附庸的附庸，不是我的附庸】”；④【权利与义务交织】。"],"star":2},{"id":"ls-p4-08","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点4 查理曼帝国","no":"8","q":"查理曼（查理大帝）的称号是怎么来的？","a":["【800年】，教皇在罗马为查理举行【加冕礼】，查理被称为“【查理大帝】”或“查理曼”。"],"star":1},{"id":"ls-p4-09","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点4 查理曼帝国","no":"9","q":"查理曼帝国是怎样分裂的？","a":["【843年】，查理曼的三个孙子缔结条约，将帝国【一分为三】，形成了后来【德意志、法兰西和意大利】三个国家的雏形。"],"star":1},{"id":"ls-p4-10","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点5 西欧庄园","no":"10","q":"西欧庄园的性质是什么？","a":["【自给自足】的经济组织和【相对独立】的政治单位。"],"star":1},{"id":"ls-p4-11","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点5 西欧庄园","no":"11","q":"西欧庄园的居民有哪些？","a":["【领主】和【佃户】，佃户包括【自由的农民】和【缺少自由的农奴】。"],"star":1},{"id":"ls-p4-12","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点5 西欧庄园","no":"12","q":"领主与佃户之间是什么关系？","a":["【统治与被统治】、【剥削与被剥削】的关系。"],"star":1},{"id":"ls-p4-13","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点5 西欧庄园","no":"13","q":"庄园法庭的职责与特点是什么？","a":["①维护【领主利益】；②处罚方式通常是【罚金】；③依据【习惯法或村法】；④在一定程度上【限制了领主的特权】。"],"star":2},{"id":"ls-p4-13b","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"本课必背一句话","q":"第7课 法兰克王国和西欧封建制度的「本课必背一句话」是什么？","a":["封君封臣制度构成了西欧封建社会的政治基础，西欧庄园构成了其经济基础"],"star":2},{"id":"ls-p4-14","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"1","q":"西欧城市重新兴起的时间和背景是什么？","a":["从【10世纪】起，西欧开始恢复，城市重新兴起。"],"star":1},{"id":"ls-p4-15","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"2","q":"西欧城市主要分布在哪里？","a":["主要集中在【道路交会处】、【港口】、【主教驻地】等。"],"star":1},{"id":"ls-p4-16","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"3","q":"西欧城市争取自治的方式有哪些？","a":["①【金钱赎买】；②【武力斗争】。"],"star":2},{"id":"ls-p4-17","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"4","q":"西欧城市争取自治的典型案例是什么？","a":["法国【琅城】人民通过【武力斗争】获得自治权。"],"star":1},{"id":"ls-p4-18","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"5","q":"农奴怎样才能获得市民身份？","a":["农奴进入城市住满【一年零一天】，即可获得【市民身份】，不再受【领主管辖】。"],"star":2},{"id":"ls-p4-19","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点2 大学的兴起","no":"6","q":"欧洲大学兴起的时间及其美誉是什么？","a":["【12世纪】，欧洲出现了许多大学，被誉为中世纪教育“【最美好的花朵】”。"],"star":1},{"id":"ls-p4-20","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点2 大学的兴起","no":"7","q":"早期大学有哪些代表？","a":["【博洛尼亚大学】、【巴黎大学】等。"],"star":1},{"id":"ls-p5-01","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点2 大学的兴起","no":"8","q":"大学的自治权表现在哪些方面？","a":["大学享有【免赋税特权】、【司法特权】和【教育自主权】。"],"star":2},{"id":"ls-p5-02","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点2 大学的兴起","no":"9","q":"大学的课程设置是怎样的？","a":["①【基础课程】包括文法、修辞、逻辑、算术、几何、天文、音乐；②【专业课程】包括法学、医学等。"],"star":1},{"id":"ls-p5-03","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点3 城市和大学兴起的意义","no":"10","q":"城市和大学兴起的意义之经济方面是什么？","a":["【经济方面】：促进了【商品经济发展】，为【资本主义的兴起】准备了条件。"],"star":2},{"id":"ls-p5-04","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点3 城市和大学兴起的意义","no":"11","q":"城市和大学兴起的意义之文化方面是什么？","a":["【文化方面】：打破了【教会对教育的垄断】，促进了【理性文化】的传播。"],"star":2},{"id":"ls-p5-05","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点3 城市和大学兴起的意义","no":"12","q":"城市和大学兴起的意义之社会方面是什么？","a":["【社会方面】：【市民阶层】形成，分化出【早期的资产阶级】，为资本主义的出现准备了条件。"],"star":2},{"id":"ls-p5-06","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","q":"第8课《西欧的城市和大学》本课必背一句话是什么？","a":["城市和大学的兴起促进了【商品经济发展】和【市民阶层形成】，为【资本主义的兴起】准备了条件。"],"star":1},{"id":"ls-p5-07","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点1 拜占庭帝国概况","no":"1","q":"拜占庭帝国的概况如何（名称、首都、疆域）？","a":["拜占庭帝国即【东罗马帝国】，首都【君士坦丁堡】，地跨【欧亚非三洲】。"],"star":1},{"id":"ls-p5-08","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点1 拜占庭帝国概况","no":"2","q":"拜占庭帝国的经济状况如何？","a":["【经济繁荣】，【商业贸易发达】，是当时欧洲经济最发达的地区之一。"],"star":1},{"id":"ls-p5-09","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点2 《罗马民法大全》","no":"3","q":"《罗马民法大全》的编纂背景是什么？","a":["编纂背景：【6世纪】，【查士丁尼】组织编纂法典。"],"star":1},{"id":"ls-p5-10","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点2 《罗马民法大全》","no":"4","q":"《罗马民法大全》由哪几部法律组成？","a":["《【查士丁尼法典】》（历代罗马皇帝法令）、《【法学汇纂】》（法学家著作）、《【法理概要】》（法律教科书）、《【新法典】》（查士丁尼执政时期法令）。"],"star":2},{"id":"ls-p5-11","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点2 《罗马民法大全》","no":"5","q":"《罗马民法大全》的影响是什么？","a":["标志着【罗马法体系】的最终完成，奠定了【欧洲民法】的基础，对后世法律（如《拿破仑法典》）产生了【深远影响】。"],"star":2},{"id":"ls-p5-12","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点2 《罗马民法大全》","no":"6","q":"《罗马民法大全》的局限性是什么？","a":["本质上仍是为了维护【奴隶主阶级】（或帝国统治）的利益，【妇女和奴隶】的地位依然低下，具有明显的【阶级局限性】。"],"star":2},{"id":"ls-p5-13","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点3 拜占庭帝国的灭亡","no":"7","q":"拜占庭帝国衰亡的原因有哪些？","a":["①【长期对外战争】，国力衰弱；②【奥斯曼土耳其】的兴起和扩张。"],"star":1},{"id":"ls-p5-14","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点3 拜占庭帝国的灭亡","no":"8","q":"拜占庭帝国何时、被谁灭亡？","a":["【1453年】，【奥斯曼土耳其】攻陷【君士坦丁堡】，拜占庭帝国灭亡。"],"star":1},{"id":"ls-p5-15","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点3 拜占庭帝国的灭亡","no":"9","q":"拜占庭帝国的历史贡献有哪些？","a":["①保存了大量【古希腊罗马文化】；②《罗马民法大全》对后世法律影响深远；③对【东欧斯拉夫文化】的发展产生了重要影响。"],"star":2},{"id":"ls-p5-16","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点4 拜占庭文化","no":"10","q":"拜占庭文化的特点是什么？","a":["【兼收并蓄】（对基督教、希腊罗马的古典文化传统，以及西亚、北非等地的【东方文化】因素兼收并蓄）。"],"star":2},{"id":"ls-p5-17","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点4 拜占庭文化","no":"11","q":"拜占庭文化的成就有哪些？","a":["史学：普洛科比的《【战争史】》和《【秘史】》。","建筑：【圣索菲亚大教堂】（展现了【东西方文化的交融】）。"],"star":2},{"id":"ls-p5-18","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点4 拜占庭文化","no":"12","q":"拜占庭文化的地位与影响是什么？","a":["①保存了大量【希腊罗马古典作品】，为后来【文艺复兴运动】提供了丰富的文化素材。","②【东正教】传入俄罗斯等东欧地区，拜占庭通用的【希腊字母】对后来东欧文字的形成有促进作用。","③是东西方贸易和文化交流的“金桥”。"],"star":2},{"id":"ls-p5-19","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","q":"第9课《拜占庭帝国》本课必背一句话是什么？","a":["拜占庭帝国文化【兼收并蓄】，其编纂的《罗马民法大全》奠定了【欧洲民法】的基础，保存的古典文化为文艺复兴提供了素材，是东西方交流的“金桥”。"],"star":1},{"id":"ls-p6-01","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点1 大和政权","no":"1","q":"5世纪时日本大和政权的情况如何？","a":["【5世纪】，【大和政权】基本统一日本。"],"star":1},{"id":"ls-p6-02","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点1 大和政权","no":"2","q":"大和政权的最高统治者如何称呼？","a":["大和的最高统治者称为“【大王】”，后改称“【天皇】”。"],"star":1},{"id":"ls-p6-03","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"3","q":"大化改新开始于哪一年？","a":["时间：【646年】开始。"],"star":1},{"id":"ls-p6-04","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"4","q":"大化改新的内容仿效的是哪国的典章制度？","a":["内容（仿效中国【唐朝的典章制度】）："],"star":2,"warn":"本条仅为总起句，具体内容见第5条（政治）与第6条（经济）"},{"id":"ls-p6-05","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"5","q":"大化改新在政治上的内容是什么？","a":["【政治上】：建立以【天皇为中心】的【中央集权制度】，地方设国、郡、里，由中央派人管理。"],"star":1},{"id":"ls-p6-06","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"6","q":"大化改新在经济上的内容是什么？","a":["【经济上】：将【土地、部民】收归国有，国家将土地分给公民耕种，【统一赋税】。"],"star":1},{"id":"ls-p6-07","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"7","q":"大化改新的意义是什么？","a":["使日本从【奴隶社会】向【封建社会】过渡，是日本历史上的【重大转折点】。"],"star":2},{"id":"ls-p6-08","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"8","q":"大化改新给我们什么启示？","a":["改革是推动【社会发展】的【重要动力】；要善于【学习先进文化】。"],"star":1},{"id":"ls-p6-09","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点3 幕府统治","no":"9","q":"日本幕府统治建立的背景是什么？","a":["背景：大化改新百余年后，日本社会出现【庄园】和【武士阶层】。"],"star":1},{"id":"ls-p6-10","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点3 幕府统治","no":"10","q":"日本幕府统治是怎样建立的？","a":["建立：【12世纪晚期】，【源赖朝】建立【镰仓幕府】。"],"star":1},{"id":"ls-p6-11","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点3 幕府统治","no":"11","q":"日本幕府统治的特点是什么？","a":["①【天皇大权旁落】，【幕府将军】掌握实权；②幕府与天皇并存的局面持续了近【700年】。"],"star":2},{"id":"ls-p6-12","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","q":"第10课《封建时代的日本》本课必背一句话是什么？","a":["【大化改新】使日本由【奴隶社会】过渡到【封建社会】，是日本历史的重大转折点。"],"star":1},{"id":"ls-p6-13","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点1 伊斯兰教的创立","no":"1","q":"伊斯兰教何时、由谁、在哪里创立？","a":["创立：【7世纪初】，【穆罕默德】在【阿拉伯半岛】创立伊斯兰教。"],"star":1},{"id":"ls-p6-14","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点1 伊斯兰教的创立","no":"2","q":"伊斯兰教创立初期的发展情况如何？","a":["发展：【622年】，穆罕默德率众从【麦加】出走【麦地那】，建立【穆斯林公社】（阿拉伯国家的雏形），622年被定为伊斯兰教【教历元年】。630年，占领麦加。"],"star":1},{"id":"ls-p6-15","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点2 阿拉伯帝国","no":"3","q":"阿拉伯帝国是怎样建立的？","a":["建立：穆罕默德去世后，其继承者不断【扩张】。"],"star":1},{"id":"ls-p6-16","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点2 阿拉伯帝国","no":"4","q":"阿拉伯帝国的鼎盛情况如何？","a":["鼎盛：【8世纪中期】，阿拉伯帝国成为地跨【欧亚非三洲】的大帝国。"],"star":1},{"id":"ls-p6-17","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点2 阿拉伯帝国","no":"5","q":"阿拉伯帝国的特点是什么？","a":["【政教合一】，【哈里发】为最高统治者，掌握军政大权和宗教最高权力。"],"star":2},{"id":"ls-p6-18","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"6","q":"“阿拉伯数字”的来源与传播是怎样的？","a":["阿拉伯数字：改进并传播了【古印度人】从【0到9】的计数法，将其传播到欧洲。"],"star":1,"warn":"阿拉伯数字是古印度人发明的，阿拉伯人改进并传播"},{"id":"ls-p6-19","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"7","q":"阿拉伯人的医学成就是什么？","a":["医学：《【医学集成】》和《【医典】》长期被欧洲医学界奉为【经典】。"],"star":1},{"id":"ls-p6-20","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"8","q":"阿拉伯文学的代表作是什么？","a":["文学：《【一千零一夜】》（又名《【天方夜谭】》）。"],"star":2},{"id":"ls-p6-21","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"9","q":"阿拉伯人是怎样保存古代文献的？","a":["翻译保存：翻译保存了大量【古希腊罗马】文献。"],"star":1},{"id":"ls-p6-22","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"10","q":"阿拉伯人的历史地位如何？","a":["历史地位：阿拉伯人在东西方文化交流中起了【桥梁】作用。"],"star":2},{"id":"ls-p6-23","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","q":"第11课《阿拉伯帝国》本课必背一句话是什么？","a":["阿拉伯人在东西方文化交流中充当了【桥梁】的作用。"],"star":1},{"id":"ls-p7-01","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点1 西非三大帝国","no":"1","q":"加纳帝国的概况如何？","a":["加纳：①约【8世纪末】建立；②控制着【黄金和食盐】的贸易；③被称为“【黄金之国】”。"],"star":1},{"id":"ls-p7-02","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点1 西非三大帝国","no":"2","q":"马里帝国的概况如何？","a":["马里：①【13世纪】独立并取代加纳；②【14世纪】达到鼎盛；③【曼萨·穆萨】1324年前往【麦加朝圣】；④【廷巴克图】成为学术中心。"],"star":1},{"id":"ls-p7-03","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点1 西非三大帝国","no":"3","q":"桑海帝国的概况如何？","a":["桑海：①【15世纪后期】建立；②【16世纪】达到鼎盛；③16世纪末【摩洛哥】入侵，桑海衰落。"],"star":1},{"id":"ls-p7-04","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点2 美洲三大文明","no":"4","q":"玛雅文明有哪些特点？","a":["①位于【中美洲】；②【历法精确】；③创造了【象形文字】；④建造了【金字塔神庙】。"],"star":2},{"id":"ls-p7-05","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点2 美洲三大文明","no":"5","q":"阿兹特克文明有哪些特点？","a":["①【14世纪】兴起于【墨西哥高原】；②建造【浮动园地】扩大耕种面积；③建造【金字塔神庙】。"],"star":1},{"id":"ls-p7-06","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点2 美洲三大文明","no":"6","q":"印加文明有哪些特点？","a":["①位于【南美安第斯山区】；②【15—16世纪】达到鼎盛；③修建道路和城池；④建造【太阳庙】。"],"star":1},{"id":"ls-p7-07","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","q":"第12课《中古时期的非洲和美洲》本课必背一句话是什么？","a":["中古时期的非洲和美洲创造了各具特色的文明，其中【玛雅文明】是美洲文明的代表。"],"star":1},{"id":"ls-p7-08","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点1 西欧经济社会发展","no":"1","q":"13世纪以后西欧农村出现了什么变化？","a":["农村变化：【13世纪】以后，农村出现【租地农场】，新的生产经营方式开始出现。"],"star":1},{"id":"ls-p7-09","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点1 西欧经济社会发展","no":"2","q":"西欧手工业出现了什么变化？","a":["手工业变化：【手工工场】出现，劳动者与雇主形成【雇佣与被雇佣】的关系。"],"star":1},{"id":"ls-p7-10","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点1 西欧经济社会发展","no":"3","q":"资本主义生产关系是怎样出现的（标志与特征）？","a":["①【租地农场】和【手工工场】的出现标志着资本主义生产关系的出现；②资本主义生产的两大特征：【雇佣关系】、面向市场。"],"star":2},{"id":"ls-p7-11","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点1 西欧经济社会发展","no":"4","q":"租地农场和手工工场的影响是什么？","a":["①经济：推动农业和手工业逐渐【资本主义化】，开始改变中世纪西欧社会的【整体面貌】。","②政治：【新兴资产阶级】开始形成。"],"star":2},{"id":"ls-p7-12","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"5","q":"文艺复兴运动兴起的时间和发源地是什么？","a":["时间：【14世纪】兴起。发源地：【意大利】。"],"star":1},{"id":"ls-p7-13","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"6","q":"文艺复兴运动的核心思想是什么？","a":["【人文主义】——以人为中心而不是以神为中心，发扬人的个性，追求享受【现世生活】。"],"star":1},{"id":"ls-p7-14","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"7","q":"文艺复兴的代表人物及作品有哪些？","a":["【文学三杰】：但丁（先驱，《【神曲】》）、彼特拉克、薄伽丘（《【十日谈】》）。","【美术三杰】：【达·芬奇】（《【蒙娜丽莎】》《最后的晚餐》）、米开朗琪罗、拉斐尔。"],"star":2},{"id":"ls-p7-15","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"8","q":"文艺复兴是怎样扩展的？","a":["扩展：【15、16世纪】，向【西欧其他国家和地区】传播。"],"star":2},{"id":"ls-p7-16","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"9","q":"文艺复兴除意大利外还有哪些代表人物？","a":["代表：【莎士比亚】（英国，《哈姆雷特》《罗密欧与朱丽叶》）、【拉伯雷】（法国）、【塞万提斯】（西班牙，《堂吉诃德》）。"],"star":1},{"id":"ls-p7-17","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"10","q":"文艺复兴运动的本质是什么？","a":["本质：反映【新兴资产阶级】诉求的【思想解放运动】。"],"star":1},{"id":"ls-p7-18","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"11","q":"文艺复兴运动的影响是什么？","a":["①推动了欧洲【文化和思想】的繁荣。","②被认为是【资本主义时代】的曙光。","③冲击了封建时代【神学】的精神束缚，解放了人们的思想，促进了资本主义的发展。","④对欧洲乃至世界历史产生重要影响（为欧洲资本主义社会的产生和发展奠定了【思想文化基础】）。"],"star":2},{"id":"ls-p8-01","page":8,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","q":"第13课《西欧经济社会发展与文艺复兴运动》本课必背一句话是什么？","a":["租地农场和手工工场推动西欧经济【资本主义化】，促使【新兴资产阶级】开始形成；","文艺复兴是【资本主义时代的曙光】，解放了人们的思想，为资本主义的产生奠定了【思想文化基础】。"],"star":1},{"id":"ls-p8-02","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点1 新航路开辟的背景","no":"1","q":"新航路开辟的经济根源是什么？","a":["经济根源：欧洲【商品经济】发展，对【东方商品】的需求增加。"],"star":1},{"id":"ls-p8-03","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点1 新航路开辟的背景","no":"2","q":"新航路开辟的社会根源是什么？","a":["社会根源：《【马可·波罗行纪】》的影响，欧洲人对【东方】充满向往。"],"star":1},{"id":"ls-p8-04","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点1 新航路开辟的背景","no":"3","q":"新航路开辟的直接原因是什么？","a":["直接原因：【奥斯曼帝国】控制了东西方传统商路，对过往商品【征收重税】。"],"star":1},{"id":"ls-p8-05","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点1 新航路开辟的背景","no":"4","q":"新航路开辟的客观条件有哪些？","a":["①【地圆学说】的普及；②【航海技术】的进步；③【造船技术】的进步；④【指南针】的应用。","⑤【西班牙、葡萄牙王室】的支持。"],"star":1},{"id":"ls-p8-06","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点2 四大航海活动","no":"5","q":"迪亚士的航海成就是什么？","a":["迪亚士：【1487—1488年】，到达非洲【好望角】。"],"star":1},{"id":"ls-p8-07","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点2 四大航海活动","no":"6","q":"达·伽马的航海成就是什么？","a":["达·伽马：【1497—1498年】，绕过好望角，横渡【印度洋】，到达【印度】。"],"star":1},{"id":"ls-p8-08","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点2 四大航海活动","no":"7","q":"哥伦布的航海成就是什么？","a":["哥伦布：【1492年】，横渡【大西洋】，到达【美洲】（他认为到达了印度，称当地人为“【印第安人】”）。"],"star":1},{"id":"ls-p8-09","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点2 四大航海活动","no":"8","q":"麦哲伦船队的航海成就是什么？","a":["麦哲伦船队：【1519—1522年】，完成了人类历史上第一次【环球航行】。"],"star":1},{"id":"ls-p8-10","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点3 新航路开辟的影响（新教材重点）","no":"①","q":"新航路开辟对世界的影响是什么？","a":["对世界：世界主要的大洋和大陆之间建立起【直接的海上联系】，逐渐【连成为一个整体】。"],"star":2},{"id":"ls-p8-11","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点3 新航路开辟的影响（新教材重点）","no":"②","q":"新航路开辟对物种的影响是什么？","a":["对物种：有利于【动植物物种】的传播，为人们提供了更加丰富的【食物】。"],"star":2},{"id":"ls-p8-12","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点3 新航路开辟的影响（新教材重点）","no":"③","q":"新航路开辟对欧洲的影响是什么？","a":["对欧洲：推动欧洲国家扩大【海外市场】，进行【殖民掠夺】，增加了【资本原始积累】，促进了资本主义发展。"],"star":2},{"id":"ls-p8-13","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点3 新航路开辟的影响（新教材重点）","no":"④","q":"新航路开辟对亚非拉等其他地区的影响是什么？","a":["对亚非拉等其他地区：在非洲、美洲、大洋洲和亚洲的很多地方，当地居民遭到【屠杀与掳掠】，原有的【社会发展轨迹】被打断，一些地区开始沦为欧洲的【殖民地和半殖民地】（带来了深重灾难）。"],"star":2},{"id":"ls-p8-14","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","q":"第14课《探寻新航路》本课必背一句话是什么？","a":["新航路开辟使世界开始【连为一个整体】，促进了【物种传播】和欧洲资本主义的发展，但也开启了【殖民掠夺】，给亚非美等地区带来深重灾难。"],"star":1},{"id":"ls-p8-15","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点1 葡萄牙的殖民扩张","no":"1","q":"葡萄牙殖民扩张的方式是什么？","a":["方式：在【亚洲、非洲、拉丁美洲】建立【殖民据点】和【商站】。"],"star":1},{"id":"ls-p8-16","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点1 葡萄牙的殖民扩张","no":"2","q":"葡萄牙殖民扩张的特点是什么？","a":["特点：进行【劫掠式贸易】，以【欺骗】和【抢劫】获取财富。"],"star":1},{"id":"ls-p8-17","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点2 西班牙的殖民掠夺","no":"3","q":"西班牙殖民掠夺的方式是什么？","a":["方式：在美洲建立【殖民帝国】，掠夺【金银】，强迫【印第安人】劳动。"],"star":1},{"id":"ls-p8-18","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点2 西班牙的殖民掠夺","no":"4","q":"西班牙在殖民扩张中的地位如何？","a":["地位：【16世纪】，西班牙成为最强大的【殖民帝国】。"],"star":1},{"id":"ls-p8-19","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点3 英法荷的殖民扩张","no":"5","q":"英国是怎样成为海上霸主的？","a":["【1588年】，英国击败西班牙“【无敌舰队】”，逐渐成为【海上霸主】。"],"star":1},{"id":"ls-p8-20","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点3 英法荷的殖民扩张","no":"6","q":"17世纪的荷兰被称为什么？","a":["【17世纪】，荷兰成为“【海上马车夫】”。"],"star":1},{"id":"ls-p8-21","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点3 英法荷的殖民扩张","no":"7","q":"英国是怎样建立殖民霸权的？","a":["【18世纪中后期】，英国打败【荷兰、法国】，开始建立【殖民霸权】。"],"star":1},{"id":"ls-p8-22","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点4 “三角贸易”","no":"8","q":"“三角贸易”的路线是怎样的？","a":["①出程：欧洲（携带【手工业品】）→非洲；②中程：非洲（【掳掠黑奴】）→美洲（【出售黑奴】，获取原料）；③归程：美洲→欧洲（运送【原料和金银】回欧洲）。"],"star":2},{"id":"ls-p9-01","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点4 早期殖民掠夺的影响","q":"早期殖民掠夺对非洲产生了什么影响？","a":["①对非洲：对非洲人民犯下【滔天罪行】，非洲损失的人口总数可能有【近亿人】，发展进程受到严重影响。"],"star":1},{"id":"ls-p9-02","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点4 早期殖民掠夺的影响","q":"早期殖民掠夺对欧洲（殖民者）产生了什么影响？","a":["②欧洲：使欧洲殖民者【大发横财】，加速了【资本原始积累】，推动了欧洲资本主义的发展。"],"star":1},{"id":"ls-p9-03","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点5 早期殖民掠夺的整体影响","q":"早期殖民掠夺对欧洲的客观影响是什么？","a":["①★对欧洲：客观上有助于欧洲殖民国家的【资本原始积累】，推动了欧洲资本主义的发展。"],"star":2},{"id":"ls-p9-04","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点5 早期殖民掠夺的整体影响","q":"早期殖民掠夺对世界的影响是什么？","a":["②★对世界：有助于【世界市场】逐渐形成，促进全球文化、物种和经济的交流。"],"star":2},{"id":"ls-p9-05","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点5 早期殖民掠夺的整体影响","q":"早期殖民掠夺对殖民地的影响是什么？","a":["③★对殖民地：给殖民地人民带来了【深重的灾难】；欧洲文化传到殖民地，对殖民地社会的发展产生了【深远的影响】。"],"star":2},{"id":"ls-p9-06","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"本课必背一句话","q":"三角贸易和早期殖民掠夺的影响——本课必背一句话是什么？","a":["三角贸易和早期殖民掠夺加速了欧洲的【资本原始积累】，促进了【世界市场】的形成，但也给亚非拉殖民地人民带来了【深重灾难】。"],"star":1},{"id":"ls-p9-07","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点1 革命背景","no":"1","q":"英国资产阶级革命的根本原因是什么？","a":["★根本原因：【斯图亚特王朝】的专制统治严重阻碍了英国资本主义的发展。"],"star":2},{"id":"ls-p9-08","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点1 革命背景","no":"2","q":"英国资产阶级革命的阶级基础是什么？","a":["阶级基础：【资产阶级和新贵族】的形成。"],"star":1},{"id":"ls-p9-09","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点1 革命背景","no":"3","q":"英国资产阶级革命的导火线是什么？","a":["★导火线：【苏格兰人民起义】。"],"star":2},{"id":"ls-p9-10","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"4","q":"英国资产阶级革命开始的标志是什么？","a":["开始：1640年，议会重新召开，揭开了英国资产阶级革命的【序幕】。"],"star":1},{"id":"ls-p9-11","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"5","q":"英国内战的结果如何？","a":["内战：【克伦威尔】率领议会军队打败国王军队。"],"star":1},{"id":"ls-p9-12","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"6","q":"英国何时宣布为共和国？","a":["共和：1649年，查理一世被推上断头台，英国宣布为【共和国】。"],"star":1},{"id":"ls-p9-13","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"7","q":"克伦威尔的独裁与斯图亚特王朝复辟的情况如何？","a":["独裁与复辟：克伦威尔就任“【护国公】”实行独裁；1660年【斯图亚特王朝复辟】。"],"star":1},{"id":"ls-p9-14","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"8","q":"英国资产阶级革命结束的标志是什么？","a":["结束：1688年，“【光荣革命】”（资产阶级和新贵族发动宫廷政变，未流血）。"],"star":1},{"id":"ls-p9-15","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点3 《权利法案》","no":"9","q":"《权利法案》的颁布时间是什么？","a":["颁布时间：【1689年】。"],"star":1},{"id":"ls-p9-16","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点3 《权利法案》","no":"10","q":"《权利法案》的核心内容是什么？","a":["★核心内容：限制国王权力，确立【议会权力至上】。"],"star":2},{"id":"ls-p9-17","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点3 《权利法案》","no":"11","q":"《权利法案》的意义是什么？","a":["★意义：①以法律形式对国王的权力进行了明确的制约；②确立了议会在国家政治生活中的【最高地位】；③逐渐形成了【君主立宪制】。"],"star":2},{"id":"ls-p9-18","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点4 英国资产阶级革命的影响","q":"英国资产阶级革命对英国的影响是什么？","a":["①对英国：推翻了封建君主的【专制统治】，为英国资本主义的进一步发展【开辟了道路】。"],"star":1},{"id":"ls-p9-19","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点4 英国资产阶级革命的影响","q":"英国资产阶级革命对世界的影响是什么？","a":["②对世界：对世界历史产生了重要影响，标志着人类社会从封建时代走向【资本主义时代】。"],"star":1},{"id":"ls-p9-20","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"本课必背一句话","q":"《权利法案》与英国资产阶级革命——本课必背一句话是什么？","a":["《权利法案》以法律形式【限制王权】，标志着英国确立了【君主立宪制】，为资本主义发展【开辟了道路】。"],"star":1},{"id":"ls-p9-21","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"1","q":"美国独立战争的根本原因是什么？","a":["★根本原因：英国殖民统治严重阻碍了【北美资本主义】的发展。"],"star":2},{"id":"ls-p9-22","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"2","q":"美国独立战争的导火线是什么？","a":["★导火线：1773年【波士顿倾茶事件】。"],"star":2},{"id":"ls-p9-23","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"3","q":"美国独立战争爆发的标志是什么？","a":["爆发：1775年【来克星顿枪声】。"],"star":1},{"id":"ls-p10-01","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"4","q":"美国独立战争中的建军情况如何？","a":["建军：第二届大陆会议组建【大陆军】，【华盛顿】任总司令。"],"star":1},{"id":"ls-p10-02","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"5","q":"美国何时宣告独立？","a":["宣告独立：1776年7月4日，发表【《独立宣言》】，宣告美国诞生。"],"star":1},{"id":"ls-p10-03","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"6","q":"美国独立战争的转折点是什么？","a":["转折：1777年【萨拉托加大捷】。"],"star":1},{"id":"ls-p10-04","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"7","q":"美国独立战争胜利与结束的标志是什么？","a":["胜利与结束：1781年【约克镇战役】胜利；1783年英国承认美国独立。"],"star":1},{"id":"ls-p10-05","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点2 《独立宣言》","no":"8","q":"《独立宣言》的内容是什么？","a":["内容：宣布【人人生而平等】，享有生命权、自由权和追求幸福的权利；宣告北美13个殖民地【脱离英国而独立】。"],"star":1},{"id":"ls-p10-06","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点2 《独立宣言》","no":"9","q":"《独立宣言》的局限性是什么？","a":["★局限：没有宣布废除【奴隶制】，也没有给予广大黑人和印第安人基本权利。"],"star":2},{"id":"ls-p10-07","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点3 1787年宪法","no":"10","q":"1787年宪法的设计原则是什么？","a":["原则：依据【分权制衡】原则设计（立法权归国会；行政权归总统；司法权归最高法院）。"],"star":1},{"id":"ls-p10-08","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点3 1787年宪法","no":"11","q":"1787年宪法确立了什么政体？","a":["政体：确立了【联邦制共和国】。"],"star":1},{"id":"ls-p10-09","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点3 1787年宪法","no":"12","q":"1787年宪法的历史地位是什么？","a":["地位：是世界上第一部【资产阶级成文宪法】。"],"star":1},{"id":"ls-p10-10","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点3 1787年宪法","no":"13","q":"1787年宪法的局限性是什么？","a":["★局限：允许奴隶制存在，不承认妇女、黑人和印第安人拥有和白人男子【同等的权利】。"],"star":2},{"id":"ls-p10-11","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"本课必背一句话","q":"《独立宣言》与1787年宪法——本课必背一句话是什么？","a":["《独立宣言》宣告【美国诞生】；1787年宪法确立了【分权制衡】的联邦制共和国，是世界第一部【资产阶级成文宪法】。"],"star":1},{"id":"ls-p10-12","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"1","q":"法国大革命的根本原因是什么？","a":["★根本原因：【波旁王朝】的专制统治严重阻碍了法国资本主义的发展。"],"star":2},{"id":"ls-p10-13","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"2","q":"法国大革命的思想准备是什么？","a":["思想准备：【启蒙运动】（伏尔泰、孟德斯鸠、卢梭）为法国大革命提供了思想理论基础。"],"star":1},{"id":"ls-p10-14","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"3","q":"法国大革命的导火线是什么？","a":["★导火线：1789年，路易十六召开【三级会议】。"],"star":2},{"id":"ls-p10-15","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"4","q":"法国大革命爆发的标志是什么？","a":["爆发：1789年7月14日，巴黎人民攻占【巴士底狱】，法国大革命爆发。"],"star":1},{"id":"ls-p10-16","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"5","q":"法国大革命的发展表现在哪里？","a":["发展：1792年建立【法兰西第一共和国】；1793年处死路易十六。"],"star":1},{"id":"ls-p10-17","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点2 《人权宣言》","no":"6","q":"《人权宣言》何时由什么机构颁布？","a":["★颁布：1789年，【制宪议会】通过。"],"star":2},{"id":"ls-p10-18","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点2 《人权宣言》","no":"7","q":"《人权宣言》的内容是什么？","a":["★内容：宣告人们生来【自由、权利平等】，【私有财产神圣不可侵犯】。"],"star":2},{"id":"ls-p10-19","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点2 《人权宣言》","no":"8","q":"《人权宣言》的历史地位是什么？","a":["地位：是法国大革命的【纲领性文件】。"],"star":1},{"id":"ls-p10-20","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"9","q":"法国大革命是如何深入发展（被推向高潮）的？","a":["深入发展：以【罗伯斯庇尔】为首的【雅各宾派】掌权，把法国大革命推向高潮。"],"star":1},{"id":"ls-p10-21","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"10","q":"法国大革命高潮结束的标志是什么？","a":["高潮结束：1794年“【热月政变】”，罗伯斯庇尔等人被处死，法国大革命高潮结束。"],"star":1},{"id":"ls-p10-22","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"11","q":"法国大革命对法国的影响是什么？","a":["①对法国：摧毁了法国的【封建君主专制统治】，为法国资本主义的发展【扫清了障碍】。"],"star":2},{"id":"ls-p10-23","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"11","q":"法国大革命对思想的影响是什么？","a":["②对思想：传播了资产阶级【自由民主】的进步思想，沉重打击了欧洲的封建制度。"],"star":2},{"id":"ls-p10-24","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"11","q":"法国大革命对世界的影响是什么？","a":["③对世界：具有世界性影响。它是世界历史上【规模最大、最彻底】的一次资产阶级革命，对欧洲乃至世界历史的发展产生了深远影响。"],"star":2},{"id":"ls-p10-25","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"12","q":"拿破仑帝国何时建立？","a":["建立：1804年，拿破仑【加冕称帝】，建立【法兰西第一帝国】（拿破仑帝国）。"],"star":1},{"id":"ls-p10-26","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"13","q":"拿破仑帝国的主要活动——对内采取了哪些措施？","a":["①对内：采取各种措施巩固资产阶级统治，发展经济，改善财政；主持制定【《拿破仑法典》】，该法典肯定了法国大革命的基本成果，确立了【资本主义社会重要的立法规范】。"],"star":2},{"id":"ls-p10-27","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"13","q":"拿破仑帝国的主要活动——对外采取了哪些措施？","a":["②对外：多次击退【反法联盟】，发动对外战争。"],"star":2},{"id":"ls-p11-01","page":11,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"14","q":"评价拿破仑对外战争的革命性（进步性）？","a":["①革命性：沉重打击了欧洲的【封建势力】，传播了法国大革命的思想。"],"star":2},{"id":"ls-p11-02","page":11,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"14","q":"评价拿破仑对外战争的侵略性？","a":["②侵略性：当地人民遭到【压榨和掠夺】。"],"star":2,"warn":"第10页末为“14.★评价对外战争”，其答案①②在第11页"},{"id":"ls-p11-03","page":11,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"15","q":"拿破仑帝国覆灭的结果如何？","a":["结果：1812年，拿破仑率军【远征俄国大败而归】；1815年，【滑铁卢战役】失败，拿破仑帝国覆灭。"],"star":1},{"id":"ls-p11-04","page":11,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"本课必背一句话","q":"《人权宣言》《拿破仑法典》与法国大革命——本课必背一句话是什么？","a":["《人权宣言》传播了【自由平等】思想；法国大革命是最彻底的资产阶级革命；【《拿破仑法典》】确立了资本主义社会的【立法规范】。"],"star":1},{"id":"ls-p11-05","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"1","q":"第一次工业革命开始的时间是什么时候？","a":["时间：【18世纪60年代】开始。"],"star":1},{"id":"ls-p11-06","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"2","q":"第一次工业革命首先发生在哪个国家、哪个领域？","a":["首先发生国：英国。首先开始领域：【棉纺织业】。"],"star":1},{"id":"ls-p11-07","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"4","q":"英国率先开始工业革命的政治前提是什么？","a":["政治前提：【君主立宪制】确立，政局稳定。"],"star":2,"warn":"本条属于“3.★英国率先开始工业革命的条件”之下的一目"},{"id":"ls-p11-08","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"5","q":"英国率先开始工业革命的经济基础是什么？","a":["经济基础：海外贸易和【殖民掠夺】积累了大量资本。"],"star":2,"warn":"本条属于“3.★英国率先开始工业革命的条件”之下的一目"},{"id":"ls-p11-09","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"6","q":"英国率先开始工业革命在市场和劳动力方面的条件是什么？","a":["市场与劳动力：拥有广阔的【海外市场】，【圈地运动】提供了自由劳动力。"],"star":2,"warn":"本条属于“3.★英国率先开始工业革命的条件”之下的一目"},{"id":"ls-p11-10","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"7","q":"工业革命的纺织技术革新有哪些？（发明者与发明）","a":["★纺织技术革新：【哈格里夫斯】发明珍妮纺织机；【阿克莱特】发明水力纺纱机；克隆普顿发明骡机；卡特莱特发明动力织布机。"],"star":2},{"id":"ls-p11-11","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"8","q":"工业革命的动力革新是什么？","a":["★动力革新：1785年，英国人【瓦特】改进后的蒸汽机投入使用。"],"star":2},{"id":"ls-p11-12","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"9","q":"蒸汽机投入使用（动力革新）的影响是什么？","a":["影响：推动了更多新机器、新技术的发明，极大提高了【生产力】。"],"star":1},{"id":"ls-p11-13","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"10","q":"工厂制度是怎样确立的？","a":["★工厂制度：19世纪，传统手工工场逐渐被工厂替代，【工厂制度】最终确立。"],"star":2},{"id":"ls-p11-14","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"11","q":"工业革命在交通工具方面的成就是什么？","a":["★交通工具：1825年，【斯蒂芬森】设计的蒸汽机车试车成功。"],"star":2},{"id":"ls-p11-15","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"12","q":"蒸汽机车（交通工具革新）的影响是什么？","a":["影响：交通更加快捷、便利，【生产和市场之间的联系】更加紧密。"],"star":1},{"id":"ls-p11-16","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点3 工业革命的影响","q":"工业革命对生产生活的影响是什么？","a":["①生产生活：极大地提高了生产力，创造出巨大的社会财富，改变了人们的生产生活方式，人类社会进入“【蒸汽时代】”。"],"star":1},{"id":"ls-p11-17","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点3 工业革命的影响","q":"工业革命对社会结构的影响是什么？","a":["②社会结构：引起社会结构的变化，使社会日益分化为【工业资产阶级】和【工业无产阶级】两大对立阶级。"],"star":1},{"id":"ls-p11-18","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点3 工业革命的影响","q":"工业革命在环境方面带来了什么后果？","a":["③造成了【环境污染】。"],"star":1},{"id":"ls-p11-19","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点3 工业革命的影响","q":"工业革命在贫富差距方面带来了什么后果？","a":["④加剧了【贫富分化】，无产阶级与资产阶级的矛盾日益尖锐。"],"star":1},{"id":"ls-p11-20","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"易混易错","q":"工业革命的“开始标志”与“标志性发明”分别是什么？（易混易错）","a":["◇工业革命开始的标志是【珍妮机】的发明；标志性发明是【瓦特改良蒸汽机】。"],"star":1,"warn":"易混易错：开始标志（珍妮机的发明）≠标志性发明（瓦特改良蒸汽机）"},{"id":"ls-p11-21","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"易混易错","q":"为什么说工业革命不仅是一场技术革命，也是一场深刻的社会变革？","a":["◇工业革命不仅是一场技术革命，也是一场深刻的【社会变革】（工厂制度确立、两大阶级对立）。"],"star":2,"warn":"易混易错"},{"id":"ls-p11-22","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"本课必背一句话","q":"第一次工业革命的影响——本课必背一句话是什么？","a":["【瓦特改良蒸汽机】使人类进入“蒸汽时代”；工业革命极大提高了生产力，使社会日益分化为【工业资产阶级】和【工业无产阶级】两大对立阶级。"],"star":1},{"id":"ls-p12-01","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点1 马克思主义诞生的背景","no":"1","q":"马克思主义诞生的经济基础是什么？","a":["经济基础：工业革命后，资本主义迅速发展，但【阶级矛盾日益尖锐】。"],"star":1},{"id":"ls-p12-02","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点1 马克思主义诞生的背景","no":"2","q":"马克思主义诞生的阶级基础是什么？","a":["★阶级基础：三大工人运动（法国里昂工人起义、英国宪章运动、德国西里西亚织工起义）标志着【工人阶级】作为独立的政治力量登上历史舞台。"],"star":2},{"id":"ls-p12-03","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点1 马克思主义诞生的背景","no":"3","q":"马克思主义诞生的思想基础是什么？","a":["思想基础：【空想社会主义】（圣西门、傅立叶、欧文）。"],"star":1},{"id":"ls-p12-04","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","le ，【巴黎公社成立】；5月28日，失败（“【五月流血周】”）。"],"star":1},{"id":"ls-p12-15","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"6","q":"巴黎公社的措施之一：在政治机构方面做了什么？","a":["①废除旧军队、旧警察，建立新的【治安、司法和立法机构】。"],"star":2},{"id":"ls-p12-16","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"6","q":"巴黎公社的措施之二：对公职人员有什么规定？","a":["②公职人员由【民主选举】产生，限制公职人员薪资。"],"star":2},{"id":"ls-p12-17","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"6","q":"巴黎公社的措施之三：对逃亡资本家的工厂如何处理？","a":["③没收逃亡资本家的工厂，交由【工人管理】。"],"star":2},{"id":"ls-p12-18","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"6","q":"巴黎公社的措施之四：在教育方面实行什么制度？","a":["④实行小学【免费义务教育】。"],"star":2},{"id":"ls-p12-19","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"7","q":"巴黎公社的性质与意义是什么？","a":["★性质与意义：世界上第一个【无产阶级政权】（【无产阶级专政】的第一次伟大尝试），丰富了马克思主义理论，为未来无产阶级革命留下了宝贵经验。"],"star":2},{"id":"ls-p12-20","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"本课必背一句话","q":"巴黎公社的历史地位——本课必背一句话是什么？","a":["巴黎公社是无产阶级推翻资产阶级统治、建立【无产阶级专政】的【第一次伟大尝试】。"],"star":1}]};

/* ================================================================
   基础工具
   ================================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const STAR=n=>'★'.repeat(Math.max(0,(n||1)-1));

/* 判分归一化：去空白、去标点、全角转半角 */
function norm(s){
  return String(s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s，。、；：""''（）()《》〈〉·—…\-__,.;:"'`~!@#$%^&*+=|\\/\[\]{}<>?！？]/g,'')
    .toLowerCase();
}
/* 长答案包容性判分：去掉"的地得了着和与及其之"再比，避免因为虚词差一个字就判错 */
const loose=s=>norm(s).replace(/[的地得了着和与及其之]/g,'');

/* ================================================================
   持久化
   ================================================================ */
const SK='kss_v1_'+(DATA&&DATA.subject||'x');
let P=loadProg();
function loadProg(){
  let d={cards:{},days:{}};
  try{const raw=localStorage.getItem(SK);if(raw){const o=JSON.parse(raw);if(o&&o.cards)d=o;}}catch(e){}
  if(!d.days)d.days={};
  return d;
}
function saveProg(){ try{localStorage.setItem(SK,JSON.stringify(P));}catch(e){console.warn('保存失败',e);} }
function rec(cardId,ok,mode,opts){
  const p=P.cards[cardId]||(P.cards[cardId]={seen:0,ok:0,wrong:0,streak:0,last:0,mode:''});
  p.seen++;p.last=Date.now();p.mode=mode||p.mode;
  if(ok){p.ok++;p.streak=Math.min(9,p.streak+1);}else{p.wrong++;p.streak=0;}
  if(opts&&opts.skim)p.skim=(p.skim||0)+1;
  const d=todayKey(),t=P.days[d]||(P.days[d]={n:0,ok:0});
  t.n++;if(ok)t.ok++;
  saveProg();
}
const getP=id=>P.cards[id]||null;
/* 安全取值：还没练过的卡也要能排序、能比大小 */
const PW=id=>getP(id)||{seen:0,ok:0,wrong:0,streak:0,last:0};
const scrollTop=()=>{try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){/* 有些环境没实现 */}};
function level(id){
  const p=getP(id);
  if(!p||!p.seen)return 0;
  if(p.streak>=3)return 3;
  if(p.streak>0)return 2;
  return 4; /* 有错待强化 */
}
const LVTXT={0:'未学',1:'未学',2:'记过',3:'熟练',4:'待强化'};

/* ================================================================
   考点解析：把【关键词】切出来
   ================================================================ */
function tokens(text){
  const out=[];let last=0,m;const re=/【([^】]+)】/g;
  while((m=re.exec(text))){
    if(m.index>last)out.push({t:'s',v:text.slice(last,m.index)});
    out.push({t:'b',v:m[1].split('|').map(s=>s.trim()).filter(Boolean)});
    last=m.index+m[0].length;
  }
  if(last<text.length)out.push({t:'s',v:text.slice(last)});
  return out;
}
/* 生成一张卡的渲染计划：段落 + 表格，占位符按出现顺序编号 */
function planOf(c){
  let k=0;const blanks=[];
  const paint=toks=>toks.map(t=>{
    if(t.t!=='b')return t;
    const o={t:'b',v:t.v,k:k};blanks.push(t.v);k++;return o;
  });
  const body=(c.a||[]).map(txt=>({type:'p',toks:paint(tokens(txt))}));
  if(c.table){
    const rows=(c.table.rows||[]).map(r=>r.map(cell=>paint(tokens(cell))));
    body.push({type:'table',head:c.table.head||[],rows});
  }
  return {body,blanks,count:k};
}
const PLAN={};DATA&&DATA.cards.forEach(c=>{PLAN[c.id]=planOf(c);});

function nowLine(toks){
  return toks.map(t=>t.t==='s'?esc(t.v):`<em class="kw" title="${esc(t.v.slice(1).join(' / ')||t.v[0])}">${esc(t.v[0])}</em>`).join('');
}
function inputLine(toks){
  return toks.map(t=>{
    if(t.t==='s')return esc(t.v);
    const w=Math.max(3,Math.min(11,t.v[0].length+1));
    return `<input class="bi" data-k="${t.k}" size="${w}" autocomplete="off" spellcheck="false" aria-label="填空">`;
  }).join('');
}

function renderAns(c,plan,cloze){
  const html=plan.body.map(it=>{
    if(it.type==='p'){
      return `<p class="ln">${cloze?inputLine(it.toks):nowLine(it.toks)}</p>`;
    }
    const head=it.head.map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=it.rows.map(r=>'<tr>'+r.map(cell=>`<td>${cloze?inputLine(cell):nowLine(cell)}</td>`).join('')+'</tr>').join('');
    return `<table class="tb"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }).join('');
  return html;
}
/* 批注分色显示：本课必背 / 易错 / 注意 / 补充（转录备注） */
function warnHTML(c){
  if(!c.warn)return '';
  return String(c.warn).split('；').map(s=>s.trim()).filter(Boolean).map(s=>{
    let kind='补充',body=s,m;
    if(m=s.match(/^本课必背(一句话)?[：:]?\s*(.*)$/)){kind='必背';body=m[2];}
    else if(m=s.match(/^(易错点|易混易错|易错|易混)[：:]?\s*(.*)$/)){kind='易错';body=m[2];}
    else if(m=s.match(/^(注意提法|注意)[：:]?\s*(.*)$/)){kind='注意';body=m[2];}
    return `<div class="warn k-${kind}"><b>${kind}</b>${esc(body)}</div>`;
  }).join('');
}
function pageLink(c){
  if(!c.page)return '';
  const base=(DATA.imgBase||'images/'),pre=DATA.imgPrefix||'';
  return ` <a href="${esc(base+pre+c.page+'.jpg')}" target="_blank" rel="noopener">对照原页 p${c.page}</a>`;
}
function metaHTML(c){
  const bits=[];
  if(c.unit)bits.push(`<span class="u">${esc(c.unit)}</span>`);
  if(c.lesson)bits.push(esc(c.lesson));
  if(c.node)bits.push(esc(c.node));
  const lv=level(c.id);
  return `<div class="meta"><span class="mt">${bits.join(' ／ ')}</span>`+
    `<span class="mr">${pageLink(c)}<span class="stars">${STAR(c.star)}</span>`+
    `<span class="lv lv${lv}">${lv===4?'待强化':LVTXT[lv]}</span></span></div>`;
}

const S={mode:'recite',unit:'全部',scope:'all',queue:[],qi:0,revealed:false,scored:false,cur:null,curPlan:null,choice:null,optDone:false};

const CARD_BY=id=>DATA.cards.find(c=>c.id===id);

/* ================================================================
   队列
   ================================================================ */
function pool(){
  let a=DATA.cards.slice();
  if(S.unit!=='全部')a=a.filter(c=>(c.unit||'未分单元')===S.unit);
  if(S.scope==='star')a=a.filter(c=>(c.star||1)>=2);
  if(S.scope==='unseen')a=a.filter(c=>!getP(c.id)||!getP(c.id).seen);
  if(S.scope==='weak')a=a.filter(c=>{const lv=level(c.id);return lv===0||lv===2||lv===4;});
  return a;
}
function buildQueue(){
  let a=pool();
  if(S.mode==='cloze')a=a.filter(hasBlanks);
  if(S.mode==='wrong')a=a.filter(c=>{const p=getP(c.id);return p&&p.wrong>0&&p.streak<2;});
  if(S.mode==='choice')a=a.filter(hasBlanks);
  if(S.mode==='wrong'||S.mode==='choice')a.sort((x,y)=>PW(y.id).wrong-PW(x.id).wrong);
  else a.sort((x,y)=>(PW(x.id).seen?1:0)-(PW(y.id).seen?1:0));
  S.queue=a.map(c=>c.id);
  if(S.qi>=S.queue.length)S.qi=0;
}
function setProg(){
  const el=$('#prog');
  if(!['recite','cloze','choice','wrong'].includes(S.mode)||!S.queue.length){el.hidden=true;return;}
  el.hidden=false;
  $('i',el).style.width=Math.round((S.qi+1)/S.queue.length*100)+'%';
}

function render(){
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===S.mode));
  renderBar();setProg();

  if(S.mode==='list'){renderList(st);return;}
  if(!S.queue.length){st.innerHTML=emptyHTML();renderNav(st);return;}
  const c=CARD_BY(S.queue[S.qi]);
  if(!c){st.innerHTML=emptyHTML();return;}
  if(S.mode==='choice')renderChoice(st,c);
  else if(S.mode==='cloze')renderCloze(st,c);
  else renderRecite(st,c);
  renderNav(st);
}

/* ---------------- ② 填空闯 ---------------- */
function renderCloze(st,c){

      ${renderAns(c,p,true)}

    $('#fb',st).innerHTML=`<div class="verdict ${bad===0?'ok':'bad'}">${
      bad===0?'<b>全对 ✓</b> 这张卡记得住。':
      `<b>错 ${bad} 处</b>${empty?`（其中 ${empty} 空没填）`:''}，前面绿色的是正解，红色的是你填的。`}</div>`;

    $('#nx2',acts).onclick=nextCard;

    if(fg)fg.onclick=()=>{const q=getP(c.id);if(q){q.wrong=Math.max(0,q.wrong-1);q.streak=1;saveProg();}renderBar();fg.textContent='已改判 ✓';fg.disabled=true;};
  };
  acts.innerHTML=`<button class="btn p" id="sub">提交判分（回车）</button>
    <button class="btn sm" id="peek">看答案（算不会）</button>`;

/* ---------------- ③ 四选一 ---------------- */
function termPool(){
  if(termPool._c)return termPool._c;
  const all=[];
  DATA.cards.forEach(c=>{
    const p=PLAN[c.id];
    p.blanks.forEach(alts=>{if(alts[0])all.push({t:alts[0],unit:c.unit||'',id:c.id});});
  });
  termPool._c=all;return all;
}
function distractors(card,plan,k,n){
  const right=plan.blanks[k][0];
  const all=termPool();
  const sameUnit=all.filter(x=>x.unit===(card.unit||'')&&norm(x.t)!==norm(right));
  const other=all.filter(x=>x.unit!==(card.unit||'')&&norm(x.t)!==norm(right));
  const picked=[];const seen=new Set([norm(right)]);
  const take=arr=>{
    const sh=shuffle(arr.slice());
    for(const x of sh){
      if(picked.length>=n)return;
      const key=norm(x.t);
      if(seen.has(key))continue;
      seen.add(key);picked.push(x.t);
    }
  };
  take(sameUnit);take(other);
  return picked;
}
function renderChoice(st,c){
  const p=PLAN[c.id];
  // 选一个空（优先没练过的位置）
  if(!S.choice||S.choice.id!==c.id||S.choice.k>=p.count)S.choice={id:c.id,k:0};
  const k=S.choice.k;
  const right=p.blanks[k][0];
  const opts=shuffle([right,...distractors(c,p,k,3)]);
  const toks=PICK_TOKENS(p,k);
  st.innerHTML=`<div class="card">${metaHTML(c)}
    <div class="q" style="font-size:16px">${esc(c.q)}</div>
    <div class="ans" id="ans"><div class="lead">补全下面这句话（第 ${k+1}/${p.count} 空）：</div>
      <p class="ln" style="font-size:17px">${toks.before}<span style="display:inline-block;min-width:72px;border-bottom:2px solid var(--acc);text-align:center;color:var(--acc);font-weight:700">?</span>${toks.after}</p>
      ${p.count>1&&k+1<p.count?`<div class="hint">还可以练这题的第 ${k+2} 空 →</div>`:''}
    </div>
    <div class="opts" id="opts">${opts.map((o,i)=>`<button data-i="${i}" data-o="${esc(o)}"><span class="kk">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>
    <div class="acts" id="acts"><span class="hint">点选项或按 1–4；答错自动进错题本。</span></div>
  </div>`;
  const btns=$$('#opts button',st);
  let done=false;
  const answer=btn=>{
    if(done)return;done=true;
    const val=btn.dataset.o;
    const ok=norm(val)===norm(right);
    btns.forEach(b=>{
      b.disabled=true;
      if(norm(b.dataset.o)===norm(right))b.classList.add('c');
    });
    if(!ok)btn.classList.add('w');
    rec(c.id,ok,'choice');
    renderBar();
    const acts=$('#acts',st);
    const more=k+1<p.count;
    acts.innerHTML=`<button class="btn p" id="nx3">下一题（回车）</button>`+
      (more?`<button class="btn" id="nb">再练这题下一空</button>`:'')+
      (ok?'':'<button class="btn sm" id="why">看整条答案</button>');
    $('#nx3',acts).onclick=nextCard;
    if(more)$('#nb',acts).onclick=()=>{S.choice={id:c.id,k:k+1};S.revealed=false;render();};
    const wy=$('#why',acts);
    if(wy)wy.onclick=()=>{
      $('#ans',st).insertAdjacentHTML('beforeend',renderAns(c,p,false)+warnHTML(c));
      wy.disabled=true;
    };
  };
  btns.forEach(b=>b.onclick=()=>answer(b));
  st.onkeydown=e=>{
    if('1234'.includes(e.key)){const i=+e.key-1;if(btns[i]&&!btns[i].disabled)answer(btns[i]);}
    else if(e.key==='Enter'){if(done)nextCard();}
  };
}
/* 取出第 k 个空所在的那一句话，切成 前 / 空 / 后 */
function PICK_TOKENS(p,k){
  for(const it of p.body){
    if(it.type==='p'){
      const idx=it.toks.findIndex(t=>t.t==='b'&&t.k===k);
      if(idx>=0){
        const before=it.toks.slice(0,idx).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
        const after=it.toks.slice(idx+1).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
        return {before,after};
      }
    }else{
      for(const r of it.rows)for(const cell of r){
        const idx=cell.findIndex(t=>t.t==='b'&&t.k===k);
        if(idx>=0){
          const before=cell.slice(0,idx).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
          const after=cell.slice(idx+1).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
          return {before,after};
        }
      }
    }
  }
  return {before:'',after:''};
}

/* ---------------- ⑤ 清单 ---------------- */
let LISTQ='',LISTHIDE=false;
function renderList(st){
  const q=LISTQ.trim();
  const cards=DATA.cards.filter(c=>{
    if(!q)return true;
    const hay=(c.q+' '+(c.a||[]).join(' ')+' '+(c.warn||'')+' '+(c.lesson||'')).toLowerCase();
    return hay.includes(q.toLowerCase());
  });
  const byUnit=new Map();
  cards.forEach(c=>{
    const u=c.unit||'未分单元';
    if(!byUnit.has(u))byUnit.set(u,[]);
    byUnit.get(u).push(c);
  });
  // 单元进度
  const ubars=[...byUnit.entries()].map(([u,arr])=>{
    const doneN=arr.filter(c=>level(c.id)===3).length;
    const pc=Math.round(doneN/arr.length*100);
    return `<div class="ubar"><span class="nm" title="${esc(u)}">${esc(u)}</span><span class="tr"><i style="width:${pc}%"></i></span><span class="pc">${pc}%</span></div>`;
  }).join('');
  // 最该补的 10 张
  const weak=DATA.cards.map(c=>({c,lv:level(c.id),p:getP(c.id)}))
    .filter(x=>x.p&&x.p.wrong>0&&x.lv!==3)
    .sort((a,b)=>b.p.wrong-a.p.wrong||a.lv-b.lv).slice(0,10);
  const weakHTML=weak.length?`<div class="report"><h3>最该补的 ${weak.length} 张（错得最多 / 还没拿稳）</h3><ul>${
    weak.map(({c,p})=>`<li>${esc(c.q)} <b>错 ${p.wrong} 次</b> <span class="hint">· ${esc(c.lesson||c.unit||'')}</span></li>`).join('')
  }</ul><div class="hint">这些卡会优先出现在 ④ 错题强化 里。</div></div>`:'';

  st.innerHTML=`<input class="searchbox" id="sq" placeholder="搜索考点关键词，比如「民主」「瓦特」「条约」…" value="${esc(LISTQ)}">
    <div class="bar" style="margin-top:10px"><div class="row">
      <label style="display:flex;gap:6px;align-items:center;cursor:pointer">
      <input type="checkbox" id="hide"${LISTHIDE?' checked':''}> 遮住红字（自测用，点一下灰块能揭开）</label>
      <span class="sp"></span><button class="linkbtn" id="prt">打印这份清单</button></div></div>
    ${ubars?`<div class="report"><h3>各单元熟练度（连续答对 3 次才算熟练）</h3><div class="ubars">${ubars}</div></div>`:''}
    ${weakHTML}
    ${cards.length?[...byUnit.entries()].map(([u,arr])=>`
      <div class="unitbox">
        <h3>${esc(u)} <span>${arr.length} 个考点</span></h3>
        ${arr.map(c=>{
          const lv=level(c.id);
          return `<details class="k" data-id="${c.id}">
            <summary><span style="flex:1">${esc(c.q)}</span>
              <span class="lv lv${lv}">${lv===4?'待强化':LVTXT[lv]}</span></summary>
            <div class="bd${LISTHIDE?' hidekw':''}">
              <div class="meta"><span class="mt">${esc(c.lesson||'')}${c.node?' ／ '+esc(c.node):''}</span><span class="mr">${pageLink(c)}<span class="stars">${STAR(c.star)}</span></span></div>
              <div class="ans" style="border-top:0;padding-top:0;margin-top:6px">${renderAns(c,PLAN[c.id],false)}</div>
              ${warnHTML(c)}
              <div class="acts"><button class="btn sm" data-solo="${c.id}">只练这张</button></div>
            </div>
          </details>`;
        }).join('')}
      </div>`).join(''):'<div class="card empty"><span class="big">🔍</span>没搜到。换个词试试。</div>'}`;

  $('#sq',st).oninput=e=>{LISTQ=e.target.value;const pos=e.target.selectionStart;renderList(st);const n=$('#sq',st);n.focus();n.setSelectionRange(pos,pos);};
  $('#hide',st).onchange=e=>{LISTHIDE=e.target.checked;renderList(st);};
  $('#prt',st).onclick=()=>window.print();
  $$('[data-solo]',st).forEach(b=>b.onclick=()=>{
    S.queue=[b.dataset.solo];S.qi=0;S.mode='recite';S.revealed=true;S.scored=false;render();
  });
}

/* ================================================================
   启动
   ================================================================ */
function boot(){
  if(!DATA||!DATA.cards||!DATA.cards.length){
    $('#stage').innerHTML='<div class="card empty"><span class="big">⚠</span>没有读到考点数据。<br>请确认这个文件没有被改动过。</div>';
    return;
  }
  document.documentElement.dataset.subj=DATA.subject||'';
  document.title=DATA.title||'核心考点训练';
  $('#ttl').textContent=DATA.title||'核心考点训练';
  $('#sb').textContent=`共 ${DATA.cards.length} 个考点 · 记录存在本机浏览器`;
  $$('#tabs button').forEach(b=>b.onclick=()=>{
    if(b.dataset.mode===S.mode)return;
    S.mode=b.dataset.mode;S.qi=0;S.revealed=false;S.scored=false;S.cur=null;S.choice=null;
    buildQueue();render();scrollTop();
  });
  buildQueue();render();
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea'))return;
    if(S.mode==='recite'){
      if(!S.revealed&&(e.key===' '||e.code==='Space')){e.preventDefault();S.revealed=true;render();}
      else if(S.revealed){
        const map={'1':'1','2':'0.5','3':'0'};
        if(map[e.key]){e.preventDefault();const f=$(`#acts button[data-v="${map[e.key]}"]`);if(f)f.click();}
      }
    }else if(S.mode==='cloze'&&e.key==='Enter'){
      const s=$('#sub'),n=$('#nx2');if(s)s.click();else if(n)n.click();
    }else if(S.mode==='choice'&&e.key==='Enter'){
      const n=$('#nx3');if(n)n.click();
    }
  });
}
boot();
</script>
</body>
</html>
