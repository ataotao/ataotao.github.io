<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>物理训练脚手架</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#1b2333; --muted:#6b7280; --line:#e6e9f2;
  --brand:#0f9b8e; --brand-soft:#e6f6f4; --ok:#0f9d58; --ok-soft:#e8f6ee;
  --bad:#d93025; --bad-soft:#fdecea; --warn:#c26a00; --warn-soft:#fff4e2;
  --r:14px; --shadow:0 1px 2px rgba(20,30,60,.05),0 8px 24px rgba(20,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{
  position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px}
.ver{font-size:11px;color:var(--muted);font-weight:600;border:1px solid var(--line);border-radius:20px;padding:1px 7px}
.top-note{font-size:12px;color:var(--muted);margin-left:auto}
nav.tabs{max-width:860px;margin:0 auto;padding:8px 16px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
  padding:8px 12px;border-radius:10px 10px 0 0;cursor:pointer;border-bottom:2px solid transparent;
}
nav.tabs button:hover{color:var(--ink);background:#eef1f8}
nav.tabs button.active{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}
main{padding-top:18px}
h2{font-size:19px;margin:26px 0 10px;letter-spacing:.2px}
h3{font-size:16px;margin:18px 0 8px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:11px;cursor:pointer;
  transition:transform .06s ease,background .12s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#0c8a7e}
.btn-ghost{background:transparent;border-color:transparent;color:var(--brand);padding:6px 8px}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:24px;line-height:1.2;margin-top:2px}
.stat span{font-size:13px;color:var(--muted)}
.module{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);
}
.module .mh{display:flex;align-items:center;gap:8px}
.module .mh b{font-size:16px}
.module .desc{font-size:13px;color:var(--muted);min-height:40px}
.module .kinds{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.kind{font-size:12px;color:var(--muted);background:#f2f4fa;border-radius:7px;padding:2px 8px}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task .no{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.task.done .no{background:var(--ok-soft);color:var(--ok)}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block;font-size:14px}
.task .tt span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:#eef1f8;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .25s ease}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qbody{font-size:17px;line-height:1.85}
.qbody .hl{background:linear-gradient(transparent 62%,#ffe9a8 62%);padding:0 1px}
.field{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.field .lbl{font-size:15px;min-width:80px}
.field .lbl.full{min-width:100%;margin-bottom:-4px;color:#3b4356;font-weight:600}
.input{
  flex:1;min-width:130px;max-width:260px;font:inherit;font-size:16px;padding:10px 12px;
  border:1.5px solid var(--line);border-radius:11px;background:#fbfcff;color:var(--ink);outline:none;
}
.input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(15,155,142,.12)}
.input.ok{border-color:var(--ok);background:var(--ok-soft)}
.input.bad{border-color:var(--bad);background:var(--bad-soft)}
.unit{color:var(--muted);font-size:14px}
.fin{display:inline-flex;align-items:center;gap:8px}
.fone{width:160px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcff;text-align:center;font:inherit;font-size:16px;padding:9px 6px;outline:none;color:var(--ink)}
.fone:focus{border-color:var(--brand);background:#fff}
.fin.ok .fone{border-color:var(--ok);background:var(--ok-soft)}
.fin.bad .fone{border-color:var(--bad);background:var(--bad-soft)}
.padwrap{margin-top:10px}
canvas.pad{display:block;width:100%;height:auto;background:#fff;border:1.5px dashed #c9d4ee;border-radius:12px;touch-action:none;cursor:crosshair}
.opt{
  display:block;width:100%;text-align:left;font:inherit;font-size:15px;padding:11px 14px;margin:8px 0;
  border:1.5px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;
}
.opt:hover{border-color:#c9d4ee;background:#fafbff}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.optgrid .opt{margin:0;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.optgrid .optfig svg{width:100%;height:auto;display:block}
.optgrid .opt b{font-size:13px;color:var(--muted);font-weight:700}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fbfcff}
.fb.good{border-color:#bfe6cf;background:var(--ok-soft)}
.fb.bad{border-color:#f3c4bf;background:var(--bad-soft)}
.fb .ftitle{font-weight:800;margin-bottom:6px}
.fb ul{margin:6px 0 0;padding-left:20px}
.fb li{margin:4px 0}
.steps{list-style:none;padding:0;margin:8px 0 0}
.steps li{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:14px;line-height:1.6}
.steps .mk{flex:0 0 auto;font-weight:800;width:16px}
.steps .mk.ok{color:var(--ok)}
.steps .mk.bad{color:var(--bad)}
.steps .stepno{font-weight:700;color:var(--brand);margin-right:2px}
.tipbox{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px;margin:12px 0}
.figcap{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.figbox{margin-top:6px}
.figbox svg{width:100%;max-width:380px;height:auto;display:block;margin:0 auto}
.figbefore{margin:10px 0 2px}
.progress{height:5px;background:#e9edf6;border-radius:5px;overflow:hidden;margin:10px 0 0}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#3fc9bb,#0f9b8e);border-radius:5px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.tb th{font-size:12px;color:var(--muted);font-weight:600}
table.tb td.n,table.tb th.n{text-align:right;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:8px;height:70px;margin-top:8px}
.spark .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.spark .col i{display:block;width:100%;max-width:26px;background:#b9e6e1;border-radius:5px 5px 2px 2px;min-height:2px}
.spark .col span{font-size:10px;color:var(--muted)}
.wrongitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.wrongitem:last-child{border-bottom:0}
.wrongitem .wt{flex:1;min-width:0;font-size:13px;color:#3b4356}
.footer{margin-top:36px;text-align:center;font-size:12px;color:#9aa3b5}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}
@media (max-width:520px){
  .top-note{display:none}
  .qbody{font-size:16px}
  .field .lbl{min-width:100%}
  .input{max-width:none;flex-basis:100%}
  .optgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">物理训练脚手架</div>
    <span class="ver">v1</span>
    <span class="top-note">认模型 · 认量 · 算到底 · 作图判断 · 读数</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-go="today">今日</button>
    <button data-go="model">认模型</button>
    <button data-go="amount">认量</button>
    <button data-go="calc">算到底</button>
    <button data-go="draw">作图判断</button>
    <button data-go="read">读数</button>
    <button data-go="wrong">错题本</button>
    <button data-go="report">报告</button>
  </nav>
</header>
<main class="wrap" id="app"></main>
<div class="footer">记录只存本机浏览器（localStorage）· 每周导出一次 · 单文件离线可用</div>

<script id="core">
/* =====================================================================
   物理训练脚手架 · 纯逻辑层（不碰 DOM，可在 node 里单测）
   题全部参数化生成；图全部内联 SVG，零图片依赖。
   ===================================================================== */
var PT = (function () {
  'use strict';

  var VERSION = 1;
  var DAY = 86400000;

  /* ---------- 随机：可复现（同一 seed 同一题） ---------- */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function ri(r, a, b) { return a + Math.floor(r() * (b - a + 1)); }
  function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }
  function shuffled(r, arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* ---------- 数字解析：科学计数法 / 百分比 / 带单位 / 全角 / 负号变体 ---------- */
  var SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-', '⁺': '+' };
  function parseNum(input) {
    if (input === null || input === undefined) return NaN;
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    var s = String(input).trim();
    if (!s) return NaN;
    s = s.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[．。]/g, '.')
      .replace(/[％]/g, '%')
      .replace(/[−－—–]/g, '-')
      .replace(/[×✕✖]/g, '×')
      .replace(/[，,\s]/g, '');
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, function (m) {
      var out = '';
      for (var i = 0; i < m.length; i++) out += (SUP[m.charAt(i)] || '');
      return '^' + out;
    });
    s = s.replace(/[×xX*]\s*10\s*\^\s*/g, 'e');
    s = s.replace(/%/g, '');
    if (!s) return NaN;
    var mf = s.match(/^([-+]?(?:\d+(?:\.\d*)?|\.\d+))\/([-+]?(?:\d+(?:\.\d*)?|\.\d+))$/);
    if (mf) { var dv = parseFloat(mf[2]); return dv === 0 ? NaN : parseFloat(mf[1]) / dv; }
    if (/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?$/i.test(s)) return parseFloat(s);
    /* 允许把单位一起打进来：30N / 0.4m / 4.2e3J/(kg·℃) */
    var s2 = s.replace(/[A-Za-z\u4e00-\u9fa5℃°Ω()（）\/·、]+$/g, '');
    if (s2 && s2 !== s && /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?$/i.test(s2)) return parseFloat(s2);
    return NaN;
  }
  function supStr(n) {
    var SUPS = ['⁰', '¹', '²', '³', '⁴', '⁵', '⁶', '⁷', '⁸', '⁹'];
    var str = String(Math.abs(n)), out = '';
    for (var i = 0; i < str.length; i++) out += SUPS[+str.charAt(i)];
    return (n < 0 ? '⁻' : '') + out;
  }
  /* 物理版数字显示：小数 + 科学计数法（不用上下分数） */
  function fmtNum(x) {
    if (!isFinite(x)) return '?';
    if (x === 0) return '0';
    var ax = Math.abs(x);
    if (ax < 1e-3 || ax >= 1e5) {
      var e = Math.floor(Math.log(ax) / Math.LN10);
      var m = x / Math.pow(10, e);
      m = Math.round(m * 1000) / 1000;
      if (Math.abs(m) >= 10) { m = m / 10; e += 1; }
      return String(m).replace('-', '−') + '×10' + supStr(e);
    }
    return String(Math.round(x * 1000) / 1000).replace('-', '−');
  }
  function relTol(ans, tol) {
    return (tol === undefined || tol === null) ? Math.max(Math.abs(ans) * 1e-3, 1e-9) : Math.abs(tol);
  }
  function near(a, b, tol) { return isFinite(a) && Math.abs(a - b) <= (tol || 1e-9) + 1e-12; }

  /* ---------- 判分：逐字段判，字段顺序 = 解题步骤 ---------- */
  function judge(q, vals) {
    var res = q.fields.map(function (f, i) {
      var v = vals[i];
      if (f.type === 'choice') return { ok: v === f.ans };
      var x = (typeof v === 'number') ? v : parseNum(v);
      if (!isFinite(x)) return { ok: false };
      var ans = f.ans;
      /* 百分比：答案存百分数（如 21），输入 21 / 21% / 0.21 都算对 */
      if (f.unit === '%' && Math.abs(ans) > 1.5 && x !== 0 && Math.abs(x) <= 1.5) x = x * 100;
      return { ok: Math.abs(x - ans) <= relTol(ans, f.tol) + 1e-9 };
    });
    var got = res.filter(function (x) { return x.ok; }).length;
    return { ok: got === res.length, got: got, total: res.length, res: res };
  }
  function ansText(f) {
    if (f.type === 'choice') return f.options[f.ans];
    return fmtNum(f.ans) + (f.unit ? ' ' + f.unit : '');
  }
  function makeChoice(r, correct, distractors) {
    var pool = [correct].concat(distractors), opts = [];
    for (var i = 0; i < pool.length; i++) if (opts.indexOf(pool[i]) < 0) opts.push(pool[i]);
    for (var j = opts.length - 1; j > 0; j--) { var k = Math.floor(r() * (j + 1)), t = opts[j]; opts[j] = opts[k]; opts[k] = t; }
    return { type: 'choice', label: '', options: opts, ans: opts.indexOf(correct) };
  }
  function choiceField(r, correct, distractors, label) {
    var f = makeChoice(r, correct, distractors);
    f.label = label || '';
    return f;
  }

  /* ================= 内联 SVG 图元（零图片） ================= */
  function r1(x) { return isFinite(x) ? String(Math.round(x * 10) / 10) : '0'; }
  function svgHead(W, H, label) {
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + (label || '题图') + '" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif">' +
      '<rect width="' + W + '" height="' + H + '" fill="#fbfcff" rx="10"/>';
  }
  function svgTail() { return '</svg>'; }
  function txt(x, y, s, size, fill, anchor, weight) {
    return '<text x="' + r1(x) + '" y="' + r1(y) + '" font-size="' + (size || 12) + '" fill="' + (fill || '#1b2333') + '"' +
      (anchor ? ' text-anchor="' + anchor + '"' : '') + (weight ? ' font-weight="' + weight + '"' : '') + '>' + s + '</text>';
  }
  function ln(x1, y1, x2, y2, color, w, dash) {
    return '<line x1="' + r1(x1) + '" y1="' + r1(y1) + '" x2="' + r1(x2) + '" y2="' + r1(y2) + '" stroke="' + (color || '#1b2333') +
      '" stroke-width="' + (w || 2) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linecap="round"/>';
  }
  function circle(x, y, rad, fill, stroke, w) {
    return '<circle cx="' + r1(x) + '" cy="' + r1(y) + '" r="' + r1(rad) + '" fill="' + (fill || 'none') + '"' +
      (stroke ? ' stroke="' + stroke + '" stroke-width="' + (w || 2) + '"' : '') + '/>';
  }
  function arrow(x1, y1, x2, y2, color, w) {
    var ang = Math.atan2(y2 - y1, x2 - x1), L = 9;
    var ax = x2 - L * Math.cos(ang - 0.4), ay = y2 - L * Math.sin(ang - 0.4);
    var bx = x2 - L * Math.cos(ang + 0.4), by = y2 - L * Math.sin(ang + 0.4);
    return ln(x1, y1, x2, y2, color, w || 2) +
      '<path d="M' + r1(x2) + ' ' + r1(y2) + ' L' + r1(ax) + ' ' + r1(ay) + ' L' + r1(bx) + ' ' + r1(by) + ' Z" fill="' + (color || '#1b2333') + '"/>';
  }
  function hatch(x1, x2, y) {
    var out = ln(x1, y, x2, y, '#6b7280', 3);
    for (var i = x1 + 14; i < x2; i += 22) out += ln(i, y, i - 9, y + 11, '#c9d4ee', 1.6);
    return out;
  }

  function svgTension(f) {
    var mode = f.mode || 'two';
    var W = 340, H = (mode === 'string') ? 250 : 210, s = [svgHead(W, H, '测力计示意图')];
    if (mode === 'two') {
      var F = f.F || 4;
      s.push('<rect x="110" y="66" width="120" height="68" rx="10" fill="#fff" stroke="#0f9b8e" stroke-width="2.4"/>');
      s.push(txt(170, 106, '弹簧测力计', 12, '#0f9b8e', 'middle', 600));
      s.push(ln(110, 100, 88, 100, '#6b7280', 3));
      s.push(circle(84, 100, 5, '#fff', '#6b7280', 2));
      s.push(ln(230, 100, 252, 100, '#6b7280', 3));
      s.push(circle(257, 100, 5, '#fff', '#6b7280', 2));
      s.push(arrow(30, 100, 78, 100, '#d93025', 2.6));
      s.push(txt(50, 88, F + ' N', 13, '#d93025', 'middle', 700));
      s.push(arrow(310, 100, 262, 100, '#d93025', 2.6));
      s.push(txt(290, 88, F + ' N', 13, '#d93025', 'middle', 700));
      s.push(txt(170, 168, '两端各用 ' + F + ' N 的力沿相反方向拉，测力计静止', 11, '#6b7280', 'middle'));
    } else if (mode === 'pulley') {
      var G = f.G || 4;
      s.push(hatch(40, 300, 26));
      s.push(ln(210, 26, 210, 40, '#6b7280', 2.4));
      s.push(circle(210, 64, 24, '#fff', '#6b7280', 2.6));

  function svgSpring(f) {
    var W = 250, H = 330, s = [svgHead(W, H, '弹簧测力计')];
    var max = f.max || 5, div = f.div || 0.2, reading = f.reading || 1;
    var yTop = 70, yBot = 250;
    function yy(v) { return yTop + (v / max) * (yBot - yTop); }
    s.push(circle(120, 30, 11, 'none', '#6b7280', 2.6));
    s.push(ln(120, 41, 120, 52, '#6b7280', 2.4));
    s.push('<rect x="80" y="52" width="80" height="212" rx="9" fill="#fff" stroke="#6b7280" stroke-width="2.4"/>');
    var steps = Math.round(max / div);
    for (var k = 0; k <= steps; k++) {
      var v = k * div, major = (k % 5 === 0);
      s.push(ln(98, yy(v), 98 + (major ? 15 : 8), yy(v), '#1b2333', major ? 1.8 : 1));
      if (major) s.push(txt(94, yy(v) + 4, String(Math.round(v * 10) / 10), 10, '#1b2333', 'end'));
    }
    var yp = yy(reading);
    s.push(ln(96, yp, 154, yp, '#d93025', 2.6));
    s.push('<path d="M96 ' + r1(yp) + ' l-8 -5 l0 10 z" fill="#d93025"/>');
    s.push(ln(120, 264, 120, 286, '#6b7280', 2.6));
    s.push('<path d="M120 286 q0 16 16 16 q12 0 12 -10" fill="none" stroke="#6b7280" stroke-width="2.6"/>');
    s.push(svgTail());
    return s.join('');
  }

  function svgFor(q) {
    var f = q && q.fig;
    if (!f) return '';
    var body = '';
    if (f.type === 'tension') body = svgTension(f);
    else if (f.type === 'circuit') body = svgCircuit(f);
    else if (f.type === 'stroke') body = svgStroke(f);
    else if (f.type === 'pulley') body = svgPulley(f);
    else if (f.type === 'lever') body = svgLever(f);
    else if (f.type === 'charge') body = svgCharge(f);
    else if (f.type === 'ammeter') body = svgAmmeter(f);
    else if (f.type === 'thermometer') body = svgThermometer(f);
    else if (f.type === 'spring') body = svgSpring(f);
    return body;
  }

  function genCalcHeat(r) {
    var sub = pick(r, [{ n: '水', c: 4200 }, { n: '煤油', c: 2100 }, { n: '铝', c: 880 }]);
    var m = pick(r, [0.5, 1, 2, 3, 4, 5]);
    var t0 = pick(r, [10, 20, 30]);
    var dt = pick(r, [20, 30, 40, 50, 60]);
    var t1 = t0 + dt;
    var Q = sub.c * m * dt;
    return {
      id: 'calc.qheat', kind: 'qheat', title: 'Q = cmΔt',
      prompt: '把质量为 ' + m + ' kg、初温 ' + t0 + '℃ 的' + sub.n + '加热到 ' + t1 + '℃。已知 c' + sub.n + ' = ' + fmtNum(sub.c) + ' J/(kg·℃)。求' + sub.n + '吸收的热量。',
      fields: [
        choiceField(r, 'Q = cmΔt', ['Q = mq', 'W = Fs', 'P = W/t'], '第 1 步 选公式：'),
        { type: 'num', label: '第 2 步 指认量：m =', ans: m, unit: 'kg' },
        { type: 'num', label: 'Δt =', ans: dt, unit: '℃' },
        { type: 'num', label: '第 3 步 代入：Q =', ans: Q, unit: 'J' }
      ],
      tip: 'Q = cmΔt：c 用题目给的比热容，m 用被加热物体的质量，Δt = 末温 − 初温。',
      explain: [
        'Q吸 = cmΔt。',
        'm = ' + m + ' kg，Δt = ' + t1 + ' − ' + t0 + ' = ' + dt + '℃。',
        'Q = ' + fmtNum(sub.c) + ' × ' + m + ' × ' + dt + ' = ' + fmtNum(Q) + ' J。'
      ],
      kp: ['热量', '比热容']
    };
  }

  function genCalcFuel(r) {
    var fuel = pick(r, [{ n: '木炭', q: 3.4e7 }, { n: '汽油', q: 4.6e7 }, { n: '焦炭', q: 3.0e7 }]);
    var m = pick(r, [0.2, 0.3, 0.4, 0.5, 1, 1.2, 2]);
    var Q = m * fuel.q;
    return {
      id: 'calc.qfuel', kind: 'qfuel', title: 'Q = mq',
      prompt: '完全燃烧 ' + m + ' kg 的' + fuel.n + '，已知' + fuel.n + '的热值 q = ' + fmtNum(fuel.q) + ' J/kg。求放出的热量。',
      fields: [
        choiceField(r, 'Q放 = mq', ['Q吸 = cmΔt', 'W = Fs', 'P = W/t'], '第 1 步 选公式：'),
        { type: 'num', label: '第 2 步 指认量：m =', ans: m, unit: 'kg' },
        { type: 'num', label: 'q =', ans: fuel.q, unit: 'J/kg' },
        { type: 'num', label: '第 3 步 代入：Q放 =', ans: Q, unit: 'J' }
      ],
      tip: 'Q放 = mq：m 是完全燃烧的燃料质量，q 是热值。',
      explain: [
        'Q放 = mq。',
        'm = ' + m + ' kg，q = ' + fmtNum(fuel.q) + ' J/kg。',
        'Q放 = ' + m + ' × ' + fmtNum(fuel.q) + ' = ' + fmtNum(Q) + ' J。'
      ],
      kp: ['热值', '热量']
    };
  }

  function genCalcEff(r) {
    var mWater = pick(r, [2, 3, 5]);
    var t1 = pick(r, [60, 70, 80, 88]);
    var dt = t1 - 20;
    var Qabs = 4200 * mWater * dt;
    var mFuel = pick(r, [0.1, 0.2, 0.3]);
    var Qrel = mFuel * 3.4e7;
    var eta = Math.round(Qabs / Qrel * 1000) / 10;
    return {
      id: 'calc.qeff', kind: 'qeff', title: 'η = Q吸 / Q放',
      prompt: '用炭炉把 ' + mWater + ' kg、20℃ 的水加热到 ' + t1 + '℃，共完全燃烧 ' + mFuel + ' kg 木炭。已知 c水 = 4.2×10³ J/(kg·℃)，木炭热值 q = 3.4×10⁷ J/kg。求加热效率。',
      fields: [
        choiceField(r, 'η = Q吸/Q放', ['η = Q放/Q吸', 'η = Q吸/(Q吸+Q放)', 'η = Q放/(Q吸+Q放)'], '第 1 步 选公式：'),
        { type: 'num', label: '第 2 步 指认量：Q吸 =', ans: Qabs, unit: 'J' },
        { type: 'num', label: 'Q放 =', ans: Qrel, unit: 'J' },
        { type: 'num', label: '第 3 步 代入：η =', ans: eta, unit: '%', tol: 0.15 }
      ],
      tip: '加热效率 = 水吸收的热量 ÷ 燃料完全燃烧放出的热量。',
      explain: [
        'Q吸 = cmΔt = 4.2×10³ × ' + mWater + ' × ' + dt + ' = ' + fmtNum(Qabs) + ' J。',
        'Q放 = mq = ' + mFuel + ' × 3.4×10⁷ = ' + fmtNum(Qrel) + ' J。',
        'η = Q吸/Q放 = ' + fmtNum(Qabs) + ' ÷ ' + fmtNum(Qrel) + ' ≈ ' + fmtNum(eta) + '%。'
      ],
      kp: ['加热效率', '热量']
    };
  }

  function genCalcWorkPower(r) {
    var v = ri(r, 0, 1);
    var F = pick(r, [50, 100, 150, 200]);
    var s = pick(r, [2, 3, 4, 5]);
    var W = F * s;
    if (v === 0) {
      return {
        id: 'calc.workpower', kind: 'workpower', title: 'W = Fs',
        prompt: '用 ' + F + ' N 的水平推力把箱子沿力的方向推动 ' + s + ' m。求推力做的功。',
        fields: [
          choiceField(r, 'W = Fs', ['W = F/s', 'W = mgh', 'P = W/t'], '第 1 步 选公式：'),
          { type: 'num', label: '第 2 步 指认量：F =', ans: F, unit: 'N' },
          { type: 'num', label: 's =', ans: s, unit: 'm' },
          { type: 'num', label: '第 3 步 代入：W =', ans: W, unit: 'J' }
        ],
        tip: 'W = Fs：F 是沿力的方向上的力，s 是沿力的方向移动的距离。',
        explain: ['W = Fs = ' + F + ' × ' + s + ' = ' + W + ' J。'],
        kp: ['功', '计算']
      };

    var t = pick(r, [10, 20, 25, 50]);
    var P = Math.round(W / t * 100) / 100;
    return {
      id: 'calc.workpower', kind: 'workpower', title: 'P = W/t',
      prompt: '某机器在 ' + t + ' s 内做了 ' + W + ' J 的功。求它的功率。',
      fields: [
        choiceField(r, 'P = W/t', ['P = Wt', 'P = F/t', 'P = Wt²'], '第 1 步 选公式：'),
        { type: 'num', label: '第 2 步 指认量：W =', ans: W, unit: 'J' },
        { type: 'num', label: 't =', ans: t, unit: 's' },
        { type: 'num', label: '第 3 步 代入：P =', ans: P, unit: 'W' }
      ],
      tip: 'P = W/t：功率是做功的快慢。',
      explain: ['P = W/t = ' + W + ' ÷ ' + t + ' = ' + fmtNum(P) + ' W。'],
      kp: ['功率', '计算']
    };
  }

  function genCalcPulley(r) {
    var v = ri(r, 0, 2);
    if (v === 0) {
      var n = pick(r, [2, 3]);
      var h = pick(r, [3, 4, 5, 6]);
      var s = n * h;
      return {
        id: 'calc.pulleycalc', kind: 'pulleycalc', title: '滑轮组 s = nh',
        prompt: '用滑轮组匀速提升物体，承担物重的绳子有 n = ' + n + ' 段，物体上升 h = ' + h + ' m。求绳端移动的距离。',
        fields: [
          choiceField(r, 's = nh', ['s = h/n', 's = n/h', 'h = ns'], '第 1 步 选公式：'),
          { type: 'num', label: '第 2 步 指认量：n =', ans: n },
          { type: 'num', label: 'h =', ans: h, unit: 'm' },
          { type: 'num', label: '第 3 步 代入：s =', ans: s, unit: 'm' }
        ],
        tip: '绳端移动距离是物体上升高度的 n 倍：s = nh。',
        explain: ['s = nh = ' + n + ' × ' + h + ' = ' + s + ' m。'],
        kp: ['滑轮组', '计算']
      };
    }
    if (v === 1) {
      var m = pick(r, [20, 30, 40, 50]);
      var G = m * 10;
      var h2 = pick(r, [2, 3, 4, 5]);
      var Wy = G * h2;
      return {
        id: 'calc.pulleycalc', kind: 'pulleycalc', title: '滑轮组 W有 = Gh',
        prompt: '用滑轮组把质量 ' + m + ' kg 的土石匀速提升 ' + h2 + ' m（g 取 10 N/kg）。求有用功。',
        fields: [
          choiceField(r, 'W有 = Gh', ['W有 = Fs', 'W总 = Gh', 'W有 = mh'], '第 1 步 选公式：'),
          { type: 'num', label: '第 2 步 指认量：G = mg =', ans: G, unit: 'N' },
          { type: 'num', label: 'h =', ans: h2, unit: 'm' },
          { type: 'num', label: '第 3 步 代入：W有 =', ans: Wy, unit: 'J' }
        ],
        tip: '有用功是克服物重做的功：W有 = Gh = mgh。',
        explain: ['G = mg = ' + m + ' × 10 = ' + G + ' N。', 'W有 = Gh = ' + G + ' × ' + h2 + ' = ' + Wy + ' J。'],
        kp: ['滑轮组', '有用功']
      };
    }
    var Wy2 = pick(r, [1200, 1500, 1800, 2000]);
    var Wt = Wy2 + pick(r, [200, 300, 400, 540]);

    return {
      id: 'calc.pulleycalc', kind: 'pulleycalc', title: '滑轮组 η = W有/W总',
      prompt: '用滑轮组提升重物时，有用功 W有 = ' + Wy2 + ' J，总功 W总 = ' + Wt + ' J。求机械效率。',
      fields: [
        choiceField(r, 'η = W有/W总', ['η = W总/W有', 'η = W有×W总', 'η = W总/W有×100%'], '第 1 步 选公式：'),
        { type: 'num', label: '第 2 步 指认量：W有 =', ans: Wy2, unit: 'J' },
        { type: 'num', label: 'W总 =', ans: Wt, unit: 'J' },
        { type: 'num', label: '第 3 步 代入：η =', ans: eta, unit: '%', tol: 0.15 }
      ],
      tip: '机械效率 = 有用功 ÷ 总功，一定小于 1。',
      explain: ['η = W有/W总 = ' + Wy2 + ' ÷ ' + Wt + ' ≈ ' + fmtNum(eta) + '%。'],
      kp: ['机械效率', '计算']
    };
  }

  function genCalcLever(r) {
    var l1 = pick(r, [0.2, 0.4, 0.5, 0.8]);
    /* 避开 F₁ 出现 3 位小数的组合（如 l₁=0.8、l₂=0.25 → 0.3125 倍），
       学生按 2 位/1 位有效数字写 3.13/15.6 时不应被判错。 */
    var l2 = pick(r, [0.1, 0.2, 0.25, 0.4].filter(function (x) {
      return x !== l1 && !(l1 === 0.8 && x === 0.25);
    }));
    var F2 = pick(r, [10, 20, 30, 40, 50, 60]);
    var F1 = F2 * l2 / l1;
    return {
      id: 'calc.lever', kind: 'lever', title: '杠杆 F₁l₁ = F₂l₂',
      prompt: '杠杆平衡时，动力臂 l₁ = ' + l1 + ' m，阻力臂 l₂ = ' + l2 + ' m，阻力 F₂ = ' + F2 + ' N。求动力 F₁。',
      fields: [
        choiceField(r, 'F₁l₁ = F₂l₂', ['F₁l₁ = F₂/l₂', 'F₁ = F₂', 'F₁/l₁ = F₂l₂'], '第 1 步 选公式：'),
        { type: 'num', label: '第 2 步 指认量：l₁ =', ans: l1, unit: 'm' },
        { type: 'num', label: 'l₂ =', ans: l2, unit: 'm' },
        { type: 'num', label: '第 3 步 代入：F₁ =', ans: F1, unit: 'N', tol: 0.05 }
      ],
      tip: '杠杆平衡条件：动力 × 动力臂 = 阻力 × 阻力臂。',
      explain: ['F₁l₁ = F₂l₂ → F₁ = F₂l₂/l₁。', 'F₁ = ' + F2 + ' × ' + l2 + ' ÷ ' + l1 + ' = ' + fmtNum(F1) + ' N。'],
      kp: ['杠杆', '平衡条件']
    };
  }

  function genReadAmmeter(r) {
    var range = pick(r, [0.6, 3]);
    var div = range === 0.6 ? 0.02 : 0.1;
    var k = ri(r, 3, 28);
    var reading = Math.round(k * div * 100) / 100;
    var fmt = range === 0.6 ? '0~0.6 A' : '0~3 A';
    return {
      id: 'read.ammeter', kind: 'ammeter', title: '电流表读数',
      prompt: '如图是电流表的表盘（表盘上有 0~0.6 A 和 0~3 A 两个量程的刻度）。现在使用的是 ' + fmt + ' 量程，指针位置如图。',
      fields: [
        { type: 'num', label: '量程 =', ans: range, unit: 'A' },
        { type: 'num', label: '分度值 =', ans: div, unit: 'A' },
        { type: 'num', label: '读数 =', ans: reading, unit: 'A' }
      ],
      tip: '分度值 = 量程 ÷ 大格数；读数 = 小格数 × 分度值。',
      explain: ['使用的量程是 ' + fmt + '。', '0~' + range + ' A 一共 30 个小格，分度值 = ' + range + ' ÷ 30 = ' + fmtNum(div) + ' A。', '指针偏转 ' + k + ' 个小格，读数 = ' + k + ' × ' + fmtNum(div) + ' = ' + fmtNum(reading) + ' A。'],
      fig: { type: 'ammeter', range: range, reading: reading }, figBefore: true,
      kp: ['电流表', '读数']
    };
  }

  function genReadThermometer(r) {
    var lo = -10, hi = 110, div = 1;
    var reading = ri(r, -8, 108);
    return {
      id: 'read.thermometer', kind: 'thermometer', title: '温度计读数',
      prompt: '如图是温度计的刻度（单位 ℃）。把它放在被测液体中，液面位置如图。',
      fields: [
        { type: 'num', label: '量程上限 =', ans: hi, unit: '℃' },
        { type: 'num', label: '分度值 =', ans: div, unit: '℃' },
        { type: 'num', label: '读数 =', ans: reading, unit: '℃' }
      ],
      tip: '先看 0℃ 在哪，再往上看正数、往下看负数；分度值是最小一格代表的值。',
      explain: ['这支温度计的最低刻度是 ' + lo + '℃，最高刻度是 ' + hi + '℃，量程上限是 ' + hi + '℃。', '每一小格代表 ' + div + '℃，分度值 = ' + div + '℃。', '液面在第 ' + (reading - lo) + ' 小格处，读数 = ' + reading + '℃。'],
      fig: { type: 'thermometer', lo: lo, hi: hi, reading: reading }, figBefore: true,
      kp: ['温度计', '读数']
    };
  }

  function genReadSpring(r) {
    var max = 5, div = 0.2;
    var k = ri(r, 2, 24);
    var reading = Math.round(k * div * 10) / 10;
    return {
      id: 'read.spring', kind: 'spring', title: '弹簧测力计读数',
      prompt: '如图是弹簧测力计的刻度盘，指针位置如图。',
      fields: [
        { type: 'num', label: '量程 =', ans: max, unit: 'N' },
        { type: 'num', label: '分度值 =', ans: div, unit: 'N' },
        { type: 'num', label: '读数 =', ans: reading, unit: 'N' }
      ],
      tip: '量程看最大刻度，分度值看最小一格；读数 = 小格数 × 分度值。',
      explain: ['最大刻度是 ' + max + ' N，所以量程是 0~' + max + ' N。', '0~' + max + ' N 共 ' + Math.round(max / div) + ' 个小格，分度值 = ' + max + ' ÷ ' + Math.round(max / div) + ' = ' + fmtNum(div) + ' N。', '指针指在第 ' + k + ' 小格，读数 = ' + k + ' × ' + fmtNum(div) + ' = ' + fmtNum(reading) + ' N。'],
      fig: { type: 'spring', max: max, div: div, reading: reading }, figBefore: true,
      kp: ['弹簧测力计', '读数']
    };
  }

  /* ================= 模块注册表：顺序 = 每日顺序 = 页签顺序 ================= */
  var MODULES = [
    {
      id: 'model', name: '认模型', icon: '🧭',
      desc: '看图认模型：测力计串绳张力 / LED 极性 / 接触带电 / 四冲程 / 串并联与表位置 / 滑轮组 n 与力臂。',
      kinds: [
        { id: 'tension', name: '测力计串绳张力', gen: genModelTension },
        { id: 'led', name: 'LED 定电源极性', gen: genModelLed },
        { id: 'charge', name: '接触后带电', gen: genModelCharge },
        { id: 'stroke', name: '四冲程识别', gen: genModelStroke },
        { id: 'circuit', name: '串并联与表位置', gen: genModelCircuit },
        { id: 'pulley', name: '滑轮组 n 与力臂', gen: genModelPulley }
      ]
    },
    {
      id: 'amount', name: '认量', icon: '🎯',
      desc: '先认量再动笔：热量题的 m/Δt、热值题的「总−剩」、滑轮组的 s/h/n、效率题的 W有/W总。',
      kinds: [
        { id: 'heatmass', name: '热量题 m/Δt', gen: genAmountHeat },
        { id: 'fuelmass', name: '热值题总−剩', gen: genAmountFuel },
        { id: 'pulleyamount', name: '滑轮组 s/h/n', gen: genAmountPulley },
        { id: 'effamount', name: '效率题 W有/W总', gen: genAmountEff }
      ]
    },
    {
      id: 'calc', name: '算到底', icon: '🧮',
      desc: '选公式 → 指认量 → 代入算到底，每步单独判分，专治「写了公式就停」。',
      kinds: [
        { id: 'qheat', name: 'Q = cmΔt', gen: genCalcHeat },
        { id: 'qfuel', name: 'Q = mq', gen: genCalcFuel },
        { id: 'qeff', name: 'η = Q吸/Q放', gen: genCalcEff },
        { id: 'workpower', name: 'W = Fs、P = W/t', gen: genCalcWorkPower },
        { id: 'pulleycalc', name: '滑轮组 s=nh / W有 / η', gen: genCalcPulley },
        { id: 'lever', name: '杠杆 F₁l₁ = F₂l₂', gen: genCalcLever }
      ]
    },
    {
      id: 'draw', name: '作图判断', icon: '✏️',
      desc: '四选一选正确画法：力臂作垂线 / 滑轮组绕绳 n=2、n=3 / 并联电路连线。',
      kinds: [
        { id: 'lever', name: '力臂作垂线' },
        { id: 'rope', name: '滑轮组绕绳' },
        { id: 'wire', name: '并联电路连线' }
      ],
      items: DRAW
    },
    {
      id: 'read', name: '读数', icon: '📏',
      desc: '量程 / 分度值 / 读数三连：电流表、温度计、弹簧测力计表盘。',
      kinds: [
        { id: 'ammeter', name: '电流表读数', gen: genReadAmmeter },
        { id: 'thermometer', name: '温度计读数', gen: genReadThermometer },
        { id: 'spring', name: '弹簧测力计读数', gen: genReadSpring }
      ]
    }
  ];

  function moduleById(id) {
    for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === id) return MODULES[i];
    return null;
  }

  /* ================= 出题 ================= */
  function gen(modId, kindId, seed) {
    var m = moduleById(modId);
    if (!m) throw new Error('未知模块 ' + modId);
    var r = mulberry32((seed >>> 0) || 1);
    if (m.items) {
      /* 固定题（draw）：按 kind 过滤后再按 seed 取，保证「按题型练」不会抽到别的题型 */
      var pool = kindId ? m.items.filter(function (it) { return it.kind === kindId; }) : m.items;
      if (!pool.length) pool = m.items;
      var it = pool[Math.floor(r() * pool.length)];
      var copy = JSON.parse(JSON.stringify(it));
      copy.mod = modId;
      if (!copy.kind) copy.kind = kindId || 'item';
      return copy;
    }
    var k = null;
    for (var i = 0; i < m.kinds.length; i++) if (!kindId || m.kinds[i].id === kindId) { k = m.kinds[i]; break; }
    if (!k) k = m.kinds[Math.floor(r() * m.kinds.length)];
    var q = k.gen(r);
    q.mod = modId;
    if (!q.kind) q.kind = k.id;
    return q;
  }

  /* ================= 自检：生成器 / 判分 / 图 / 边界 ================= */
  function checkQuestion(q, tag, fails) {
    if (!q || !q.prompt || /undefined|NaN/.test(q.prompt)) fails.push(tag + ' 题干异常');
    if (!q.fields || !q.fields.length) { fails.push(tag + ' 无字段'); return; }
    q.fields.forEach(function (f, i) {
      if (f.type === 'num' && !isFinite(f.ans)) fails.push(tag + ' 第 ' + (i + 1) + ' 空答案非数字');
      if (f.type === 'choice') {
        if (!(f.ans >= 0 && f.ans < f.options.length)) fails.push(tag + ' 第 ' + (i + 1) + ' 空选项越界');
        if (f.options.some(function (o) { return o == null || /undefined|NaN/.test(String(o)); })) fails.push(tag + ' 选项异常');
      }
      if (f.figs) {
        if (f.figs.length !== f.options.length) fails.push(tag + ' 选项图数量不对');
        f.figs.forEach(function (d, j) {
          var sv = svgFor({ fig: d });
          if (sv.indexOf('<svg') !== 0) fails.push(tag + ' 选项图 ' + (j + 1) + ' 为空');
          else if (/NaN|undefined/.test(sv)) fails.push(tag + ' 选项图 ' + (j + 1) + ' 含 NaN');
        });
      }
    });
    if (q.fig) {
      var svg = svgFor(q);
      if (svg.indexOf('<svg') !== 0) fails.push(tag + ' 题图为空');
      else if (/NaN|undefined/.test(svg)) fails.push(tag + ' 题图含 NaN');
    }
    /* 正确解必须判对 */
    var right = q.fields.map(function (f) { return f.type === 'choice' ? f.ans : f.ans; });
    if (!judge(q, right).ok) fails.push(tag + ' 正确解被判错');
    /* 错误解必须判错 */
    var wrong = q.fields.map(function (f) {
      if (f.type === 'choice') return (f.ans + 1) % f.options.length;
      if (f.tol != null) return f.ans + Math.abs(f.tol) * 2 + 1;
      var rel = Math.max(Math.abs(f.ans) * 1e-3, 1e-9);
      return f.ans + Math.max(1, rel * 2);
    });
    if (judge(q, wrong).ok) fails.push(tag + ' 错误解被判对');
    /* 科学计数法输入（答案较大时）必须判对 */
    q.fields.forEach(function (f, i) {
      if (f.type !== 'num' || Math.abs(f.ans) < 1e4) return;
      var v = [f.ans];
      var sci = f.ans.toExponential();
      var alt = q.fields.map(function (ff, j) { return j === i ? sci : (ff.type === 'choice' ? ff.ans : ff.ans); });
      if (!judge(q, alt).ok) fails.push(tag + ' 第 ' + (i + 1) + ' 空科学计数法被判错');
    });
  }

  function boundaryTests() {
    var fails = [], n = 0;
    function eq(desc, got, want) { n++; if (!(Math.abs(got - want) <= 1e-9)) fails.push(desc + '（得到 ' + got + '，应为 ' + want + '）'); }
    function nan(desc, v) { n++; if (!isNaN(v)) fails.push(desc + ' 应解析失败，却得到 ' + v); }
    eq('1428000', parseNum('1428000'), 1428000);
    eq('1.428e6', parseNum('1.428e6'), 1428000);
    eq('1.428E6', parseNum('1.428E6'), 1428000);
    eq('1.428×10^6', parseNum('1.428×10^6'), 1428000);
    eq('1.428x10^6', parseNum('1.428x10^6'), 1428000);
    eq('1.428*10^6', parseNum('1.428*10^6'), 1428000);
    eq('1.428×10⁶', parseNum('1.428×10⁶'), 1428000);
    eq('全角 1.428×10⁶', parseNum('１.４２８×１０⁶'), 1428000);
    eq('1 428 000', parseNum('1 428 000'), 1428000);
    eq('−1.428e6', parseNum('−1.428e6'), -1428000);
    eq('5×10⁻⁵', parseNum('5×10⁻⁵'), 5e-5);
    eq('21%', parseNum('21%'), 21);
    eq('30N', parseNum('30N'), 30);
    eq('0.4m', parseNum('0.4m'), 0.4);
    eq('1/2', parseNum('1/2'), 0.5);
    nan('abc', parseNum('abc'));
    nan('空', parseNum(''));
    var pf = { type: 'num', ans: 21, unit: '%', tol: 0.8 };
    n++; if (!judge({ fields: [pf] }, ['21']).ok) fails.push('百分比：21 应判对');
    n++; if (!judge({ fields: [pf] }, ['21%']).ok) fails.push('百分比：21% 应判对');
    n++; if (!judge({ fields: [pf] }, ['0.21']).ok) fails.push('百分比：0.21 应判对');
    n++; if (judge({ fields: [pf] }, ['23.6']).ok) fails.push('百分比：23.6 不应判对');
    var af = { type: 'num', ans: 100, tol: 1 };
    n++; if (!judge({ fields: [af] }, ['100.9']).ok) fails.push('绝对容差：100.9 应判对');
    n++; if (judge({ fields: [af] }, ['101.1']).ok) fails.push('绝对容差：101.1 不应判对');
    var rf = { type: 'num', ans: 1428000 };
    n++; if (!judge({ fields: [rf] }, ['1429000']).ok) fails.push('相对容差：1429000 应判对');
    n++; if (judge({ fields: [rf] }, ['1430000']).ok) fails.push('相对容差：1430000 不应判对');
    n++; if (fmtNum(1428000) !== '1.428×10⁶') fails.push('科学计数法显示：' + fmtNum(1428000));
    n++; if (fmtNum(5e-5) !== '5×10⁻⁵') fails.push('科学计数法显示：' + fmtNum(5e-5));
    return { n: n, fails: fails };
  }

  function selfTest(n) {
    n = n || 200;
    var fails = [], count = 0;
    MODULES.forEach(function (m) {
      var list;
      if (m.items) {
        list = m.items.map(function (it) { return { id: it.kind + ':' + it.id, fixed: it }; });
      } else {
        list = m.kinds.map(function (k) { return { id: k.id, gen: k.gen }; });
      }
      list.forEach(function (c) {
        for (var s = 1; s <= n; s++) {
          var q;
          try {
            q = c.fixed ? JSON.parse(JSON.stringify(c.fixed)) : c.gen(mulberry32(s * 7919 + 13));
          } catch (e) { fails.push(c.id + ' 生成异常: ' + e.message); continue; }
          count++;
          checkQuestion(q, m.id + '.' + c.id + '#' + s, fails);
        }
      });
    });
    var b = boundaryTests();
    b.fails.forEach(function (f) { fails.push('边界: ' + f); });
    return { count: count, fails: fails, cases: b.n };
  }

  return {
    VERSION: VERSION, DAY: DAY,
    modules: MODULES, moduleById: moduleById,
    gen: gen, judge: judge, ansText: ansText, svgFor: svgFor,
    parseNum: parseNum, fmtNum: fmtNum, near: near, relTol: relTol,
    selfTest: selfTest, drawItems: DRAW
  };
})();
</script>

<script id="ui">
(function () {

  var tabs = document.getElementById('tabs');

  function blankDB() { return { v: PT.VERSION, recs: [], wrong: {}, meta: { created: Date.now() } }; }
  var DB = (function () {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return blankDB();
      var o = JSON.parse(raw);
      if (!o || o.v !== PT.VERSION) return blankDB();
      o.recs = o.recs || []; o.wrong = o.wrong || {}; o.meta = o.meta || {};
      o.meta.lastRound = o.meta.lastRound || {};   /* 兼容旧记录：没有就不去重 */
      return o;
    } catch (e) { return blankDB(); }
  })();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { }
  }
  function dayKey(ts) { var t = new Date(ts); return t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate(); }
  function today() { return dayKey(Date.now()); }

  /* ---------- 小工具 ---------- */
  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'value') e.value = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null || kid === false) continue;
      if (Array.isArray(kid)) {
        kid.forEach(function (x) {
          if (x != null && x !== false) e.appendChild(typeof x === 'string' || typeof x === 'number' ? document.createTextNode(String(x)) : x);
        });
      } else e.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
    }
    return e;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function fmtSec(s) { s = Math.round(s); return s < 60 ? s + ' 秒' : Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒'; }
  function todayRecs() { var t = today(); return DB.recs.filter(function (r) { return dayKey(r.ts) === t; }); }
  function figBlock(desc, cap) {
    var svg = PT.svgFor({ fig: desc });
    if (!svg) return null;
    var box = h('div', { class: 'figbefore' });
    if (cap) box.appendChild(h('div', { class: 'small muted', style: 'margin-bottom:2px' }, cap));
    box.appendChild(h('div', { class: 'figbox', html: svg }));
    return box;
  }

  /* ---------- 状态 ---------- */
  var S = {
    view: 'today', sess: null, q: null, res: null, answered: false,

    scratch: false, fix: null, example: false
  };

  /* ---------- 路由 ---------- */
  var VIEWS = {
    today: renderToday, model: renderModule, amount: renderModule, calc: renderModule,
    draw: renderModule, read: renderModule, wrong: renderWrong, report: renderReport,
    practice: renderPractice, summary: renderSummary
  };
  function go(view) { S.view = view; render(); try { window.scrollTo(0, 0); } catch (e) { } }
  function render() {
    clear(app);
    var fn = VIEWS[S.view] || renderToday;
    fn();
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.classList.toggle('active', b.getAttribute('data-go') === S.view ||
        (S.view === 'practice' && S.sess && b.getAttribute('data-go') === S.sess.mod));
    });
  }

  /* ---------- 今日任务卡（约 17 分钟） ---------- */
  function renderToday() {
    var tr = todayRecs();
    var META = {
      calc: { n: 4, sub: '4 题 · 8 分钟 · 选公式 → 指认量 → 算到底' },
      amount: { n: 4, sub: '4 题 · 3 分钟 · 先认量再动笔' },
      model: { n: 3, sub: '3 题 · 3 分钟 · 看图认模型' },
      draw: { n: 2, sub: '2 题 · 3 分钟 · 四选一选正确画法' },
      read: { n: 2, sub: '2 题 · 3 分钟 · 量程 / 分度值 / 读数' }
    };
    var plan = [
      { mod: 'calc', n: 4, label: '算到底', sub: META.calc.sub, go: 'calc' },
      { mod: 'amount', n: 4, label: '认量', sub: META.amount.sub, go: 'amount' },
      { mod: 'model', n: 3, label: '认模型', sub: META.model.sub, go: 'model' },
      { mod: 'wrong', n: 1, label: '错题回炉', sub: '到期的错题 · 3 分钟', go: 'wrong' }
    ];
    var alt = (new Date().getDate() % 2 === 0) ? 'draw' : 'read';
    plan.push({ mod: alt, n: 2, label: (alt === 'draw' ? '作图判断' : '读数'), sub: META[alt].sub + '（单双日轮换）', go: alt });

    var done = {};
    plan.forEach(function (p) { done[p.mod] = 0; });
    tr.forEach(function (r) {
      if (r.mode === 'wrong') done.wrong = (done.wrong || 0) + 1;
      else if (done[r.mod] != null) done[r.mod]++;
    });

    var tasks = h('div', { class: 'card' });
    tasks.appendChild(h('div', { class: 'row' },
      h('h2', { style: 'margin:0;font-size:18px' }, '今日任务'),
      h('span', { class: 'pill' }, '约 17 分钟')
    ));
    tasks.appendChild(h('div', { class: 'small muted', style: 'margin-top:4px' }, '顺序：算到底 → 认量 → 认模型 → 错题回炉 → 作图/读数（单双日轮换）。五个都做，不用等一个练熟。'));
    tasks.appendChild(h('div', { class: 'small muted', style: 'margin-top:2px' }, '跳过几天不累计欠账，任务每天重置；每次开始都会换一批题（题型轮换 + 避开上一轮题面）。'));
    plan.forEach(function (p, i) {
      var isDone = done[p.mod] >= p.n;
      tasks.appendChild(h('div', { class: 'task' + (isDone ? ' done' : '') },
        h('div', { class: 'no' }, isDone ? '✓' : String(i + 1)),
        h('div', { class: 'tt' }, h('b', null, p.label), h('span', null, p.sub)),
        h('button', {
          class: 'btn btn-sm ' + (isDone ? '' : 'btn-primary'), onclick: function () {
            if (p.go === 'wrong') startWrong(); else startSession(p.go, null, p.n);
          }
        }, isDone ? '再来' : '开始')
      ));
    });
    app.appendChild(tasks);

    app.appendChild(h('div', { class: 'grid', style: 'margin-top:12px' },
      statCard('今日题数', tr.length),
      statCard('今日正确率', tr.length ? pct(tr.filter(function (r) { return r.ok; }).length, tr.length) + '%' : '—'),
      statCard('错题待回炉', Object.keys(DB.wrong).length)
    ));

    var mods = h('div', { class: 'grid', style: 'margin-top:16px' });
    PT.modules.forEach(function (m) {
      var card = h('div', { class: 'module' },
        h('div', { class: 'mh' }, h('span', null, m.icon), h('b', null, m.name)),
        h('div', { class: 'desc' }, m.desc),
        h('div', { class: 'kinds' }, (m.kinds || []).slice(0, 4).map(function (k) { return h('span', { class: 'kind' }, k.name); })),
        h('div', { class: 'row', style: 'margin-top:auto' },
          h('button', { class: 'btn btn-primary btn-sm', onclick: function () { startSession(m.id, null, m.id === 'draw' ? 4 : (m.id === 'read' ? 3 : 6)); } }, '开始'),
          h('button', { class: 'btn btn-sm', onclick: function () { startExample(m.id, null); } }, '看例题')
        )
      );
      mods.appendChild(card);

    app.appendChild(h('div', { class: 'card', style: 'margin-top:16px' },
      h('div', { class: 'small' }, h('b', null, '怎么用')),
      h('ul', { class: 'small muted', style: 'margin:6px 0 0;padding-left:20px' },
        h('li', null, '每道题按「第 1 步 选公式 → 第 2 步 指认量 → 第 3 步 代入算结果」排，逐空判分。'),
        h('li', null, '不会就点「提示」，提示不扣分但会记录。'),
        h('li', null, '数值答错要订正：照着解析把正确答案再填一遍，对了才能下一题。'),
        h('li', null, '直接打字：1428000、1.428e6、1.428×10^6、1.428×10⁶、21%、0.21 都认；单位不用打。'),
        h('li', null, '单位默认不判；有效数字只提示不判错。'),
        h('li', null, '打草稿点「草稿纸」；第一次做某类题先点「例题」。')
      )

  }
  function statCard(label, val) { return h('div', { class: 'stat' }, h('span', null, label), h('b', null, String(val))); }

  /* ---------- 模块首页 ---------- */
  function renderModule() {
    var m = PT.moduleById(S.view);
    if (!m) { go('today'); return; }
    var head = h('div', { class: 'card' },
      h('div', { class: 'row' }, h('h2', { style: 'margin:0;font-size:19px' }, m.icon + ' ' + m.name)),
      h('p', { class: 'muted small', style: 'margin:6px 0 0' }, m.desc)
    );
    head.appendChild(h('div', { class: 'row', style: 'margin-top:12px' },
      h('button', { class: 'btn btn-primary', onclick: function () { startSession(m.id, null, m.id === 'draw' ? 4 : 6); } }, '开始一轮'),
      h('button', { class: 'btn', onclick: function () { startExample(m.id, null); } }, '先看例题')
    ));
    app.appendChild(head);
    var list = h('div', { class: 'grid', style: 'margin-top:12px' });
    (m.kinds || []).forEach(function (k) {
      var st = kindStat('new', m.id, k.id);
      list.appendChild(h('div', { class: 'module' },
        h('div', { class: 'mh' }, h('b', null, k.name)),
        h('div', { class: 'desc small muted' }, st.n ? '练过 ' + st.n + ' 题 · 正确率 ' + pct(st.ok, st.n) + '%' : '还没练过'),
        h('div', { class: 'row', style: 'margin-top:auto' },
          h('button', { class: 'btn btn-primary btn-sm', onclick: function () { startSession(m.id, k.id, m.id === 'draw' ? 4 : 6); } }, '练 6 题'),
          h('button', { class: 'btn btn-sm', onclick: function () { startExample(m.id, k.id); } }, '看例题')
        )
      ));
    });
    app.appendChild(list);
  }
  function kindStat(mode, mod, kind) {
    var rs = DB.recs.filter(function (r) { return r.mode === mode && r.mod === mod && r.kind === kind; });
    return { n: rs.length, ok: rs.filter(function (r) { return r.ok; }).length };
  }

  /* ---------- 出题去重 / 题型轮换（跨轮避开上一轮题面） ---------- */
  function sigOf(q) { return q.id + '|' + q.prompt; }
  function shuffleArr(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function lastRoundOf(mod) {
    var lr = DB.meta && DB.meta.lastRound, r = lr && lr[mod];
    if (!r || !Array.isArray(r.sigs) || !Array.isArray(r.kinds)) return { at: 0, kinds: [], sigs: [] };
    return r;
  }
  function beginRound(mod) {
    DB.meta = DB.meta || {};
    DB.meta.lastRound = DB.meta.lastRound || {};
    var prev = lastRoundOf(mod);              /* 先把上一轮读走，再覆盖 */
    var rec = { at: Date.now(), kinds: [], sigs: [] };
    DB.meta.lastRound[mod] = rec;
    save();
    return { prev: prev, rec: rec };
  }
  function recordQuestion(rec, q, kindId) {
    if (!rec) return;
    rec.kinds.push(kindId || q.kind || '');
    rec.sigs.push(sigOf(q));
    save();
  }
  /* 同模块内最多试 40 个 seed，取第一个题面签名不在「已做过」集合里的题；都不行才接受重复 */
  function pickQuestion(mod, kindId, seenSigs) {
    var q = null;
    for (var i = 0; i < 40; i++) {
      q = PT.gen(mod, kindId, (Math.random() * 1e9) | 0);
      if (seenSigs.indexOf(sigOf(q)) < 0) return q;
    }
    return q;
  }
  /* kind 队列：上一轮用过的 kind 排后、没用过的排前；一轮内 kind 不重复（用尽后才循环） */
  function kindQueue(mod, n) {
    var m = PT.moduleById(mod);
    var all = (m && m.kinds ? m.kinds.map(function (k) { return k.id; }) : []);
    if (!all.length) return null;
    var prevKinds = lastRoundOf(mod).kinds || [];
    var unused = shuffleArr(all.filter(function (k) { return prevKinds.indexOf(k) < 0; }));
    var used = shuffleArr(all.filter(function (k) { return prevKinds.indexOf(k) >= 0; }));
    var order = unused.concat(used), out = [];
    for (var i = 0; i < n; i++) out.push(order[i % order.length]);
    return out;
  }

  /* ---------- 练习 ---------- */
  function startSession(mod, kind, count) {
    S.mode = 'new'; S.example = false;
    var n = count || 6;
    var queue = kind ? null : kindQueue(mod, n);   /* 先按上一轮记录排 kind 队列 */
    var rnd = beginRound(mod);                     /* 再开启本轮记录（旧记录已被读走） */
    S.sess = {
      mod: mod, kind: kind, total: n, done: 0, right: 0, t0: Date.now(),
      prevSigs: rnd.prev.sigs, round: rnd.rec, kindQueue: queue
    };
    S.view = 'practice';
    nextQuestion();
  }
  function startWrong() {
    var now = Date.now();
    var due = Object.keys(DB.wrong).map(function (k) { return DB.wrong[k]; }).filter(function (w) { return w.due <= now; });
    if (!due.length) {
      var all = Object.keys(DB.wrong).length;
      alert(all ? '错题本里有 ' + all + ' 道，但还没到期（按 1/3/7/14 天回炉）。今天先练新的。' : '错题本是空的，先做几题吧。');
      return;
    }
    S.mode = 'wrong';
    S.sess = { mod: 'wrong', kind: null, total: Math.min(due.length, 5), done: 0, right: 0, t0: Date.now(), queue: due };
    S.view = 'practice';
    nextQuestion();
  }
  function startOneWrong(w) {
    S.mode = 'wrong';
    S.sess = { mod: 'wrong', kind: null, total: 1, done: 0, right: 0, t0: Date.now(), queue: [w] };
    S.view = 'practice';
    nextQuestion();
  }
  function nextQuestion() {
    var s = S.sess;
    if (s.done >= s.total) { S.view = 'summary'; render(); return; }
    if (s.queue) {
      S.q = s.queue[s.done];                 /* 错题回炉：刻意重复，不参与去重 */
    } else {
      var kindId = s.kindQueue ? s.kindQueue[s.done] : s.kind;
      var seen = (s.prevSigs || []).concat(s.round ? s.round.sigs : []);
      S.q = pickQuestion(s.mod, kindId, seen);
      recordQuestion(s.round, S.q, kindId);
    }
    S.res = null; S.answered = false; S.choice = {}; S.hint = false;
    S.draft = null; S.lastVals = null; S.t0 = Date.now(); S.fix = null;
    render();
  }

  /* 例题：先看一个完整解答（题目 → 答案 → 怎么想 → 图），再开始练 */
  function startExample(mod, kind) {
    S.example = true;
    S.sess = { mod: mod, kind: kind, total: 6, done: 0, right: 0, t0: Date.now() };
    S.q = PT.gen(mod, kind, (Math.random() * 1e9) | 0);
    S.view = 'practice';
    render();
  }
  function renderExample() {
    var q = S.q, s = S.sess;
    app.appendChild(h('div', { class: 'row', style: 'margin-bottom:8px' },
      h('span', { class: 'pill' }, '例题'),
      h('span', { class: 'small muted' }, q.title || ''),
      h('span', { class: 'grow' }),
      h('span', { class: 'small muted' }, '先看懂，再开始练')
    ));
    var card = h('div', { class: 'card' });
    card.appendChild(h('div', { class: 'qbody', html: q.prompt }));
    if (q.fig) { var f0 = figBlock(q.fig, ''); if (f0) card.appendChild(f0); }
    var ansBox = h('div', { class: 'fb good', style: 'margin-top:14px' });
    ansBox.appendChild(h('div', { class: 'ftitle' }, '答案'));
    var ul = h('ul');
    q.fields.forEach(function (f, i) { ul.appendChild(h('li', null, (f.label ? f.label + ' ' : '') + PT.ansText(f))); });
    ansBox.appendChild(ul);
    card.appendChild(ansBox);
    var exBox = h('div', { class: 'fb', style: 'margin-top:10px' });
    exBox.appendChild(h('div', { class: 'ftitle' }, '怎么想'));
    (q.explain || []).forEach(function (line) { exBox.appendChild(h('div', { class: 'small' }, line)); });
    card.appendChild(exBox);
    card.appendChild(h('div', { class: 'row', style: 'margin-top:14px' },
      h('button', { class: 'btn btn-primary', onclick: function () { startSession(s.mod, s.kind, 6); } }, '看懂了，开始练'),
      h('button', { class: 'btn', onclick: function () { startExample(s.mod, s.kind); } }, '换一道')
    ));
    app.appendChild(card);
  }

  function draftAt(i) {
    var d = S.draft && S.draft[i];
    return (typeof d === 'string') ? d : '';
  }
  function numInput(base, val, cls) {
    return h('div', { class: 'fin ' + (cls || '') },
      h('input', {
        class: 'fone', id: base + '_n', value: val || '', inputmode: 'text',
        autocomplete: 'off', spellcheck: 'false', placeholder: '数字'
      })
    );
  }
  /* 草稿纸：鼠标 / 手指 / 触控笔都能写，不识别，只当纸用 */
  function scratchPad() {
    var cv = h('canvas', { class: 'pad', width: 900, height: 420 });
    var wrap = h('div', { class: 'padwrap' },
      cv,
      h('div', { class: 'row', style: 'margin-top:6px' },
        h('button', { class: 'btn btn-sm', onclick: function () { cv._pen = !cv._pen; } }, '笔 / 橡皮'),
        h('button', {
          class: 'btn btn-sm', onclick: function () {
            var g = cv.getContext && cv.getContext('2d');
            if (g) g.clearRect(0, 0, cv.width, cv.height);
          }
        }, '清空')
      )
    );
    setTimeout(function () { setupCanvas(cv); }, 0);
    return wrap;
  }
  function setupCanvas(cv) {
    if (!cv.getContext) return;
    var g = cv.getContext('2d');
    if (!g) return;
    var drawing = false, last = null;
    function pos(e) {
      var r = cv.getBoundingClientRect();
      var sx = cv.width / (r.width || 1), sy = cv.height / (r.height || 1);
      return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
    }
    function pen() {
      g.strokeStyle = cv._pen ? '#ffffff' : '#1b2333';
      g.fillStyle = cv._pen ? '#ffffff' : '#1b2333';
      g.lineWidth = cv._pen ? 16 : 3.5;
      g.lineCap = 'round'; g.lineJoin = 'round';
    }
    cv.addEventListener('pointerdown', function (e) {
      e.preventDefault(); drawing = true; last = pos(e); pen();
      g.beginPath(); g.arc(last.x, last.y, cv._pen ? 8 : 1.7, 0, 6.3); g.fill();
    });
    cv.addEventListener('pointermove', function (e) {
      if (!drawing) return;
      e.preventDefault();
      var p = pos(e);
      g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke();
      last = p;
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
      cv.addEventListener(ev, function () { drawing = false; });
    });
  }
  function readDraft() {

  function rawAns(i) {

    return (v == null || v === '') ? '空' : String(v);
  }

  function renderPractice() {

          if (f.figs && f.figs[oi]) kids.push(h('div', { class: 'optfig', html: PT.svgFor({ fig: f.figs[oi] }) }));

            })(oi)

        });

      } else {

        ));
      }
    });

    if (!S.answered) {
      card.appendChild(h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', { class: 'btn btn-ghost btn-sm', onclick: function () { S.scratch = !S.scratch; render(); } }, S.scratch ? '收起草稿' : '草稿纸'),
        h('button', { class: 'btn btn-sm', onclick: function () { startExample(S.sess.mod, S.sess.kind); } }, '例题')
      ));
      card.appendChild(h('div', { class: 'small muted' }, '直接打字：整数、小数、1.428e6、1.428×10^6、21% 都认；单位不用打；回车提交。'));
      if (S.scratch) card.appendChild(scratchPad());

    if (q.tip && !S.answered && S.hint) card.appendChild(h('div', { class: 'tipbox' }, '提示：' + q.tip));

        h('button', { class: 'btn btn-ghost', onclick: function () { S.draft = readDraft(); S.hint = true; render(); } }, S.hint ? '提示已展开' : '看提示'),
        h('span', { class: 'grow' }),
        h('span', { class: 'small muted' }, '回车提交')
      ));
    } else {
      /* 逐字段判分：每步 ✓/✗ + 「3 步对 2 步」 */
      var fb = h('div', { class: 'fb ' + (S.res.ok ? 'good' : 'bad') });
      var title = S.res.ok
        ? (S.res.total > 1 ? '✓ ' + S.res.total + ' 步全对' : '✓ 全对')
        : (S.res.total > 1 ? '✗ ' + S.res.total + ' 步对 ' + S.res.got + ' 步' : '✗ 不对');
      fb.appendChild(h('div', { class: 'ftitle' }, title));
      var ul = h('ul', { class: 'steps' });
      q.fields.forEach(function (f, i) {
        var r = S.res.res[i];
        ul.appendChild(h('li', null,
          h('span', { class: 'mk ' + (r.ok ? 'ok' : 'bad') }, r.ok ? '✓' : '✗'),
          h('span', null,
            h('span', { class: 'stepno' }, '第 ' + (i + 1) + ' 步 '),

      });

      for (var si = 0; si < q.fields.length; si++) {
        var sf = q.fields[si];
        if (sf.type !== 'num' || !S.res.res[si].ok || sf.unit !== '%') continue;
        var sraw = String((S.lastVals || [])[si] || '');
        var sm = sraw.match(/\.(\d+)/);
        if (sm && sm[1].length > 2) {
          fb.appendChild(h('div', { class: 'small muted', style: 'margin-top:6px' }, '提示：有效数字偏多不判错，考试时百分数保留 1 位小数即可。'));

        fxb.appendChild(h('div', { class: 'ftitle' }, '订正：照着上面的解析，把正确答案重新填一遍'));
        S.fix.fields.forEach(function (i) {
          var f = q.fields[i];
          fxb.appendChild(h('div', { class: 'field' },
            h('span', { class: 'lbl full' }, f.label),

  }

  function submit() {
    if (S.answered) return;
    var q = S.q;
    var draft = readDraft();
    var vals = q.fields.map(function (f, i) {
      if (f.type === 'choice') return S.choice[i] == null ? null : S.choice[i];
      return PT.parseNum(draft[i]);
    });
    var res = PT.judge(q, vals);
    S.lastVals = draft; S.draft = draft;
    var fixIdx = [];
    if (!res.ok) q.fields.forEach(function (f, i) { if (!res.res[i].ok && f.type !== 'choice') fixIdx.push(i); });
    S.fix = fixIdx.length ? { fields: fixIdx, ok: false, tries: 0 } : null;
    var sec = Math.max(1, Math.round((Date.now() - S.t0) / 1000));
    S.res = res; S.answered = true;
    var s = S.sess;
    s.done++;
    if (res.ok) s.right++;
    DB.recs.push({
      ts: Date.now(), mod: s.mod === 'wrong' ? (q.mod || 'model') : s.mod,
      kind: q.kind, kn: q.title, ok: res.ok, got: res.got, total: res.total,
      sec: sec, hint: S.hint, mode: S.mode, steps: res.total
    });
    if (!res.ok) addWrong(q);
    else if (S.mode === 'wrong') removeWrong(q);
    save();
    render();
  }
  function submitFix() {
    if (!S.fix || S.fix.ok) return;
    var q = S.q, fields = [], vals = [];
    S.fix.fields.forEach(function (i) {
      var f = q.fields[i];
      fields.push(f);
      var el = document.getElementById('fx' + i);
      vals.push(PT.parseNum(el ? el.value : ''));
    });
    var r = PT.judge({ fields: fields }, vals);
    if (r.ok) {
      S.fix.ok = true;
      var last = DB.recs[DB.recs.length - 1];
      if (last) last.fixed = true;
      save();
    } else {
      S.fix.tries++;
    }
    render();
  }
  function next() {
    if (S.sess.done >= S.sess.total) { S.view = 'summary'; render(); return; }
    nextQuestion();
  }

  /* ---------- 错题本（1/3/7/14 天） ---------- */
  function wrongKey(q) { return q.id + '|' + String(q.prompt).slice(0, 60); }
  function addWrong(q) {
    var k = wrongKey(q), w = DB.wrong[k], now = Date.now();
    var n = w ? (w.n || 1) + 1 : 1;
    var gap = n <= 1 ? 1 : (n === 2 ? 3 : (n === 3 ? 7 : 14));
    DB.wrong[k] = {
      id: q.id, mod: q.mod || S.sess.mod, kind: q.kind, title: q.title, prompt: q.prompt,
      fields: q.fields, explain: q.explain, tip: q.tip, fig: q.fig, figBefore: q.figBefore,
      ts: now, due: now + gap * PT.DAY, n: n
    };
  }
  function removeWrong(q) { delete DB.wrong[wrongKey(q)]; }

  function renderWrong() {
    var ws = Object.keys(DB.wrong).map(function (k) { return DB.wrong[k]; }).sort(function (a, b) { return a.due - b.due; });
    var head = h('div', { class: 'card' },
      h('div', { class: 'row' }, h('h2', { style: 'margin:0;font-size:19px' }, '错题本'), h('span', { class: 'pill' }, ws.length + ' 道')),
      h('p', { class: 'muted small', style: 'margin:6px 0 0' }, '答错的题自动进本；按 1 / 3 / 7 / 14 天到期回炉，回炉答对自动移出。')
    );
    head.appendChild(h('div', { class: 'row', style: 'margin-top:12px' },
      h('button', { class: 'btn btn-primary', onclick: startWrong }, '回炉到期的'),
      h('button', { class: 'btn', onclick: function () { go('report'); } }, '看报告')
    ));
    app.appendChild(head);
    var card = h('div', { class: 'card' });
    if (!ws.length) card.appendChild(h('div', { class: 'empty' }, '还没有错题。做几题吧。'));
    ws.forEach(function (w) {
      var dueTxt = w.due <= Date.now() ? '已到期' : ('还有 ' + Math.ceil((w.due - Date.now()) / PT.DAY) + ' 天');
      card.appendChild(h('div', { class: 'wrongitem' },
        h('div', { class: 'wt' }, String(w.prompt).replace(/<br\s*\/?>/g, ' ').slice(0, 90) + '…'),
        h('div', { class: 'small muted' }, dueTxt + ' · 错过 ' + (w.n || 1) + ' 次'),
        h('button', { class: 'btn btn-sm', onclick: (function (ww) { return function () { startOneWrong(ww); }; })(w) }, '重做')
      ));
    });
    app.appendChild(card);
  }

  /* ---------- 本轮总结 ---------- */
  function renderSummary() {
    var s = S.sess;
    var mins = Math.max(1, Math.round((Date.now() - s.t0) / 60000));
    app.appendChild(h('div', { class: 'card', style: 'text-align:center;padding:28px 18px' },
      h('div', { style: 'font-size:44px;line-height:1.1' }, s.right === s.total ? '🎉' : (s.right / s.total >= .6 ? '👍' : '💪')),
      h('h2', { style: 'margin:8px 0 4px' }, s.right + ' / ' + s.total + ' 全对'),
      h('p', { class: 'muted' }, '用时约 ' + mins + ' 分钟 · 正确率 ' + pct(s.right, s.total) + '%'),
      h('div', { class: 'row', style: 'justify-content:center;margin-top:16px' },
        h('button', { class: 'btn btn-primary', onclick: function () { if (s.mod === 'wrong') startWrong(); else startSession(s.mod, s.kind, s.total); } }, '再来一轮'),
        h('button', { class: 'btn', onclick: function () { go('today'); } }, '回今日')
      )
    ));
    var tips = [];
    if (s.total && s.right / s.total < .6) tips.push('正确率偏低：先点「例题」看一遍完整解答，再独立做一遍。');
    if (s.mod === 'calc' && s.right / s.total < .8) tips.push('「算到底」的目标是一次算对：选公式 → 指认量 → 代入，三步各写一行。');
    if (s.mod === 'amount' && s.right / s.total < .8) tips.push('认量的关键是先圈出题目里的 m、Δt、h、s、n，再动笔。');
    if (tips.length) app.appendChild(h('div', { class: 'card' }, h('b', null, '下一步'), tips.map(function (t) { return h('p', { class: 'small' }, '· ' + t); })));
  }

  /* ---------- 报告 ---------- */
  function renderReport() {
    var recs = DB.recs;
    var ok = recs.filter(function (r) { return r.ok; }).length;
    var secs = recs.reduce(function (a, r) { return a + (r.sec || 0); }, 0);
    app.appendChild(h('div', { class: 'grid' },
      statCard('累计题数', recs.length),
      statCard('总正确率', recs.length ? pct(ok, recs.length) + '%' : '—'),
      statCard('累计用时', recs.length ? fmtSec(secs) : '—'),
      statCard('看提示做题', recs.filter(function (r) { return r.hint; }).length),
      statCard('错题本', Object.keys(DB.wrong).length)
    ));

    /* 主视图：5 类断点命中率 */
    var t = h('table', { class: 'tb' },
      h('tr', null, h('th', null, '断点'), h('th', { class: 'n' }, '题数'), h('th', { class: 'n' }, '正确率'), h('th', { class: 'n' }, '平均用时')));
    PT.modules.forEach(function (m) {
      var rs = recs.filter(function (r) { return r.mod === m.id; });
      var o = rs.filter(function (r) { return r.ok; }).length;
      t.appendChild(h('tr', null,
        h('td', null, m.icon + ' ' + m.name),
        h('td', { class: 'n' }, rs.length || '—'),
        h('td', { class: 'n' }, rs.length ? pct(o, rs.length) + '%' : '未练'),
        h('td', { class: 'n' }, rs.length ? fmtSec(rs.reduce(function (a, r) { return a + r.sec; }, 0) / rs.length) : '—')
      ));
    });
    app.appendChild(h('div', { class: 'card', style: 'margin-top:16px' }, h('h3', { style: 'margin-top:0' }, '5 类断点命中率'), t));

    /* 按题型（≥5 题才显示） */
    var byKind = {};
    recs.forEach(function (r) { var k = r.kn || r.kind; (byKind[k] = byKind[k] || []).push(r); });
    var rows = Object.keys(byKind).filter(function (k) { return byKind[k].length >= 5; })
      .sort(function (a, b) { return byKind[a].length - byKind[b].length; });
    var t2 = h('table', { class: 'tb' },
      h('tr', null, h('th', null, '题型'), h('th', { class: 'n' }, '题数'), h('th', { class: 'n' }, '正确率')));
    rows.forEach(function (k) {
      var rs = byKind[k], o = rs.filter(function (r) { return r.ok; }).length;
      t2.appendChild(h('tr', null, h('td', null, k), h('td', { class: 'n' }, rs.length), h('td', { class: 'n' }, pct(o, rs.length) + '%')));
    });
    if (!rows.length) t2.appendChild(h('tr', null, h('td', { colspan: 3, class: 'muted small' }, '每个题型练满 5 题后显示')));
    app.appendChild(h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '按题型（弱项在前）'), t2));

    /* 近 7 天 */
    var days = [], maxN = 1;
    for (var i = 6; i >= 0; i--) {
      var t0 = new Date(Date.now() - i * PT.DAY);
      var k = dayKey(t0.getTime());
      var n = recs.filter(function (r) { return dayKey(r.ts) === k; }).length;
      maxN = Math.max(maxN, n);
      days.push({ label: (t0.getMonth() + 1) + '/' + t0.getDate(), n: n });
    }
    var spark = h('div', { class: 'spark' });
    days.forEach(function (x) {
      spark.appendChild(h('div', { class: 'col' },
        h('i', { style: 'height:' + Math.max(2, Math.round(x.n / maxN * 52)) + 'px' }),
        h('span', null, x.label)
      ));
    });
    app.appendChild(h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '近 7 天题数'), spark));

    /* 错题本最近 10 条 */
    var ws = Object.keys(DB.wrong).map(function (k) { return DB.wrong[k]; })
      .sort(function (a, b) { return b.ts - a.ts; }).slice(0, 10);
    var wc = h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '错题本（最近 10 条）'));
    if (!ws.length) wc.appendChild(h('div', { class: 'empty' }, '还没有错题'));
    ws.forEach(function (w) {
      var dueTxt = w.due <= Date.now() ? '已到期' : ('还有 ' + Math.ceil((w.due - Date.now()) / PT.DAY) + ' 天');
      wc.appendChild(h('div', { class: 'wrongitem' },
        h('div', { class: 'wt' }, String(w.prompt).replace(/<br\s*\/?>/g, ' ').slice(0, 80) + '…'),
        h('div', { class: 'small muted' }, dueTxt)
      ));
    });
    wc.appendChild(h('div', { class: 'row', style: 'margin-top:10px' },
      h('button', { class: 'btn btn-primary btn-sm', onclick: startWrong }, '回炉到期的'),
      h('button', { class: 'btn btn-sm', onclick: function () { go('wrong'); } }, '看全部错题')
    ));
    app.appendChild(wc);

    /* 数据 */
    app.appendChild(h('div', { class: 'card' },
      h('h3', { style: 'margin-top:0' }, '数据'),
      h('div', { class: 'row' },
        h('button', { class: 'btn btn-sm', onclick: exportJSON }, '导出 JSON'),
        h('button', { class: 'btn btn-sm', onclick: importJSON }, '导入 JSON'),
        h('button', { class: 'btn btn-sm', onclick: selfCheck }, '自检（120 题 × 全部题类）'),
        h('button', { class: 'btn btn-sm', style: 'color:#d93025', onclick: clearAll }, '清空记录')
      ),
      h('p', { class: 'small muted', style: 'margin-bottom:0' }, '记录只在本机浏览器（physTrain_v1）；清缓存 / 换设备前先导出，放进 学习记录/。')
    ));
  }

  function exportJSON() {
    var blob = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    var t = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = '物理训练记录-' + t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  }
  function importJSON() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var o = JSON.parse(String(fr.result));
          if (!o || o.v !== PT.VERSION || !Array.isArray(o.recs)) throw new Error('格式不对');
          DB.recs = DB.recs.concat(o.recs);
          Object.keys(o.wrong || {}).forEach(function (k) { DB.wrong[k] = o.wrong[k]; });
          save(); render(); alert('已导入 ' + o.recs.length + ' 条记录');
        } catch (e) { alert('导入失败：' + e.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
  }
  function selfCheck() {
    var t0 = Date.now();
    var r = PT.selfTest(120);
    alert('自检：' + r.count + ' 题 + ' + r.cases + ' 项边界用例，' +
      (r.fails.length ? r.fails.length + ' 处失败\n' + r.fails.slice(0, 8).join('\n') : '全部通过') +
      '\n用时 ' + (Date.now() - t0) + ' ms');
  }
  function clearAll() {
    if (!confirm('清空所有记录和错题？建议先导出。')) return;
    DB = blankDB(); save(); render();
  }

  /* ---------- 启动 ---------- */
  Array.prototype.forEach.call(tabs.children, function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-go');
      go(v);
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || S.view !== 'practice') return;
    e.preventDefault();
    if (!S.answered) { submit(); return; }
    if (S.fix && !S.fix.ok) { submitFix(); return; }
    next();
  });
  (function boot() {
    var m = (location.hash || '').match(/view=([a-z]+)/);
    var v = m && m[1];
    var allowed = { today: 1, model: 1, amount: 1, calc: 1, draw: 1, read: 1, wrong: 1, report: 1 };
    go(allowed[v] ? v : 'today');
  })();

  /* 调试/自测钩子：不参与界面，供 node 里的 DOM 桩测试使用 */
  window.__pt = {
    S: S, db: function () { return DB; }, MT: PT, PT: PT,
    startSession: startSession, startWrong: startWrong, startOneWrong: startOneWrong,
    submit: submit, submitFix: submitFix, next: next, go: go, render: render,
    exportJSON: exportJSON, selfCheck: selfCheck
  };
})();
</script>
</body>
</html>
