  }

  /* 选项区 */
  function choiceArea(host, q, rec) {
    var multi = Array.isArray(q.ans);
    var sel = [];
    if (rec && rec.user !== undefined && rec.user !== null) {
      sel = Array.isArray(rec.user) ? rec.user.slice() : [rec.user];
    }
    var box = h('div', { class: 'opts' });
    var btns = [];
    (q.opts || []).forEach(function (text, i) {
      var b = h('button', { class: 'opt', type: 'button' });
      b.appendChild(h('span', { class: 'k', text: letter(i) }));
      b.appendChild(h('span', { class: 'ex-opttext', text: text }));
      b.addEventListener('click', function () {
        if (multi) {
          var p = sel.indexOf(i);
          if (p >= 0) sel.splice(p, 1);
          else {
            if (sel.length >= (q.ans || []).length) { UI.toast('这题最多选 ' + q.ans.length + ' 项', 'info'); return; }
            sel.push(i);
          }
        } else {
          sel = [i];
        }
        paint();
      });
      box.appendChild(b);
      btns.push(b);
    });
    host.appendChild(box);
    if (multi) host.appendChild(h('p', { class: 'tiny muted', style: 'margin-top:6px', text: '多选题：这题要选 ' + (q.ans || []).length + ' 项。' }));

    function paint() {
      btns.forEach(function (b, i) { b.classList.toggle('sel', sel.indexOf(i) >= 0); });
    }
    function markCorrect(show) {
      btns.forEach(function (b, i) {
        b.classList.remove('ok', 'no', 'dim');
        if (!show) return;
        var chosen = sel.indexOf(i) >= 0;
        var correct = multi ? (q.ans || []).indexOf(i) >= 0 : i === q.ans;
        if (correct) b.classList.add('ok');
        else if (chosen) b.classList.add('no');
        else b.classList.add('dim');
      });
    }
    paint();
    return {
      read: function () {
        var user = multi ? sel.slice() : (sel.length ? sel[0] : null);
        return {
          filled: multi ? sel.length > 0 : sel.length === 1,
          allFilled: true,
          user: user,
          ok: (multi ? sel.length > 0 : sel.length === 1) && PHYS.judge.choice(user, q.ans)
        };
      },
      mark: markCorrect,
      focus: function () { if (btns[0]) btns[0].focus(); }
    };
  }

  /* 数值 / 文本字段区 */
  function fieldsArea(host, q, rec, onEnter) {
    var form = UI.fields(q.fields, { onEnter: onEnter });
    host.appendChild(form.el);
    if (rec && rec.user !== undefined && rec.user !== null) prefillForm(form, q.fields, rec.user);
    return {
      read: function () {
        var vals = form.values();
        var res = form.check();
        var any = res.some(function (r) { return r.filled; });
        var all = res.every(function (r) { return r.filled; });
        var ok = any && all && res.every(function (r) { return r.ok; });
        return { filled: any, allFilled: all, ok: ok, user: vals, res: res };
      },
      mark: function (res) { form.mark(res || []); },
      focus: function () { form.focus(); }
    };
  }

  /* ---------------- 试卷练习 ---------------- */
  var V = null; // 当前做题视图：{pack, order:[题下标], pos, mode:'all'|'wrong'}

  function renderList(root) {
    root.innerHTML = '';
    setWide(false);
    var ps = packs();
    var wrongN = PHYS.progress.wrongList().filter(function (w) { return w.kind === 'exam'; }).length;

    var intro = h('div', { class: 'card' });
    intro.innerHTML =
      '<div class="row"><h2 style="margin:0">试卷练习</h2><span class="spacer"></span>' +
      '<span class="pill">' + ps.length + ' 套题</span></div>' +
      '<p class="small muted" style="margin-top:6px">做法：<b>先在纸上把整张卷子做完</b>，再回来一题一题录答案。这里只帮你对答案、看解析、收错题，不排名、不打分。</p>';
    var links = h('div', { class: 'row', style: 'margin-top:10px' });
    links.appendChild(h('a', { class: 'btn ex-link', href: '#/wrong', text: '错题本（' + wrongN + ' 道试卷错题）→' }));
    if (guidedItems().length) links.appendChild(h('a', { class: 'btn ex-link', href: '#/guided', text: '先走五步引导 →' }));
    intro.appendChild(links);
    root.appendChild(intro);

    /* 今晚急救清单：有题被标了 tonight 才出现，置顶，避免孩子乱点 */
    var tonight = tonightList();
    if (tonight.length) {
      var nc = h('div', { class: 'card ex-nightlist' });
      var nh = h('div', { class: 'nl-h' });
      nh.appendChild(h('b', { text: '★ 今晚急救清单（只做这几道）' }));
      nh.appendChild(h('span', { class: 'pill', text: tonight.length + ' 道大题' }));
      nc.appendChild(nh);
      nc.appendChild(h('p', { class: 'small muted', style: 'margin-top:6px',
        text: '今晚只有这一个晚上：先做「基础速练」把判断题刷熟，再做下面这 ' + tonight.length +
          ' 道大题，练习写公式、代入、单位和答句。其余题今晚先跳过 —— 刷题不求多，求这一遍能记住。' }));
      tonight.forEach(function (t, i) {
        var row = h('div', { class: 'ex-nightitem' });
        row.appendChild(h('span', { class: 'nm', text: '第 ' + (i + 1) + ' 道' }));
        var mn = h('div', { class: 'mn' });
        mn.appendChild(h('b', { text: t.pack.name + ' · 第 ' + t.q.no + ' 题' }));
        mn.appendChild(h('span', { text: (t.q.point || '') + (t.q.tonightWhy ? ' —— ' + t.q.tonightWhy : '') }));
        row.appendChild(mn);
        var b = h('button', { class: 'btn btn-primary', type: 'button', text: '开始这道' });
        b.addEventListener('click', function () {
          PHYS.route.go('exam/' + encodeURIComponent(t.pack.id), { q: t.q.id });
        });
        row.appendChild(b);
        nc.appendChild(row);
      });
      root.appendChild(nc);
    }

    if (!ps.length) {
      var e = h('div', { class: 'card' });
      e.innerHTML = '<h2>还没有题包</h2>' +
        '<p class="small muted" style="margin-top:6px">题库里还没放周练原卷。先去「五步引导」把五步走通，等家长把题包放进 <code>题库/</code> 再来这里。</p>';
      root.appendChild(e);
      return;
    }
    ps.forEach(function (p) { root.appendChild(packCard(p)); });
  }

  function packCard(p) {
    var st = packStat(p);
    var card = h('div', { class: 'card' });

    var head = h('div', { class: 'row' });
    head.appendChild(h('h3', { class: 'ex-name', text: p.name }));
    head.appendChild(h('span', { class: 'spacer' }));
    if (!st.gradedDone) head.appendChild(h('span', { class: 'pill', text: '还没做' }));
    else if (st.wrong > 0) head.appendChild(h('span', { class: 'tag tag-bad', text: st.wrong + ' 道还错着' }));
    else if (st.wrongBook > 0) head.appendChild(h('span', { class: 'tag tag-warn', text: '已改对 · 错题本还有 ' + st.wrongBook + ' 道' }));
    else head.appendChild(h('span', { class: 'tag tag-ok', text: '全对' }));
    card.appendChild(head);

    if (p.draft) {
      card.appendChild(h('p', { class: 'fb warn', style: 'margin:8px 0 0;padding:7px 11px;font-size:12.5px',
        text: '草稿题包：选择题已能自动判分；填空/解答题暂时只给原卷答案（点「看答案」对照），解析待补。' }));
    }

    var sub = [];
    if (p.exam) sub.push(p.exam);
    if (p.source) sub.push('来源：' + p.source);
    if (sub.length) card.appendChild(h('p', { class: 'ex-sub', text: sub.join(' · ') }));

    var tags = h('div', { class: 'ex-tags' });
    (p.topics || []).forEach(function (t) { tags.appendChild(h('span', { class: 'tag', text: t })); });
    var seenTag = {};
    qsOf(p).slice(0, 4).forEach(function (q) {
      (q.tags || []).forEach(function (t) {
        if (seenTag[t]) return;
        seenTag[t] = true;
        tags.appendChild(h('span', { class: 'tag-soft', text: t }));
      });
    });
    if (tags.children.length) card.appendChild(tags);

    var line = (st.full ? '满分 ' + st.full + ' 分 · ' : '') + '共 ' + st.graded + ' 题（判分）· 已录 ' + st.gradedDone;
    if (st.gradedDone) line += ' · 对 ' + st.ok + ' · 错 ' + st.wrong + ' · 正确率 ' + U.fmtPct(st.rate);
    if (st.full) line += ' · 已得 ' + st.got + ' 分';
    if (st.cumWrong) line += ' · 累计做错 ' + st.cumWrong + ' 次';
    if (st.selfTotal) line += ' · 另有 ' + st.selfTotal + ' 题对答案不判分';
    card.appendChild(h('p', { class: 'ex-statline', text: line }));
    card.appendChild(barEl(st.graded ? st.gradedDone / st.graded : 0,
      st.rate === null ? '' : (st.rate >= 0.75 ? 'ok' : (st.rate >= 0.4 ? '' : 'warn'))));

    if (p.note) card.appendChild(h('p', { class: 'tiny muted', style: 'margin-top:8px', text: '备注：' + p.note }));

    var btns = h('div', { class: 'ex-btns' });
    var startText = !st.gradedDone ? '开始练' : (st.gradedDone >= st.graded ? '重做一遍' : '继续（第 ' + nextNo(p, st) + ' 题）');
    var start = h('button', { class: 'btn btn-primary', type: 'button', text: startText });
    start.addEventListener('click', function () {
      PHYS.route.go('exam/' + encodeURIComponent(p.id), st.nextId ? { q: st.nextId } : {});
    });
    btns.appendChild(start);

    if (st.wrongBook > 0) {
      var only = h('button', { class: 'btn', type: 'button', text: '回炉错题 ' + st.wrongBook + ' 道' });
      only.addEventListener('click', function () {
        PHYS.route.go('exam/' + encodeURIComponent(p.id), { only: 'wrong' });
      });
      btns.appendChild(only);
    }
    card.appendChild(btns);
    return card;
  }

  function nextNo(p, st) {
    var q = st.nextId ? findQ(p, st.nextId) : null;
    return q ? q.no : '?';
  }

  function renderMissingPack(root, pid) {
    root.innerHTML = '';
    var card = h('div', { class: 'card' });
    card.innerHTML = '<h2>找不到这套题</h2>' +
      '<p class="small muted" style="margin-top:6px">题包 <code>' + esc(pid) + '</code> 不在题库里，可能题库更新过。</p>' +
      '<p class="small muted">不用慌，记录都还在。回题包列表重新选一套就行。</p>';
    var b = h('a', { class: 'btn btn-primary ex-link', href: '#/exam', style: 'margin-top:12px', text: '← 回题包列表' });
    card.appendChild(b);
    root.appendChild(card);
  }

  function renderEmptyPack(root, pack) {
    root.innerHTML = '';
    var card = h('div', { class: 'card' });
    card.innerHTML = '<h2>' + esc(pack.name) + '</h2>' +
      '<p class="small muted" style="margin-top:6px">这套题包里还没有题目。</p>';
    card.appendChild(h('a', { class: 'btn ex-link', href: '#/exam', style: 'margin-top:10px', text: '← 回题包列表' }));
    root.appendChild(card);
  }

  function renderQ(root) {
    var pack = V.pack, qs = qsOf(pack);
    var qi = V.order[V.pos];
    var q = qs[qi];
    if (!q) { renderResult(root); return; }
    var rec = recOf(pack.id, q.id);
    /* echo：刚提交完 / 主动点「看上次答案」时才回显上次作答与解析；
       其它情况一律空白作答 —— 老题再进来必须重新做一遍，不能带着上次的选项。 */
    var echo = !!V.echo && V.echo === q.id;
    var rerender = function () { renderQ(root); window.scrollTo(0, 0); };
    var st = packStat(pack);

    root.innerHTML = '';

    /* 顶栏 */
    var bar = h('div', { class: 'ex-bar' });
    bar.appendChild(h('a', { class: 'btn-ghost', href: '#/exam', text: '← 题包' }));
    bar.appendChild(h('span', { class: 'ex-title', text: pack.name }));
    bar.appendChild(h('span', { class: 'spacer' }));
    bar.appendChild(h('span', { class: 'pill', text: (V.mode === 'wrong' ? '只练错的 · ' : '') + '第 ' + (V.pos + 1) + ' / ' + V.order.length + ' 题' }));
    root.appendChild(bar);

    /* 整套进度 */
    var pr = h('div', { class: 'ex-prog' });
    pr.appendChild(h('span', { text: '整套已录 ' + st.gradedDone + ' / ' + st.graded + ' · 对 ' + st.ok +
      (st.full ? ' · 得 ' + st.got + ' / ' + st.full + ' 分' : '') +
      (st.cumWrong ? ' · 累计错 ' + st.cumWrong + ' 次' : '') }));
    pr.appendChild(barEl(st.graded ? st.gradedDone / st.graded : 0,
      st.rate === null ? '' : (st.rate >= 0.75 ? 'ok' : (st.rate >= 0.4 ? '' : 'warn'))));
    root.appendChild(pr);

    /* 题目卡：宽屏拆成两栏 —— 左边题干+选项+提交，右边考点·公式·解析，
       省掉"选完还要往下翻半屏看解析"的那段距离 */
    var split = useSplit();
    setWide(split);
    _wideNow = split;
    var card = h('div', { class: 'card' });
    var left = card, right = null, ph = null;
    if (split) {
      left = h('div', { class: 'ex-left' });
      right = h('aside', { class: 'ex-right' });
      card.appendChild(h('div', { class: 'ex-split' }, [left, right]));
      ph = h('div', { class: 'ex-ph' });
      ph.innerHTML = '<b>这边先空着是故意的。</b>在左边选好答案、点「提交本题」，这里就会出现这道题的' +
        '<b>考点 · 公式</b>、正确答案和逐句解析。<br>' +
        '想不出来的时候，先在左边按五步走一遍：情境 → 条件 → 规律 → 代入 → 验结果。';
      right.appendChild(ph);
    }
    var head = h('div', { class: 'qhead' });
    head.appendChild(h('span', { class: 'stepbadge', text: String(q.no || '?') }));
    if (q.group) head.appendChild(h('span', { class: 'tag', text: q.group }));
    (q.tags || []).forEach(function (t) { head.appendChild(h('span', { class: 'tag-soft', text: t })); });
    if (rec) {
      head.appendChild(h('span', { class: 'tag ' + (rec.ok ? 'tag-ok' : 'tag-bad'), text: rec.ok ? '上次做对' : '上次做错' }));
      if (cumWrong(rec) > 0) head.appendChild(h('span', { class: 'tag tag-bad', text: '累计错 ' + cumWrong(rec) + ' 次' }));
      head.appendChild(h('span', { class: 'pill', text: '已做 ' + (rec.tries || 1) + ' 次 · 对 ' + cumOk(rec) + ' 次' }));
    }
    if (q.diff) head.appendChild(h('span', { class: 'pill', text: '难度 ' + q.diff }));
    left.appendChild(head);

    /* 今晚急救标记：★ 重点题给横幅；同一题包里的其它题给一行"先跳过"提示 */
    var tonight = tonightList();
    var tIdx = -1;
    for (var ti = 0; ti < tonight.length; ti++) {
      if (tonight[ti].q.id === q.id) { tIdx = ti; break; }
    }
    if (tIdx >= 0) {
      var nb = h('div', { class: 'ex-night' });
      nb.appendChild(h('div', { class: 't', text: '★ 今晚重点题 · 第 ' + (tIdx + 1) + ' / ' + tonight.length + ' 道' }));
      nb.appendChild(h('div', { class: 'd', text: q.tonightWhy || '写满四行：公式 → 代入 → 单位 → 答句。' }));
      if (tonight[tIdx + 1]) {
        var nx = h('button', { class: 'btn btn-mini go', type: 'button', text: '下一道今晚重点题 →' });
        nx.addEventListener('click', function () {
          var nt = tonight[tIdx + 1];
          PHYS.route.go('exam/' + encodeURIComponent(nt.pack.id), { q: nt.q.id });
        });
        nb.appendChild(nx);
      }
      left.appendChild(nb);
    } else {
      var packHas = tonight.filter(function (x) { return x.pack.id === pack.id; });
      if (packHas.length) {
        var sk = h('div', { class: 'ex-skip' });
        sk.textContent = '【今晚安排】本卷要重点做的是' +
          packHas.map(function (x) { return '第 ' + x.q.no + ' 题（★）'; }).join('、') +
          '，这一道今晚先跳过 —— 今晚时间短，题做多了反而记不住。';
        left.appendChild(sk);
      }
    }

    /* 有原题图时以图为准（和卷面一致）；文字版折叠起来，避免重复占屏 */
    if (q.askImg) {
      left.appendChild(imgBlock(q.askImg, '第 ' + q.no + ' 题原题'));
      left.appendChild(h('p', { class: 'tiny muted', style: 'margin:-4px 0 2px;text-align:center', text: '点图可放大 · 图上已印有选项，下面点选作答' }));
      if (q.stem) left.appendChild(h('p', { class: 'small muted', style: 'margin-top:6px', text: q.stem }));
      if (q.ask) {
        var txtBox = h('div', { class: 'stem', text: q.ask });
        txtBox.style.display = 'none';
        var tg = h('button', { class: 'btn-ghost', type: 'button', text: '显示文字版 ▾', style: 'padding-left:0;margin-top:4px' });
        tg.addEventListener('click', function () {
          var show = txtBox.style.display === 'none';
          txtBox.style.display = show ? 'block' : 'none';
          tg.textContent = show ? '收起文字版 ▴' : '显示文字版 ▾';
        });
        left.appendChild(tg);
        left.appendChild(txtBox);
      }
    } else {
      if (q.ask) left.appendChild(h('div', { class: 'stem', text: q.ask }));
      if (q.stem) left.appendChild(h('p', { class: 'small muted', style: 'margin-top:6px', text: q.stem }));
      left.appendChild(h('div', { class: 'fb warn', text: '这题没有原题图，先按上面的文字作答；看不清就回原卷核对。' }));
    }

    /* 作答区 */
    var area = h('div', { class: 'ex-area' });
    var reader = null;
    var submitBtn = h('button', { class: 'btn btn-primary', type: 'button', text: '提交本题' });
    var selfRevealed = false;
    var fbHost = h('div', { class: 'ex-feedback' });

    function doSubmit() {
      if (isSelf(q)) { revealSelf(); return; }
      if (!reader) { UI.toast('这题暂时没法判分，先跳过', 'info'); return; }
      var r = reader.read();
      if (!r.filled) {
        UI.toast('还没填，先把你的答案写上', 'bad');
        if (reader.focus) { try { reader.focus(); } catch (e) { } }
        return;
      }
      if (r.allFilled === false) { UI.toast('还有空没填完，检查一下', 'info'); return; }
      PHYS.progress.examAnswer({ packId: pack.id, qid: q.id, ok: r.ok, user: r.user });
      if (PHYS.shell && PHYS.shell.refreshChip) PHYS.shell.refreshChip();
      V.echo = q.id;          /* 提交后这一次才回显判分与解析 */
      renderQ(root);
      /* 宽屏两栏时右侧就在眼前，不用再滚页面；手机仍然滚到解析 */
      var fb = split ? null : root.querySelector('.ex-feedback');
      if (fb && fb.scrollIntoView) { try { fb.scrollIntoView({ block: 'center' }); } catch (e) { } }
    }

    if (isSelf(q)) {
      area.appendChild(h('div', { class: 'fb info', text: '这题不判分：答案可能不止一种写法。先自己在纸上写完整，再点下面看答案图。' }));
      submitBtn.textContent = '我写完了 · 看答案与解析';
    } else if (q.type === 'choice') {
      reader = choiceArea(area, q, echo ? rec : null);
    } else if (q.fields && q.fields.length) {
      reader = fieldsArea(area, q, echo ? rec : null, doSubmit);
    } else {
      area.appendChild(h('div', { class: 'fb warn', text: '这题的判分字段没配好（缺 fields），先跳过这题，告诉家长补题库。' }));
      submitBtn.disabled = true;
    }
    left.appendChild(area);

    /* 重做提示条：上次的记录只当"档案"，作答区从空白开始（放在作答区上面） */
    if (!isSelf(q) && rec) {      var rw = h('div', { class: 'fb ' + (echo ? 'info' : 'warn') + ' ex-redo' });
      if (echo) {
        rw.innerHTML = '<b>这是你上次的作答与判分。</b>看懂了就点「重新做一遍」，作答区会清空；记录只累加，不会被覆盖。';
        var again2 = h('button', { class: 'btn', type: 'button', text: '重新做一遍（清空作答）', style: 'margin-top:8px' });
        again2.addEventListener('click', function () { V.echo = null; rerender(); });
        rw.appendChild(h('div', { style: 'margin-top:8px' }, [again2]));
      } else {
        rw.innerHTML = '<b>这题上次' + (rec.ok ? '做对了' : '做错了') + '，累计错 ' + cumWrong(rec) + ' 次、做对 ' + cumOk(rec) + ' 次。</b>' +
          '这次请<b>不看上次的痕迹重做一遍</b>，写完再提交。';
        var peek = h('button', { class: 'btn', type: 'button', text: '看上次的答案与解析', style: 'margin-top:8px' });
        peek.addEventListener('click', function () { V.echo = q.id; rerender(); });
        rw.appendChild(h('div', { style: 'margin-top:8px' }, [peek]));
      }
      left.insertBefore(rw, area);
    }

    var acts = h('div', { class: 'ex-btns' });
    acts.appendChild(submitBtn);
    if (!isSelf(q) && rec && (rec.tries || 1) > 0) acts.appendChild(h('span', { class: 'tiny muted', text: '再提交一次会累加次数（不会覆盖累计错次）' }));
    left.appendChild(acts);
    (right || card).appendChild(fbHost);

    submitBtn.addEventListener('click', doSubmit);

    /* 回显上次的作答 + 解析：只在刚提交完 / 主动点开时 */
    if (!isSelf(q) && echo && rec && reader) {
      try {
        if (q.type === 'choice') reader.mark(true);
        else { var rr = reader.read(); if (rr.res) reader.mark(rr.res); }
      } catch (e) { }
      buildAnswer();
    }
    if (isSelf(q) && selfRevealed) buildAnswer();
    function revealSelf() {
      if (selfRevealed) return;
      selfRevealed = true;
      buildAnswer();
      submitBtn.disabled = true;
      submitBtn.textContent = '答案已展开';
      var fb2 = split ? null : root.querySelector('.ex-feedback');
      if (fb2 && fb2.scrollIntoView) { try { fb2.scrollIntoView({ block: 'center' }); } catch (e) { } }
    }

    /* 反馈 + 答案 + 解析 */
    function buildAnswer() {
      fbHost.innerHTML = '';
      if (ph) ph.style.display = 'none';   /* 右侧占位提示让位给真的解析 */
      if (right) right.scrollTop = 0;
      var ok = rec ? !!rec.ok : false;
      if (!isSelf(q)) {
        var fb = h('div', { class: 'fb ' + (ok ? 'ok' : 'bad') });
        if (ok) {
          fb.innerHTML = '<b>对了。</b>' + ((rec.tries || 1) > 1
            ? '这次是第 ' + (rec.tries || 1) + ' 次做、第 ' + cumOk(rec) + ' 次做对，能改过来就是真的会了——记住这次是怎么想的。'
            : '思路保持住，下一题也照这样走。') +
            (inWrongBook(pack.id, q.id)
              ? '<br><span class="tiny">这题累计错过 ' + cumWrong(rec) + ' 次，仍然留在错题本里：<b>过几天再回炉一遍</b>，确认真会了再去「错题回炉」勾「我会了」。</span>'
              : '');
        } else {
          fb.innerHTML = '<b>这题没对上。</b>不扣分，也不批评。已经放进错题本（累计错 ' + cumWrong(rec) + ' 次），过两天再来一次就行。';
        }
        fbHost.appendChild(fb);

        if (!ok) {
          var f = focusOf(q), fi = focusIndex(q);
          var warn = h('div', { class: 'fb warn', style: 'margin-top:8px' });
          warn.innerHTML = f
            ? '<b>大概率断在第 ' + fi + ' 步「' + esc(f.n) + '」</b><br>' + esc(f.ask) +
            '<br><span class="tiny">下一步：只回这一步想 20 秒，再把这题重做一遍，不用从头算。</span>'
            : '<b>下一步：</b>把题目拆成「情境 → 条件 → 规律 → 代入 → 验结果」五步，看自己卡在哪一步。';
          fbHost.appendChild(warn);
        }
      }

      /* 正确答案 */
      var ansLine = h('div', { class: 'row ex-ansline' });
      ansLine.appendChild(h('span', { class: 'tag', text: isSelf(q) ? '参考答案（不判分）' : '正确答案' }));
      ansLine.appendChild(h('b', { text: ansText(q) || '见下方答案图' }));
      fbHost.appendChild(ansLine);

      if (!isSelf(q) && !ok && rec) {
        var mine = userText(q, rec.user);
        if (mine) fbHost.appendChild(h('p', { class: 'small muted', style: 'margin-top:4px', text: '你填的是：' + mine }));
      }

      /* 考点 · 公式：放在解析最前面，先锁定「考什么、用哪条式子」 */
      var kb = keyBlock(q);
      if (kb) fbHost.appendChild(kb);

      /* 答案图：默认折叠，先想后看 */
      if (q.ansImg) {
        var abtn = h('button', { class: 'btn ex-ansbtn', type: 'button', text: '先自己再想一遍 · 看答案图' });
        var abox = h('div', { class: 'ex-ansbox', style: 'display:none' });
        abox.appendChild(imgBlock(q.ansImg, '第 ' + q.no + ' 题参考答案'));
        abtn.addEventListener('click', function () {
          var open = abox.style.display !== 'none';
          abox.style.display = open ? 'none' : '';
          abtn.classList.toggle('open', !open);
          abtn.textContent = open ? '先自己再想一遍 · 看答案图' : '收起答案图';
        });
        fbHost.appendChild(abtn);
        fbHost.appendChild(abox);
      } else if (!isSelf(q)) {
        fbHost.appendChild(h('p', { class: 'tiny muted', style: 'margin-top:8px', text: '这题没有答案图，答案以原卷参考答案为准。' }));
      }

      /* 解析 */
      var solArr = q.solution ? (Array.isArray(q.solution) ? q.solution : [q.solution]) : [];
      if (solArr.length || q.tip) {
        var sol = h('div', { class: 'sol' });
        if (solArr.length) {
          sol.appendChild(h('h4', { text: '解析' }));
          var ol = h('ol');
          solArr.forEach(function (s) {
            var li = h('li');
            li.innerHTML = hlFormula(s, q);
            ol.appendChild(li);
          });
          sol.appendChild(ol);
        }
        if (q.tip) sol.appendChild(h('div', { class: 'tip', text: '一句话记住：' + q.tip }));
        fbHost.appendChild(sol);
      }

      /* 最后一题：直接给"完成整卷" */
      if (V.pos === V.order.length - 1) {
        var finInline = h('button', { class: 'btn btn-primary', type: 'button', text: '这题是最后一题 → 完成整卷', style: 'margin-top:12px;width:100%;min-height:42px' });
        finInline.addEventListener('click', function () { renderResult(root); });
        fbHost.appendChild(finInline);
      }
    }

    root.appendChild(card);

    /* 导航 */
    var nav = h('div', { class: 'ex-nav' });
    var prev = h('button', { class: 'btn', type: 'button', text: '← 上一题' });
    prev.disabled = V.pos <= 0;
    prev.addEventListener('click', function () { if (V.pos > 0) { V.pos--; V.echo = null; rerender(); } });
    nav.appendChild(prev);

    var last = V.pos >= V.order.length - 1;
    var next = h('button', {
      class: 'btn ' + (last ? 'btn-primary' : ''), type: 'button',
      text: last ? '完成整卷，看结果' : '下一题 →'
    });
    next.addEventListener('click', function () {
      if (last) renderResult(root); else { V.pos++; V.echo = null; rerender(); }
    });
    nav.appendChild(next);

    var jumpBtn = h('button', { class: 'btn-ghost', type: 'button', text: '题目清单' });
    nav.appendChild(jumpBtn);

    var fin = h('button', { class: 'btn-ghost', type: 'button', text: '整卷结果' });
    fin.addEventListener('click', function () { renderResult(root); });
    if (!last && st.gradedDone >= st.graded) fin.className = 'btn btn-primary';
    nav.appendChild(fin);
    root.appendChild(nav);

    /* 题目清单（预览式选题）：选之前能看见题干摘要和原题缩略图 */
    var jumpBox = h('div', { class: 'ex-pick', style: 'display:none' });
    var pickHead = h('div', { class: 'ex-pick-h' });
    pickHead.appendChild(h('b', { text: '题目清单' }));
    pickHead.appendChild(h('span', { class: 'ex-pick-hint', text: '共 ' + V.order.length + ' 题 · 点一行跳到那题 · 点右边的缩略图先放大看原题（不跳题）' }));
    jumpBox.appendChild(pickHead);
    var pickList = h('div', { class: 'ex-pick-list' });
    V.order.forEach(function (qi2, pos) {
      var qq = qs[qi2] || {};
      var r2 = recOf(pack.id, qq.id);
      var cur = pos === V.pos;
      var state = '', stCls = '';
      if (isSelf(qq)) { state = '对答案 · 不判分'; }
      else if (!r2) { state = '还没做'; }
      else if (r2.ok) { state = '上次做对 · 累计对 ' + cumOk(r2) + ' 次'; stCls = 'ok'; }
      else { state = '上次做错 · 累计错 ' + cumWrong(r2) + ' 次'; stCls = 'no'; }
      var noCls = 'ex-pick-no' + (cur ? ' on' : '') +
        (!isSelf(qq) && r2 ? (r2.ok ? ' ok' : ' no') : '') + (qq.tonight ? ' tonight' : '');
      var askTxt = askPreview(qq);
      var row = h('div', {
        class: 'ex-pick-row' + (cur ? ' on' : ''), role: 'button', tabindex: '0',
        title: '第 ' + qq.no + ' 题：' + askTxt
      });
      row.appendChild(h('span', { class: noCls, text: String(qq.no || '?') }));
      var main = h('span', { class: 'ex-pick-main' });
      main.appendChild(h('span', { class: 'ex-pick-ask', text: askTxt }));
      var meta = h('span', { class: 'ex-pick-meta' });
      meta.appendChild(h('span', { class: 'st' + (cur ? ' cur' : stCls ? ' ' + stCls : ''),
        text: (cur ? '当前题 · ' : '') + state }));
      if (qq.group) meta.appendChild(h('span', { text: qq.group }));
      (qq.tags || []).slice(0, 2).forEach(function (t) { meta.appendChild(h('span', { text: t })); });
      main.appendChild(meta);
      row.appendChild(main);
      var src = firstImg(qq.askImg);
      if (src) {
        var th = h('span', { class: 'ex-pick-th', role: 'button', tabindex: '0', 'aria-label': '放大第 ' + qq.no + ' 题原题图' });
        var thumb = document.createElement('img');
        thumb.loading = 'lazy';
        thumb.alt = '第 ' + qq.no + ' 题原题缩略图';
        thumb.src = src;
        th.appendChild(thumb);
        th.addEventListener('click', function (e) { e.stopPropagation(); UI.zoom(src); });
        th.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); UI.zoom(src); }
        });
        row.appendChild(th);
      } else {
        row.appendChild(h('span', { class: 'ex-pick-th' }));
      }
      row.addEventListener('click', function () { V.pos = pos; V.echo = null; rerender(); });
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); row.click(); }
      });
      pickList.appendChild(row);
    });
    jumpBox.appendChild(pickList);

    var pickOpen = false;
    function setPick(open) {
      pickOpen = open;
      jumpBox.style.display = open ? '' : 'none';
      jumpBtn.textContent = open ? '题目清单 ▴' : '题目清单';
      jumpBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (!open) return;
      var onRow = pickList.querySelector('.ex-pick-row.on');
      if (onRow && onRow.scrollIntoView) { try { onRow.scrollIntoView({ block: 'nearest' }); } catch (e) { } }
    }
    jumpBtn.setAttribute('aria-expanded', 'false');
    jumpBtn.addEventListener('click', function () { setPick(!pickOpen); });
    root.appendChild(jumpBox);

    /* 地址栏跟随当前题（只在整卷模式；只练错的模式刷新后回到"只练错的"） */
    if (V.mode === 'all') syncHash('/exam/' + encodeURIComponent(pack.id) + '?q=' + encodeURIComponent(q.id));
  }

  function renderResult(root) {
    var pack = V.pack, qs = qsOf(pack), rec = packRec(pack.id);
    var st = packStat(pack);
    setWide(false);
    /* 本卷考点：用规范考点标签按题序去重，比 point 整句更适合做标签 */
    var keyNames = [], keySeen = {};
    qs.forEach(function (q) {
      (q.tags || []).forEach(function (t) {
        if (!t || keySeen[t]) return;
        keySeen[t] = true;
        keyNames.push(t);
      });
    });
    var wrong = [], undone = [], fixed = [];
    qs.forEach(function (q, i) {
      if (isSelf(q)) return;
      var r = rec[q.id];
      if (!r) undone.push({ q: q, i: i });
      else if (!r.ok) wrong.push({ q: q, i: i, r: r });
      else if (inWrongBook(pack.id, q.id)) fixed.push({ q: q, i: i, r: r });
    });
    root.innerHTML = '';

    var bar = h('div', { class: 'ex-bar' });
    bar.appendChild(h('a', { class: 'btn-ghost', href: '#/exam', text: '← 题包' }));
    bar.appendChild(h('span', { class: 'ex-title', text: pack.name }));
    bar.appendChild(h('span', { class: 'spacer' }));
    bar.appendChild(h('span', { class: 'pill', text: '整卷结果' }));
    root.appendChild(bar);

    var card = h('div', { class: 'card' });
    card.appendChild(h('h2', { text: pack.name + ' · 结果' }));

    var score = h('div', { class: 'ex-score' });
    var mega = h('div', { class: 'ex-mega' + (!wrong.length && !undone.length && st.graded ? ' ok' : '') });
    if (st.full) {
      mega.innerHTML = st.got + '<span style="font-size:15px;font-weight:600;color:var(--muted)"> / ' + st.full + ' 分</span>';
    } else {
      mega.innerHTML = st.ok + '<span style="font-size:15px;font-weight:600;color:var(--muted)"> / ' + st.graded + ' 题</span>';
    }
    score.appendChild(mega);
    var meta = h('div', { class: 'small muted' });
    meta.innerHTML = (st.rate === null ? '还没开始录' : '正确率 ' + U.fmtPct(st.rate)) +
      '<br>已录 ' + st.gradedDone + ' / ' + st.graded + ' 题 · 对 ' + st.ok + ' 题' +
      (st.cumWrong ? ' · 累计做错 ' + st.cumWrong + ' 次' : '') +
      (st.selfTotal ? ' · ' + st.selfTotal + ' 题对答案不判分' : '');
    score.appendChild(meta);
    card.appendChild(score);
    card.appendChild(barEl(st.graded ? st.gradedDone / st.graded : 0,
      st.rate === null ? '' : (st.rate >= 0.75 ? 'ok' : (st.rate >= 0.4 ? '' : 'warn'))));

    if (!wrong.length && !undone.length && st.graded) {
      var good = h('div', { class: 'fb ok', style: 'margin-top:12px' });
      good.innerHTML = '<b>这一套全对了。</b>下一步：过一两周再回来做一遍，看是不是还这么顺；顺手去「错题回炉」看看别的断点。';
      card.appendChild(good);
    }
    if (keyNames.length) {
      var kbox = h('div', { style: 'margin-top:14px' });
      kbox.appendChild(h('div', { class: 'small', style: 'font-weight:700;margin-bottom:7px', text: '这张卷子考了这些（按题序去重）' }));
      var ktags = h('div', { class: 'ex-tags' });
      keyNames.forEach(function (n) { ktags.appendChild(h('span', { class: 'tag-soft', text: n })); });
      kbox.appendChild(ktags);
      card.appendChild(kbox);
    }
    if (undone.length) {
      var un = h('div', { class: 'fb warn', style: 'margin-top:12px' });
      un.innerHTML = '<b>还有 ' + undone.length + ' 题没录：</b>第 ' + undone.map(function (x) { return x.q.no; }).join('、') + ' 题。';
      var goUndone = h('button', { class: 'btn-mini', type: 'button', text: '接着录 →', style: 'margin-top:8px' });
      goUndone.addEventListener('click', function () {
        V.mode = 'all'; V.order = qs.map(function (_, i) { return i; }); V.pos = undone[0].i;
        renderQ(root);
      });
      un.appendChild(goUndone);
      card.appendChild(un);
    }
    if (wrong.length) {
      card.appendChild(h('h3', { style: 'margin-top:14px', text: '这一轮还错着 ' + wrong.length + ' 题（点重做，当场改）' }));
      var list = h('div', { class: 'ex-wlist' });
      wrong.forEach(function (it) {
        var row = h('div', { class: 'ex-wrow' });
        var main = h('div', { class: 'ex-wmain' });
        main.appendChild(h('div', { class: 'ex-wtitle', text: '第 ' + it.q.no + ' 题 · ' + (it.q.tags || []).join(' / ') }));
        if (it.q.point) main.appendChild(h('div', { class: 'tiny', style: 'color:var(--brand-d);margin-top:2px', text: '考点：' + it.q.point }));
        var mine = userText(it.q, it.r.user);
        main.appendChild(h('div', { class: 'tiny muted', text: '你的答案：' + (mine || '（空）') }));
        main.appendChild(h('div', { class: 'tiny muted', text: '这题累计错 ' + cumWrong(it.r) + ' 次 · 做对 ' + cumOk(it.r) + ' 次' }));
        row.appendChild(main);
        var rb = h('button', { class: 'btn', type: 'button', text: '重做 →' });
        rb.addEventListener('click', function () {
          V.mode = 'all'; V.order = qs.map(function (_, i) { return i; }); V.pos = it.i; V.echo = null;
          renderQ(root);
        });
        row.appendChild(rb);
        list.appendChild(row);
      });
      card.appendChild(list);
    }
    if (fixed.length) {
      var fx = h('div', { class: 'fb info', style: 'margin-top:12px' });
      fx.innerHTML = '<b>还有 ' + fixed.length + ' 题已经改对，但仍留在错题本：</b>第 ' +
        fixed.map(function (x) { return x.q.no; }).join('、') + ' 题。' +
        '<br><span class="tiny muted">留着是给你过几天再回炉一遍用的；确认真会了，去「错题回炉」勾「我会了」即可清掉。</span>';
      card.appendChild(fx);
    }

    var btns = h('div', { class: 'ex-btns' });
    if (wrong.length) {
      var only = h('button', { class: 'btn btn-primary', type: 'button', text: '只练错的 ' + wrong.length + ' 道' });
      only.addEventListener('click', function () {
        V.mode = 'wrong'; V.order = wrong.map(function (x) { return x.i; }); V.pos = 0; V.echo = null; renderQ(root);
      });
      btns.appendChild(only);
    }
    var bookIdx = wrongIdxOf(pack);
    if (bookIdx.length > wrong.length) {
      var bookBtn = h('button', { class: 'btn', type: 'button', text: '回炉错题本 ' + bookIdx.length + ' 道（含已改对的）' });
      bookBtn.addEventListener('click', function () {
        V.mode = 'wrong'; V.order = bookIdx.slice(); V.pos = 0; V.echo = null; renderQ(root);
      });
      btns.appendChild(bookBtn);
    }
    var again = h('button', { class: 'btn', type: 'button', text: '再来一遍' });
    again.addEventListener('click', function () {
      V.mode = 'all'; V.order = qs.map(function (_, i) { return i; }); V.pos = 0; V.echo = null; renderQ(root);
    });
    btns.appendChild(again);
    btns.appendChild(h('a', { class: 'btn', href: '#/exam', text: '回题包列表' }));
    btns.appendChild(h('a', { class: 'btn-ghost', href: '#/wrong', text: '去错题回炉 →' }));
    card.appendChild(btns);
    root.appendChild(card);
    syncHash('/exam/' + encodeURIComponent(pack.id));
  }

  PHYS.registry.register({
    id: 'exam', title: '试卷练习', short: '试卷', icon: '▤', order: 20,
    desc: '把整张卷子在纸上做完，再一题一题录答案、对解析。错题自动进错题本。',
    mount: function (root, params) {
      params = params || {};
      var pid = params._arg;
      if (!pid) { V = null; renderList(root); return; }
      var pack = findPack(pid);
      if (!pack) { V = null; renderMissingPack(root, pid); return; }
      if (!qsOf(pack).length) { V = null; renderEmptyPack(root, pack); return; }

      V = { pack: pack, order: [], pos: 0, mode: 'all', echo: null };
      var all = qsOf(pack).map(function (_, i) { return i; });

      if (params.only === 'wrong') {
        /* 回炉范围 = 错题本里还没清的（含已改对的）+ 当前还错着的 */
        var wr = wrongIdxOf(pack);
        if (wr.length) { V.mode = 'wrong'; V.order = wr; } else { V.order = all; UI.toast('这套已经没有错题了', 'ok'); }
      } else {
        V.order = all;
      }

      if (params.q) {
        var at = V.order.indexOf(qIndexOf(pack, params.q));
        if (at >= 0) V.pos = at;
        else {
          var valid = qIndexOf(pack, params.q);
          if (valid >= 0) { V.mode = 'all'; V.order = all; V.pos = valid; }
        }
      } else if (V.mode === 'all') {
        /* 续做：第一道没录的题 */
        for (var i = 0; i < V.order.length; i++) {
          if (!recOf(pack.id, qsOf(pack)[V.order[i]].id)) { V.pos = i; break; }
        }
      }
      renderQ(root);
    },
    unmount: function () { V = null; setWide(false); }
  });

  /* ---------------- 错题回炉 ---------------- */
  function wrongGroups() {
    var out = { guided: [], exam: [], concept: [] };
    PHYS.progress.wrongList().forEach(function (w) {
      if (out[w.kind]) out[w.kind].push(w);
    });
    return out;
  }

  function guidedInfo(w) {
    var g = null, pack = null, q = null;
    guidedItems().forEach(function (x) { if (!g && x.questionId === w.qid) g = x; });
    packs().forEach(function (p) {
      if (pack) return;
      var qq = findQ(p, w.qid);
      if (qq) { pack = p; q = qq; }
    });
    var label = g && g.title ? g.title : (pack && q ? pack.name + ' 第 ' + q.no + ' 题' : '五步引导题 ' + w.qid);
    var note = [];
    if (q && focusOf(q)) note.push('卡在「' + focusOf(q).n + '」');
    else note.push('五步没走通');
    if (q && q.tags) note.push(q.tags.join(' / '));
    return {
      label: label, href: '#/guided?q=' + encodeURIComponent(w.qid),
      tagText: '五步引导', tagCls: 'tag-soft', note: note.join(' · ')
    };
  }

  function examInfo(w) {
    var p = findPack(w.packId), q = p ? findQ(p, w.qid) : null;
    var label = p
      ? p.name + ' · 第 ' + (q ? q.no : '?') + ' 题'
      : '题包 ' + w.packId + ' 的题 ' + w.qid;
    var rec = p ? recOf(w.packId, w.qid) : null;
    var cn = w.n || cumWrong(rec) || 1;
    var note = [];
    if (q && q.point) note.push(q.point);
    else if (q && q.tags) note.push(q.tags.join(' / '));
    if (q && focusOf(q)) note.push('断点：' + focusOf(q).n);
    if (q && q.ask) note.push(q.ask.length > 26 ? q.ask.slice(0, 26) + '…' : q.ask);
    if (rec && rec.ok) note.push('上次已经改对：确认真会了就勾「我会了」清掉');
    else note.push('还不熟：再去回炉做一遍');
    if (!p) note.push('（题包可能已更新）');
    return {
      label: label, href: '#/exam/' + encodeURIComponent(w.packId) + '?q=' + encodeURIComponent(w.qid),
      tagText: '累计错 ' + cn + ' 次', tagCls: 'tag-bad', note: note.join(' · '),
      extra: rec ? '已做 ' + (rec.tries || 1) + ' 次 · 对 ' + cumOk(rec) + ' 次' : ''
    };
  }

  function conceptInfo(w) {
    var c = null;
    concepts().forEach(function (x) { if (!c && x.id === w.cid) c = x; });
    var note = [];
    if (c && c.tags) note.push(c.tags.join(' / '));
    /* 概念错卡不会自动清（答错过就留着），这里提示最近一次是否已经答对，方便判断能不能勾掉 */
    var r = PHYS.store.get('concept.' + w.cid, null);
    if (r && r.streak > 0) note.push('最近一次已经答对：确认真会了就勾掉');
    else note.push('到「概念闪练」找这张卡重做');
    var extra = (r && r.n) ? '（练过 ' + r.n + ' 次，对 ' + r.ok + ' 次）' : '';
    return {
      label: c ? c.q : '概念卡 ' + w.cid,
      href: '#/concept', tagText: '概念闪练', tagCls: 'tag-soft', note: note.join(' · ') + extra
    };
  }

  var KIND_META = {
    guided: { name: '五步断点', info: guidedInfo, hint: '五步引导没走通的地方' },
    exam: { name: '试卷错题', info: examInfo, hint: '试卷里错过的题（改对了也留着，累计错次数记着）' },
    concept: { name: '概念错卡', info: conceptInfo, hint: '概念闪练里答错的卡（答错过就留着，手动勾「我会了」才清）' }
  };

  function renderWrong(root, kind) {
    kind = kind || 'all';
    var g = wrongGroups();
    var total = g.guided.length + g.exam.length + g.concept.length;
    root.innerHTML = '';

    var head = h('div', { class: 'card' });
    head.innerHTML = '<div class="row"><h2 style="margin:0">错题回炉</h2><span class="spacer"></span>' +
      '<span class="pill">共 ' + total + ' 条</span></div>' +
      '<p class="small muted" style="margin-top:6px">这里只放「还没清掉」的断点。清掉的标准很简单：<b>不看答案，自己能完整做一遍</b>。只是「看过了」不算清。</p>';

    /* 三个统计（点一下 = 只看这一类） */
    var stats = h('div', { class: 'ex-wstats' });
    ['guided', 'exam', 'concept'].forEach(function (k) {
      stats.appendChild(statBtn(k, g[k].length, KIND_META[k].name, kind, root));
    });
    head.appendChild(stats);

    /* 筛选 chips */
    var chips = h('div', { class: 'ex-chips' });
    [['all', '全部'], ['guided', '只看五步'], ['exam', '只看试卷'], ['concept', '只看概念']].forEach(function (p) {
      var b = h('button', { class: 'ex-chip' + (kind === p[0] ? ' on' : ''), type: 'button', text: p[1] + '（' + (p[0] === 'all' ? total : g[p[0]].length) + '）' });
      b.addEventListener('click', function () { renderWrong(root, p[0]); });
      chips.appendChild(b);
    });
    head.appendChild(chips);
    root.appendChild(head);

    if (!total) {
      var empty = h('div', { class: 'card' });
      empty.innerHTML = '<h2>错题本是空的</h2>' +
        '<p class="small muted" style="margin-top:8px">这可能是好消息：最近做的都没错。也可能是还没开始录。</p>' +
        '<p class="small" style="margin-top:10px"><b>下一步可以这样做：</b></p>' +
        '<ul class="small muted" style="margin:6px 0 0 18px;line-height:1.9">' +
        '<li>拿一张最近的周练卷，在纸上做完，来「试卷练习」一题一题录答案。</li>' +
        '<li>录完先看断点在哪一步：认情境 / 圈条件 / 选规律 / 代数据 / 验结果。</li>' +
        '<li>只补最断的那一环，别平均用力。</li></ul>';
      var acts = h('div', { class: 'ex-empty-actions' });
      acts.appendChild(h('a', { class: 'btn btn-primary', href: '#/exam', text: '去试卷练习 →' }));
      acts.appendChild(h('a', { class: 'btn', href: '#/concept', text: '去概念闪练' }));
      acts.appendChild(h('a', { class: 'btn', href: '#/guided', text: '去五步引导' }));
      empty.appendChild(acts);
      root.appendChild(empty);
      return;
    }

    var sel = {};   // key -> true
    var clearBtn = h('button', { class: 'btn', type: 'button', text: '勾选「我会了」再清' });
    clearBtn.disabled = true;
    var clearRow = h('div', { class: 'ex-btns' });
    clearRow.appendChild(clearBtn);
    clearRow.appendChild(h('span', { class: 'tiny muted', text: '清掉的题如果再错，会自动回来。' }));

    function refreshClear() {
      var n = Object.keys(sel).length;
      clearBtn.textContent = n ? '清掉勾选的 ' + n + ' 条' : '勾选「我会了」再清';
      clearBtn.disabled = !n;
    }
    clearBtn.addEventListener('click', function () {
      var keys = Object.keys(sel);
      if (!keys.length) { UI.toast('先勾选「我会了」的条目', 'info'); return; }
      UI.confirm('把这 ' + keys.length + ' 条从错题本清掉？以后再做错会自动回来。', '清掉').then(function (ok) {
        if (!ok) return;
        keys.forEach(function (k) { PHYS.progress.clearWrong(k); });
        UI.toast('清掉 ' + keys.length + ' 条，做得好', 'ok');
        renderWrong(root, kind);
      });
    });

    var shown = 0;
    ['guided', 'exam', 'concept'].forEach(function (k) {
      if (kind !== 'all' && kind !== k) return;
      var arr = g[k];
      var card = h('div', { class: 'card' });
      var cr = h('div', { class: 'row' });
      cr.appendChild(h('h2', { style: 'margin:0', text: KIND_META[k].name }));
      cr.appendChild(h('span', { class: 'tag ' + (k === 'exam' ? 'tag-bad' : 'tag-warn'), text: String(arr.length) }));
      cr.appendChild(h('span', { class: 'small muted', text: KIND_META[k].hint }));
      card.appendChild(cr);

      if (!arr.length) {
        card.appendChild(h('p', { class: 'small muted', style: 'margin-top:10px', text: '这一类暂时是空的。' }));
      } else {
        shown += arr.length;
        var list = h('div', { class: 'ex-wlist' });
        arr.forEach(function (w) {
          var info = KIND_META[k].info(w);
          var row = h('div', { class: 'ex-wrow' });
          var cbWrap = h('label', { class: 'ex-wcheck' });
          var cb = h('input', { type: 'checkbox' });
          cb.addEventListener('change', function () {
            if (cb.checked) sel[w.key] = true; else delete sel[w.key];
            refreshClear();
          });
          cbWrap.appendChild(cb);
          cbWrap.appendChild(h('span', { class: 'tiny', text: '我会了' }));
          row.appendChild(cbWrap);

          var main = h('div', { class: 'ex-wmain' });
          main.appendChild(h('div', { class: 'ex-wtitle', text: info.label }));
          var sub = h('div', { class: 'tiny muted' });
          sub.appendChild(h('span', { class: 'tag ' + info.tagCls, style: 'margin-right:6px', text: info.tagText }));
          sub.appendChild(document.createTextNode((info.note || '') + (info.extra ? ' · ' + info.extra : '')));
          main.appendChild(sub);
          row.appendChild(main);

          var right = h('div', { class: 'ex-wright' });
          right.appendChild(h('span', { class: 'tiny muted', text: U.daysAgo(w.at) + ' 天前' }));
          right.appendChild(h('a', { class: 'btn ex-link', href: info.href, text: '去回炉 →' }));
          row.appendChild(right);

          list.appendChild(row);
        });
        card.appendChild(list);
      }
      root.appendChild(card);
    });

    /* 清空「我会了」的入口放在清单后面：勾完就清，动线自然 */
    root.appendChild(clearRow);

    if (!shown) {
      var none = h('div', { class: 'card empty', text: '这个分类下暂时没有待清的题。换个分类看看。' });
      root.appendChild(none);
    }
  }

  function statBtn(k, n, name, kind, root) {
    var b = h('button', { class: 'ex-wstat' + (kind === k ? ' on' : ''), type: 'button' });
    b.innerHTML = '<b>' + n + '</b><span>' + esc(name) + '</span>';
    b.addEventListener('click', function () { renderWrong(root, k); });
    return b;
  }

  PHYS.registry.register({
    id: 'wrong', title: '错题回炉', short: '错题', icon: '↺', order: 25,
    desc: '五步断点、试卷错题、概念错卡，三类断点一起清。清掉一条只需要「不看答案做一遍」。',
    mount: function (root, params) {
      renderWrong(root, (params && params.kind) || 'all');
    }
  });

})();


/* ===== 60-report.js ===== */
/* =============================================================
   训练报告：五步命中率 / 概念熟练度 / 试卷正确率 / 下一步做什么 + 记录导出导入
   ============================================================= */
(function () {
  'use strict';
  var PHYS = window.PHYS, U = PHYS.util, UI = PHYS.ui;

  UI.addCSS(
    '.rp-sec{margin-bottom:14px}' +
    '.rp-step{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}' +
    '.rp-step:last-child{border-bottom:0}' +
    '.rp-step .nm{width:78px;font-size:13.5px;font-weight:600;flex:0 0 78px}' +
    '.rp-step .bw{flex:1;min-width:60px}' +
    '.rp-step .vv{width:74px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}' +
    '.rp-step .tagx{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bad-bg);color:var(--bad);font-weight:700}' +
    '.rp-tips{border-left:3px solid var(--brand);padding-left:12px;margin:10px 0}' +
    '.rp-tips b{color:var(--brand-d)}' +
    '.rp-pack{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}' +
    '.rp-pack:last-child{border-bottom:0}' +
    '.rp-lv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}' +
    '.rp-lv div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}' +
    '.rp-lv b{display:block;font-size:17px}' +
    '.rp-lv span{font-size:11.5px;color:var(--muted)}' +
    '@media(max-width:640px){.rp-step .nm{width:62px;flex:0 0 62px}.rp-lv{grid-template-columns:repeat(2,1fr)}}'
  );

  var STEP_ADVICE = {
    model: '做题前先问一句「这是什么模型」。看到支点+动力阻力=杠杆；看到滑轮=滑轮组；看到温度变化/吸放热=热学。模型认错，后面全白算。',
    cond: '把条件连单位一起抄到纸上（500 N / 20 cm / 2 kg），再标出"题目没给的不许自己加"。单位不统一是这里最常见的断点。',
    rule: '看到题目先别算，先写公式，并默念一遍适用条件（杠杆要平衡、滑轮要不计摩擦、热学要吸放热对应）。公式选错，算得再对也没分。',
    calc: '先换算单位（cm→m、g→kg、kW→W），再代数字。分步写中间量，别在脑子里连乘。',
    check: '最后 10 秒做三件事：看单位、看数量级、看常识（机械效率不会超过 100%，人提东西的功率不会只有几毫瓦）。'
  };

  function stepRow(st, rate, n) {
    var pct = rate === null ? 0 : Math.round(rate * 100);
    var cls = rate === null ? '' : pct >= 75 ? 'ok' : pct >= 50 ? '' : 'bad';
    var d = UI.el('div', { class: 'rp-step' });
    d.innerHTML = '<span class="nm">' + st.n + '</span>' +
      '<span class="bw"><span class="bar ' + cls + '"><i style="width:' + pct + '%"></i></span></span>' +
      '<span class="vv">' + (rate === null ? '没数据' : pct + '% · ' + n + ' 次') + '</span>';
    return d;
  }

  function conceptTagStats() {
    var byTag = {};
    (PHYS.DATA.concepts || []).forEach(function (c) {
      var rec = PHYS.store.get('concept.' + c.id, null);
      (c.tags || []).forEach(function (t) {
        var s = byTag[t] = byTag[t] || { n: 0, ok: 0, total: 0 };
        s.total++;
        if (rec && rec.n) { s.n += rec.n; s.ok += rec.ok; }
      });
    });
    return Object.keys(byTag).map(function (t) {
      var s = byTag[t];
      return { tag: t, n: s.n, ok: s.ok, rate: s.n ? s.ok / s.n : null, total: s.total };
    }).filter(function (x) { return x.n > 0; })
      .sort(function (a, b) { return a.rate - b.rate; });
  }

  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  PHYS.registry.register({
    id: 'report', title: '训练报告', short: '报告', icon: '▦', order: 30,
    desc: '五步命中率、概念熟练度、试卷正确率，以及下一步补哪儿',
    mount: function (root) {
      var s = PHYS.progress.stats();
      var weakest = null;
      PHYS.FIVE.forEach(function (st) {
        var r = s.stepRates[st.k];
        var n = (PHYS.store.get('stepStats.' + st.k, { n: 0 }).n) || 0;
        if (r !== null && n >= 2 && (!weakest || r < weakest.r)) weakest = { st: st, r: r, n: n };
      });

      /* 概览 */
      var top = UI.el('div', { class: 'card' });
      top.innerHTML = '<h2>训练报告</h2>' +
        '<p class="small muted">只看趋势，不看分数。哪一环最红就补哪一环，不要平均用力。</p>' +
        '<div class="rp-lv">' +
        '<div><b>' + s.streak + '</b><span>连续练习天数</span></div>' +
        '<div><b>' + s.guidedDone + '</b><span>五步引导走完</span></div>' +
        '<div><b>' + (s.exam.rate === null ? '—' : U.fmtPct(s.exam.rate)) + '</b><span>试卷正确率</span></div>' +
        '<div><b>' + s.wrong + '</b><span>错题待清</span></div>' +
        '</div>';
      root.appendChild(top);

      /* 五步 */
      var stc = UI.el('div', { class: 'card' });
      stc.appendChild(UI.el('h2', { text: '① 五步断在哪一环' }));
      stc.appendChild(UI.el('p', { class: 'small muted', style: 'margin-bottom:6px', text: '统计的是「第一次就答对」的比例；看提示后答对不算。' }));
      PHYS.FIVE.forEach(function (st) {
        var n = (PHYS.store.get('stepStats.' + st.k, { n: 0 }).n) || 0;
        var row = stepRow(st, s.stepRates[st.k], n);
        if (weakest && weakest.st.k === st.k) {
          row.children[0].innerHTML = st.n + ' <span class="tagx">最弱</span>';
        }
        stc.appendChild(row);
      });
      if (weakest) {
        var tip = UI.el('div', { class: 'fb info', style: 'margin-top:12px' });
        tip.innerHTML = '<b>下一步：补「' + weakest.st.n + '」。</b>' + STEP_ADVICE[weakest.st.k] +
          '<div style="margin-top:6px"><a class="btn-mini" href="#/guided">做 1 题五步引导 →</a> ' +
          '<a class="btn-mini" href="#/wrong">清错题 →</a></div>';
        stc.appendChild(tip);
      } else {
        stc.appendChild(UI.el('p', { class: 'tiny muted', style: 'margin-top:8px', text: '先各环节做 2–3 题，这里才有诊断价值。' }));
      }
      root.appendChild(stc);

      /* 概念 */
      var cc = UI.el('div', { class: 'card' });
      cc.appendChild(UI.el('h2', { text: '② 概念熟练度' }));
      var lv = s.concept.levels;
      var totalC = lv[0] + lv[1] + lv[2] + lv[3];
      cc.innerHTML += '<div class="rp-lv">' +
        '<div><b>' + lv[3] + '</b><span>掌握</span></div>' +
        '<div><b>' + lv[2] + '</b><span>熟悉</span></div>' +
        '<div><b>' + lv[1] + '</b><span>生疏</span></div>' +
        '<div><b>' + lv[0] + '</b><span>没练过</span></div>' +
        '</div>';
      var tagStats = conceptTagStats();
      var weakestTags = tagStats.slice(0, 3);
      if (weakestTags.length) {
        var tl = UI.el('div', { style: 'margin-top:10px' });
        tl.innerHTML = '<div class="tiny muted" style="margin-bottom:4px">正确率最低的考点（先练这几个）：</div>';
        weakestTags.forEach(function (t) {
          var d = UI.el('div', { style: 'display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0' });
          d.innerHTML = '<span style="flex:1">' + UI.escape(t.tag) + '</span>' +
            '<span class="bar" style="width:110px"><i style="width:' + Math.round(t.rate * 100) + '%"></i></span>' +
            '<span class="tiny muted" style="width:70px;text-align:right">' + U.fmtPct(t.rate) + '</span>';
          d.style.cursor = 'pointer';
          d.addEventListener('click', function () { PHYS.route.go('concept', { tag: t.tag }); });
          tl.appendChild(d);
        });
        cc.appendChild(tl);
      }
      cc.appendChild(UI.el('p', { class: 'tiny muted', style: 'margin-top:8px', html: '概念卡一共 ' + totalC + ' 张；每天 2 分钟就能推进一步。<a href="#/concept">去概念闪练 →</a>' }));
      root.appendChild(cc);

      /* 试卷 */
      var ec = UI.el('div', { class: 'card' });
      ec.appendChild(UI.el('h2', { text: '③ 试卷正确率' }));
      if (!s.exam.packs.length) {
        ec.appendChild(UI.el('p', { class: 'small muted', text: '还没有题包。' }));
      }
      s.exam.packs.forEach(function (p) {
        var rate = p.n ? p.ok / p.n : null;
        var d = UI.el('div', { class: 'rp-pack' });
        d.innerHTML = '<span style="flex:1;min-width:0">' + UI.escape(p.name) + '</span>' +
          '<span class="tiny muted">' + p.n + '/' + p.total + '</span>' +
          '<span class="bar" style="width:90px"><i style="width:' + Math.round((rate || 0) * 100) + '%"></i></span>' +
          '<span class="tiny" style="width:44px;text-align:right">' + (rate === null ? '—' : U.fmtPct(rate)) + '</span>';
        d.style.cursor = 'pointer';
        d.addEventListener('click', function () { PHYS.route.go('exam', { _arg: p.id }); });
        ec.appendChild(d);
      });
      root.appendChild(ec);

      /* 错题 */
      var wl = PHYS.progress.wrongList();
      var byKind = { guided: 0, exam: 0, concept: 0 };
      wl.forEach(function (w) { byKind[w.kind] = (byKind[w.kind] || 0) + 1; });
      var wc = UI.el('div', { class: 'card' });
      wc.innerHTML = '<div class="row"><h2 style="margin:0">④ 错题待清</h2><span class="spacer"></span>' +
        '<a class="btn-mini" href="#/wrong">去回炉 →</a></div>' +
        '<p class="small muted" style="margin-top:6px">五步断点 ' + byKind.guided + ' · 试卷错题 ' + byKind.exam + ' · 概念错卡 ' + byKind.concept + '</p>';
      root.appendChild(wc);

      /* 数据管理 */
      var dc = UI.el('div', { class: 'card' });
      dc.innerHTML = '<h2>⑤ 记录（换设备用）</h2><p class="small muted">记录保存在这台设备的浏览器里，清缓存会丢。可以导出备份，或换到另一台设备导入。</p>';
      var row = UI.el('div', { class: 'row', style: 'margin-top:10px' });
      var ex = UI.el('button', { class: 'btn', type: 'button', text: '导出记录（JSON）' });
      ex.addEventListener('click', function () {
        download('物理训练记录-' + U.today() + '.json', JSON.stringify(PHYS.store.all(), null, 1));
        UI.toast('已导出', 'ok');
      });
      row.appendChild(ex);
      var im = UI.el('label', { class: 'btn', style: 'cursor:pointer' });
      im.textContent = '导入记录';
      var file = UI.el('input', { type: 'file', accept: '.json', style: 'display:none' });
      file.addEventListener('change', function () {
        var f = file.files[0];
        if (!f) return;
        var fr = new FileReader();
        fr.onload = function () {
          try {
            PHYS.store.replaceAll(JSON.parse(fr.result));
            UI.toast('导入成功', 'ok');
            PHYS.route.reload();
          } catch (e) { UI.toast('导入失败：' + e.message, 'bad'); }
        };
        fr.readAsText(f);
      });
      im.appendChild(file);
      row.appendChild(im);
      var cl = UI.el('button', { class: 'btn-ghost', type: 'button', text: '清空所有记录' });
      cl.addEventListener('click', function () {
        UI.confirm('清空后所有进度、错题、报告数据都会消失（不可恢复）。确定？', '清空').then(function (ok) {
          if (!ok) return;
          PHYS.store.clear();
          UI.toast('已清空', 'ok');
          PHYS.route.reload();
        });
      });
      row.appendChild(cl);
      dc.appendChild(row);
      root.appendChild(dc);
      PHYS.shell.refreshChip();
    }
  });
})();


/* ===== 70-admin.js ===== */
/* =============================================================
   题库管理：看题包 / 导入题包（JSON）/ 导出全部 / 删除导入的题包
   规则：id 相同 = 覆盖；导入的题包存在 localStorage，优先于内置
   ============================================================= */
(function () {
  'use strict';
  var PHYS = window.PHYS, U = PHYS.util, UI = PHYS.ui;

  var TAGS = null;
  function tagSet() {
    if (TAGS) return TAGS;
    TAGS = {};
    /* 规范清单在这里只做兜底；真正的权威来源是已内置的题库与概念卡（build 已校验过），
       两处并起来，避免「清单没跟上数据」导致合法考点被判非法 */
    ['杠杆五要素', '杠杆平衡条件', '杠杆分类', '最小力', '杠杆动态平衡',
      '定滑轮与动滑轮', '滑轮组', '功', '功率', '机械效率', '测机械效率实验',
      '动能与势能', '机械能转化', '分子动理论', '扩散现象', '分子间作用力',
      '内能', '改变内能的方式', '温度热量内能辨析', '比热容', '热量计算', '热值', '热机效率', '能量守恒',
      '电荷与摩擦起电', '电流与电路', '串并联电路', '电学实验', '实验探究'
    ].forEach(function (t) { TAGS[t] = 1; });
    var D = PHYS.DATA || {};
    (D.packs || []).forEach(function (p) {
      (p.questions || []).forEach(function (q) { (q.tags || []).forEach(function (t) { TAGS[t] = 1; }); });
    });
    (D.concepts || []).forEach(function (c) { (c.tags || []).forEach(function (t) { TAGS[t] = 1; }); });
    return TAGS;
  }

  function validate(obj) {
    var errs = [];
    var packs = obj && Array.isArray(obj.packs) ? obj.packs : (obj && obj.id ? [obj] : null);
    if (!packs) return { packs: null, errs: ['文件里没有 packs 数组（格式：{"version":2,"packs":[...]}）'] };
    packs.forEach(function (p, pi) {
      var at = '第 ' + (pi + 1) + ' 个题包';
      if (!p.id) errs.push(at + '：缺少 id');
      if (!p.name) errs.push(at + '：缺少 name');
      if (!Array.isArray(p.questions) || !p.questions.length) errs.push(at + '：questions 不能为空');
      else p.questions.forEach(function (q, qi) {
        var w = at + ' 第 ' + (qi + 1) + ' 题' + (q.no ? '（卷面第 ' + q.no + ' 题）' : '');
        if (!q.id) errs.push(w + '：缺少 id');
        if (!q.no) errs.push(w + '：缺少 no');
        if (!q.group) errs.push(w + '：缺少 group');
        if (['choice', 'fill', 'solve', 'selfcheck'].indexOf(q.type) < 0) errs.push(w + '：type 非法');
        if (['model', 'cond', 'rule', 'calc', 'check'].indexOf(q.focus) < 0) errs.push(w + '：focus 非法');
        if (!q.askImg) errs.push(w + '：缺少 askImg（原题图路径）');
        if (!Array.isArray(q.tags) || !q.tags.length) errs.push(w + '：tags 不能为空');
        else q.tags.forEach(function (t) { if (!tagSet()[t]) errs.push(w + '：考点不在规范清单 → ' + t); });
        if (q.type === 'choice') {
          if (!Array.isArray(q.opts) || q.opts.length < 2) errs.push(w + '：选择题需要 opts');
          if (!(Number.isInteger(q.ans) || Array.isArray(q.ans))) errs.push(w + '：ans 必须是选项下标');
        } else if (q.type !== 'selfcheck') {
          if (!Array.isArray(q.fields) || !q.fields.length) errs.push(w + '：填空/解答题需要 fields');
        }
      });
    });
    return { packs: errs.length ? null : packs, errs: errs };
  }

  UI.addCSS(
    '.ad-pack{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}' +
    '.ad-pack:last-child{border-bottom:0}' +
    '.ad-pack .nm{font-size:14px;font-weight:600}' +
    '.ad-pack .mt{font-size:12px;color:var(--muted)}' +
    '.ad-err{max-height:220px;overflow:auto;font-size:12.5px;line-height:1.7;color:#8d2a2a;background:var(--bad-bg);padding:10px 12px;border-radius:8px;margin-top:8px}'
  );

  PHYS.registry.register({
    id: 'admin', title: '题库管理', short: '题库', icon: '⊞', order: 40,
    desc: '看题包、导入新卷、导出备份',
    mount: function (root) {
      var importedIds = PHYS.store.get('importedPacks', []).map(function (p) { return p.id; });
      var packs = PHYS.DATA.packs || [];

      var head = UI.el('div', { class: 'card' });
      head.innerHTML = '<h2>题库管理</h2>' +
        '<p class="small muted">题包来自 <code>题库/pack-*.json</code>（构建时内联）。这里可以导入老师后来发的卷子，或导出给别人。</p>';
      root.appendChild(head);

      /* 列表 */
      var list = UI.el('div', { class: 'card' });
      list.innerHTML = '<h3>题包（' + packs.length + ' 套 / ' + packs.reduce(function (a, p) { return a + p.questions.length; }, 0) + ' 题）</h3>';
      packs.forEach(function (p) {
        var isImp = importedIds.indexOf(p.id) >= 0;
        var rec = PHYS.store.get('exam.' + p.id, {});
        var doneN = Object.keys(rec).length;
        var d = UI.el('div', { class: 'ad-pack' });
        d.innerHTML = '<div style="flex:1;min-width:0">' +
          '<div class="nm">' + UI.escape(p.name) + ' <span class="pill">' + (isImp ? '导入' : '内置') + '</span></div>' +
          '<div class="mt">' + UI.escape(p.id) + ' · ' + p.questions.length + ' 题 · 已做 ' + doneN +
          (p.source ? ' · ' + UI.escape(p.source) : '') + '</div></div>';
        var btns = UI.el('div', { class: 'row', style: 'gap:6px' });
        var go = UI.el('a', { class: 'btn-mini', href: '#/exam/' + encodeURIComponent(p.id), text: '去练' });
        btns.appendChild(go);
        if (isImp) {
          var del = UI.el('button', { class: 'btn-mini', type: 'button', text: '删除' });
          del.addEventListener('click', function () {
            UI.confirm('删除导入的题包「' + p.name + '」？（内置的不受影响）').then(function (ok) {
              if (!ok) return;
              var rest = PHYS.store.get('importedPacks', []).filter(function (x) { return x.id !== p.id; });
              PHYS.store.set('importedPacks', rest);
              PHYS.route.reload();
              UI.toast('已删除，刷新后生效', 'ok');
            });
          });
          btns.appendChild(del);
        }
        d.appendChild(btns);
        list.appendChild(d);
      });
      root.appendChild(list);

      /* 导入 */
      var imp = UI.el('div', { class: 'card' });
      imp.innerHTML = '<h3>导入题包</h3>' +
        '<p class="small muted">格式见 <code>源/SPEC.md</code> 第 2 节，或照 <code>题库/pack-模板.json</code> 改。' +
        '图片要放在 <code>图片/</code> 下，路径写相对路径（如 <code>图片/pk-w10/q01.png</code>）。</p>';
      var row = UI.el('div', { class: 'row', style: 'margin-top:10px' });
      var pick = UI.el('label', { class: 'btn', style: 'cursor:pointer', text: '选择 .json 文件' });
      var file = UI.el('input', { type: 'file', accept: '.json', style: 'display:none' });
      pick.appendChild(file);
      row.appendChild(pick);
      var ta = UI.el('textarea', { class: 'inp wide', style: 'height:120px;display:block;margin-top:10px;width:100%', placeholder: '也可以把 JSON 直接粘到这里' });
      imp.appendChild(row);
      imp.appendChild(ta);
      var go2 = UI.el('button', { class: 'btn btn-primary', type: 'button', style: 'margin-top:10px', text: '校验并导入' });
      imp.appendChild(go2);
      var msg = UI.el('div');
      imp.appendChild(msg);
      root.appendChild(imp);

      function doImport(text) {
        msg.innerHTML = '';
        var obj;
        try { obj = JSON.parse(text); } catch (e) {
          msg.innerHTML = '<div class="ad-err">JSON 解析失败：' + UI.escape(e.message) + '</div>';
          return;
        }
        var v = validate(obj);
        if (v.errs.length) {
          msg.innerHTML = '<div class="ad-err"><b>校验没通过（' + v.errs.length + ' 条），整包不导入：</b><br>' +
            v.errs.slice(0, 20).map(function (e) { return '· ' + UI.escape(e); }).join('<br>') +
            (v.errs.length > 20 ? '<br>…还有 ' + (v.errs.length - 20) + ' 条' : '') + '</div>';
          return;
        }
        var cur = PHYS.store.get('importedPacks', []);
        v.packs.forEach(function (p) {
          cur = cur.filter(function (x) { return x.id !== p.id; });
          cur.push(p);
        });
        PHYS.store.set('importedPacks', cur);
        msg.innerHTML = '<div class="fb ok"><b>导入成功。</b>共 ' + v.packs.length + ' 套题；刷新页面后可在「试卷练习」里看到。</div>';
        UI.toast('导入成功', 'ok');
        setTimeout(function () { location.reload(); }, 700);
      }

      file.addEventListener('change', function () {
        var f = file.files[0];
        if (!f) return;
        var fr = new FileReader();
        fr.onload = function () { doImport(fr.result); };
        fr.readAsText(f);
      });
      go2.addEventListener('click', function () {
        var t = ta.value.trim();
        if (!t) { UI.toast('先选文件或粘贴 JSON', 'bad'); return; }
        doImport(t);
      });

      /* 导出 */
      var exp = UI.el('div', { class: 'card' });
      exp.innerHTML = '<h3>导出</h3><p class="small muted">导出所有题包（内置 + 导入）为一个 JSON 文件，用于备份或分享。</p>';
      var exb = UI.el('button', { class: 'btn', type: 'button', style: 'margin-top:8px', text: '导出全部题包' });
      exb.addEventListener('click', function () {
        var blob = new Blob([JSON.stringify({ version: 2, packs: PHYS.DATA.packs }, null, 1)], { type: 'application/json;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '物理题包-' + U.today() + '.json';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      });
      exp.appendChild(exb);
      root.appendChild(exp);

      var foot = UI.el('div', { class: 'card' });
      foot.innerHTML = '<h3>加题工作流</h3><ol class="small" style="padding-left:20px;line-height:1.9">' +
        '<li>把新卷子（docx）放进 <code>题库/</code>，用 <code>物理/工具/extract.ps1</code> 裁出逐题图片到 <code>图片/</code>。</li>' +
        '<li>照 <code>题库/pack-模板.json</code> 写一个 <code>pack-新学期.json</code>（题干文本、选项、答案、解析、考点）。</li>' +
        '<li>回到这里「选择 .json 文件」→ 校验并导入；或直接重建页面（改的是内置题包时）。</li>' +
        '</ol>';
      root.appendChild(foot);
      PHYS.shell.refreshChip();
    }
  });
})();


/* ===== 90-app.js ===== */
/* =============================================================
   启动（Lead 维护）：注册路由壳、挂载、全局事件
   ============================================================= */
(function () {
  'use strict';
  var PHYS = window.PHYS;

  /* 导入的题包（localStorage）覆盖同 id 的内置题包 */
  try {
    var imported = PHYS.store.get('importedPacks', []) || [];
    if (imported.length) {
      imported.forEach(function (p) {
        if (!p || !p.id || !Array.isArray(p.questions)) return;
        var at = -1;
        PHYS.DATA.packs.forEach(function (x, i) { if (x.id === p.id) at = i; });
        if (at >= 0) PHYS.DATA.packs[at] = p; else PHYS.DATA.packs.push(p);
      });
    }
  } catch (e) { if (window.console) console.error('导入题包合并失败', e); }

  /* 未实现的模块先给占位，避免白屏 */
  var PLACEHOLDER = ['guided', 'concept', 'exam', 'wrong', 'report', 'admin'];
  PLACEHOLDER.forEach(function (id) {
    if (PHYS.registry.get(id)) return;
    PHYS.registry.register({
      id: id, title: id, short: id, order: 50,
      mount: function (root) {
        root.innerHTML = '<div class="card"><h2>这个模块还在装</h2>' +
          '<p class="small muted">（' + id + '）——页面结构已就位，内容稍后接入。</p></div>';
      }
    });
  });

  /* 若数据加载失败，给出明确提示而不是白屏 */
  window.addEventListener('error', function (e) {
    if (window.console) console.error('[物理脚手架]', e.message);
  });

  PHYS.boot();
})();

</script>
