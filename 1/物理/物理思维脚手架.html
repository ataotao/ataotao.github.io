    '.gd-bar .qno.on{background:var(--brand);border-color:var(--brand);color:#fff}' +
    '.gd-bar .qno.ok{border-color:#9dd3b4;background:var(--ok-bg);color:var(--ok)}' +
    '.gd-bar .qno.bad{border-color:#e5b3af;background:var(--bad-bg);color:var(--bad)}' +
    '.gd-q{position:relative}' +
    '.gd-q .qmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}' +
    '.gd-q .walk{position:absolute;right:12px;top:12px}' +
    '.gd-stemtext{margin-top:6px;font-size:14px;white-space:pre-wrap;line-height:1.9;color:var(--ink2)}' +
    '.gd-stemtext .toggle{font-size:12px;color:var(--brand);cursor:pointer;margin-left:4px}' +
    '.gd-multi-tip{font-size:12px;color:var(--muted);margin-bottom:8px}' +
    '.gd-done{text-align:left}' +
    '.gd-done .steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}' +
    '.gd-done .steps span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--ok-bg);color:var(--ok);font-weight:700}' +
    '.gd-done .steps span.no{background:var(--bad-bg);color:var(--bad)}' +
    '.gd-done .steps span.hint{background:var(--warn-bg);color:var(--warn)}' +
    '.gd-retry{font-size:12.5px;color:var(--brand);font-weight:700;margin-top:8px}' +
    '@media(max-width:640px){.gd-list{grid-template-columns:1fr}}'
  );

  /* ---------------- 状态 ---------------- */
  var S = null;   // 当前训练状态

  function resetState(g, pack, q) {
    S = {
      g: g, pack: pack, q: q,
      i: 0,
      first: [true, true, true, true, true],
      tries: [0, 0, 0, 0, 0],
      hint: [0, 0, 0, 0, 0],
      usedWalk: false,
      startedAt: Date.now(),
      done: false,
      finalOk: null,
      draft: [null, null, null, null, null]
    };
  }

  function guidedItems() { return PHYS.DATA.guided || []; }

  function statusOf(g) {
    var rec = PHYS.store.get('guided.' + g.questionId, null);
    if (!rec) return { k: 'idle', label: '还没走' };
    if (rec.usedWalk && !rec.ok) return { k: 'walk', label: '看过思路' };
    if (rec.ok) return { k: 'ok', label: '走通了' };
    return { k: 'bad', label: '有断点' };
  }

  /* ---------------- 列表页 ---------------- */
  function renderList(root) {
    var items = guidedItems();
    var done = items.filter(function (g) { return PHYS.store.get('guided.' + g.questionId, null); }).length;
    var okN = items.filter(function (g) { var r = PHYS.store.get('guided.' + g.questionId, null); return r && r.ok; }).length;

    var head = UI.el('div', { class: 'card' });
    head.innerHTML =
      '<div class="row"><div><h2>五步引导</h2>' +
      '<p class="small muted">一次只问一步，答错就指出断在哪一步。不用求快，<b>想清楚再点</b>。</p></div>' +
      '<span class="spacer"></span><div style="text-align:right"><b style="font-size:18px">' + okN + '</b>' +
      '<span class="muted small"> / ' + items.length + ' 走通</span></div></div>';
    var bar = UI.el('div', { class: 'bar', style: 'margin-top:10px' });
    bar.innerHTML = '<i style="width:' + Math.round(okN / (items.length || 1) * 100) + '%"></i>';
    head.appendChild(bar);
    head.appendChild(UI.el('p', { class: 'tiny muted', style: 'margin-top:6px', text: '共走完 ' + done + ' 题；只有「五步第一次全对且没看提示」才记为走通。' }));
    root.appendChild(head);

    if (!items.length) {
      root.innerHTML += '';
      root.appendChild(UI.el('div', { class: 'card empty', text: '五步母题还没装上（数据在 源/data/guided.json）。' }));
      return;
    }

    var groups = {};
    items.forEach(function (g) { (groups[g.topic] = groups[g.topic] || []).push(g); });
    Object.keys(groups).forEach(function (topic) {
      var sec = UI.el('div', { class: 'card' });
      sec.innerHTML = '<h3 style="margin-bottom:10px">' + UI.escape(topic) + '</h3>';
      var list = UI.el('div', { class: 'gd-list' });
      groups[topic].forEach(function (g) {
        var st = statusOf(g);
        var q = qIndex()[g.questionId];
        var tags = q && q.q.tags ? q.q.tags : [];
        var b = UI.el('button', { class: 'gd-item', type: 'button' });
        b.innerHTML = '<h4>' + UI.escape(g.title) + '</h4>' +
          '<span class="meta">' + UI.escape(tags.slice(0, 2).join(' · ')) + '</span>' +
          '<span class="st ' + st.k + '">' + (st.k === 'ok' ? '✓ ' : st.k === 'bad' ? '✗ ' : st.k === 'walk' ? '◎ ' : '') + st.label + '</span>';
        b.addEventListener('click', function () { PHYS.route.go('guided', { q: g.questionId }); });
        list.appendChild(b);
      });
      sec.appendChild(list);
      root.appendChild(sec);
    });

    var foot = UI.el('div', { class: 'card' });
    foot.innerHTML = '<p class="small muted">想先知道自己卡在哪一环？做完 3 题去<a href="#/report">训练报告</a>看五步命中率；概念卡在<a href="#/concept">概念闪练</a>。</p>';
    root.appendChild(foot);
  }

  /* ---------------- 训练页 ---------------- */
  function findGuided(qid) {
    var items = guidedItems();
    for (var i = 0; i < items.length; i++) if (items[i].questionId === qid) return items[i];
    return null;
  }

  function railEl() {
    var rail = UI.el('div', { class: 'rail' });
    FIVE.forEach(function (st, k) {
      var cls = 'n';
      if (S.done) cls += S.first[k] ? ' done' : ' err';
      else if (k < S.i) cls += S.first[k] ? ' done' : ' err';
      else if (k === S.i) cls += ' now';
      rail.appendChild(UI.el('div', { class: cls, html: '<b>' + (k + 1) + '</b><span>' + st.n + '</span>' }));
    });
    return rail;
  }

  function barEl(root) {
    var items = guidedItems();
    var idx = items.indexOf(S.g);
    var bar = UI.el('div', { class: 'gd-bar' });
    var prev = UI.el('button', { class: 'btn-mini', type: 'button', text: '← 上一题' });
    prev.disabled = idx <= 0;
    prev.addEventListener('click', function () { gotoItem(idx - 1); });
    bar.appendChild(prev);
    items.forEach(function (g, k) {
      var st = statusOf(g);
      var cls = 'qno' + (g === S.g ? ' on' : '') + (st.k === 'ok' ? ' ok' : st.k === 'bad' ? ' bad' : '');
      var b = UI.el('button', { class: cls, type: 'button', text: String(k + 1) });
      b.title = g.title;
      b.addEventListener('click', function () { if (g !== S.g) gotoItem(k); });
      bar.appendChild(b);
    });
    var next = UI.el('button', { class: 'btn-mini', type: 'button', text: '下一题 →' });
    next.disabled = idx >= items.length - 1;
    next.addEventListener('click', function () { gotoItem(idx + 1); });
    bar.appendChild(next);
    var back = UI.el('a', { class: 'btn-mini', href: '#/guided', style: 'margin-left:auto', text: '题目清单' });
    bar.appendChild(back);
    root.appendChild(bar);
  }

  function gotoItem(idx) {
    var items = guidedItems();
    if (idx < 0 || idx >= items.length) return;
    var target = items[idx];
    function jump() { PHYS.route.go('guided', { q: target.questionId }); }
    if (S && !S.done && (S.i > 0 || S.tries[0] > 0)) {
      UI.confirm('这题还没走完，换题会丢掉当前进度（已记录的成绩不受影响）。换吗？', '换题').then(function (ok) { if (ok) jump(); });
    } else jump();
  }

  function questionCard(root) {
    var q = S.q;
    var card = UI.el('div', { class: 'card gd-q' });
    var walkBtn = UI.el('button', { class: 'btn-mini walk', type: 'button', text: '看思路' });
    walkBtn.addEventListener('click', openWalk);
    card.appendChild(walkBtn);
    var meta = UI.el('div', { class: 'qmeta' });
    meta.innerHTML = '<span class="tag">第 ' + UI.escape(q.no) + ' 题</span>' +
      '<span class="tag-soft">' + UI.escape(q.group || '') + '</span>' +
      (q.tags || []).slice(0, 2).map(function (t) { return '<span class="tag-soft">' + UI.escape(t) + '</span>'; }).join('') +
      '<span class="tiny muted">' + (q.diff ? '难度 ' + '★'.repeat(q.diff) : '') + '</span>';
    card.appendChild(meta);
    card.appendChild(UI.imgs(q.askImg, '原题'));
    card.appendChild(UI.el('p', { class: 'tiny muted', style: 'margin:-4px 0 2px;text-align:center', text: '点图可放大 · 先自己读题，别急着往下点' }));
    if (q.ask) {
      var st = UI.el('div', { class: 'gd-stemtext' });
      st.style.display = 'none';
      st.innerHTML = UI.escape(q.ask);
      var tg = UI.el('span', { class: 'toggle', text: '显示文字版 ▾' });
      tg.addEventListener('click', function () {
        var show = st.style.display === 'none';
        st.style.display = show ? 'block' : 'none';
        tg.textContent = show ? '收起文字版 ▴' : '显示文字版 ▾';
      });
      card.appendChild(tg);
      card.appendChild(st);
    }
    root.appendChild(card);
  }

  function openWalk() {
    S.usedWalk = true;
    var g = S.g, q = S.q;
    var body = UI.el('div');
    var flow = (g.walk || []).map(function (t) { return '<li>' + UI.escape(t) + '</li>'; }).join('');
    body.innerHTML = '<p class="small muted" style="margin-bottom:8px">先自己走一遍再看，效果最好。看完这题会标记「看过思路」。</p>' +
      '<ol class="small" style="padding-left:20px;line-height:1.9">' + flow + '</ol>';
    if (g.calc && g.calc.length) {
      body.innerHTML += '<h4 class="tiny muted" style="margin:12px 0 4px">参考解答</h4><ol class="small" style="padding-left:20px;line-height:1.9">' +
        g.calc.map(function (t) { return '<li>' + UI.escape(t) + '</li>'; }).join('') + '</ol>';
    }
    if (q.ansImg) {
      var a = UI.el('div', { style: 'margin-top:10px' });
      a.innerHTML = '<div class="tiny muted" style="margin-bottom:4px">原卷参考答案：</div>';
      a.appendChild(UI.imgs(q.ansImg, '参考答案'));
      body.appendChild(a);
    }
    UI.modal({ title: '看思路：' + g.title, body: body, actions: [{ text: '回去自己做', kind: 'primary' }] });
  }

  /* ---------------- 步骤卡 ---------------- */
  function renderStep(root) {
    var st = FIVE[S.i], step = S.g.steps[S.i];
    var card = UI.el('div', { class: 'card' });
    var hd = UI.el('div', { class: 'step-hd' });
    hd.innerHTML = '<div class="stepbadge">' + (S.i + 1) + '</div>' +
      '<div><h2>' + st.n + '</h2><p>' + st.d + ' · ' + st.ask + '</p></div>';
    card.appendChild(hd);

    var askP = UI.el('div', { class: 'ask' });
    askP.innerHTML = '<em>' + UI.escape(step.q) + '</em>';
    card.appendChild(askP);
    if (step.type === 'multi') {
      card.appendChild(UI.el('div', { class: 'gd-multi-tip', text: '可以多选，选完点「确认」。' }));
    }

    var ctrl = null;
    if (step.type === 'choice' || step.type === 'multi') {
      var multi = step.type === 'multi';
      var sel = multi ? [] : null;
      var box = UI.el('div', { class: 'opts' });
      (step.opts || []).forEach(function (o, k) {
        var b = UI.el('button', { class: 'opt', type: 'button' });
        b.innerHTML = '<span class="k">' + String.fromCharCode(65 + k) + '</span><span>' + UI.escape(o) + '</span>';
        b.addEventListener('click', function () {
          if (multi) {
            var at = sel.indexOf(k);
            if (at >= 0) { sel.splice(at, 1); b.classList.remove('sel'); }
            else { sel.push(k); b.classList.add('sel'); }
          } else {
            sel = k;
            Array.prototype.forEach.call(box.children, function (c) { c.classList.remove('sel'); });
            b.classList.add('sel');
            setTimeout(function () { submit(); }, 120);
          }
        });
        box.appendChild(b);
      });
      card.appendChild(box);
      ctrl = { kind: 'opts', box: box, get: function () { return multi ? sel : sel; }, opts: step.opts, ans: step.ans, multi: multi };
    } else if (step.type === 'fields') {
      var fs = PHYS.ui.fields(step.fields, { onEnter: function () { submit(); } });
      card.appendChild(fs.el);
      ctrl = { kind: 'fields', fs: fs };
    }
    var fbbox = UI.el('div');
    card.appendChild(fbbox);
    card.appendChild(hintEl());

    var actRow = UI.el('div', { class: 'row', style: 'margin-top:14px' });
    var submitBtn = UI.el('button', { class: 'btn btn-primary', type: 'button', text: '确认这一步' });
    submitBtn.addEventListener('click', submit);
    actRow.appendChild(submitBtn);
    var skip = UI.el('button', { class: 'btn-ghost', type: 'button', text: '跳过这步' });
    skip.addEventListener('click', function () {
      UI.confirm('跳过的步骤不算对，报告里会记成断点。确定跳过？').then(function (ok) {
        if (!ok) return;
        S.first[S.i] = false; S.tries[S.i]++; recordStep(false);
        S.i++; S.done = S.i >= 5; rerender();
      });
    });
    actRow.appendChild(skip);
    card.appendChild(actRow);
    root.appendChild(card);

    function submit() {
      var ok = false, filled = true;
      if (ctrl.kind === 'opts') {
        var v = ctrl.get();
        if (ctrl.multi ? !v.length : v === null) { UI.toast('还没选', 'bad'); return; }
        ok = PHYS.judge.choice(v, ctrl.ans);
        filled = true;
      } else {
        var res = ctrl.fs.check();
        filled = res.every(function (r) { return r.filled; });
        if (!filled) { UI.toast('还有空没填', 'bad'); return; }
        ok = res.every(function (r) { return r.ok; });
        ctrl.fs.mark(res);
      }
      S.tries[S.i]++;
      var attempt = S.tries[S.i];
      if (attempt === 1) {
        S.first[S.i] = ok;
        recordStep(ok);
      }
      if (ok) {
        if (ctrl.kind === 'opts') markOpts(ctrl, true);
        fbbox.innerHTML = '';
        var good = UI.el('div', { class: 'fb ok' });
        good.innerHTML = '<b>对。</b>' + (step.why ? UI.escape(step.why) : '');
        fbbox.appendChild(good);
        submitBtn.disabled = true;
        var nx = UI.el('button', { class: 'btn btn-primary', type: 'button', text: S.i === 4 ? '走完这一步 →' : '下一步 →' });
        nx.addEventListener('click', function () {
          S.i++;
          if (S.i >= 5) { S.done = true; }
          rerender();
        });
        actRow.innerHTML = '';
        actRow.appendChild(nx);
        if (S.i === 4) actRow.firstChild.textContent = '看最后结果 →';
      } else {
        if (ctrl.kind === 'opts') markOpts(ctrl, false);
        fbbox.innerHTML = '';
        var bad = UI.el('div', { class: 'fb bad' });
        bad.innerHTML = '<b>断在第 ' + (S.i + 1) + ' 步：' + FIVE[S.i].n + '</b><br>' +
          (step.why ? UI.escape(step.why) : '再想一下这一步在问什么。');
        fbbox.appendChild(bad);
        var hintTip = UI.el('div', { class: 'gd-retry', text: '卡住了可以看提示，或再试一次。' });
        fbbox.appendChild(hintTip);
        if (S.hint[S.i] < 3) {
          var hb = UI.el('button', { class: 'btn-mini', type: 'button', text: '看提示 ' + (S.hint[S.i] + 1) + '/3' });
          hb.addEventListener('click', function () { S.hint[S.i]++; rerender(); });
          fbbox.appendChild(hb);
        }
        var again = UI.el('button', { class: 'btn-mini', type: 'button', style: 'margin-left:6px', text: '再试一次' });
        again.addEventListener('click', function () {
          fbbox.innerHTML = '';
          if (ctrl.kind === 'fields') ctrl.fs.reset();
          submitBtn.disabled = false;
          if (ctrl.kind === 'opts') {
            /* 彻底清空重选：内部 sel 与界面样式必须同时清。
               之前只清 ok/no/dim、不清内部 sel，多选时看起来全空、
               内部还留着旧选择，再点选项就变成"取消"，越点越乱。 */
            if (multi) sel.length = 0; else sel = null;
            Array.prototype.forEach.call(ctrl.box.children, function (c) {
              c.classList.remove('ok', 'no', 'dim', 'sel');
            });
          }
        });
        fbbox.appendChild(again);
      }
      if (S.hint[S.i] > 0) hintEl.refresh && hintEl.refresh();
    }
  }

  function markOpts(ctrl, ok) {
    var ansSet = Array.isArray(ctrl.ans) ? ctrl.ans : [ctrl.ans];
    var selSet = Array.isArray(ctrl.get()) ? ctrl.get() : [ctrl.get()];
    Array.prototype.forEach.call(ctrl.box.children, function (b, k) {
      b.classList.remove('sel', 'ok', 'no', 'dim');
      if (selSet.indexOf(k) >= 0) {
        if (ok) b.classList.add('ok'); else b.classList.add('no');
      } else if (ok && ansSet.indexOf(k) >= 0) {
        b.classList.add('ok');
      } else if (ok) {
        b.classList.add('dim');
      }
    });
  }

  function recordStep(ok) {
    PHYS.progress.stepAttempt({ focus: FIVE[S.i].k, ok: ok, usedHint: S.hint[S.i] > 0 });
    PHYS.shell.refreshChip();
  }

  var hintEl = function () {
    var wrap = UI.el('div', { class: 'hints' });
    function refresh() {
      wrap.innerHTML = '';
      var hs = (S.g.hints || {})[FIVE[S.i].k] || [];
      if (!hs.length) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'flex';
      for (var k = 0; k < Math.min(S.hint[S.i], hs.length); k++) {
        var d = UI.el('div', { class: 'hint on' });
        d.innerHTML = '<b>提示 ' + (k + 1) + '</b>' + UI.escape(hs[k]);
        wrap.appendChild(d);
      }
      if (S.hint[S.i] === 0) {
        var tip = UI.el('div', { class: 'hint', style: 'flex:1 1 100%;border-style:solid;background:#f7f6f2' });
        tip.innerHTML = '<b>卡住了？</b>先自己再想 20 秒，实在不行再点提示（一共三级，最后一级才说怎么做）。';
        wrap.appendChild(tip);
        var b = UI.el('button', { class: 'btn-mini', type: 'button', text: '看提示 1/3' });
        b.addEventListener('click', function () { S.hint[S.i] = Math.max(1, S.hint[S.i]); refresh(); });
        wrap.appendChild(b);
      }
    }
    refresh();
    wrap.refresh = refresh;
    return wrap;
  };

  /* ---------------- 落笔 + 结果 ---------------- */
  function renderDone(root) {
    var q = S.q, g = S.g;
    var card = UI.el('div', { class: 'card gd-done' });
    var allFirstOk = S.first.every(Boolean);
    card.innerHTML = '<h2>五步走完了</h2>' +
      '<p class="small muted">现在再落笔：在纸上把过程写一遍，然后对照答案。别回头改五步的答案。</p>';
    var steps = UI.el('div', { class: 'steps' });
    FIVE.forEach(function (st, k) {
      var s = UI.el('span', { class: S.first[k] ? '' : 'no', text: (k + 1) + ' ' + st.n + (S.first[k] ? ' ✓' : ' ✗') });
      steps.appendChild(s);
    });
    if (S.usedWalk) steps.appendChild(UI.el('span', { class: 'hint', text: '看过思路' }));
    card.appendChild(steps);

    var fb = UI.el('div');
    card.appendChild(fb);

    if (q.type !== 'selfcheck' && q.fields) {
      var form = PHYS.ui.fields(q.fields);
      fb.appendChild(UI.el('div', { class: 'tiny muted', style: 'margin-bottom:6px', text: '把最终答案填在这里（算自动判分，也帮你核对单位）：' }));
      fb.appendChild(form.el);
      var row = UI.el('div', { class: 'row', style: 'margin-top:10px' });
      var sub = UI.el('button', { class: 'btn btn-primary', type: 'button', text: '提交最终答案' });
      row.appendChild(sub);
      fb.appendChild(row);
      var out = UI.el('div');
      fb.appendChild(out);
      sub.addEventListener('click', function () {
        var res = form.check();
        if (!res.every(function (r) { return r.filled; })) { UI.toast('还有空没填', 'bad'); return; }
        form.mark(res);
        var ok = res.every(function (r) { return r.ok; });
        S.finalOk = ok;
        finish(ok, out);
        sub.disabled = true;
      });
    } else {
      var row2 = UI.el('div', { class: 'row', style: 'margin-top:10px' });
      var see = UI.el('button', { class: 'btn btn-primary', type: 'button', text: '看参考答案' });
      row2.appendChild(see);
      fb.appendChild(row2);
      var out2 = UI.el('div');
      fb.appendChild(out2);
      see.addEventListener('click', function () { S.finalOk = null; finish(null, out2); see.disabled = true; });
    }
    root.appendChild(card);
    root.appendChild(footBtns());
  }

  function finish(finalOk, out) {
    var q = S.q;
    if (q.ansImg) {
      out.appendChild(UI.el('div', { class: 'tiny muted', style: 'margin:10px 0 4px', text: '原卷参考答案：' }));
      out.appendChild(UI.imgs(q.ansImg, '参考答案'));
    }
    if (q.solution && q.solution.length) {
      var sol = UI.el('div', { class: 'sol' });
      sol.innerHTML = '<h4>解析</h4><ol>' + q.solution.map(function (t) { return '<li>' + UI.escape(t) + '</li>'; }).join('') + '</ol>' +
        (q.tip ? '<div class="tip">一句话关键：' + UI.escape(q.tip) + '</div>' : '');
      out.appendChild(sol);
    }
    if (S.finalOk === null && finalOk !== null) S.finalOk = finalOk;
    var okAll = S.first.every(Boolean) && !S.usedWalk && (finalOk !== false);
    PHYS.progress.guidedDone({
      qid: q.id,
      ok: okAll,
      steps: S.first.slice(),
      usedHint: S.hint.some(function (x) { return x > 0; }),
      usedWalk: S.usedWalk,
      ms: Date.now() - S.startedAt
    });
    PHYS.shell.refreshChip();
    var banner = UI.el('div', { class: 'fb ' + (okAll ? 'ok' : 'warn') });
    banner.innerHTML = okAll
      ? '<b>走通了。</b>五步第一次就全对，而且没看提示——这是真会。'
      : '<b>这次有断点。</b>' + (S.usedWalk ? '看过思路的题不算会，' : '') +
        '断点已记进报告，去错题回炉再走一遍。';
    out.insertBefore(banner, out.firstChild);
  }

  function footBtns() {
    var row = UI.el('div', { class: 'row', style: 'margin-bottom:16px' });
    var nx = UI.el('button', { class: 'btn btn-primary', type: 'button', text: '下一题 →' });
    nx.addEventListener('click', function () {
      var items = guidedItems(), idx = items.indexOf(S.g);
      if (idx < items.length - 1) gotoItem(idx + 1);
      else PHYS.route.go('guided');
    });
    row.appendChild(nx);
    var again = UI.el('button', { class: 'btn', type: 'button', text: '这题重走一遍' });

  var BY_ID = null;

    }
    return BY_ID[id] || null;
  }
  function recOf(id) { return PHYS.store.get('concept.' + id, null); }
  function lvOf(id) { return PHYS.progress.conceptLevel(id); }
  function isFresh(id) { var r = recOf(id); return !r || !r.n; }
  function isDue(id) {
    var r = recOf(id);
    return !!(r && r.n && r.due && r.due <= U.today());
  }
  function freshTotal() {
    var n = 0;
    allCards().forEach(function (c) { if (isFresh(c.id)) n++; });
    return n;
  }
  function dueTotal() {
    var n = 0;
    allCards().forEach(function (c) { if (isDue(c.id)) n++; });
    return n;
  }
  function levelCounts() {
    var a = [0, 0, 0, 0];

  }

      if (w.kind !== 'concept' || !w.cid) return;
      if (seen[w.cid] || !cardById(w.cid)) return;
      seen[w.cid] = 1;
      out.push(w.cid);

  }

  /* ---------------- 选题 ---------------- */
  /* 快练一轮：未练 > 到期 > 生疏 > 熟悉 > 掌握；各档内部打乱，凑满 20 张 */
  function pickQuick(n) {
    var buckets = [[], [], [], [], []];
    allCards().forEach(function (c) {
      var l = lvOf(c.id);
      if (isFresh(c.id)) buckets[0].push(c.id);
      else if (isDue(c.id)) buckets[1].push(c.id);
      else if (l <= 1) buckets[2].push(c.id);
      else if (l === 2) buckets[3].push(c.id);
      else buckets[4].push(c.id);
    });
    buckets[1].sort(function (a, b) {
      var ra = recOf(a) || {}, rb = recOf(b) || {};
      return String(ra.due || '').localeCompare(String(rb.due || ''));
    });
    var out = [], i, j, arr;
    for (i = 0; i < buckets.length && out.length < n; i++) {
      arr = i === 1 ? buckets[i] : U.shuffle(buckets[i]);
      for (j = 0; j < arr.length && out.length < n; j++) out.push(arr[j]);

  }
  function idsByTag(tag) {

    }).map(function (c) { return c.id; }));
  }
  /* ?topic=杠杆 按主题（10 个）练；?tag=杠杆五要素 按考点（25 个）练 */
  function idsByTopic(topic) {
    return U.shuffle(allCards().filter(function (c) {
      return c.topic === topic;
    }).map(function (c) { return c.id; }));
  }

  /* ---------------- 路由 / 会话 ---------------- */
  var S = null;
  var keyHandler = null;

  function hashFor(params) {
    var q = [];
    params = params || {};
    Object.keys(params).forEach(function (k) {
      var v = params[k];
      if (v === undefined || v === null || v === '') return;
      q.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));

  /* 页面切换：目标 hash 与当前一致时直接本地重绘，否则让 hashchange 触发整页重挂载 */
  function nav(params) {

  }

  function route() {

    if (p.tag) {
      startQuiz({ kind: 'tag', tag: p.tag, label: '考点 · ' + p.tag, back: { mode: 'tags' } });
      return;
    }
    if (p.topic) {
      /* 兼容 #/concept?topic=杠杆（主题）与 #/concept?topic=杠杆五要素（考点）两种写法 */
      if (TOPICS.indexOf(p.topic) >= 0) {
        startQuiz({ kind: 'topic', topic: p.topic, label: '主题 · ' + p.topic, back: { mode: 'list' } });
      } else {
        startQuiz({ kind: 'tag', tag: p.topic, label: '考点 · ' + p.topic, back: { mode: 'tags' } });
      }
      return;
    }
    if (p.mode === 'wrong') { startQuiz({ kind: 'wrong', label: '错卡重练', back: {} }); return; }
    if (p.mode === 'list') { S.page = 'list'; renderList(); return; }
    if (p.mode === 'tags') { S.page = 'tags'; renderTags(); return; }
    if (p.mode === 'topics') { S.page = 'topics'; renderTopics(); return; }
    if (p.card) {
      var c = cardById(p.card);
      if (c) { startQuiz({ kind: 'single', cid: c.id, label: '单张练习', back: { mode: 'list' } }); return; }
    }

  function resolveIds(o) {
    if (o.kind === 'quick') return pickQuick(QUICK_N);
    if (o.kind === 'tag') return idsByTag(o.tag);
    if (o.kind === 'topic') return idsByTopic(o.topic);
    if (o.kind === 'wrong') return wrongIds();

    if (o.kind === 'wrong' && ids.length > QUICK_N) ids = ids.slice(0, QUICK_N);

    S.quiz = {

  function answer(val) {
    var q = S && S.quiz;
    if (!q || q.locked) return;
    var card = cardById(q.ids[q.i]);
    if (!card) return;
    var ok = card.type === 'judge' ? (val === card.ans) : PHYS.judge.choice(val, card.ans);

    q.chosen = val;
    q.ok = ok;

      if (ok) q.replayOk[card.id] = true;
    } else {
      q.firstOk[card.id] = ok;
      if (!ok) q.wrongIds.push(card.id);
    }

    if (ok) {
      q.streak++;
      if (q.streak > q.best) q.best = q.streak;
    } else {
      q.streak = 0;

    if (!ok && !q.requeued[card.id]) {

      q.ids.push(card.id);
      q.replay[q.ids.length - 1] = true;

    }));

    [['全部卡片', cards.length], ['今天该复习', freshN + dueN], ['已掌握', lc[3]], ['错卡待重练', wrongN]]
      .forEach(function (it) {

      startQuiz({ kind: 'quick', label: '快练一轮', back: {} });
    }));
    acts.appendChild(bigBtn('按主题练', '', function () { nav({ mode: 'topics' }); }));
    acts.appendChild(bigBtn('按考点练', '', function () { nav({ mode: 'tags' }); }));
    var wb = bigBtn('错卡重练 · ' + wrongN, '', function () {
      startQuiz({ kind: 'wrong', label: '错卡重练', back: {} });
    });
    if (!wrongN) wb.disabled = true;
    acts.appendChild(wb);
    hero.appendChild(acts);
    hero.appendChild(UI.el('p', {
      class: 'tiny muted cd-note',
      text: '今天该复习 = 到期 ' + dueN + ' 张 + 还没练过 ' + freshN + ' 张。'
    }));
    root.appendChild(hero);

    var lvCard = UI.el('div', { class: 'card' });
    lvCard.appendChild(UI.el('h2', { text: '熟练度' }));
    var levels = UI.el('div', { class: 'cd-levels' });
    LEVELS.forEach(function (label, i) {
      var row = UI.el('div', { class: 'cd-lvrow' });
      row.appendChild(UI.el('span', { class: 'cd-lvpill ' + LEVEL_CLS[i], text: label + ' ' + lc[i] + ' 张' }));
      var bar = UI.el('div', { class: 'bar ' + (i === 3 ? 'ok' : i === 2 ? '' : 'warn') });
      bar.innerHTML = '<i style="width:' + Math.round(lc[i] / cards.length * 100) + '%"></i>';
      row.appendChild(bar);
      levels.appendChild(row);
    });
    lvCard.appendChild(levels);
    lvCard.appendChild(UI.el('p', {
      class: 'tiny muted', style: 'margin-top:8px',
      text: '规则：最近一次答对且正确率 ≥80% 记为「掌握」，正确率 ≥60% 记为「熟悉」，其余练过的记为「生疏」。'
    }));
    var lrow = UI.el('div', { class: 'row', style: 'margin-top:10px' });
    var lb = UI.el('button', { class: 'btn-mini', type: 'button', text: '看全部 ' + cards.length + ' 张卡片 →' });
    lb.addEventListener('click', function () { nav({ mode: 'list' }); });
    lrow.appendChild(lb);
    lvCard.appendChild(lrow);
    root.appendChild(lvCard);
    window.scrollTo(0, 0);
  }

  /* ---------------- 按考点练 / 按主题练 ---------------- */
  /* 展示顺序以 TAGS / TOPICS 为准；数据里出现清单外的考点/主题时追加在后面，
     避免「加了卡却看不到入口」（清单是本地常量，容易和数据脱节） */
  function tagOrder() {
    var out = TAGS.slice(), seen = {};
    out.forEach(function (t) { seen[t] = 1; });
    allCards().forEach(function (c) {
      (c.tags || []).forEach(function (t) { if (t && !seen[t]) { seen[t] = 1; out.push(t); } });
    });
    return out;
  }
  function topicOrder() {
    var out = TOPICS.slice(), seen = {};
    out.forEach(function (t) { seen[t] = 1; });
    allCards().forEach(function (c) { if (c.topic && !seen[c.topic]) { seen[c.topic] = 1; out.push(c.topic); } });
    return out;
  }
  function groupBtn(title, cards, onClick, extra) {
    var m = 0, pr = 0;
    cards.forEach(function (c) { var l = lvOf(c.id); if (l === 3) m++; if (l > 0) pr++; });
    var b = UI.el('button', { class: 'cd-tagbtn', type: 'button' });
    b.innerHTML = '<b>' + UI.escape(title) + '</b>' +
      '<span>' + m + ' / ' + cards.length + ' 张已掌握' +
        (pr > m ? '　·　已练 ' + pr : (pr ? '　·　全练过' : '')) + (extra || '') + '</span>' +
      '<div class="cd-mini"><i class="p" style="width:' + Math.round(pr / cards.length * 100) + '%"></i>' +
      '<i class="g" style="width:' + Math.round(m / cards.length * 100) + '%"></i></div>';
    b.addEventListener('click', onClick);
    return b;
  }
  function renderTags() {
    var root = S.root;
    root.innerHTML = '';
    root.appendChild(pageHead('按考点练', '点一个考点，只练这一类。「掌握 / 总张数」后面是已练张数；进度条浅色 = 已练，绿色 = 已掌握。', {}));
    var grid = UI.el('div', { class: 'cd-taggrid' });
    tagOrder().forEach(function (tag) {
      var cs = allCards().filter(function (c) { return c.tags && c.tags.indexOf(tag) >= 0; });
      if (!cs.length) return;
      grid.appendChild(groupBtn(tag, cs, function () { nav({ tag: tag }); }));
    });
    root.appendChild(grid);
    window.scrollTo(0, 0);
  }
  function renderTopics() {
    var root = S.root;
    var groups = [];
    topicOrder().forEach(function (topic) {
      var cs = allCards().filter(function (c) { return c.topic === topic; });
      if (cs.length) groups.push([topic, cs]);
    });
    root.innerHTML = '';
    root.appendChild(pageHead('按主题练', '一个主题 = 一类知识（杠杆 / 滑轮 / 电学 …）。点进去把这一主题的卡连着练完。',
      {}, UI.el('span', { class: 'tiny muted', text: '共 ' + groups.length + ' 个主题' })));
    var grid = UI.el('div', { class: 'cd-taggrid' });
    groups.forEach(function (g) {
      var cs = g[1];
      grid.appendChild(groupBtn(g[0], cs, function () { nav({ topic: g[0] }); }, ''));
    });
    root.appendChild(grid);
    window.scrollTo(0, 0);
  }

  /* ---------------- 全部卡片 ---------------- */
  function renderList() {
    var root = S.root;
    root.innerHTML = '';
    var tail = UI.el('span', { class: 'tiny muted', text: '共 ' + allCards().length + ' 张' });
    root.appendChild(pageHead('全部卡片', '点一张卡直接练这一张。等级：未练 / 生疏 / 熟悉 / 掌握。', {}, tail));
    var box = UI.el('div', { class: 'card cd-listcard' });
    var seen = {};
    TOPICS.forEach(function (topic) {
      var cs = allCards().filter(function (c) { return c.topic === topic; });
      if (!cs.length) return;
      seen[topic] = 1;
      var hrow = UI.el('div', { class: 'cd-listhdrow' });
      hrow.appendChild(UI.el('h3', { class: 'cd-listhd', text: topic + ' · ' + cs.length + ' 张' }));
      var tb = UI.el('button', { class: 'btn-mini', type: 'button', text: '练这一主题 →' });
      tb.addEventListener('click', function () { nav({ topic: topic }); });
      hrow.appendChild(tb);
      box.appendChild(hrow);
      cs.forEach(function (c) {
        var l = lvOf(c.id);
        var row = UI.el('button', { class: 'cd-listrow', type: 'button' });
        var q = UI.el('span', { class: 'cd-listq', text: c.q });
        var meta = UI.el('span', { class: 'cd-listmeta' });
        meta.appendChild(UI.el('span', { class: 'cd-lvpill ' + LEVEL_CLS[l], text: LEVELS[l] }));
        meta.appendChild(UI.el('span', { class: 'cd-listtags', text: (c.tags || []).join(' · ') }));
        row.appendChild(q);
        row.appendChild(meta);
        row.addEventListener('click', function () { nav({ card: c.id }); });
        box.appendChild(row);
      });
    });
    /* 兜底：topic 不在清单里的卡也列出来（正常数据不会出现） */
    var rest = allCards().filter(function (c) { return !seen[c.topic]; });
    if (rest.length) {
      box.appendChild(UI.el('h3', { class: 'cd-listhd', text: '其他 · ' + rest.length + ' 张' }));
      rest.forEach(function (c) {
        var l = lvOf(c.id);
        var row = UI.el('button', { class: 'cd-listrow', type: 'button' });
        row.appendChild(UI.el('span', { class: 'cd-listq', text: c.q }));
        row.appendChild(UI.el('span', { class: 'cd-lvpill ' + LEVEL_CLS[l], text: LEVELS[l] }));
        row.addEventListener('click', function () { nav({ card: c.id }); });
        box.appendChild(row);
      });
    }
    root.appendChild(box);
    window.scrollTo(0, 0);
  }

  /* ---------------- 做题 ---------------- */
  function renderQuiz() {
    var q = S && S.quiz;
    if (!q) { route(); return; }
    var root = S.root;
    root.innerHTML = '';
    if (q.i >= q.ids.length) { renderDone(); return; }
    var card = cardById(q.ids[q.i]);
    if (!card) { q.i++; renderQuiz(); return; }

    var wrap = UI.el('div', { class: 'cd-wrap' });
    var top = UI.el('div', { class: 'cd-top' });
    var back = UI.el('button', { class: 'btn-ghost cd-back', type: 'button', text: '← 退出' });
    back.addEventListener('click', function () { nav(q.options.back || {}); });
    top.appendChild(back);
    top.appendChild(UI.el('span', { class: 'cd-round', text: q.options.label || '概念闪练' }));
    top.appendChild(UI.el('span', { class: 'spacer' }));
    var streak = UI.el('span', { class: 'cd-streak' + (q.streak >= 3 ? ' hot' : '') });
    streak.innerHTML = '连对 <b>' + q.streak + '</b>';
    top.appendChild(streak);
    wrap.appendChild(top);

    var pbar = UI.el('div', { class: 'cd-pbar' });
    pbar.innerHTML = '<i style="width:' + Math.round((q.i + (q.locked ? 1 : 0)) / q.ids.length * 100) + '%"></i>';
    wrap.appendChild(pbar);
    wrap.appendChild(UI.el('div', {
      class: 'cd-counter',
      text: '第 ' + (q.i + 1) + ' / ' + q.ids.length + ' 张' + (q.replay[q.i] ? ' · 刚才答错的卡，再来一次' : '')
    }));

    var cardEl = UI.el('div', { class: 'card cd-card' + (q.replay[q.i] ? ' cd-replay' : '') });
    var meta = UI.el('div', { class: 'cd-meta' });
    meta.appendChild(UI.el('span', { class: 'tag', text: card.topic }));
    (card.tags || []).forEach(function (t) { meta.appendChild(UI.el('span', { class: 'tag-soft', text: t })); });
    meta.appendChild(UI.el('span', { class: 'tag-soft', text: card.type === 'judge' ? '判断' : '选择' }));
    meta.appendChild(UI.el('span', { class: 'tag-soft', text: '难度 ' + card.diff }));
    cardEl.appendChild(meta);
    cardEl.appendChild(UI.el('p', { class: 'cd-q', text: card.q }));
    cardEl.appendChild(card.type === 'judge' ? judgeArea(card, q) : choiceArea(card, q));
    if (q.locked) cardEl.appendChild(feedback(card, q));
    wrap.appendChild(cardEl);

    if (q.locked) {
      var next = UI.el('button', {
        class: 'btn btn-primary cd-big cd-next', type: 'button',
        text: q.i + 1 >= q.ids.length ? '看本轮结果 →' : '下一张 →'
      });
      next.addEventListener('click', nextCard);
      wrap.appendChild(next);
      wrap.appendChild(UI.el('p', { class: 'tiny muted cd-kbd', text: '回车 / 空格 → 下一张' }));
    } else {
      wrap.appendChild(UI.el('p', {
        class: 'tiny muted cd-kbd',
        text: card.type === 'judge' ? '键盘 1 选「对」、2 选「错」；也可以直接点按钮。' : '键盘 1–4 选答案；也可以直接点。'
      }));
    }
    root.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  function judgeArea(card, q) {
    var box = UI.el('div', { class: 'cd-judge' });
    [[true, '对', '✓'], [false, '错', '✗']].forEach(function (it) {
      var val = it[0], cls = 'cd-jbtn';
      if (q.locked) {
        if (val === card.ans) cls += ' ok';
        else if (val === q.chosen) cls += ' no';
        else cls += ' dim';
      }
      var b = UI.el('button', { class: cls, type: 'button' });
      b.innerHTML = '<i>' + it[2] + '</i><span>' + it[1] + '</span>';
      if (q.locked) b.disabled = true;
      else b.addEventListener('click', function () { answer(val); });
      box.appendChild(b);
    });
    return box;
  }

  function choiceArea(card, q) {
    var box = UI.el('div', { class: 'cd-opts' });
    (card.opts || []).forEach(function (opt, idx) {
      var cls = 'cd-opt';
      if (q.locked) {
        if (idx === card.ans) cls += ' ok';
        else if (idx === q.chosen && !q.ok) cls += ' no';
        else cls += ' dim';
      }
      var b = UI.el('button', { class: cls, type: 'button' });
      b.innerHTML = '<span class="k">' + (LETTERS[idx] || (idx + 1)) + '</span>' +
        '<span class="t">' + UI.escape(opt) + '</span>';
      if (q.locked) b.disabled = true;
      else b.addEventListener('click', function () { answer(idx); });
      box.appendChild(b);
    });
    return box;
  }

  function feedback(card, q) {
    var ansTxt = card.type === 'judge'
      ? (card.ans ? '对' : '错')
      : (LETTERS[card.ans] || '') + '．' + (card.opts[card.ans] || '');
    var fb = UI.el('div', { class: 'cd-fb ' + (q.ok ? 'ok' : 'bad') });
    fb.innerHTML = '<b>' + (q.ok ? '答对了' : '答错了') + '</b>' +
      '<span class="ans">正确答案：' + UI.escape(ansTxt) + '</span>';
    var why = UI.el('div', { class: 'cd-why' });
    why.innerHTML = '<b>为什么：</b>' + UI.escape(card.why);
    fb.appendChild(why);
    return fb;
  }

  /* ---------------- 本轮结束 ---------------- */
  function renderDone() {
    var q = S.quiz, root = S.root;
    root.innerHTML = '';
    var firstIds = q.ids.slice(0, q.totalFirst);
    var okN = 0;
    firstIds.forEach(function (id) { if (q.firstOk[id]) okN++; });
    var rate = firstIds.length ? okN / firstIds.length : 0;
    var replayN = Object.keys(q.replayOk).length;

    var cardEl = UI.el('div', { class: 'card cd-done' });
    cardEl.appendChild(UI.el('div', { class: 'row' }, [
      UI.el('span', { class: 'tag', text: '本轮结束' }),
      UI.el('span', { class: 'tag-soft', text: q.options.label || '概念闪练' })
    ]));
    var score = UI.el('div', { class: 'cd-score' });
    score.innerHTML = okN + '<span class="cd-score-sub">/ ' + firstIds.length + '</span>';
    cardEl.appendChild(score);
    var bar = UI.el('div', { class: 'bar ' + (rate >= 0.8 ? 'ok' : rate >= 0.5 ? 'warn' : 'bad'), style: 'margin:8px 0 4px' });
    bar.innerHTML = '<i style="width:' + Math.round(rate * 100) + '%"></i>';
    cardEl.appendChild(bar);
    var line = '正确率 ' + U.fmtPct(rate) + ' · 本轮最长连对 ' + q.best + ' 张';
    if (replayN) line += ' · 重现场次又对了 ' + replayN + ' 张';
    cardEl.appendChild(UI.el('p', { class: 'small muted', text: line }));

    if (q.wrongIds.length) {
      cardEl.appendChild(UI.el('hr', { class: 'sep' }));
      cardEl.appendChild(UI.el('h3', { text: '这几张没过（' + q.wrongIds.length + ' 张）' }));
      q.wrongIds.forEach(function (id) {
        var c = cardById(id);
        if (!c) return;
        var row = UI.el('div', { class: 'cd-wrongrow' });
        var m = UI.el('div', { class: 'cd-wrongmeta' });
        m.appendChild(UI.el('span', { class: 'tag', text: c.topic }));
        (c.tags || []).forEach(function (t) { m.appendChild(UI.el('span', { class: 'tag-soft', text: t })); });
        row.appendChild(UI.el('div', { class: 'cd-wrongq', text: c.q }));
        var why = UI.el('div', { class: 'cd-why' });
        why.innerHTML = '<b>为什么：</b>' + UI.escape(c.why);
        row.appendChild(why);
        row.appendChild(m);
        cardEl.appendChild(row);
      });
    } else {
      cardEl.appendChild(UI.el('p', { class: 'fb ok', style: 'margin-top:12px', text: '全对，这一轮的卡都答对了。可以再来一轮，或者去走五步引导。' }));
    }
    root.appendChild(cardEl);

    var acts = UI.el('div', { class: 'card' });
    var row = UI.el('div', { class: 'cd-actions' });
    row.appendChild(bigBtn('再来一轮', 'btn-primary', function () { startQuiz(q.options); }));
    if (q.wrongIds.length) {
      row.appendChild(bigBtn('只重练错的 · ' + q.wrongIds.length + ' 张', '', function () {
        startQuiz({ kind: 'custom', ids: q.wrongIds.slice(), label: '只重练错的', back: q.options.back });
      }));
    }
    if (PHYS.registry.get('guided')) {
      row.appendChild(bigBtn('去练五步引导', '', function () { PHYS.route.go('guided'); }));
    }
    row.appendChild(bigBtn('按考点练', '', function () { nav({ mode: 'tags' }); }));
    row.appendChild(bigBtn('返回首页', 'btn-ghost', function () { nav({}); }));
    acts.appendChild(row);
    if (q.options.kind === 'quick') {
      acts.appendChild(UI.el('p', {
        class: 'tiny muted', style: 'margin-top:8px',
        text: '再来一轮会优先挑没练过、到期和生疏的卡。'
      }));
    }
    root.appendChild(acts);
    window.scrollTo(0, 0);
  }

  /* ---------------- 键盘 ---------------- */
  function onKey(e) {
    if (!S || S.page !== 'quiz' || !S.quiz) return;
    var q = S.quiz;
    if (q.i >= q.ids.length) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (q.locked) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
        e.preventDefault();
        nextCard();
      }
      return;
    }
    var card = cardById(q.ids[q.i]);
    if (!card) return;
    if (card.type === 'judge') {
      if (e.key === '1' || e.key === 'ArrowLeft') { e.preventDefault(); answer(true); }
      else if (e.key === '2' || e.key === 'ArrowRight') { e.preventDefault(); answer(false); }
    } else {
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= (card.opts || []).length) { e.preventDefault(); answer(n - 1); return; }
      if (/^[a-dA-D]$/.test(e.key)) {
        var idx = 'abcd'.indexOf(e.key.toLowerCase());
        if (idx >= 0 && idx < (card.opts || []).length) { e.preventDefault(); answer(idx); }
      }
    }
  }

  /* ---------------- 注册 ---------------- */
  function mount(root, params) {
    S = { root: root, params: params || {}, quiz: null, page: 'home' };
    if (!keyHandler) {
      keyHandler = onKey;
      document.addEventListener('keydown', keyHandler);
    }
    route();
  }
  function unmount() {
    if (keyHandler) {
      document.removeEventListener('keydown', keyHandler);
      keyHandler = null;
    }
    S = null;
  }

  PHYS.registry.register({
    id: 'concept',
    title: '概念闪练',
    short: '概念',
    icon: '◈',
    order: 15,
    desc: '2 分钟一轮，把易混概念刷到「掌握」。答错立刻给一句话解释。',
    mount: mount,
    unmount: unmount
  });
})();

.ex-pick-th:hover{border-color:var(--brand)}

.ex-pick-th:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.ex-pick-row:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.ex-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ex-nav .btn{min-height:40px}
.ex-feedback{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.ex-feedback:empty{display:none;border-top:0;margin-top:0;padding-top:0}
.ex-answer{margin-top:10px}
.ex-ansline{margin-top:10px;gap:8px}
.ex-ansbtn{width:100%;min-height:42px;display:flex;align-items:center;justify-content:center;font-size:13.5px}
.ex-ansbtn.open{color:var(--brand-d);border-color:#cfe1ec;background:var(--brand-l)}
.ex-ansbox{margin-top:8px}
.ex-score{display:flex;align-items:baseline;gap:14px;margin-top:8px;flex-wrap:wrap}
.ex-mega{font-size:32px;font-weight:800;line-height:1.1;color:var(--brand-d);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.ex-wlist{margin-top:6px}
.ex-wrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.ex-wrow:last-child{border-bottom:0}
.ex-wcheck{display:flex;align-items:center;gap:5px;flex:0 0 auto;padding-top:2px;cursor:pointer}
.ex-wcheck input{width:17px;height:17px;accent-color:var(--brand)}
.ex-wmain{flex:1;min-width:0}
.ex-wtitle{font-size:14px;font-weight:600;line-height:1.5;word-break:break-word}
.ex-wright{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ex-wstats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ex-wstat{flex:1;min-width:88px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px 8px;text-align:center;min-height:58px;cursor:pointer}

.ex-wstat span{font-size:11.5px;color:var(--muted)}
.ex-wstat.on{border-color:var(--brand);background:var(--brand-l)}
.ex-wstat.on b{color:var(--brand-d)}
.ex-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ex-chip{font-size:12.5px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;min-height:40px}

.ex-opttext{flex:1;min-width:0}

.ex-key{margin-top:12px;border:1px solid #d7e5ef;border-left:4px solid var(--brand);border-radius:12px;

.ex-key-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

.ex-key-h span{font-size:11.5px;color:var(--muted)}
.ex-key-row{display:flex;gap:8px;align-items:flex-start;margin-top:9px}
.ex-key-lb{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--brand);

.ex-key-txt{font-size:14px;font-weight:700;line-height:1.6;color:var(--ink)}

.ex-imgs img{width:100%;max-width:880px}
/* ---------- 今晚急救标记：★ 重点题 ---------- */
.ex-nightlist{border:1px solid #eed9a8;background:#fffaf1}
.ex-nightlist .nl-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-nightlist .nl-h b{font-size:15px;color:#8a5309}
.ex-nightitem{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px dashed #eadfc6}
.ex-nightitem:first-of-type{border-top:0}
.ex-nightitem .nm{flex:0 0 auto;font-size:12px;font-weight:700;color:#8a5309;background:#fbeed2;border-radius:6px;padding:2px 8px;margin-top:2px;white-space:nowrap}
.ex-nightitem .mn{flex:1;min-width:0}
.ex-nightitem .mn b{display:block;font-size:14.5px;font-weight:600}
.ex-nightitem .mn span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.65}
.ex-night{border:1px solid #eed9a8;border-left:4px solid var(--warn);background:#fffaf1;

.ex-night .t{font-size:12.5px;font-weight:800;letter-spacing:.05em;color:#8a5309}
.ex-night .d{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.75}
.ex-night .go{margin-top:10px}
.ex-skip{border:1px dashed var(--line);background:#fbfaf7;border-radius:11px;padding:9px 13px;margin:-2px 0 12px;
  font-size:12.5px;color:var(--muted);line-height:1.7}
/* ---------- 宽屏（PC）：左边作答 / 右边考点 · 公式 · 解析 ---------- */
.app.ex-wide{max-width:1480px}
.ex-split{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.ex-right{min-width:0}
.ex-ph{font-size:13px;color:var(--muted);line-height:1.85}
.ex-ph b{color:var(--brand-d)}
@media (min-width:1080px){
  .ex-split{grid-template-columns:minmax(0,1fr) minmax(400px,500px);gap:22px;align-items:start}
  .ex-right{position:sticky;top:12px;max-height:calc(100vh - 28px);overflow-y:auto;overscroll-behavior:contain;
    background:#fcfbf8;border:1px solid var(--line);border-radius:12px;padding:14px 15px;scrollbar-width:thin}
  .ex-right::-webkit-scrollbar{width:8px}
  .ex-right::-webkit-scrollbar-thumb{background:#ded8cc;border-radius:99px}
  .ex-right .ex-feedback{margin-top:0;padding-top:0;border-top:0}
  .ex-right .ex-feedback > .fb:first-child{margin-top:0}
  .ex-imgs img{max-width:100%}
}
@media (max-width:640px){
  .ex-mega{font-size:27px}
  .ex-pick-row{grid-template-columns:34px minmax(0,1fr) 62px;gap:8px;padding:8px 9px}
  .ex-pick-th{width:62px;height:48px}
  .ex-wstat{min-width:0}
  .ex-wrow{flex-wrap:wrap}
  .ex-wright{flex-direction:row;align-items:center;width:100%;justify-content:flex-end}
  .ex-bar .ex-title{white-space:normal;overflow:visible}
}

  /* ---------------- 小工具 ---------------- */

  /* 累计做错 / 做对次数（老记录只有 ok+tries，兜底估一个起点） */
  function cumWrong(rec) {
