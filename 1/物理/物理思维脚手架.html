<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理思维脚手架 · 初三五步训练器</title>
<style>
/* =============================================================
   物理思维脚手架 · 全站样式（Lead 维护）
   模块自定义样式请用 PHYS.ui.addCSS() 注入，并加模块前缀类名
   ============================================================= */
:root{
  --ink:#1b2430; --ink2:#455261; --muted:#6b7684; --line:#e3ded4;
  --paper:#faf8f4; --card:#ffffff; --brand:#1f5f8b; --brand-d:#164a6d; --brand-l:#e6f0f7;
  --accent:#b06a1f; --warn:#b4690e; --warn-bg:#fdf3e3;
  --bad:#a32b2b; --bad-bg:#fbeceb; --ok:#1f7a4d; --ok-bg:#e9f6ee;
  --radius:14px;
  --sh:0 1px 2px rgba(27,36,48,.05),0 6px 20px -12px rgba(27,36,48,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.75;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.app{max-width:920px;margin:0 auto;padding:0 16px 72px}

/* ---------------- 顶栏 ---------------- */
.appbar{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font:700 20px/1 Georgia,serif}
.brand h1{font-size:17px;line-height:1.25;letter-spacing:.02em}
.brand p{font-size:12px;color:var(--muted);line-height:1.4}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--brand-l);color:var(--brand-d);white-space:nowrap}

#nav{display:flex;gap:6px;padding:10px 0 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#nav::-webkit-scrollbar{display:none}
.navlink{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid transparent;
  color:var(--muted);font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap;transition:.15s}
.navlink i{font-style:normal;font-size:15px}
.navlink:hover{background:#f1eee7;color:var(--ink)}
.navlink.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:var(--sh)}

/* 导航可横滑提示：右边还有内容时右缘渐隐，滚到最右自动消失（不添加任何可见控件）。
   class（.nav-ready / .can-scroll-left / .can-scroll-right）由 20-shell.js 按 scrollLeft 维护；
   滚到两端都没有遮罩时 = 没有未读内容，视觉上完全恢复原样。 */
#nav.can-scroll-right{
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
          mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
#nav.can-scroll-left{
  -webkit-mask-image:linear-gradient(to right,transparent,#000 26px);
          mask-image:linear-gradient(to right,transparent,#000 26px)}
#nav.can-scroll-left.can-scroll-right{
  -webkit-mask-image:linear-gradient(to right,transparent,#000 26px,#000 calc(100% - 26px),transparent);
          mask-image:linear-gradient(to right,transparent,#000 26px,#000 calc(100% - 26px),transparent)}

/* ---------------- 通用 ---------------- */
.screen{margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);padding:18px 20px;margin-bottom:14px}
.card h2{font-size:16.5px;margin-bottom:6px}
.card h3{font-size:15px}
.btn{padding:9px 18px;border-radius:10px;background:#fff;border:1px solid var(--line);
  font-size:14px;font-weight:600;transition:.15s;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:#c9c2b4;background:#fdfcf9}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn-ghost{padding:7px 12px;border-radius:9px;font-size:13px;color:var(--muted);border:1px solid transparent;background:none}
.btn-ghost:hover{background:#efece4;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-mini{padding:5px 11px;font-size:12.5px;border-radius:8px;border:1px solid var(--line);background:#fff}
.btn-mini:hover{border-color:#c9c2b4}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--brand-d);
  background:var(--brand-l);padding:2px 9px;border-radius:6px;white-space:nowrap}
.tag-soft{display:inline-block;font-size:12px;color:var(--muted);background:#f2efe8;padding:2px 9px;border-radius:6px;white-space:nowrap}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-bad{background:var(--bad-bg);color:var(--bad)}
.tag-ok{background:var(--ok-bg);color:var(--ok)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.top{align-items:flex-start}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.spacer{flex:1}
hr.sep{border:0;border-top:1px dashed var(--line);margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;background:#f2efe8;color:var(--muted);white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:#eeeae2;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .4s}
.bar.ok>i{background:var(--ok)}
.bar.warn>i{background:var(--warn)}
.bar.bad>i{background:var(--bad)}

/* ---------------- 首页 ---------------- */
.hero{padding:24px 22px 20px;background:linear-gradient(180deg,#fff,#fbf9f5);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--sh)}
.hero h2{font-size:21px;line-height:1.45;letter-spacing:.01em}
.hero .why{margin-top:10px;font-size:14px;color:var(--muted);max-width:64ch}
.hero .why b{color:var(--ink)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 4px}
.flow div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center}
.flow b{display:block;font-size:11.5px;color:var(--brand);letter-spacing:.04em}
.flow span{font-size:13px;font-weight:600;display:block;margin-top:1px}
.flow i{display:block;font-size:11px;color:var(--muted);font-style:normal;line-height:1.4;margin-top:2px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mode{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;box-shadow:var(--sh);transition:.16s;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.mode:hover{border-color:var(--brand);transform:translateY(-1px)}
.mode.rec{border-color:var(--brand);background:linear-gradient(180deg,#f4fafd,#fff)}
.mode h3{font-size:15px;display:flex;align-items:center;gap:8px}
.mode p{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.mode .go{font-size:12.5px;color:var(--brand);font-weight:700;margin-top:auto;padding-top:9px;display:block}
.rec-box{margin-top:14px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid var(--line)}

/* ---------------- 五步导轨 ---------------- */
.rail{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.rail .n{flex:1;min-width:92px;padding:6px 9px;border-radius:9px;background:#fff;border:1px solid var(--line);
  font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.rail .n b{width:17px;height:17px;flex:0 0 17px;border-radius:50%;background:#eee9df;color:var(--muted);
  font-size:10.5px;display:grid;place-items:center;font-weight:700}
.rail .n.done{color:var(--ok);border-color:#cfe6d8;background:var(--ok-bg)}
.rail .n.done b{background:var(--ok);color:#fff}
.rail .n.now{border-color:var(--brand);color:var(--brand-d);background:var(--brand-l);font-weight:700}
.rail .n.now b{background:var(--brand);color:#fff}
.rail .n.err{border-color:#e5b3af;background:var(--bad-bg);color:var(--bad)}
.rail .n.err b{background:var(--bad);color:#fff}

/* ---------------- 题干 ---------------- */
.stem{font-size:15.5px;line-height:1.95;white-space:pre-wrap}
.stem b{color:var(--brand-d)}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.stepbadge{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px}
.step-hd{display:flex;gap:11px;align-items:flex-start}
.step-hd h2{font-size:16px}
.step-hd p{font-size:12.5px;color:var(--muted);margin-top:0}
.ask{font-size:15px;font-weight:600;margin:12px 0 10px;line-height:1.7}
.ask em{font-style:normal;color:var(--brand-d);background:linear-gradient(transparent 62%,#d6e8f3 62%)}

/* ---------------- 选项 ---------------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:10px 13px;border-radius:11px;
  border:1.5px solid var(--line);background:#fff;font-size:14.5px;line-height:1.65;transition:.13s;width:100%}
.opt:hover{border-color:#bfd0dc;background:#fcfdfd}
.opt .k{width:20px;height:20px;flex:0 0 20px;border-radius:6px;background:#f0ede6;color:var(--muted);
  font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.opt.sel{border-color:var(--brand);background:var(--brand-l)}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.ok{border-color:#9dd3b4;background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:#e5b3af;background:var(--bad-bg)}
.opt.no .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.opt .why{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:400}

/* ---------------- 图片 ---------------- */
.imgwrap{margin:8px 0;text-align:center}
.imgwrap img{max-width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.imglist .imgwrap{margin:6px 0}
.imgfail{padding:10px;background:#fbf7f0;border:1px dashed var(--line);border-radius:8px}
.zoom-ov{position:fixed;inset:0;background:rgba(20,25,30,.92);z-index:200;display:grid;place-items:center;padding:16px;cursor:zoom-out}
.zoom-ov img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}

/* ---------------- 表单 ---------------- */
.fields{display:flex;flex-direction:column;gap:10px}
.field{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14.5px}
.field label{font-weight:600;min-width:70px}
.field .tpl{white-space:pre-wrap}
.inp{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:15px;width:140px;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.inp.wide{width:100%;max-width:360px}
.inp.ok{border-color:#9dd3b4;background:var(--ok-bg)}
.inp.no{border-color:#e5b3af;background:var(--bad-bg)}
.unit{font-size:13px;color:var(--muted)}
.hintline{font-size:12.5px;color:var(--warn);margin-top:5px}

/* ---------------- 反馈/解析 ---------------- */
.fb{margin-top:10px;padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.75}
.fb.ok{background:var(--ok-bg);border:1px solid #cfe6d8;color:#1c5f3c}
.fb.bad{background:var(--bad-bg);border:1px solid #eccfcd;color:#8d2a2a}
.fb.info{background:var(--brand-l);border:1px solid #cfe1ec;color:var(--brand-d)}
.fb.warn{background:var(--warn-bg);border:1px solid #f0dcc0;color:#8a5309}
.fb b{font-weight:700}
.sol{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.sol h4{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.sol ol,.sol ul{padding-left:20px;font-size:14px;line-height:1.85}
.sol li{margin:2px 0}
.sol .tip{margin-top:8px;padding:8px 11px;border-radius:8px;background:#fbf7ef;font-size:13px;color:#7a5a20}

/* ---------------- 三档提示 ---------------- */
.hints{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.hint{flex:1;min-width:120px;padding:9px 11px;border-radius:10px;border:1px dashed #d9d2c4;background:#fdfcf9;
  font-size:12.5px;color:var(--muted);text-align:left;line-height:1.6}
.hint:hover{border-color:var(--brand);color:var(--ink)}
.hint b{display:block;font-size:11px;color:var(--brand);letter-spacing:.05em}
.hint.on{border-style:solid;border-color:#d9c68b;background:#fdf8ea;color:#6b5220}

/* ---------------- 弹层 ---------------- */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(27,36,48,.94);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:300;opacity:1;transition:.25s;max-width:86vw}
.toast.out{opacity:0;transform:translate(-50%,8px)}
.toast.ok{background:#1f7a4d}.toast.bad{background:#a32b2b}
.modal-ov{position:fixed;inset:0;background:rgba(20,25,30,.5);z-index:250;display:grid;place-items:center;padding:18px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
.modal h3{font-size:16px;margin-bottom:8px}
.modal-body{color:var(--ink2)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ---------------- 小屏 ---------------- */
@media (max-width:640px){
  /* 手机端整体小一档：正文 16→15px、题干 15.5→14px，卡片/顶栏/导航一起收紧 */
  body{font-size:15px;line-height:1.68}
  .app{padding:0 12px 64px}
  .appbar{padding:13px 0 10px}
  .brand h1{font-size:16px}
  .brand p{font-size:11.5px}
  .logo{width:34px;height:34px;flex:0 0 34px;font-size:19px}
  #nav{gap:5px;padding-top:8px}
  /* 纯 CSS 兜底：窄屏一定放不下 7 项，JS 还没切 class 时也先给右缘渐隐（宁可多提示，不能没提示） */
  #nav:not(.nav-ready){
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
            mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
  .navlink{font-size:12.5px;padding:6px 10px}
  .navlink i{font-size:13px}
  .screen{margin-top:14px}
  .card{padding:13px 13px;margin-bottom:11px;border-radius:12px}
  .card h2{font-size:15.5px}
  .card h3{font-size:14px}
  .btn{padding:8px 14px;font-size:13px}
  .btn-mini{font-size:12px;padding:4px 9px}
  .hero{padding:18px 16px 16px}
  .hero h2{font-size:17px}
  .hero .why{font-size:13px}
  .flow{grid-template-columns:repeat(5,1fr);gap:5px}
  .flow span{font-size:11.5px}.flow i{display:none}
  .modes{grid-template-columns:1fr}
  .mode{padding:13px 14px}
  .mode h3{font-size:14.5px}
  .mode p{font-size:12px}
  .grid2{grid-template-columns:1fr}
  .rail .n{min-width:0;flex:1;justify-content:center;padding:5px 6px;font-size:11px}
  .rail .n span{display:none}
  .step-hd h2{font-size:15px}
  .step-hd p{font-size:11.5px}
  .stem{font-size:14px;line-height:1.8}
  .ask{font-size:14px}
  .opt{font-size:13.5px;padding:9px 12px}
  .opt .why{font-size:12.2px}
  .field{font-size:13.5px}
  .inp{width:110px;font-size:14px;padding:7px 10px}
  .fb{font-size:13px;padding:10px 12px}
  .sol ol,.sol ul{font-size:13px}
  .sol .tip{font-size:12.5px}
  .hint{min-width:100%;font-size:12px;padding:8px 10px}
  .small{font-size:12.5px}
  .tiny{font-size:11.5px}
  .tag,.tag-soft{font-size:11.5px}
  .kv{font-size:13px}
  .empty{font-size:13px;padding:22px 12px}
  .modal{padding:16px 16px}
  .modal h3{font-size:15px}
  .toast{font-size:12.5px}
}
@media print{
  #nav,.appbar,.btn,.hints{display:none!important}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  body{background:#fff}
}

</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="brand">
      <div class="logo">φ</div>
      <div>
        <h1>物理思维脚手架</h1>
        <p>读情境 → 圈条件 → 选规律 → 代数据 → 验结果</p>
      </div>
    </div>
    <div class="bar-right">
      <span class="chip" id="chip-day">今天还没练</span>
      <button class="btn-mini" id="btn-help" type="button">怎么用</button>
    </div>
  </header>
  <nav id="nav" aria-label="模式"></nav>
  <main id="screen" class="screen"></main>
  <footer class="small muted" style="margin-top:28px;padding-top:14px;border-top:1px solid var(--line);line-height:1.7">
    本工具只做一件事：把「想」和「算」分开，逼你走完五步再落笔。<br>
    题目和答案来自 <code>题库/</code> 里的周练原卷；图片在 <code>图片/</code> 文件夹，请和本网页放在一起。
  </footer>
</div>
<script>
window.PHYS_DATA = {"packs":[{"id":"pk-mid1-fix","name":"期中错题专项 · 变式重练（60 分）","source":"依 2026—2027 第一学期期中卷批改结果编写","exam":"只练这次错的 4 道选择 + 6 道大题 · 每题 5 分 · 共 60 分","topics":["杠杆","滑轮","机械效率","比热容与热值","热机与能量","电学"],"note":"按批改报告的三条断点编的变式题：A 组认模型（对应期中 2、8、9、16(1)）、B 组别把 m/Δt/h 搞混（对应 13、14、15）、C 组把步骤写全（对应 11、12、14、16(4)）。题干里的图都是重新画的，数字全换过，不能靠背原题答案。","questions":[{"id":"fixq01","no":"1","group":"填空","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q01.png","ask":"滑轮组一个定滑轮一个动滑轮，物体重 60N、动滑轮重 6N，不计绳重和摩擦。求绳端拉力、测力计示数、换 90N 物体后的拉力、绳端移动距离。","fields":[{"type":"num","label":"绳自由端的拉力 F","ans":33,"unit":"N","tol":0.01},{"type":"num","label":"测力计接在绳自由端时的示数","ans":33,"unit":"N","tol":0.01},{"type":"num","label":"换成 90N 物体后的拉力 F","ans":48,"unit":"N","tol":0.01},{"type":"num","label":"物体上升 0.3m 时绳端移动的距离","ans":0.6,"unit":"m","tol":0.001}],"ansText":"33N；33N；48N；0.6m","point":"先数承担物重的绳子段数 n，再写 F=(G+G动)/n；测力计量的永远是它自己受到的那段绳的张力","formulas":[{"f":"F = (G + G动) / n","m":"n 是吊着动滑轮的绳子段数，本题 n=2；绳重和摩擦不计"},{"f":"s = n·h","m":"绳端走的距离是物体上升高度的 n 倍"}],"solution":["对应期中第 2 题。你当时算了 18N，是把测力计当成了「要乘 n 的东西」——它量的是绳里的张力。","① 数 n：动滑轮由 2 段绳吊着 → n=2。","② F=(60+6)/2=33N。同一根绳上张力处处相等，所以测力计接自由端是 33N，接固定端也是 33N，都等于 F。","③ 换 90N：(90+6)/2=48N。","④ s=nh=2×0.3=0.6m。"],"tip":"测力计示数＝绳中张力＝F，不用再乘 n；只有「求拉力」时才除以 n。","focus":"model","tags":["滑轮组","定滑轮与动滑轮"],"diff":2},{"id":"fixq02","no":"2","group":"选择","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q02.png","ask":"两个带电小球原来相互吸引，接触后分开变成相互排斥且偏角变小。判断原来带什么电荷、接触后电荷量关系。","fields":[{"type":"choice","label":"原来两球带的电荷","options":["等量同种电荷","不等量同种电荷","等量异种电荷","不等量异种电荷"],"ans":3},{"type":"choice","label":"接触后再分开，两球的电荷量","options":["相等","不相等"],"ans":0}],"ansText":"D 不等量异种电荷；相等","point":"「接触后不再有力」＝接触后都不带电；「接触后相互排斥」＝接触后带同种电荷、电量相等","formulas":[],"solution":["对应期中第 8 题。你选了 C（等量异种），漏了「偏角变小」这个条件。","① 原来相互吸引 → 带异种电荷（也可能一个带电一个不带电，但两球都是带电小球，所以是异种）。","② 接触后再分开仍然相互排斥、没有中和成不带电，说明原来的电量不相等：中和后还剩下一部分，两球平分后带同种电荷。","③ 若原来等量异种，接触后正好中和，两球都不带电，就「不再有力的作用」了 —— 那是期中第 8 题的图。","④ 偏角变小：分开后每球电量比原来少，斥力变小，所以偏角比原来小。"],"tip":"接触后「没力」= 都不带电（原来等量异种）；接触后「还排斥」= 原来不等量异种。","focus":"model","tags":["电荷与摩擦起电"],"diff":2},{"id":"fixq03","no":"3","group":"填空","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q03.png","ask":"电源、开关、LED、小灯泡串联，闭合开关后 LED 发光，LED 符号旁标出“＋”极。判断电源 a 端极性、LED 中电流方向、正负极对调后的现象。","fields":[{"type":"choice","label":"电源的 a 端","options":["正极","负极"],"ans":0},{"type":"choice","label":"LED 中的电流方向","options":["从左到右","从右到左"],"ans":0},{"type":"choice","label":"把电源正负极对调后","options":["LED 不发光","L 不发光","都发光"],"ans":0}],"ansText":"正极；从左到右；LED 不发光","point":"LED 只允许电流从“＋”极流入；在串联电路里，电流从电源正极出发绕一圈回到负极","formulas":[],"solution":["对应期中第 9 题。你选 A 说「a 是负极」，正好反了。","① LED 符号上的“＋”在左边，说明电流必须从左边流进 LED → LED 里电流从左到右。","② 顺着电流走：a → 开关 → LED 左 → 右 → 灯 L → 回到 b。电流从 a 端流出，所以 a 是正极。","③ 正负极对调后，电流想从 LED 的“－”端流进去，LED 不导通，整条串联电路断路，灯 L 也不亮 —— 但直接原因是 LED 不发光。"],"tip":"先看 LED 的＋在哪边，定出电流方向，再顺着导线找回电源正极。","focus":"model","tags":["电流与电路","串并联电路"],"diff":2},{"id":"fixq04","no":"4","group":"选择","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q04.png","ask":"四个冲程示意图顺序打乱，判断图②是什么冲程、四冲程的正确顺序。","fields":[{"type":"choice","label":"图②表示的冲程","options":["吸气冲程","压缩冲程","做功冲程","排气冲程"],"ans":3},{"type":"choice","label":"一个工作循环的正确顺序","options":["①→②→③→④","④→①→③→②","④→③→①→②","③→①→②→④"],"ans":1}],"ansText":"排气冲程；④→①→③→②","point":"认冲程看三件事：哪个气门开着、活塞往哪走、有没有火花","formulas":[],"solution":["对应期中第 16(1) 题。你写 A③ B② C④，把②和③弄反了。","① 图①：两气门都关、活塞上行 → 压缩冲程。","② 图②：右边排气门打开、活塞上行、有气流排出 → 排气冲程。","③ 图③：两气门都关、有火花、活塞下行 → 做功冲程。","④ 图④：左边进气门打开、活塞下行、气体进入 → 吸气冲程。","⑤ 一个循环：吸气④ → 压缩① → 做功③ → 排气②。"],"tip":"先看气门：进气门开是吸气，排气门开是排气；两门都关时，有火花是做功、没火花是压缩。","focus":"model","tags":["内能","热机效率"],"diff":2},{"id":"fixq05","no":"5","group":"填空","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q05.png","ask":"炉子与木炭共 3kg，烧掉一部分后剩 2.6kg；锅里的水 4kg 从 20℃ 升到 80℃。求水吸热、烧掉的木炭质量、炭炉效率。","fields":[{"type":"num","label":"水吸收的热量 Q吸","ans":1008000,"unit":"J","tol":100},{"type":"num","label":"烧掉的木炭质量","ans":0.4,"unit":"kg","tol":0.001},{"type":"coef","label":"炭炉的效率","tpl":"η = {0}%","ans":[7.4],"tol":0.1}],"ansText":"1.008×10⁶ J；0.4kg；7.4%","point":"Q=cmΔt 里的 m 是「被加热的水」，不是炉子；烧掉的燃料要前后相减","formulas":[{"f":"Q吸 = cmΔt","m":"m 用水的 4kg，Δt=80−20=60℃"},{"f":"Q放 = mq","m":"这里的 m 是「烧掉的那部分」木炭：3−2.6=0.4kg"},{"f":"η = Q吸 / Q放","m":"分子是水吸收的，分母是燃料完全燃烧放出的"}],"solution":["对应期中第 13 题。你当时拿 3kg 去算水，还把 68℃ 当成了质量。","① 先写三个量：m水=4kg，Δt=80−20=60℃，m炭烧掉=3−2.6=0.4kg。","② Q吸=4.2×10³×4×60=1.008×10⁶ J。","③ Q放=3.4×10⁷×0.4=1.36×10⁷ J。","④ η=1.008×10⁶/1.36×10⁷≈7.4%。效率低是因为大量热散到空气里了。"],"tip":"落笔前先写一行：m=？Δt=？烧掉的燃料=？三个数各是谁，写清楚再代。","focus":"cond","tags":["热量计算","热值","比热容"],"diff":3},{"id":"fixq06","no":"6","group":"解答","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q06.png","ask":"用滑轮组把 45kg 的物体匀速提升 2m，绳端拉力 250N，不计绳重和摩擦。求 s、W有、W总、η。","fields":[{"type":"num","label":"绳端移动的距离 s","ans":4,"unit":"m","tol":0.01},{"type":"num","label":"有用功 W有","ans":900,"unit":"J","tol":1},{"type":"num","label":"总功 W总","ans":1000,"unit":"J","tol":1},{"type":"coef","label":"机械效率","tpl":"η = {0}%","ans":[90],"tol":0.1}],"ansText":"4m；900J；1000J；90%","point":"s=n·h、W有=Gh、W总=Fs、η=W有/W总——四个式子按顺序写，一个都别跳","formulas":[{"f":"s = n·h","m":"n=2，h 是物体上升的 2m，不是绳端距离"},{"f":"W有 = Gh","m":"G=mg=450N，h=2m"},{"f":"W总 = Fs","m":"F 是绳端拉力 250N，s 是绳端距离 4m"},{"f":"η = W有 / W总","m":"结果一定小于 100%"}],"solution":["对应期中第 14 题。你只写了 (1) 的 12m，后面三问空白——不是不会，是没往下写。","① s=nh=2×2=4m。（你写的 12m 是把「绳端距离」当成了「物体上升高度」）","② G=mg=45×10=450N，W有=Gh=450×2=900J。","③ W总=Fs=250×4=1000J。","④ η=900/1000=90%。"],"tip":"四个问就是四个式子，先把式子写上去再代数，写不全也有步骤分。","focus":"calc","tags":["滑轮组","机械效率","功"],"diff":2},{"id":"fixq07","no":"7","group":"解答","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q07.png","ask":"电加热器每秒放 70J，给 200g 液体加热 3min，升温 40℃。求吸收的热量、比热容、给 300g 加热升温 20℃ 需要的时间。","fields":[{"type":"num","label":"液体吸收的热量","ans":12600,"unit":"J","tol":1},{"type":"num","label":"液体的比热容","ans":1575,"unit":"J/(kg·℃)","tol":5},{"type":"num","label":"300g 液体升温 20℃ 需要的时间","ans":135,"unit":"s","tol":1}],"ansText":"12600J；1575J/(kg·℃)；135s","point":"热量用 Q=Pt 求（跟质量无关），比热容再用 c=Q/(mΔt) 反算，质量必须换成 kg","formulas":[{"f":"Q = Pt","m":"P=70J/s（每秒 70J），t=180s"},{"f":"c = Q / (mΔt)","m":"m 用 0.2kg，Δt=40℃"},{"f":"t = Q / P","m":"Q 用新的 cmΔt 算出来，再除以 70J/s"}],"solution":["对应期中第 15 题。你四个空全错，第一个空写成 2.52×10⁴，是把 70×360 算成了 6 分钟。","① Q=Pt=70×180=12600J（3min=180s，别用 360s）。","② c=Q/(mΔt)=12600/(0.2×40)=1575 J/(kg·℃)。","③ 300g 升温 20℃：Q=1575×0.3×20=9450J，t=9450/70=135s。"],"tip":"200g 要写成 0.2kg；时间 3min 要换成 180s。单位不换，答案必错。","focus":"calc","tags":["比热容","热量计算"],"diff":2},{"id":"fixq08","no":"8","group":"解答","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q08.png","ask":"起重机 10s 内把 200kg 货物匀速提升 3m，电动机总功率 1kW。求有用功、有用功的功率、机械效率、额外功。","fields":[{"type":"num","label":"有用功 W有","ans":6000,"unit":"J","tol":1},{"type":"num","label":"有用功的功率 P有","ans":600,"unit":"W","tol":1},{"type":"coef","label":"机械效率","tpl":"η = {0}%","ans":[60],"tol":0.1},{"type":"num","label":"额外功 W额","ans":4000,"unit":"J","tol":1}],"ansText":"6000J；600W；60%；4000J","point":"功率 P=W/t 只管「快慢」，效率 η=W有/W总 只管「比例」，两个不能混","formulas":[{"f":"W有 = Gh","m":"G=2000N，h=3m"},{"f":"P有 = W有 / t","m":"t=10s"},{"f":"W总 = P总·t","m":"1kW×10s=10000J"},{"f":"η = W有 / W总","m":"6000/10000"},{"f":"W额 = W总 − W有","m":"总功减有用功"}],"solution":["对应期中第 3 题（考的是功和效率的关系）与第 14 题（考的是功和功率）。","① G=mg=2000N，W有=2000×3=6000J。","② P有=6000/10=600W。","③ W总=P总t=1000×10=10000J，η=6000/10000=60%。","④ W额=10000−6000=4000J（克服吊钩、钢丝绳重和摩擦做的功）。"],"tip":"先算三个功（有用、总、额外），功率和效率自然就出来了；别把 P有 当成机械效率。","focus":"rule","tags":["功率","机械效率","功"],"diff":3},{"id":"fixq09","no":"9","group":"填空","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q09.png","ask":"L1 与 L2 并联，A1 测 L1 支路（0.3A），A2 测干路（0.8A）。求 L2 电流、L1 烧断后 L2 的亮度、此时 A2 示数。","fields":[{"type":"num","label":"通过 L2 的电流","ans":0.5,"unit":"A","tol":0.001},{"type":"choice","label":"L1 灯丝烧断后 L2 的亮度","options":["不变","变亮","变暗","熄灭"],"ans":0},{"type":"num","label":"L1 烧断后 A2 的示数","ans":0.5,"unit":"A","tol":0.001}],"ansText":"0.5A；不变；0.5A","point":"并联：干路电流等于各支路电流之和；一条支路断路，另一条支路照常工作","formulas":[{"f":"I = I₁ + I₂","m":"干路电流等于两支路之和"},{"f":"并联各支路互不影响","m":"一条断了，另一条的电流、亮度都不变"}],"solution":["对应期中第 12 题。你把并联画成了串联，所以后面几问都跟着错。","① I₂=I−I₁=0.8−0.3=0.5A。","② L₁ 烧断只是它那条支路断路；L₂ 两端电压没变，所以亮度不变。","③ 干路只剩 L₂，A₂ 的示数就是 I₂=0.5A。"],"tip":"看到「并联」先画两条支路，把表的位置标清楚：支路的表只量自己那条，干路的表量总和。","focus":"model","tags":["串并联电路","电流与电路"],"diff":2},{"id":"fixq10","no":"10","group":"解答","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q10.png","ask":"杠杆 OA=0.2m、OB=1.0m，B 点挂 60N 物体，在 A 点施力使杠杆水平平衡。求垂直施力时的 F、沿杆方向能否平衡、力臂变为 0.1m 时的 F。","fields":[{"type":"num","label":"在 A 点垂直杠杆施力时的 F","ans":300,"unit":"N","tol":0.5},{"type":"choice","label":"把力的方向改成沿杠杆方向，杠杆","options":["能","不能"],"ans":1},{"type":"num","label":"力臂变成 0.1m 时的 F","ans":600,"unit":"N","tol":0.5}],"ansText":"300N；不能；600N","point":"力臂是支点到力的作用线的垂线段；力沿杠杆方向时，力的作用线过支点，力臂为 0","formulas":[{"f":"F₁l₁ = F₂l₂","m":"l 是力臂，不是力到支点的距离"},{"f":"F = G·l_G / l_F","m":"阻力、阻力臂不变时，力臂越小越费力"}],"solution":["对应期中第 11(1) 题。你只画对了 l_A，第②问答了「等于」。","① F×0.2=60×1.0 → F=300N。","② 力沿杠杆方向时，力的作用线正好穿过支点 O，力臂为 0，F×0=0，无论多大的力都不能平衡 → 不能。","③ F×0.1=60×1.0 → F=600N。力臂减半，力就要加倍。"],"tip":"力臂永远从支点向「力的作用线」作垂线；作用线过支点，力臂就是 0。","focus":"cond","tags":["杠杆平衡条件","杠杆五要素"],"diff":2},{"id":"fixq11","no":"11","group":"解答","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q11.png","ask":"汽油机效率 30%，消耗 200g 汽油（q=4.6×10⁷ J/kg）。求放出的热量、有用功、功率 23kW 时的工作时间。","fields":[{"type":"num","label":"汽油完全燃烧放出的热量","ans":9200000,"unit":"J","tol":1000},{"type":"num","label":"汽油机对外做的有用功","ans":2760000,"unit":"J","tol":1000},{"type":"num","label":"输出功率 23kW 时的工作时间","ans":120,"unit":"s","tol":1}],"ansText":"9.2×10⁶ J；2.76×10⁶ J；120s","point":"效率的分子是「有用功」，分母是「燃料完全燃烧放出的热量」；时间再用 t=W/P","formulas":[{"f":"Q放 = mq","m":"m 用 0.2kg"},{"f":"W = ηQ放","m":"30%×Q放"},{"f":"t = W / P","m":"P 要换成 23000W"}],"solution":["对应期中第 16(4) 题。那两个空你是空白的。","① Q放=0.2×4.6×10⁷=9.2×10⁶ J。","② W=30%×9.2×10⁶=2.76×10⁶ J。","③ t=W/P=2.76×10⁶/23000=120s。"],"tip":"200g 先换 0.2kg；23kW 先换 23000W。单位不换，答案差 1000 倍。","focus":"calc","tags":["热值","热机效率"],"diff":2},{"id":"fixq12","no":"12","group":"实验","type":"fill","score":5,"askImg":"图片/pk-mid1-fix/q12.png","ask":"恒定功率加热器给 0.5kg 液体加热，温度随时间图像：0～5min 从 40℃ 升到 70℃，之后保持 70℃ 不变。每分钟供热 2100J。求前 5min 吸热、比热容、温度不变的原因。","fields":[{"type":"num","label":"前 5min 液体吸收的热量","ans":10500,"unit":"J","tol":1},{"type":"num","label":"液体的比热容","ans":420,"unit":"J/(kg·℃)","tol":2},{"type":"choice","label":"5min 后温度不再升高的原因","options":["液体不再吸热","液体沸腾时吸热但温度不变","加热器停止放热"],"ans":1}],"ansText":"10500J；420J/(kg·℃)；B","point":"温度-时间图：直线段的斜率表示升温快慢，图像水平段表示「吸热但温度不变」（沸腾）","formulas":[{"f":"Q = Pt","m":"每分钟 2100J，5min 就是 10500J"},{"f":"c = Q / (mΔt)","m":"Δt=70−40=30℃，m=0.5kg"},{"f":"Q = cmΔt","m":"温度不变时 Δt=0，但沸腾仍在吸热（汽化热）"}],"solution":["对应期中第 7 题和第 15 题。你当时把「吸热相同」推成了「温度升高越来越多」。","① Q=2100×5=10500J。","② Δt=70−40=30℃，c=10500/(0.5×30)=420 J/(kg·℃)。","③ 图像水平段：加热器还在供热，但液体已经沸腾，吸收的热量全部用来汽化，温度不再升高 → 选 B。","④ 这也说明：0～5min 是直线，每分钟升温相同 → 每分钟吸热相同，柱状图应该等高。"],"tip":"图像是直线 → 吸热均匀；图像水平 → 正在沸腾（吸热但温度不变），不是不吸热。","focus":"rule","tags":["比热容","热量计算"],"diff":3}]},{"id":"pk-mid1","name":"2026—2027 第一学期 · 初三物理期中（90 分）","source":"学习资料/题库/仓库内副本/物理/2026-2027学年第一学期期中考试","exam":"期中考试 · 8 页 · 90 分 · 60 分钟","topics":["分子与内能","比热容与热值","热机与能量","杠杆","滑轮","机械效率","电学"],"note":"原卷为手机拍照，裁图已做去底色处理，图上仍保留学生铅笔痕迹（非批改依据）。本卷无「参考答案」页，答案由卷面数据核算，并与答题卡上教师红笔订正逐题核对（15、16 题红笔数值与核算完全一致）。g 取 10 N/kg。","questions":[{"id":"mid1q01","score":3,"no":"1","group":"选择","type":"choice","askImg":"图片/pk-mid1/q01.png","ask":"下表中，能反映分子不停地做无规则运动的现象有（ ）①缓慢拉起下表面沾着水面的玻璃板，拉力需要大于玻璃板的重力；②抽去玻璃板后，密度比空气大的二氧化氮气体会进入上方空气中；③用力压紧接触面光洁的两块铅柱，两块铅柱能吸在一起；④原来分层清晰的水和硫酸铜溶液，放 10 天后界面变得模糊。","opts":["①②","③④","①③","②④"],"ans":3,"ansText":"D（②④）","solution":["①和③都是「拉得住、吸得牢」，说明分子之间有引力，不是分子在跑","②二氧化氮自己钻进上面的空气里、④两种液体自己混到一起，都是扩散","扩散才说明分子在不停地做无规则运动，所以选 ②④，D"],"tip":"扩散＝分子自己跑；拉玻璃板、压铅柱是分子引力，两回事。","point":"分子动理论：先分清「扩散（分子在动）」和「分子间引力（拉得住）」","formulas":[],"focus":"model","tags":["分子动理论","扩散现象"],"diff":2},{"id":"mid1q02","score":3,"no":"2","group":"选择","type":"choice","askImg":"图片/pk-mid1/q02.png","ask":"如图的滑轮组中，当拉力 F 匀速拉动细绳时，测力计的示数为 6N，忽略绳重和摩擦，则拉力 F 的大小为（ ）","opts":["3N","6N","12N","18N"],"ans":1,"ansText":"B（6N）","solution":["看图：绳子的固定端挂在弹簧测力计的挂钩上，测力计量的是绳中的张力","同一根绳、忽略绳重和摩擦，绳中张力处处相等","所以拉力 F 就等于测力计的示数 6 N，选 B"],"tip":"同一根绳张力处处相等，测力计量的就是 F，不是 F×n。","point":"滑轮组：先看绳的固定端挂在哪里，再判断张力是不是处处相等","formulas":[{"f":"F₁ = F₂","m":"同一根绳、忽略摩擦时，绳中各处张力相等"},{"f":"nF = G物 + G动","m":"n 是承担物重的绳子段数，这题 n=2"}],"focus":"model","tags":["滑轮组","定滑轮与动滑轮"],"diff":2},{"id":"mid1q03","score":3,"no":"3","group":"选择","type":"choice","askImg":"图片/pk-mid1/q03.png","ask":"利用某机械分别对外做功，其总功和机械效率如表格（第 1 次：W总 3000J，η 80%；第 2 次：W总 6000J，η 90%），则选项中的说法正确的是（ ）","opts":["机械两次做功过程的有用功相同","机械两次做功过程的额外功相同","第 1 次做功的功率一定比第 2 次大","第 1 次做功的功率一定比第 2 次小"],"ans":1,"ansText":"B","solution":["W有 = ηW总：第 1 次 0.8×3000 = 2400 J，第 2 次 0.9×6000 = 5400 J，有用功不同，A 错","W额 = W总 − W有：两次都是 600 J，正好相同，B 对","功率要 W/t，题目没给时间，C、D 都没法判断"],"tip":"表格题先把有用功、额外功两列算出来；没有时间就不能比功率。","point":"机械效率：把 W总 拆成 W有 + W额，再逐项对选项","formulas":[{"f":"W有 = ηW总","m":"给了总功和效率就直接乘"},{"f":"W额 = W总 − W有","m":"两次都是 600 J，是这题的破口"},{"f":"P = W/t","m":"没有时间算不出功率，别凭感觉比大小"}],"focus":"rule","tags":["机械效率","功","功率"],"diff":2},{"id":"mid1q04","score":3,"no":"4","group":"选择","type":"choice","askImg":"图片/pk-mid1/q04.png","ask":"如图甲，用温度传感器记录注射器内封闭一定质量空气的温度，通过推拉活塞改变空气温度，3 秒内封闭空气的温度与时间关系如图乙所示。忽略封闭空气与注射器的热传递和分子势能的变化，则说法正确的是（ ）","opts":["0~2 秒内，注射器活塞往内压缩空气","2~3 秒内注射器活塞往内压缩空气","0~3 秒内，注射器活塞运动方向不变","0~3 秒内，注射器活塞先往内压缩空气，再往外抽拉空气"],"ans":1,"ansText":"B","solution":["压缩气体→外界对气体做功→内能增加→温度升高；往外拉→气体对外做功→温度降低","乙图 0~2 s 温度一直在降，说明这 2 秒在往外拉（体积变大）","2~3 s 温度陡升，说明这 1 秒在往里压，选 B"],"tip":"忽略热传递时，温度升＝被压缩，温度降＝被拉伸。","point":"改变内能的方式：由温度升降反推是「外界做功」还是「气体对外做功」","formulas":[{"f":"压缩 → 内能增加 → 温度升高","m":"本题忽略热传递，温度变化只由做功引起"},{"f":"ΔU = W","m":"没有热交换时，内能变化就等于做功的多少"}],"focus":"model","tags":["内能","改变内能的方式"],"diff":3},{"id":"mid1q05","score":3,"no":"5","group":"选择","type":"choice","askImg":"图片/pk-mid1/q05.png","ask":"如图所示，我国某科研团队结合萤火虫的基因培育出一种会发光的植物。该植株白天与正常植物一样利用阳光、水及其它养分生长，晚上在没有光照时，会看到其能发出绿色的荧光。关于该发光植物的说法正确的是（ ）","opts":["该植株晚上发光时，不需要任何能量","该植株晚上发光时把光能转化为化 效率 η =","ans":21,"unit":"%","tol":0.8}],"ansText":"1.428×10⁶J；6.8×10⁶J；21%","solution":["（1）Q吸 = cmΔt = 4.2×10³ × 5 × (88−20) = 1.428×10⁶ J —— 质量用水的 5kg，不是炉子的 3kg","（2）烧掉的炭 = 3 − 2.8 = 0.2 kg，Q放 = qm = 3.4×10⁷ × 0.2 = 6.8×10⁶ J","（3）η = Q吸/Q放 = 1.428×10⁶ ÷ 6.8×10⁶ ≈ 21%"],"tip":"水是 5 kg、炭是 0.2 kg：两个质量别混，Δt 是 68℃。","point":"热量与热值：Q吸 = cmΔt 用水的质量；Q放 = qm 用「总质量 − 剩质量」","formulas":[{"f":"Q吸 = cmΔt","m":"m 是水的 5kg；Δt = 88−20 = 68℃"},{"f":"Q放 = qm","m":"m 是已燃烧的 0.2kg（3−2.8），不是 3kg"},{"f":"η = Q吸/Q放","m":"加热效率，结果换算成百分数"}],"focus":"calc","tags":["热量计算","热值","比热容"],"diff":2},{"id":"mid1q14","score":10,"no":"14","group":"解答","type":"solve","askImg":"图片/pk-mid1/q14.png","ask":"（10 分）利用图示的滑轮组把井底的土石提升到地面。土石质量为 30kg（袋的质量不计），李叔叔用 180N 的拉力水平匀速拉动绳子行走 12m 才把小桶拉上地面。求：（1）土石上升的距离；（2）滑轮组对土石做的有用功；（3）李叔叔做的总功；（4）滑轮组的机械效率（百分数，保留 1 位小数）。","fields":[{"type":"num","label":"（1）土石上升的距离 h =","ans":6,"unit":"m","tol":0.01},{"type":"num","label":"（2）有用功 W有 =","ans":1800,"unit":"J","tol":5},{"type":"num","label":"（3）总功 W总 =","ans":2160,"unit":"J","tol":5},{"type":"num","label":"（4）机械效率 η =","ans":83.3,"unit":"%","tol":0.15}],"ansText":"6m；1800J；2160J；83.3%","solution":["数一数：绳绕过定滑轮再绕过动滑轮，承担物重的是 2 段绳，n = 2","（1）h = s/n = 12/2 = 6 m —— 12m 是绳子走的距离，不是土石上升的高度","（2）G = mg = 30×10 = 300 N，W有 = Gh = 300×6 = 1800 J","（3）W总 = Fs = 180×12 = 2160 J","（4）η = W有/W总 = 1800/2160 ≈ 83.3%"],"tip":"先数 n 再算：h = s/n，别把绳端 12m 当成上升高度。","point":"滑轮组：先数 n，再用 h = s/n、W有 = Gh、W总 = Fs 顺着算","formulas":[{"f":"h = s/n","m":"绳端走 s，重物只升 s/n"},{"f":"W有 = Gh","m":"G = mg = 30×10 = 300N"},{"f":"W总 = Fs","m":"s 是绳端移动的距离 12m"},{"f":"η = W有/W总","m":"结果写成百分数，保留 1 位小数"}],"focus":"calc","tags":["滑轮组","机械效率","功"],"diff":2},{"id":"mid1q15","score":8,"no":"15","group":"实验","type":"solve","askImg":"图片/pk-mid1/q15.png","ask":"（8 分）某一规格相同的电加热器，每秒能释放 70J 的热量。用它分别给绝热杯中六杯初温 20℃ 的液体加热 180s，认为放出的热量全部被液体吸收。六杯液体的质量分别为 100、200、300、400、500、600g，末温分别为 80、60、40、35、32、30℃。求：（1）每杯液体吸收的热量；（2）①号液体的比热容；（3）编号为 ____ 的液体与其它五杯不是同种液体；（4）若使⑥号液体加热到末温 60℃，需要加热 ____ s。","fields":[{"type":"num","label":"（1）每杯吸收的热量 Q =","ans":12600,"unit":"J","tol":1},{"type":"num","label":"（2）①号液体的比热容 c =","ans":2100,"unit":"J/(kg·℃)","tol":1},{"type":"choice","label":"（3）不是同种液体的是","options":["①","②","③","④","⑤","⑥"],"ans":1},{"type":"num","label":"（4）⑥号加热到 60℃ 需要的时间 t =","ans":720,"unit":"s","tol":1}],"ansText":"12600J；2100J/(kg·℃)；②；720s","solution":["（1）同一个加热器、同样 180s：Q = Pt = 70×180 = 12600 J，六杯都一样","（2）①号：m = 0.1 kg，Δt = 80−20 = 60℃，c = Q/(mΔt) = 12600/(0.1×60) = 2100 J/(kg·℃)","（3）按 c = 2100 反算，②号（0.2kg，升 40℃）要 16800 J，与 12600 J 不符 → ② 是另一种液体","（4）⑥号 0.6kg 升 40℃：Q = 2100×0.6×40 = 50400 J，t = Q/P = 50400/70 = 720 s"],"tip":"同一加热器同一时间 → 每杯吸热都是 12600 J，先用 Q=Pt 定住它。","point":"比热容实验：Q = Pt 先定吸热量，再逐个代 c = Q/(mΔt) 找「不合群」的那杯","formulas":[{"f":"Q = Pt","m":"P 是每秒放热 70J，t = 180s"},{"f":"c = Q/(mΔt)","m":"m 要换成 kg；Δt 是末温减初温"},{"f":"t = Q/P","m":"求加热时间用这个"}],"focus":"calc","tags":["比热容","热量计算","实验探究"],"diff":3},{"id":"mid1q16","score":13,"no":"16","group":"实验","type":"solve","askImg":["图片/pk-mid1/q16_1.png","图片/pk-mid1/q16_2.png"],"ask":"（13 分）如图甲是某汽油机工作的四个冲程示意图。（1）图乙表示四个冲程的循环顺序，则 A、B、C 分别代表图甲各冲程的编号；（2）某两个连续的冲程 a、b，气缸内气体温度随时间变化的图象如图丙，则冲程 a 是 ____ 冲程，冲程 b 是 ____ 冲程；（3）A、B、C、D 四点中，气体分子运动变缓慢的是 ____ 段；气缸内气体内能由机械能转化而来的是 ____ 段；（4）汽油热值 q = 4.6×10⁷J/kg，一个做功冲程中汽油完全燃烧放出 2300J，则该汽油机吸气一次可吸入汽油质量 ____ kg；效率 35% 时一个工作循环对外输出的有用功 ____ J。","fields":[{"type":"choice","label":"（1）A 框","options":["②","③","④"],"ans":1},{"type":"choice","label":"（1）B 框","options":["②","③","④"],"ans":0},{"type":"choice","label":"（1）C 框","options":["②","③","④"],"ans":2},{"type":"choice","label":"（2）冲程 a","options":["吸气","压缩","做功","排气"],"ans":1},{"type":"choice","label":"（2）冲程 b","options":["吸气","压缩","做功","排气"],"ans":2},{"type":"choice","label":"（3）分子运动变缓慢的是","options":["AB","BC","CD"],"ans":2},{"type":"choice","label":"（3）机械能转化为内能的是","options":["AB","BC","CD"],"ans":0},{"type":"num","label":"（4）吸入汽油的质量 m =","ans":0.00005,"unit":"kg","tol":1e-7},{"type":"num","label":"（4）一个循环输出的有用功 W =","ans":805,"unit":"J","tol":2}],"ansText":"A③ B② C④；压缩、做功；CD、AB；5×10⁻⁵kg、805J","solution":["认冲程：①两气门都关、活塞在上止点 → 压缩；②排气门开 → 排气；③火花塞点火、活塞下行 → 做功；④进气门开、活塞下行 → 吸气","循环顺序是 吸气→压缩→做功→排气，图乙从①出发：①(压缩)→A=③(做功)→B=②(排气)→C=④(吸气)","（2）温度缓慢上升＝压缩；突然升到 2000℃ 再降下来＝点火做功，所以 a 是压缩、b 是做功","（3）温度降低→分子热运动变缓慢，是 CD 段；机械能转化为内能是压缩过程，即 AB 段","（4）m = Q/q = 2300 ÷ 4.6×10⁷ = 5×10⁻⁵ kg；W = ηQ = 35%×2300 = 805 J"],"tip":"认冲程只看三件事：气门开哪个、活塞往哪走、有没有点火。","point":"四冲程：用「气门 + 活塞方向 + 是否点火」三件事认冲程，再对应温度图","formulas":[{"f":"Q = qm","m":"m = Q/q，结果是 10⁻⁵ 量级"},{"f":"W = ηQ","m":"一个循环只做一次功，用一次燃烧放的热算"}],"focus":"model","tags":["内能","热值","能量守恒"],"diff":3}]},{"id":"pk-w1","name":"第1周 · 简单机械（杠杆与滑轮）","source":"题库/第1周.docx","exam":"第1周练习","topics":["杠杆","滑轮"],"note":"第8题是多项选择（答案表给 BC）；第16题的裁图上方同时带入了第15题的图（原卷两题的图排在一起），认准标注「第16题」的那幅；第14题第3空「不能」的理由在原卷答案里被误排在「15．」名下。","questions":[{"id":"w1q01","no":"1","group":"选择","type":"choice","askImg":"图片/pk-w1/q01.png","ask":"如图为《天工开物》中记载的六桨客船，船夫划桨时，桨受力如右图示。人划船时，船桨属于（　　）","opts":["省力杠杆","费力杠杆","等臂杠杆","不是杠杆"],"ans":1,"ansText":"B","solution":["先找支点：船桨绕着船边那个固定点转，那个点就是支点 O。","再看两个力：手在桨柄上用的力是动力，水对桨叶的力是阻力。","比力臂：支点到手的距离比支点到桨叶的距离短，动力臂短就是费力杠杆。","费力杠杆换来的是省距离——手划一小段，桨叶在水里扫过一大段。"],"tip":"力臂短的一边费力；船桨、筷子、镊子都是费力杠杆。","focus":"model","tags":["杠杆分类"],"point":"杠杆分类：先找支点，再比动力臂和阻力臂谁短","formulas":[{"f":"l₁ > l₂ 省力 · l₁ = l₂ 等臂 · l₁ < l₂ 费力","m":"船桨支点靠桨柄一端，动力臂短 → 费力省距离"}],"diff":1},{"id":"w1q02","no":"2","group":"选择","type":"choice","askImg":"图片/pk-w1/q02.png","ask":"水龙头手柄可视为如图所示的杠杆，O 为支点，F 为阻力，分别沿 a、b、c、d 方向关闭水龙头，其中最省力的是（　　）","opts":["a","b","c","d"],"ans":1,"ansText":"B","solution":["最省力就是动力臂最长，先别急着看箭头谁长谁短。","力臂是支点到力的作用线的垂线段，不是支点到作用点的距离。","把 a、b、c、d 四条作用线画出来，b 方向与手柄垂直，从 O 作垂线得到的垂线段最长。","所以沿 b 方向用力最省力。"],"tip":"力臂最长时最省力；垂直于手柄方向用力，力臂最长。","focus":"rule","tags":["最小力","杠杆五要素"],"point":"最小力：让力的方向垂直于杠杆，动力臂最长","formulas":[{"f":"F₁l₁ = F₂l₂","m":"阻力、阻力臂都不变时，l₁ 越大 F₁ 越小"},{"f":"l = 支点到力的作用线的垂线段","m":"力与杠杆垂直时力臂最大，沿 b 方向力臂最长"}],"diff":2},{"id":"w1q03","no":"3","group":"选择","type":"choice","askImg":"图片/pk-w1/q03.png","ask":"如图是一副称量准确的杆秤示意图，秤砣质量为 1kg，秤杆和秤盘总质量为 0.5kg，定盘星 b 到提纽 O 的距离 OB 为 2cm，秤盘到提纽 O 的距离 OA 为 10cm。若有人换了一个质量为 0.8kg 的秤砣，实际质量 3kg 的物品，让顾客误以为得到物品的质量是多少（　　）","opts":["3.6kg","3.8kg","3.75kg","3.96kg"],"ans":1,"ansText":"B","solution":["先把杆秤当杠杆：提纽 O 是支点，秤盘里的物品和秤砣分别是两个力。","定盘星是零刻度：1kg×2cm=2kg·cm，它反过来说明秤杆秤盘那部分要占掉 2kg·cm 的力矩。","实际 3kg 物品时，用 0.8kg 秤砣要满足 0.8×L=3×10+2，得 L=40cm 才平衡。","刻度是按 1kg 秤砣标的，所以在 40cm 处读出来 m=(1×40−2)/10=3.8kg，比实际 3kg 多，顾客就以为多得了。"],"tip":"刻度是按原秤砣标的；换砣后不能直接 3÷0.8，要先用定盘星把零刻度找回来。","focus":"calc","tags":["杠杆平衡条件"],"point":"杆秤换砣：定盘星给出杆的自重力矩，再用平衡条件反推读数","formulas":[{"f":"m砣g·L = m物g·OA + M零g","m":"提纽 O 为支点，M零 是定盘星标定出的杆盘自重项（本题 2 kg·cm）"},{"f":"m读 = (m砣·L − 2) ÷ OA","m":"刻度仍按 1 kg 秤砣刻的：m=(1×40−2)÷10=3.8 kg，不能直接 3÷0.8"}],"diff":3},{"id":"w1q04","no":"4","group":"选择","type":"choice","askImg":"图片/pk-w1/q04.png","ask":"如图是使用手机和自拍杆自拍时的示意图，此时自拍杆保持静止不动，自拍杆自身重量忽略不计，自拍杆可以看作是一个杠杆（O 为支点），手持自拍杆施加的力为 F₁，手机对杆竖直向下的作用力为 F₂，则（　　）","opts":["此时杠杆不是处于平衡状态","该杠杆属于省力杠杆","阻力臂为AB","F₁ = F₂·OB/OC"],"ans":3,"ansText":"D","solution":["先抓关键句：杆「保持静止」就是平衡状态，A 先排除。","F₂ 竖直向下，它的作用线是过 A 的竖直线，支点 O 到这条线的垂线段是 OB（不是 AB），C 错。","看图比力臂：动力臂 OC 比阻力臂 OB 短，动力臂短就是费力杠杆，B 错。","杠杆平衡 F₁·OC=F₂·OB，变形得 F₁=F₂·OB/OC，D 对。"],"tip":"阻力臂是 O 到 F₂ 作用线的垂线段 OB，不是 OA、也不是 AB。","focus":"model","tags":["杠杆五要素","杠杆分类"],"point":"力臂辨析：静止即平衡；力臂是 O 到作用线的垂线段（OB 不是 OA、AB）","formulas":[{"f":"F₁·OC = F₂·OB","m":"O 为支点，动力臂 OC、阻力臂 OB"},{"f":"F₁ = F₂·OB/OC","m":"OC < OB → F₁ > F₂，属费力杠杆"}],"diff":2},{"id":"w1q05","no":"5","group":"选择","type":"choice","askImg":"图片/pk-w1/q05.png","ask":"一根圆木放在水平地面上，粗略估计它的质量时，我们视其粗细相同、质量分布均匀，现抬起一端使它稍离地面需要 500N 的力，则圆木的质量大约为（g 取 10 N/kg）（　　）","opts":["50kg","100kg","250kg","1000N"],"ans":1,"ansText":"B","solution":["把「抬起一端」看成杠杆：没抬起来的那一端是支点，手抬的力是动力。","材质均匀→重心在圆木的中点，所以阻力臂是动力臂的一半。","杠杆平衡 F×2=G×1，得 G=2F=1000N。","再换成质量 m=G/g=1000N÷10N/kg=100kg；D 给的是力的单位，问的是质量，先排除。"],"tip":"重心在中间，抬起一端只要一半重力；问质量还要再除以 g。","focus":"model","tags":["杠杆平衡条件"],"point":"均匀棒重心在中点：抬起一端只需一半重力，问质量还要除以 g","formulas":[{"f":"F·2l = G·l → G = 2F","m":"支点在没抬起的一端，动力臂是阻力臂的 2 倍"},{"f":"m = G/g","m":"G=1000 N ÷ 10 N/kg = 100 kg；别把单位是 N 的选项当质量"}],"diff":2},{"id":"w1q06","no":"6","group":"选择","type":"choice","askImg":"图片/pk-w1/q06.png","ask":"如图所示的杠杆是平衡的，在此杠杆支点两侧的物体分别向外侧移动一格，以下说法正确的是（　　）","opts":["左端下沉","右端下沉","杠杆仍水平平衡","以上情况都有可能"],"ans":0,"ansText":"A","solution":["杠杆现在平衡，说明 G左·l左=G右·l右。","两边各向外移一格，两个力臂都加了相同的长度，但力矩增加量 G·d 不一样。","图里左边物体更重（力臂更短），所以左边增加的力矩多，左边力矩变大。","左边力矩大→左端下沉，选 A。"],"tip":"平衡的杠杆两边力臂同时变，比「谁的力矩增加得多」：重的一边赢。","focus":"rule","tags":["杠杆动态平衡"],"point":"平衡杠杆两侧同时外移：比力矩谁增加得多，不是比力臂长短","formulas":[{"f":"G左·l左 = G右·l右","m":"移动前先写出平衡式"},{"f":"ΔM = G·Δl","m":"两边 Δl 相同，G 大的一侧力矩增加得多 → 该端下沉"}],"diff":2},{"id":"w1q07","no":"7","group":"选择","type":"choice","askImg":"图片/pk-w1/q07.png","ask":"如图是一个杠杆式简易起吊机，它上面装了一个定滑轮，轻质杠杆 OBA 可绕 O 点转动，重物通过绳子对杠杆的拉力为阻力。下列判断正确的是（　　）","opts":["动力臂是l₁","阻力臂是l₃","使用定滑轮可以省力","起吊过程中拉力F越来越小"],"ans":3,"ansText":"D","solution":["先分清动力阻力：绳子对杠杆的拉力是动力，重物对杠杆的拉力是阻力。","力臂是支点到力的作用线的垂线段，对着图把每条 l 量的是哪条作用线一一核对，别按名字顺眼就选。","定滑轮只能改变力的方向、不省力，C 一定错。","起吊过程中杠杆在转动，动力的方向随绳子改变、动力臂变大，同样阻力矩下需要的拉力就越来越小，D 对。"],"tip":"定滑轮只改方向不省力；力臂要认「支点到作用线的垂线段」。","focus":"model","tags":["杠杆五要素","定滑轮与动滑轮","杠杆动态平衡"],"point":"定滑轮只改方向不省力；起吊中动力臂变化 → 所需拉力变小","formulas":[{"f":"F₁l₁ = F₂l₂","m":"阻力矩不变，l₁ 变大则 F₁ 变小"},{"f":"定滑轮：F = G，s = h","m":"只改变力的方向，既不省力也不费距离"}],"diff":3},{"id":"w1q08","no":"8","group":"选择","type":"choice","askImg":"图片/pk-w1/q08.png","ask":"如图所示，使用下列装置拉着同一重物，处于静止状态。若滑轮和杠杆的重力、摩擦及绳重均不计，下列机械工作时会费距离的是（　　）","opts":["（图）定滑轮","（图）动滑轮","（图）滑轮组（两个滑轮）","（图）杠杆"],"ans":[1,2],"ansText":"BC","solution":["省力和费距离是绑在一起的：数一数几段绳子吊着重物，绳端就要走几倍的距离（s=nh）。","A 定滑轮只有 1 段绳，s=h，不省力也不费距离。","B 动滑轮 2 段绳，F=G/2 但 s=2h，费距离；C 滑轮组也是 2 段绳吊着动滑轮，s=2h，同样费距离。","D 杠杆的动力臂比阻力臂短（费力杠杆），费力换省距离，不费距离。"],"tip":"先数承担重物的绳子段数 n；s=nh，n>1 就费距离。","focus":"model","tags":["定滑轮与动滑轮","滑轮组"],"point":"数承担重物的绳子段数 n：n>1 省力但按同样倍数费距离","formulas":[{"f":"s = nh","m":"n 为吊着动滑轮的绳子段数，动滑轮 n=2 → s=2h"},{"f":"F = G/n（不计滑轮重和摩擦）","m":"省力与费距离是同一件事的两面"}],"diff":2},{"id":"w1q09","no":"9","group":"选择","type":"choi ng","ansImg":"图片/pk-w1/q14-a.png","ask":"如图所示，A 点为硬棒的重心，O 为支点，硬棒水平静止，弹簧测力计的示数为________N。硬棒所受的重力为________N。能否用左图中的弹簧测力计按右图所示的方法测量同一硬棒所受的重力？请说明理由：________。","fields":[{"type":"num","label":"弹簧测力计的示数","ans":2.4,"unit":"N","tol":0.01},{"type":"num","label":"硬棒所受的重力","ans":7.2,"unit":"N","tol":0.01},{"type":"choice","label":"能否用右图方法测量这棒的重力","options":["能","不能"],"ans":1}],"ansText":"2.4N；7.2N；不能，硬棒重力 7.2N 大于弹簧测力计量程 5N","solution":["先读数：分度值 0.2N，指针在 2N 之后两小格，示数是 2.4N。","硬棒水平静止是杠杆平衡：F×0.6m=G×0.2m（O 到测力计 0.6m，O 到重心 A 0.2m）。","G=F×0.6/0.2=2.4N×3=7.2N。","右图是直接把整根棒挂在测力计下称，需要称 7.2N，而这块测力计量程只有 5N，会超量程，所以不能。"],"tip":"读完数一定要回头看看量程——7.2N 的药量程 5N 的秤一定不行。","focus":"calc","tags":["杠杆平衡条件","实验探究"],"point":"先读分度值，再用杠杆平衡求重力，最后核对量程","formulas":[{"f":"F₁l₁ = F₂l₂ → G = F×0.6/0.2 = 3F","m":"F=2.4 N → G=7.2 N"},{"f":"测量值 ≤ 量程","m":"7.2 N > 5 N，超出量程，不能用挂起来直接称的方法"}],"diff":3},{"id":"w1q15","no":"15","group":"解答","type":"selfcheck","selfCheck":true,"askImg":"图片/pk-w1/q15.png","ansImg":"图片/pk-w1/q15-a.png","ask":"杆 ABO 在拉力作用下保持水平静止（不计杆的自重），若把细线对杠杆的拉力视为阻力 F₂，细线对 B 点的拉力视为动力 F₁，请在图中画出杠杆 ABO 受到的阻力 F₂、动力 F₁ 以及动力臂 l₁ 及阻力臂 l₂ 的示意图。","solution":["先把两个力画对：动力 F₁ 作用在 B 点、沿绳子方向向上；阻力 F₂ 作用在 A 点、竖直向下，都从作用点起画带箭头的线段。","再画力臂：把 F₁ 的作用线延长，从支点 O 向这条作用线作垂线，垂线段才是 l₁ 而不是 OB 本身。","阻力臂 l₂ 同理：从 O 向 F₂ 的竖直作用线作垂线，垂线段就是 l₂。","画完检查三件事：力臂一定过支点、一定垂直于作用线、一定标了垂直符号。"],"tip":"力臂是「支点到作用线的垂线段」，不是支点到作用点的线段；别忘直角符号。","focus":"rule","tags":["杠杆五要素"],"point":"作图两件事：力画在作用点上，力臂画成支点到作用线的垂线段","formulas":[{"f":"力臂 l = 支点 O 到力的作用线的垂线段","m":"不是 O 到作用点 B 的连线；垂足处要标直角符号"}],"diff":3},{"id":"w1q16","no":"16","group":"解答","type":"solve","askImg":"图片/pk-w1/q16.png","ansImg":"图片/pk-w1/q16-a.png","ask":"如图所示，某质量可忽略不计的杠杆，在重物 M 和拉力 F₁ 的作用下在水平方向保持静止，其中 O 为杠杆支点，A 为 OB 中点，B 为杠杆右端点，F₁ 作用在 B 点，其与杠杆的夹角为 α。(1)画出上图中的①F₁ 力臂 l₁；②M 提供的拉力 F₂。(2)将 F₁ 视为动力、F₂ 视为阻力，当 α=30° 时，这是一个________（选填「省力」「等臂」或「费力」）杠杆；若要此杠杆最省力，则 α=________；当 α=210° 时，此杠杆________（选填「能」或「不能」）在水平方向保持静止。","stem":"看图：裁图右侧标注「第16题」的那幅图就是本题的图（左边第15题的内容可忽略）。","fields":[{"type":"choice","label":"当 α=30° 时的杠杆类型","options":["省力","等臂","费力"],"ans":1},{"type":"num","label":"最省力时的 α","ans":90,"unit":"°","tol":0.01},{"type":"choice","label":"α=210° 时能否水平静止","options":["能","不能"],"ans":1}],"ansText":"（2）等臂；90°；不能","solution":["设 OB=L。A 是 OB 中点，所以阻力臂 l₂=OA=L/2。","F₁ 斜着拉，动力臂 l₁=OB·sinα；α=30° 时 l₁=L·sin30°=L/2。","l₁=l₂ → 等臂杠杆；要最省力就要动力臂最大，即 F₁ 与杠杆垂直，α=90°。","α=210° 时 F₁ 的方向使杠杆顺时针转，和阻力 F₂ 的转动效果相同，两个力矩同向，不可能平衡，填「不能」。"],"tip":"斜着拉时力臂 l=L·sinα；α=90° 力臂最大、最省力。","focus":"rule","tags":["杠杆五要素","杠杆分类","最小力"],"point":"斜拉的力臂 l=L·sinα；力臂最大最省力；力矩同向则无法平衡","formulas":[{"f":"l₁ = OB·sinα","m":"α=30° 时 l₁=L/2，与 l₂=OA=L/2 相等 → 等臂杠杆"},{"f":"F₁l₁ = F₂l₂","m":"α=90° 时 l₁ 最大、F₁ 最小；α=210° 两力矩同向，不能平衡"}],"diff":3}]},{"id":"pk-w2","name":"第2周 · 杠杆与滑轮（含机械效率）","source":"题库/第2周.docx","exam":"第2周练习","topics":["杠杆","滑轮","机械效率","功和功率"],"note":"第6题的裁图同时带入了第5题的跷跷板图（原卷两题的图排在一起），认准标注「第6题」的甲、乙两图；第8题由图2读数：甲总功1200J、额外功800J（有用功400J），乙总功800J、额外功400J（有用功400J）；第5题选项A「球的质量约为200N」原卷就把质量和重力的单位混用了，照原卷。","questions":[{"id":"w2q01","no":"1","group":"选择","type":"choice","askImg":"图片/pk-w2/q01.png","ask":"不计质量的硬杆处于水平静止状态，AB=BC，在 B 点施加竖直向上的拉力 F，杆上挂了两个物体 M、H，M 重为 2N，则重 4N 的 H 挂在（　　）","opts":["A点左侧","C点右侧","A与B之间","B与C之间"],"ans":3,"ansText":"D","solution":["先看受力：杆是水平静止的，只受三个竖直力——F=6N 向上，M=2N 向下，H=4N 向下。","6N=2N+4N，力已经能平衡，说明 H 一定在 B 的右侧（否则力矩没法平衡）。","以 A 点为参照算力矩：F 在 B 处向上，力矩 6×AB；H 在 A 右侧 x 处向下，力矩 4×x。","4x=6×AB → x=1.5AB；又 AB=BC，所以 1.5AB 落在 B 与 C 之间，选 D。"],"tip":"三个力要同时满足「力平衡」和「力矩平衡」；挑 A 点当参照点最好算。","focus":"model","tags":["杠杆平衡条件"],"point":"三力平衡 + 力矩平衡同时用；对 A 点取矩最好算","formulas":[{"f":"F = G_M + G_H","m":"力平衡：6 N = 2 N + 4 N，说明 F 独自撑住两物"},{"f":"F·AB = G_H·x（对 A 取矩）","m":"4x=6AB → x=1.5AB，落在 B 与 C 之间"}],"diff":3},{"id":"w2q02","no":"2","group":"选择","type":"choice","askImg":"图片/pk-w2/q02.png","ask":"一根均匀铁丝 AB，在中点 O 用一细绳将它悬挂起来，铁丝保持水平方向平衡。如果将 OB 这一段弯折一下，使点 B 和点 O 重合，如图所示，则此时铁丝将（　　）","opts":["左端向下倾斜","右端向下倾斜","水平方向保持平衡","未知铁丝原长，无法判断"],"ans":0,"ansText":"A","solution":["原来在中点 O 悬挂能水平平衡，说明左半段和右半段质量相等，O 就是重心线所在处。","把 OB 段折回来与 O 重合，右半段的质量还在，但它的重心从 O 右侧搬到了 O 左侧（叠在左半段上）。","于是 O 左边变重、右边变轻，左边的力矩变大，左端向下倾斜。"],"tip":"形状一变重心就变；右半段折回来＝把它的重心搬到左边。","focus":"model","tags":["杠杆平衡条件","杠杆动态平衡"],"point":"形状一变重心就变：先把右半段的质量「搬」到 O 左侧再比力矩","formulas":[{"f":"原平衡：m左·l = m右·l","m":"在中点悬挂能水平 → 两半质量相等"},{"f":"M = G·l","m":"OB 段折回后重心移到 O 左侧，左力矩变大 → 左端下沉"}],"diff":2},{"id":"w2q03","no":"3","group":"选择","type":"choice","askImg":"图片/pk-w2/q03.png","ask":"如图：O 为支点，为使杠杆保持水平平衡，OB＜AB，可分别在 A 点沿不同方向施加作用力 F₁、F₂、F₃。这三个力的大小关系应是（　　）","opts":["F₁＜F₂＜F₃","F₁=F₂＜F₃","F₁＞F₂＞F₃","F₁=F₂=F₃"],"ans":0,"ansText":"A","solution":["同一个杠杆、同一个阻力，比较三个力就是比较三个力臂：力臂越长，用的力越小。","对着图逐个找力臂：F₃ 水平，作用线离支点 O 最近，力臂就是 OB；F₂ 竖直向下，力臂是 AB；F₁ 斜着，从 O 向它的作用线作垂线得到的线段最长（接近 OA）。","题目给了 OB＜AB，所以 l₃＜l₂＜l₁，反过来就是 F₁＜F₂＜F₃。"],"tip":"力臂是支点到作用线的垂线段；力与杠杆垂直时力臂才最大。","focus":"rule","tags":["最小力","杠杆五要素"],"point":"同一阻力下比力臂：力臂越长用的力越小","formulas":[{"f":"F = F₂l₂ / l₁","m":"由 F₁l₁=F₂l₂ 变形，F 与 l₁ 成反比"},{"f":"l₃ < l₂ < l₁","m":"OB<AB 且 F₁ 斜拉力臂最长 → F₁<F₂<F₃"}],"diff":2},{"id":"w2q04","no":"4","group":"选择","type":"choice","askImg":"图片/pk-w2/q04.png","ask":"小明在水平地面上做俯卧撑，当身体与地面平行时，可简化成如图所示的杠杆模型，他的重心在 A 点，地面对脚的力作用在 O 点，对手的力作用在 B 点，且都与身体垂直，小明的重力为 750N，OA 长为 1m，OB 长为 1.5m。则地面对小明手的作用力为（　　）","opts":["1125N","500N","250N","50N"],"ans":1,"ansText":"B","solution":["把人看成杠杆：脚尖 O 是支点，重力 750N 作用在重心 A，地面对两只手的作用力作用在 B。","两个力都垂直于身体，力臂就是 OA=1m 和 OB=1.5m。","杠杆平衡 F×1.5m=750N×1m，得 F=500N。","验一验：手离支点比重心更远，手撑的力应该小于体重，500N＜750N，合理。"],"tip":"俯卧撑是省力杠杆：手离支点越远，手撑的力越小。","focus":"model","tags":["杠杆平衡条件"],"point":"把人当杠杆：脚尖为支点，两个力都垂直于身体，力臂就是 OA、OB","formulas":[{"f":"F·OB = G·OA","m":"F=750 N×1 m÷1.5 m=500 N"},{"f":"OB > OA → F < G（省力）","m":"手离支点越远，手撑的力越小"}],"diff":2},{"id":"w2q05","no":"5","group":"选择","type":"choice","askImg":"图片/pk-w2/q05.png","ask":"600N 的人站在跷跷板某一位置时，跷跷板处于如图所示的平衡状态。忽略跷跷板自重和转动的摩擦，以下说法正确的是（　　）","opts":["球的质量约为200N","球的质量约为120 kg","使跷跷板平衡的力是球的压力和人的重力","当人往中点O走时，跷跷板右端下降"],"ans":3,"ansText":"D","solution":["跷跷板是杠杆：O 是支点，人的重力和球的重力是两个力。","先把单位看清楚：200N 是力，不是质量，A 项把质量写成牛就错了。","使杠杆平衡的不是「力」，而是力×力臂（两个力矩相等），C 项也错。","人往 O 走，人的力臂变小、力矩变小，球那边的力矩就占上风，右端下降，D 对。"],"tip":"质量用 kg、重力用 N；平衡看力矩（力×力臂），不看力大不大。","focus":"check","tags":["杠杆平衡条件","杠杆动态平衡"],"point":"质量用 kg、重力用 N；平衡看力矩；人往支点走力矩变小","formulas":[{"f":"G人·l人 = G球·l球","m":"平衡的条件是两个力矩相等，不是两个力相等"},{"f":"M = G·l","m":"人往 O 走 → l人 变小 → 左侧力矩变小 → 右端下降"}],"diff":2},{"id":"w2q06","no":"6","group":"选择","type":"choice","askImg":"图片/pk-w2/q06.png","ask":"用不可伸长的轻绳按图甲、乙两种方式将重为 10N 的物体匀速提升 10cm，下列说法正确的是（　　）","opts":["F甲一定为10N","F乙一定小于10N","甲绳子自由端移动10cm","甲绳子自由端移动的距离比乙大"],"ans":2,"ansText":"C","solution":["先认装置：甲是定滑轮，只改变力的方向，不省力也不费距离，所以绳端移动 s甲=h=10cm，C 对。","甲要「一定」等于 10N 还得保证滑轮没有摩擦，题目没这么说，A 项太绝对。","乙是动滑轮，绳端移动 s乙=2h=20cm，比甲远，D 项说反了。","乙的拉力 F=(G+G动)/2，题目没说不计动滑轮重，所以「一定小于10N」也不可靠，B 错。"],"tip":"定滑轮 s=h、动滑轮 s=2h；看到「一定」先想想有没有摩擦、滑轮重这些没交代的条件。","stem":"看图：裁图右上角标注「第 6 题」的甲、乙两幅小图就是本题的装置图（左边第5题的内容可忽略）。","focus":"cond","tags":["定滑轮与动滑轮"],"point":"定滑轮 s=h、动滑轮 s=2h；见到「一定」先查摩擦和滑轮重有没有交代","formulas":[{"f":"定滑轮：F = G，s = h","m":"s甲=10 cm，与提升高度相同"},{"f":"动滑轮：F = (G+G动)/2，s = 2h","m":"s乙=20 cm；没说不计 G动 就不能断言 F乙<10 N"}],"diff":2},{"id":"w2q07","no":"7","group":"选择","type":"choice","askImg":"图片/pk-w2/q07.png","ask":"已知被测物体的重力略超出弹簧测力计的量程，图中的方法中无法完成测量的是","opts":["（图）两个相同的弹簧测力计一起吊起物体","（图）动滑轮，动滑轮重力远小于物体","（图）杠杆，杠杆质量可以忽略不计","（图）两个弹簧测力计首尾串联吊物体"],"ans":3,"ansText":"D","solution":["思路：想办法让每个测力计承担的力变小，就能在量程内测出超重的物体。","A 两个测力计一起吊，各承担一半；B 动滑轮省一半力；C 杠杆把物体挂在靠近支点处、测力计挂在远端，靠力臂减小示数——三种都能测。","D 是两个测力计首尾串联，同一根绳上拉力处处相等，两个测力计都显示整个物重，还是超量程，所以无法测量。"],"tip":"串联的测力计不省力；要减小示数必须靠并联分担或省力机械。","focus":"model","tags":["定滑轮与动滑轮","杠杆平衡条件"],"point":"要减小测力计示数，只能分流承担或用省力机械；串联不行","formulas":[{"f":"两个测力计并联吊同一物体：每支承担 ≈ G/2","m":"分担后每个都在量程内"},{"f":"串联（首尾相接）：同一根绳 F 处处相等","m":"每个示数仍等于 G，照样超量程"}],"diff":2},{"id":"w2q08","no":"8","group":"选择","type":"choice","askImg":"图片/pk-w2/q08.png","ask":"如图1，用甲、乙两个滑轮组分别将物体 A、B 在相同时间内匀速提升相同高度，拉力分别为 F甲、F乙。此过程相关数据如图2所示。下列说法正确的是（　　）","opts":["F甲的功率等于F乙的功率","机械效率η甲＞η乙","物体质量m_A=m_B","两滑轮组绳子自由端移动的距离相等"],"ans":2,"ansText":"C","solution":["先读图2的柱状图：甲总功 1200J、额外功 800J；乙总功 800J、额外功 400J。","有用功=总功−额外功：甲 400J，乙 400J，两者相同。","W有=Gh，高度相同 → 两物体重力相同 → 质量 m_A=m_B，C 对。","再验其他项：η甲=400/1200≈33%＜η乙=400/800=50%，B 错；P=W总/t，甲总功大、时间相同 → 功率不等，A 错；绕法不同、n 不确定，D 不能成立。"],"tip":"先把「总功−额外功=有用功」算出来，再比效率和物重。","focus":"calc","tags":["机械效率","功率","滑轮组"],"point":"先算有用功（总功−额外功），再比效率和物重","formulas":[{"f":"W有 = W总 − W额","m":"甲 1200−800=400 J；乙 800−400=400 J，二者相同"},{"f":"η = W有/W总","m":"η甲≈33% < η乙=50%，所以 B 错"},{"f":"W有 = Gh，P = W总/t","m":"h、t 都相同 → G 相同 → m 相同；P 随 W总 变"}],"diff":3},{"id":"w2q09","no":"9","group":"选择","type":"choice","askImg":"图片/pk-w2/q09.png","ask":"如图，甲把重为 G 的物体从 A 点竖直向上匀速拉至 B 点，此过程绳的拉力为 F₁；乙用平行于斜面的力把同一物体沿斜面从 C 点匀速拉至与 B 等高的 D 点，此过程绳的拉力为 F₂，则斜面的机械效率为（　　）","opts":["100%","F₁/F₂","F₁h/(F₂s)","F₁s/(F₂h)"],"ans":2,"ansText":"C","solution":["有用功是克服重力做的功：W有=Gh；甲竖直匀速提升时 F₁=G，所以 W有=F₁·h。","总功是沿斜面拉力做的功：W总=F₂·s（s 是斜面长，不是高度 h）。","η=W有/W总=F₁h/(F₂s)，选 C。","验一验：斜面一定有额外功，效率不可能到 100%，A 先排除；把 h 和 s 写反就得到 D，那是最常见的错法。"],"tip":"η=W有/W总：分子用 Gh，分母用 F·斜面长，h 和 s 千万别放反。","focus":"rule","tags":["机械效率","功"],"point":"有用功是 Gh，总功是 F·斜面长；h 与 s 千万别放反","formulas":[{"f":"W有 = Gh = F₁h","m":"竖直匀速提升时 F₁=G"},{"f":"W总 = F₂s","m":"s 是沿斜面移动的距离，不是高度 h"},{"f":"η = W有/W总 = F₁h/(F₂s)","m":"写成 F₁s/(F₂h) 就是最常见的错法"}],"diff":2},{"id":"w2q10","no":"10","group":"选择","type":"choice","askImg":"图片/pk-w2/q10.png","ask":"如图1，分别用动滑轮和定滑轮拉动重力均为 G 的物体 M、N，在相同时间内使 M、N 沿水平面匀速直线移动了相同距离 s，两个滑轮做功情况如图2所示，则（　　）","opts":["定滑轮做的有用功为Gs","M、N受到的摩擦力大小相等","动滑轮的机械效率小于定滑轮","F动做功的功率大于F定做功的功率"],"ans":2,"ansText":"C","solution":["关键：物体沿水平面移动，重力竖直向下与运动方向垂直，重力不做功；有用功是克服摩擦做的功 f·s，所以 A 错。","读图2：动滑轮总功小、额外功占的比例大 → 效率低；定滑轮总额外功占比小 → 效率高，C 对。","有用功=总功−额外功：动滑轮的有用功小于定滑轮，位移 s 又相同 → f_M＜f_N，B 错。","功率 P=W总/t：动滑轮总功更小、时间相同 → P动＜P定，D 错。"],"tip":"水平拉物体时有用功是 f·s（不是 G·s）；先看有用功占总功的比例再比效率。","focus":"rule","tags":["机械效率","功率","定滑轮与动滑轮"],"point":"水平拉物体：重力不做功，有用功是克服摩擦的 f·s","formulas":[{"f":"W有 = fs","m":"不是 Gs：重力与位移垂直，不做功"},{"f":"η = W有/(W有+W额)","m":"看有用功占总功的比例，不看总功大小"},{"f":"P = W总/t","m":"t 相同，比总功即可比较功率"}],"diff":3},{"id":"w2q11","no":"11","group":"填空","type":"fill","askImg":"图片/pk-w2/q11.png","ansImg":"图片/pk-w2/q11-a.png","ask":"如图，甲、乙分别表示 A、B 两机械某次工作时的有用功 W有 和额外功 W额 的关系，则 A 的机械效率为 ηA=________；A、B 的机械效率大小关系为 ηA________ηB；总功的大小关系为 W_A________W_B（后面两空选填「<」「>」或「=」）。","fields":[{"type":"num","label":"A 的机械效率 ηA =","ans":25,"unit":"%","tol":0.5},{"type":"choice","label":"ηA 与 ηB 的关系","options":["<","=",">"],"ans":0},{"type":"choice","label":"W_A 与 W_B 的关系","options":["<","=",">"],"ans":1}],"ansText":"25%；ηA＜ηB；W_A=W_B","solution":["图甲：W有=6.0×10⁵J，W额=1.8×10⁶J，先求总功 W总=W有+W额=2.4×10⁶J。","ηA=W有/W总=6.0×10⁵÷2.4×10⁶=25%。","图乙：W有=1.6×10⁶J，W额=8.0×10⁵J，W总=2.4×10⁶J，ηB=1.6÷2.4≈67%，所以 ηA＜ηB。","两边总功都等于 2.4×10⁶J，所以 W_A=W_B。"],"tip":"机械效率=有用功÷总功；先加出总功，比效率其实就是比「有用功占总功的比例」。","focus":"calc","tags":["机械效率","功"],"point":"先加出总功，再算有用功占比；比效率就是比这个比例","formulas":[{"f":"W总 = W有 + W额","m":"A：6.0×10⁵+1.8×10⁶=2.4×10⁶ J"},{"f":"η = W有/W总","m":"ηA=25%，ηB≈67% → ηA<ηB；两边 W总 相等"}],"diff":2},{"id":"w2q12","no":"12","group":"填空","type":"fill","askImg":"图片/pk-w2/q12.png","ansImg":"图片/pk-w2/q12-a.png","ask":"2024 年 6 月 2 日，嫦娥六号探测器着陆月球背面，开启了世界首次月球背面「挖宝」之旅。图1 是探测车在采集月壤样本时的情景，机械臂可以简化为图2 中绕 O 点转动的杠杆，AB=3OA，不计机械臂自身重，当采集重为 0.16N 的月壤时：(1)在 A 点需要施加的拉力 F₁ 的大小至少为________N。(2)请在图2 中：①画出 B 点受到绳子的拉力 F₂；②画出拉力 F₂ 的力臂 L₂；此时杠杆 OAB 在 F₁、F₂ 的作用下处于静止状态，则杠杆 OAB 是________（选填「省力」或「费力」）杠杆，判断依据：________。","fields":[{"type":"num","label":"A 点需要施加的拉力 F₁ 至少为","ans":0.64,"unit":"N","tol":0.001},{"type":"choice","label":"杠杆 OAB 属于","options":["省力","费力"],"ans":1}],"ansText":"(1) 0.64N；(2) 作图（F₂ 竖直向下、L₂ 为 O 到 F₂ 作用线的垂线段）；费力，依据：F₁l₁=F₂l₂，l₁＜l₂，故 F₁＞F₂","solution":["图2 是杠杆：O 为支点，月壤重力 0.16N 作用在 B 点，拉力 F₁ 作用在 A 点；AB=3OA，所以 OB=OA+AB=4OA。","要求「至少」多大，就让 F₁ 垂直于机械臂，力臂最大 l₁=OA；阻力臂 l₂=OB。","杠杆平衡 F₁×OA=0.16N×4OA → F₁=0.64N。","比较力臂：l₁=OA＜l₂=OB，力臂小的一边费力，所以是费力杠杆（F₁＞F₂）。作图时 F₂ 从 B 点竖直向下画，L₂ 是 O 到 F₂ 作用线的垂线段。"],"tip":"「至少用多大拉力」= 让力的方向垂直于杠杆，力臂取最大；杠杆类型只看两个力臂谁长。","focus":"cond","tags":["杠杆平衡条件","杠杆分类"],"point":"「至少多大的力」= 力垂直于杠杆取最大力臂；杠杆类型只看两力臂长短","formulas":[{"f":"F₁·OA = G·OB","m":"AB=3OA → OB=4OA，F₁=0.16 N×4=0.64 N"},{"f":"l₁ = OA < l₂ = OB","m":"动力臂短 → 费力杠杆（F₁>F₂）"}],"diff":3},{"id":"w2q13","no":"13","group":"填空","type":"fill","askImg":"图片/pk-w2/q13.png","ansImg":"图片/pk-w2/q13-a.png","ask":"如图所示，在 O 为支点的轻质杠杆上施加一个竖直向下大小为 4N 的力 F₁，为使杠杆能保持水平静止，杠杆同时受到另一个沿竖直方向的力（图中未画出）。（1）请在图中画出力 F₁ 的力臂 l₁；（2）在下表的各个力中，不能使杠杆保持水平静止的有________（填写力的符号）。表：F₂ 9N 竖直向上；F₃ 3N 竖直向上；F₄ 6N 竖直向下；F₅ 5N 竖直向下。","fields":[{"type":"text","label":"不能使杠杆保持水平静止的力","ans":["F4、F5","F4F5","F4,F5","F4和F5","F4；F5","F5、F4","f4、f5","f4f5"],"mode":"contains"}],"ansText":"F₄、F₅","solution":["先算 F₁ 的力矩：O 在 7dm 处，F₁ 作用在 2dm 处，力臂 l₁=5dm，力矩=4N×5dm=20N·dm。","要平衡必须有 20N·dm 的反向力矩：可以在 O 右侧（7~10dm，力臂最多 3dm）用竖直向下的力，或在 O 左侧用竖直向上的力。","左边长 7dm：F₂ 9N 向上最大力矩 9×7=63＞20、F₃ 3N 向上最大 3×7=21＞20，都能调出合适的力臂，可以平衡。","右边只有 3dm：F₄ 6N 向下最大 6×3=18＜20、F₅ 5N 向下最大 5×3=15＜20，怎么放都不够，所以不能平衡的是 F₄、F₅。"],"tip":"力臂不能超出杆端：先算需要多少力矩，再看这个力在杆上最多能凑出多大力臂。","focus":"cond","tags":["杠杆平衡条件","最小力"],"point":"先算需要的力矩，再看这个力在杆上最多能凑出多大力臂","formulas":[{"f":"M = F·l","m":"F₁ 的力矩 4 N×5 dm=20 N·dm"},{"f":"M最大 = F × l最大","m":"O 右侧最长 3 dm：F₄ 6×3=18、F₅ 5×3=15，都 <20，无法平衡"}],"diff":3},{"id":"w2q14","no":"14","group":"解答","type":"solve","askImg":"图片/pk-w2/q14.png","ansImg":"图片/pk-w2/q14-a.png","ask":"如图，龙门吊上的起重机通过滑轮组在 10s 内，将重为 9×10³N 的货物沿竖直方向匀速提升 4m，滑轮组的机械效率为 60%。g 取 10 N/kg。求：(1)货物的质量；(2)滑轮组的有用功；(3)拉力 F 的功率；(4)拉力 F 的大小。","fields":[{"type":"num","label":"(1)货物的质量 m =","ans":900,"unit":"kg","tol":0.5},{"type":"num","label":"(2)有用功 W有 =","ans":36000,"unit":"J","tol":10},{"type":"num","label":"(3)拉力 F 的功率 P =","ans":6000,"unit":"W","tol":10},{"type":"num","label":"(4)拉力 F =","ans":5000,"unit":"N","tol":10}],"ansText":"(1) 900kg；(2) 3.6×10⁴J；(3) 6×10³W；(4) 5×10³N","solution":["(1) 由 G=mg 反解：m=G/g=9×10³N÷10N/kg=900kg。","(2) 有用功就是克服货物重力做的功：W有=Gh=9×10³N×4m=3.6×10⁴J。","(3) 用 η=W有/W总 反推总功：W总=W有/η=3.6×10⁴J÷60%=6×10⁴J；再 P=W总/t=6×10⁴J÷10s=6×10³W。","(4) 看图数绳子段数 n=3，绳端移动 s=nh=3×4m=12m，所以 F=W总/s=6×10⁴J÷12m=5×10³N。"],"tip":"η 只在有用功和总功之间搭桥；求 F 一定要先通过 s=nh 求出绳端移动的距离。","focus":"rule","tags":["机械效率","功率","滑轮组"],"poi
