","focus":"rule","tags":["定滑轮与动滑轮"],"point":"不计滑轮重和摩擦时，动滑轮省一半力","formulas":[{"f":"F = G/2","m":"前提就写在题里：滑轮重、摩擦都忽略"},{"f":"s = 2h","m":"省一半力的代价是绳端走 2 倍距离"}],"diff":1},{"id":"w4q04","no":"4","group":"选择","type":"choice","askImg":"图片/pk-w4/q04.png","ask":"下列现象是扩散现象的是（　　）","opts":["冬天下雪时，雪花纷飞","汽车驶过后扬起的灰尘四处飞舞","深秋的清晨，城市中大雾弥漫","香水瓶打开盖，香味充满房间"],"ans":3,"ansText":"D","solution":["扩散是分子无规则运动造成的，分子小到肉眼看不见。","雪花、灰尘、雾都是大量分子组成的颗粒，它们的运动是机械运动。","香味分子跑到空气中充满房间，才是扩散，选 D。"],"tip":"眼睛能看见的“飞舞、弥漫”都不是扩散。","focus":"model","tags":["扩散现象","分子动理论"],"point":"扩散是分子无规则运动；肉眼看得见的颗粒飞舞是机械运动","formulas":[{"f":"扩散 = 分子无规则运动 + 分子间有间隙","m":"雪花、灰尘、雾都是大量分子组成的颗粒，不是分子"}],"diff":1},{"id":"w4q05","no":"5","group":"选择","type":"choice","askImg":"图片/pk-w4/q05.png","ask":"下列情况下，比热容会发生变化的是（　　）","opts":["一杯水倒去一半","20℃的水变成80℃的水","一块铁加工成铁屑","水凝固成冰"],"ans":3,"ansText":"D","solution":["比热容是物质的特性，只跟物质的种类和状态有关。","倒掉一半只改变质量；温度变化、形状改变都不改变比热容。","水凝固成冰，状态变了，比热容也变（冰的比热容比水小），选 D。"],"tip":"质量、温度、形状变了比热容不变，状态变了才变。","focus":"model","tags":["比热容"],"point":"比热容只由物质种类和状态决定，与质量、温度、形状无关","formulas":[{"f":"c 与 m、Δt、形状无关","m":"水→冰状态改变，c 才变（冰约 2.1×10³ J/(kg·℃)）"}],"diff":2},{"id":"w4q06","no":"6","group":"选择","type":"choice","askImg":"图片/pk-w4/q06.png","ask":"把干净的玻璃板吊在弹簧测力计下面，读出测力计示数。使玻璃板水平接触水面，然后稍稍用力向上拉玻璃板，测力计示数会变大，原因是（　　）","opts":["分子在不停地运动","分子之间存在引力","分子之间存在斥力","玻璃板重力变大"],"ans":1,"ansText":"B","solution":["示数变大说明除了重力，还多了一个向下的力拉着玻璃板。","玻璃板和水面接触，水分子与玻璃分子之间有引力，把玻璃板“粘”住。","玻璃板离开水面后示数又变小，说明这个力只在接触时存在，选 B。"],"tip":"示数变大 = 多了一个向下的力，那是分子引力。","focus":"model","tags":["分子间作用力"],"point":"示数变大 = 多了一个向下的力，那是分子引力","formulas":[{"f":"F示 = G + F引（玻璃板与水面接触时）","m":"离开水面后示数回落，说明引力只在接触时存在"}],"diff":2},{"id":"w4q07","no":"7","group":"选择","type":"choice","askImg":"图片/pk-w4/q07.png","ask":"如图所示是《天工开物》中记载的淬火工艺，工人将烧红的铁器迅速放入冷水中冷却，铁器在冷却过程中（　　）","opts":["吸热，内能减少","吸热，内能增加","放热，内能减少","放热，内能增加"],"ans":2,"ansText":"C","solution":["认情境：铁器温度高、水温度低，发生热传递。","热传递的方向是高温→低温，所以铁器放热、水吸热。","铁器放热、温度降低，内能减少，选 C。"],"tip":"放热 ↔ 温度降低 ↔ 内能减少，三件事同时发生。","focus":"model","tags":["改变内能的方式","内能"],"point":"热传递高温→低温；铁器放热，温度降、内能减","formulas":[{"f":"Q放 = cm(t初 − t末)","m":"放热多少用温差算"},{"f":"热传递方向：高温物体 → 低温物体","m":"铁器放热、内能减少"}],"diff":1},{"id":"w4q08","no":"8","group":"选择","type":"choice","askImg":"图片/pk-w4/q08.png","ask":"关于温度、热量和内能，下列说法正确的是（　　）","opts":["冰块熔化时温度不变，其内能一定不变","热量是从内能大的物体传递到内能小的物体","0℃的冰块具有内能","物体的内能增加，一定吸收了热量"],"ans":2,"ansText":"C","solution":["A 错：冰熔化时吸热、温度不变，但内能增加。","B 错：热传递的方向由温度高低决定，不是内能大小。","C 对：一切物体在任何温度下都有内能，0℃的冰也有。","D 错：内能增加还可能是外界对物体做了功。"],"tip":"温度是状态量、热量是过程量、内能是状态量，三个词别混。","focus":"model","tags":["温度热量内能辨析","内能"],"point":"温度、热量、内能三个词辨析：状态量还是过程量","formulas":[{"f":"内能 = 分子动能 + 分子势能","m":"一切物体在任何温度下都有内能，0℃ 的冰也有"},{"f":"改变内能两条路：热传递 / 做功","m":"内能增加不一定是吸了热"}],"diff":3},{"id":"w4q09","no":"9","group":"选择","type":"choice","askImg":"图片/pk-w4/q09.png","ask":"1g水温度降低1℃放出的热量是（　　）","opts":["0.42J","4.2J","42J","420J"],"ans":1,"ansText":"B","solution":["用 Q = cmΔt，水的比热容 c = 4.2×10³ J/(kg·℃)。","先把 1 g 换成 0.001 kg，Δt = 1℃。","Q = 4.2×10³ × 0.001 × 1 = 4.2 J，选 B。"],"tip":"质量单位要用 kg，别把 1 g 直接代进公式。","focus":"calc","tags":["热量计算","比热容"],"point":"Q=cmΔt，质量必须先换成 kg","formulas":[{"f":"Q = cmΔt","m":"4.2×10³ × 0.001 × 1 = 4.2 J"}],"diff":2},{"id":"w4q10","no":"10","group":"选择","type":"choice","askImg":"图片/pk-w4/q10.png","ask":"规格相同的甲乙两容器装了相同质量的水，用不同的电加热器加热，忽略散热，得到的水温与时间的图线如图所示，下列说法正确的是（　　）","opts":["加热相同的时间，两杯水升高的温度相同","加热相同的时间，两杯水吸收的热量相同","吸收相同的热量，甲杯水升温比乙杯的多","甲杯水加热4min与乙杯水加热7min吸收的热量相同"],"ans":3,"ansText":"D","solution":["两杯水质量相同、都是水，升温一样多需要的热量就一样多；加热器功率不同，只能说明“同样时间吸热不同”。","读图：甲 4 min 从 20℃升到 60℃，乙 7 min 也从 20℃升到 60℃，两者升温相同、质量相同、都是水 → 吸收的热量相同，D 对。","A、B 错在把“加热相同时间”当成“升温相同/吸热相同”——甲图线更陡，说明甲加热器功率大。","C 错：同质量水吸收相同热量，升温应该一样多，不会甲多。"],"tip":"判断吸热多少要换算成“升高相同温度需要多少热”，不能只看加热时间。","focus":"rule","tags":["比热容","热量计算"],"point":"判断吸热多少看「升温相同需要多少热」，不能只看加热时间","formulas":[{"f":"Q = cmΔt","m":"m、Δt 相同且都是水 → Q 相同"},{"f":"P = Q/t","m":"甲图线更陡说明甲加热器功率大，不是吸热多"}],"diff":3},{"id":"w4q11","no":"11","group":"填空","type":"fill","askImg":"图片/pk-w4/q11.png","ansImg":"图片/pk-w4/q11-a.png","ask":"2kg的某液体置于恒温封闭环境中，质量保持不变。测得该液体的温度随时间变化如图所示。(1)关于该液体的分子运动，小羽认为分子的运动随温度下降变缓慢，在0℃时分子会停止运动；小慧认为分子的运动随时间越来越剧烈。你认为（　　）（选填以下对应的字母）。A．小羽的看法是正确的 B．小慧的看法是正确的 C．小羽、小慧的看法都是错误的 (2)该液体所在环境的温度（　　）A．一定小于1.6℃ B．可能等于1.6℃ C．一定大于20℃ D．可能等于20℃ (3)若该液体在1~2min内内能减少1.26×10⁴J，则该液体的比热容为________。（此过程只发生热传递）","fields":[{"type":"choice","label":"(1) 对分子运动的看法","options":["A．小羽正确","B．小慧正确","C．两人都错"],"ans":2},{"type":"choice","label":"(2) 该液体所在环境的温度","options":["A．一定小于1.6℃","B．可能等于1.6℃","C．一定大于20℃","D．可能等于20℃"],"ans":0},{"type":"num","label":"(3) 该液体的比热容 c =","ans":2100,"unit":"J/(kg·℃)","tol":20}],"ansText":"(1) C；(2) A；(3) 2.1×10³ J/(kg·℃)","solution":["(1) 温度降低分子运动变慢，但永远不会停止；小慧说的“越来越剧烈”也反了，两人都错，选 C。","(2) 图线一直在降温、到 1.6℃ 还没停，说明环境温度比 1.6℃ 更低，选 A。","(3) 读图：1min 时 20℃、2min 时 17℃，Δt = 3℃。","c = Q/(mΔt) = 1.26×10⁴ J ÷ (2 kg × 3℃) = 2.1×10³ J/(kg·℃)。"],"tip":"分子运动永不停止；算比热容后检查量级是否是 10³ 级。","focus":"calc","tags":["分子动理论","比热容","热量计算"],"point":"分子运动永不停止；图线还在降说明环境比末温更低；c=Q/(mΔt)","formulas":[{"f":"c = Q/(mΔt)","m":"1.26×10⁴ ÷ (2×3) = 2.1×10³ J/(kg·℃)"},{"f":"热传递直到与环境同温才停","m":"1.6℃ 时仍在降温 → 环境温度低于 1.6℃"}],"diff":3},{"id":"w4q12","no":"12","group":"填空","type":"fill","askImg":"图片/pk-w4/q12.png","ansImg":"图片/pk-w4/q12-a.png","ask":"如图所示，把凉奶放在热水里加热，经过一段较长时间，它们的温度随时间变化的图像如图（b）所示。(1)这个过程是用________的方式改变内能；(2)图（b）______是奶温度变化的曲线，理由是凉奶吸热后温度________；(3)用热水的原因是热传递过程中________从甲物体转移到乙物体上。（选填“热量”“温度”“内能”）","fields":[{"type":"text","label":"(1) 改变内能的方式","ans":["热传递"],"mode":"contains"},{"type":"text","label":"(2) 奶的温度曲线","ans":["乙"],"mode":"exact"},{"type":"text","label":"(2) 凉奶吸热后温度","ans":["逐渐升高","升高","上升"],"mode":"contains"},{"type":"text","label":"(3) 热传递中转移的是","ans":["内能","热量"],"mode":"exact"}],"ansText":"(1) 热传递；(2) 乙，逐渐升高；(3) 内能","solution":["凉奶放在热水里，没有做功，靠温度差传热，所以是热传递。","奶温度低、吸热后温度上升，对应上升的那条曲线乙。","热传递转移的是内能（转移的多少叫热量），温度不会转移给别的物体。"],"tip":"上升的曲线是被加热的物体；转移的是内能，不是温度。","focus":"model","tags":["改变内能的方式","温度热量内能辨析"],"point":"上升的曲线是被加热的物体；转移的是内能，不是温度","formulas":[{"f":"热传递转移内能，转移的多少叫热量 Q","m":"温度不能从一个物体「传」给另一个"},{"f":"Q吸 = Q放（不计散热）","m":"两条曲线最终趋于同一温度"}],"diff":2},{"id":"w4q13","no":"13","group":"解答","type":"solve","tonight":true,"tonightWhy":"今晚第 1 道：只练 Q吸=cmΔt 与它的反用 Δt=Q/(cm)，写满四行（公式 → 代入 → 单位 → 答句）。","askImg":"图片/pk-w4/q13.png","ansImg":"图片/pk-w4/q13-a.png","ask":"家用电水壶中装有质量为2kg、温度为20℃的水。已知水的比热容为4.2×10³ J/(kg·℃)。求：(1)通电3min后将水加热到50℃，水吸收的热量；(2)当壶中的水吸收6.72×10⁵J的热量后，壶中水的温度。","fields":[{"type":"num","label":"(1) 水吸收的热量 Q吸 =","ans":252000,"unit":"J","tol":100},{"type":"num","label":"(2) 壶中水的温度 t =","ans":100,"unit":"℃","tol":0.5}],"ansText":"(1) 2.52×10⁵ J；(2) 100℃","solution":["(1) Δt = 50℃ - 20℃ = 30℃，Q吸 = cmΔt = 4.2×10³ × 2 × 30 = 2.52×10⁵ J。","(2) Δt′ = Q/(cm) = 6.72×10⁵ ÷ (4.2×10³ × 2) = 80℃。","末温 = 初温 + 升温 = 20℃ + 80℃ = 100℃，刚好到沸点，不会超过 100℃。"],"tip":"算出的是“升高的温度”，最后要再加初温；还要判断会不会超过沸点。","focus":"calc","tags":["热量计算","比热容"],"point":"Q=cmΔt 求吸热；反解出的是 Δt，要加初温并检查沸点","formulas":[{"f":"Q吸 = cmΔt","m":"4.2×10³×2×30 = 2.52×10⁵ J"},{"f":"Δt = Q/(cm)，t末 = t初 + Δt","m":"6.72×10⁵÷(4.2×10³×2)=80℃ → 20+80=100℃"}],"diff":2},{"id":"w4q14","no":"14","group":"解答","type":"solve","askImg":"图片/pk-w4/q14.png","ansImg":"图片/pk-w4/q14-a.png","ask":"如图所示，工人沿斜面把一箱货物从底端拉进车厢，此过程中，工人对货物的拉力为400N，此斜面的长为5m，高为1m，货物重为1500N，求：(1)工人在使用斜面的过程中做的有用功是多少？(2)工人拉这箱货物时斜面的机械效率是多少？(3)货物在斜面上运动时额外功是多少？","fields":[{"type":"num","label":"(1) 有用功 W有 =","ans":1500,"unit":"J","tol":5},{"type":"num","label":"(2) 斜面机械效率 η =","ans":75,"unit":"%","tol":0.5},{"type":"num","label":"(3) 额外功 W额 =","ans":500,"unit":"J","tol":5}],"ansText":"(1) 1500 J；(2) 75%；(3) 500 J","solution":["有用功是把货物举高做的功：W有 = Gh = 1500 N × 1 m = 1500 J。","总功是拉力沿斜面做的功：W总 = Fs = 400 N × 5 m = 2000 J。","η = W有/W总 = 1500/2000 = 75%。","额外功 = W总 - W有 = 2000 - 1500 = 500 J（用来克服摩擦）。"],"tip":"斜面里 s 是斜面长、h 是斜面高，两个别用反。","focus":"rule","tags":["机械效率","功"],"point":"斜面：W有=Gh，W总=Fs（s 是斜面长）","formulas":[{"f":"W有 = Gh","m":"1500 N×1 m = 1500 J"},{"f":"W总 = Fs","m":"400 N×5 m = 2000 J"},{"f":"η = W有/W总，W额 = W总 − W有","m":"η=75%，额外功 500 J（克服摩擦）"}],"diff":2}]},{"id":"pk-w5a","name":"第5周_1 · 国庆2（热值·比热容·机械效率·能量）","source":"题库/第5周_1.docx","exam":"第5周（国庆2）练习","topics":["分子与内能","比热容与热值","机械效率","热机与能量","杠杆"],"note":"第15题(1)要求画滑轮组绕线方式，属画图题无法自动判分：该小问不计入 fields，答案图 q15-a.png 含绕线答案，学生自查；(2)(3) 仍按数值判分。第11题(2)③ 原卷气压计显示 2030.0hPa，答案写 2.03×10⁵ Pa（1hPa=100Pa）。","questions":[{"id":"w5aq01","no":"1","group":"选择","type":"choice","askImg":"图片/pk-w5a/q01.png","ask":"2024年10月30日，搭载神舟十九号载人飞船的长征二号F遥十九运载火箭在酒泉卫星发射中心点火发射。火箭燃料采用液氢主要是因为液氢具有较大的（　　）","opts":["内能","热量","热值","比热容"],"ans":2,"ansText":"C","solution":["燃料燃烧放热 Q放 = mq，q 就是热值。","火箭要“同样质量放出更多热”，比的是热值，液氢热值大。","内能、热量、比热容都不是描述燃料放热本领的物理量。"],"tip":"热值看燃料放热本领，比热容看物质升温快慢。","focus":"model","tags":["热值"],"point":"热值描述燃料放热本领，比热容描述升温难易","formulas":[{"f":"Q放 = mq","m":"同样质量，q 越大放热越多，所以火箭用液氢"},{"f":"Q = cmΔt","m":"这是升温吸热，不是燃料放热，别混"}],"diff":1},{"id":"w5aq02","no":"2","group":"选择","type":"choice","askImg":"图片/pk-w5a/q02.png","ask":"如图，注射器中的液体很难被压缩，这个现象说明了（　　）","opts":["分子之间存在引力","分子之间存在斥力","分子在不停地做无规则运动","分子之间存在间隙"],"ans":1,"ansText":"B","solution":["液体很难被压缩，说明分子已经靠得很近，再往里挤会受到排斥。","这对应分子之间的斥力，选 B。","“分子在运动”“有间隙”解释的是扩散和体积变化，不是难压缩。"],"tip":"难压缩↔斥力，能拉长（玻璃板粘水）↔引力。","focus":"model","tags":["分子间作用力"],"point":"分子斥力的宏观表现：液体很难被压缩","formulas":[{"f":"难压缩 → 表现为斥力；能粘住/被拉长 → 表现为引力","m":"液体分子间距小，往里挤就是斥力"}],"diff":1},{"id":"w5aq03","no":"3","group":"选择","type":"choice","askImg":"图片/pk-w5a/q03.png","ask":"如图反映了一台机器正常工作时能量流向情况，下列说法错误的是（　　）","opts":["该图说明了能量可以发生转化","该图说明了能量可以发生转移","该机器遵循能量守恒定律","该机器的效率为75%"],"ans":3,"ansText":"D","solution":["读图：内能输入 100 J，机械能输出 25 J（有用），内能输出 75 J（损失）。","效率 = 有用的能量/输入的能量 = 25/100 = 25%，所以 D 说 75% 是错的。","内能→机械能是转化，内能输出到别处是转移，总能量不变所以守恒，A、B、C 都对。"],"tip":"效率的分子是“有用的那部分”，不是损失掉的 75 J。","focus":"rule","tags":["能量守恒","热机效率"],"point":"效率 = 有用的那部分 ÷ 输入的总能量，不是损失的比例","formulas":[{"f":"η = W有用/W输入","m":"25 J ÷ 100 J = 25%，不是 75%"},{"f":"E输入 = E有用 + E损失","m":"能量守恒，所以 A、B、C 都对"}],"diff":2},{"id":"w5aq04","no":"4","group":"选择","type":"choice","askImg":"图片/pk-w5a/q04.png","ask":"市场上有一种“磁悬浮电灯”，如图所示，该电灯内部没有电池，电灯本身没有导线与家庭电路接通，但能够发光。关于这个“磁悬浮电灯”的说法中，正确的是（　　）","opts":["“磁悬浮电灯”发光，不需要消耗能量","“磁悬浮电灯”不掉下来，是它受到的浮力等于重力","“磁悬浮电灯”受到竖直向上的磁场力大于它受到的重力","“磁悬浮电灯”发光所需要的能量一定需要通过某种方式获取"],"ans":3,"ansText":"D","solution":["电灯发光必须消耗能量，“不需要消耗能量”违反能量守恒，A 错。","灯是“磁悬浮”，靠磁场力平衡重力，不是浮力，B 错。","灯悬停不动说明磁场力等于重力，不是大于，C 错。","能量可以通过磁场等方式传过去，但一定得有来源，D 对。"],"tip":"凡是“不用能量”“永远转”的说法都违反能量守恒。","focus":"model","tags":["能量守恒"],"point":"凡是「不需要能量」的说法都违反能量守恒","formulas":[{"f":"悬停：F磁 = G","m":"是等于，不是大于，否则会上浮"},{"f":"发光必然消耗能量","m":"能量只能转移或转化，不能凭空产生"}],"diff":2},{"id":"w5aq05","no":"5","group":"选择","type":"choice","askImg":"图片/pk-w5a/q05.png","ask":"一个滑轮组改进后提高了机械效率，用它把同一物体匀速提升同样的高度，改进后比改进前相比（　　）","opts":["有用功减少，总功减少","有用功增加，总功增加","有用功不变，总功减少","机械效率提高了，功率也变大了"],"ans":2,"ansText":"C","solution":["同一物体、同样高度，有用功 W有 = Gh 不变，A、B 都错。","效率 η = W有/W总 提高，说明额外功变小，总功变小，C 对。","效率和功率是两回事：不知道时间，说功率变大没有依据，D 错。"],"tip":"同一重物同一高度，有用功是定值；效率只跟总功有关。","focus":"rule","tags":["机械效率"],"point":"同一重物同一高度 → 有用功不变；效率升高就是额外功变少","formulas":[{"f":"W有 = Gh（不变）","m":"与效率无关，只由 G、h 决定"},{"f":"η = W有/(W有+W额)","m":"η 变大 → W额 变小 → W总 也变小"},{"f":"P = W/t","m":"不知道时间，不能判断功率变大"}],"diff":2},{"id":"w5aq06","no":"6","group":"选择","type":"choice","askImg":"图片/pk-w5a/q06.png","ask":"将40℃的一杯水变为80℃，质量不变，则（　　）","opts":["水40℃时，水分子动能较小","40℃时，水分子运动更剧烈","水40℃时比80℃时内能大","40℃的水只能通过吸热变为80℃"],"ans":0,"ansText":"A","solution":["温度是分子平均动能的标志：40℃ 比 80℃ 低，分子动能小，A 对。","温度低时分子运动应该更缓慢，B 反了。","同质量的水温度越高内能越大，C 反了。","改变内能还有做功，D 的“只能”太绝对。"],"tip":"温度高低↔分子平均动能大小，成正比关系看。","focus":"model","tags":["分子动理论","内能"],"point":"温度是分子平均动能的标志，温度升则分子动能增","formulas":[{"f":"T ↑ → 分子平均动能 ↑","m":"内能还跟分子数、分子势能有关"},{"f":"改变内能：吸热 或 外界对物体做功","m":"「只能吸热」太绝对"}],"diff":2},{"id":"w5aq07","no":"7","group":"选择","type":"choice","askImg":"图片/pk-w5a/q07.png","ask":"某起重机提升重为3000 N的物体，图为起重机做功的能量分配图。下列说法正确的是（　　）","opts":["物体被提升了15 m","起重机的机械效率为30%","起重机做的有用功为6.3×10³ J","按照技术规程保养起重机，机械效率不变"],"ans":2,"ansText":"C","solution":["读饼图：额外功 2700 J 占 30%，有用的占 70%。","W总 = 2700 J ÷ 30% = 9000 J，W有 = 9000 - 2700 = 6300 J = 6.3×10³ J，C 对。","效率是 70% 不是 30%，B 错；h = W有/G = 6300/3000 = 2.1 m，A 错。","保养能减小摩擦和额外功，效率会提高，D 错。"],"tip":"先用“额外功+它的占比”求出总功，再求有用功。","focus":"calc","tags":["机械效率","功"],"point":"先用「额外功 ÷ 占比」求总功，再求有用功、效率、高度","formulas":[{"f":"W总 = W额 ÷ 占比","m":"2700 J ÷ 30% = 9000 J"},{"f":"W有 = W总 − W额，η = W有/W总","m":"6300 J，η = 70%"},{"f":"W有 = Gh → h = W有/G","m":"6300÷3000 = 2.1 m"}],"diff":3},{"id":"w5aq08","no":"8","group":"选择","type":"choice","askImg":"图片/pk-w5a/q08.png","ask":"如图所示为注射器，小明缓慢推动活塞，数显温度计显示注射器内密封的气体温度不变，此过程密封气体的分子势能变化忽略不计，下列关于密封气体说法正确的是（　　）","opts":["内能减少","分子动能一定增加","内能不变","只有做功的方式改变了内能"],"ans":2,"ansText":"C","solution":["温度不变 → 分子平均动能不变；题目说分子势能变化忽略不计。","内能 = 分子动能 + 分子势能，两者都不变，所以内能不变，C 对。","推活塞是做功，但等温压缩时内能没有变，A、D 错；动能也没增加，B 错。"],"tip":"内能看“温度+分子势能”，温度不变且势能忽略 → 内能不变。","focus":"rule","tags":["内能","改变内能的方式"],"point":"温度不变 + 分子势能忽略 → 内能不变（等温压缩）","formulas":[{"f":"内能 = 分子动能 + 分子势能","m":"等温 → 动能不变；势能忽略 → 内能不变"},{"f":"做功可以改变内能，但不一定改变","m":"等温压缩：外界做功的同时气体向外放热"}],"diff":3},{"id":"w5aq09","no":"9","group":"选择","type":"choice","askImg":"图片/pk-w5a/q09.png","ask":"如图甲所示，在绝热容器（容器与外界无热交换）中装有温度为28℃的未知液体A，质量为mA；将一瓶温度为90℃、质量为mB的水B放入容器中，忽略瓶子吸收（或放出）热量，忽略液体蒸发等因素的影响，两种液体的温度随时间变化的图像如图乙所示。已知mA>mB，在0至7.8min内，下列说法正确的是（　　）","opts":["液体A与水B之间发生热传递，传递的是温度","0至7.8min内，液体A的内能一直在减小","液体A的比热容小于水B的比热容","水B从90℃降到80℃放出的热量，小于其从80℃降到70℃放出的热量"],"ans":2,"ansText":"C","solution":["A 错：热传递传递的是热量（内能），温度不会转移。","B 错：液体 A 初温 28℃、水 B 90℃，A 被加热，内能应增大。","C：Q吸 = Q放，即 cAmAΔtA = cBmBΔtB；mA 大、图上 A 升温幅度也大，所以 cA 一定小，C 对。","D 错：同质量的水降 10℃ 和降 10℃ 放热一样多，不是“小于”。"],"tip":"mA>mB 是藏起来的条件：Q 相同、m 又大、Δt 又大，c 一定小。","focus":"rule","tags":["比热容","热量计算"],"point":"绝热容器用 Q吸=Q放，配合 m 与 Δt 反推比热容大小","formulas":[{"f":"cAmAΔtA = cBmBΔtB","m":"mA>mB 且 ΔtA>ΔtB → cA 一定小于 cB"},{"f":"Q = cmΔt","m":"同质量的水降相同温度，放热相同 → D 错"}],"diff":3},{"id":"w5aq10","no":"10","group":"选择","type":"choice","askImg":"图片/pk-w5a/q10.png","ask":"如图所示，甲、乙两人选用不同的装置，在相同时间内把质量相等的货物匀速提升到同一平台，不计绳重和摩擦。下列说法正确的是（　　）","opts":["乙做的有用功多","乙做的总功多","甲做总功的功率大","甲所用装置的机械效率大"],"ans":2,"ansText":"C","solution":["质量相等的货物提到同样高度，有用功 W有 = Gh 相同，A 错。","甲用了动滑轮，要把动滑轮也一起提上去，额外功更多 → 总功更多。","两人用时相同，甲总功多，所以甲做总功的功率大，C 对。","额外功多说明甲效率更低，B、D 都错。"],"tip":"有用功只看货物；动滑轮本身的重会变成额外功。","focus":"rule","tags":["机械效率","功率"],"point":"有用功只看货物；动滑轮的自重会变成额外功","formulas":[{"f":"W有 = Gh（两人相同）","m":"m 相同、h 相同"},{"f":"η = W有/(W有+W额)","m":"甲多提一个动滑轮 → W额 大 → η 小"},{"f":"P = W总/t","m":"t 相同，甲 W总 大 → 甲功率大"}],"diff":3},{"id":"w5aq11","no":"11","group":"实验","type":"fill","askImg":"图片/pk-w5a/q11.png","ansImg":"图片/pk-w5a/q11-a.png","ask":"学习“内能”后，某同学做了如下实验研究。(1)如图a，在一个配有活塞的厚玻璃筒里放一小团脱脂棉，把活塞迅速压下去，脱脂棉燃烧起来，是因为活塞压缩气体做功，使筒内气体的内能________（选填“增加”“减少”），温度________（选填“升高”“降低”）。(2)下压活塞过程中，越往下压越费力。该同学猜想手对活塞的压力越大，筒内气体的压强越大，设计以下实验进行验证。①如图b，用弹簧测力计测出活塞的重力G为________N；②把涂有润滑油的活塞安装于玻璃筒内，用推力计竖直向下压活塞，活塞下移；③当推力计的示数F为4.5N时，活塞静止如图c所示，已知1hPa=100Pa，此时电子气压计测得筒内气体压强为________Pa；④增大推力，观察气压计示数的变化，得出结论；⑤实验评估：该同学对图b和图c中的数据进行分析。活塞受到的压力F和重力G的合力F向下为________N；已知活塞的横截面积为5×10⁻⁵m²，结合气压计的示数，计算筒内气体对活塞向上的压力F向上为________N。活塞静止，F向上和F向下不相等的原因可能是受摩擦力和________的影响。","fields":[{"type":"text","label":"(1) 筒内气体内能","ans":["增加"],"mode":"exact"},{"type":"text","label":"(1) 筒内气体温度","ans":["升高"],"mode":"exact"},{"type":"num","label":"(2)① 活塞重力 G =","ans":0.5,"unit":"N","tol":0.01},{"type":"num","label":"(2)③ 筒内气体压强 p =","ans":203000,"unit":"Pa","tol":100},{"type":"num","label":"(2)⑤ 合力 F向下 =","ans":5,"unit":"N","tol":0.01},{"type":"num","label":"(2)⑤ 气体对活塞的压力 F向上 =","ans":10.15,"unit":"N","tol":0.02},{"type":"text","label":"(2)⑤ 还受什么影响","ans":["外界大气压力","大气压力","大气压强","外界大气压"],"mode":"contains"}],"ansText":"(1) 增加；升高；(2)① 0.5 N；③ 2.03×10⁵ Pa；⑤ 5 N；10.15 N；外界大气压力","solution":["(1) 压缩气体做功，气体内能增加、温度升高，达到脱脂棉的着火点就燃烧。","(2)① 图b弹簧测力计吊着活塞，读数是 0.5 N，即 G = 0.5 N。","③ 2030.0 hPa = 2030×100 Pa = 2.03×10⁵ Pa，注意 hPa 不是 Pa。","⑤ F向下 = F + G = 4.5 + 0.5 = 5 N；F向上 = pS = 2.03×10⁵ × 5×10⁻⁵ = 10.15 N。","两个力不相等，是因为活塞还受摩擦力和外界大气压力。"],"tip":"1 hPa = 100 Pa，读数是 2030.0hPa 时别直接写成 2030 Pa。","focus":"calc","tags":["内能","改变内能的方式"],"point":"压缩气体做功使内能增大；p=F/S 与 hPa 换算","formulas":[{"f":"压缩气体做功 → 内能↑ → 温度↑","m":"达到脱脂棉着火点就燃烧"},{"f":"1 hPa = 100 Pa","m":"2030 hPa = 2.03×10⁵ Pa，别直接写 2030"},{"f":"p = F/S → F向上 = pS","m":"2.03×10⁵×5×10⁻⁵=10.15 N；差值为摩擦力与大气压力"}],"diff":3},{"id":"w5aq12","no":"12","group":"实验","type":"fill","askImg":"图片/pk-w5a/q12.png","ansImg":"图片/pk-w5a/q12-a.png","ask":"小红对100g的某固体物质进行加热，用数字温度计测量物质的温度并记录在下表中，温度-时间图像如下图所示。除此以外，小红还记录了物质的状态：从第8秒开始容器内出现液态的物质，直到第44秒，容器内尚有少量固态物质，第46秒后，容器内的物质就全都是液态的了。（可以认为所用的加热设备能使该物质每秒吸收热量200J）(1)第28秒与第26秒相比，物质的温度不变，内能________（选填“增大”、“减小”或“不变”）。(2)该物质为液态时的比热容________固态时的比热容（选填“大于”、“小于”或“等于”），判断的依据是________。(3)液态时该物质的比热容大小是________J/(kg·℃)。","fields":[{"type":"text","label":"(1) 内能","ans":["增大"],"mode":"exact"},{"type":"text","label":"(2) 液态比热容 固/液 比较","ans":["大于"],"mode":"exact"},{"type":"num","label":"(3) 液态比热容 c =","ans":2000,"unit":"J/(kg·℃)","tol":50}],"ansText":"(1) 增大；(2) 大于（吸收相同热量，液态上升的温度更少）；(3) 2×10³ J/(kg·℃)","solution":["(1) 温度不变但还在持续吸热（第26~28s都在熔化），内能增大。","(2) 看同样 2 s：液态只升 1℃（46s→48s），固态升 2℃ 多，说明液态升温慢、比热容大。","(3) 液态时每 2 s 吸热 400 J、升温 2℃，m = 100 g = 0.1 kg。","c = Q/(mΔt) = 400 ÷ (0.1×2) = 2×10³ J/(kg·℃)。"],"tip":"每秒吸 200 J，算 2 s 要乘 2；质量 100 g 要换成 0.1 kg。","focus":"rule","tags":["比热容","热量计算"],"point":"熔化时吸热内能仍增大；同一加热功率下比升温快慢得比热容","formulas":[{"f":"Q = Pt（每秒 200 J）","m":"2 s 吸热 400 J"},{"f":"c = Q/(mΔt)","m":"400÷(0.1×2)=2×10³ J/(kg·℃)"},{"f":"同 Q、同 m 时 Δt 小者 c 大","m":"液态升温更慢 → c液 > c固"}],"diff":3},{"id":"w5aq13","no":"13","group":"实验","type":"fill","askImg":"图片/pk-w5a/q13.png","ansImg":"图片/pk-w5a/q13-a.png","ask":"小明和小红一起做探究杠杆平衡条件的实验（杠杆刻度均匀）。(1)实验前，杠杆置于支架上静止，如图甲所示，此时杠杆______（选填“是”“不是”）平衡状态，为使杠杆在水平位置平衡，应该将平衡螺母向______（选填“左”“右”）调。(2)杠杆水平平衡后，如图乙所示，A位置挂3个相同的钩码，为使杠杆再次水平平衡，应该在B位置挂上______个同样的钩码。(3)如图丙所示，为改变力的方向，小红在杠杆右侧用弹簧测力计向下拉，当测力计由竖直方向逐渐向左偏转，杠杆始终保持水平平衡，测力计的示数将______（选填“变大”“变小”“不变”）。(4)小明和小红交流：①如图丁，用木棒作为秤杆，用细线系一个20g的钩码作为秤砣，把空小盆挂在A点作为秤盘，在B点挂粗绳作为提纽，B点相当于支点；移动细线的位置，直到杆秤水平平衡，标记此时细线的位置，则该位置对应刻度值为______g。②在秤盘中逐一添加50g的砝码，移动细线的位置，当杆秤水平平衡时，标记细线的位置，记录相应的质量，再测出细线距离B点的长度（如表），根据表中数据，应将250g的刻度值标记在距离B点______cm处。③小组用电子天平检验自制杆秤（以B为支点），发现称量同一物体时，杆秤读数总比电子天平示数略大，请你分析可能造成这种系统误差的原因：________（不考虑摩擦因素，合理即可）。","fields":[{"type":"text","label":"(1) 是否处于平衡状态","ans":["是"],"mode":"exact"},{"type":"text","label":"(1) 平衡螺母向哪调","ans":["左"],"mode":"exact"},{"type":"num","label":"(2) B位置挂钩码数","ans":6,"unit":"个","tol":0.01},{"type":"text","label":"(3) 测力计示数","ans":["变大"],"mode":"exact"},{"type":"num","label":"(4)① 该位置对应刻度值","ans":0,"unit":"g","tol":0.01},{"type":"num","label":"(4)② 250g刻度距B点","ans":26,"unit":"cm","tol":0.5}],"ansText":"(1) 是；左；(2) 6；(3) 变大；(4)① 0 g；② 26 cm；③ 秤砣实际质量小于20 g","solution":["(1) 杠杆静止（哪怕倾斜）就是平衡；图甲左端高，平衡螺母向左（高的一端）调。","(2) 设每格长 l、每个钩码重 G：A 在 O 左 4 格，3G×4l = nG×2l，n = 6。","(3) 测力计向左偏转时，力臂变小，F×l 不变 → F 变大。","(4)① 空盆、空秤平衡时秤砣在支点处，所以该位置是 0 g。","② 由表格 6/11/16/21 每 50 g 加 5 cm，即 x = 0.1m + 1，250 g 时 x = 26 cm。","③ 读数偏大，说明秤砣比标称的 20 g 轻（同样的力矩需要更大的力臂）。"],"tip":"平衡螺母朝“高的一端”调；力臂变小则拉力变大。","focus":"rule","tags":["杠杆平衡条件","实验探究"],"point":"平衡螺母向高的一端调；力臂变小则拉力变大；杆秤刻度均匀","formulas":[{"f":"F₁l₁ = F₂l₂","m":"3G×4l = nG×2l → n = 6"},{"f":"F = F₂l₂/l₁","m":"测力计偏转后 l₁ 变小 → 示数变大"},{"f":"m ∝ x（刻度均匀）","m":"每 50 g 对应 5 cm，250 g → 26 cm"}],"diff":3},{"id":"w5aq14","no":"14","group":"解答","type":"solve","askImg":"图片/pk-w5a/q14.png","ansImg":"图片/pk-w5a/q14-a.png","ask":"小明用图中的实验装置加热水，他查出酒精的热值是3.0×10⁷ J/kg，水的比热容为c水=4.2×10³ J/（kg•℃），实验步骤如下：①用温度计测量出此时水的温度为t0=20℃；②用电子秤测出烧杯中的水的质量为m水=0.2kg，及酒精灯中酒精的质量为m1=120g；③用酒精灯加热水一定时间后，水仍未沸腾；④用温度计测出此时水的温度为t=30℃；⑤用电子秤测出酒精灯中剩余酒精的质量m2=118.6g。假如水的质量变化忽略不计，求：（1）此过程中水升温吸收的热量Q吸；（2）此装置加热水的效率η。","fields":[{"type":"num","label":"(1) 水吸收的热量 Q吸 =","ans":8400,"unit":"J","tol":50},{"type":"num","label":"(2) 加热水的效率 η =","ans":20,"unit":"%","tol":0.5}],"ansText":"(1) 8.4×10³ J；(2) 20%","solution":["(1) Δt = 30℃ - 20℃ = 10℃，Q吸 = cmΔt = 4.2×10³ × 0.2 × 10 = 8.4×10³ J。","(2) 烧掉的酒精 m = 120 g - 118.6 g = 1.4 g = 1.4×10⁻³ kg。","Q放 = mq = 1.4×10⁻³ × 3.0×10⁷ = 4.2×10⁴ J。","η = Q吸/Q放 = 8.4×10³ ÷ 4.2×10⁴ = 20%。"],"tip":"烧掉的酒精 = 初质量 - 剩余质量，别忘了把 g 换成 kg。","focus":"calc","tags":["热值","热量计算"],"point":"Q吸=cmΔt、Q放=mq、η=Q吸/Q放，三式串起来","formulas":[{"f":"Q吸 = cmΔt","m":"4.2×10³×0.2×10 = 8.4×10³ J"},{"f":"Q放 = mq","m":"烧掉 1.4 g = 1.4×10⁻³ kg → 4.2×10⁴ J"},{"f":"η = Q吸/Q放","m":"8.4×10³ ÷ 4.2×10⁴ = 20%"}],"diff":3},{"id":"w5aq15","no":"15","group":"解答","type":"solve","askImg":"图片/pk-w5a/q15.png","ansImg":"图片/pk-w5a/q15-a.png","ask":"小明家建新房装修时，在楼顶安装了一个滑轮组用来运送材料。某次运送材料时，卷扬机在绳端用500 N的力将120 kg的材料匀速运送到5 m高处，用时10 s，绳端移动的距离为15 m。绳重和摩擦忽略不计，g取10 N/kg。求：(1)请你画出该滑轮组的绕线方式。(2)请计算该过程中卷扬机拉力做功的功率是多少？(3)若卷扬机施加在绳端的最大拉力为1000 N，求该滑轮组的最大机械效率是多少？","fields":[{"type":"num","label":"(2) 拉力的功率 P =","ans":750,"unit":"W","tol":1},{"type":"num","label":"(3) 最大机械效率 ηmax =","ans":90,"unit":"%","tol":0.5}],"ansText":"(1) 绕线见答案图（n=3）；(2) 750 W；(3) 90%","solution":["(1) 由 s = 15 m、h = 5 m 得 n = s/h = 3，绳子从动滑轮开始绕（画图对照答案图自查）。","(2) W总 = Fs = 500 N × 15 m = 7500 J，P = W/t = 7500/10 = 750 W。","(3) G动 = nF - G = 3×500 - 1200 = 300 N；最大拉力时 Gmax = 3×1000 - 300 = 2700 N。","ηmax = Gmax/(Gmax+G动) = 2700/3000 = 90%。"],"tip":"先由 s 和 h 求 n，再用“动滑轮重不变”求最大效率；η 也可用 G/(G+G动)。","focus":"calc","tags":["滑轮组","功率","机械效率"],"point":"先由 s/h 求 n；动滑轮重不变，用 G/(G+G动) 求最大效率","formulas":[{"f":"n = s/h","m":"15÷5 = 3，绳子从动滑轮开始绕"},{"f":"G动 = nF − G","m":"3×500 − 1200 = 300 N"},{"f":"ηmax = Gmax/(Gmax+G动)","m":"Gmax=3×1000−300=2700 N → η=90%"}],"diff":3}]},{"id":"pk-w5b","name":"第5周_2 · 国庆1（分子与内能·简单机械·热值）","source":"题库/第5周_2.docx","exam":"第5周（国庆1）练习","topics":["分子与内能","机械能","杠杆","滑轮","机械效率","比热容与热值","热机与能量"],"note":"第12题为作图题（3小问：动力臂与阻力示意图、滑轮组绕线、最小动力），答案不唯一，整题 selfCheck 不自动判分，参考答案见 q12-a.png。第13题(3)第二空是文字说理，为便于自动判分改成「选出正确依据」的选择字段，原卷文字答案见 q13-a.png。选择题答案以文末答案表为准（1B 2D 3C 4A 5A 6D 7D 8D 9C）。裁图说明：原卷第5、6、7题的三张图（能量转化图、斜面图、动滑轮F₁/F₂图）在页面上排成一排，整排被裁进 q05.png，因此第6、7题的 askImg 追加了 q05.png 以便学生看到各自图形（图下分别标“第5题/第6题/第7题”）；第7题跨页，原题分为 q07_1.png、q07_2.png 两张。","questions":[{"id":"w5bq01","no":"1","group":"选择","type":"choice","askImg":"图片/pk-w5b/q01.png","ask":"一般情况下固体和液体很难被压缩。这一现象表明（　　）","opts":["分子非常小","分子间存在斥力","分子在永不停息地运动","分子间存在引力"],"ans":1,"ansText":"B","solution":["固体、液体里分子挨得很近，再想往里挤，分子间的斥力就明显表现出来。","“很难被压缩”= 往里挤受到阻碍 → 分子间存在斥力，选 B。","分子小、分子在运动解释的是扩散，解释不了“压不动”；引力是“拉不开”。"],"tip":"难压缩↔斥力，拉不开↔引力，两种力同时存在。","focus":"model","tags":["分子间作用力"],"point":"分子斥力的宏观表现：固体、液体很难被压缩","formulas":[{"f":"难压缩 → 斥力；拉不开/粘住 → 引力","m":"两种力同时存在，看哪个起主要作用"}],"diff":1},{"id":"w5bq02","no":"2","group":"选择","type":"choice","askImg":"图片/pk-w5b/q02.png","ask":"当图中的玻璃板被抽去后，两个瓶子内的颜色逐渐变得均匀，这种现象主要表明（　　）","opts":["分子有一定的质量","分子有一定的大小","分子间有相互作用力","分子在不停地做无规则的运动"],"ans":3,"ansText":"D","solution":["抽去玻璃板后，密度大的气体向上、密度小的气体向下，彼此进入对方，这是扩散现象。","扩散只能说明分子在不停地做无规则运动，选 D。","颜色变均匀不是分子大小、质量的证据，也说明不了引力和斥力。"],"tip":"两种物质“自己混到一起”= 扩散 = 分子在无规则运动。","focus":"model","tags":["扩散现象"],"point":"扩散：两种物质自己混匀，说明分子在不停地做无规则运动","formulas":[{"f":"扩散 = 分子无规则运动 + 分子间有间隙","m":"与密度大小、方向无关，不是「重的沉下去」"}],"diff":1},{"id":"w5bq03","no":"3","group":"选择","type":"choice","askImg":"图片/pk-w5b/q03.png","ask":"关于温度、热量和内能，下列说法正确的是（　　）","opts":["物体吸收热量，温度一定升高","80℃的水一定比30℃的水含有的热量多","温度相同的物体接触时不发生热传递","物体温度升高，内能不一定增加，但一定吸收热量"],"ans":2,"ansText":"C","solution":["A 错：晶体熔化、水沸腾时都在吸热，但温度不变。","B 错：热量是过程量，只能说“吸收/放出多少热量”，不能说“含有多少热量”。","C 对：发生热传递的条件是有温度差，温度相同就不传热。","D 错：温度升高内能一定增加；而且升温也可能是外界对物体做功（如压缩气体），不一定吸热。"],"tip":"温度、热量、内能三个词不能混着用：温度是状态，热量是过程。","focus":"model","tags":["温度热量内能辨析"],"point":"吸热不一定升温；热量是过程量；没有温度差就不传热","formulas":[{"f":"Q = cmΔt","m":"晶体熔化、水沸腾：吸热但 Δt=0，温度不变"},{"f":"热传递条件：存在温度差","m":"温度相同 → 不发生热传递"}],"diff":2},{"id":"w5bq04","no":"4","group":"选择","type":"choice","askImg":"图片/pk-w5b/q04.png","ask":"如图所示，我国在文昌卫星发射中心用长征五号运载火箭将“嫦娥五号”发射升空，下列说法正确的是（　　）","opts":["用液态氢做燃料，原因之一是因为氢的热值大","液态氢在燃烧过程中，将内能转化为化学能","火箭在大气层中加速升空时，能量不守恒","火箭在大气层中加速升空时，动能不变"],"ans":0,"ansText":"A","solution":["同样质量的燃料完全燃烧，氢放出的热量最多，即热值大，所以选液态氢，A 对。","B 错：燃烧是化学能转化为内能（再转化为机械能）。","C 错：能量始终守恒，只是部分机械能变成内能散失，不能再用。","D 错：加速升空速度变大，动能变大，重力势能也变大。"],"tip":"燃料选氢看热值；能量守恒不等于“能量不损失”。","focus":"model","tags":["热值","能量守恒"],"point":"选液氢看热值；燃烧是化学能→内能；能量守恒不等于没有损失","formulas":[{"f":"Q放 = mq","m":"同样质量，q 越大放热越多"},{"f":"能量守恒：E总 不变","m":"守恒 ≠ 无损失，散失的内能不能再用"}],"diff":2},{"id":"w5bq05","no":"5","group":"选择","type":"choice","askImg":"图片/pk-w5b/q05.png","ask":"不同形式的能量可以在一定条件下相互转化，如图给出的实例中，错误的是（　　）","opts":["热机做功冲程","电池甲充电","电池乙供电","植物生长"],"ans":0,"ansText":"A","solution":["先认清每个实例到底是什么转化：热机做功冲程是内能→机械能，充电是电能→化学能，供电是化学能→电能，植物生长是光能→化学能。","图里“热机”那条箭头画在机械能和电能之间（那是发电机/电动机的转化），不是内能和机械能之间，所以 A 错。","电池甲（电能→化学能）、电池乙（化学能→电能）、植物生长（光能→化学能）的箭头方向都对。"],"tip":"热机＝内能→机械能；电能和化学能之间的来回是电池的充放电。","focus":"model","tags":["能量守恒"],"point":"逐个核对每个装置的能量转化方向","formulas":[{"f":"热机：内能 → 机械能","m":"图里画成机械能↔电能，那是发电机/电动机"},{"f":"电池充电：电能→化学能；供电：化学能→电能","m":"植物生长：光能 → 化学能"}],"diff":2},{"id":"w5bq06","no":"6","group":"选择","type":"choice","askImg":["图片/pk-w5b/q06.png","图片/pk-w5b/q05.png"],"ask":"如图所示，工人用平行斜面向上的恒定推力F，将重6N的物体以1m/s的速度匀速推到斜面顶端，斜面长1m，测得斜面的机械效率为75%，斜面的倾斜角度为30°。则下列说法正确的是（　　）","opts":["推力做的功为3J","物体受到的摩擦力为1.5N","物体在匀速上升过程中，速度越快受到的摩擦力越大","若以2m/s的速度匀速推动物体，斜面的机械效率仍为75%"],"ans":3,"ansText":"D","solution":["先求斜面高：h = 1m×sin30° = 0.5m，有用功 W有 = Gh = 6N×0.5m = 3J。","A 把有用功当成推力做的总功了：η = 75% → W总 = 3÷0.75 = 4J，推力 F = W总/s = 4N。","B 错：W额 = W总 - W有 = 4-3 = 1J，由 W额 = fs 得 f = 1N。","C 错：滑动摩擦力只跟压力、接触面粗糙程度有关，与速度无关；D 对：额外功不变，η 仍是 75%。"],"tip":"斜面题的顺序：先 h，再 W有，再由 η 反推 W总，最后 W额 = fs 求摩擦。","focus":"calc","tags":["机械效率","功"],"point":"斜面三连：h=s·sinθ → W有=Gh → 由 η 反推 W总","formulas":[{"f":"h = s·sin30°","m":"1 m×0.5 = 0.5 m"},{"f":"W有 = Gh，W总 = W有/η","m":"3 J ÷ 75% = 4 J（A 把有用功当总功了）"},{"f":"W额 = W总 − W有 = fs → f = W额/s","m":"1 J÷1 m = 1 N；滑动摩擦与速度无关"},{"f":"η 与速度无关","m":"额外功不变 → 2 m/s 时仍是 75%"}],"diff":3},{"id":"w5bq07","no":"7","group":"选择","type":"choice","askImg":["图片/pk-w5b/q07_1.png","图片/pk-w5b/q07_2.png","图片/pk-w5b/q05.png"],"ask":"在使用重为20N的滑轮做如下图所示实验中，竖直匀速向上拉弹簧测力计，弹簧测力计的示数分别是F₁、F₂，不计绳重和绳与轮间的摩擦，则下列说法正确的是（　　）","opts":["该滑轮是定滑轮","F₂ = ½F₁","若钩码匀速上升0.1m，则绳子自由端移动的距离是0.4m","若该滑轮的机械效率为60%，则提升的钩码总重为30N"],"ans":3,"ansText":"D","solution":["滑轮跟钩码一起上升，是动滑轮，A 错。","两个测力计测的是同一根绳的两个端点，张力处处相等（不计摩擦），所以 F₁ = F₂，B 错。","动滑轮 s = 2h = 2×0.1m = 0.2m，C 错。","动滑轮 η = G/(G+G动)：60% = G/(G+20N) → 0.4G = 12N → G = 30N，D 对。"],"tip":"动滑轮 s = 2h；η = G/(G+G动) 里 G 是物重，别把滑轮重算进有用功。","focus":"calc","tags":["定滑轮与动滑轮","机械效率"],"point":"动滑轮 s=2h；效率用 η=G/(G+G动)，别把 G动 算进有用功","formulas":[{"f":"同一根绳张力处处相等：F₁ = F₂","m":"不计绳重和摩擦"},{"f":"s = 2h","m":"h=0.1 m → s=0.2 m，不是 0.4 m"},{"f":"η = G/(G+G动)","m":"0.6 = G/(G+20) → G = 30 N"}],"diff":3},{"id":"w5bq08","no":"8","group":"选择","type":"choice","askImg":"图片/pk-w5b/q08.png","ask":"如图甲所示为停车场的电子闸杆，其结构图如图乙所示，闸杆和摇杆组成一根可绕转轴O转动的杠杆，闸杆质量分布均匀，摇杆质量不计，当力F作用于A点时，闸杆恰好能够向上转动，关于此瞬间，下列说法正确的是（　　）","opts":["此装置可视为省力杠杆","力F的力臂一定为OA","闸杆重力的力臂为OB","当力F垂直OA向下时，F有最小值"],"ans":3,"ansText":"D","solution":["看图乙：动力 F 作用在短臂 OA 上，阻力（闸杆重）作用在长臂 OB 一侧，动力臂短、阻力臂长 → 费力杠杆，A 错。","力臂是支点到力的作用线的距离，F 不垂直 OA 时力臂比 OA 小，B 说“一定为 OA”错。","闸杆质量均匀，重心在闸杆中点，重力的力臂约为 OB 的一半（杠杆水平时），C 错。","F 作用在 A 点，力臂最大只能到 OA；F⊥OA 时力臂最长、F 最小，D 对。"],"tip":"力臂由“力的方向”决定，垂直时力臂最大、力最小。","focus":"rule","tags":["最小力","杠杆五要素"],"point":"力臂由力的方向决定：垂直时力臂最大、力最小","formulas":[{"f":"F₁l₁ = F₂l₂","m":"F⊥OA 时 l₁ = OA 最大 → F 最小"},{"f":"力臂 = 支点 O 到力的作用线的垂线段","m":"F 不垂直 OA 时 l₁ < OA，B 的「一定」不成立"}],"diff":3},{"id":"w5bq09","no":"9","group":"选择","type":"choice","askImg":"图片/pk-w5b/q09.png","ask":"如图所示，在两个相同的烧杯中，分别装有质量、初温都相同的甲、乙两种物质，用同一热源对其加热，两物质在相同的时间内吸收相同的热量。用电子温度计分别测量两物质的温度，实验数据记录如表。则下列说法正确的是（　　）","opts":["热源通过做功的方式改变两种物质的内能","甲物质的比热容比乙物质的小","若杯中甲物质和乙物质吸收了相同的热量，则乙升高的温度更多","杯中乙物质升温10℃所吸收的热量比甲物质升温5℃所吸收的热量要多"],"ans":2,"ansText":"C","solution":["加热是用热传递改变内能，不是做功，A 错。","读表：同样升温 5℃，甲要 30s、乙只要 15s，说明乙吸热少、升温快 → 乙的比热容更小，B 说反了。","同质量、同热量时 Δt = Q/(cm)，c 小的乙升温更多，C 对。","乙升温 10℃ 用 30s，甲升温 5℃ 也用 30s，两者吸热一样多，D 错。"],"tip":"同一热源：加热时间相同 = 吸热相同；比热容小的升温快。","focus":"rule","tags":["比热容","热量计算"],"point":"同一热源：加热时间相同就是吸热相同；c 小的升温快","formulas":[{"f":"Q = Pt（同热源、同时间 → 同 Q）","m":"甲 30 s、乙 15 s 都升 5℃"},{"f":"Δt = Q/(cm)","m":"c 越小 Δt 越大 → 同热量下乙升温更多"}],"diff":2},{"id":"w5bq10","no":"10","group":"填空","type":"fill","askImg":"图片/pk-w5b/q10.png","ansImg":"图片/pk-w5b/q10-a.png","ask":"如图所示，OA为一轻质杠杆，OB长0.2m，AB长0.4m，重物的重力G=60N，拉力F作用在A点上，当杠杆水平平衡时，拉力为______N；保持拉力F与杠杆垂直，杠杆缓慢地由A位置放至C位置，此过程中拉力F将______（填“变大”、“变小”或“不变”）。","fields":[{"type":"num","label":"杠杆水平平衡时拉力 F =","ans":20,"unit":"N","tol":0.01},{"type":"choice","label":"由 A 放到 C 的过程中拉力 F 将","options":["变大","变小","不变"],"ans":1}],"ansText":"20 N；变小","solution":["支点是 O：阻力是 G=60N（作用在 B），动力是 F（作用在 A）。","水平平衡：阻力臂 l₂ = OB = 0.2m，动力臂 l₁ = OA = OB+AB = 0.6m，F×0.6 = 60×0.2 → F = 20N。","往下放的过程中 F 始终与杆垂直，动力臂不变（0.6m），但重力作用线到 O 的垂直距离（阻力臂）变小。","阻力×阻力臂变小，动力臂不变 → F 变小。"],"tip":"力臂是支点到力的作用线的距离：F 与杆垂直时动力臂才等于 OA。","focus":"calc","tags":["杠杆平衡条件","杠杆动态平衡"],"point":"F 与杆垂直 → 动力臂不变；杆放平过程中阻力臂变小 → F 变小","formulas":[{"f":"F·OA = G·OB","m":"OA=0.2+0.4=0.6 m、OB=0.2 m、G=60 N → F=20 N"},{"f":"F = G·l₂/l₁","m":"l₁ 不变、l₂ 变小 → F 变小"}],"diff":2},{"id":"w5bq11","no":"11","group":"填空","type":"fill","askImg":"图片/pk-w5b/q11.png","ansImg":"图片/pk-w5b/q11-a.png","ask":"用如图所示的滑轮组将重为360N的物体匀速提升3m，已知动滑轮重为40N。不计绳重和摩擦，作用在绳端上的拉力为______N，绳端移动的距离为______m。","fields":[{"type":"num","label":"绳端拉力 F =","ans":200,"unit":"N","tol":0.01},{"type":"num","label":"绳端移动的距离 s =","ans":6,"unit":"m","tol":0.01}],"ansText":"200 N；6 m","solution":["先数承担物重的绳子段数：由图得 n = 2。","F = (G+G动)/n = (360+40)/2 = 200N。","s = nh = 2×3m = 6m。"],"tip":"先数 n：跟动滑轮相连的绳子有几段，n 就是几。","focus":"calc","tags":["滑轮组"],"point":"先数承担物重的绳子段数 n，再用 F=(G+G动)/n、s=nh","formulas":[{"f":"F = (G+G动)/n","m":"(360+40)÷2 = 200 N"},{"f":"s = nh","m":"2×3 m = 6 m"}],"diff":2},{"id":"w5bq12","no":"12","group":"解答","type":"selfcheck","askImg":"图片/pk-w5b/q12.png","ansImg":"图片/pk-w5b/q12-a.png","ask":"（1）如图甲所示，活塞式抽水机AOB部分可视为杠杆，O为支点，请画出作用在手柄A点动力F₁的动力臂L₁和B点所受阻力F₂的示意图。（2）如图乙所示，工人用滑轮组提升材料，按要求完成作图。（3）如图丙所示，AC为轻质杠杆，O为支点，在B点处挂一个铁球，请画出杠杆在图示位置平衡时受到的阻力F₂和最小动力F₁。","solution":["(1) 动力臂 L₁：从支点 O 向 F₁ 的作用线作垂线段，标出垂足和 L₁；B 点的阻力 F₂ 是水对活塞的阻力，方向沿活塞向下（与动力方向相反），画在 B 点。","(2) 滑轮组绕线：按题目要求的绳段数 n（图乙中“按要求”给出的 n），绳子一端系在定滑轮（或动滑轮）挂钩上，依次绕过动、定滑轮，最后从定滑轮引出、方向向下由人拉动。","(3) 阻力 F₂：铁球重力竖直向下，作用在 B 点；最小动力 F₁：作用点取离支点最远的 C 点，方向与 OC 垂直，使杠杆能平衡（画成向上）。","画完自查：力臂必须画成垂线段；最小动力一定对应最长力臂。"],"tip":"力臂是“支点到力的作用线”的垂线段，不是画到作用点；最小力配最长力臂。","focus":"model","tags":["杠杆五要素","最小力","滑轮组"],"point":"作图：力臂画垂线段，最小力配最长力臂","formulas":[{"f":"最小力：作用点取离支点最远的 C，F ⊥ OC","m":"此时力臂 = OC 最长"},{"f":"力臂 = O 到力的作用线的垂线段","m":"不是画到作用点的连线；直角符号不能少"}],"diff":3,"selfCheck":true},{"id":"w5bq13","no":"13","group":"实验","type":"fill","askImg":"图片/pk-w5b/q13.png","ansImg":"图片/pk-w5b/q13-a.png","ask":"为了比较不同物质的比热容，小冰利用规格相同的电加热器给质量相同的A和B液体加热，如图甲所示。她利用实验得到的数据绘制出两种液体温度随加热时间的变化图像，如图乙所示。相同时间两种液体吸收的热量相同。(1)根据图乙中的实验数据可知：实验需用到的测量工具有______和______；(2)当A和B两种液体升高的温度相同时，______（选填“A”或“B”）液体吸收的热量更多；(3)分析图乙可知______（选填“A”或“B”）的比热容更大，你的依据是：______；(4)“暖手宝”中装的储热液应该选______（选填“A”或“B”）。","fields":[{"type":"text","label":"(1) 测量工具（计时用）","ans":["秒表","停表","计时器"],"mode":"contains"},{"type":"text","label":"(1) 测量工具（测温用）","ans":["温度计"],"mode":"contains"},{"type":"choice","label":"(2) 升高相同温度时吸热更多的液体","options":["A","B"],"ans":1},{"type":"choice","label":"(3) 比热容更大的液体","options":["A","B"],"ans":1},{"type":"choice","label":"(3) 判断依据","options":["质量相同、升高相同温度时，B 的加热时间更长（吸收热量更多）","质量相同、升高相同温度时，A 的加热时间更长（吸收热量更多）"],"ans":0},{"type":"choice","label":"(4) 暖手宝储热液应选","options":["A","B"],"ans":1}],"ansText":"(1) 秒表；温度计；(2) B；(3) B（质量相等、升高相同温度时 B 加热时间更长，吸热更多）；(4) B","solution":["实验要记录“加热了多长时间”和“温度升高了多少”，所以除加热器外还要秒表和温度计。","图乙：都从 10℃ 升到 30℃ 时，B 用了更长时间 → 吸收的热量更多。","由 c = Q/(mΔt)：m、Δt 相同时，吸热多的 B 比热容更大。","暖手宝要“装热多、放热久”，选比热容大的 B。"],"tip":"同一热源、相同时间吸热相同；比的是“升高同样温度谁花的时间长”。","focus":"rule","tags":["比热容","实验探究","热量计算"],"point":"同热源同时间吸热相同；升高同样温度谁花时间长，谁的比热容大","formulas":[{"f":"c = Q/(mΔt)","m":"m、Δt 相同 → 吸热多的 B 比热容大"},{"f":"暖手宝选 c 大的液体","m":"同样降温能放出更多热量、保温更久"}],"diff":3},{"id":"w5bq14","no":"14","group":"解答","type":"solve","askImg":"图片/pk-w5b/q14.png","ansImg":"图片/pk-w5b/q14-a.png","ask":"如图所示，工人师傅要将重为1000N的木箱拉到1.5m高的车厢里，他将一块5m长的木板搁在地面与车厢之间构成斜面，然后站在车上用400N的拉力将物体从斜面底端匀速拉到车厢里，用时20s，求：(1)工人拉动木箱的速度；(2)工人做功的功率；(3)斜面的摩擦力；(4)该斜面的机械效率。(5)若工人想更省力，换用了一块8m长的木板搭成斜面（车厢高度不变）。当他用300N的拉力也能将木箱匀速拉到车厢时，求此时斜面的机械效率。","fields":[{"type":"num","label":"(1) 木箱的速度 v =","ans":0.25,"unit":"m/s","tol":0.001},{"type":"num","label":"(2) 工人做功的功率 P =","ans":100,"unit":"W","tol":0.5},{"type":"num","label":"(3) 斜面的摩擦力 f =","ans":100,"unit":"N","tol":0.5},{"type":"num","label":"(4) 斜面的机械效率 η =","ans":75,"unit":"%","tol":0.5},{"type":"num","label":"(5) 换 8m 木板后的机械效率 η′ =","ans":62.5,"unit":"%","tol":0.5}],"ansText":"(1) 0.25 m/s；(2) 100 W；(3) 100 N；(4) 75%；(5) 62.5%","solution":["(1) v = s/t = 5m ÷ 20s = 0.25 m/s。","(2) W总 = Fs = 400N×5m = 2000J，P = W总/t = 2000÷20 = 100W。","(3) W有 = Gh = 1000N×1.5m = 1500J，W额 = W总 - W有 = 500J，由 W额 = fs 得 f = 500÷5 = 100N。","(4) η = W有/W总 = 1500/2000 = 75%。","(5) 换 8m 木板：W总′ = 300N×8m = 2400J，W有 仍是 1500J，η′ = 1500/2400 = 62.5%。"],"tip":"斜面越缓越省力，但要多推一段距离，额外功变大，机械效率反而降低。","focus":"calc","tags":["机械效率","功","功率"],"point":"斜面五问：v → W总 → f → η；换更长的板要重新算总功","formulas":[{"f":"v = s/t","m":"5 m ÷ 20 s = 0.25 m/s"},{"f":"W总 = Fs，P = W总/t","m":"2000 J，100 W"},{"f":"W额 = W总 − Gh，f = W额/s","m":"500 J → f = 100 N"},{"f":"η = Gh/(Fs)","m":"1500/2000=75%；8 m 板：1500/2400=62.5%"}],"diff":3},{"id":"w5bq15","no":"15","group":"解答","type":"solve","askImg":"图片/pk-w5b/q15.png","ansImg":"图片/pk-w5b/q15-a.png","ask":"某燃气热水器的技术参数如表所示，“额定耗气量”的含义是：热水器正常工作1h消耗的燃气体积。某次洗浴，燃气热水器以额定耗气量正常工作1h，将质量为400kg的水的水温升高30℃。[c水=4.2×10³ J/(kg·℃)；表中天然气热值 3×10⁷ J/m³、额定耗气量 1.8m³/h](1)求该过程中水吸收的热量是多少？(2)若该过程燃气完全燃烧，放出的热量为多少？(3)能效等级是根据热效率来划分的，其中三级能效的热效率≥84%，二级能效的热效率≥89%，一级能效的热效率≥98%。请根据计算判断该燃气热水器属于哪一级能效？（热效率结果保留整数）","fields":[{"type":"num","label":"(1) 水吸收的热量 Q吸 =","ans":50400000,"unit":"J","tol":100000},{"type":"num","label":"(2) 燃气完全燃烧放出的热量 Q放 =","ans":54000000,"unit":"J","tol":100000},{"type":"choice","label":"(3) 该热水器的能效等级","options":["一级能效","二级能效","三级能效"],"ans":1}],"ansText":"(1) 5.04×10⁷ J；(2) 5.4×10⁷ J；(3) 二级能效（η≈93%）","solution":["(1) Q吸 = cmΔt = 4.2×10³ J/(kg·℃)×400kg×30℃ = 5.04×10⁷ J。","(2) 天然气给的是热值（J/m³），1h 烧 1.8m³：Q放 = qV = 3×10⁷×1.8 = 5.4×10⁷ J。","(3) η = Q吸/Q放 = 5.04×10⁷ ÷ 5.4×10⁷ ≈ 93.3%，取整 93%。","89% ≤ 93% < 98% → 二级能效。"],"tip":"气体燃料的热值单位是 J/m³，要用 Q放 = qV，别当成 qm。","focus":"calc","tags":["热量计算","热值","热机效率"],"point":"气体燃料用 Q放=qV；η=Q吸/Q放 再对能效等级","formulas":[{"f":"Q吸 = cmΔt","m":"4.2×10³×400×30 = 5.04×10⁷ J"},{"f":"Q放 = qV","m":"3×10⁷×1.8 = 5.4×10⁷ J（不是 qm）"},{"f":"η = Q吸/Q放","m":"≈93% → 二级能效（89%≤η<98%）"}],"diff":3}]},{"id":"pk-w6","name":"第6周 · 分子热运动与机械能（杠杆·滑轮·热机效率）","source":"题库/第6周.docx","exam":"第6周练习","topics":["分子与内能","机械能","杠杆","滑轮","机械效率","热机与能量","实验探究"],"note":"选择题答案以文末答案表为准（1A 2A 3A 4A 5D 6C 7D 8B）。第9题(2)原卷为文字表述“水的比热容的物理意义”，为便于自动判分改成“选出正确含义”的选择字段，原卷文字答案见 q09-a.png（2.1×10³ J/(kg·℃)；质量为1kg的水温度升高（或降低）1℃时吸收（或放出）的热量为4.2×10³J）。第11题(3)、第12题(1)(2)(3)(5) 的答案图若为表格/式子的截图，数值以原卷为准。","questions":[{"id":"w6q01","no":"1","group":"选择","type":"choice","askImg":"图片/pk-w6/q01.png","ask":"如图所示是课本中的两个演示实验：图甲将两个底面削平、削干净的铅块紧紧压在一起，下面吊上重物也不能把它们拉开；图乙把一块干净的玻璃板水平接触水面，稍稍用力向上拉弹簧测力计，在玻璃板离开水面之前，测力计示数明显变大。关于这两个实验，下列说法正确的是（　　）","opts":["图甲说明分子之间存在引力","图乙中测力计示数变大，说明分子在不停地做无规则运动","两个实验共同说明分子之间只存在引力、不存在斥力","图甲中两铅块结合后，铅块内部的分子便停止运动"],"ans":0,"ansText":"A","solution":["铅块压紧后能吊住重物，说明接触面上的分子之间有引力，A 对。","B 错：玻璃板示数变大是因为玻璃板与水分子之间有引力，不是分子运动。","C 错：引力和斥力同时存在，只是这时引力起主要作用。","D 错：分子永不停息地做无规则运动，任何温度下都不会停止。"],"tip":"“拉不开/拉不动”↔引力；“压不进/很难压缩”↔斥力。","focus":"model","tags":["分子间作用力"],"point":"引力与斥力同时存在，看谁在这里起主要作用","formulas":[{"f":"拉不开 / 示数变大 → 引力起主要作用","m":"不是「只有引力」"},{"f":"分子永不停息地做无规则运动","m":"任何温度下都不停止"}],"diff":2},{"id":"w6q02","no":"2","group":"选择","type":"choice","askImg":"图片/pk-w6/q02.png","ask":"小明在学校实验室做化学实验时，发现放置在一旁的浓氨水和无色酚酞溶液没有直接接触，但纸花却逐渐变红，这一现象表明（　　）","opts":["分子在不停地做无规则运动","分子间存在斥力","分子间存在引力","分子可以用肉眼观察"],"ans":0,"ansText":"A","solution":["氨水和酚酞没有接触，纸花却变红，说明氨气分子“自己跑”到了纸花上。","这就是扩散现象，说明分子在不停地做无规则运动，选 A。","引力和斥力解释不了“没接触也跑过去”；分子用肉眼也看不见，D 错。"],"tip":"没有接触却互相“串味/变色”＝扩散＝分子在无规则运动。","focus":"model","tags":["扩散现象","分子动理论"],"point":"没有接触却「串」过去变色，就是扩散","formulas":[{"f":"扩散 = 分子无规则运动 + 分子间有间隙","m":"氨气分子自己跑到纸花上"}],"diff":1},{"id":"w6q03","no":"3","group":"选择","type":"choice","askImg":"图片/pk-w6/q03.png","ask":"飞行员驾驶滑翔机在山林上空沿倾斜直线匀速向下滑翔，此过程中滑翔机受到空气阻力作用，飞行时总质量保持不变，下列关于机械能变化与能量转化的判断正确的是（　　）","opts":["动能不变，重力势能减小，一部分机械能转化为内能","动能减小，重力势能减小，一部分内能转化为机械能","动能不变，重力势能增大，一部分机械能转化为内能","动能增大，重力势能不变，一部分内能转化为机械能"],"ans":0,"ansText":"A","solution":["“匀速” → 速度不变 → 动能不变；“向下” → 高度降低 → 重力势能减小。","机械能 = 动能 + 势能，势能减小而动能不变，所以机械能减小。","减小的机械能是克服空气阻力做功，转化成了内能（滑翔机表面变热），A 对。"],"tip":"看“匀速/加速”定动能，看“上升/下降”定势能，再判断机械能增减。","focus":"model","tags":["机械能转化","动能与势能"],"point":"匀速定动能、下降定势能；减小的机械能变成内能","formulas":[{"f":"Ek = ½mv²","m":"匀速 → Ek 不变"},{"f":"Ep = mgh","m":"下降 → Ep 减小"},{"f":"E机 = Ek + Ep → 减小","m":"克服空气阻力做功，机械能转化为内能"}],"diff":2},{"id":"w6q04","no":"4","group":"选择","type":"choice","askImg":"图片/pk-w6/q04.png","ask":"用实验室的液体温度计测量热水温度，液柱上升过程中，关于温度计内液体说法正确的是（　　）","opts":["质量不变","体积变小","密度变大","内能变小"],"ans":0,"ansText":"A","solution":["温度计里的液体没多也没少，质量不变，A 对。","吸热后液体膨胀，体积变大，B 错；由 ρ = m/V 得密度变小，C 错。","温度升高，分子运动更剧烈，内能变大，D 错。"],"tip":"热胀冷缩改的是体积和密度；质量、内能要单独判断（质量不变、内能变大）。","focus":"model","tags":["内能","分子动理论"],"point":"热胀冷缩只改体积和密度；质量不变、温度升则内能增","formulas":[{"f":"ρ = m/V","m":"V 变大 → ρ 变小"},{"f":"T ↑ → 内能 ↑","m":"液体没有增减，质量 m 不变"}],"diff":1},{"id":"w6q05","no":"5","group":"选择","type":"choice","askImg":"图片/pk-w6/q05.png","ask":"质量和初温相等的铜块和铁块（c铜<c铁），在放出相等的热量后相互接触，那么（　　）","opts":["能量由铜块传给铁块","温度由铜块传给铁块","铜块和铁块之间不发生热传递","以上说法均不正确"],"ans":3,"ansText":"D","solution":["由 Q = cmΔt 变形得 Δt = Q/(cm)：m、Q 相同时，比热容小的铜降温更多。","初温相同、铜降得多 → 铜的末温更低，接触时热量由铁块传给铜块，A 说反了。","传递的是“热量”，不是“温度”，B 说法本身就不对；有温度差就会传热，C 错。","所以 A、B、C 都不对，选 D。"],"tip":"比热容小的温度变得快：放同样热量，它降温多。","focus":"calc","tags":["热量计算","比热容"],"point":"比热容小的温度变得快：放同样热量降温更多","formulas":[{"f":"Δt = Q/(cm)","m":"c铜<c铁 → 铜降温更多 → 铜末温更低"},{"f":"热传递：高温 → 低温，传递的是热量","m":"不是「传递温度」，B 的说法本身就不对"}],"diff":3},{"id":"w6q06","no":"6","group":"选择","type":"choice","askImg":"图片/pk-w6/q06.png","ask":"如图所示，将活塞拔出，向注射器内喷入少量酒精，再塞上活塞，然后将电子点火器的两个电极从针孔插入注射器中，用胶密封接口。按动点火器，雾化的酒精被点燃，活塞被迅速推出。汽油机的四个冲程中能量转化方式与上述过程相同的是（　　）","opts":["吸气冲程","压缩冲程","做功冲程","排气冲程"],"ans":2,"ansText":"C","solution":["酒精燃烧产生高温高压的燃气，把活塞推出去 → 内能转化为机械能。","汽油机中内能转化为机械能的是做功冲程（燃气推动活塞向下），选 C。","压缩冲程正好相反：活塞压缩气体，机械能转化为内能。"],"tip":"“燃气把活塞推出去”＝做功冲程＝内能→机械能。","focus":"model","tags":["内能","能量守恒"],"point":"燃气把活塞推出去 = 做功冲程 = 内能→机械能","formulas":[{"f":"做功冲程：内能 → 机械能","m":"压缩冲程相反：机械能 → 内能"}],"diff":2},{"id":"w6q07","no":"7","group":"选择","type":"choice","askImg":"图片/pk-w6/q07.png","ask":"小夏为健康饮食，查阅到每100 g牛里脊含有约120千卡路里，每100 g牛腩肉含有约350千卡路里，这两种食材的区别类似于下列哪个物理量不同（　　）","opts":["质量","热量","比热容","热值"],"ans":3,"ansText":"D","solution":["120/350 千卡说的是“同样 100 g 完全分解放出多少能量”，即单位质量能放出多少能量。","这正是热值的含义（1 kg 燃料完全燃烧放出的热量），只是燃料换成了食物，选 D。","热量是过程量，不能说食物“含有多少热量”，B 错；比热容管的是升温快慢，C 错。"],"tip":"“每千克放出多少能量”＝热值；“升高1℃吸多少热”＝比热容。","focus":"model","tags":["热值"],"point":"「每千克放出多少能量」是热值，不是比热容","formulas":[{"f":"热值 q：1 kg 完全燃烧放出的热量","m":"食物用「每 100 g 多少千卡」表达同一含义"},{"f":"比热容 c：1 kg 升高 1℃ 吸收的热量","m":"管的是升温快慢，不是放能多少"}],"diff":2},{"id":"w6q08","no":"8","group":"选择","type":"choice","askImg":"图片/pk-w6/q08.png","ask":"一个半径为R的半球形容器内部放置一根长度为2R的质量均匀的细杆，细杆重为2N，其截面图如图所示。已知接触点B处细杆受到的弹力与杆垂直，接触点A与圆心O的连线与杆的夹角为30°。求出接触点B处细杆所受的弹力F为（　　）","opts":["0.5N","1N","2N","3N"],"ans":1,"ansText":"B","solution":["把细杆当成杠杆，取 A 为支点：A 处弹力就作用在支点上，力臂为零，不用管它。","B 处弹力与杆垂直，力臂就是 AB。由 OA = OB = R、∠OAB = 30°，得 AB = 2R·cos30° = √3R。","重力 2N 作用在杆的中点（离 A 为 R），杆与竖直方向夹角 60°，重力力臂 = R·sin60° = (√3/2)R。","平衡：F·√3R = 2N·(√3/2)R → F = 1N，选 B。"],"tip":"支点选在“力的方向未知”的 A 点，那个力就不出现在力矩方程里。","focus":"rule","tags":["杠杆平衡条件","杠杆五要素"],"point":"支点选在方向未知的 A 处，这个力就不进力矩方程","formulas":[{"f":"F·AB = G·lG（对 A 取矩）","m":"AB = 2R·cos30° = √3R；lG = R·sin60° = (√3/2)R"},{"f":"F = G·lG/AB","m":"2×(√3/2)÷√3 = 1 N"}],"diff":3},{"id":"w6q09","no":"9","group":"填空","type":"fill","askImg":"图片/pk-w6/q09.png","ansImg":"图片/pk-w6/q09-a.png","ask":"质量均为100g的四种物质，当温度升高1℃时所吸收的热量如图所示（水420J、煤油210J、铝88J、铜39J）。煤油的比热容为______；水的比热容为4.2×10³ J/(kg·℃)的物理意义：______。","fields":[{"type":"num","label":"煤油的比热容 c =","ans":2100,"unit":"J/(kg·℃)","tol":20},{"type":"choice","label":"水的比热容 4.2×10³ J/(kg·℃) 的物理意义","options":["质量为1kg的水，温度每升高（或降低）1℃，吸收（或放出）的热量为4.2×10³ J","质量为1kg的水，温度每升高1℃只需吸收4.2 J的热量","质量为4.2×10³kg的水，温度每升高1℃吸收1 J的热量"],"ans":0}],"ansText":"2.1×10³ J/(kg·℃)（即 2100）；1 kg 水温度升高（或降低）1℃ 吸收（或放出）的热量为 4.2×10³ J","solution":["读图：煤油的柱高是 210 J，即 100 g 煤油升高 1℃ 吸热 210 J。","m = 100g = 0.1kg，由 c = Q/(mΔt) = 210 ÷ (0.1×1) = 2100 = 2.1×10³ J/(kg·℃)。","比热容的物理意义：1 kg 某物质温度升高（或降低）1℃ 吸收（或放出）的热量，所以水是 4.2×10³ J。"],"tip":"100g 要换成 0.1kg，漏了这个换算会让比热容算成 10 倍。","focus":"calc","tags":["比热容","热量计算"],"point":"c=Q/(mΔt)，100 g 必须先换成 0.1 kg","formulas":[{"f":"c = Q/(mΔt)","m":"210 ÷ (0.1×1) = 2100 = 2.1×10³ J/(kg·℃)"},{"f":"物理意义：1 kg 升高（降低）1℃ 吸收（放出）的热量","m":"水是 4.2×10³ J/(kg·℃)"}],"diff":3},{"id":"w6q10","no":"10","group":"填空","type":"fill","askImg":"图片/pk-w6/q10.png","ansImg":"图片/pk-w6/q10-a.png","ask":"如图所示是某辆汽车汽油机的能量流向图（燃料燃烧放出的热量100%，其中废气33%、冷却水30%、摩擦与辐射7%），由图可知该汽油机的效率为______，汽油机工作消耗0.5kg的汽油可以对外输出______J的有用功（q汽油=4.6×10⁷ J/kg）。当汽油在发动机内燃烧不充分时会冒“黑烟”，这时发动机的效率______（选填“升高”“降低”或“不变”）。","fields":[{"type":"num","label":"该汽油机的效率 η =","ans":30,"unit":"%","tol":0.5},{"type":"num","label":"0.5kg 汽油对外输出的有用功 W有用 =","ans":6900000,"unit":"J","tol":100000},{"type":"choice","label":"冒“黑烟”时发动机的效率","options":["升高","降低","不变"],"ans":1}],"ansText":"30%；6.9×10⁶ J；降低","solution":["流向图里废气 33%、冷却水 30%、摩擦与辐射 7% 都是损失，有用功占 100%-33%-30%-7% = 30%。","W有用 = η·Q放 = 30% × (0.5kg×4.6×10⁷ J/kg) = 0.3×2.3×10⁷ = 6.9×10⁶ J。","燃烧不充分时同样多的汽油放热变少、有用功占比更小 → 效率降低。"],"tip":"先把百分比加起来求有用功那部分；算 Q放 时别漏了质量 0.5kg。","focus":"calc","tags":["热机效率","热值"],"point":"流向图用 100% 减各项损失得有用功占比；W有用=ηQ放","formulas":[{"f":"η = 100% − 33% − 30% − 7%","m":"= 30%"},{"f":"Q放 = mq，W有用 = ηQ放","m":"0.5×4.6×10⁷=2.3×10⁷ → 6.9×10⁶ J"},{"f":"燃烧不充分 → η 降低","m":"同质量放热变少，有用功占比更小"}],"diff":3},{"id":"w6q11","no":"11","group":"解答","type":"solve","askImg":"图片/pk-w6/q11.png","ansImg":"图片/pk-w6/q11-a.png","ask":"如图甲为塔式起重机简易示意图，塔式起重机主要用于房屋建筑中材料的输送及建筑构件的安装（动滑轮重、绳重及摩擦不计，g取10N/kg），请你综合应用所学知识解答下列问题：(1)为保持平衡，起重臂的长度越长的塔式起重机，配备的平衡重的质量应越______。图乙为起重机钢丝绳穿绳简化示意图，若钢丝绳能承受的最大拉力为3×10⁴N，则能吊起货物的质量超过______kg时钢丝绳有断裂风险；(2)若将重为1.2×10⁴N的建材由地面沿竖直方向匀速提升30m，再沿水平方向移动20m，则此过程中，求提升建材做的有用功；(3)若该起升电动机的效率为90%，将重为1.2×10⁴N的建材由地面沿竖直方向匀速提升30m，用时50s，则该起升电动机做的总功为______J，实际功率为______W。"," 3","group":"解答","type":"solve","askImg":"图片/pk-w9/q13.png","ansImg":"图片/pk-w9/q13-a.png","ask":"工地上一台起重机吊臂的滑轮组，在50s内将重为2.4×10⁴N的钢材匀速提高10m。不计滑轮摩擦和绳重，已知拉力F为10⁴N，则这个过程中：(1)拉力F的功率多大？(2)如果提升5.4×10⁴N重物，滑轮组效率为多少？","fields":[{"type":"num","label":"(1)拉力F的功率 P =","ans":6000,"unit":"W","tol":10},{"type":"num","label":"(2)滑轮组的机械效率 η =","ans":90,"unit":"%","tol":0.5}],"ansText":"(1) 6×10³ W；(2) 90%","solution":["先数 n：有3段绳子吊着动滑轮 ⇒ s=nh=3×10=30m","P=Fv=F·s/t=10⁴×30/50=6×10³ W","W有用=Gh=2.4×10⁴×10=2.4×10⁵ J，W总=Fs=10⁴×30=3×10⁵ J ⇒ η=80%","G动=nF−G=3×10⁴−2.4×10⁴=6×10³ N；提升5.4×10⁴N时：η'=G'/(G'+G动)=5.4×10⁴/(6×10⁴)=90%"],"tip":"同一个滑轮组 G动 不变，所以 η=G/(G+G动)，提升越重效率越高","focus":"calc","tags":["功率","机械效率","滑轮组"],"point":"先由 n 求 s 和功率；G动 不变，再用 η=G/(G+G动)","formulas":[{"f":"s = nh，P = Fs/t","m":"s=30 m → P=6×10³ W"},{"f":"η = Gh/(Fs)","m":"2.4×10⁵ ÷ 3×10⁵ = 80%"},{"f":"G动 = nF − G","m":"3×10⁴ − 2.4×10⁴ = 6×10³ N"},{"f":"η′ = G′/(G′+G动)","m":"5.4×10⁴ ÷ 6×10⁴ = 90%"}],"diff":3},{"id":"w9q14","no":"14","group":"填空","type":"fill","askImg":"图片/pk-w9/q14.png","ansImg":"图片/pk-w9/q14-a.png","ask":"用弹簧测力计、吊车、铁笼和一根长10m且质量分布均匀的槽钢称大象质量。(1)槽钢悬吊点O为支点，动力臂l₁=9m、阻力臂l₂=1m，槽钢在水平位置平衡时弹簧测力计示数为200N。若不计槽钢和铁笼的质量，大象的质量约为______kg；若在5s内使大象上升1cm，测力计始终保持竖直，拉力F₁做功的功率为______W（g取10N/kg）。(2)如果要考虑槽钢和铁笼的质量，称象前应做的准备工作是：先在槽钢上______（选填“挂上铁笼”或“取下铁笼”），调节槽钢悬挂点O的位置，使______，然后将大象放进铁笼。(3)测槽钢质量：拉力传感器竖直作用在杆上使杆保持水平平衡，拉力F与作用点到O点距离x的关系如图2，则槽钢质量为______kg。(4)铁笼质量49kg，弹簧测力计最大测量值500N，则(2)中悬挂点O到点B的距离为______m，用此方法能称出的大象最大质量为______t。","fields":[{"type":"num","label":"(1)大象的质量 m =","ans":180,"unit":"kg","tol":1},{"type":"num","label":"(1)拉力F₁做功的功率 P =","ans":3.6,"unit":"W","tol":0.05},{"type":"text","label":"(2)称象前先在槽钢上","ans":["挂上铁笼"],"mode":"contains"},{"type":"text","label":"(2)调节O点的目的","ans":["槽钢在水平位置平衡","水平位置平衡","水平平衡"],"mode":"contains"},{"type":"num","label":"(3)槽钢的质量 m钢 =","ans":1,"unit":"kg","tol":0.01},{"type":"num","label":"(4)O到B的距离 =","ans":0.1,"unit":"m","tol":0.001},{"type":"num","label":"(4)能称出的最大质量 =","ans":4.95,"unit":"t","tol":0.01}],
