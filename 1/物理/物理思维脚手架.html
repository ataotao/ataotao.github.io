:2},{"id":"c-lever-08","topic":"杠杆","tags":["杠杆平衡条件"],"type":"choice","q":"杠杆平衡时，动力臂是阻力臂的 3 倍，则动力是阻力的：","opts":["3 倍","1/3","1/2","1 倍"],"ans":1,"why":"由 F₁l₁ = F₂l₂ 得动力 = 阻力×阻力臂/动力臂，所以是阻力的 1/3。","diff":2},{"id":"c-lever-09","topic":"杠杆","tags":["杠杆平衡条件"],"type":"judge","q":"判断：杠杆平衡时，杠杆一定处于水平位置。","ans":false,"why":"平衡指静止或匀速转动，不一定是水平的；实验调水平只是为了方便读力臂。","diff":2},{"id":"c-lever-10","topic":"杠杆","tags":["杠杆分类"],"type":"choice","q":"下列杠杆中属于省力杠杆的是：","opts":["筷子","钓鱼竿","羊角锤","托盘天平"],"ans":2,"why":"羊角锤的动力臂大于阻力臂，省力；筷子、钓鱼竿费力，天平是等臂杠杆。","diff":1},{"id":"c-lever-11","topic":"杠杆","tags":["杠杆分类"],"type":"choice","q":"托盘天平属于：","opts":["省力杠杆","费力杠杆","等臂杠杆","轮轴"],"ans":2,"why":"天平的动力臂等于阻力臂，是等臂杠杆，不省力也不省距离。","diff":1},{"id":"c-lever-12","topic":"杠杆","tags":["杠杆分类"],"type":"judge","q":"判断：费力杠杆虽然费力，但可以省距离。","ans":true,"why":"费力杠杆的动力臂小于阻力臂，动力端移动的距离比阻力端小，所以省距离。","diff":2},{"id":"c-lever-13","topic":"杠杆","tags":["杠杆分类"],"type":"choice","q":"开瓶器、镊子、托盘天平、钓鱼竿中，既省力又省距离的是：","opts":["开瓶器","镊子","托盘天平","一个都没有"],"ans":3,"why":"任何杠杆都不能同时省力又省距离：省力的费距离，费力的才省距离。","diff":2},{"id":"c-lever-14","topic":"杠杆","tags":["最小力"],"type":"judge","q":"判断：力的作用点不变时，力臂最长时用力最小。","ans":true,"why":"阻力和阻力臂一定时，动力臂越长动力越小；最长力臂就是支点到作用点的连线。","diff":2},{"id":"c-lever-15","topic":"杠杆","tags":["最小力"],"type":"choice","q":"要在杠杆上施加最小的力，应使：","opts":["力的作用点离支点最远","力的方向垂直于支点到作用点的连线","力的方向沿着杠杆","让力臂最短"],"ans":1,"why":"力垂直于支点到作用点的连线时力臂最大，力臂最大时力最小。","diff":2},{"id":"c-lever-16","topic":"杠杆","tags":["最小力"],"type":"judge","q":"判断：作用点离支点越远，施加的力就一定越小。","ans":false,"why":"决定力大小的是力臂不是距离；方向不对，力臂反而会变小。","diff":3},{"id":"c-lever-17","topic":"杠杆","tags":["杠杆动态平衡"],"type":"choice","q":"杠杆水平平衡，保持阻力和阻力臂不变，把动力作用点向支点靠近，动力将：","opts":["变大","变小","不变","先变大后变小"],"ans":0,"why":"动力臂变小，由 F₁l₁ = F₂l₂ 可知动力必须变大。","diff":3},{"id":"c-lever-18","topic":"杠杆","tags":["杠杆动态平衡"],"type":"choice","q":"杠杆水平平衡，弹簧测力计由竖直方向逐渐倾斜拉杠杆，测力计示数：","opts":["变小","变大","不变","先变小后变大"],"ans":1,"why":"倾斜后动力臂变短，阻力和阻力臂不变，所以动力要变大。","diff":3},{"id":"c-lever-19","topic":"杠杆","tags":["杠杆动态平衡"],"type":"judge","q":"判断：分析杠杆时，杠杆自身的重力也可能成为阻力。","ans":true,"why":"杠杆的重力作用在重心上，也会阻碍杠杆转动，不能漏掉。","diff":2},{"id":"c-pulley-01","topic":"滑轮","tags":["定滑轮与动滑轮"],"type":"choice","q":"定滑轮的作用是：","opts":["省力","省距离","改变力的方向","既省力又改变方向"],"ans":2,"why":"定滑轮实质是等臂杠杆，只改变力的方向，不省力也不省距离。","diff":1},{"id":"c-pulley-02","topic":"滑轮","tags":["定滑轮与动滑轮"],"type":"choice","q":"动滑轮的作用是：","opts":["省力，但不能改变力的方向","只改变力的方向，不省力","既省力又省距离","既不省力也不省距离"],"ans":0,"why":"动滑轮实质是动力臂为阻力臂 2 倍的杠杆，省力但费距离。","diff":1},{"id":"c-pulley-03","topic":"滑轮","tags":["定滑轮与动滑轮"],"type":"judge","q":"判断：定滑轮的轴固定不动，动滑轮的轴随物体一起移动。","ans":true,"why":"看轴动不动就能区分定滑轮和动滑轮。","diff":1},{"id":"c-pulley-04","topic":"滑轮","tags":["定滑轮与动滑轮"],"type":"judge","q":"判断：使用定滑轮可以省力。","ans":false,"why":"定滑轮是等臂杠杆，动力臂等于阻力臂，不省力，只能改变力的方向。","diff":1},{"id":"c-pulley-05","topic":"滑轮","tags":["定滑轮与动滑轮"],"type":"choice","q":"不计绳重和摩擦，用动滑轮竖直提起 100 N 的物体，动滑轮重 10 N，至少需要：","opts":["100 N","55 N","50 N","45 N"],"ans":1,"why":"F = (G物+G动)/2 = (100 N+10 N)/2 = 55 N，动滑轮的重也要算。","diff":2},{"id":"c-pulley-06","topic":"滑轮","tags":["定滑轮与动滑轮"],"type":"judge","q":"判断：定滑轮和动滑轮都能改变力的方向。","ans":false,"why":"只有定滑轮能改变力的方向，动滑轮省力但方向不变。","diff":2},{"id":"c-pulley-07","topic":"滑轮","tags":["定滑轮与动滑轮"],"type":"judge","q":"判断：动滑轮省了力，所以绳子自由端移动的距离比物体移动的小。","ans":false,"why":"省力必然费距离，绳子自由端移动的距离是物体移动距离的 2 倍。","diff":2},{"id":"c-pulley-08","topic":"滑轮","tags":["定滑轮与动滑轮"],"type":"choice","q":"关于定滑轮和动滑轮，下列说法正确的是：","opts":["定滑轮省力，动滑轮改变方向","定滑轮改变方向，动滑轮省力","两者都省力","两者都能改变方向"],"ans":1,"why":"定滑轮是等臂杠杆只改变方向；动滑轮省一半力但费距离。","diff":2},{"id":"c-pulley-09","topic":"滑轮","tags":["滑轮组"],"type":"choice","q":"滑轮组由 n 段绳子承担物重，不计绳重和摩擦，拉力 F 等于：","opts":["G物","G物/n","(G物+G动)/n","n·G物"],"ans":2,"why":"动滑轮和物重的总重由 n 段绳子分担，所以 F = (G物+G动)/n。","diff":2},{"id":"c-pulley-10","topic":"滑轮","tags":["滑轮组"],"type":"judge","q":"判断：滑轮组既能省力，也能改变力的方向。","ans":true,"why":"动滑轮负责省力，定滑轮负责改变方向，组合起来两样都能做到。","diff":2},{"id":"c-pulley-11","topic":"滑轮","tags":["滑轮组"],"type":"choice","q":"用一个定滑轮和一个动滑轮组成滑轮组，承担物重的绳子最多有几段？","opts":["1 段","2 段","3 段","4 段"],"ans":2,"why":"一静一动最多 3 段绳子承担物重，n 越大越省力。","diff":3},{"id":"c-pulley-12","topic":"滑轮","tags":["滑轮组"],"type":"judge","q":"判断：同一根绳子绕在滑轮上，各段绳子受到的拉力都相等（不计摩擦和绳重）。","ans":true,"why":"同一根绳子张力处处相等，这是分析滑轮组受力的基础。","diff":3},{"id":"c-pulley-13","topic":"滑轮","tags":["滑轮组","机械效率"],"type":"judge","q":"判断：滑轮组承担物重的绳子段数 n 越多，机械效率就越高。","ans":false,"why":"n 多只说明更省力；效率由有用功占总功的比例决定，和省力多少无关。","diff":3},{"id":"c-pulley-14","topic":"滑轮","tags":["滑轮组"],"type":"choice","q":"用滑轮组提升物体，物体升高 h，绳子自由端移动的距离 s 等于：","opts":["h","nh","h/n","2h（与 n 无关）"],"ans":1,"why":"有 n 段绳子承担物重，自由端移动的距离就是物体升高高度的 n 倍。","diff":2},{"id":"c-work-01","topic":"功和功率","tags":["功"],"type":"choice","q":"力对物体做功的两个必要因素是：","opts":["有力作用，物体运动","有力作用，物体在力的方向上通过距离","物体运动，速度够大","力够大，时间够长"],"ans":1,"why":"有力，并且在力的方向上有距离，才叫这个力做了功。","diff":1},{"id":"c-work-02","topic":"功和功率","tags":["功"],"type":"choice","q":"下列情况中，人对物体做了功的是：","opts":["提着水桶在水平地面走","用力推汽车没推动","把地上的书捡到桌上","举着杠铃原地不动"],"ans":2,"why":"捡书时力向上、书也向上移动，才算做功。","diff":1},{"id":"c-work-03","topic":"功和功率","tags":["功"],"type":"judge","q":"判断：用力推桌子没推动，是因为推力没有做功。","ans":true,"why":"有力但没有在力的方向上通过距离，推力不做功。","diff":2},{"id":"c-work-04","topic":"功和功率","tags":["功"],"type":"judge","q":"判断：提着书包沿水平方向走，提书包的力对书包做了功。","ans":false,"why":"提力竖直向上、书包水平移动，力与移动方向垂直，这个力不做功。","diff":2},{"id":"c-work-05","topic":"功和功率","tags":["功"],"type":"choice","q":"用 50 N 的水平推力把箱子沿水平方向推动 2 m，推力做的功是：","opts":["25 J","50 J","100 J","200 J"],"ans":2,"why":"W = Fs = 50 N × 2 m = 100 J。","diff":2},{"id":"c-work-06","topic":"功和功率","tags":["功"],"type":"choice","q":"足球被踢出后在空中飞行，脚对球：","opts":["继续做功","不再做功","做功多少看飞行距离","无法判断"],"ans":1,"why":"球离开脚后脚不再施力，脚对球不做功，是球的动能推着它飞。","diff":3},{"id":"c-work-07","topic":"功和功率","tags":["功率"],"type":"choice","q":"功率是表示：","opts":["做功多少","做功快慢","做功效率","力的大小"],"ans":1,"why":"功率 = 功/时间，描述做功的快慢，不表示做功多少。","diff":1},{"id":"c-work-08","topic":"功和功率","tags":["功率"],"type":"judge","q":"判断：功率大的机械，做功一定多。","ans":false,"why":"功率大只说明做功快；做功多少还要看时间，W = Pt。","diff":2},{"id":"c-work-09","topic":"功和功率","tags":["功率"],"type":"choice","q":"甲 10 s 做功 100 J，乙 5 s 做功 80 J，谁的功率大？","opts":["甲","乙","一样大","无法比较"],"ans":1,"why":"P甲 = 100 J/10 s = 10 W，P乙 = 80 J/5 s = 16 W，乙做功更快。","diff":2},{"id":"c-work-10","topic":"功和功率","tags":["功率"],"type":"judge","q":"判断：做功多的机械，功率一定大。","ans":false,"why":"功率是做功与时间的比值，做功多但用时长，功率可能反而小。","diff":2},{"id":"c-work-11","topic":"功和功率","tags":["功率"],"type":"choice","q":"用 50 N 的水平拉力以 2 m/s 的速度匀速拉箱子，拉力的功率是：","opts":["25 W","50 W","100 W","200 W"],"ans":2,"why":"P = Fv = 50 N × 2 m/s = 100 W。","diff":3},{"id":"c-work-12","topic":"功和功率","tags":["功率","机械效率"],"type":"choice","q":"甲机械的功率比乙大，说明：","opts":["甲做功一定更多","甲做功一定更快","甲的机械效率一定更高","甲一定更省力"],"ans":1,"why":"功率只反映做功快慢；机械效率是另一回事，两者没有必然联系。","diff":3},{"id":"c-eff-01","topic":"机械效率","tags":["机械效率"],"type":"choice","q":"机械效率等于：","opts":["有用功/总功","总功/有用功","有用功/额外功","额外功/总功"],"ans":0,"why":"η = W有用/W总 × 100%，表示有用功占总功的比例。","diff":1},{"id":"c-eff-02","topic":"机械效率","tags":["机械效率"],"type":"judge","q":"判断：任何机械的机械效率都小于 100%。","ans":true,"why":"使用机械总要克服摩擦、提升机械本身做功，总有额外功。","diff":1},{"id":"c-eff-03","topic":"机械效率","tags":["机械效率"],"type":"choice","q":"用滑轮组提升物体，机械效率是 80%，说明：","opts":["有用功占总功的 80%","省了 80% 的力","总功的 20% 是有用功","拉力是物重的 80%"],"ans":0,"why":"效率 80% 表示总功里 80% 用于提升物体，其余 20% 是额外功。","diff":2},{"id":"c-eff-04","topic":"机械效率","tags":["机械效率"],"type":"judge","q":"判断：机械效率越高，机械做功越快。","ans":false,"why":"效率高说明有用功占比大，和做功快慢（功率）没有关系。","diff":2},{"id":"c-eff-05","topic":"机械效率","tags":["机械效率"],"type":"choice","q":"用动滑轮把 90 N 的物体提高 1 m，拉力 60 N，绳子自由端移动 2 m，机械效率是：","opts":["75%","83%","90%","60%"],"ans":0,"why":"W有 = Gh = 90 J，W总 = Fs = 120 J，η = 90/120 = 75%。","diff":3},{"id":"c-eff-06","topic":"机械效率","tags":["机械效率"],"type":"choice","q":"同一滑轮组，分别把 100 N 和 200 N 的物体提到相同高度，机械效率：","opts":["提 100 N 时高","提 200 N 时高","两次相同","无法判断"],"ans":1,"why":"物体越重，有用功占比越大，同一滑轮组的机械效率越高。","diff":3},{"id":"c-eff-07","topic":"机械效率","tags":["机械效率"],"type":"choice","q":"用滑轮组提升物体时，能提高机械效率的做法是：","opts":["增加提升高度","增大物体的重力","增加动滑轮的重力","加快提升速度"],"ans":1,"why":"增大物重让有用功占比变大；减小动滑轮重、减小摩擦也能提高效率。","diff":3},{"id":"c-eff-08","topic":"机械效率","tags":["机械效率"],"type":"judge","q":"判断：机械效率高的机械，一定更省力。","ans":false,"why":"效率是做功比例，省力看的是力的大小，两者没有必然关系。","diff":2},{"id":"c-eff-09","topic":"机械效率","tags":["机械效率"],"type":"choice","q":"用滑轮组水平拉动物体时，有用功等于：","opts":["Gh","f·s物（f 为物体受到的摩擦阻力）","F·s绳","G总·h"],"ans":1,"why":"水平拉时目的是克服物体与地面的摩擦，有用功就是克服摩擦做的功。","diff":3},{"id":"c-eff-10","topic":"机械效率","tags":["测机械效率实验"],"type":"choice","q":"测量滑轮组机械效率的实验中，必须用到的测量工具是：","opts":["弹簧测力计和刻度尺","天平和秒表","温度计和刻度尺","秒表和弹簧测力计"],"ans":0,"why":"测力计测拉力 F，刻度尺测物体升高的 h 和绳端移动的 s。","diff":2},{"id":"c-eff-11","topic":"机械效率","tags":["测机械效率实验"],"type":"judge","q":"判断：测滑轮组机械效率时，弹簧测力计要在缓慢匀速拉动的过程中读数。","ans":true,"why":"匀速拉动时拉力才稳定，读数才反映真实工作状态。","diff":2},{"id":"c-eff-12","topic":"机械效率","tags":["测机械效率实验"],"type":"choice","q":"只改变钩码的个数，测得的机械效率不同，这说明：","opts":["实验做错了","同一滑轮组的效率随提升物重变化","机械效率一定是定值","绳子绕法有问题"],"ans":1,"why":"物体越重有用功占比越大，同一滑轮组提不同重物效率不同。","diff":3},{"id":"c-eff-13","topic":"机械效率","tags":["测机械效率实验"],"type":"choice","q":"要提高该滑轮组的机械效率，最有效的做法是：","opts":["多绕几段绳子","换一个更轻的动滑轮","加快拉动速度","把绳子拉得更长"],"ans":1,"why":"动滑轮越轻，额外功越少，机械效率越高；多绕绳子只是更省力。","diff":3},{"id":"c-energy-01","topic":"机械能","tags":["动能与势能"],"type":"choice","q":"动能的大小与什么有关？","opts":["质量和速度","质量和高度","速度和高度","只有速度"],"ans":0,"why":"质量越大、速度越大，物体的动能越大。","diff":1},{"id":"c-energy-02","topic":"机械能","tags":["动能与势能"],"type":"choice","q":"重力势能的大小与什么有关？","opts":["质量和速度","质量和被举高的高度","弹性形变的程度","只有质量"],"ans":1,"why":"质量越大、举得越高，重力势能越大。","diff":1},{"id":"c-energy-03","topic":"机械能","tags":["动能与势能"],"type":"judge","q":"判断：弹性势能的大小与物体发生弹性形变的程度有关。","ans":true,"why":"形变越大，弹性势能越大，比如弹簧拉得越长弹性势能越大。","diff":1},{"id":"c-energy-04","topic":"机械能","tags":["动能与势能"],"type":"judge","q":"判断：速度大的物体动能一定大。","ans":false,"why":"动能还跟质量有关，高速的自行车动能可能不如慢行的卡车。","diff":2},{"id":"c-energy-05","topic":"机械能","tags":["机械能转化"],"type":"judge","q":"判断：滚摆下降时，重力势能转化为动能。","ans":true,"why":"滚摆下降时高度变小、速度变快，重力势能转化为动能。","diff":2},{"id":"c-energy-06","topic":"机械能","tags":["机械能转化"],"type":"choice","q":"物体从高处自由下落（不计空气阻力），它的：","opts":["动能增大，机械能增大","动能增大、重力势能减小，机械能不变","动能不变，重力势能减小","动能减小，机械能减小"],"ans":1,"why":"重力势能转化为动能，没有阻力时机械能总量不变。","diff":2},{"id":"c-energy-07","topic":"机械能","tags":["机械能转化"],"type":"choice","q":"人造卫星从近地点向远地点运动时：","opts":["动能增大，势能减小","动能减小，势能增大","动能和势能都不变","动能和势能都增大"],"ans":1,"why":"从近地点到远地点高度增大、速度减小，动能转化为重力势能。","diff":3},{"id":"c-energy-08","topic":"机械能","tags":["机械能转化"],"type":"judge","q":"判断：物体匀速上升时，动能不变，机械能增大。","ans":true,"why":"速度不变所以动能不变，高度增大所以重力势能增大，机械能增大。","diff":2},{"id":"c-energy-09","topic":"机械能","tags":["机械能转化"],"type":"choice","q":"蹦床运动员从高处落下，把蹦床压到最低点的过程中：","opts":["动能一直增大","重力势能转化为动能和弹性势能","只有动能转化为重力势能","机械能全部消失"],"ans":1,"why":"下落时重力势能减小，转化为动能和蹦床的弹性势能。","diff":3},{"id":"c-energy-10","topic":"机械能","tags":["机械能转化"],"type":"judge","q":"判断：物体在粗糙水平面上滑行直到停下，它的机械能消失了。","ans":false,"why":"机械能转化成了内能，能量总量守恒，并不是消失了。","diff":3},{"id":"c-mol-01","topic":"分子与内能","tags":["分子动理论"],"type":"choice","q":"下列不属于分子动理论内容的是：","opts":["物质由分子组成","分子在不停地做无规则运动","分子间存在相互作用力","分子是不能再分的最小微粒"],"ans":3,"why":"分子还能再分成原子，不是最小微粒；前三项才是分子动理论的内容。","diff":1},{"id":"c-mol-02","topic":"分子与内能","tags":["分子动理论"],"type":"judge","q":"判断：温度越高，分子热运动越剧烈。","ans":true,"why":"温度是分子热运动剧烈程度的标志，温度升高分子运动加快。","diff":2},{"id":"c-mol-03","topic":"分子与内能","tags":["分子动理论"],"type":"judge","q":"判断：一般分子的直径大约只有 10⁻¹⁰ m。","ans":true,"why":"分子直径在 10⁻¹⁰ m 量级，肉眼和普通显微镜都看不到。","diff":2},{"id":"c-mol-04","topic":"分子与内能","tags":["扩散现象"],"type":"judge","q":"判断：扩散现象只能发生在气体之间。","ans":false,"why":"气体、液体、固体之间都能扩散，比如墨水在清水中散开。","diff":1},{"id":"c-mol-05","topic":"分子与内能","tags":["扩散现象"],"type":"choice","q":"下列现象中属于扩散现象的是：","opts":["扫地时尘土飞扬","打开香水瓶满屋飘香","雪花漫天飞舞","水从高处流向低处"],"ans":1,"why":"扩散是分子运动；肉眼看到的尘土、雪花是物体的机械运动。","diff":2},{"id":"c-mol-06","topic":"分子与内能","tags":["扩散现象"],"type":"judge","q":"判断：温度越高，扩散越快。","ans":true,"why":"温度越高分子运动越剧烈，扩散现象越明显。","diff":2},{"id":"c-mol-07","topic":"分子与内能","tags":["扩散现象"],"type":"choice","q":"把装有二氧化氮气体的瓶子放在下面、空瓶放在上面，抽去玻璃板后两瓶颜色逐渐相同。这个实验说明：","opts":["气体受到重力","分子在不停地做无规则运动","分子间存在斥力","温度越高扩散越快"],"ans":1,"why":"密度大的二氧化氮能进入上面的瓶子，说明是分子运动，不是重力造成的。","diff":3},{"id":"c-mol-08","topic":"分子与内能","tags":["分子间作用力"],"type":"choice","q":"分子间的作用力：","opts":["只有引力","只有斥力","引力和斥力同时存在","先有引力后有斥力"],"ans":2,"why":"分子间同时存在引力和斥力，实际表现是两者的合力。","diff":2},{"id":"c-mol-09","topic":"分子与内能","tags":["分子间作用力"],"type":"judge","q":"判断：固体和液体很难被压缩，是因为分子间存在斥力。","ans":true,"why":"压缩时分子间距变小，斥力迅速增大，所以很难压下去。","diff":2},{"id":"c-mol-10","topic":"分子与内能","tags":["分子间作用力"],"type":"judge","q":"判断：两段铅块压紧后能吊起重物，说明分子间存在引力。","ans":true,"why":"分子间距足够小时引力表现出来，把两块铅粘在一起。","diff":2},{"id":"c-mol-11","topic":"分子与内能","tags":["分子间作用力"],"type":"judge","q":"判断：破镜难圆，是因为断裂处分子间距离太大，引力几乎不起作用。","ans":true,"why":"断裂处分子间距远大于分子直径，分子间作用力几乎为零。","diff":3},{"id":"c-mol-12","topic":"分子与内能","tags":["内能"],"type":"choice","q":"关于内能，下列说法正确的是：","opts":["0℃ 的冰没有内能","内能是物体内所有分子热运动的动能与分子势能的总和","内能就是机械能","温度不变，内能一定不变"],"ans":1,"why":"一切物体都有内能；内能是微观分子的能量总和，不是机械能。","diff":1},{"id":"c-mol-13","topic":"分子与内能","tags":["内能"],"type":"judge","q":"判断：一切物体，不论温度高低，都具有内能。","ans":true,"why":"分子永不停息地运动，任何温度的物体都有内能。","diff":2},{"id":"c-mol-14","topic":"分子与内能","tags":["内能"],"type":"choice","q":"同一个物体的温度升高，它的内能：","opts":["一定增大","一定减小","一定不变","无法判断"],"ans":0,"why":"同一物体温度升高，分子运动更剧烈，内能一定增大。","diff":2},{"id":"c-mol-15","topic":"分子与内能","tags":["改变内能的方式"],"type":"choice","q":"改变物体内能的两种方式是：","opts":["做功和热传递","加热和冷却","摩擦和压缩","吸热和放热"],"ans":0,"why":"做功和热传递都能改变内能，效果是等效的。","diff":1},{"id":"c-mol-16","topic":"分子与内能","tags":["改变内能的方式"],"type":"choice","q":"下列现象中属于做功改变内能的是：","opts":["用热水袋取暖","双手摩擦发热","太阳晒热石头","把铁块放进热水里"],"ans":1,"why":"摩擦是克服摩擦做功，机械能转化为内能；其余三项都是热传递。","diff":2},{"id":"c-mol-17","topic":"分子与内能","tags":["改变内能的方式"],"type":"choice","q":"用打气筒给自行车打气，筒壁变热，主要是因为：","opts":["压缩气体和摩擦做功，机械能转化为内能","气体温度本来就高","太阳晒的","热传递"],"ans":0,"why":"活塞压缩气体、摩擦筒壁都在做功，机械能转化为内能。","diff":3},{"id":"c-mol-18","topic":"分子与内能","tags":["温度热量内能辨析"],"type":"judge","q":"判断：温度高的物体含有的热量多。","ans":false,"why":"热量是热传递中转移的能量，是过程量，不能说物体含有热量。","diff":2},{"id":"c-mol-19","topic":"分子与内能","tags":["温度热量内能辨析"],"type":"judge","q":"判断：热量总是从内能大的物体传给内能小的物体。","ans":false,"why":"热传递的方向由温度决定：热量从高温物体传给低温物体。","diff":2},{"id":"c-mol-20","topic":"分子与内能","tags":["温度热量内能辨析"],"type":"choice","q":"关于温度、热量、内能，下列说法正确的是：","opts":["物体温度升高，一定吸收了热量","物体内能增大，温度一定升高","物体吸收热量，温度不一定升高","热量就是内能"],"ans":2,"why":"晶体熔化时吸热但温度不变；温度升高也可能是外界对它做功。","diff":3},{"id":"c-mol-21","topic":"分子与内能","tags":["温度热量内能辨析"],"type":"choice","q":"两个物体之间发生热传递的条件是：","opts":["内能不同","温度不同","质量不同","热量不同"],"ans":1,"why":"只要存在温度差，热量就从高温物体传到低温物体，直到温度相同。","diff":2},{"id":"c-mol-22","topic":"分子与内能","tags":["温度热量内能辨析"],"type":"judge","q":"判断：物体温度不变，内能也可能改变。","ans":true,"why":"晶体熔化时吸热、温度不变，但内能增大。","diff":3},{"id":"c-heat-01","topic":"比热容与热值","tags":["比热容"],"type":"choice","q":"关于比热容，下列说法正确的是：","opts":["比热容与物体的质量有关","比热容是物质的一种特性，与质量、温度无关","比热容与吸收的热量有关","比热容只与温度变化有关"],"ans":1,"why":"比热容由物质本身决定（还跟状态有关），与质量、温度无关。","diff":1},{"id":"c-heat-02","topic":"比热容与热值","tags":["比热容"],"type":"judge","q":"判断：水的比热容是 4.2×10³ J/(kg·℃)，表示 1 kg 水温度升高 1℃ 要吸收 4.2×10³ J 的热量。","ans":true,"why":"这就是比热容的物理意义：单位质量、温度升高 1℃ 吸收的热量。","diff":2},{"id":"c-heat-03","topic":"比热容与热值","tags":["比热容"],"type":"choice","q":"用水做汽车发动机的冷却剂，主要是因为水：","opts":["温度低","比热容大","密度大","容易流动"],"ans":1,"why":"水的比热容大，同样吸热温度升高得少，冷却效果好。","diff":2},{"id":"c-heat-04","topic":"比热容与热值","tags":["比热容"],"type":"judge","q":"判断：冰的比热容和水的比热容相同。","ans":false,"why":"比热容与状态有关，冰的比热容约 2.1×10³ J/(kg·℃)，是水的一半。","diff":2},{"id":"c-heat-05","topic":"比热容与热值","tags":["比热容"],"type":"choice","q":"质量和初温都相同的水和煤油，吸收相同的热量后：","opts":["水的末温高","煤油的末温高","末温相同","无法判断"],"ans":1,"why":"煤油的比热容比水小，同样吸热温度升得多，末温更高。","diff":3},{"id":"c-heat-06","topic":"比热容与热值","tags":["比热容"],"type":"judge","q":"判断：沿海地区昼夜温差比内陆小，是因为水的比热容大。","ans":true,"why":"水吸热、放热时温度变化小，海洋调节了气温，所以温差小。","diff":3},{"id":"c-heat-07","topic":"比热容与热值","tags":["热量计算"],"type":"choice","q":"计算物体吸热的公式是：","opts":["Q = cmΔt","Q = mq","Q = Fs","Q = W/t"],"ans":0,"why":"Q吸 = cm(t - t₀)，其中 Δt 是升高的温度。","diff":2},{"id":"c-heat-08","topic":"比热容与热值","tags":["热量计算"],"type":"judge","q":"判断：用 Q = cmΔt 计算时，Δt 是物体后来的温度。","ans":false,"why":"Δt 是温度的变化量（升高或降低了多少），不是末温，也不是初温。","diff":2},{"id":"c-heat-09","topic":"比热容与热值","tags":["热量计算"],"type":"choice","q":"2 kg 的水温度从 20℃ 升高到 70℃，吸收的热量是［c水 = 4.2×10³ J/(kg·℃)］：","opts":["4.2×10⁴ J","4.2×10⁵ J","1.68×10⁵ J","2.1×10⁵ J"],"ans":1,"why":"Q = cmΔt = 4.2×10³ × 2 × (70-20) J = 4.2×10⁵ J。","diff":3},{"id":"c-heat-10","topic":"比热容与热值","tags":["热量计算"],"type":"judge","q":"判断：不计热损失时，高温物体放出的热量等于低温物体吸收的热量。","ans":true,"why":"热平衡时 Q放 = Q吸，这是解混合温度问题的基本关系。","diff":3},{"id":"c-heat-11","topic":"比热容与热值","tags":["热值"],"type":"choice","q":"燃料的热值是指：","opts":["1 kg 燃料燃烧放出的热量","1 kg 某种燃料完全燃烧放出的热量","燃料燃烧时的温度","燃料的质量"],"ans":1,"why":"热值强调 1 kg 和完全燃烧两个条件，单位是 J/kg。","diff":2},{"id":"c-heat-12","topic":"比热容与热值","tags":["热值"],"type":"judge","q":"判断：燃料的热值跟燃料的质量有关，燃料越多热值越大。","ans":false,"why":"热值是燃料本身的特性，只跟燃料种类有关，与质量无关。","diff":2},{"id":"c-heat-13","topic":"比热容与热值","tags":["热值"],"type":"choice","q":"完全燃烧 2 kg 热值为 3.0×10⁷ J/kg 的燃料，放出的热量是：","opts":["1.5×10⁷ J","3.0×10⁷ J","6.0×10⁷ J","6.0×10⁴ J"],"ans":2,"why":"Q放 = mq = 2 kg × 3.0×10⁷ J/kg = 6.0×10⁷ J。","diff":3},{"id":"c-heat-14","topic":"比热容与热值","tags":["热值"],"type":"judge","q":"判断：热值大的燃料燃烧时放出的热量一定多。","ans":false,"why":"放热多少 Q = mq，还要看质量；热值大但质量小，放热可能更少。","diff":3},{"id":"c-engine-01","topic":"热机与能量","tags":["热机效率"],"type":"choice","q":"热机效率是指：","opts":["热机做的有用功与燃料完全燃烧放出的热量之比","燃料放出的热量与做的功之比","热机的功率大小","热机消耗燃料的多少"],"ans":0,"why":"η = W有用/Q放 × 100%，反映燃料的能量有多少变成了有用的机械功。","diff":1},{"id":"c-engine-02","topic":"热机与能量","tags":["热机效率"],"type":"judge","q":"判断：热机的效率可以达到 100%。","ans":false,"why":"废气带走热量、散热、克服摩擦都要消耗能量，效率总小于 100%。","diff":2},{"id":"c-engine-03","topic":"热机与能量","tags":["热机效率"],"type":"choice","q":"四冲程汽油机的做功冲程中，能量转化是：","opts":["机械能转化为内能","内能转化为机械能","化学能转化为内能","内能转化为化学能"],"ans":1,"why":"做功冲程中高温高压燃气推动活塞，内能转化为机械能。","diff":2},{"id":"c-engine-04","topic":"热机与能量","tags":["热机效率"],"type":"choice","q":"四冲程内燃机的一个工作循环中，曲轴转：","opts":["1 周","2 周","4 周","半周"],"ans":1,"why":"一个循环活塞往复 2 次、曲轴转 2 周、对外做功 1 次。","diff":2},{"id":"c-engine-05","topic":"热机与能量","tags":["热机效率"],"type":"judge","q":"判断：热机效率高的机器，功率一定大。","ans":false,"why":"效率看能量利用率，功率看做功快慢，两者没有必然关系。","diff":2},{"id":"c-engine-06","topic":"热机与能量","tags":["热机效率"],"type":"judge","q":"判断：压缩冲程中，机械能转化为内能。","ans":true,"why":"活塞压缩气体做功，气体内能增大、温度升高。","diff":3},{"id":"c-engine-07","topic":"热机与能量","tags":["热机效率"],"type":"choice","q":"下列做法中，不能提高热机效率的是：","opts":["使燃料充分燃烧","减少废气带走的热量","减小各部件间的摩擦","增加燃料的燃烧量"],"ans":3,"why":"多烧燃料只增加总能量，不提高有用功占比。","diff":3},{"id":"c-engine-08","topic":"热机与能量","tags":["能量守恒"],"type":"judge","q":"判断：能量既不会凭空产生，也不会凭空消失，只会转化或转移。","ans":true,"why":"这就是能量守恒定律：转化和转移过程中能量总量保持不变。","diff":2},{"id":"c-engine-09","topic":"热机与能量","tags":["能量守恒"],"type":"judge","q":"判断：因为能量守恒，所以永动机可以造出来。","ans":false,"why":"永动机想不消耗能量而不断做功，违背能量守恒定律，不可能制成。","diff":2},{"id":"c-engine-10","topic":"热机与能量","tags":["能量守恒"],"type":"choice","q":"汽车刹车时，机械能减少的部分主要转化成了：","opts":["消失了","内能","电能","化学能"],"ans":1,"why":"克服摩擦做功，机械能转化为内能，能量总量守恒。","diff":3},{"id":"c-engine-11","topic":"热机与能量","tags":["能量守恒"],"type":"judge","q":"判断：能量的转化和转移是有方向性的，所以有些能量不能再被利用。","ans":true,"why":"总量守恒，但转化有方向性，散失的内能不能自动重新集中起来。","diff":3},{"id":"c-exp-01","topic":"实验探究","tags":["实验探究"],"type":"choice","q":"探究杠杆平衡条件时，挂钩码前先调节杠杆在水平位置平衡，目的是：","opts":["让杠杆更省力","便于直接从杠杆上读出力臂","让阻力臂变成 0","让杠杆更重"],"ans":1,"why":"水平平衡后，悬挂点到支点的距离正好等于力臂，读数方便。","diff":2},{"id":"c-exp-02","topic":"实验探究","tags":["实验探究"],"type":"judge","q":"判断：探究动能大小与速度的关系时，要用同一辆小车从不同高度滑下。","ans":true,"why":"同一小车保证质量相同，不同高度使到达水平面时速度不同，是控制变量法。","diff":2},{"id":"c-exp-03","topic":"实验探究","tags":["实验探究"],"type":"choice","q":"探究动能大小与哪些因素有关时，用木块被撞后移动的距离判断动能大小，这种方法叫：","opts":["控制变量法","转换法","类比法","理想实验法"],"ans":1,"why":"动能看不见，用木块被推动的距离间接显示动能大小，是转换法。","diff":2},{"id":"c-exp-04","topic":"实验探究","tags":["实验探究"],"type":"choice","q":"比较水和煤油吸热能力的实验中，用两个相同的加热器分别加热，目的是：","opts":["让它们升高相同的温度","使它们相同时间内吸收的热量相同","让它们的质量不同","加快实验速度"],"ans":1,"why":"相同热源加热相同时间，吸收的热量相同，才能比较温度升高的快慢。","diff":3},{"id":"c-exp-05","topic":"实验探究","tags":["实验探究"],"type":"judge","q":"判断：探究杠杆平衡条件时要做多次实验，是为了找出普遍规律，避免偶然性。","ans":true,"why":"只做一次可能有偶然性，多次改变力和力臂再总结，结论才可靠。","diff":3},{"id":"c-elec-01","topic":"电学","tags":["电荷与摩擦起电"],"type":"judge","diff":2,"q":"判断：两个轻小物体相互吸引，它们一定带异种电荷。","ans":false,"why":"还可能一个带电、另一个不带电 —— 带电体能吸引轻小物体。只有两个都带电且吸引，才是异种电荷。"},{"id":"c-elec-02","topic":"电学","tags":["电荷与摩擦起电"],"type":"choice","diff":1,"q":"用丝绸摩擦过的玻璃棒带正电，这是因为（　）。","opts":["玻璃棒得到了电子","玻璃棒失去了电子","丝绸失去了质子","摩擦创造了电荷"],"ans":1,"why":"摩擦起电是电子转移：玻璃棒上的电子跑到丝绸上，玻璃棒少了电子就带正电。"},{"id":"c-elec-03","topic":"电学","tags":["电荷与摩擦起电"],"type":"judge","diff":1,"q":"判断：摩擦起电创造了电荷。","ans":false,"why":"电荷既不会创造也不会消灭，只是从一个物体转移到另一个物体，两物体带等量异种电荷。"},{"id":"c-elec-04","topic":"电学","tags":["电荷与摩擦起电"],"type":"choice","diff":1,"q":"验电器的工作原理是（　）。","opts":["异种电荷相互吸引","同种电荷相互排斥","带电体吸引轻小物体","电流周围有磁场"],"ans":1,"why":"两片金属箔带上同种电荷互相排斥而张开，张角越大说明带的电荷越多。"},{"id":"c-elec-05","topic":"电学","tags":["电荷与摩擦起电"],"type":"choice","diff":2,"q":"两个带电小球接触后分开，发现它们相互排斥。原来两球（　）。","opts":["一定带同种电荷","一定带异种电荷","一定带等量电荷","一个带电一个不带电"],"ans":0,"why":"排斥说明接触后带同种电荷。若原来等量异种，接触会正好中和，两球都不带电，就不再有力了。"},{"id":"c-elec-06","topic":"电学","tags":["电荷与摩擦起电"],"type":"choice","diff":2,"q":"两个带电小球接触后分开，它们之间不再有力的作用。原来两球（　）。","opts":["等量同种电荷","不等量同种电荷","等量异种电荷","不等量异种电荷"],"ans":2,"why":"接触后不带电 → 正负电荷正好抵消 → 原来带等量异种电荷。"},{"id":"c-elec-07","topic":"电学","tags":["电流与电路"],"type":"choice","diff":1,"q":"物理学中规定，电流的方向是（　）。","opts":["自由电子移动的方向","正电荷定向移动的方向","负电荷定向移动的方向","电荷移动最快的方向"],"ans":1,"why":"规定正电荷定向移动的方向为电流方向；在金属导体里，电流方向与自由电子移动方向相反。"},{"id":"c-elec-08","topic":"电学","tags":["电流与电路"],"type":"judge","diff":2,"q":"判断：在金属导体中，电流的方向与自由电子实际移动的方向相反。","ans":true,"why":"金属靠自由电子导电，电子带负电，它移动的方向与规定的电流方向相反。"},{"id":"c-elec-09","topic":"电学","tags":["电流与电路"],"type":"choice","diff":1,"q":"发光二极管（LED）能发光，是因为（　）。","opts":["电流可以从任一方向通过","电流只能从“＋”极流入","它把电能全部变成光能","它不需要电流"],"ans":1,"why":"LED 有单向导电性：电流只能从“＋”极流进、“－”极流出，接反了不导通。"},{"id":"c-elec-10","topic":"电学","tags":["电流与电路"],"type":"judge","diff":1,"q":"判断：把发光二极管的两根引脚接反，它照样能发光。","ans":false,"why":"接反后电流不能通过，LED 不发光；此时串联在它回路里的其他元件也不工作。"},{"id":"c-elec-11","topic":"电学","tags":["串并联电路"],"type":"choice","diff":1,"q":"串联电路的特点是（　）。","opts":["各用电器互不影响","只有一条电流路径，一处断开全都不工作","各支路两端电压相等","干路电流等于各支路电流之和"],"ans":1,"why":"串联只有一条路，电流处处相等；一个元件断了，整条电路都断。"},{"id":"c-elec-12","topic":"电学","tags":["串并联电路"],"type":"choice","diff":1,"q":"并联电路的特点是（　）。","opts":["只有一条电流路径","各支路互不影响","各用电器两端电压一定不同","总电流等于各支路电流之差"],"ans":1,"why":"并联各支路分别接在两点之间，一条支路断了，其他支路照常工作。"},{"id":"c-elec-13","topic":"电学","tags":["串并联电路"],"type":"judge","diff":1,"q":"判断：并联电路中，一条支路的灯泡烧坏了，另一条支路的灯泡也不亮。","ans":false,"why":"并联各支路互不影响：烧坏的那条断路，其余支路仍然有电流，照常发光。"},{"id":"c-elec-14","topic":"电学","tags":["电流与电路","电学实验"],"type":"choice","diff":2,"q":"使用电流表时，它应该（　）在被测电路中。","opts":["串联","并联"],"ans":0,"why":"电流表内阻很小，必须串联；并联到用电器两端相当于把用电器短路，还会烧坏电表。"},{"id":"c-elec-15","topic":"电学","tags":["串并联电路"],"type":"choice","diff":1,"q":"并联电路中，干路电流 I 与两支路电流 I₁、I₂ 的关系是（　）。","opts":["I = I₁ + I₂","I = I₁ = I₂","I = I₁ − I₂","I = I₁ × I₂"],"ans":0,"why":"干路电流等于各支路电流之和；已知干路和一条支路，另一条支路就用减法。"},{"id":"c-elec-16","topic":"电学","tags":["电流与电路","电学实验"],"type":"judge","diff":2,"q":"判断：可以把电流表直接接到电源的两极上。","ans":false,"why":"电流表内阻极小，直接接电源两极会造成短路，烧坏电流表甚至损坏电源。"},{"id":"c-fix-01","topic":"滑轮","tags":["滑轮组","定滑轮与动滑轮"],"type":"choice","diff":2,"q":"弹簧测力计接在滑轮组的绳自由端，它的示数等于（　）。","opts":["绳中的张力 F","nF（要乘绳子段数）","物重 G","G/n 再乘 2"],"ans":0,"why":"测力计量的是它受到的拉力，也就是那段绳里的张力；同一根绳张力处处相等，等于 F。"},{"id":"c-fix-02","topic":"滑轮","tags":["滑轮组"],"type":"judge","diff":2,"q":"判断：同一根绳上各处的张力大小相等（不计绳重和摩擦）。","ans":true,"why":"所以测力计接在绳的自由端、固定端还是中间，示数都等于 F，不用再乘或除以 n。"},{"id":"c-fix-03","topic":"比热容与热值","tags":["比热容","热量计算"],"type":"choice","diff":2,"q":"用恒定功率的加热器加热液体，温度—时间图像是一条倾斜直线，这说明（　）。","opts":["每分钟吸收的热量相同","温度升高得越来越快","液体的比热容越来越大","液体没有吸热"],"ans":0,"why":"图像是直线说明温度均匀上升：每分钟升高的温度相同，Q=cmΔt 中每分钟吸的热也就相同。"},{"id":"c-fix-04","topic":"比热容与热值","tags":["比热容","温度热量内能辨析"],"type":"judge","diff":1,"q":"判断：水沸腾后继续加热，水的温度会继续升高。","ans":false,"why":"沸腾时吸热但温度不变，热量都用来汽化了；图像上就是一段水平线。"},{"id":"c-fix-05","topic":"机械效率","tags":["机械效率","功率"],"type":"choice","diff":2,"q":"机械效率 η 与功率 P 的区别是（　）。","opts":["η 表示做功快慢，P 表示有用功占多少","η 表示有用功占总功的比例，P 表示做功快慢","两者都是百分数","两者完全一样"],"ans":1,"why":"效率管「省不省」，功率管「快不快」；效率高的机械不一定做功快。"},{"id":"c-fix-06","topic":"机械效率","tags":["机械效率","功率"],"type":"judge","diff":2,"q":"判断：机械效率越高的机械，做功一定越快。","ans":false,"why":"效率与功率是两回事：一个工人用效率 90% 的滑轮组慢慢提，功率可能比效率 60% 的起重机小得多。"},{"id":"c-fix-07","topic":"比热容与热值","tags":["热量计算","比热容"],"type":"choice","diff":2,"q":"用 Q = cmΔt 算水吸收的热量时，m 应该取（　）。","opts":["炉子和燃料的总质量","被加热的水的质量","燃料烧掉的质量","容器的质量"],"ans":1,"why":"谁吸热就用谁的质量。烧水时是水在吸热，炉子、木炭的质量都不能代进水的 Q=cmΔt。"},{"id":"c-fix-08","topic":"比热容与热值","tags":["热值","热量计算"],"type":"judge","diff":2,"q":"判断：Q = mq 中的 m 是燃料的总质量，不管有没有烧完。","ans":false,"why":"只有完全燃烧的那部分才放热。一炉木炭只烧掉一部分，就要用「原来 − 剩下」。"}],"guided":[{"id":"g01","questionId":"w1q13","title":"人体杠杆：踮脚撑墙，支撑力有多大","topic":"杠杆","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["杠杆平衡（人体绕脚尖转动）","滑轮组省力","热量计算 Q=cmΔt","功率 P=W/t"],"ans":0,"why":"脚后跟离地、脚尖 O 是固定转轴，手撑墙的力和体重都绕 O 转——这是杠杆模型。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["质量 m=50 kg，可算出体重 G=500 N","手臂长度 30 cm","脚尖 O 是支点，人体绕 O 转动","墙壁的支撑力 F 是水平方向的"],"ans":[0,2,3],"why":"手臂长度题目没给，要从方格图上数格子量；自己编一个数，力臂就错了。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["F=(G+G动)/n（滑轮组）","Q=cmΔt（吸热公式）","P=W/t","F₁l₁=F₂l₂（杠杆平衡条件）"],"ans":3,"why":"人静止不动就是平衡状态，直接用杠杆平衡条件。"},{"focus":"calc","type":"fields","q":"在方格图上量出两个力臂，代入算墙壁的支撑力 F：","fields":[{"type":"num","label":"墙壁对她的支撑力 F =","ans":187.5,"unit":"N","tol":1}],"why":"水平力 F 的力臂是竖直距离（8 格），重力 G 的力臂是水平距离（3 格）：F×8=500×3，F=187.5 N。"},{"focus":"check","type":"choice","q":"验一验：这个结果合理吗？","opts":["合理：支撑力应该正好等于体重 500 N","合理：187.5 N 比体重还大，说明很费力","不用验，数字代进公式就行","合理：187.5 N 不到体重 500 N 的一半，手撑墙不用托起全身"],"ans":3,"why":"F 的力臂（手臂高度）比重力的力臂长，所以 F<G；算出比 500 N 还大就要回头查力臂。"}],"hints":{"model":["先找有没有固定转轴。","脚尖 O 点触地不动，全身绕 O 转——这就是杠杆。"],"cond":["把数字连单位一起抄：质量 50 kg、力是水平的、不计墙面摩擦。","题目没给手臂长度，别自己编；能从图上量的先标出来。"],"rule":["人静止不动 = 平衡状态。","平衡状态就用杠杆平衡条件 F₁l₁=F₂l₂。"],"calc":["先分清两个力的力臂：水平力量竖直距离，重力竖直力量水平距离。","在方格图上数格子，得到两个力臂的比。","代入 F×l_F = G×l_G 求 F。"],"check":["用体重估一估：手撑墙的力不可能超过全身重。","再核对单位是不是 N。"]},"walk":["入口：脚尖 O 是转轴，人体绕 O 转动 → 杠杆模型。","① 认情境：人体杠杆，求墙壁的支撑力 F。","② 圈条件：m=50 kg ⇒ G=500 N；F 水平；不计墙面摩擦；力臂从方格图量。","③ 选规律：静止 ⇒ F×l_F = G×l_G。","④ 代数据：数格子得 l_G∶l_F=3∶8，F=500×3/8=187.5 N。","⑤ 验结果：187.5 N<500 N，量级合理。"],"calc":["G=mg=50 kg×10 N/kg=500 N","F 水平 ⇒ 力臂是竖直距离；G 竖直 ⇒ 力臂是水平距离","方格图上数得 l_G∶l_F=3∶8","F×l_F=G×l_G ⇒ F=500 N×3/8=187.5 N","检：F<G，因为 F 的力臂更长"]},{"id":"g02","questionId":"w8q14","title":"最小力：为什么力要垂直于杠杆","topic":"杠杆","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["滑轮组绕线","机械效率计算","热量计算 Q=cmΔt","杠杆平衡中求最小力"],"ans":3,"why":"题目问「至少施加多大的力」——力臂最长时力最小，这是最小力问题。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["最小的力作用在 A 点","物重 G=10 N（阻力）","杠杆长 AB=1.2 m、AO=0.2 m","杠杆是轻质的，不计自重"],"ans":[1,2,3],"why":"题目要求「在 B 点」施力；轻质杠杆说明杆重不用算进力矩，这两个条件不能混。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["η=W有/W总","P=W/t","F₁l₁=F₂l₂，且让 l₁ 取最大值","F=G/n（滑轮组）"],"ans":2,"why":"用杠杆平衡条件；要 F 最小，就要让它的力臂最长。"},{"focus":"calc","type":"fields","q":"先找最长力臂，再算最小力 F：","fields":[{"type":"num","label":"最小拉力 F =","ans":2,"unit":"N","tol":0.01},{"type":"text","label":"这个力的方向","ans":["竖直向下","竖直向下（垂直于杠杆）"],"mode":"contains"}],"why":"l₁=OB=1.2−0.2=1.0 m；F×1.0=10×0.2 ⇒ F=2 N，方向竖直向下（与杠杆垂直时力臂最长）。"},{"focus":"check","type":"choice","q":"验一验：这个结果合理吗？","opts":["合理：F=2 N 说明机械效率是 200%","不用验，套公式就行","合理：OB 是 OA 的 5 倍，F=G/5=2 N，省力 5 倍","不合理：F 应该比 G 大才对"],"ans":2,"why":"力臂比 1.0∶0.2=5∶1，F 就是 G 的 1/5；效率不可能超过 100%。"}],"hints":{"model":["题目里的关键词是「至少」「最小」。","力最小的时候，力臂一定最长。"],"cond":["把长度都标到图上：AB=1.2 m、AO=0.2 m。","力作用在哪一点？题目指定了 B 点。"],"rule":["杠杆平衡条件 F₁l₁=F₂l₂。","F 最小 ⇒ l₁ 最大；作用点越远、力越垂直于杠杆，力臂越大。"],"calc":["先算最大力臂：OB=AB−AO。","再算 F=G×OA/OB。","方向别忘写：与杠杆垂直，这里就是竖直向下。"],"check":["用「力臂比 = 省力倍数」反推一遍。","效率必须小于 100%，出现 200% 立刻回头查。"]},"walk":["入口：题目要「最小力」，先想到力臂最长。","① 认情境：杠杆平衡，求 B 点的最小拉力。","② 圈条件：G=10 N，AB=1.2 m，AO=0.2 m，杠杆轻质。","③ 选规律：F₁l₁=F₂l₂；l₁ 取最大 = OB。","④ 代数据：OB=1.0 m，F×1.0=10×0.2 ⇒ F=2 N，方向竖直向下。","⑤ 验结果：力臂比 5∶1，F 是 G 的 1/5，合理。"],"calc":["要 F 最小，力臂 l₁ 必须最大","作用点取最远的 B，力与杠杆垂直 ⇒ l₁=OB=1.2−0.2=1.0 m","G 的力臂 l₂=OA=0.2 m","F×1.0=10×0.2 ⇒ F=2 N，方向竖直向下","检：OB>OA，力臂长的一侧更省力"]},{"id":"g03","questionId":"w1q03","title":"杆秤换秤砣：读数为什么变成 3.8 kg","topic":"杠杆","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["热量计算 Q=cmΔt","功率与机械效率","杠杆平衡（杆秤：提纽 O 是支点）","滑轮组省力"],"ans":2,"why":"提纽 O 是支点，秤砣和物品分居两侧产生力矩——杆秤就是杠杆。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["秤砣质量 1 kg、秤盘到提纽 OA=10 cm","定盘星到提纽 OB=2 cm","换砣后秤砣到提纽 40 cm","秤杆和秤盘总质量 0.5 kg"],"ans":[0,1,3],"why":"40 cm 是待求的，题目没给；定盘星 OB=2 cm 是零刻度，用来找回秤杆秤盘那部分力矩。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["Q=cmΔt","W=Fs","F=G/n","F₁l₁=F₂l₂，且刻度是按 1 kg 秤砣标定的"],"ans":3,"why":"杆秤平衡用杠杆平衡条件；读数刻度按原秤砣标定，换砣后必须换算。"},{"focus":"calc","type":"choice","q":"先算 0.8 kg 秤砣平衡在哪里，再按 1 kg 砣的刻度读数，结果是：","opts":["3.6 kg","3.8 kg","3.75 kg","3.96 kg"],"ans":1,"why":"0.8×L=3×10+2 ⇒ L=40 cm；按 1 kg 砣刻度 m=(1×40−2)/10=3.8 kg。"},{"focus":"check","type":"choice","q":"验一验：这个结果合理吗？","opts":["读数与实际无关，随便填","合理：读数 3.8 kg 比实际 3 kg 大，顾客会以为占了便宜","不合理：读数一定比实际小","合理：3.8 kg 说明效率超过 100%"],"ans":1,"why":"换轻砣后同一位置要更长的力臂，读数偏大；数量级也在 3 kg 附近，不离谱。"}],"hints":{"model":["杆秤哪里是转轴？提纽就是支点。","一边挂物品、一边挂秤砣，两边的力矩要平衡。"],"cond":["把四个数抄下来：1 kg、0.5 kg、2 cm、10 cm。","定盘星是「零刻度」，它告诉我们秤杆秤盘自己占多少力矩。"],"rule":["静止平衡 ⇒ F₁l₁=F₂l₂。","刻度是按 1 kg 秤砣标定的，不是按 0.8 kg。"],"calc":["先用定盘星求秤杆秤盘的力矩：1×2=2。","再用 0.8×L=3×10+2 求新的平衡位置。","最后按 1 kg 砣的刻度换算读数。"],"check":["换轻砣后读数会偏大还是偏小？想想同一位置谁平衡。","结果应在 3 kg 附近，不该差出十几倍。"]},"walk":["入口：提纽 O 是支点，杆秤就是杠杆。","① 认情境：换秤砣后读数怎么变。","② 圈条件：砣 1 kg、杆盘 0.5 kg、OB=2 cm、OA=10 cm、新砣 0.8 kg、物品 3 kg。","③ 选规律：F₁l₁=F₂l₂；刻度按原砣标定。","④ 代数据：0.8×L=3×10+2 ⇒ L=40 cm；m=(40−2)/10=3.8 kg。","⑤ 验结果：3.8>3，读数偏大，顾客以为多得了。"],"calc":["定盘星：1 kg×2 cm=2 kg·cm，是秤杆秤盘的力矩","实际 3 kg 物品：阻力矩 = 3×10+2 = 32 kg·cm","0.8 kg 新砣平衡：0.8×L=32 ⇒ L=40 cm","按 1 kg 砣刻度读：m=(1×40−2)/10=3.8 kg","检：读数偏大，符合换轻砣的后果"]},{"id":"g04","questionId":"w1q09","title":"定滑轮 vs 动滑轮：别漏了滑轮重","topic":"滑轮","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["定滑轮与动滑轮的比较","杠杆平衡","热量计算","机械能转化"],"ans":0,"why":"甲轴固定不动是定滑轮，乙随物体一起动是动滑轮——先认装置。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["A、B 物重都是 10 N","动滑轮重 2 N","滑轮重 1 N（甲、乙用同一个滑轮）","不计摩擦"],"ans":[0,2,3],"why":"题目写的是滑轮重 1 N；把 2 N 当成条件，就是没认真圈条件。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["Q=cmΔt","η=W有/W总","定滑轮 F=G、s=h；动滑轮 F=(G+G动)/2、s=2h","F₁l₁=F₂l₂"],"ans":2,"why":"先认滑轮，再套对应规律；动滑轮的公式里要加滑轮重。"},{"focus":"calc","type":"choice","q":"分别算两个拉力，正确的是：","opts":["F甲=10 N，F乙=5 N","F甲=11 N，F乙=5.5 N","F甲=10 N，F乙=10 N","F甲=10 N，F乙=5.5 N"],"ans":3,"why":"甲定滑轮 F甲=G=10 N；乙动滑轮 F乙=(10+1)/2=5.5 N，漏掉滑轮重才会得 5 N。"},{"focus":"check","type":"choice","q":"验一验：两个拉力合理吗？","opts":["不合理：F乙 一定等于 5 N","合理：F乙 比 F甲 大，说明动滑轮费力","只要公式背对就合理","合理：5.5 N 比 10 N 小（省力），又比 5 N 大（带了滑轮重）"],"ans":3,"why":"动滑轮省力但省不到一半，5.5 N 在 5 N 和 10 N 之间，量级对。"}],"hints":{"model":["看滑轮的轴动不动：不动的是定滑轮，跟物体一起走的是动滑轮。","两个装置各是哪种，先说清楚。"],"cond":["把数字连单位抄下来：物重 10 N、滑轮重 1 N。","「不计摩擦」推出了什么？动滑轮公式可以简化，但滑轮重不能丢。"],"rule":["定滑轮：只改方向，F=G、s=h。","动滑轮：省力，F=(G+G动)/2、s=2h。"],"calc":["甲：F甲=G。","乙：先把 G 和 G动 加起来，再除以 2。","算完回头看一眼：F乙 应该比 G/2 略大。"],"check":["5.5 N 和 5 N 差在哪？就差那 1 N 的滑轮重。","动滑轮一定省力，F乙<F甲 才对。"]},"walk":["入口：甲轴固定、乙轴随物体动 → 定滑轮与动滑轮。","① 认情境：两种滑轮提升同样重的物体，比拉力。","② 圈条件：G=10 N、G动=1 N、不计摩擦。","③ 选规律：定滑轮 F=G；动滑轮 F=(G+G动)/2。","④ 代数据：F甲=10 N；F乙=(10+1)/2=5.5 N。","⑤ 验结果：F乙 在 5 N 与 10 N 之间，省力但不到一半。"],"calc":["甲是定滑轮：F甲=G=10 N，s甲=h","乙是动滑轮：F乙=(G+G动)/2","F乙=(10 N+1 N)/2=5.5 N","检：F乙>G/2=5 N，因为滑轮也有重","s乙=2h，动滑轮费距离"]},{"id":"g05","questionId":"w8q17","title":"滑轮组：先数 n，再算 s、η、G动","topic":"滑轮","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["杠杆平衡","比热容与热量","热机冲程","滑轮组（几段绳吊着动滑轮）"],"ans":3,"why":"先看动滑轮被几段绳子吊着，这个 n 决定后面所有公式。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["绳端移动距离 s=10 m","物重 G=600 N","拉力 F=250 N","重物提升高度 h=5 m"],"ans":[1,2,3],"why":"s 题目没给，要靠 s=nh 自己算；n 要从图上数出来，不能猜。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["Q=cmΔt","F₁l₁=F₂l₂","η=W有用/Q放","W有=Gh、s=nh、W总=Fs、η=W有/W总、nF=G+G动"],"ans":3,"why":"滑轮组按顺序用这一套公式：先 n，再 s，再功，最后效率和动滑轮重。"},{"focus":"calc","type":"fields","q":"按顺序算：先数 n=3，再求 s，最后算有用功、效率、动滑轮重：","fields":[{"type":"num","label":"有用功 W有 =","ans":3000,"unit":"J","tol":1},{"type":"num","label":"机械效率 η =","ans":80,"unit":"%","tol":0.5},{"type":"num","label":"动滑轮重 G动 =","ans":150,"unit":"N","tol":0.5}],"why":"s=3×5=15 m；W有=600×5=3000 J；W总=250×15=3750 J ⇒ η=80%；G动=3×250−600=150 N。"},{"focus":"check","type":"choice","q":"验一验：这三个结果合理吗？","opts":["不合理：80% 说明有 20% 的功凭空消失了","不用验，公式套对就行","合理：η=80%<100%，G动=150 N 也小于物重 600 N","合理：η 应该算到 100% 才对"],"ans":2,"why":"效率一定小于 100%（总有额外功）；再用 nF=G+G动 反推核对。"}],"hints":{"model":["看动滑轮和重物一共被几段绳子吊着。","n 就是这几段绳子的段数。"],"cond":["把数字连单位抄下来：G=600 N、F=250 N、h=5 m。","题目有没有直接给 s？没有，s 要自己算。"],"rule":["有用功是提升货物：W有=Gh。","总功是拉力做的：W总=Fs，s=nh。","效率 η=W有/W总；求 G动 用 nF=G+G动。"],"calc":["先数 n=3，再算 s=3×5=15 m。","分别算 W有、W总，再相除。","用 nF=G+G动 反推 G动。"],"check":["效率必须小于 100%，等于或超过 100% 一定错。","动滑轮重一般远小于物重，150 N 对 600 N 合理。"]},"walk":["入口：动滑轮 + 定滑轮 → 滑轮组，先数 n。","① 认情境：滑轮组提升重物，求 W有、η、G动。","② 圈条件：G=600 N、F=250 N、h=5 m；n=3 从图上数。","③ 选规律：W有=Gh、s=nh、W总=Fs、η=W有/W总、nF=G+G动。","④ 代数据：s=15 m；W有=3000 J；W总=3750 J；η=80%；G动=150 N。","⑤ 验结果：η<100%，G动<G，合理。"],"calc":["数绳：n=3 ⇒ s=nh=3×5=15 m","W有=Gh=600×5=3000 J","W总=Fs=250×15=3750 J","η=W有/W总=3000/3750=80%","不计绳重和摩擦：nF=G+G动 ⇒ G动=3×250−600=150 N"]},{"id":"g06","questionId":"w8q11","title":"三种方式提升：做功、功率、效率别混","topic":"功和功率","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["热传递改变内能","热量计算","比较不同机械的功、功率、机械效率","杠杆最小力"],"ans":2,"why":"三个装置提升同一物体，题目问的是「做功多少」「功率」「效率」——先把三个量分清。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["同一物体 M，提升高度都是 1 m","三次用时相同","乙、丙的绳端都移动 2 m","F甲=10 N、F乙=11 N、F丙=11 N"],"ans":[0,1,3],"why":"乙是定滑轮，s=h=1 m；只有丙（动滑轮）s=2h=2 m，两个不能都当 2 m。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["F=(G+G动)/2 直接用","Q=cmΔt","W=Fs 算总功、W有=Gh、η=W有/W总、P=W/t","F₁l₁=F₂l₂"],"ans":2,"why":"有用功只看物体被提高；总功看拉力做的功；功率再看时间。"},{"focus":"calc","type":"choice","q":"逐步算一算，正确的是：","opts":["乙、丙做的功一样多","丙的功率最小","丙的机械效率比乙高","乙的效率约 90.9%，丙约 45.5%，乙更高"],"ans":3,"why":"乙：W总=11×1=11 J，η=10/11≈90.9%；丙：W总=11×2=22 J，η=10/22≈45.5%。"},{"focus":"check","type":"choice","q":"验一验：结论站得住吗？","opts":["不用验，选最长的选项就行","合理：两个效率都小于 100%，丙多做的就是提升动滑轮的额外功","合理：丙做功最多，效率就一定最高","合理：效率低说明功率一定小"],"ans":1,"why":"做功多 ≠ 效率高；功率还要看时间，丙做功最多，功率反而最大。"}],"hints":{"model":["题目里有三个量在打架：功、功率、效率。","先把三个量的定义各写一句。"],"cond":["把三个拉力和提升高度抄下来。","乙、丙的绳端都移动 2 m 吗？想一想定滑轮 s 和 h 的关系。"],"rule":["有用功 W有=Gh，看的是物体。","总功 W总=Fs，看的是拉力。","功率 P=W/t，效率 η=W有/W总。"],"calc":["乙是定滑轮：s=1 m，W总=11 J。","丙是动滑轮：s=2 m，W总=22 J。","各自的 W有 都是 10 J，再分别除以 W总。"],"check":["效率不可能超过 100%。","功率比大小要同时看做功多少和时间。"]},"walk":["入口：同一个物体、三种提法 → 比功、功率、效率。","① 认情境：甲直接提、乙定滑轮、丙动滑轮。","② 圈条件：同一物体提升 1 m；用时相同；F甲=10 N，F乙=F丙=11 N。","③ 选规律：W有=Gh、W总=Fs、η=W有/W总、P=W/t。","④ 代数据：W有 都是 10 J；乙 W总=11 J，η≈90.9%；丙 W总=22 J，η≈45.5%。","⑤ 验结果：效率都小于 100%；丙做功最多，功率最大。"],"calc":["有用功都相同：W有=Gh=10 N×1 m=10 J","乙定滑轮：s=1 m ⇒ W总=11 J ⇒ η=10/11≈90.9%","丙动滑轮：s=2 m ⇒ W总=22 J ⇒ η=10/22≈45.5%","时间相同，丙做功最多 ⇒ 丙的功率最大","检：两个 η 都小于 100%，合理"]},{"id":"g07","questionId":"w4q14","title":"斜面：W有、W总、η 各指哪个功","topic":"机械效率","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["斜面（有用功/总功/机械效率）","杠杆平衡","比热容与热量","分子间作用力"],"ans":0,"why":"沿斜面拉物体：举高是有用功、沿斜面拉是总功——这是斜面机械效率模型。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["拉力 F=400 N","物体与斜面之间的摩擦力 f=100 N","斜面长 s=5 m","斜面高 h=1 m"],"ans":[0,2,3],"why":"摩擦力题目没给，它是额外功的来源，要用 W额=W总−W有 算出来。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["F₁l₁=F₂l₂","Q=cmΔt","P=W/t","W有=Gh、W总=Fs、η=W有/W总、W额=W总−W有"],"ans":3,"why":"斜面的有用功是「把货举高」，总功是「沿斜面拉」，s 和 h 千万别用反。"},{"focus":"calc","type":"fields","q":"按顺序算有用功、总功、效率、额外功：","fields":[{"type":"num","label":"有用功 W有 =","ans":1500,"unit":"J","tol":5},{"type":"num","label":"机械效率 η =","ans":75,"unit":"%","tol":0.5},{"type":"num","label":"额外功 W额 =","ans":500,"unit":"J","tol":5}],"why":"W有=1500×1=1500 J；W总=400×5=2000 J；η=1500/2000=75%；W额=2000−1500=500 J。"},{"focus":"check","type":"choice","q":"验一验：这三个数合理吗？","opts":["合理：η=75%，说明拉力省了 75% 的力","不合理：额外功应该等于 0","合理：η 不到 100% 就是算错了","合理：η=75%<100%，额外功 500 J 用来克服摩擦"],"ans":3,"why":"效率不到 100% 很正常；省力倍数和效率是两回事，别混。"}],"hints":{"model":["货物是被「举高」了，还是被「沿斜面拉」了？两个功不一样。","斜面问题就是机械效率问题。"],"cond":["把 F、s、h 抄下来，连单位。","摩擦力有没有直接给？没有，它要靠额外功求。"],"rule":["W有=Gh：只看竖直高度。","W总=Fs：只看沿斜面拉的距离。","η=W有/W总。"],"calc":["先算 W有=1500×1。","再算 W总=400×5。","相除得 η；W额=W总−W有。"],"check":["效率一定小于 100%。","额外功不可能为 0，因为总有摩擦。"]},"walk":["入口：沿斜面拉货 → 斜面机械效率模型。","① 认情境：求有用功、机械效率、额外功。","② 圈条件：F=400 N、s=5 m、h=1 m、G=1500 N；摩擦没给。","③ 选规律：W有=Gh、W总=Fs、η=W有/W总、W额=W总−W有。","④ 代数据：W有=1500 J；W总=2000 J；η=75%；W额=500 J。","⑤ 验结果：η<100%，额外功用来克服摩擦，合理。"],"calc":["W有=Gh=1500 N×1 m=1500 J","W总=Fs=400 N×5 m=2000 J","η=W有/W总=1500/2000=75%","W额=W总−W有=2000−1500=500 J","检：η<100%，W额>0"]},{"id":"g08","questionId":"w5aq05","title":"效率提高了：有用功、总功谁变","topic":"机械效率","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["杠杆平衡","扩散现象","热机冲程","机械效率的变化（同一重物、同一高度）"],"ans":3,"why":"题目说「效率提高了」，问有用功、总功怎么变——考的是 W有、W总、η 的关系。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["改进后省了 20% 的力","同一物体，重力 G 不变","提升高度 h 相同","改进前后都是匀速提升"],"ans":[1,2,3],"why":"题目没说省多少力，这个条件不能自己加；能确定的只有 G、h 不变。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["P=W/t ⇒ 功率变大","W总=W有+W额 ⇒ W总 变大","W有=Gh 不变；η=W有/W总 变大 ⇒ W总 变小","η 变大 ⇒ W有 变大"],"ans":2,"why":"同一重物同一高度，有用功是定值；效率提高只能是额外功少了、总功少了。"},{"focus":"calc","type":"choice","q":"把三个量排一排，正确的是：","opts":["W有 增加，W总 增加","W有 减少，W总 减少","W有 不变，W总 增加","W有 不变，W总 减少，η 提高"],"ans":3,"why":"η=W有/W总：分子不变、结果变大，分母 W总 必须变小。"},{"focus":"check","type":"choice","q":"验一验：结论站得住吗？","opts":["合理：效率提高，有用功一定也变大","不用验，记住结论就行","合理：效率提高就是额外功减少，和「总功减少」一致","合理：效率提高，功率一定也变大"],"ans":2,"why":"效率只看 W有/W总，跟功率、时间无关；没有时间就不能说功率变大。"}],"hints":{"model":["题目反复说「同一物体、同样高度」。","效率变了，问的是哪一个功变了。"],"cond":["G 不变、h 不变，W有 会变吗？","「省了 20% 的力」题目说了吗？没说就不能当条件。"],"rule":["W有=Gh：G、h 不变，W有 就不变。","η=W有/W总：分子不变、η 变大，分母怎么变？"],"calc":["把 W有 先定下来。","由 η 变大反推 W总 变小。","再想：总功变小，是多做了功还是少做了额外功？"],"check":["功率 P=W/t 还需要时间，题目给时间了吗？","效率提高说明有用功占比变大，不是有用功本身变大。"]},"walk":["入口：同一重物、同样高度，先锁定有用功。","① 认情境：机械效率提高，问三个量怎么变。","② 圈条件：G 不变、h 不变、匀速；省力多少没给。","③ 选规律：W有=Gh、η=W有/W总。","④ 代数据：W有 不变；η 变大 ⇒ W总 变小。","⑤ 验结果：总功变小、额外功变小，与效率提高一致。"],"calc":["W有=Gh：同一物体、同一高度 ⇒ W有 不变","η=W有/W总：W有 不变而 η 变大","⇒ 分母 W总 必须减少","W额=W总−W有 也随之减少（摩擦、动滑轮等额外功变小）","检：与「效率提高」的物理意义一致"]},{"id":"g09","questionId":"w6q03","title":"滑翔机匀速下滑：机械能怎么变","topic":"机械能","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["热量计算","滑轮组省力","机械能的变化与转化（动能、重力势能、内能）","杠杆平衡"],"ans":2,"why":"题目问动能、重力势能、机械能怎么变，以及能量转化——机械能问题。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["沿倾斜直线匀速下滑（速度不变）","飞行时总质量保持不变","下滑高度 2000 m","受到空气阻力作用"],"ans":[0,1,3],"why":"高度具体多少题目没给，也不需要；关键信息是「匀速」「质量不变」「有阻力」。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["Q=cmΔt","F₁l₁=F₂l₂","η=W有/W总","动能看速度、重力势能看高度；克服阻力做功 ⇒ 机械能转化为内能"],"ans":3,"why":"动能、势能各有自己的决定因素，别混在一起判断。"},{"focus":"calc","type":"choice","q":"逐步判断，正确的是：","opts":["动能减小，重力势能减小，一部分内能转化为机械能","动能增大，重力势能不变，一部分内能转化为机械能","动能不变，重力势能减小，一部分机械能转化为内能","动能不变，重力势能增大，一部分机械能转化为内能"],"ans":2,"why":"匀速⇒动能不变；下滑⇒势能减小；机械能减少的部分克服阻力做功，变成内能。"},{"focus":"check","type":"choice","q":"验一验：这个判断自洽吗？","opts":["不用验，选最长的就行","合理：动能不变 + 势能减小 ⇒ 机械能减小，与「有阻力」自洽","合理：动能不变，所以机械能也不变","合理：向下滑速度会越来越快"],"ans":1,"why":"机械能 = 动能 + 势能，要两项一起看；「匀速」已经说明速度不变。"}],"hints":{"model":["题目里有三个词要分清：动能、重力势能、机械能。","还要判断能量从哪种形式变成哪种形式。"],"cond":["「匀速」在告诉你速度变不变。","「下滑」「质量不变」在告诉你势能怎么变、质量是否变。","题目给了具体高度吗？没给也不用求。"],"rule":["动能看速度：质量不变时，速度不变 ⇒ 动能不变。","重力势能看高度：高度降低 ⇒ 势能减小。","有摩擦/阻力 ⇒ 机械能转化为内能。"],"calc":["先定动能：匀速 ⇒ 不变。","再定势能：下降 ⇒ 减小。","最后判能量流向：克服阻力做功 ⇒ 机械能→内能。"],"check":["机械能=动能+势能，两项一起看，不能只看一项。","「动能不变，所以机械能也不变」——这句话哪里漏了？"]},"walk":["入口：问动能、势能、机械能怎么变 → 机械能问题。","① 认情境：滑翔机匀速下滑，受空气阻力。","② 圈条件：匀速、质量不变、有阻力；高度未给。","③ 选规律：动能看速度、势能看高度；阻力做功 ⇒ 机械能→内能。","④ 判断：动能不变，势能减小，机械能减小，部分转化为内能。","⑤ 验结果：三项放在一起能自洽，没有矛盾。"],"calc":["匀速 ⇒ v 不变 ⇒ 动能不变","下滑 ⇒ h 减小 ⇒ 重力势能减小","机械能 = 动能 + 重力势能 ⇒ 机械能减小","减小的机械能克服空气阻力做功，转化为内能","检：既有机械能减少，又有内能增加，方向一致"]},{"id":"g10","questionId":"w4q08","title":"温度、热量、内能：三个词别混","topic":"分子与内能","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["温度、热量、内能的概念辨析","热量计算 Q=cmΔt","热机效率","杠杆平衡"],"ans":0,"why":"没有数据要算，只问「说法是否正确」——概念辨析题。"},{"focus":"cond","type":"multi","q":"先立判据：下面哪些是正确的？","opts":["热量是过程量，不能说物体「含有热量」","温度越高的物体内能一定越大","内能由温度、质量、状态共同决定","热传递的方向由温度高低决定"],"ans":[0,2,3],"why":"「温度越高的物体内能一定越大」是典型错话：内能还要看质量、状态，温度高不等于内能大。"},{"focus":"rule","type":"choice","q":"用哪条规律去排除？","opts":["F₁l₁=F₂l₂","W=Fs","用概念边界逐项排除（过程量/状态量、一切物体都有内能）","Q=cmΔt"],"ans":2,"why":"概念题不代公式，用三条判据逐项排除。"},{"focus":"calc","type":"choice","q":"逐项判断，正确的是：","opts":["A 冰块熔化时温度不变，内能一定不变","B 热量从内能大的物体传到内能小的物体","C 0℃ 的冰块具有内能","D 内能增加一定是吸收了热量"],"ans":2,"why":"A 错：熔化吸热，内能增加；B 错：看温度不看内能；D 错：外界做功也能让内能增加。"},{"focus":"check","type":"choice","q":"验一验：你的判断能举出反例吗？","opts":["不能，凭感觉排除的","不用举反例，记住答案就行","能：A 用「冰熔化」、B 用「小杯热水 vs 大桶温水」、D 用「搓手取暖」各举一个反例"],"ans":2,"why":"概念题的检验就是「举反例」；举得出反例，说明真懂边界。"}],"hints":{"model":["这题有没有要算的数字？","没有数字、只问「说法是否正确」→ 概念辨析题。"],"cond":["先默念三条：热量是过程量；内能看温度+质量+状态；热传递看温度高低。","「一切物体都有内能」是硬结论。"],"rule":["概念题用判据排除，不代公式。","带「一定」「都」「只有」的选项要特别小心。"],"calc":["A：冰熔化时吸热但温度不变，内能变不变？","B：热传递的方向由温度决定，不是内能大小。","D：改变内能还有「做功」这条路。"],"check":["检验概念题的办法：给每个错项举一个反例。","举不出反例，才说明这个说法成立。"]},"walk":["入口：没有数据、只问说法对错 → 概念辨析。","① 认情境：温度、热量、内能的区别。","② 圈条件：无数据，立三条判据。","③ 选规律：用概念边界逐项排除。","④ 判断：C 正确，A、B、D 各有一个反例。","⑤ 验结果：把三个反例说出来，能说清才算懂。"],"calc":["A 错：冰熔化吸热、温度不变，但内能增加","B 错：热传递方向由温度高低决定","C 对：一切物体在任何温度下都有内能","D 错：外界对物体做功也能让内能增加","检：A、B、D 都能举出反例，C 举不出"]},{"id":"g11","questionId":"w5aq08","title":"等温压缩气体：内能为什么不变","topic":"分子与内能","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["扩散现象","热值比较","杠杆平衡","内能的变化（改变内能的两种方式）"],"ans":3,"why":"推活塞对气体做功、温度又不变，考的是内能与做功、热传递的关系。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["密封气体的质量增加了","缓慢推动活塞，过程可看作等温","温度计显示气体温度不变","分子势能变化忽略不计"],"ans":[1,2,3],"why":"注射器是密封的，气体质量不变；「质量增加」题目没给，也不能加。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["Q=cmΔt","F₁l₁=F₂l₂","W=Fs，做功一定让内能增加","内能=分子动能+分子势能；温度不变 ⇒ 分子平均动能不变"],"ans":3,"why":"内能由动能和势能共同决定，不能只看「做功了」就断定内能变大。"},{"focus":"calc","type":"choice","q":"推活塞时对气体做了功，内能到底怎么变？","opts":["内能减少","分子动能一定增加","内能不变","只有做功改变了内能"],"ans":2,"why":"温度不变⇒动能不变；势能忽略⇒内能不变。做的功以放热方式传出去了。"},{"focus":"check","type":"choice","q":"验一验：这个结论合理吗？","opts":["合理：推得越快内能越大","不用验，选带「不变」的就行","合理：温度不变、势能忽略 ⇒ 内能不变，和「等温」自洽","合理：只要做功，内能就一定增加"],"ans":2,"why":"典型陷阱：做功和内能增加不是一一对应，还要看有没有同时放热。"}],"hints":{"model":["题目问的是内能，还是温度？","推活塞是在做功，但内能不一定跟着增加。"],"cond":["温度计显示什么？温度不变。","题目还说了「分子势能变化忽略不计」，这句话很关键。","质量变了吗？注射器是密封的。"],"rule":["内能 = 分子动能 + 分子势能。","温度决定分子平均动能；势能题目说忽略。","做功和热传递都能改变内能，要一起考虑。"],"calc":["温度不变 ⇒ 动能那一项不变。","势能题目说忽略 ⇒ 另一项也不变。","两项都不变时，内能会怎么变？"],"check":["上一步推活塞做的功去哪了？想想有没有放热。","「做功内能一定增加」是常见错话。"]},"walk":["入口：推活塞做功 + 温度不变 → 内能怎么变。","① 认情境：密封气体被等温压缩。","② 圈条件：缓慢等温、温度不变、分子势能忽略。","③ 选规律：内能=分子动能+分子势能。","④ 判断：动能不变、势能忽略 ⇒ 内能不变。","⑤ 验结果：功以放热方式转移出去，结论自洽。"],"calc":["温度不变 ⇒ 分子平均动能不变","分子势能变化忽略不计","内能 = 分子动能 + 分子势能 ⇒ 内能不变","推活塞做的功通过放热传给外界","检：不是「做功就一定升温」，要看是否有热传递配合"]},{"id":"g12","questionId":"w4q13","title":"热量计算：算出的 80℃ 是升温还是末温","topic":"比热容与热值","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["滑轮组省力","机械能转化","热量计算 Q=cmΔt","杠杆平衡"],"ans":2,"why":"已知质量、初温、比热容，求吸热和末温——热量计算模型。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["水的质量 m=2 kg","初温 t₀=20℃","水吸热 6.72×10⁵ J 后，末温是 100℃","水的比热容 c=4.2×10³ J/(kg·℃)"],"ans":[0,1,3],"why":"「末温 100℃」和「升温 80℃」都是要自己算的，题目没给；不能把答案当条件抄。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["W=Fs","η=W有/W总","Q吸=cmΔt，Δt=末温−初温","Q放=mq"],"ans":2,"why":"求热量用 Q=cmΔt；第二问要的是末温，不是升高的温度。"},{"focus":"calc","type":"fields","q":"两问分别算：先求吸热，再求末温：","fields":[{"type":"num","label":"(1) 水吸收的热量 Q吸 =","ans":252000,"unit":"J","tol":100},{"type":"num","label":"(2) 壶中水的温度 t =","ans":100,"unit":"℃","tol":0.5}],"why":"(1) Δt=50−20=30℃ ⇒ Q=4.2×10³×2×30=2.52×10⁵ J；(2) Δt′=6.72×10⁵/(4.2×10³×2)=80℃ ⇒ t=20+80=100℃。"},{"focus":"check","type":"choice","q":"验一验：末温 100℃ 合理吗？","opts":["不用验，数对就行","合理：100℃ 正好是标准大气压下的沸点，再吸热就汽化，温度不再升","合理：末温应该继续升到 120℃","合理：末温就等于升高的 80℃"],"ans":1,"why":"算出的 80℃ 是「升高的温度」，末温要加初温；还要看是否到沸点。"}],"hints":{"model":["题目给了质量和温度，求的是热量和温度 → 热量计算。","先分清「吸热」和「末温」是两个问。"],"cond":["把 m、t₀、c 连单位抄下来。","题目给的是「升温 80℃」还是「吸热 6.72×10⁵ J」？看清楚。"],"rule":["Q吸=cmΔt，Δt 是温度的变化量。","求末温：t=初温+Δt，别直接写 Δt。"],"calc":["第(1)问：Δt=50−20=30℃，直接代。","第(2)问：先由 Q 求 Δt，再加初温。","注意单位：J、kg、℃ 要配套。"],"check":["水的沸点在标准大气压下是 100℃，末温不可能超过它。","算完回头看一眼：80℃ 是升温还是末温？"]},"walk":["入口：给质量、初温、比热容 → 热量计算模型。","① 认情境：电水壶烧水，求吸热和末温。","② 圈条件：m=2 kg、t₀=20℃、c=4.2×10³ J/(kg·℃)、Q=6.72×10⁵ J。","③ 选规律：Q吸=cmΔt；Δt=末温−初温。","④ 代数据：Q=2.52×10⁵ J；Δt′=80℃ ⇒ t=100℃。","⑤ 验结果：100℃ 是沸点，不会继续升温，合理。"],"calc":["Δt=50℃−20℃=30℃","Q吸=cmΔt=4.2×10³×2×30=2.52×10⁵ J","第二问：Δt′=Q/(cm)=6.72×10⁵÷(4.2×10³×2)=80℃","末温 t=t₀+Δt′=20+80=100℃","检：100℃ 刚好是沸点，不会超过"]},{"id":"g13","questionId":"w5aq14","title":"酒精灯加热水：效率的分子分母各是什么","topic":"比热容与热值","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["热值放热 + 加热效率（Q吸/Q放）","杠杆平衡","滑轮组省力","分子间作用力"],"ans":0,"why":"酒精燃烧放热、水吸热，求效率——比热容与热值的综合计算。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["水 0.2 kg，从 20℃ 升到 30℃","烧掉的酒精是 1.4 kg","酒精初质量 120 g、剩余 118.6 g","酒精热值 3.0×10⁷ J/kg"],"ans":[0,2,3],"why":"120−118.6=1.4 g，不是 1.4 kg；g 和 kg 差 1000 倍。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["F₁l₁=F₂l₂","W=Fs","F=G/n","Q吸=cmΔt；Q放=mq；η=Q吸/Q放"],"ans":3,"why":"效率的分子是水吸的热，分母是燃料完全燃烧放的热。"},{"focus":"calc","type":"fields","q":"分别算水吸热和加热效率：","fields":[{"type":"num","label":"(1) 水吸收的热量 Q吸 =","ans":8400,"unit":"J","tol":50},{"type":"num","label":"(2) 加热水的效率 η =","ans":20,"unit":"%","tol":0.5}],"why":"(1) Q吸=4.2×10³×0.2×10=8.4×10³ J；(2) m=1.4×10⁻³ kg，Q放=1.4×10⁻³×3.0×10⁷=4.2×10⁴ J，η=8.4×10³/4.2×10⁴=20%。"},{"focus":"check","type":"choice","q":"验一验：20% 合理吗？","opts":["合理：η=20%，说明酒精只烧掉了 20%","不合理：效率应该接近 100%","合理：η=20%，所以水一定没到 30℃","合理：η=20% 远小于 100%，大部分热量散失到空气和烧杯，符合实际"],"ans":3,"why":"加热效率 20% 很常见；效率低是热损失多，不是燃料只烧了 20%。"}],"hints":{"model":["题里有两种热：水吸的热和酒精放的热。","效率就是这两个热的比值。"],"cond":["烧掉多少酒精？用初质量减剩余质量。","注意单位：120 g、118.6 g 要换成 kg 再乘热值。"],"rule":["Q吸=cmΔt。","Q放=mq。","η=Q吸/Q放，分子是水吸的热。"],"calc":["先算水吸热：Δt=30−20=10℃。","再算烧掉的酒精质量，换成 kg。","算 Q放，然后相除得效率。"],"check":["效率必须小于 100%。","效率低说明热散失多，不代表燃料没烧完。"]},"walk":["入口：酒精烧水 → 热值与效率的综合计算。","① 认情境：求水吸热和加热效率。","② 圈条件：水 0.2 kg、20→30℃、酒精 120→118.6 g、q=3.0×10⁷ J/kg。","③ 选规律：Q吸=cmΔt、Q放=mq、η=Q吸/Q放。","④ 代数据：Q吸=8.4×10³ J；m=1.4×10⁻³ kg；Q放=4.2×10⁴ J；η=20%。","⑤ 验结果：η<100%，热损失大，合理。"],"calc":["Δt=30℃−20℃=10℃","Q吸=cmΔt=4.2×10³×0.2×10=8.4×10³ J","烧掉的酒精 m=120 g−118.6 g=1.4 g=1.4×10⁻³ kg","Q放=mq=1.4×10⁻³×3.0×10⁷=4.2×10⁴ J","η=Q吸/Q放=8.4×10³÷4.2×10⁴=20%"]},{"id":"g14","questionId":"w6q10","title":"汽油机能量流向图：效率怎么算","topic":"热机与能量","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["杠杆平衡","比热容计算","滑轮组省力","热机效率（读能量流向图）"],"ans":3,"why":"图里是燃料放出的热量怎么分配，求的是热机效率。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["有用的部分已经占 40%","燃料燃烧放出的热量记为 100%","废气 33%、冷却水 30%、摩擦与辐射 7% 是损失","汽油热值 4.6×10⁷ J/kg"],"ans":[1,2,3],"why":"有用功占多少要自己用 100% 减出来，图上没有直接写 40%。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["F₁l₁=F₂l₂","η=G/(G+G动)","η=W有用/Q放；先减掉损失求有用功占比","Q吸=cmΔt"],"ans":2,"why":"效率=有用的能量÷燃料放出的总能量；先求有用的百分比。"},{"focus":"calc","type":"fields","q":"先求有用的百分比，再算 0.5 kg 汽油能输出多少有用功：","fields":[{"type":"num","label":"该汽油机的效率 η =","ans":30,"unit":"%","tol":0.5},{"type":"num","label":"0.5 kg 汽油输出的有用功 W有用 =","ans":6900000,"unit":"J","tol":100000}],"why":"有用=100%−33%−30%−7%=30%；Q放=0.5×4.6×10⁷=2.3×10⁷ J，W有用=30%×2.3×10⁷=6.9×10⁶ J。"},{"focus":"check","type":"choice","q":"验一验：两个结果合理吗？","opts":["合理：燃烧不充分时效率会升高","不用验，图上百分比抄下来就行","合理：η=30%<100%，6.9×10⁶ J 也小于 Q放=2.3×10⁷ J","合理：η 应该接近 100%，30% 说明算错"],"ans":2,"why":"两步验：η 在 0~100%；有用功一定小于 Q放。燃烧不充分放热少，效率会降低。"}],"hints":{"model":["图里是一个「能量分配饼」：放出的热去了哪些地方。","效率 = 有用的那一块 ÷ 总热量。"],"cond":["损失有哪几项？把百分比找出来。","有用功占多少，图上直接写了吗？没有，要自己减。"],"rule":["η=W有用/Q放。","先把所有损失加起来，再用 100% 减。","Q放=mq，m 要用 kg。"],"calc":["图里损失有哪几项？先把它们的百分比加起来。","有用功占比 = 100% − 损失的百分比。","Q放=mq（m 用 kg）；再用「占比 × Q放」求有用功。"],"check":["效率一定在 0~100% 之间。","有用功必须小于燃料放出的热量。"]},"walk":["入口：能量流向图 + 求效率 → 热机效率。","① 认情境：汽油机的热量分配。","② 圈条件：总热量 100%；损失 33%、30%、7%；q=4.6×10⁷ J/kg。","③ 选规律：η=W有用/Q放，先求有用功占比。","④ 代数据：η=30%；Q放=2.3×10⁷ J；W有用=6.9×10⁶ J。","⑤ 验结果：η<100%，有用功<Q放，合理。"],"calc":["损失合计：33%+30%+7%=70%","有用功占比：100%−70%=30%","Q放=mq=0.5×4.6×10⁷=2.3×10⁷ J","W有用=30%×2.3×10⁷=6.9×10⁶ J","检：η<100%，W有用<Q放，燃烧不充分时 η 更低"]},{"id":"g15","questionId":"w5aq13","title":"探究杠杆平衡条件：调平、挂钩码、改方向","topic":"实验探究","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["测比热容","热机冲程","探究杠杆平衡条件的实验","探究滑轮组机械效率"],"ans":2,"why":"器材是杠杆、钩码、弹簧测力计——考的是杠杆平衡条件的探究步骤。"},{"focus":"cond","type":"multi","q":"先圈条件：下面哪些是题目给的？","opts":["杠杆刻度均匀","实验前杠杆静止在支架上","杠杆自重可以忽略不计","用弹簧测力计向下拉"],"ans":[0,1,3],"why":"题目没说杠杆自重不计；实验是靠先调水平平衡，把杠杆自重的影响抵消掉。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["η=W有/W总","Q=cmΔt","F=G/n","杠杆平衡条件 F₁l₁=F₂l₂（用「钩码重×格数」验证）"],"ans":3,"why":"让杠杆水平平衡后，两边「钩码重×格数」相等，就是在验证平衡条件。"},{"focus":"calc","type":"fields","q":"按图乙、图丙的数据算一算：","fields":[{"type":"num","label":"(2) B 位置应挂钩码","ans":6,"unit":"个","tol":0.01},{"type":"text","label":"(3) 测力计示数将","ans":["变大"],"mode":"exact"}],"why":"(2) 3G×4l=nG×2l ⇒ n=6；(3) 向左偏转时力臂变小，F×l 不变 ⇒ F 变大。"},{"focus":"check","type":"choice","q":"验一验：这个结果说得通吗？","opts":["不用验，实验做一遍就知道了","合理：两边「力×格数」都是 12Gl，乘积相等才平衡","合理：B 位置挂 6 个比 A 的 3 个多，说明杠杆不省力","不合理：平衡时两边钩码数应该相等"],"ans":1,"why":"验的是「力×力臂」的乘积，不是比钩码个数；力臂不同，钩码数当然不同。"}],"hints":{"model":["看器材：杠杆、钩码、弹簧测力计。","题目问的是「平衡条件」，不是省不省力。"],"cond":["实验前杠杆是不是水平的？不水平要调螺母。","杠杆自重题目说忽略了吗？没说就别自己加。"],"rule":["杠杆水平平衡时，力臂就是杠杆上的格数。","两边「钩码重×格数」相等 = 杠杆平衡条件。"],"calc":["图乙：数 A、B 各离支点几格、各挂几个钩码。","图丙：拉力方向偏了，力臂变大还是变小？","力臂变小而力矩不变，拉力就要变大。"],"check":["把两边乘积算出来对一对，相等才平衡。","弹簧测力计读数还要看量程和分度值。"]},"walk":["入口：杠杆、钩码、测力计 → 探究杠杆平衡条件。","① 认情境：调平杠杆，再用钩码和测力计验证平衡条件。","② 圈条件：刻度均匀、杠杆静止、测力计向下拉；杆重未忽略。","③ 选规律：F₁l₁=F₂l₂，力臂用格数表示。","④ 代数据：3G×4l=nG×2l ⇒ n=6；拉力偏转后力臂变小 ⇒ 示数变大。","⑤ 验结果：两边乘积相等才平衡；读数要看量程。"],"calc":["(1) 杠杆静止就是平衡；图甲左端高，螺母向左调","(2) A 侧：3G×4l；B 侧：nG×2l ⇒ n=6","(3) 拉力向左偏，力臂变小 ⇒ 测力计示数变大","(4)① 空盆平衡时秤砣在支点处 ⇒ 0 g","(4)② 每 50 g 对应 5 cm ⇒ 250 g 时 x=26 cm"]},{"id":"g16","questionId":"mid1q02","topic":"滑轮","title":"测力计挂在绳上：它量的到底是什么","steps":[{"focus":"model","type":"choice","q":"弹簧测力计串在绳上，这题真正在问什么？","opts":["滑轮的机械效率","测力计的示数代表绳中的张力","做功的多少","热量的计算"],"ans":1,"why":"测力计的读数就是它受到的那段绳的拉力。同一根绳上张力处处相等，所以示数就等于 F。"},{"focus":"cond","type":"multi","q":"先圈条件：题目给了哪些？","opts":["测力计的示数 6N","忽略绳重和摩擦","绳子的段数 n 要自己从图上数","动滑轮重 3N"],"ans":[0,1,2],"why":"本题没给动滑轮重；求「绳中张力」这一步也不需要它。别把自己编的数代进去。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["同一根绳上各处的张力大小相等","F=(G+G动)/n","W=Fs","η=W有/W总"],"ans":0,"why":"绳绕过滑轮只是改变方向，张力不变；乘 n、除 n 是「求拉力」和「求物重」时才用的。"},{"focus":"calc","type":"fields","q":"测力计示数为 6N，绳自由端的拉力 F 是多少？","fields":[{"type":"num","label":"绳自由端的拉力 F","ans":6,"unit":"N","tol":0.01}],"why":"同一根绳张力处处相等，示数 6N 就是 F=6N，不用再乘 3。反过来若要求物重，才用 G=nF−G动。"},{"focus":"check","type":"choice","q":"验一验：这个结果合理吗？","opts":["合理：示数就是张力，F=6N","不合理：应该乘绳子段数 3，得 18N","不合理：应该除以 3"],"ans":0,"why":"18N 是「测力计同时吊着几段绳」才可能出现的情况；本题测力计只串在一段绳里。"}],"hints":{"model":["先问：这个测力计卡在哪儿？它两端各连着谁？","它只受到一段绳的拉力。"],"cond":["把数字抄下来：示数 6N、不计绳重摩擦。","图上数一数吊着动滑轮的绳子有几段。"],"rule":["同一根绳，张力处处相等。","乘 n 还是除以 n，要看已知的是物重还是绳端拉力。"],"calc":["示数就是 F，直接写。","想验证的话：由 F=(G+G动)/n 反推 G。"],"check":["F 一定小于物重（省力），但不必等于 G/n 之外的东西。","回头想：18N 是 6×3 得来的，为什么要乘 3？"]},"walk":["入口：测力计串在绳上 → 它量的是绳中张力。","① 认情境：滑轮组省力问题，但问的是测力计读数。","② 圈条件：示数 6N、不计绳重摩擦、n 从图上数。","③ 选规律：同一根绳张力处处相等 → 示数 = F。","④ 代数据：F = 6N。","⑤ 验结果：F 小于物重，符合省力；18N 是把「张力」当成了「几段绳的合力」。"],"calc":["同一根绳 → 张力处处相等","测力计示数 = 绳中张力 = F","所以 F = 6N","若要求物重：G = nF − G动 = 3×6 − G动"]},{"id":"g17","questionId":"mid1q12","topic":"电学","title":"并联电路：先认清表在哪条路上","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["串联电路的电流规律","并联电路的电流规律 + 电流表位置","电流表的读数方法","电压与电阻的关系"],"ans":1,"why":"两只灯各占一条支路，A₁ 只串在 L₁ 那条支路上，A₂ 在干路上 —— 这是并联的电流分配问题。"},{"focus":"cond","type":"multi","q":"看电路图，哪些判断是对的？","opts":["A₁ 与 L₁ 串联，测 L₁ 支路电流","A₂ 在干路上，测总电流","L₁ 与 L₂ 并联","A₁ 和 A₂ 的示数一定相同"],"ans":[0,1,2],"why":"并联时干路电流大于任一支路电流，两只表示数不可能相同 —— 这一点可以用来检查连线对不对。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["I = I₁ + I₂（干路电流等于各支路之和）","I = I₁ = I₂（串联电流处处相等）","U = IR","P = W/t"],"ans":0,"why":"并联分流：干路电流等于两条支路电流之和，所以另一条支路用减法。"},{"focus":"calc","type":"fields","q":"A₁ 示数 0.3A，A₂ 示数 1.5A，求通过 L₂ 的电流。","fields":[{"type":"num","label":"通过 L₂ 的电流 I₂","ans":1.2,"unit":"A","tol":0.01}],"why":"I₂ = I − I₁ = 1.5 − 0.3 = 1.2A。"},{"focus":"check","type":"choice","q":"验一验：这个结果合理吗？","opts":["合理：1.2A 小于干路 1.5A，且 0.3+1.2=1.5","不合理：支路电流应该比干路大","无法判断"],"ans":0,"why":"支路电流一定小于干路电流；两数相加能回到干路，就说明没算错。"}],"hints":{"model":["先沿着电流走一圈：从电源正极出来，在哪里分了岔？","分岔之后各走一条路，就是并联。"],"cond":["把两只表的位置标出来：谁在岔路前，谁在岔路后。","在岔路后、只管一只灯的，是支路电流表。"],"rule":["并联：干路 = 各支路之和。","已知干路和一条支路，另一条用减法。"],"calc":["I₂ = 1.5 − 0.3。","注意单位是 A，不要写成 1.2mA。"],"check":["支路电流必须小于干路电流。","把两条支路加起来看能不能回到干路。"]},"walk":["入口：两只灯各走一条路 → 并联。","① 认情境：并联电路，已知一条支路和干路电流。","② 圈条件：A₁ 测 L₁ 支路 0.3A；A₂ 测干路 1.5A。","③ 选规律：I = I₁ + I₂。","④ 代数据：I₂ = 1.5 − 0.3 = 1.2A。","⑤ 验结果：0.3 + 1.2 = 1.5，回到干路电流。"],"calc":["并联 → 干路电流等于各支路之和","I = I₁ + I₂","I₂ = I − I₁ = 1.5 A − 0.3 A = 1.2 A","检：I₂ < I，符合支路电流小于干路"]},{"id":"g18","questionId":"mid1q13","topic":"比热容与热值","title":"烧水算效率：三个质量别拿错","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["热量计算：Q吸=cmΔt、Q放=mq、η=Q吸/Q放","机械效率计算","杠杆平衡","功率计算"],"ans":0,"why":"燃料烧水，一边算水吸的热，一边算燃料放的热，两者相除就是效率。"},{"focus":"cond","type":"multi","q":"哪些量可以直接代进 Q = cmΔt？","opts":["水的质量 5kg","水的温度变化 Δt = 68−20 = 48℃","炭炉和炭的总质量 3kg","木炭的热值 3.4×10⁷J/kg"],"ans":[0,1],"why":"Q=cmΔt 里的 m 是「吸热的那个物体」的质量，只有水在吸热；炉子和木炭是放热的一方，不能代进来。"},{"focus":"rule","type":"choice","q":"用哪条规律？","opts":["水吸热 Q吸=cmΔt；烧掉的炭 = 3−2.8；效率 η=Q吸/Q放","W=Fs","F₁l₁=F₂l₂","P=W/t"],"ans":0,"why":"三个动作：算吸热、算烧掉的燃料、相除求效率。"},{"focus":"calc","type":"fields","q":"算一算：水吸的热、烧掉的木炭、木炭放的热、效率。","fields":[{"type":"num","label":"水吸收的热量 Q吸","ans":1008000,"unit":"J","tol":100},{"type":"num","label":"烧掉的木炭质量","ans":0.2,"unit":"kg","tol":0.001},{"type":"num","label":"木炭放出的热量 Q放","ans":6800000,"unit":"J","tol":1000},{"type":"coef","label":"效率","tpl":"η = {0}%","ans":[14.8],"tol":0.2}],"why":"Q吸=4.2×10³×5×48=1.008×10⁶J；烧掉 3−2.8=0.2kg，Q放=3.4×10⁷×0.2=6.8×10⁶J；η=1.008/6.8≈14.8%。"},{"focus":"check","type":"choice","q":"验一验：效率只有 14.8%，合理吗？","opts":["合理：大部分热散到空气里、被炉体吸走，烧水效率本来就低","不合理：效率应该接近 100%","数据不全，算不出来"],"ans":0,"why":"敞开烧水，热量大量散失，10%~30% 很常见。算出来接近 100% 反而要回头查质量用错没有。"}],"hints":{"model":["先分清两方：谁吸热、谁放热。","水吸热用 Q=cmΔt；木炭放热用 Q=mq。"],"cond":["在草稿上写一行：m水=？Δt=？m炭烧掉=？","炉子和炭总质量 3kg 是「烧之前」的数。"],"rule":["烧掉的燃料 = 原来的 − 剩下的。","效率 = 吸到的 ÷ 放出的。"],"calc":["Q吸 = 4.2×10³ × 5 × 48。","Q放 = 3.4×10⁷ × 0.2。","η = 1.008×10⁶ ÷ 6.8×10⁶。"],"check":["敞开烧水的效率很低，是常识。","效率超过 100% 一定是质量或单位用错了。"]},"walk":["入口：燃料放热、水吸热 → 热量计算 + 效率。","① 认情境：炭炉烧水，求效率。","② 圈条件：m水=5kg、Δt=48℃、m总=3kg、剩余 2.8kg、q=3.4×10⁷J/kg。","③ 选规律：Q吸=cmΔt、Q放=mq、η=Q吸/Q放。","④ 代数据：1.008×10⁶J；0.2kg；6.8×10⁶J；14.8%。","⑤ 验结果：效率远低于 100%，符合敞开烧水的实际。"],"calc":["Q吸 = cmΔt = 4.2×10³×5×48 = 1.008×10⁶ J","m烧掉 = 3 − 2.8 = 0.2 kg","Q放 = mq = 3.4×10⁷×0.2 = 6.8×10⁶ J","η = 1.008×10⁶ ÷ 6.8×10⁶ ≈ 14.8%"]},{"id":"g19","questionId":"mid1q16","topic":"热机与能量","title":"认冲程：先看气门，再看活塞","steps":[{"focus":"model","type":"choice","q":"这题属于哪一类问题？","opts":["汽油机四个冲程的识别","热机效率的计算","改变内能的方式","能量守恒定律"],"ans":0,"why":"给的是气缸剖面图，问每个冲程叫什么、顺序怎么排 —— 这是「认图」题。"},{"focus":"cond","type":"multi","q":"判断一个冲程，要看图上哪些信息？","opts":["进气门开还是关","排气门开还是关","活塞向上还是向下","有没有火花塞点火","气缸壁的颜色"],"ans":[0,1,2,3],"why":"四个信息组合起来才能定冲程；只看活塞方向，吸气排气分不清。"},{"focus":"rule","type":"choice","q":"判断的先后顺序应该是？","opts":["先看气门开闭，两门都关再看有无火花和活塞方向","只看活塞向上还是向下","只看温度高低","先看飞轮转多快"],"ans":0,"why":"气门开着就一定是吸气或排气；两门都关才是压缩或做功，这时靠「有无火花/活塞方向」区分。"},{"focus":"calc","type":"fields","q":"这台汽油机效率 35%，消耗汽油放热 2300J，求做的有用功和消耗的汽油质量（q=4.6×10⁷J/kg）。","fields":[{"type":"num","label":"做的有用功 W","ans":805,"unit":"J","tol":1},{"type":"num","label":"消耗的汽油质量 m","ans":0.00005,"unit":"kg","tol":0.000001}],"why":"W=ηQ放=0.35×2300=805J；m=Q放/q=2300/4.6×10⁷=5×10⁻⁵kg。"},{"focus":"check","type":"choice","q":"验一验：结果合理吗？","opts":["合理：有用功 805J 小于放出的 2300J，质量只有几十毫克","不合理：有用功应该大于放出的热量","无法判断"],"ans":0,"why":"效率小于 1，所以 W 一定小于 Q放；5×10⁻⁵kg 就是 0.05g，一滴油的质量，量级合理。"}],"hints":{"model":["题目给的是气缸剖面图，问的是「这是什么冲程」。","先看有没有气门打开。"],"cond":["四个信息：进气门、排气门、活塞方向、火花。","图上画的箭头、火花都是线索，别漏看。"],"rule":["气门开着 → 吸气（进气门）或排气（排气门）。","两门都关 → 有火花是做功，没火花是压缩。"],"calc":["W = η × Q放。","m = Q放 ÷ q，注意 2300J 是很小的能量，质量也会很小。"],"check":["效率小于 1 ⇒ W 小于 Q放。","5×10⁻⁵kg = 0.05g，量级对不对？"]},"walk":["入口：气缸剖面图 → 认冲程。","① 认情境：汽油机工作循环，图序被打乱。","② 圈条件：四个图各自的气门、活塞、火花。","③ 选规律：气门开闭定大类，火花和活塞方向定压缩/做功。","④ 代数据：做功 35%×2300=805J；m=2300/4.6×10⁷=5×10⁻⁵kg。","⑤ 验结果：W<Q放，质量是毫克级，合理。"],"calc":["气门开着 → 吸气 / 排气","两门都关 + 火花 → 做功；无火花 → 压缩","循环顺序：吸气 → 压缩 → 做功 → 排气","W = 0.35×2300 = 805 J","m = 2300 ÷ 4.6×10⁷ = 5×10⁻⁵ kg"]}]};

          ctrls.forEach(function (c) {
            if (c.kind === 'coef') c.inputs.forEach(function (i) { i.className = 'inp'; i.value = ''; });
            else if (c.kind === 'num') { c.input.className = 'inp'; c.input.value = ''; }
            else if (c.kind === 'text') { c.input.className = 'inp wide'; c.input.value = ''; }
            else if (c.kind === 'choice') {
              c.sel.v = null;
              Array.prototype.forEach.call(c.box.children, function (b) { b.classList.remove('sel', 'ok', 'no'); });
            }
          });
        },
        focus: function () {
          for (var i = 0; i < ctrls.length; i++) {
            var c = ctrls[i];
            if (c.input) { c.input.focus(); return; }
            if (c.inputs && c.inputs[0]) { c.inputs[0].focus(); return; }
          }
        }
      };
    },
    zoom: function (src) {
      var ov = document.createElement('div');
      ov.className = 'zoom-ov';
      ov.innerHTML = '<img src="' + esc(src) + '" alt="原题图">';
      ov.addEventListener('click', function () { ov.remove(); });
      document.body.appendChild(ov);
    },
    toast: function (msg, kind) {
      var t = document.createElement('div');
      t.className = 'toast ' + (kind || 'info');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function () { t.classList.add('out'); }, 1600);
      setTimeout(function () { t.remove(); }, 2200);
    },
    modal: function (o) {
      var ov = document.createElement('div');
      ov.className = 'modal-ov';
      var acts = (o.actions || []).map(function (a) {
        var b = document.createElement('button');
        b.className = 'btn ' + (a.kind === 'primary' ? 'btn-primary' : '');
        b.textContent = a.text;
        b.addEventListener('click', function () { if (a.onClick) a.onClick(); if (a.keep !== true) close(); });
        return b;
      });
      var box = document.createElement('div');
      box.className = 'modal';
      box.innerHTML = '<h3>' + esc(o.title || '') + '</h3>';
      var body = document.createElement('div');
      body.className = 'modal-body small';
      if (typeof o.body === 'string') body.innerHTML = o.body; else if (o.body) body.appendChild(o.body);
      box.appendChild(body);
      if (acts.length) {
        var foot = document.createElement('div');
        foot.className = 'modal-foot';
        acts.forEach(function (b) { foot.appendChild(b); });
        box.appendChild(foot);
      }
      ov.appendChild(box);
      ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
      document.body.appendChild(ov);
      function close() { ov.remove(); }
      return close;
    },
    confirm: function (msg, okText) {
      return new Promise(function (resolve) {
        var done = false;
        var close = UI.modal({
          title: '确认一下',
          body: '<p>' + esc(msg) + '</p>',
          actions: [
            { text: '取消', onClick: function () { done = true; resolve(false); } },
            { text: okText || '确定', kind: 'primary', onClick: function () { done = true; resolve(true); } }
          ]
        });
        var timer = setInterval(function () {
          if (!document.body.contains(document.querySelector('.modal-ov'))) { clearInterval(timer); if (!done) resolve(false); }
        }, 300);
      });
    },
    addCSS: function (css) {
      var key = css.slice(0, 60);
      if (cssInjected[key]) return;
      cssInjected[key] = true;
      var s = document.createElement('style');
      s.textContent = css;
      document.head.appendChild(s);
    },
    /** 通用：把 "A．xxx" 之类的前缀去掉 */
    stripOptionPrefix: function (s) {
      return String(s || '').replace(/^\s*[A-Z][．.、]\s*/, '');
    }
  };

  /* ---------------- 启动 ---------------- */
  PHYS.boot = function () {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else start();
    function start() {
      var bar = document.getElementById('nav');
      if (bar) {
        bar.innerHTML = '';
        PHYS.registry.all().forEach(function (m) {
          var a = document.createElement('a');
          a.className = 'navlink';
          a.href = '#/' + m.id;
          a.setAttribute('data-nav', m.id);
          a.innerHTML = (m.icon ? '<i>' + m.icon + '</i>' : '') + '<span>' + esc(m.short || m.title) + '</span>';
          bar.appendChild(a);
        });
      }
      window.addEventListener('hashchange', renderRoute);
      document.addEventListener('click', function (e) {
        var t = e.target;
        if (t && t.tagName === 'IMG' && t.getAttribute('data-zoom')) UI.zoom(t.getAttribute('data-zoom'));
      });
      renderRoute();
    }
  };
})();

/* ===== 20-shell.js ===== */
/* =============================================================
   外壳：五步定义 + 首页（Lead 维护）
   ============================================================= */
(function () {
  'use strict';
  var PHYS = window.PHYS, U = PHYS.util, UI = PHYS.ui;

  /* 五步定义（全站共用） */
  PHYS.FIVE = [
    { k: 'model', n: '认情境', d: '这是什么模型 / 什么现象', ask: '先别算，先说清这题在考什么' },
    { k: 'cond', n: '圈条件', d: '已知、所求、隐含条件', ask: '把数字连单位一起抄下来，题目没给的不许自己加' },
    { k: 'rule', n: '选规律', d: '用哪条公式 / 原理', ask: '为什么能用它？适用条件满足了吗' },
    { k: 'calc', n: '代数据', d: '单位统一 → 代入 → 算', ask: '先换单位，再代数字，别跳步' },
    { k: 'check', n: '验结果', d: '单位、量级、常识', ask: '这个数合理吗？有没有超过 100% 这种事' }
  ];
  PHYS.FIVE_BY = {};
  PHYS.FIVE.forEach(function (s) { PHYS.FIVE_BY[s.k] = s; });

  PHYS.shell = {
    /** 顶栏"今天"状态 */
    refreshChip: function () {
      var el = document.getElementById('chip-day');
      if (!el) return;
      var d = PHYS.store.get('days.' + U.today(), null) || { guided: 0, exam: 0, concept: 0 };
      var n = (d.guided || 0) + (d.exam || 0) + (d.concept || 0);
      var st = PHYS.progress.stats();
      if (!n) { el.textContent = '今天还没练 · 连续 ' + st.streak + ' 天'; }
      else { el.textContent = '今天 ' + n + ' 次 · 连续 ' + st.streak + ' 天'; }
    },
    help: function () {
      UI.modal({
        title: '怎么用这个工具',
        body: '<ol class="small" style="padding-left:20px;line-height:1.9">' +
          '<li><b>五步引导</b>：每题只问五步，先想再点。提示分三级，能不看就不看。<b>只有第一次就答对才算会</b>。</li>' +
          '<li><b>概念闪练</b>：每天 2 分钟，把易混概念刷到"掌握"。答错会立刻给一句话解释。</li>' +
          '<li><b>试卷练习</b>：学校发了卷子，<b>先在纸上整张做完</b>，再一题一题录答案；错题自动进错题本。</li>' +
          '<li><b>错题回炉 / 训练报告</b>：一周看一次，只补最红的那一环，不要平均用力。</li>' +
          '<li>所有记录存在这台设备的浏览器里（关掉不丢）；换电脑用「报告」里的导出/导入。</li>' +
          '</ol><p class="tiny muted" style="margin-top:10px">图片在 <code>图片/</code> 文件夹，移动网页时要连文件夹一起搬。</p>',
        actions: [{ text: '知道了', kind: 'primary' }]
      });
    }
  };

  /* ---------------- 首页 ---------------- */
  function pickRecommend(s) {
    var gTotal = (PHYS.DATA.guided || []).length || 0;
    var gDone = s.guidedDone || 0;
    if (!gDone && gTotal) {
      return {
        type: 'guided', mode: 'guided',
        title: '从第 1 题开始走一遍五步',
        why: '第一次不用求快。看着工具一步步问，把「想」和「算」分开。'
      };
    }
    /* 找最弱的一环：至少 3 次作答，命中率最低 */
    var weak = null;
    PHYS.FIVE.forEach(function (st) {
      var r = s.stepRates[st.k];
      if (r === null || r === undefined) return;
      var n = (PHYS.store.get('stepStats.' + st.k, { n: 0 }).n) || 0;
      if (n < 3) return;
      if (!weak || r < weak.r) weak = { k: st.k, r: r, n: n, st: st };
    });
    if (weak && weak.r < 0.7) {
      return {
        type: 'weak', mode: 'guided',
        title: '最弱的一环：' + weak.st.n + '（命中率 ' + U.fmtPct(weak.r) + '）',
        why: '这一环你 ' + weak.n + ' 次作答只对 ' + Math.round(weak.n * weak.r) + ' 次。做 1 题引导训练，卡在这一步时多想 20 秒。'
      };
    }
    var wrong = PHYS.progress.wrongList();
    if (wrong.length) {
      return {
        type: 'wrong', mode: 'wrong',
        title: '错题回炉：' + wrong.length + ' 道还没清',
        why: '错过的题不清，刷再多新题也是把同一个错误刷得更熟。'
      };
    }
    if (s.exam.n < s.exam.packs.reduce(function (a, p) { return a + p.total; }, 0)) {
      return {
        type: 'exam', mode: 'exam',
        title: '用试卷练习验收一下',
        why: '先在纸上整张做完，再回来一题一题录答案、对解析。'
      };
    }
    return {
      type: 'concept', mode: 'concept',
      title: '概念闪练：2 分钟一轮',
      why: '把易混概念刷到"掌握"，做题时就不容易在第一步站错队。'
    };
  }

  function miniFlow(s) {
    var box = UI.el('div', { class: 'flow' });
    PHYS.FIVE.forEach(function (st) {
      var r = s.stepRates[st.k];
      var hint = r === null ? '还没数据' : U.fmtPct(r);
      box.appendChild(UI.el('div', { html: '<b>' + st.n + '</b><span>' + hint + '</span><i>' + st.d + '</i>' }));
    });
    return box;
  }

  PHYS.registry.register({
    id: 'home', title: '首页', short: '首页', icon: '⌂', order: 0,
    mount: function (root) {
      var s = PHYS.progress.stats();
      var rec = pickRecommend(s);
      var gTotal = (PHYS.DATA.guided || []).length || 0;
      var cTotal = (PHYS.DATA.concepts || []).length || 0;
      var exTotal = s.exam.packs.reduce(function (a, p) { return a + p.total; }, 0);

      var hero = UI.el('div', { class: 'card hero' });
      var h2 = '听懂课，不等于会做题。';
      var sub = '上课是跟着老师走一遍；做题得自己走完下面这条链。断在哪一环，多刷题补不上——所以这里一次只练一环。';
      hero.innerHTML =
        '<h2>' + h2 + '</h2>' +
        '<p class="why">' + sub + '</p>';
      hero.appendChild(miniFlow(s));
      hero.appendChild(UI.el('p', { class: 'tiny muted', style: 'margin-top:10px', text: '上面数字 = 这一环「第一次就答对」的比例（看提示后答对不算）。没有数字就先走一题。' }));
      root.appendChild(hero);

      /* 今日建议 */
      var recBox = UI.el('div', { class: 'rec-box' });
      recBox.innerHTML = '<div class="row"><span class="tag">今天先做这个</span></div>' +
        '<h3 style="margin-top:8px">' + UI.escape(rec.title) + '</h3>' +
        '<p class="small muted" style="margin-top:4px">' + UI.escape(rec.why) + '</p>';
      var go = UI.el('button', { class: 'btn btn-primary', style: 'margin-top:12px', type: 'button', text: '开始 →' });
      go.addEventListener('click', function () { PHYS.route.go(rec.mode); });
      recBox.appendChild(go);
      root.appendChild(recBox);

      /* 模式入口 */
      var modes = UI.el('div', { class: 'modes' });
      PHYS.registry.all().forEach(function (m) {
        if (m.id === 'home') return;
        var a = document.createElement('a');
        a.className = 'mode' + (m.id === rec.mode ? ' rec' : '');
        a.href = '#/' + m.id;
        a.innerHTML = '<h3>' + (m.icon ? '<span>' + m.icon + '</span>' : '') + UI.escape(m.title) + '</h3>' +
          '<p>' + UI.escape(m.desc || '') + '</p>' +
          '<span class="go">' + (m.id === rec.mode ? '今天就做这个 →' : '进入 →') + '</span>';
        modes.appendChild(a);
      });
      root.appendChild(modes);

      /* 进度概览 */
      var ov = UI.el('div', { class: 'card' });
      ov.innerHTML = '<h2>练到哪儿了</h2>';
      var g = s.guidedDone;
      ov.appendChild(kvRow('五步引导', g + ' / ' + gTotal + ' 题走完', g / (gTotal || 1)));
      var cMastered = s.concept.levels[3], cFamiliar = s.concept.levels[2];
      ov.appendChild(kvRow('概念掌握', '掌握 ' + cMastered + ' · 熟悉 ' + cFamiliar + ' / ' + cTotal + ' 张', (cMastered + cFamiliar * .6) / (cTotal || 1)));
      ov.appendChild(kvRow('试卷练习', (s.exam.rate === null ? '还没录' : '正确率 ' + U.fmtPct(s.exam.rate)) + '（' + s.exam.n + ' / ' + exTotal + ' 题）', s.exam.rate || 0));
      ov.appendChild(kvRow('错题待清', s.wrong + ' 道', 1 - Math.min(1, s.wrong / 20)));
      root.appendChild(ov);

      /* 最近错题 */
      var wrong = PHYS.progress.wrongList().slice(0, 5);
      if (wrong.length) {
        var wc = UI.el('div', { class: 'card' });
        wc.innerHTML = '<div class="row"><h2 style="margin:0">最近卡住的</h2><span class="spacer"></span>' +
          '<a class="btn-mini" href="#/wrong">全部 →</a></div>';
        var ul = UI.el('div', { style: 'margin-top:8px' });
        wrong.forEach(function (w) { ul.appendChild(wrongRow(w)); });
        wc.appendChild(ul);
        root.appendChild(wc);
      }
      PHYS.shell.refreshChip();
    }
  });

  function kvRow(label, val, rate) {
    var pct = Math.round(U.clamp(rate || 0, 0, 1) * 100);
    var cls = pct >= 75 ? 'ok' : pct >= 40 ? '' : 'warn';
    var d = UI.el('div', { style: 'padding:7px 0' });
    d.innerHTML = '<div class="row" style="justify-content:space-between;font-size:13.5px">' +
      '<span>' + label + '</span><b>' + val + '</b></div>' +
      '<div class="bar ' + cls + '" style="margin-top:5px"><i style="width:' + pct + '%"></i></div>';
    return d;
  }

  function wrongRow(w) {
    var label = '', sub = '', href = '#/wrong';
    if (w.kind === 'guided') {
      var g = (PHYS.DATA.guided || []).filter(function (x) { return x.questionId === w.qid; })[0];
      label = g ? g.title : w.qid;
      sub = '五步引导没走通';
      href = '#/guided?q=' + encodeURIComponent(w.qid);
    } else if (w.kind === 'exam') {
      var p = (PHYS.DATA.packs || []).filter(function (x) { return x.id === w.packId; })[0];
      var q = p ? p.questions.filter(function (x) { return x.id === w.qid; })[0] : null;
      label = (p ? p.name : w.packId) + ' 第 ' + (q ? q.no : '?') + ' 题';
      sub = (q && q.tags ? q.tags.join(' · ') : '试卷练习') + (w.n ? ' · 累计错 ' + w.n + ' 次' : '');
      href = '#/exam/' + encodeURIComponent(w.packId) + '?q=' + encodeURIComponent(w.qid);
    } else if (w.kind === 'concept') {
      var c = (PHYS.DATA.concepts || []).filter(function (x) { return x.id === w.cid; })[0];
      label = c ? c.q : w.cid;
      sub = '概念没掌握' + (c && c.tags ? ' · ' + c.tags.join('/') : '');
    }
    var d = UI.el('a', { class: 'kv', href: href, style: 'text-decoration:none;color:inherit;display:flex' });
    d.innerHTML = '<span style="min-width:0"><b style="font-weight:600">' + UI.escape(label) + '</b>' +
      '<span class="tiny muted" style="display:block">' + UI.escape(sub) + '</span></span>' +
      '<span class="tiny muted" style="margin-left:auto;white-space:nowrap">' + U.daysAgo(w.at) + ' 天前</span>';
    return d;
  }
  PHYS._kvRow = kvRow;
  PHYS._wrongRow = wrongRow;

  /* ---------------- 导航横滑提示 ---------------- */
  /* #nav 在手机上靠 overflow-x 横滑，项目一多后面的模式就推在屏幕外，且没有滚动条。
     CSS 用 mask-image 做边缘渐隐，这里只负责告诉 CSS「左边/右边还有没有内容」：
     只读 scrollWidth / clientWidth / scrollLeft，不碰路由、不碰题目逻辑。 */
  function syncNavEdges(nav) {
    var max = nav.scrollWidth - nav.clientWidth;
    var canRight = max > 1 && nav.scrollLeft < max - 1;
    var canLeft = max > 1 && nav.scrollLeft > 1;
    nav.classList.toggle('can-scroll-right', canRight);
    nav.classList.toggle('can-scroll-left', canLeft);
  }

  function initNavScrollHint(tries) {
    var nav = document.getElementById('nav');
    if (!nav) return;
    /* 导航条目由 PHYS.boot（00-core.js）渲染，而本文件先于 90-app.js 执行：
       拿到空 nav 就等下一拍再试（最多约 1 秒，失败也不影响页面） */
    if (!nav.children.length) {
      if ((tries || 0) < 40) setTimeout(function () { initNavScrollHint((tries || 0) + 1); }, 25);
      return;
    }
    if (nav.getAttribute('data-scroll-hint') === 'on') return;
    nav.setAttribute('data-scroll-hint', 'on');
    nav.addEventListener('scroll', function () { syncNavEdges(nav); }, { passive: true });
    window.addEventListener('resize', function () { syncNavEdges(nav); });
    window.addEventListener('orientationchange', function () { syncNavEdges(nav); });
    window.addEventListener('load', function () { syncNavEdges(nav); });
    if (document.fonts && document.fonts.ready) {
      try { document.fonts.ready.then(function () { syncNavEdges(nav); }); } catch (e) { }
    }
    if (typeof ResizeObserver === 'function') {
      try { new ResizeObserver(function () { syncNavEdges(nav); }).observe(nav); } catch (e) { }
    }
    syncNavEdges(nav);
    nav.classList.add('nav-ready'); /* 关掉窄屏的纯 CSS 兜底遮罩，改由上面精确控制 */
  }

  /* 顶栏按钮 + 导航横滑提示 */
  document.addEventListener('DOMContentLoaded', function () {
    var h = document.getElementById('btn-help');
    if (h) h.addEventListener('click', PHYS.shell.help);
    /* boot 的 DOMContentLoaded 监听在本文件之后注册，推迟一拍才能拿到已渲染的导航 */
    setTimeout(function () { initNavScrollHint(); }, 0);
  });
})();


/* ===== 30-guided.js ===== */
/* =============================================================

(function () {

  var PHYS = window.PHYS, U = PHYS.util, UI = PHYS.ui;
  var FIVE = PHYS.FIVE;

  /* 题号 → 题目对象索引 */
  function qIndex() {

    (PHYS.DATA.packs || []).forEach(function (p) {
      (p.questions || []).forEach(function (q) { map[q.id] = { q: q, pack: p }; });
    });

  }

  UI.addCSS(
    '.gd-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}' +
    '.gd-item{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--sh);transition:.15s;display:flex;flex-direction:column;gap:4px}' +
