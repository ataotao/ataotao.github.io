中航线①是横渡大西洋到达美洲的路线，对应的人物是哥伦布，并非达·伽马，错误。","B":"②号所在的那条线是沿着非洲西海岸南下，绕过好望角，是迪亚士的航线。并非哥伦布，错误。","C":"③号所在的那条线绕过好望角后继续向东，穿过印度洋到达印度卡里库特，这是达·伽马的航线，并非迪亚士，错误。","D":"航线④从欧洲出发，向西横渡大西洋，绕过南美洲南端进入太平洋，最终到达菲律宾群岛，并继续向西航行返回欧洲。这标志着人类首次完成了环球航行，对应的人物正是麦哲伦及其船队，正确。"},"sol":""},{"no":36,"id":"ls-paper01-q036","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"马铃薯原产于南美洲，15世纪末以后陆续传播到欧洲、亚洲、非洲等地。其传播源于（ ）"}],"opts":["新航路的开辟","手工工场的建立","启蒙运动兴起","租地农场的出现"],"ans":0,"why":{"A":"“新航路的开辟”打破了世界各大洲相对隔绝的状态，世界开始连为一个整体，原产南美洲的马铃薯等物种得以传播到欧洲、亚洲、非洲等地，正确。","B":"“手工工场的建立”反映欧洲资本主义萌芽，属于欧洲内部生产方式的变化，无法促成跨大洲的物种交流，错误。","C":"“启蒙运动兴起”是思想解放运动，不涉及农作物传播，错误。","D":"“租地农场的出现”是欧洲农业中新的经营方式，局限于欧洲内部，不是马铃薯向外传播的原因，错误。"},"sol":""},{"no":37,"id":"ls-paper01-q037","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"阅读下侧《哥伦布大交换》的目录，可知此书意在说明（ ）"},{"t":"tbl","rows":[[{"t":"第一章 发现新世界\n第二章 细菌战役\n第三章 旧世界植物、动物移居新世界\n第四章 哥伦布将梅毒带回欧洲\n第五章 新世界作为旧世界的农场\n第六章 生物多样性遭破坏","imgs":[]}]]}],"opts":["哥伦布地理大发现对全球的贡献","生态环境视角下新旧大陆的发展","病毒对人类社会造成的重大威胁","新航路对旧世界带来的巨大挑战"],"ans":1,"why":{"A":"哥伦布地理大发现对全球的贡献侧重世界联系加强的意义，目录中细菌战、生物多样性遭破坏等呈现的是疾病传播与生态破坏，与贡献不符，错误。","B":"目录中细菌战役、旧世界动植物移居新世界、新世界作为旧世界的农场、生物多样性遭破坏，均从生态环境角度呈现新旧大陆之间物种、疾病与土地利用的变化，可见此书意在从生态环境视角说明新旧大陆的发展，正确。","C":"病毒对人类社会造成的重大威胁只对应第二章细菌战与第四章哥伦布将梅毒带回欧洲，其余章节讲的是动植物迁移和土地利用，不能概括全书主旨，错误。","D":"新航路对旧世界带来的巨大挑战只强调旧世界受到的冲击，而目录兼有旧世界动植物移居新世界、新世界作为旧世界的农场等新世界的变化，视角不限于旧世界，错误。"},"sol":""},{"no":38,"id":"ls-paper01-q038","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"读下面信息，你认为第五单元的目录应该是（ ）"},{"t":"tbl","rows":[[{"t":"第五单元____\n第13课 西欧经济和社会的发展\n第14课 文艺复兴\n第15课 新航路开辟\n第16课 早期殖民掠夺","imgs":[]}]]}],"opts":["封建时代的欧洲","走向近代","封建时代的亚洲","资本主义制度的初步建立"],"ans":1,"why":{"A":"封建时代的欧洲对应的是封君封臣、庄园、中世纪城市大学等内容，不包含文艺复兴、新航路开辟，错误。","B":"西欧经济新变化、文艺复兴、新航路开辟、早期殖民掠夺，都是欧洲步入近代的重要史实，正确。","C":"题干单元内容全部是西欧相关史实，和亚洲文明无关，错误。","D":"资本主义制度的初步建立对应的是英国资产阶级革命、美国独立战争、法国大革命等内容，不包含文艺复兴、新航路开辟，错误。"},"sol":""},{"no":39,"id":"ls-paper01-q039","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"他的航行可谓意义重大、影响深远，自1519年从西班牙出发，历时3年，行程约8万公里，在大航海时代，留下了浓厚的一笔，其航行经过大西洋段、太平洋段、东南亚段、印度洋段和返航中的大西洋段。此“航行”是指（ ）"}],"opts":["迪亚士抵达非洲好望角","哥伦布“发现”美洲","达·伽马到达印度西海岸","麦哲伦船队环球航行"],"ans":3,"why":{"A":"迪亚士航行是1487年，从葡萄牙出发，只到达非洲南端好望角，这与题意不符，错误。","B":"哥伦布1492年从西班牙出发，只横渡大西洋到达美洲，没有进入太平洋、印度洋，错误。","C":"达・伽马1497年从葡萄牙出发，沿非洲东岸到印度，没有经过太平洋，错误。","D":"1519年，麦哲伦船队从西班牙出发，其航行经过大西洋段、太平洋段、东南亚段、印度洋段和返航中的大西洋段，历时3年，是人类历史上第一次环球航行，正确。"},"sol":""},{"no":40,"id":"ls-paper01-q040","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"获取和解读材料信息，评价历史事件，是学习历史的基本能力。对下图中历史事件评价正确的是（ ）"},{"t":"img","src":"images/试卷/q040_1.webp"}],"opts":["享誉史册的航海","进行殖民掠夺扩张","促进中外友好交流","将世界连为整体"],"ans":0,"why":{"A":"图中既包含郑和下西洋，也包含迪亚士、哥伦布、达·伽马、麦哲伦等开辟新航路的远航，它们都是世界航海史上的伟大壮举，代表了人类远洋航行技术的重大突破，是享誉史册的航海事件，正确。","B":"郑和下西洋是和平友好的远航，没有进行殖民掠夺扩张，错误。","C":"促进中外友好交流主要适用于郑和下西洋，而哥伦布、达·伽马、麦哲伦等人的远航伴随殖民扩张，并非单纯促进友好交流，错误。","D":"将世界连为整体是新航路开辟的影响，郑和下西洋并没有把世界连为一个整体，错误。"},"sol":""},{"no":41,"id":"ls-paper01-q041","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"马克思在《资本论》中描述某一历史事件时说:“美洲金银产地的发现，土著居民的被剿灭、被奴役和被埋葬于矿井，对东印度开始进行的征服和掠夺，……(奴隶制)是殖民地财富的唯一自然基础。”据此可知，这一历史事件（ ）"}],"opts":["表明太平洋贸易发展迅猛","促使白银大量流入亚洲","有利于欧洲资本原始积累","阻碍了美洲经济的发展"],"ans":2,"why":{"A":"太平洋贸易主要指马尼拉大帆船贸易，题干不涉及这条贸易线路，错误。","B":"题干侧重殖民掠夺、奴役土著，没有讲白银流入亚洲，错误。","C":"欧洲殖民者掠夺美洲金银、奴役殖民地人民，掠夺来的财富运回欧洲，推动欧洲资本原始积累，正确。","D":"殖民掠夺确实破坏美洲，但这不是该事件在近代史上最核心的影响，也不是马克思这句话要突出的主旨，错误。"},"sol":""},{"no":42,"id":"ls-paper01-q042","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"对下图所示历史活动的表述中正确的一项是（ ）"},{"t":"img","src":"images/试卷/q042_1.webp"}],"opts":["★代表的是亚洲","它为欧洲输送了大量劳动力","这类活动为英国带来了巨额利润","以获取蔗糖、烟草等原材料为中心"],"ans":2,"why":{"A":"结合三角贸易的路线图，出程从欧洲出发到达★地，中程将★地的“黑奴”运往美洲。历史上黑奴主要来源于非洲，因此★代表的是非洲，并非亚洲，错误。","B":"三角贸易的中程是将黑奴从非洲运往美洲，为美洲的种植园和矿山提供了大量劳动力，而不是输送到欧洲，错误。","C":"图示反映的是“三角贸易”。欧洲殖民者从欧洲出发，携带廉价工业品到非洲换取黑奴（出程）；将黑奴运往美洲卖给种植园主（中程）；再从美洲满载金银和工业原料（如蔗糖、烟草）返回欧洲（归程）。在这个过程中，英国等欧洲国家通过贩卖黑奴和不等价交换，赚取了惊人的暴利，加速了资本的原始积累，正确。","D":"三角贸易的核心是罪恶的黑奴贸易。虽然获取原材料是归程的目的之一，但整个活动是以贩卖黑奴赚取最高额利润为中心的，错误。"},"sol":""},{"no":43,"id":"ls-paper01-q043","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"《早期殖民主义侵略史》中写道：“非洲到处在流血……人们到哪里去了呢？他们被捉去当奴隶，或者在捕捉奴隶者到来时逃走了。那些侥幸逃走的人们……重新过上刀耕火种的原始生活。”这反映出（ ）"}],"opts":["“三角贸易”是正常的人口流动","英国是黑奴贸易的主要国家","贩奴运动使英国获得巨额利润","“三角贸易”造成了非洲的落后"],"ans":3,"why":{"A":"三角贸易是欧洲殖民者掠夺黑奴的罪恶贸易，并非正常人口流动，错误。","B":"题干没有涉及黑奴贸易的参与国家相关内容，无法得出“英国是黑奴贸易的主要国家”的结论，错误。","C":"材料体现的是贩奴运动造成非洲的落后，没有体现贩奴运动使英国获得巨额利润，错误。","D":"题干描述了近代殖民掠夺时期，非洲大量人口被掳为奴隶，剩余的人甚至退回原始生产状态的场景，这正是三角贸易对非洲的直接破坏：上亿精壮劳动力流失，原有社会生产秩序被彻底打乱，直接造成了非洲的长期落后，正确。"},"sol":""},{"no":44,"id":"ls-paper01-q044","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"“乘船在悲惨的航程中横渡大西洋。这些黑色的货物上了镣铐，锁在甲板上，没有卫生设备，他们忍受着可怕的待遇。”与这段描述相关的历史事件是（ ）"}],"opts":["哥伦布发现新大陆","殖民者的“三角贸易”","英国向中国走私鸦片","达·伽马的航行"],"ans":1,"why":{"A":"哥伦布发现新大陆是航海探险活动，不涉及黑奴贩运，错误。","B":"“三角贸易”航程包含横渡大西洋贩运黑奴，黑奴被当作“黑色货物”，和材料描述吻合，正确。","C":"鸦片贸易发生在亚洲区域，不横渡大西洋贩卖黑奴，错误。","D":"达・伽马的航行开辟了通往印度的航线，不属于黑奴贸易，错误。"},"sol":""},{"no":45,"id":"ls-paper01-q045","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"美国黑人作家阿历克斯·哈利在其著作《根》中写道：“1760年，西非少年昆塔在独自外出时，被白人抓走，与其他黑人一起被贩卖到美洲。”与昆塔的悲惨遭遇有直接关系的历史事件是（ ）"}],"opts":["新航路的开辟","罪恶的“三角贸易”","古代罗马的扩张","《十二铜表法》的颁布"],"ans":1,"why":{"A":"新航路开辟发生在15-16世纪，核心是欧洲航海家开辟通往东方的新航路、实现全球航路连通，并非以大规模掳掠贩卖黑奴到美洲为核心内容，与题干场景无直接关联，错误。","B":"罪恶的“三角贸易”是16-19世纪欧洲殖民者开展的跨大西洋黑奴贸易，贸易流程中殖民者会从非洲掳掠黑人，作为奴隶贩卖到美洲供种植园使用，1760年正处于三角贸易的盛行时期，与昆塔的遭遇完全吻合，正确。","C":"古代罗马的扩张发生在公元前后至公元4世纪前后，活动范围以地中海区域为核心，既未到达美洲，时间也与1760年相差近千年，与题干无关，错误。","D":"《十二铜表法》是公元前450年左右古罗马颁布的成文法，是罗马法制建设的重要成果，属于法律文献，与跨大西洋贩卖黑奴的事件没有直接联系，错误。"},"sol":""},{"no":46,"id":"ls-paper01-q046","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"学者刘伟才认为，奴隶贸易冲击了非洲的社会结构和社会稳定……制造了混乱、冲突和仇恨，一些仇恨还延续下来，影响了相关非洲国家独立后的发展。该学者强调了奴隶贸易（ ）"}],"opts":["客观上促进了世界贸易","推动了欧洲社会的发展","深刻影响了非洲的发展","加速了非洲人口的流失"],"ans":2,"why":{"A":"材料体现奴隶贸易影响非洲独立后的发展，没有提到世界贸易，错误。","B":"材料强调奴隶贸易影响了非洲的发展，没有叙述奴隶贸易给欧洲带来的作用，错误。","C":"奴隶贸易冲击非洲的社会秩序，造成冲突、仇恨，这些遗留问题一直影响到非洲国家独立之后的发展，正确。","D":"黑奴贸易确实会造成非洲人口流失，这个说法史实正确，但不是本段材料强调的重点。材料侧重长期的社会遗留问题、对后世发展的影响，而不只是人口减少这一点，错误。"},"sol":""},{"no":47,"id":"ls-paper01-q047","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"据题图《无敌舰队》的书籍简介，推知其谈论的主题是（ ）"},{"t":"tbl","rows":[[{"t":"","imgs":["images/试卷/q047_1.webp"]},{"t":"全书精彩记述了英格兰、西班牙、法国、教皇国等多方势力的角力，清楚交代了各国盘根错节的外交关系以及复杂微妙的政治局势，最终聚焦在英国舰队与西班牙无敌舰队在英吉利海峡内展开的一系列海战，刻画了英格兰女王伊丽莎白一世、西班牙国王腓力二世、海盗德雷克、无敌舰队总司令西多尼亚公爵等性格鲜明的人物。","imgs":[]}]]}],"opts":["贸易垄断","战术更新","政治革命","殖民争霸"],"ans":3,"why":{"A":"虽然殖民争霸的最终目的是为了经济利益和贸易垄断，但材料主要强调的是“多方势力的角力”和“海战”，并没有直接体现贸易垄断的具体内容，错误。","B":"材料聚焦于双方海战及相关的政治外交局势，并未着重探讨或比较双方在海战中的战术变化，错误。","C":"英国资产阶级政治革命爆发于1640年，而英国与西班牙无敌舰队的海战发生于1588年，时间上不符，且材料属于对外战争而非国内政治革命，错误。","D":"材料简介中提到了“英格兰、西班牙、法国、教皇国等多方势力的角力”以及“英国舰队与西班牙无敌舰队在英吉利海峡内展开的一系列海战”。结合所学知识，1588年英国打败西班牙“无敌舰队”，是早期殖民扩张时期的重要事件。这场海战本质上是新兴的英国与老牌殖民帝国西班牙之间争夺海上霸权和殖民霸权的斗争，因此该书探讨的主题是殖民争霸，正确。"},"sol":""},{"no":48,"id":"ls-paper01-q048","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"英国在1709―1787年，对外贸易的航行吨位增加了14倍，大多与黑奴贸易有关。1716―1787年间，法国对外贸易增长达10倍，其中奴隶贸易占相当比重。由此可见，英法两国（ ）"}],"opts":["促使世界市场出现","掌控三角贸易","资本原始积累残酷","垄断东方贸易"],"ans":2,"why":{"A":"世界市场出现是新航路开辟的结果，并非英法奴隶贸易直接促使，错误。","B":"掌控三角贸易夸大事实，当时参与三角贸易的还有葡萄牙、西班牙等国，错误。","C":"“英国在1709至1787年，对外贸易的航行吨位增加了14倍，大多与黑奴贸易有关”“1716―1787年间，法国对外贸易增长达10倍，其中奴隶贸易占相当比重”反映了英法对外贸易增长大多数是黑奴贸易，说明黑奴贸易当时盛行，是资本原始积累的主要手段，体现了资本原始积累残酷，正确。","D":"垄断东方贸易与题干中“奴隶贸易占相当比重”无关，错误。"},"sol":""},{"no":49,"id":"ls-paper01-q049","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"下图是15—18世纪使用人数排名前10位的语言统计。其中，英语、西班牙语排位靠前的主要原因是（ ）"},{"t":"img","src":"images/试卷/q049_1.webp"}],"opts":["这些语言学习难度较低","国内人口基数比较大","该语言母国的殖民扩张","率先完成了工业革命"],"ans":2,"why":{"A":"语言的学习难度是主观且复杂的，并不是导致这两门语言在特定历史时期使用人数暴增的主要原因，错误。","B":"英国和西班牙的国内人口基数相较于当时的中国、印度等并不算大。图表中体现的全球使用人数激增，主要是由于海外殖民地的扩张，而非本土人口自然增长，错误。","C":"15—18世纪正是新航路开辟后，欧洲列强进行大规模海外殖民扩张的时期。西班牙在美洲建立了广阔的殖民地（拉丁美洲），英国则在北美、印度等地扩张。随着殖民活动，英语和西班牙语被带到世界各地，使得使用人数急剧增加，排位靠前，正确。","D":"英国虽然率先完成工业革命，但西班牙并未率先完成。且工业革命发生于18世纪中后期，无法解释在此之前西班牙语已经通过早期殖民扩张广泛传播的历史现象，错误。"},"sol":""},{"no":50,"id":"ls-paper01-q050","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"有人说：“14—18世纪是大迷失的时代，人在这个时代丢掉了人性，没有了世界，只剩下市场。”下列能够论证材料观点的是（ ）"}],"opts":["租地农场出现","早期殖民掠夺","新航路的开辟","彼得一世改革"],"ans":1,"why":{"A":"租地农场是近代资本主义生产经营模式，没有体现“丢掉人性”的特点，错误。","B":"题干观点指出14—18世纪出现了为了市场抛弃人性的现象。早期殖民掠夺过程中，殖民者为了抢占市场、掠夺财富，开展黑奴贸易、屠杀殖民地居民等，完全背弃了人性，只追求市场利益，符合材料描述，正确。","C":"新航路开辟是打破世界隔绝的探索活动，它是后续殖民掠夺的前提，但本身不能直接体现“丢掉人性只剩市场”，错误。","D":"彼得一世改革是俄国的近代化改革，核心是增强国力，和材料描述的特征不符，错误。"},"sol":""},{"no":51,"id":"ls-paper01-q051","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"目录索引是阅读书籍的方法之一，根据下面内容判断学习的主题是（ ）"},{"t":"tbl","rows":[[{"t":"君主立宪制的英国\n美国独立战争\n法国大革命和拿破仑帝国","imgs":[]}]]}],"opts":["走向近代","封建时代的欧洲","资本主义制度的扩展","资本主义制度的初步建立"],"ans":3,"why":{"A":"走向近代对应的内容包含文艺复兴、新航路开辟等，目录内容以各国资产阶级革命为主，不符合该主题，错误。","B":"封建时代的欧洲聚焦西欧庄园、中世纪城市等内容，和资产阶级革命主题不符，错误。","C":"资本主义制度的扩展以俄国改革、日本明治维新等事件为代表，和题干目录不匹配，错误。","D":"英国资产阶级革命确立君主立宪制、美国独立战争建立共和政体、法国大革命摧毁封建制度，都是早期资产阶级革命，属于资本主义制度的初步建立，符合目录主题，正确。"},"sol":""},{"no":52,"id":"ls-paper01-q052","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"“17世纪，英国人这种旧瓶装新酒的做法，既体现了英国人的政治智慧，也解释了英国变革得以成功的原因，同时还能让人领悟英国王室今天依然能够存在的历史渊源。”材料中的“旧瓶装新酒”是指（ ）"}],"opts":["处死国王，废除了封建君主制","保留国王，确立君主立宪制","设立议会，建立民主共和制度","制定宪法，实践了分权制衡的原则"],"ans":1,"why":{"A":"英国资产阶级革命后保留了国王，没有彻底废除君主制，不符合“旧瓶装新酒”，错误。","B":"“旧瓶”指保留国王这一旧形式，“新酒”指确立君主立宪制，国王权力受议会限制，符合题意，正确。","C":"英国没有建立民主共和制度，共和制是美国等国的政体，错误。","D":"分权制衡是美国1787年宪法的特点，不是英国，错误。"},"sol":""},{"no":53,"id":"ls-paper01-q053","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"法学家于明的论文《“旧法律”还是“新权利”？——1689年英国<权利法案>再研究》的目次如下所示。据此推知，他的核心观点是《权利法案》（ ）"},{"t":"tbl","rows":[[{"t":"目次\n一、两种叙事：革命vs.复古\n二、“缩水”的权利——从《请愿条款》到《权利宣言》\n三、古老自由的重申——“旧权利”中的新原则\n四、重塑权力的边界——“新权利”条款解读\n五、新与旧的背后——重新思考宪制转型的意义","imgs":[]}]]}],"opts":["建立了英国政治新秩序","树立了权力制衡的典范","剥夺了英王的政治权力","实现了主权在民的愿望"],"ans":0,"why":{"A":"《权利法案》以旧权利为基础融入新原则，重塑权力边界，逐步构建起英国君主立宪的政治新秩序，它融合复古与革新，推动英国完成宪制转型，建立起全新的政治运行框架，正确。","B":"材料没有重点围绕权力制衡展开论述，论文聚焦旧权利与新权利的关系，不体现权力制衡典范相关内容，错误。","C":"《权利法案》只是限制王权，并没有剥夺英王全部政治权力，错误。","D":"英国此时是君主立宪制，主权属于议会，并没有实现主权在民的愿望，错误。"},"sol":""},{"no":54,"id":"ls-paper01-q054","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"题表中克伦威尔的经历表明，英国（ ）"},{"t":"tbl","rows":[[{"t":"时间","imgs":[]},{"t":"主要经历","imgs":[]}],[{"t":"1645年","imgs":[]},{"t":"任议会新模范军副司令，击败国王军","imgs":[]}],[{"t":"1653年","imgs":[]},{"t":"使用护国主头衔统治着英格兰、苏格兰和爱尔兰","imgs":[]}],[{"t":"1655年","imgs":[]},{"t":"镇压保王党叛乱","imgs":[]}],[{"t":"1658年","imgs":[]},{"t":"再次解散议会，进一步加强独裁统治","imgs":[]}]]}],"opts":["革命斗争反复曲折","议会力量不断加强","革命成果得以巩固","国王权力严格受限"],"ans":0,"why":{"A":"克伦威尔的经历从领导议会军反封建，到建立护国主独裁统治，期间伴随王党叛乱，说明革命并非一帆风顺，存在反复和曲折，正确。","B":"1658年克伦威尔解散议会，说明议会权力被削弱，并非不断加强，错误。","C":"克伦威尔建立独裁统治、王党叛乱的出现，说明革命成果并未得到稳定巩固，错误。","D":"表格内容未涉及对国王权力的限制，且此时国王已被处死，错误。"},"sol":""},{"no":55,"id":"ls-paper01-q055","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"17-18世纪，资产阶级革命的时代来临，英、美、法三国分别通过《权利法案》《独立宣言》《人权宣言》这些法律文件所体现的共同理念是（ ）"}],"opts":["否定封建专制","反对殖民统治","限制君主权力","民主法制发展"],"ans":3,"why":{"A":"美国独立战争反抗的是英国殖民统治，本国不存在封建专制，《独立宣言》没有否定封建专制，错误。","B":"反对殖民统治只是美国《独立宣言》的诉求，英国、法国革命不针对殖民统治，错误。","C":"限制君主权力是英国《权利法案》的作用，美国没有君主，《独立宣言》不涉及限制君权，错误。","D":"《权利法案》确立议会主权，《独立宣言》宣扬天赋人权，《人权宣言》宣告人权、法治原则，三份文件都推动民主法制发展，正确。"},"sol":""},{"no":56,"id":"ls-paper01-q056","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"“研读英国的政治发展史可以发现，其法治文明是如此久远，在1688年之前，英国已经为其宪政完成了必要的铺垫。”下列史实能够证明此观点的是（ ）"}],"opts":["詹姆士一世推崇“君权神授”理论","封建王朝复辟","议会制定的《权利请愿书》","克伦威尔专权"],"ans":2,"why":{"A":"詹姆士一世宣扬君权神授，强化君主专制，和宪政发展方向相悖，错误。","B":"封建王朝复辟，王权重新扩张，不利于宪政铺垫，错误。","C":"议会出台《权利请愿书》，主张限制国王权力，是早期议会对抗王权、走向宪政的重要铺垫，符合题意，正确。","D":"克伦威尔建立独裁统治，实行个人专权，不属于宪政铺垫，错误。"},"sol":""},{"no":57,"id":"ls-paper01-q057","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"下图为英国发行的《权利法案》300周年纪念币。据此可知，《权利法案》原件颁布于（ ）"},{"t":"img","src":"images/试卷/q057_1.webp"}],"opts":["16世纪80年代","16世纪90年代","17世纪80年代","17世纪90年代"],"ans":2,"why":{},"sol":"根据纪念币上的“1689”“1989”及“300周年”字样，可知《权利法案》颁布于1689年。世纪换算方法为年份前两位数字加 1，16+1=17，1689年属于17世纪，且十位数为8，属于80年代。因此，1689年属于17世纪80年代，故本题选C。"},{"no":58,"id":"ls-paper01-q058","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"“1688年革命，1789年革命，这两次革命不仅反映了发生革命的地区即英法两国的要求，而且在更大程度上反映了当时整个世界的要求。”“当时整个世界的要求”是（ ）"}],"opts":["确立“王在法下”的原则","摆脱殖民压迫，实现国家独立","扫清资本主义发展的障碍","建立君主立宪制政体"],"ans":2,"why":{"A":"“王在法下”是英国13世纪以来逐渐确立的传统，不能代表当时整个世界的要求，错误。","B":"“摆脱殖民压迫，实现国家独立”是殖民地人民的斗争目标，和英法资产阶级革命不符，错误。","C":"1688年英国资产阶级革命、1789年法国大革命都属于资产阶级革命，两场革命都在为本国资本主义发展扫除障碍，体现当时整个世界的要求，正确。","D":"“建立君主立宪制政体”只是英国革命的结果，法国最终确立共和制，不能代表整个世界的要求，错误。"},"sol":""},{"no":59,"id":"ls-paper01-q059","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"下图是张燕同学绘制的英国资产阶级革命示意图，她运用物理钟摆实验原理，展现了资产阶级和封建势力反复斗争的过程，并最终找到了平衡点。使双方维持平衡的制度是（ ）"},{"t":"img","src":"images/试卷/q059_1.webp"}],"opts":["封君封臣制","封建君主制","总统共和制","君主立宪制"],"ans":3,"why":{"A":"封君封臣制是中世纪西欧的封建等级制度，以土地封赐为纽带，与英国资产阶级革命后的政治妥协无关，错误。","B":"封建君主制是指君主拥有绝对权力的专制制度。英国资产阶级革命的目的就是推翻这种专制统治，双方不可能在专制制度下达成平衡，错误。","C":"总统共和制是美国独立战争后确立的政治制度，英国保留了君主，没有总统，错误。","D":"英国资产阶级革命后，1689年议会通过了《权利法案》，以法律形式对国王的权力进行明确制约，确立了议会在国家政治生活中的最高地位。这种制度既保留了国王（即“封建势力”的象征），又让议会掌握了实权（保障了“资产阶级”的利益），从而在英国资产阶级和封建势力之间找到了一个“平衡点”，使英国社会得以稳定发展，正确。"},"sol":""},{"no":60,"id":"ls-paper01-q060","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"《全球通史：1500年以后的世界》一书中说：“英国这场大变动（编者注：资产阶级革命）的根源可以在国会和斯图亚特王朝之间的冲突中找到……”这一“冲突”的根源是（ ）"}],"opts":["封建专制统治阻碍资本主义发展","宗教神学阻碍了科学技术的发展","国王的权力被议会完全剥夺","国王征收重税触动了新贵族的权益"],"ans":0,"why":{"A":"斯图亚特王朝推行封建专制统治，严重阻碍英国资本主义经济发展，这是国会与王权矛盾冲突的根本原因，也是英国资产阶级革命爆发的根源，正确。","B":"材料围绕议会与王权的矛盾展开，没有体现宗教神学和科技发展之间的矛盾，错误。","C":"英国资产阶级革命后国王权力受到限制，并没有被议会完全剥夺，错误。","D":"征税矛盾是冲突的直接导火索，并不是深层次的根本原因，错误。"},"sol":""},{"no":61,"id":"ls-paper01-q061","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"美国通过制定1787年宪法，构建了一个既强大到足以避免无政府状态，又受适度限制不致陷于暴政的政府体制。这是因为1787年宪法规定实行（ ）"}],"opts":["奴隶制和联邦制","联邦制和分权制衡","议会制和总统制","议会制和分权制衡"],"ans":1,"why":{"A":"奴隶制不是1787年宪法用来防止暴政的设计，错误。","B":"联邦制平衡中央与地方权力，分权制衡将国家权力分为立法、行政、司法三部分，互相制约，既建立强有力政府，又避免专制暴政，正确。","C":"议会制和总统制只是政体组成，无法体现适度限制、防止暴政的核心设计，错误。","D":"美国1787年宪法不是议会制，错误。"},"sol":""},{"no":62,"id":"ls-paper01-q062","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"美国革命之所以重要，不只因为它创造了一个有着响亮口号的独立国家，还因为它创造了一个以三权分立为原则可以实现“民主”的国家。它的“实现”主要归功于下列哪一历史文件（ ）"}],"opts":["《权利法案》","1787年美国宪法","《十二铜表法》","《大宪章》"],"ans":1,"why":{"A":"“《权利法案》”是英国资产阶级革命后颁布的文献，确立英国君主立宪制，和美国无关，不符合题意，错误。","B":"“1787年美国宪法”这部宪法依据三权分立的原则，将国家权力分为立法、行政、司法三部分，是材料所说实现三权分立民主的文件，和史实吻合，正确。","C":"“《十二铜表法》”是古罗马的成文法，和美国革命无关，不符合题意，错误。","D":"“《大宪章》”是英国中世纪限制王权的文件，不属于美国的文献，不符合题意，错误。"},"sol":""},{"no":63,"id":"ls-paper01-q063","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"18世纪中后期，为了缓解财政压力，英国决定让北美殖民地为帝国的开销支付更大的份额。英国政府在北美殖民地颁布一系列法令征收捐税，引发了北美人民的强烈反对。由此可见，北美爆发独立战争的原因是（ ）"}],"opts":["英国资产阶级革命造成了财政危机","英国的专制统治阻碍了北美资本主义的发展","英国的殖民统治阻碍了北美资本主义的发展","政治经济发展不平衡使美英矛盾激化"],"ans":2,"why":{"A":"英国财政危机主要是七年战争带来的，不是英国资产阶级革命造成的，错误。","B":"当时英国已经是君主立宪制，不是“专制统治”，错误。","C":"英国在北美的殖民剥削（征税、限制发展）阻碍北美资本主义发展，是独立战争爆发的根源，正确。","D":"“政治经济发展不平衡”是一战爆发的根本原因，和美国独立战争无关，错误。"},"sol":""},{"no":64,"id":"ls-paper01-q064","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"1775年4月18日，驻扎在波士顿的英军派史密斯中校率领一支700多人的特遣队，连夜向西北出发，目标是捣毁康科德的民兵军火库。英军此举（ ）"}],"opts":["制止了武装冲突","激发北美人民的反抗","废除了奴隶制度","宣告美利坚国家独立"],"ans":1,"why":{"A":"英军此举是主动对北美民兵采取军事行动，旨在镇压反抗，而非“制止武装冲突”，反而会激化矛盾，错误。","B":"英军的军事行动直接侵犯了北美殖民地的利益，暴露了其殖民统治的压迫性，必然激发北美人民的反抗意识，成为后续武装冲突的导火索，正确。","C":"美国废除奴隶制度是在19世纪60年代南北战争期间，与1775年的事件无关，错误。","D":"宣告美利坚国家独立的是1776年《独立宣言》的发表，并非英军的军事行动，错误。"},"sol":""},{"no":65,"id":"ls-paper01-q065","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"独立战争爆发时，英国人叫独立战争是“兄弟之间的战争”，波士顿人称这场战争为“茶叶战争”，弗吉尼亚人称它为“烟草战争”。这旁证了（ ）"}],"opts":["利益关系影响事实判断","历史叙述影响战争进程","政治立场改变历史认识","历史评价脱离客观事实"],"ans":0,"why":{"A":"英国人、波士顿人、弗吉尼亚人对同一场独立战争称呼各不相同，是因为各方的利益、关注点不一样，正确。","B":"历史叙述只是说法，不能改变战争实际进程，错误。","C":"题干侧重不同地域群体的经济利益(茶叶、烟草)，不是政治立场差异，错误。","D":"题干只是称呼不同，没有说明评价脱离史实，错误。"},"sol":""},{"no":66,"id":"ls-paper01-q066","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"在美国独立战争时期，各地都有大批“一分钟人”，他们是可以随时把自己的身份从农民和工商业者转换为士兵。这体现了美国独立战争（ ）"}],"opts":["宣传自由民主思想","实现了民族的独立","人民群众广泛参与","具有暴力革命性质"],"ans":2,"why":{"A":"自由民主思想是独立战争宣扬的理念，题干介绍民兵身份转换的特点，没有围绕思想宣传展开，错误。","B":"民族独立是独立战争胜利之后才实现的结果，材料讲民兵构成，无法体现战争带来的最终成果，错误。","C":"“一分钟人”本身就是农民、工商业者，需要时拿起武器参战，说明普通民众主动投身战争，体现人民群众广泛参与，正确。","D":"暴力革命侧重战争武装对抗的形式，材料只介绍民兵身份可以在生产者和士兵之间切换，没有体现武装斗争的暴力特征，错误。"},"sol":""},{"no":67,"id":"ls-paper01-q067","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"1765年，英国颁布的《印花税法》激怒了北美人民。他们拒绝支付印花税，有些人非常气愤，以致攻击英国的邮局。据此可以了解到（ ）"}],"opts":["北美资本主义经济的发展","英国殖民者与北美人民的矛盾","人文主义思想的广泛传播","北美农业资源丰富且商业发达"],"ans":1,"why":{"A":"题干只说到征税引发反抗，没有体现经济发展相关内容，错误。","B":"英国颁布《印花税法》征税，北美民众抵制、攻击邮局，是英国与北美殖民地矛盾激化的代表性事件，正确。","C":"题干说的是征税引发反抗，与人文主义无关，错误。","D":"题干只说到征税冲突，没有说到农业、资源、商业情况，错误。"},"sol":""},{"no":68,"id":"ls-paper01-q068","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"编制表格是历史学习的重要方法之一。下面是某同学学习世界近代史编制的知识表格。该表格反映的学习主题是（ ）"},{"t":"tbl","rows":[[{"t":"时间","imgs":[]},{"t":"重要文献","imgs":[]}],[{"t":"1689年","imgs":[]},{"t":"《权利法案》","imgs":[]}],[{"t":"1787年","imgs":[]},{"t":"《1787年宪法》","imgs":[]}],[{"t":"1789年","imgs":[]},{"t":"《人权宣言》","imgs":[]}],[{"t":"1804年","imgs":[]},{"t":"《拿破仑法典》","imgs":[]}]]}],"opts":["西方民主法制建设的进程","国际工人运动的发展历程","殖民地人民的反抗历程","西欧封建专制强化的过程"],"ans":0,"why":{"A":"1689年《权利法案》 (英国君主立宪制确立)、《1787年宪法》(美国共和制度建立)、1789年《人权宣言》、1804年《拿破仑法典》 (法国资本主义法律文献)，都是近代欧美资产阶级革命后颁布的巩固民主制度的法律文件，推动了西方民主法制逐步发展完善，正确。","B":"国际工人运动的发展历程主要涉及工人阶级为争取自身权益而进行的斗争，如宪章运动、巴黎公社、第一国际等，表格中的文献都是资产阶级性质的法律文献，与国际工人运动无关，错误。","C":"表格聚焦西方民主法制建设的逐步确立与完善，没有殖民地反抗斗争的史实，错误。","D":"题干文件是反封建、确立资本主义制度，不是强化封建专制，错误。。"},"sol":""},{"no":69,"id":"ls-paper01-q069","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"18世纪，美国人普遍抱有“权力和自由二元对立”的思想：一方面，权力是一种天生倾向于腐败的因素；另一方面，美国的建国者大多相信人性倾向于恶。基于这一认识，美国（ ）"}],"opts":["形成了两党交替执政的格局","完善了国会的立法体系","强化了联邦政府的行政权力","确立了分权制衡的原则"],"ans":3,"why":{"A":"美国两党交替执政格局是19世纪中后期才形成的，和题干18世纪防范权力腐败的思想无关，错误。","B":"“完善国会立法体系”只是单一立法方面的调整，不能体现对权力本身的约束，不符合题意，错误。","C":"“强化联邦政府行政权力”会加大权力集中，更容易滋生腐败，和题干防范权力腐败的想法相反，错误。","D":"分权制衡原则就是把权力拆分、互相制约，防止权力滥用、保障自由，和题干中担心权力腐败、防范恶的人性的认识相符，正确。"},"sol":""},{"no":70,"id":"ls-paper01-q070","unit":"综合","blocks":[{"t":"p","v":"纪念碑作为一种纪念性建筑或雕塑，承载着特定的历史记忆。下图的两座纪念碑反映的共同主题是（ ）"},{"t":"tbl","rows":[[{"t":"","imgs":["images/试卷/q070_1.webp"]},{"t":"","imgs":["images/试卷/q070_2.webp"]}],[{"t":"位于美国来克星顿的一座纪念碑，碑座上是一尊手握步枪的民兵铜像 位于哥伦比亚玻利瓦尔广场的一座纪念碑，碑座上的人物被称为南美的“解放者”","imgs":[]}]]}],"opts":["资本主义制度的确立","世界市场的初步形成","争取民族独立的斗争","殖民体系的彻底崩溃"],"ans":2,"why":{"A":"美国来克星顿的民兵纪念碑对应的是美国独立战争，美国独立战争虽带有资产阶级革命性质，但与哥伦比亚玻利瓦尔相关的是拉丁美洲独立运动，斗争目标是摆脱西班牙殖民统治，与资本主义制度确立的主题并不契合，并非两座纪念碑的共同内核，错误。","B":"世界市场初步形成对应的是第一次工业革命后的对外扩张阶段，和美国独立战争、拉丁美洲独立运动的主题均无关联，错误。","C":"来克星顿的民兵是美国独立战争的标志性符号，美国独立战争旨在摆脱英国殖民统治争取国家独立，玻利瓦尔是拉丁美洲独立运动的领袖，带领南美民众反抗西班牙殖民统治，二者的核心主题都是争取民族独立的斗争，正确。","D":"殖民体系的彻底崩溃发生在20世纪后半期，而美国独立战争、拉丁美洲独立运动都处于近代时期，该表述不符合两个历史事件的时间与内涵，错误。"},"sol":""},{"no":71,"id":"ls-paper01-q071","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"“克伦威尔、拿破仑……他们扬起手中的利剑，将旧的体制、旧的观念劈开让人看,看明白其中弊端的人们，携手把人类社会从‘人治’推到‘法治’的新阶段。”依据材料分析，克伦威尔和拿破仑的历史进步性在于（ ）"}],"opts":["通过“利剑”巩固了专制统治","维护了资产阶级革命的成果","完善了本国的法律体系","赢得了独立战争的胜利"],"ans":1,"why":{"A":"克伦威尔和拿破仑属于资产阶级代表，打击的是封建专制体制，不是巩固专制统治，错误。","B":"克伦威尔领导英国资产阶级革命、拿破仑捍卫法国大革命成果，都打击旧制度，推动社会从人治走向法治，维护资产阶级革命成果，正确。","C":"只有拿破仑颁布《拿破仑法典》，完善法律体系；克伦威尔没有完善本国法律体系这个突出贡献，该选项不能同时概括两个人，错误。","D":"独立战争是美国的，和英国克伦威尔、法国拿破仑无关，错误。"},"sol":""},{"no":72,"id":"ls-paper01-q072","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"在早期资产阶级革命中，资产阶级为反对封建专制、捍卫民主而制定的重要檄文有（ ）①《权利法案》②《独立宣言》③《人权宣言》④《解放黑人奴隶宣言》"}],"opts":["①②③","①②③④","②③","①③"],"ans":3,"why":{},"sol":"①《权利法案》是英国资产阶级革命后颁布的，以法律形式限制王权，确立了君主立宪制，是反对封建专制的重要文献，正确。\n②《独立宣言》是美国独立战争期间颁布的，宣告北美殖民地脱离英国统治，宣布人人生而平等，是反对殖民专制而非封建专制的重要文献，错误。\n③《人权宣言》是法国大革命期间颁布的，宣扬自由、平等、天赋人权，是反对封建专制的重要文献，正确。\n④《解放黑人奴隶宣言》是美国南北战争期间林肯颁布的，主要目的是废除奴隶制、维护国家统一，属于19世纪中期的资产阶级革命（美国内战）文献，不属于早期资产阶级革命范畴，错误。\n故选D。"},{"no":73,"id":"ls-paper01-q073","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"“19世纪初期，它不仅敲响了欧洲封建秩序的丧钟，而且使欧洲大陆各国面临罗马帝国崩溃以来最严重的霸权威胁。”材料表述的是（ ）"}],"opts":["西班牙殖民扩张","英国革命的影响","拿破仑对外战争的影响","工业革命的影响"],"ans":2,"why":{"A":"西班牙殖民扩张‌时间集中在16-17世纪，与19世纪初的时间背景不符，且其活动核心在美洲殖民地，错误。","B":"英国资产阶级革命发生在17世纪，时间远早于19世纪初，其影响范围也主要局限于英国本土，错误。","C":"19世纪初，拿破仑的对外战争一方面沉重打击了欧洲各国的封建势力，传播了法国大革命的平等、自由理念，直接敲响了欧洲封建秩序的丧钟；另一方面其横扫欧洲的军事扩张，让除英国外的几乎整个欧洲大陆都臣服于法国，形成了罗马帝国崩溃以来欧洲大陆最严重的单一霸权威胁，正确。","D":"19世纪初工业革命主要在英国起步，其核心影响集中在经济生产领域，并未直接形成对欧洲封建秩序的颠覆性冲击，错误。"},"sol":""},{"no":74,"id":"ls-paper01-q074","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"1812年远征俄国前夕，拿破仑与国内资产阶级产生了无法克服的矛盾，下层人民也日益不满；欧洲附属国的民族运动和民族战争蓬勃兴起；英国等对手正蠢蠢欲动。材料意在说明，拿破仑（ ）"}],"opts":["巩固统治的迫切性","独裁统治的偶然性","颁布法典的必要性","侵略失败的必然性"],"ans":3,"why":{"A":"材料虽提及国内矛盾和人民不满，但核心是“无法克服的矛盾”“民族运动蓬勃兴起”“对手蠢蠢欲动”，强调的是统治危机的严重性，而非“迫切性”，错误。","B":"拿破仑独裁统治是法国大革命后资产阶级巩固政权的产物，具有历史必然性，材料没有体现其统治的“偶然性”，错误。","C":"《拿破仑法典》颁布于 1804年，与材料时间“1812年”不符，且材料未涉及法典相关内容，错误。","D":"材料中“无法克服的矛盾” “民族运动蓬勃兴起”“对手蠢蠢欲动”等信息，表明拿破仑统治已面临内忧外患，其对外侵略缺乏稳固的国内基础和国际支持，失败具有必然性，正确。"},"sol":""},{"no":75,"id":"ls-paper01-q075","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"1804年，拿破仑政府颁布《法国民法典》，肯定法律面前人人平等，保护私有财产，把大革命中形成的小土地所有制用法律形式固定下来。这说明拿破仑统治（ ）"}],"opts":["巩固了法国大革命的成果","打击了欧洲其他国家封建制度","成为许多国家编纂民法的蓝本","具有民族民主革命的双重性质"],"ans":0,"why":{"A":"《法国民法典》以法律形式确认了大革命中确立的平等原则、私有财产保护制度与小土地所有制，本质是通过立法巩固法国大革命的成果，正确。","B":"打击欧洲其他国家封建制度是拿破仑对外战争的影响，材料仅涉及法国国内立法内容，未提及对外战争或对其他国家的作用，错误。","C":"《法国民法典》成为许多国家编纂民法的蓝本是其对后世立法的深远影响，但材料未涉及该法典对其他国家的立法借鉴作用，错误。","D":"民族民主革命的双重性质是拿破仑对外战争的特点，而材料仅体现对大革命成果的巩固， 没有涉及民族革命相关内容，错误。"},"sol":""},{"no":76,"id":"ls-paper01-q076","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"1792年，反法联军攻入法国，《巴黎纪事报》报道如下。据此可知，《马赛曲》（ ）"},{"t":"tbl","rows":[[{"t":"《莱茵军团战歌》（后更名为《马赛曲》）由马赛联盟军带来巴黎。他们合唱这首歌，在挥舞帽子和军刀时会立刻兴奋地高呼：“武装好，公民们!”他们途经各个村庄时，也会唱起这曲调，鼓舞了公民情感与好战氛围。","imgs":[]},{"t":"","imgs":[]}]]}],"opts":["鼓动人民推翻封建专制","宣扬公民权利人人平等","号召法国人民保卫祖国","保护私有财产不受侵犯"],"ans":2,"why":{"A":"材料侧重抵御外敌入侵，没有体现鼓动人民推翻封建专制的内容，错误。","B":"材料只体现歌曲鼓舞民众参战的激昂场景，没有涉及平等、公民权利相关内容，错误。","C":"反法联军入侵法国的背景下，《马赛曲》能够鼓舞民众，号召民众拿起武器抵抗外敌、保卫祖国，契合材料中军队传唱、激发民众斗志的记载，正确。","D":"保护私有财产不受侵犯是《人权宣言》的内容，和材料里《马赛曲》的作用无关，错误。"},"sol":""},{"no":77,"id":"ls-paper01-q077","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"《拿破仑法典》颁布后，法国在其征服的欧洲国家强行推广。这一做法打击了（ ）"}],"opts":["欧洲的资本主义","欧洲的殖民扩张","法国的启蒙运动","欧洲的封建势力"],"ans":3,"why":{"A":"《拿破仑法典》是资本主义性质的法律，推广它会促进而非打击欧洲资本主义发展，错误。","B":"这一时期法国的对外扩张本身就带有殖民扩张的属性，推广法典和打击欧洲殖民扩张没有关联，错误。","C":"法国启蒙运动是18世纪法国资产阶级领导和发动的思想解放运动，时间早于《拿破仑法典》颁布，没有受到《拿破仑法典》的打击，错误。","D":"《拿破仑法典》以法律形式巩固了法国大革命的成果，传播了资产阶级自由、平等、法治的思想，在法国征服的欧洲国家强行推广，冲击了当地的封建制度和封建势力，正确。"},"sol":""},{"no":78,"id":"ls-paper01-q078","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"作为19世纪伟大的政治家和军事家，他通过战争建立了庞大的帝国体系，鼎盛时期，欧洲除英国外，其余各国均向他臣服。他沉重打击了欧洲各国的封建制度，完善了欧洲法律体系，奠定了欧洲资本主义国家的社会秩序。材料评价的“他”指的是（ ）"}],"opts":["彼得一世","拿破仑","克伦威尔","罗伯斯庇尔"],"ans":1,"why":{"A":"彼得一世是18世纪俄国统治者，改革以强化农奴制为核心，没有建立称霸欧洲的帝国体系，错误。","B":"拿破仑在19世纪建立法兰西第一帝国，对外战争打击欧洲封建势力，颁布《拿破仑法典》，奠定欧洲资本主义法制基础，正确。","C":"克伦威尔是17世纪英国资产阶级革命领导人，并未建立横跨欧洲的庞大帝国，错误。","D":"罗伯斯庇尔是法国大革命雅各宾派领袖，没有称帝建帝国、主导欧洲大陆格局的经历，错误。"},"sol":""},{"no":79,"id":"ls-paper01-q079","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"法国大革命之前，对法国贵族常用的一个称呼是“您”。这是当时法国革命者所不能容忍的，所以他们要把“您”取消，大家都以“你”相称，“你”逐渐成为法国社会第二人称的主流。出现这一变化的原因是法国大革命（ ）"}],"opts":["激励了拉美独立运动","形成了资产阶级统治","宣传自由平等的思想","致力于国家独立解放"],"ans":2,"why":{"A":"法国大革命激励拉美独立运动属于对外影响，和国内称呼变化没有关联，错误。","B":"法国大革命形成资产阶级统治是革命带来的政权结果，不是称呼改变的思想根源，错误。","C":"法国大革命传播自由平等思想，反对等级特权，摒弃带有尊卑区别的“您”，改用平等的“你”相互称呼，消除贵族专属的尊称，体现人与人地位平等的理念，正确。","D":"法国大革命的斗争目标不是争取国家独立解放，法国本身属于独立国家，错误。"},"sol":""},{"no":80,"id":"ls-paper01-q080","unit":"第六单元 资本主义制度的初步确立","blocks":[{"t":"p","v":"“7月14日，他们攻破并拆毁了巴黎一座用作监狱的王室古堡，虽然这一事件的实际效果只是救出了狱中的少数人。但是，它摧毁了平民心目中压迫的象征。”材料描述的是（ ）"}],"opts":["召开三级会议","拿破仑称帝","处死路易十六","攻占巴士底狱"],"ans":3,"why":{"A":"召开三级会议是法国大革命爆发的导火线，没有发生题干描述的攻破王室古堡的行为，错误。","B":"拿破仑称帝是大革命后期的事件，和题干的时间、事件特征不符，错误。","C":"处死路易十六是1793年法国大革命进程中推翻封建君主的事件，也不符合“7月14日攻破王室监狱古堡”的描述，错误。","D":"这道题的核心信息是“7月14日”“巴黎王室监狱古堡”“平民心目中压迫的象征”，对应法国大革命的开端事件——1789年7月14日巴黎民众攻占巴士底狱，巴士底狱是当时法国封建专制压迫的标志性象征，符合材料描述，正确。"},"sol":""},{"no":81,"id":"ls-paper01-q081","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"第一次工业革命使资产阶级力量更加壮大，资产阶级在世界范围内的统治进一步巩固和扩大，美国内战、俄国1861年改革和日本明治维新的共同点是（ ）"}],"opts":["都促进了资本主义的发展","都是对农民的掠夺","都是自上而下的改革","都确立了君主立宪制"],"ans":0,"why":{"A":"美国内战废除奴隶制，清除了资本主义发展障碍；俄国1861年改革、日本明治维新走上资本主义发展道路，三者都推动本国资本主义发展，和史实吻合，正确。","B":"美国内战没有掠夺农民；俄国改革高价赎买土地体现对农民掠夺，该特点不是三者共同点，不符合题意，错误。","C":"美国内战是资产阶级性质的战争，不是改革，不符合题意，错误。","D":"美国是共和制，俄国改革后仍是沙皇专制，只有日本明治维新后建立君主立宪制，不是共同点，不符合题意，错误。"},"sol":""},{"no":82,"id":"ls-paper01-q082","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"19世纪中叶以后，西欧国家投送人员、物资的能力大幅提升，使距离和地理因素不再是影响国际体系的主要决定性因素。这主要得益于当时（ ）"}],"opts":["国际格局的变化","城市人口的增加","殖民扩张的加剧","工业革命的发展"],"ans":3,"why":{"A":"国际格局的变化是投送能力提升带来的结果或表现，而非其原因，因果倒置，错误。","B":"城市人口的增加属于工业化进程中的社会现象，与跨国跨地域投送能力的提升无直接因果关系，错误。","C":"殖民扩张的加剧需要强大的交通运输能力作为支撑，其本身不能直接解释“投送能力大幅提升”的技术原因，错误。","D":"19世纪中叶，工业革命深入发展，火车、汽船等新式交通工具及电报等通讯手段广泛应用，极大地提高了运输效率，缩短了时空距离，使西欧国家跨地域投送人员和物资的能力大幅提升，正确。"},"sol":""},{"no":83,"id":"ls-paper01-q083","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"在1866年出使欧洲的清朝使团成员的笔记中记载，“以火灼(烧)水，藉(借)水气之力以运船”。笔记中描写的动力机器最可能是（ ）"}],"opts":["蒸汽机车","蒸汽机","织布机","珍妮纺纱机"],"ans":1,"why":{"A":"蒸汽机车是以蒸汽机为动力的陆上交通工具（火车），本身是蒸汽机的应用载体，并非提供动力的机器本身，且用途为牵引陆上列车，与“运船”的场景不符，错误。","B":"蒸汽机的工作原理正是燃烧燃料加热水产生高压水蒸气，将水蒸气的内能转化为机械能， 可作为通用动力装置为船只、工厂设备、陆上交通工具提供动力，19世纪中期蒸汽机已得到广泛应用，符合材料内容，正确。","C":"织布机包含很多种类，1733年飞梭出现，织布速度提高，1785年卡特莱特发明水力织布机，织布效率提高约40倍，和材料的“借水气之力运船”无关，错误。","D":"珍妮纺纱机是第一次工业革命开端标志性的手摇纺纱机，属于人力操作的纺织设备，与水蒸气动力、船只驱动均无关联，错误。"},"sol":""},{"no":84,"id":"ls-paper01-q084","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"下图表明英国（ ）"},{"t":"img","src":"images/试卷/q084_1.webp"}],"opts":["从事“三角贸易”","成为工业国家","完成了英国资产阶级革命","建成“福利国家”"],"ans":1,"why":{"A":"三角贸易是16—19世纪欧洲殖民者进行的黑奴贸易，与1854-1856年的进出口贸易结构无关，且图表未体现黑奴贸易相关内容，错误。","B":"1840年前后英国率先完成工业革命，成为世界上第一个工业国家。图表中英国大量出口工业制造品、进口原材料，符合工业国家 “进口原料、出口工业品”的经济特征，正确。","C":"英国资产阶级革命完成于1688年光荣革命，与图表时间不符，且图表体现的是经济方面，不是政治革命，错误。","D":"福利国家是二战后西方资本主义国家为缓和社会矛盾建立的社会福利体系，与19世纪中期的贸易结构无关，错误。"},"sol":""},{"no":85,"id":"ls-paper01-q085","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"《简明世界历史读本》记载：“英国政府1846年废除《谷物法》，1849年废除《航海条例》；1842年颁布《矿井法》，1844年颁布《工厂法》，1848年颁布《公共卫生法》，1876年颁布《河流防污法》。”据此可知，工业革命（ ）"}],"opts":["使资本高度集中","导致贫富分化加剧","推动英国法制化建设","不断向他国扩展传播"],"ans":2,"why":{"A":"资本高度集中是第二次工业革命后垄断组织的特征，材料只提及英国出台多部法律，没有体现资本集中，错误。","B":"贫富分化加剧是工业革命带来的社会问题，但题干材料没有相关贫富差距的描述，与材料主旨无关，错误。","C":"工业革命开展后，英国陆续废除旧法案、颁布多部新法律，以适应工业化发展的需要，推动英国法制化建设，正确。","D":"材料中的法律文件都属于英国国内立法，没有涉及工业革命向外传播到其他国家的内容，错误。"},"sol":""},{"no":86,"id":"ls-paper01-q086","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"人们把18世纪60年代生产领域的革命性变化称为“工业革命”，这里的“革命性变化”首先开始于（ ）"}],"opts":["交通运输业","制呢业","棉纺织业","采矿业"],"ans":2,"why":{"A":"交通运输业的革新是工业革命后期才发展起来，并不是工业革命最先开始的行业，错误。","B":"制呢业在英国发展较早，但没有率先出现机器生产的革新，不是工业革命开端，错误。","C":"18世纪60年代英国棉纺织业率先出现珍妮机等机器发明，开启机器生产取代手工劳动的变革，由此拉开工业革命的序幕，是这场生产领域革命性变化的起点，正确。","D":"采矿业是配合蒸汽机推广而发展，不属于工业革命最先开始的领域，错误。"},"sol":""},{"no":87,"id":"ls-paper01-q087","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"插画反映出（ ）"},{"t":"tbl","rows":[[{"t":"捡骨头求生的穷人","imgs":["images/试卷/q087_1.webp"]},{"t":"图片介绍：该图为1845年9月6日发表在英国报纸《讽刺作家》上的插画。4个饥饿的人正在为抢食骨头（用来粉碎后作肥料）而大打出手。","imgs":[]}]]}],"opts":["资产阶级革命激化了社会矛盾","君主立宪制度阻碍了社会进步","工业革命加剧社会的贫富分化","攻占巴士底狱以反抗封建统治"],"ans":2,"why":{"A":"英国资产阶级革命发生在17世纪，与题干1845年的时间不符，错误。","B":"英国君主立宪制确立后推动了英国资本主义的发展，并没有阻碍社会进步，错误。","C":"题干插画是1845年英国报刊刊登的内容，反映了底层穷人饥饿困苦、争抢肥料用骨头的处境。1845年英国已完成工业革命，工业革命在推动生产力发展的同时，加剧了社会贫富分化，资产阶级积累了大量财富，而底层民众生活极端贫困，正确。","D":"巴黎人民攻占巴士底狱是1789年法国大革命的事件，不符合题意，错误。"},"sol":""},{"no":88,"id":"ls-paper01-q088","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"“煤烟曾折磨大不列颠……100多年之久，以烟煤为燃料的城市……无不饱受过数十年严重的大气污染之苦，消耗着大量的氧气”。烟煤的大量应用直接源于（ ）"}],"opts":["蒸汽机的发明","汽车的发明","内燃机的发明","火车的运行"],"ans":0,"why":{"A":"瓦特改良后的蒸汽机以烟煤作为燃料，它在工业生产中广泛推广，带动煤炭大规模开采与使用，让英国长期遭受煤烟污染，是烟煤大量应用的直接源头，正确。","B":"汽车依靠汽油驱动，属于第二次工业革命成果，不使用烟煤作为燃料，错误。","C":"内燃机消耗石油制品，燃料和烟煤没有关联，不会造成大规模煤烟污染，错误。","D":"火车只是蒸汽机的应用产物，不是推动烟煤大量使用的源头，错误。"},"sol":""},{"no":89,"id":"ls-paper01-q089","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"下表中促使曼彻斯特棉纺厂数量产生变化的发明是（ ）"},{"t":"tbl","rows":[[{"t":"英国曼彻斯特棉纺厂发展概况表","imgs":[]}],[{"t":"18世纪80年代初","imgs":[]},{"t":"2家","imgs":[]}],[{"t":"1802年","imgs":[]},{"t":"52家","imgs":[]}],[{"t":"1809年","imgs":[]},{"t":"64家","imgs":[]}],[{"t":"1830年","imgs":[]},{"t":"99家","imgs":[]}]]}],"opts":["珍妮机","蒸汽机","火车","内燃机"],"ans":1,"why":{"A":"珍妮机是纺纱机器，不能推动工厂大规模集中建厂，错误。","B":"瓦特改良蒸汽机为工厂提供稳定动力，推动棉纺厂大量兴建，正确。","C":"火车属于交通工具，不是工厂发展的核心动力发明，错误。","D":"内燃机是第二次工业革命成果，时间不符，错误。"},"sol":""},{"no":90,"id":"ls-paper01-q090","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"下表反映出在第一次工业革命中（ ）"},{"t":"tbl","rows":[[{"t":"年份","imgs":[]},{"t":"事件","imgs":[]}],[{"t":"1768","imgs":[]},{"t":"瓦特在纽可门机的基础上对蒸汽机做了重大改进，大大提高了蒸汽机的效率","imgs":[]}],[{"t":"1804","imgs":[]},{"t":"利用轨道移动的蒸汽机车首先在煤矿区出现，这就是火车的雏形","imgs":[]}],[{"t":"1807","imgs":[]},{"t":"美国人富尔顿将瓦特蒸汽机运用于轮船。建成“克莱蒙特号”汽船","imgs":[]}]]}],"opts":["科技与生产紧密结合","蒸汽机得到不断改进和发展","推动了现代工厂制度确立","工业化、城市化进程加速推进"],"ans":1,"why":{"A":"“科技与生产紧密结合”是第二次工业革命的特点，第一次工业革命大多是工匠经验总结，错误。","B":"表格中展示从瓦特改进蒸汽机提升效率，到蒸汽机被装到轨道车辆上造出火车雏形，再到被装到船上造出汽船，完整体现了蒸汽机在第一次工业革命中不断被改进、应用范围持续拓展的过程，正确。","C":"现代工厂制度确立是机器生产取代手工工场带来的结果，表格材料没有体现工厂制度相关内容，错误。","D":"表格未提及工业化、城市化相关内容，无法体现该点，错误。"},"sol":""},{"no":91,"id":"ls-paper01-q091","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"中国人民大学教授郝立新在评价某文献时说：“它吹响了工人阶级革命的号角，成为革命运动的先导。它预示并指导了工人阶级反对资产阶级的革命的发展。”该文献是（ ）"}],"opts":["《人权宣言》","《独立宣言》","《共产党宣言》","《开罗宣言》"],"ans":2,"why":{"A":"《人权宣言》是法国大革命时期颁布的纲领性文件，主要宣扬自由、平等、天赋人权等资产阶级思想，与“工人阶级革命的号角”无关，错误。","B":"《独立宣言》是美国独立战争时期颁布的宣告北美殖民地脱离英国统治、宣布建立独立国家的文件，属于资产阶级革命文献，错误。","C":"材料中“吹响了工人阶级革命的号角，成为革命运动的先导”“指导了工人阶级反对资产阶级的革命的发展”指向《共产党宣言》。《共产党宣言》的发表标志着马克思主义的诞生，为无产阶级斗争提供了科学理论指导，推动了国际工人运动的蓬勃发展，正确。","D":"《开罗宣言》是二战期间中、美、英三国首脑发表的关于对日作战和战后处置日本的国际文件，与工人阶级革命无关，错误。"},"sol":""},{"no":92,"id":"ls-paper01-q092","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"与“马克思、恩格斯”“号召工人阶级用暴力推翻资产阶级统治”“标志着马克思主义的诞生”等内容有关的著作是（ ）"}],"opts":["《共产党宣言》","《人权宣言》","《独立宣言》","《权利法案》"],"ans":0,"why":{"A":"《共产党宣言》由马克思、恩格斯撰写，号召工人阶级推翻资产阶级统治，它的发表标志着马克思主义诞生，正确。","B":"《人权宣言》是法国大革命的文献，宣扬自由平等，和马克思主义无关，错误。","C":"《独立宣言》是美国独立战争的文献，宣告美国脱离英国殖民统治，错误。","D":"《权利法案》是英国资产阶级革命后限制王权的法律文件，错误。"},"sol":""},{"no":93,"id":"ls-paper01-q093","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"某部著作既肯定了资本主义的历史进步作用，又揭示了资本主义在积累财富和资本的同时，对工人阶级的残酷剥削必将引起工人阶级反抗。该著作是（ ）"}],"opts":["《独立宣言》","《法国民法典》","《资本论》","《共产党宣言》"],"ans":3,"why":{"A":"《独立宣言》宣告美国独立，没有分析资本主义的进步性与剥削性，错误。","B":"《法国民法典》是拿破仑时期的法典，维护资产阶级私有财产，错误。","C":"《资本论》侧重剖析资本运行规律，不是重点揭示工人反抗，错误。","D":"《共产党宣言》肯定资本主义在历史上的积极作用，同时揭露资产阶级对工人的剥削，号召工人阶级反抗，正确。"},"sol":""},{"no":94,"id":"ls-paper01-q094","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"马克思、恩格斯广泛汲取人类文明的优秀成果，建立了辩证唯物主义和历史唯物主义等科学理论。这表明，马克思主义理论（ ）"}],"opts":["轻视工人阶级力量","否定传统理论","对传统的继承和创新","指导工人运动"],"ans":2,"why":{"A":"马克思主义理论始终重视工人阶级的革命力量，将无产阶级作为推翻旧世界、建设新社会的核心主体，该选项表述完全不符合马克思主义的核心立场，错误。","B":"马克思、恩格斯并非全盘否定传统理论，而是批判地继承前人思想中的合理内核，并非对传统理论的彻底否定，错误。","C":"马克思、恩格斯广泛汲取人类文明的优秀成果，批判吸收德国古典哲学、英国古典政治经济学等传统思想的合理部分，在此基础上创立了辩证唯物主义和历史唯物主义等全新的科学理论，这一过程正体现了对传统优秀成果的继承，同时实现了理论层面的创新，正确。","D":"马克思主义确实起到了指导工人运动的作用，但题干描述的是马克思主义理论的创立过程，并未涉及该理论诞生之后的实践指导作用，错误。"},"sol":""},{"no":95,"id":"ls-paper01-q095","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"小历同学所在班级开展了主题研讨活动，他在学校的图书馆查阅了以下书籍：《马克思主义经典著作解读》、《共产党宣言》、《毛泽东选集》，据此推测，他们研讨的主题最有可能是（ ）"}],"opts":["社会主义的发展与挫折","资本主义制度的扩展","科学社会主义的发展史","共产主义运动的兴起"],"ans":2,"why":{"A":"“ 社会主义的发展与挫折”侧重社会主义从建立到后来遇到困境（如苏联解体、东欧剧变等）的过程，材料中的书籍侧重理论成果与理论发展，没有涉及社会主义发展中的挫折相关内容，错误。","B":"资本主义制度的扩展对应19世纪俄国农奴制改革、美国南北战争、日本明治维新等史实，和题干中的马克思主义、社会主义相关书籍完全无关，错误。","C":"《共产党宣言》标志科学社会主义诞生，《马克思主义经典著作解读》是对科学社会主义理论体系的阐释与梳理，《毛泽东选集》体现科学社会主义理论在中国的发展延伸，三者串联正好对应科学社会主义从诞生到发展的历程，正确。","D":"“共产主义运动的兴起”只对应《共产党宣言》发表后初期工人运动兴起的阶段，无法涵盖后续马克思主义发展到中国形成毛泽东思想的内容，覆盖范围不匹配，错误。"},"sol":""},{"no":96,"id":"ls-paper01-q096","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"列宁曾经评价道：“欧洲无产阶级可以说，它的科学是由两位学者和战士创造的，他们的关系超过了古人关于人类友谊的一切最动人的传说。”材料中的“两位学者和战士” （ ）"}],"opts":["创立了《国际歌》","建立世界上第一个无产阶级政权","创立科学理论以指导国际工人运动","提出了“一国两制”构想"],"ans":2,"why":{"A":"《国际歌》是欧仁・鲍狄埃创作的，不是马克思、恩格斯，错误。","B":"世界上第一个无产阶级政权是巴黎公社，错误。","C":"“两位学者和战士”指马克思和恩格斯，他们创立马克思主义，用来指导国际工人运动，正确。","D":"“一国两制”是邓小平提出的，错误。"},"sol":""},{"no":97,"id":"ls-paper01-q097","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"马克思主义诞生后，国际工人运动进入一个新的历史时期。1871年建立了世界上第一个无产阶级政权。这个政权是（ ）"}],"opts":["共产主义者同盟","俄国十月革命","拿破仑帝国","巴黎公社"],"ans":3,"why":{"A":"“共产主义者同盟”是1847年成立的无产阶级革命政党，是早期工人政党组织，并非掌握国家权力的政权，时间和性质均不符合要求，错误。","B":"1917年俄国十月革命，建立了世界上第一个社会主义国家，错误。","C":"拿破仑帝国是资产阶级性质的帝国，不是无产阶级政权性质，错误。","D":"1871年，巴黎无产阶级发动武装起义，推翻资产阶级临时政府统治，建立巴黎公社，这是世界上第一个无产阶级政权，符合题意要求，正确。"},"sol":""},{"no":98,"id":"ls-paper01-q098","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"歌曲是文学艺术的重要形式，许多歌曲反映了历史的变迁。为纪念巴黎公社而创作的《国际歌》，在其副歌部分，反复回荡着“团结起来到明天，英特纳雄耐尔就一定要实现！”这句歌词，展现了共产主义者的（ ）"}],"opts":["甘愿捐躯的爱国情怀","严谨治学的科学态度","改革创新的工匠精神","坚定的信念和乐观主义精神"],"ans":3,"why":{},"sol":"根据材料中“团结起来到明天，英特纳雄耐尔就一定要实现”，体现了巴黎公社战士的坚定信念和乐观主义精神，故本题选D。"},{"no":99,"id":"ls-paper01-q099","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"观察下图（纪念巴黎公社100周年邮票），下列表述与其纪念事件关联最密切的是（ ）"},{"t":"img","src":"images/试卷/q099_1.webp"}],"opts":["攻占了巴士底狱","诞生了拿破仑帝国","法国里昂纺织工人起义","建立了第一个无产阶级政权"],"ans":3,"why":{"A":"攻占巴士底狱是法国大革命开始的标志，和巴黎公社无关，错误。","B":"拿破仑帝国的诞生和巴黎公社无关，错误。","C":"法国里昂纺织工人起义是巴黎公社之前的早期工人运动，和巴黎公社无关，错误。","D":"巴黎公社建立了世界上第一个无产阶级政权，符合巴黎公社的历史定位，正确。"},"sol":""},{"no":100,"id":"ls-paper01-q100","unit":"第七单元 第一次工业革命和马克思主义的诞生","blocks":[{"t":"p","v":"“起来，饥寒交迫的奴隶，起来，全世界受苦的人！满腔的热血已经沸腾，要为真理而斗争！旧世界打个落花流水，奴隶们起来，起来！”这是巴黎公社战士、公社委员、诗人鲍狄埃的诗句，其中“旧世界”指的是（ ）"}],"opts":["法国的封建君主专制制度","英国的殖民统治","欧洲封建制度","资产阶级的统治"],"ans":3,"why":{"A":"巴黎公社时期法国已经是资本主义社会，不存在封建君主专制制度，错误。","B":"巴黎公社发生在法国，是法国无产阶级反抗本国资产阶级统治的革命斗争，和英国的殖民统治没有关联，错误。","C":"巴黎公社斗争对象不是封建制度，此时法国封建制度早已被推翻，错误。","D":"巴黎公社是无产阶级建立政权的第一次伟大尝试，矛头对准资产阶级的统治，诗句里的“旧世界”指资产阶级的统治，正确。"},"sol":""}]}};

}

const MODE_TXT={recite:'① 翻卡背',cloze:'② 填空闯',choice:'③ 四选一',wrong:'④ 错题强化',list:'⑤ 清单',paper:'⑥ 套卷'};
let P=loadProg();
function loadProg(){
  let d={cards:{},days:{},paper:{}};
  try{const raw=localStorage.getItem(SK);if(raw){const o=JSON.parse(raw);if(o&&o.cards)d=o;}}catch(e){}
  if(!d.days)d.days={};
  if(!d.paper)d.paper={};
  return d;
}
function saveProg(){ try{localStorage.setItem(SK,JSON.stringify(P));}catch(e){console.warn('保存失败',e);} }
/* ---- 续练会话：记住"练到哪一张/哪一轮"，退出或刷新后能接着练 ---- */
function saveSess(){
  if(!DATA)return;
  /* ⑤ 清单只是查看，不算"练到哪"：不覆盖上一次的练习位置 */
  if(S.mode==='list')return;
  const o={v:1,mode:S.mode,unit:S.unit,scope:S.scope,qi:S.qi,queue:S.queue.slice(),revealed:!!S.revealed,ts:Date.now()};
  if(PAPER)o.paper={unit:S.paper.unit,range:S.paper.range,qi:S.paper.qi,queue:S.paper.queue.slice(),log:S.paper.log};
  try{localStorage.setItem(SSK,JSON.stringify(o));}catch(e){/* 隐私模式等存不了就算了 */}
}
function loadSess(){
  try{const raw=localStorage.getItem(SSK);if(!raw)return null;const o=JSON.parse(raw);return o&&o.v===1?o:null;}catch(e){return null;}
}
function clearSess(){try{localStorage.removeItem(SSK);}catch(e){}const el=$('#resume');if(el){el.hidden=true;el.innerHTML='';}}
function rec(cardId,ok,mode,opts){
  const p=P.cards[cardId]||(P.cards[cardId]={seen:0,ok:0,wrong:0,streak:0,last:0,mode:''});
  /* 第一次作答（seen 0→1）时记下这一次有没有答对：面板算「首次正确率」用，已有值不覆盖 */
  if(!p.seen&&p.firstOk==null)p.firstOk=ok?1:0;
  p.seen++;p.last=Date.now();p.mode=mode||p.mode;
  if(ok){p.ok++;p.streak=Math.min(9,p.streak+1);}else{p.wrong++;p.streak=0;}
  if(opts&&opts.skim)p.skim=(p.skim||0)+1;
  const d=todayKey(),t=P.days[d]||(P.days[d]={n:0,ok:0});
  t.n++;if(ok)t.ok++;
  saveProg();
  refreshStatx(cardId);   /* 答完当场更新题头的「对 X · 错 Y」 */
}
const getP=id=>P.cards[id]||null;
/* 安全取值：还没练过的卡也要能排序、能比大小 */
const PW=id=>getP(id)||{seen:0,ok:0,wrong:0,streak:0,last:0};
const scrollTop=()=>{try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){/* 有些环境没实现 */}};
function level(id){
  const p=getP(id);
  if(!p||!p.seen)return 0;
  if(p.streak>=3)return 3;
  if(p.streak>0)return 2;
  return 4; /* 有错待强化 */
}
const LVTXT={0:'未学',1:'未学',2:'记过',3:'熟练',4:'待强化'};

/* ================================================================
   考点解析：把【关键词】切出来
   ================================================================ */
function tokens(text){
  const out=[];let last=0,m;const re=/【([^】]+)】/g;
  while((m=re.exec(text))){
    if(m.index>last)out.push({t:'s',v:text.slice(last,m.index)});
    out.push({t:'b',v:m[1].split('|').map(s=>s.trim()).filter(Boolean)});
    last=m.index+m[0].length;
  }
  if(last<text.length)out.push({t:'s',v:text.slice(last)});
  return out;
}
/* 生成一张卡的渲染计划：段落 + 表格，占位符按出现顺序编号 */
function planOf(c){
  let k=0;const blanks=[];
  const paint=toks=>toks.map(t=>{
    if(t.t!=='b')return t;
    const o={t:'b',v:t.v,k:k};blanks.push(t.v);k++;return o;
  });
  const body=(c.a||[]).map(txt=>({type:'p',toks:paint(tokens(txt))}));
  if(c.table){
    const rows=(c.table.rows||[]).map(r=>r.map(cell=>paint(tokens(cell))));
    body.push({type:'table',head:c.table.head||[],rows});
  }
  return {body,blanks,count:k};
}
const PLAN={};DATA&&DATA.cards.forEach(c=>{PLAN[c.id]=planOf(c);});

function nowLine(toks){
  return toks.map(t=>t.t==='s'?esc(t.v):`<em class="kw" title="${esc(t.v.slice(1).join(' / ')||t.v[0])}">${esc(t.v[0])}</em>`).join('');
}
function inputLine(toks){
  return toks.map(t=>{
    if(t.t==='s')return esc(t.v);
    const w=Math.max(3,Math.min(11,t.v[0].length+1));
    return `<input class="bi" data-k="${t.k}" size="${w}" autocomplete="off" spellcheck="false" aria-label="填空">`;
  }).join('');
}

function renderAns(c,plan,cloze){
  const html=plan.body.map(it=>{
    if(it.type==='p'){
      return `<p class="ln">${cloze?inputLine(it.toks):nowLine(it.toks)}</p>`;
    }
    const head=it.head.map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=it.rows.map(r=>'<tr>'+r.map(cell=>`<td>${cloze?inputLine(cell):nowLine(cell)}</td>`).join('')+'</tr>').join('');
    return `<table class="tb"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }).join('');
  return html;
}
/* 批注分色显示：本课必背 / 易错 / 注意 / 补充（转录备注） */
function warnHTML(c){
  if(!c.warn)return '';
  return String(c.warn).split('；').map(s=>s.trim()).filter(Boolean).map(s=>{
    let kind='补充',body=s,m;
    if(m=s.match(/^本课必背(一句话)?[：:]?\s*(.*)$/)){kind='必背';body=m[2];}
    else if(m=s.match(/^(易错点|易混易错|易错|易混)[：:]?\s*(.*)$/)){kind='易错';body=m[2];}
    else if(m=s.match(/^(注意提法|注意)[：:]?\s*(.*)$/)){kind='注意';body=m[2];}
    return `<div class="warn k-${kind}"><b>${kind}</b>${esc(body)}</div>`;
  }).join('');
}
function pageLink(c){
  if(!c.page)return '';
  const base=(DATA.imgBase||'images/'),pre=DATA.imgPrefix||'',ext=DATA.imgExt||'jpg';
  return ` <a href="${esc(base+pre+c.page+'.'+ext)}" target="_blank" rel="noopener">对照原页 p${c.page}</a>`;
}
/* 累计对/错次数标签：同一张卡反复错会一直累加，答对也不清零 */
function statxHTML(id){
  const p=getP(id);
  if(!p||!p.seen)return '';
  return `<span class="statx" title="这张卡累计答对 / 答错次数（答对不清零，方便看同一处反复错）">`+
    `<b class="ok">对 ${p.ok}</b> · <b class="${p.wrong>0?'bad':''}">错 ${p.wrong}</b> · 做过 ${p.seen}</span>`;
}
/* 刚答完就要更新题头，不能等下一题重渲染 */
function refreshStatx(id){
  const box=document.querySelector('#stage .card .meta .mt');
  if(!box)return;
  const html=statxHTML(id);
  if(!html)return;
  const el=box.querySelector('.statx');
  if(el)el.outerHTML=html; else box.insertAdjacentHTML('beforeend',html);
}
function metaHTML(c){
  const bits=[];
  if(c.unit)bits.push(`<span class="u">${esc(c.unit)}</span>`);
  if(c.lesson)bits.push(esc(c.lesson));
  if(c.node)bits.push(esc(c.node));
  const lv=level(c.id);
  const statx=statxHTML(c.id);
  return `<div class="meta"><span class="mt">${bits.join(' ／ ')}${statx}</span>`+
    `<span class="mr">${pageLink(c)}<span class="stars">${STAR(c.star)}</span>`+
    `<span class="lv lv${lv}">${lv===4?'待强化':LVTXT[lv]}</span></span></div>`;
}

/* ================================================================
   全局状态
   ================================================================ */
const UNITS=[...new Set((DATA?DATA.cards:[]).map(c=>c.unit||'未分单元'))];
const S={mode:'recite',unit:'全部',scope:'all',queue:[],qi:0,revealed:false,scored:false,cur:null,curPlan:null,choice:null,optDone:false,
  paper:{unit:'全部',range:'seq',queue:[],qi:0,log:{},pick:null,echo:null}};
const hasBlanks=c=>PLAN[c.id].count>0;
const CARD_BY=id=>DATA.cards.find(c=>c.id===id);

/* ================================================================
   统计条
   ================================================================ */
function renderBar(){
  if(S.mode==='paper'&&PAPER){paperBar();return;}
  const cards=DATA.cards;
  const n=cards.length;
  let ok=0,weak=0,done=0,tok=0,twrong=0;
  cards.forEach(c=>{const p=getP(c.id);if(!p||!p.seen)return;done++;
    tok+=p.ok||0;twrong+=p.wrong||0;
    const lv=level(c.id);if(lv===3)ok++;if(lv===4)weak++;});
  const d=P.days[todayKey()]||{n:0,ok:0};
  const rate=d.n?Math.round(d.ok/d.n*100):0;
  $('#bar').innerHTML=
    `<div class="row"><span class="pill">考点 <b>${n}</b></span>`+
    `<span class="pill ok">已熟练 <b>${ok}</b></span>`+
    `<span class="pill bad">待强化 <b>${weak}</b></span>`+
    `<span class="pill" title="全部考点卡的累计答对 / 答错次数（同一张卡反复错也会累加）">累计 对 <b style="color:var(--ok)">${tok}</b> / 错 <b style="color:var(--bad)">${twrong}</b></span>`+
    `<span class="pill">今天 <b>${d.n}</b> 题 · <b>${rate}%</b></span></div>`+
    `<div class="row">`+
    `<select id="fu" title="按单元（做题和 ⑤ 清单 都按它筛）">${['全部',...UNITS].map(u=>`<option${u===S.unit?' selected':''}>${esc(u)}</option>`).join('')}</select>`+
    `<select id="fs" title="${S.mode==='list'?'筛选范围（清单里只显示符合条件的卡）':'练习范围（做题和 ⑤ 清单 都按它筛）'}">
      <option value="all"${S.scope==='all'?' selected':''}>全部范围</option>
      <option value="star"${S.scope==='star'?' selected':''}>${S.mode==='list'?'只看★必背':'只练★必背'}</option>
      <option value="weak"${S.scope==='weak'?' selected':''}>${S.mode==='list'?'只看待强化':'只练未熟练'}</option>
      <option value="unseen"${S.scope==='unseen'?' selected':''}>${S.mode==='list'?'只看没练过':'只练没练过'}</option>
    </select>`+
    `<span class="sp"></span>`+
    `<button class="linkbtn" id="exp" title="把练习记录导出成文件（备份/换设备）">导出记录</button>`+
    `<button class="linkbtn" id="imp" title="从文件导入练习记录">导入记录</button>`+
    `<button class="linkbtn" id="rst" title="清空本机的练习记录">清空</button></div>`;
  $('#fu').onchange=e=>{S.unit=e.target.value;S.qi=0;buildQueue();render();};
  $('#fs').onchange=e=>{S.scope=e.target.value;S.qi=0;buildQueue();render();};
  $('#exp').onclick=exportProg;
  $('#imp').onclick=importProg;
  $('#rst').onclick=()=>{
    if(!confirm('清空全部练习记录？（不可恢复，建议先「导出记录」）'))return;
    P={cards:{},days:{},paper:{}};saveProg();
    clearSess();
    if(S.mode==='paper')buildPaper();
    S.qi=0;buildQueue();render();
  };
}
function exportProg(){
  const blob=new Blob([JSON.stringify({subject:DATA.subject,exported:new Date().toISOString(),data:P},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${DATA.subject}-练习记录-${todayKey()}.json`;
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function importProg(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        const d=o.data&&o.data.cards?o.data:o;
        if(!d.cards)throw new Error('文件里没有 cards');
        if(!confirm(`导入后会用文件里的记录覆盖本机记录（文件里 ${Object.keys(d.cards).length} 张卡的记录）。继续？`))return;
        P={cards:d.cards||{},days:d.days||{},paper:d.paper||{}};saveProg();
        clearSess();
        if(S.mode==='paper')buildPaper();
        S.qi=0;buildQueue();render();
      }catch(e){alert('导入失败：'+e.message);}
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ================================================================
   队列
   ================================================================ */
function pool(){
  let a=DATA.cards.slice();
  if(S.unit!=='全部')a=a.filter(c=>(c.unit||'未分单元')===S.unit);
  if(S.scope==='star')a=a.filter(c=>(c.star||1)>=2);
  if(S.scope==='unseen')a=a.filter(c=>!getP(c.id)||!getP(c.id).seen);
  if(S.scope==='weak')a=a.filter(c=>{const lv=level(c.id);return lv===0||lv===2||lv===4;});
  return a;
}
function buildQueue(){
  let a=pool();
  if(S.mode==='cloze')a=a.filter(hasBlanks);
  if(S.mode==='wrong')a=a.filter(c=>{const p=getP(c.id);return p&&p.wrong>0&&p.streak<2;});
  if(S.mode==='choice')a=a.filter(hasBlanks);
  if(S.mode==='wrong'||S.mode==='choice')a.sort((x,y)=>PW(y.id).wrong-PW(x.id).wrong);
  else a.sort((x,y)=>(PW(x.id).seen?1:0)-(PW(y.id).seen?1:0));
  S.queue=a.map(c=>c.id);
  if(S.qi>=S.queue.length)S.qi=0;
}
function setProg(){
  const el=$('#prog');
  if(S.mode==='paper'){
    if(!S.paper.queue.length){el.hidden=true;return;}
    el.hidden=false;
    $('i',el).style.width=Math.round((S.paper.qi+1)/S.paper.queue.length*100)+'%';
    return;
  }
  if(!['recite','cloze','choice','wrong'].includes(S.mode)||!S.queue.length){el.hidden=true;return;}
  el.hidden=false;
  $('i',el).style.width=Math.round((S.qi+1)/S.queue.length*100)+'%';
}

/* ================================================================
   渲染入口
   ================================================================ */
function render(){
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===S.mode));
  renderBar();setProg();
  const st=$('#stage');
  if(S.mode==='list')renderList(st);
  else if(S.mode==='paper')renderPaper(st);
  else if(!S.queue.length){st.innerHTML=emptyHTML();renderNav(st);}
  else{
    const c=CARD_BY(S.queue[S.qi]);
    if(!c)st.innerHTML=emptyHTML();
    else{
      if(S.mode==='choice')renderChoice(st,c);
      else if(S.mode==='cloze')renderCloze(st,c);
      else renderRecite(st,c);
      renderNav(st);
    }
  }
  /* ④ 错题强化：套卷错题不在卡片队列里，单独列一块，免得以为"错题没进错题栏" */
  if(S.mode==='wrong')appendPaperWrong(st);
  /* 每次状态变化都顺手记下位置：手机切走/刷新/被杀掉后能回到这里 */
  saveSess();
}
function emptyHTML(){
  if(S.mode==='paper'){
    const tips={
      weak:'错过的题会自动进来；做对了也留着，确认真会了在「错题本」里勾「我会了」才清掉。',
      unseen:'这个范围里的题都做过了，换成「整卷顺序」或「只做错题」。',
      seq:'换一个单元，或把范围改成「整卷顺序」。',
      round:'这一份卷子没有匹配的题。'
    };
    return `<div class="card empty"><span class="big">${S.paper.range==='weak'?'🎉':'🗂'}</span>${
      S.paper.range==='weak'?'当前范围没有待强化的错题。':'当前范围没有可做的题。'}
      <div class="hint">${tips[S.paper.range]||''}</div></div>`;
  }
  const pwN=PAPER?wrongBookList().length:0;
  const tips={
    recite:'把「练习范围」改成"全部范围"，或点上面的单元重新选。',
    cloze:'这一类里没有可挖空的考点，换「翻卡背」练。',
    choice:'这一类里没有可挖空的考点，换「翻卡背」练。',
    wrong:pwN?'下面列的就是套卷错题，点「回炉这题」直接做。':'太棒了，错题已经清空。错过的题会自动进来；做对了也留着，勾「我会了」才清掉。'
  };
  const wrongEmpty=pwN?('考点卡这边清空了，下面还有 '+pwN+' 道<b>试卷错题</b>。'):'当前范围没有待强化的错题。';
  return `<div class="card empty"><span class="big">${S.mode==='wrong'?'🎉':'🗂'}</span>${
    S.mode==='wrong'?wrongEmpty:(S.scope==='unseen'?'这个范围里的考点都练过了。':'当前范围没有匹配的考点。')}
    <div class="hint">${tips[S.mode]||''}</div></div>`;
}
/* ④ 里的「试卷错题」区块：只列套卷错题（卡片错题已经在上面排队了） */
function paperWrongSection(){
  if(!PAPER)return '';
  const all=wrongBookList();
  if(!all.length)return '';
  const list=all.slice(0,10);
  const rows=list.map(({q,p})=>`<div class="pwrong">
      <span class="wq">第 ${esc(q.no)} 题</span>
      <span class="wunit">${esc(q.unit||'未分单元')}</span>
      <span class="wcnt">累计错 ${p.wrong} 次</span>
      <span class="sp"></span>
      <button class="btn sm" data-pwredo="${esc(q.id)}">回炉这题</button>
    </div>`).join('');
  return `<div class="card"><div class="row" style="display:flex;align-items:center;gap:8px">
      <h3 style="margin:0;font-size:15px">试卷错题（${all.length} 道）</h3>
      <button class="linkbtn" data-pwall="1" style="margin-left:auto">打开套卷错题本 →</button>
    </div>
    <div class="hint" style="margin-top:6px">这是 ⑥ 套卷里错过的题，不在上面的考点卡队列里。做对了也留着（记着累计错次），真会了去错题本勾「我会了」清掉。</div>
    ${rows}
    ${all.length>list.length?`<div class="hint">还有 ${all.length-list.length} 道，去套卷错题本里看全。</div>`:''}</div>`;
}
function appendPaperWrong(st){
  const html=paperWrongSection();
  if(!html)return;
  st.insertAdjacentHTML('beforeend',html);
  const box=st.lastElementChild;
  const go=id=>{
    S.mode='paper'; S.paper.range='weak';
    buildPaper();
    let i=S.paper.queue.indexOf(id);
    if(i<0){ S.paper.queue.push(id); i=S.paper.queue.length-1; }
    S.paper.qi=i; S.paper.echo=null;
    render(); scrollTop();
  };
  $$('[data-pwredo]',box).forEach(b=>b.onclick=()=>go(b.dataset.pwredo));
  const all=$('[data-pwall]',box);
  if(all)all.onclick=()=>renderWrongBook();
}
function renderNav(st){
  const nav=document.createElement('div');
  nav.className='nav';
  if(S.mode==='paper'){
    if(!S.paper.queue.length)return;
    nav.innerHTML=`<button class="btn sm" id="pv"${S.paper.qi===0?' disabled':''}>← 上一题</button>
       <span>${S.paper.qi+1} / ${S.paper.queue.length}</span>
       <button class="btn sm" id="nx">下一题 →</button>`;
    st.appendChild(nav);
    const pv=$('#pv',nav),nx=$('#nx',nav);
    if(pv&&!pv.disabled)pv.onclick=()=>{S.paper.qi--;S.paper.echo=null;render();scrollTop();};
    if(nx)nx.onclick=()=>paperNext();
    return;
  }
  const inSess=['recite','cloze','choice','wrong'].includes(S.mode);
  nav.innerHTML=inSess&&S.queue.length
    ? `<button class="btn sm" id="pv"${S.qi===0?' disabled':''}>← 上一题</button>
       <span>${S.qi+1} / ${S.queue.length}</span>
       <button class="btn sm" id="nx">下一题 →</button>`
    : `<span></span><span></span><span></span>`;
  st.appendChild(nav);
  const pv=$('#pv',nav),nx=$('#nx',nav);
  if(pv&&!pv.disabled)pv.onclick=()=>{S.qi--;S.revealed=false;S.scored=false;render();};
  if(nx)nx.onclick=()=>{nextCard();};
}
function nextCard(){
  if(S.qi<S.queue.length-1){S.qi++;S.revealed=false;S.scored=false;render();}
  else{
    const st=$('#stage');

    scrollTop();
  }
}

  const acts=$('#acts',st);

    let bad=0,empty=0;
    inputs.forEach(inp=>{
      const k=+inp.dataset.k,alts=p.blanks[k];

        (norm(alts[0]).length>=8 && alts.some(a=>loose(a)===loose(v))));

        inp.insertAdjacentHTML('afterend',`<span class="given">${esc(alts[0])}</span>`);}
      inp.disabled=true;
    });
    if(!S.scored){rec(c.id,bad===0,'cloze');S.scored=true;}
    $('#fb',st).innerHTML=`<div class="verdict ${bad===0?'ok':'bad'}">${
      bad===0?'<b>全对 ✓</b> 这张卡记得住。':
      `<b>错 ${bad} 处</b>${empty?`（其中 ${empty} 空没填）`:''}，前面绿色的是正解，红色的是你填的。`}</div>`;
    acts.innerHTML=`<button class="btn p" id="nx2">下一题（回车）</button>
      <button class="btn" id="again">再填一次</button>
      ${bad>0?'<button class="btn sm" id="forgive">我其实答对了（算对）</button>':''}
      <span class="hint">这一题已记入${bad>0?'错题本':'熟练'}。</span>`;
    $('#nx2',acts).onclick=nextCard;
    $('#again',acts).onclick=()=>{
      inputs.forEach(inp=>{inp.disabled=false;inp.value='';inp.classList.remove('ok','bad');});
      $$('.given',st).forEach(e=>e.remove());
      $('#fb',st).innerHTML='';S.scored=true; // 重练不重复计分
      acts.innerHTML=`<button class="btn p" id="sub">提交判分</button>`;
      $('#sub',acts).onclick=submit;
      inputs[0]&&inputs[0].focus();
    };
    const fg=$('#forgive',acts);
    if(fg)fg.onclick=()=>{const q=getP(c.id);if(q){q.wrong=Math.max(0,q.wrong-1);q.streak=1;saveProg();}renderBar();fg.textContent='已改判 ✓';fg.disabled=true;};
  };
  acts.innerHTML=`<button class="btn p" id="sub">提交判分（回车）</button>
    <button class="btn sm" id="peek">看答案（算不会）</button>`;
  $('#sub',acts).onclick=submit;

    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(S.scored)nextCard();else submit();}};
    if(i===0&&!BOOTING)inp.focus({preventScroll:true});

/* ---------------- ③ 四选一 ---------------- */
function termPool(){
  if(termPool._c)return termPool._c;
  const all=[];
  DATA.cards.forEach(c=>{
    const p=PLAN[c.id];
    p.blanks.forEach(alts=>{if(alts[0])all.push({t:alts[0],unit:c.unit||'',id:c.id});});
  });
  termPool._c=all;return all;
}
function distractors(card,plan,k,n){
  const right=plan.blanks[k][0];
  const all=termPool();
  const sameUnit=all.filter(x=>x.unit===(card.unit||'')&&norm(x.t)!==norm(right));
  const other=all.filter(x=>x.unit!==(card.unit||'')&&norm(x.t)!==norm(right));
  const picked=[];const seen=new Set([norm(right)]);
  const take=arr=>{
    const sh=shuffle(arr.slice());
    for(const x of sh){
      if(picked.length>=n)return;
      const key=norm(x.t);
      if(seen.has(key))continue;
      seen.add(key);picked.push(x.t);
    }
  };
  take(sameUnit);take(other);
  return picked;
}
function renderChoice(st,c){
  const p=PLAN[c.id];
  // 选一个空（优先没练过的位置）
  if(!S.choice||S.choice.id!==c.id||S.choice.k>=p.count)S.choice={id:c.id,k:0};
  const k=S.choice.k;
  const right=p.blanks[k][0];
  const opts=shuffle([right,...distractors(c,p,k,3)]);
  const toks=PICK_TOKENS(p,k);
  st.innerHTML=`<div class="card">${metaHTML(c)}
    <div class="q" style="font-size:16px">${esc(c.q)}</div>
    <div class="ans" id="ans"><div class="lead">补全下面这句话（第 ${k+1}/${p.count} 空）：</div>
      <p class="ln" style="font-size:17px">${toks.before}<span style="display:inline-block;min-width:72px;border-bottom:2px solid var(--acc);text-align:center;color:var(--acc);font-weight:700">?</span>${toks.after}</p>
      ${p.count>1&&k+1<p.count?`<div class="hint">还可以练这题的第 ${k+2} 空 →</div>`:''}
    </div>
    <div class="opts" id="opts">${opts.map((o,i)=>`<button data-i="${i}" data-o="${esc(o)}"><span class="kk">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>
    <div class="acts" id="acts"><span class="hint">点选项或按 1–4；答错自动进错题本。</span></div>
  </div>`;
  const btns=$$('#opts button',st);
  let done=false;
  const answer=btn=>{
    if(done)return;done=true;
    const val=btn.dataset.o;
    const ok=norm(val)===norm(right);
    btns.forEach(b=>{
      b.disabled=true;
      if(norm(b.dataset.o)===norm(right))b.classList.add('c');
    });
    if(!ok)btn.classList.add('w');
    rec(c.id,ok,'choice');
    renderBar();
    const acts=$('#acts',st);
    const more=k+1<p.count;
    acts.innerHTML=`<button class="btn p" id="nx3">下一题（回车）</button>`+
      (more?`<button class="btn" id="nb">再练这题下一空</button>`:'')+
      (ok?'':'<button class="btn sm" id="why">看整条答案</button>');
    $('#nx3',acts).onclick=nextCard;
    if(more)$('#nb',acts).onclick=()=>{S.choice={id:c.id,k:k+1};S.revealed=false;render();};
    const wy=$('#why',acts);
    if(wy)wy.onclick=()=>{
      $('#ans',st).insertAdjacentHTML('beforeend',renderAns(c,p,false)+warnHTML(c));
      wy.disabled=true;
    };
  };
  btns.forEach(b=>b.onclick=()=>answer(b));
  st.onkeydown=e=>{
    if('1234'.includes(e.key)){const i=+e.key-1;if(btns[i]&&!btns[i].disabled)answer(btns[i]);}
    else if(e.key==='Enter'){if(done)nextCard();}
  };
}
/* 取出第 k 个空所在的那一句话，切成 前 / 空 / 后 */
function PICK_TOKENS(p,k){
  for(const it of p.body){
    if(it.type==='p'){
      const idx=it.toks.findIndex(t=>t.t==='b'&&t.k===k);
      if(idx>=0){
        const before=it.toks.slice(0,idx).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
        const after=it.toks.slice(idx+1).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
        return {before,after};
      }
    }else{
      for(const r of it.rows)for(const cell of r){
        const idx=cell.findIndex(t=>t.t==='b'&&t.k===k);
        if(idx>=0){
          const before=cell.slice(0,idx).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
          const after=cell.slice(idx+1).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
          return {before,after};
        }
      }
    }
  }
  return {before:'',after:''};
}

  const empty=filtering||q
    ? `<div class="card empty"><span class="big">🔍</span>${q?`没搜到「${esc(LISTQ)}」。`:'这个筛选下没有考点。'}
        <div class="hint">${filtering?'把顶部两个下拉框改回「全部范围 / 全部」，或点下面的按钮。':'换个词试试。'}</div>
        ${filtering?'<div class="acts" style="justify-content:center"><button class="btn sm" id="lclr2">清除筛选</button></div>':''}</div>`

      <span class="sp"></span><button class="linkbtn" id="prt">打印这份清单</button></div>

    ${weakHTML}

/* ================================================================
   ⑥ 套卷（可选的 DATA.paper：一整份带解析的选择题卷）
   ================================================================ */
const PAPER=DATA&&DATA.paper?DATA.paper:null;
const PQ=PAPER?(PAPER.questions||[]):[];
const PQ_BY=id=>PQ.find(q=>q.id===id);
const PUNITS=[...new Set(PQ.map(q=>q.unit||'未分单元'))];
const PPLAN={};PQ.forEach((q,i)=>{PPLAN[q.id]=i;});
function pState(id){return (P.paper||{})[id]||null;}
function pTally(){
  let seen=0,att=0,right=0,weak=0;
  PQ.forEach(q=>{const p=pState(q.id);if(!p||!p.seen)return;
    seen++;att+=p.seen;right+=p.ok;if(p.wrong>0&&!p.cleared)weak++;});
  return {n:PQ.length,seen,att,right,weak,rate:att?Math.round(right/att*100):0};
}
function recPaper(q,ok,pick){
  if(!P.paper)P.paper={};
  const p=P.paper[q.id]||(P.paper[q.id]={seen:0,ok:0,wrong:0,streak:0,last:0,pick:-1});
  p.seen++;p.last=Date.now();p.pick=pick;
  /* 错题不自动出库：做对了也留着（累计错次不清零），只有手动「我会了」才清；
     清掉之后再做错，会自动回来。 */
  if(ok){p.ok++;p.streak=Math.min(9,p.streak+1);}else{p.wrong++;p.streak=0;p.cleared=false;}
  const d=todayKey(),t=P.days[d]||(P.days[d]={n:0,ok:0});
  t.n++;if(ok)t.ok++;
  saveProg();
}
/* 队列：整套顺序 / 随机 20 题 / 只做错题 / 只做没做过，可按单元筛 */
function buildPaper(){
  const st=S.paper;
  let a=PQ.slice();
  if(st.unit!=='全部')a=a.filter(q=>(q.unit||'未分单元')===st.unit);
  if(st.range==='weak')a=a.filter(q=>{const p=pState(q.id);return p&&p.wrong>0&&!p.cleared;});
  if(st.range==='unseen')a=a.filter(q=>!pState(q.id)||!pState(q.id).seen);
  if(st.range==='weak')a.sort((x,y)=>pState(y.id).wrong-pState(x.id).wrong);
  else if(st.range!=='seq')a=shuffle(a.slice());
  if(st.range==='round')a=a.slice(0,20);
  if(st.range==='seq')a.sort((x,y)=>x.no-y.no);
  st.queue=a.map(q=>q.id);
  st.qi=0;st.log={};st.pick=null;st.echo=null;
}
function paperBar(){
  const t=pTally();
  $('#bar').innerHTML=
    `<div class="row"><span class="pill">套卷 <b>${t.n}</b> 题</span>`+
    `<span class="pill">已做 <b>${t.seen}</b>/${t.n}</span>`+
    `<span class="pill ok">正确率 <b>${t.rate}%</b></span>`+
    `<span class="pill bad">待强化 <b>${t.weak}</b></span>`+
    `<span class="pill">今天 <b>${(P.days[todayKey()]||{n:0}).n}</b> 题</span></div>`+
    `<div class="row">`+
    `<select id="pu" title="按单元做">${['全部',...PUNITS].map(u=>`<option${u===S.paper.unit?' selected':''}>${esc(u)}</option>`).join('')}</select>`+
    `<select id="pr" title="做题范围">
      <option value="seq"${S.paper.range==='seq'?' selected':''}>整卷顺序</option>
      <option value="round"${S.paper.range==='round'?' selected':''}>随机 20 题</option>
      <option value="weak"${S.paper.range==='weak'?' selected':''}>只做错题</option>
      <option value="unseen"${S.paper.range==='unseen'?' selected':''}>只做没做过</option>
    </select>`+
    `<span class="sp"></span>`+
    `<button class="linkbtn" id="pwb" title="错过的题都在这（做对了也留着）：可以重做，或勾「我会了」清掉">错题本（${wrongBookList().length}）</button>`+
    `<button class="linkbtn" id="exp" title="把练习记录导出成文件（备份/换设备）">导出记录</button>`+
    `<button class="linkbtn" id="imp" title="从文件导入练习记录">导入记录</button>`+
    `<button class="linkbtn" id="prt2" title="打印整份试卷（题干+答案+解析）">打印整卷</button></div>`;
  $('#pu').onchange=e=>{S.paper.unit=e.target.value;buildPaper();render();};
  $('#pr').onchange=e=>{S.paper.range=e.target.value;buildPaper();render();};
  $('#exp').onclick=exportProg;
  $('#imp').onclick=importProg;
  $('#prt2').onclick=()=>paperPrint();
  $('#pwb').onclick=()=>renderWrongBook();
}
/* 套卷错题本：错过就留着（记着累计错几次），做对了也不自动走，由本人勾「我会了」 */
function wrongBookList(){
  return PQ.map(q=>({q,p:pState(q.id)})).filter(x=>x.p&&x.p.wrong>0&&!x.p.cleared)
    .sort((a,b)=>(b.p.last||0)-(a.p.last||0));
}
function renderWrongBook(){
  const st=$('#stage');
  const list=wrongBookList();
  const rows=list.map(({q,p})=>{
    const pick=p.pick;
    const pickTxt=(pick===undefined||pick===null||pick<0)?'上次没选'
      :('上次选 '+'ABCD'[pick]+(pick===q.ans?'（对）':'（错）'));
    return `<div class="wbrow">
      <div class="wbm">
        <div class="wbline"><b>第 ${q.no} 题</b>
          <span class="pill">${esc(q.unit||'未分单元')}</span>
          <span class="pill bad">累计错 ${p.wrong} 次</span>
          <span class="pill">做过 ${p.seen} 次 · 对 ${p.ok} 次</span></div>
        <div class="hint">${pickTxt} · 正确答案 ${'ABCD'[q.ans]}</div>
      </div>
      <div class="wbbtns">
        <button class="btn sm" data-redo="${esc(q.id)}">重做这题</button>
        <button class="btn sm g" data-clear="${esc(q.id)}">我会了，清掉</button>
      </div>
    </div>`;
  }).join('');
  st.innerHTML=`<div class="card">
    <div class="meta"><span class="mt">套卷错题本</span><span class="mr">${list.length} 题</span></div>
    <div class="hint" style="margin-top:6px">做对了不会自动消失——留着过几天再回炉一遍。真会了再点「我会了」清掉；清掉以后再做错，会自动回来。</div>
    ${list.length?rows:'<div class="verdict ok" style="margin-top:12px"><b>错题本是空的 ✓</b> 最近做的都没错。</div>'}
    <div class="acts"><button class="btn" id="wbback">← 返回做题</button></div>
  </div>`;
  $('#wbback').onclick=()=>render();
  $$('[data-redo]',st).forEach(b=>b.onclick=()=>{
    const id=b.dataset.redo;
    let i=S.paper.queue.indexOf(id);
    if(i<0){S.paper.queue.push(id);i=S.paper.queue.length-1;}
    S.paper.qi=i;S.paper.echo=null;
    S.mode='paper';render();scrollTop();
  });
  $$('[data-clear]',st).forEach(b=>b.onclick=()=>{
    const pp=pState(b.dataset.clear);
    if(pp){pp.cleared=true;saveProg();}
    renderWrongBook();
  });
  scrollTop();
}

/* 整卷打印视图：题干 + 选项（正确项标绿）+ 解析，一份可打印的解析版 */
function paperPrint(){
  const st=$('#stage');
  st.innerHTML=`<div class="card no-print"><div class="acts" style="margin:0">
      <button class="btn" id="pback">← 返回做题</button>
      <button class="btn p" id="pprt">打印 / 存成 PDF</button>
    </div><div class="hint" style="margin-top:8px">整份 ${PQ.length} 题，含答案与逐项解析。打印时会自动去掉顶栏和按钮。</div></div>`+
    PQ.map(q=>`<div class="card">
      <div class="meta"><span class="mt"><b>第 ${q.no} 题</b> ／ ${esc(q.unit||'')}</span><span class="mr">答案 ${'ABCD'[q.ans]}</span></div>
      <div class="pstem">${paperBody(q)}</div>
      ${q.opts.map((o,i)=>`<div class="optrow${i===q.ans?' c':''}"><span class="kk">${'ABCD'[i]}</span><span>${esc(o)}</span></div>`).join('')}
      ${whyHTML(q)}
    </div>`).join('');
  $('#pback').onclick=()=>render();
  $('#pprt').onclick=()=>window.print();
  scrollTop();
}
const pImg=s=>`<a href="${esc(s)}" target="_blank" rel="noopener"><img src="${esc(s)}" alt="题目配图" loading="lazy"></a>`;
function paperTable(b){
  const rows0=b.rows||[];
  const cols=Math.max(1,...rows0.filter(r=>r.length>1).map(r=>r.length));
  const rows=rows0.map(r=>{
    if(r.length===1){
      const c=r[0];
      return `<tr><td class="cap" colspan="${cols}">${esc(c.t)}${(c.imgs||[]).map(pImg).join('')}</td></tr>`;
    }
    return '<tr>'+r.map(c=>`<td>${(c.imgs||[]).map(pImg).join('')}<span class="tx">${esc(c.t)}</span></td>`).join('')+'</tr>';
  }).join('');
  return `<table class="ptbl">${rows}</table>`;
}
function paperBody(q){
  let out='',figs=[];
  const flush=()=>{if(figs.length){out+=`<div class="figs">${figs.join('')}</div>`;figs=[];}};
  (q.blocks||[]).forEach(b=>{
    if(b.t==='p'){flush();out+=`<p>${esc(b.v)}</p>`;}
    else if(b.t==='img'){figs.push(`<figure>${pImg(b.src)}</figure>`);}
    else if(b.t==='tbl'){flush();out+=paperTable(b);}
  });
  flush();
  return out;
}
function whyHTML(q){
  const L=['A','B','C','D'];
  if(q.why&&Object.keys(q.why).length){
    return `<div class="whybox"><div class="lead">逐项解析（绿的是正确项）</div>`+
      L.map((k,i)=>{
        const t=q.why[k];if(!t)return '';
        return `<div class="whyrow${i===q.ans?' right':''}"><span class="k">${k}</span><span class="tx">${esc(t)}</span></div>`;
      }).join('')+`</div>`;
  }
  return `<div class="whybox"><div class="lead">解析</div><div class="whysol">${esc(q.sol||'')}</div></div>`;
}
/* 这题的历史：累计错几次、做过几次 */
function pBadges(id){
  const p=pState(id);
  if(!p||!p.seen)return '';
  return (p.wrong>0?`<span class="pill bad" style="margin-left:8px">累计错 ${p.wrong} 次</span>`:'')+
    `<span class="pill" style="margin-left:8px">做过 ${p.seen} 次 · 对 ${p.ok} 次</span>`;
}
function pickTxt(q,pick){
  if(pick===undefined||pick===null||pick<0)return '上次没选';
  return '上次选 '+ 'ABCD'[pick] + (pick===q.ans?'（那是正确答案）':'（不对）');
}
function renderPaper(st){
  const id=S.paper.queue[S.paper.qi];
  if(!id){st.innerHTML=emptyHTML();return;}
  const q=PQ_BY(id),t=pTally();
  const logged=S.paper.log[id];
  /* 只有刚提交完（echo===id）才显示判分与解析；上一题/下一题回来一律空白重做 */
  const done=logged!==undefined&&S.paper.echo===id;
  const pick=done?logged:null;
  const note=(logged!==undefined&&!done)
    ? `<div class="pnote"><span>这题本轮已作答（${pickTxt(q,logged)}）。这次请<b>不看上次的痕迹重做一遍</b>，选完点「提交本题」。</span>
        <span style="flex:1"></span><button class="btn sm" id="ppeek">看上次的答案与解析</button></div>`
    : '';
  st.innerHTML=`<div class="card">
    <div class="meta"><span class="mt"><b>第 ${q.no} 题</b> ／ 共 ${t.n} 题 ／ ${esc(q.unit||'未分单元')}${pBadges(id)}</span>
      <span class="mr"><span class="pno">${S.paper.qi+1} / ${S.paper.queue.length}</span></span></div>
    <div class="pstem">${paperBody(q)}</div>
    ${note}
    <div class="opts" id="opts">${q.opts.map((o,i)=>
      `<button data-i="${i}"${done?' disabled':''} class="${done?(i===q.ans?'c':(i===pick?'w':'')):''}"><span class="kk">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>
    <div id="fb">${done?paperVerdict(q,pick):''}</div>
    ${done?whyHTML(q):''}
    <div class="acts" id="acts">${done?paperActs(q,pick):`<span class="hint">点选项或按 1–4；答完立刻给解析，错题进「错题本」，做对了也留着，等你自己勾「我会了」。</span>`}</div>
  </div>`;
  const btns=$$('#opts button',st);
  if(!done)btns.forEach(b=>b.onclick=()=>answerPaper(+b.dataset.i));
  else bindPaperActs(st,q);
  const peek=$('#ppeek',st);
  if(peek)peek.onclick=()=>{S.paper.echo=id;render();};
  renderNav(st);
}
function paperVerdict(q,pick){
  const L='ABCD';
  const p=pState(q.id);
  const left=(p&&p.wrong>0&&!p.cleared)
    ? `<div class="hint" style="margin-top:6px">这题累计错过 ${p.wrong} 次，<b>仍然留在错题本</b>：过几天再回炉一遍；确认真会了再去「错题本」点「我会了」清掉。</div>`
    : '';
  if(pick===q.ans)return `<div class="verdict ok"><b>答对了 ✓</b> 正确答案 ${L[q.ans]}。${left}</div>`;
  return `<div class="verdict bad"><b>答错了</b> 你选的是 ${L[pick]}，正确答案是 <b>${L[q.ans]}</b>。看完下面的解析再往下走。${left}</div>`;
}
function paperActs(q,pick){
  const more=S.paper.qi<S.paper.queue.length-1;
  return `<button class="btn p" id="pnx">${more?'下一题（回车）':'本轮完成（回车）'}</button>`+
    `<button class="btn" id="pagain2" title="清空本题的作答，再独立做一遍（记录只累加，不覆盖累计错次）">重做本题</button>`+
    (pick===q.ans?'':`<button class="btn sm" id="pgo" title="去⑤清单看这一单元的考点卡">看本单元考点</button>`)+
    `<span class="hint">${S.paper.qi+1} / ${S.paper.queue.length}</span>`;
}
function bindPaperActs(st,q){
  const nx=$('#pnx',st);
  if(nx)nx.onclick=()=>paperNext();
  const ag=$('#pagain2',st);
  if(ag)ag.onclick=()=>{S.paper.echo=null;render();scrollTop();};
  const go=$('#pgo',st);
  if(go)go.onclick=()=>{S.mode='list';LISTQ=q.unit||'';buildQueue();render();scrollTop();};
}
function answerPaper(i){
  const id=S.paper.queue[S.paper.qi];
  if(S.paper.echo===id)return;          /* 正在显示这一题的判分，别重复记 */
  const q=PQ_BY(id);
  S.paper.log[id]=i;
  S.paper.echo=id;                      /* 提交后这一次才回显判分与解析 */
  recPaper(q,i===q.ans,i);
  render();
}
function paperNext(){
  const st=$('#stage');
  if(S.paper.qi<S.paper.queue.length-1){
    S.paper.qi++;S.paper.echo=null;render();scrollTop();return;
  }
  S.paper.echo=null;
  st.innerHTML=paperSummary();
  $$('[data-jump]',st).forEach(b=>b.onclick=()=>{
    const id=b.dataset.jump;
    S.paper.qi=S.paper.queue.indexOf(id);
    S.paper.echo=null;
    render();scrollTop();
  });
  const again=$('#pagain',st);
  if(again)again.onclick=()=>{S.paper.log={};S.paper.echo=null;S.paper.qi=0;render();scrollTop();};
  const next=$('#pnext',st);
  if(next)next.onclick=()=>{S.paper.range='round';buildPaper();render();scrollTop();};
  const weak=$('#pweak',st);
  if(weak&&!weak.disabled)weak.onclick=()=>{S.paper.range='weak';buildPaper();render();scrollTop();};
  scrollTop();
}
function paperSummary(){
  const ids=S.paper.queue;
  let right=0;const wrong=[];
  ids.forEach(id=>{const p=pickOf(id);if(p===undefined)return;
    const q=PQ_BY(id);if(p===q.ans)right++;else wrong.push(q);});
  const tot=ids.length,rate=tot?Math.round(right/tot*100):0;
  const t=pTally();
  return `<div class="card">
    <div class="meta"><span class="mt">本轮走完了</span><span class="mr">${tot} 题</span></div>
    <div class="scoreline">对 <b>${right}</b> 题 · 错 <b>${wrong.length}</b> 题 · 正确率 <b>${rate}%</b></div>
    ${wrong.length?`<div class="hint" style="margin-top:6px">做错的题（点题号回到那一题看解析）：</div>
      <div class="jump">${wrong.map(q=>`<button data-jump="${esc(q.id)}">第 ${q.no} 题</button>`).join('')}</div>`
      :'<div class="verdict ok" style="margin-top:10px"><b>全对 ✓</b> 这一轮没有错题。</div>'}    <div class="acts">
      <button class="btn p" id="pagain">重做这一轮</button>
      <button class="btn" id="pnext">换一批（随机 20 题）</button>
      <button class="btn" id="pweak"${t.weak?'':' disabled'}>只做错题（${t.weak}）</button>
    </div>
    <div class="hint">全卷进度：已做 ${t.seen}/${t.n} 题，累计正确率 ${t.rate}%。错题做对了也不会自动消失，确认真会了再去「错题本」勾「我会了」。</div>
  </div>`;
}
function pickOf(id){
  const l=S.paper.log;
  return l[id];
}

/* ================================================================
   深链（给「开始.html」的任务卡直达用）
   契约：#mode=recite|cloze|choice|wrong|list|paper  #fs=all|star|weak|unseen
        可组合，如 #mode=choice&fs=star；非法值静默忽略，回到默认。
   只在启动时读一次；运行中切模式不回写 hash（免得一条条写进浏览器历史）。
   ================================================================ */
function readDeepLink(){
  let raw='';
  try{raw=String(location.hash||'').replace(/^#/,'');}catch(e){return null;}
  if(!raw)return null;
  const q={};
  raw.split('&').forEach(seg=>{
    const i=seg.indexOf('=');
    if(i<0)return;
    let k='',v='';
    try{k=decodeURIComponent(seg.slice(0,i)).trim().toLowerCase();v=decodeURIComponent(seg.slice(i+1)).trim().toLowerCase();}catch(e){return;}
    if(k==='mode'||k==='fs')q[k]=v;
  });
  let mode=SESS_MODES.indexOf(q.mode)>=0?q.mode:'';
  /* ⑥ 套卷没有卷子数据就别切过去（道法、公式版都没有） */
  if(mode==='paper'&&(!PAPER||!PQ.length))mode='';
  const scope=SCOPES.indexOf(q.fs)>=0?q.fs:'';
  if(!mode&&!scope)return null;
  return {mode:mode,scope:scope};
}
function applyDeepLink(d){
  if(d.mode)S.mode=d.mode;
  if(d.scope)S.scope=d.scope;
  /* 停在第一题：队列随后由 buildQueue() 按新 mode/scope 重建 */
  S.qi=0;S.revealed=false;S.scored=false;S.cur=null;S.curPlan=null;S.choice=null;S.optDone=false;
  if(S.mode==='paper')buildPaper();
  return d;
}

/* ================================================================
   续练：启动时恢复上次位置 + 顶部提示条
   ================================================================ */
let RESUME=null;
let BOOTING=false;
const clampQi=(q,n)=>Math.max(0,Math.min(n-1,Number.isFinite(+q)?+q:0));
function applySess(o){
  if(!o||o.v!==1||SESS_MODES.indexOf(o.mode)<0)return false;
  const mode=o.mode;
  const unit=(o.unit==='全部'||UNITS.indexOf(o.unit)>=0)?o.unit:'全部';
  const scope=SCOPES.indexOf(o.scope)>=0?o.scope:'all';
  /* ⑥ 套卷：队列+本轮作答记录都恢复，做了一半的卷子接着做 */
  if(mode==='paper'){
    if(!PAPER||!o.paper)return false;
    const ids=(o.paper.queue||[]).filter(id=>PQ_BY(id));
    if(!ids.length)return false;
    S.mode='paper';
    S.paper.unit=(o.paper.unit==='全部'||PUNITS.indexOf(o.paper.unit)>=0)?o.paper.unit:'全部';
    S.paper.range=['seq','round','weak','unseen'].indexOf(o.paper.range)>=0?o.paper.range:'seq';
    S.paper.queue=ids;
    S.paper.qi=clampQi(o.paper.qi,ids.length);
    S.paper.log=(o.paper.log&&typeof o.paper.log==='object')?o.paper.log:{};
    S.paper.echo=null;   /* 回访一律空白，要重做就重新选 */
    RESUME={mode,pos:S.paper.qi+1,total:ids.length,ts:+o.ts||0,unit:S.paper.unit,scope:''};
    return true;
  }
  /* ⑤ 清单没有"第几题"，只恢复筛选，不弹续练条 */
  if(mode==='list'){
    S.mode='list';S.unit=unit;S.scope=scope;
    return true;
  }
  let ids=(o.queue||[]).filter(id=>CARD_BY(id));
  if(mode==='cloze'||mode==='choice')ids=ids.filter(id=>hasBlanks(CARD_BY(id)));
  if(!ids.length)return false;
  S.mode=mode;S.unit=unit;S.scope=scope;
  S.queue=ids;S.qi=clampQi(o.qi,ids.length);
  S.revealed=(mode==='recite')?!!o.revealed:false;
  S.scored=false;S.choice=null;S.cur=null;
  /* 只有确实"练到一半"才提示；刚打开、默认第 1 题不打扰 */
  if(S.qi>0||mode!=='recite'||unit!=='全部'||scope!=='all'){
    RESUME={mode,pos:S.qi+1,total:ids.length,ts:+o.ts||0,unit,scope};
  }
  return true;
}
function fmtWhen(ts){
  if(!ts)return '';
  const d=new Date(ts),now=new Date();
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const day0=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  if(day0(d)===day0(now))return '今天 '+hm;
  if(day0(now)-day0(d)===86400000)return '昨天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function hideResume(){
  RESUME=null;
  const el=$('#resume');
  if(el){el.hidden=true;el.innerHTML='';}
}
function showResumeBar(){
  const el=$('#resume');
  if(!el||!RESUME)return;
  const r=RESUME;
  const what=r.mode==='paper'
    ? `⑥ 套卷${r.unit&&r.unit!=='全部'?' · '+esc(r.unit):''}`
    : `${MODE_TXT[r.mode]||r.mode}${r.scope&&r.scope!=='all'?' · '+esc(SCOPE_TXT[r.scope]||''):''}${r.unit&&r.unit!=='全部'?' · '+esc(r.unit):''}`;
  el.innerHTML=`<span class="rtext">上次练到：<b>${what}</b> · 第 <b>${r.pos}/${r.total}</b> 题`+
    `${r.ts?` <span class="muted">（${esc(fmtWhen(r.ts))}）</span>`:''}</span>`+
    `<span class="sp"></span>`+
    `<span class="rbtns"><button id="rgo" class="p" title="留在上次的位置">接着练</button>`+
    `<button id="rnew" title="从这一轮第 1 题重新开始">从头开始</button></span>`;
  el.hidden=false;
  $('#rgo',el).onclick=hideResume;
  $('#rnew',el).onclick=()=>{
    hideResume();
    if(S.mode==='paper'){S.paper.qi=0;S.paper.log={};}
    else{S.qi=0;S.revealed=false;S.scored=false;S.choice=null;}
    render();scrollTop();
  };
}

/* ================================================================
   启动
   ================================================================ */
function boot(){
  if(!DATA||!DATA.cards||!DATA.cards.length){
    $('#stage').innerHTML='<div class="card empty"><span class="big">⚠</span>没有读到考点数据。<br>请确认这个文件没有被改动过。</div>';
    return;
  }
  document.documentElement.dataset.subj=DATA.subject||'';
  document.title=DATA.title||'核心考点训练';
  $('#ttl').textContent=DATA.title||'核心考点训练';
  $('#sb').textContent=PAPER
    ? `共 ${DATA.cards.length} 个考点 · 套卷 ${PQ.length} 题 · 记录存在本机浏览器`
    : `共 ${DATA.cards.length} 个考点 · 记录存在本机浏览器`;
  if(PAPER&&PQ.length){
    const tp=$('#tabPaper');
    if(tp){tp.hidden=false;tp.textContent='⑥ 套卷';}
  }
  $$('#tabs button').forEach(b=>b.onclick=()=>{
    if(b.dataset.mode===S.mode)return;
    hideResume();
    S.mode=b.dataset.mode;S.qi=0;S.revealed=false;S.scored=false;S.cur=null;S.choice=null;
    if(S.mode==='paper')buildPaper();
    buildQueue();render();scrollTop();
  });
  /* 上次练到一半就接着上次；否则正常开新一轮
     带深链过来（任务卡直达）时不恢复上次位置，直接按 hash 指定的模式/范围开 */
  const deep=readDeepLink();
  BOOTING=true;
  const restored=deep?false:applySess(loadSess());
  if(deep)applyDeepLink(deep);
  if(!restored)buildQueue();
  render();
  BOOTING=false;
  if(RESUME)showResumeBar();
  window.addEventListener('pagehide',saveSess);
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea'))return;
    if(S.mode==='paper'){
      const id=S.paper.queue[S.paper.qi];
      if(!id)return;
      const answered=S.paper.log.hasOwnProperty(id);
      if(!answered&&'1234'.includes(e.key)){e.preventDefault();answerPaper(+e.key-1);}
      else if(answered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();paperNext();}
      else if(e.key==='ArrowLeft'&&S.paper.qi>0){e.preventDefault();S.paper.qi--;render();scrollTop();}
      return;
    }
    if(S.mode==='recite'){
      if(!S.revealed&&(e.key===' '||e.code==='Space')){e.preventDefault();S.revealed=true;render();}
      else if(S.revealed){
        const map={'1':'1','2':'0.5','3':'0'};
        if(map[e.key]){e.preventDefault();const f=$(`#acts button[data-v="${map[e.key]}"]`);if(f)f.click();}
      }
    }else if(S.mode==='cloze'&&e.key==='Enter'){
      const s=$('#sub'),n=$('#nx2');if(s)s.click();else if(n)n.click();
    }else if(S.mode==='choice'&&e.key==='Enter'){
      const n=$('#nx3');if(n)n.click();
    }
  });
}
boot();
</script>
</body>
