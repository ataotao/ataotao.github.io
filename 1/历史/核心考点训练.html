<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>核心考点训练</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf8; --ink:#22201d; --sub:#6b6560; --line:#e2ddd2;
  --acc:#1f6f8b; --acc-soft:#e3eff4; --ok:#1f7a4d; --ok-soft:#e2f3e9;
  --bad:#b3352c; --bad-soft:#fbe7e4; --warn:#b06a11; --warn-soft:#fdf0dc;
  --r:14px; --sh:0 2px 10px rgba(40,35,30,.07);
}
html[data-subj="历史"]{ --acc:#9a5b18; --acc-soft:#f6ecdd; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.75 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button,select,input{font-family:inherit}
/* hidden 属性统一用 display:none 收口：下面 .resume{display:flex} 会把 [hidden] 覆盖掉，
   历史首页因此一直挂着一条空白「继续上次」横条 */
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 90px}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:860px;margin:0 auto;padding:10px 14px 0}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{font-size:17px;letter-spacing:.3px}
.brand span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);
  padding:7px 13px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s;
}
.tabs button:hover{border-color:var(--acc);color:var(--acc)}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

/* ---------- 统计条 ---------- */
.bar{display:flex;flex-direction:column;gap:7px;margin:12px 0 4px;font-size:13px;color:var(--sub)}
.bar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill b{color:var(--ink);font-size:14px}
.pill.ok b{color:var(--ok)} .pill.bad b{color:var(--bad)}
.bar select{font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);max-width:190px}
.bar select#fs{max-width:118px}
.bar .sp{flex:1}
.linkbtn{background:none;border:0;color:var(--acc);font-size:13px;cursor:pointer;padding:4px 2px;text-decoration:underline dotted}
.prog{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 0}
.prog>i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}

/* ---------- 续练提示（退出/刷新后回到上次位置） ---------- */
.resume{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0;padding:8px 12px;
  border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;
  background:var(--acc-soft);font-size:13px;line-height:1.6;color:#1c4a5c}
.resume b{color:var(--acc);font-weight:700}
.resume .sp{flex:1}
.resume .muted{color:var(--sub);font-size:12px}
.resume .rbtns{display:flex;gap:6px;flex-wrap:wrap}
.resume button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 11px;font-size:12.5px;color:var(--acc);cursor:pointer}
.resume button:hover{border-color:var(--acc)}
.resume button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
/* 套卷：重做提示条 + 错题本 */
.pnote{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0;padding:8px 12px;
  border-left:3px solid var(--acc);background:var(--acc-soft);border-radius:0 9px 9px 0;font-size:13px;color:#6b4a1c}
.pnote b{color:#5a3c12}
.pnote button{flex:0 0 auto}
.wbrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line)}
.wbrow:last-child{border-bottom:0}
.wbm{min-width:0;flex:1 1 240px}
.wbline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.wbbtns{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 18px 16px;margin-top:14px}
.meta{display:flex;align-items:baseline;gap:10px;font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:10px;word-break:break-word}
.meta .mt{flex:1 1 auto;min-width:0}
.meta .mr{flex:0 0 auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.meta .u{color:var(--acc);font-weight:600}
/* 这张卡累计对/错次数（答对不清零，方便看"同一处反复错"） */
.meta .statx{display:inline-block;margin-left:8px;padding:0 7px;border:1px solid var(--line);
  border-radius:99px;font-size:11px;color:var(--sub);background:#fff;white-space:nowrap}
.meta .statx b{font-weight:700;color:var(--ink)}
.meta .statx b.ok{color:var(--ok)}
.meta .statx b.bad{color:var(--bad)}
/* ④ 错题强化里附带的「试卷错题」清单 */
.pwrong{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.pwrong:last-of-type{border-bottom:0}
.pwrong .wq{font-weight:700}
.pwrong .wunit{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.pwrong .wcnt{color:var(--bad);font-size:12px;font-weight:600}
.pwrong .sp{flex:1}
details.k>summary .cnt{flex:0 0 auto;font-size:11px;color:var(--sub);white-space:nowrap;padding-top:2px}
details.k>summary .cnt b{font-weight:700;color:var(--bad)}
.meta .pg a{color:var(--sub);text-decoration:none;border-bottom:1px dotted var(--line)}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px;vertical-align:2px}
.q{font-size:19px;line-height:1.65;font-weight:600;margin:0 0 4px}
.q .tag{display:inline-block;font-size:12px;font-weight:500;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:1px 7px;margin-right:7px;vertical-align:2px}
.ans{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.ans .ln{margin:0 0 9px;line-height:1.95}
.ans .ln:last-child{margin-bottom:0}
.ans .lead{color:var(--sub);font-size:12px;margin:0 0 8px}
.kw{font-style:normal;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:0 3px;box-decoration-break:clone}
.hidekw .kw{color:transparent;background:#efece5;border-radius:4px;cursor:pointer;user-select:none}
.hidekw .kw:hover{color:var(--bad);background:var(--bad-soft)}
.warn{margin-top:8px;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:7px 12px;font-size:13.5px;color:#6d4a12;line-height:1.7}
.warn b{color:var(--warn);margin-right:5px;font-size:12px}
.warn.k-必背{background:var(--acc-soft);border-left-color:var(--acc);color:#1c4a5c}
.warn.k-必背 b{color:var(--acc)}
.warn.k-注意{background:#fdf6e3;border-left-color:#d9a520;color:#6b5312}
.warn.k-注意 b{color:#b8860b}
.warn.k-补充{background:#f3f1ec;border-left-color:#c6bfb2;color:var(--sub);font-size:12.5px}
.warn.k-补充 b{color:#9a9288}
table.tb{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;line-height:1.7}
table.tb th{background:var(--acc-soft);color:var(--acc);font-weight:600;font-size:13px}

/* ---------- 填空 ---------- */
.bi{
  font-size:15px;padding:0 6px;margin:0 2px;border:0;border-bottom:2px dashed var(--acc);
  background:transparent;border-radius:5px 5px 0 0;color:var(--ink);text-align:center;min-width:56px;
}
.bi::placeholder{color:#bdb7ac}
.bi:focus{outline:2px solid var(--acc);outline-offset:1px;background:#fff;border-bottom-style:solid}
.bi.ok{background:var(--ok-soft);border-bottom-style:solid}
.bi.bad{background:var(--bad-soft);border-bottom-style:solid;text-decoration:line-through}
.given{color:var(--ok);font-weight:700;white-space:nowrap}
.given::before{content:"→";font-weight:400;color:var(--sub);margin:0 1px}

/* ---------- 选项 ---------- */
.opts{display:grid;gap:9px;margin-top:14px}
.opts button{
  text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-size:16px;line-height:1.6;cursor:pointer;transition:.12s;color:var(--ink);
}
.opts button:hover{border-color:var(--acc);background:var(--acc-soft)}
.opts button:disabled{cursor:default;opacity:.9}
.opts button.c{background:var(--ok-soft);border-color:var(--ok);font-weight:700;color:var(--ok)}
.opts button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opts button .kk{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;background:var(--bg);font-size:12px;margin-right:9px;color:var(--sub)}

/* ---------- 底部操作 ---------- */
.acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.p:hover{filter:brightness(1.08);color:#fff}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.verdict{margin-top:14px;border-radius:10px;padding:11px 14px;font-size:15px;line-height:1.7}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bfe3cd}
.verdict.bad{background:var(--bad-soft);color:var(--bad);border:1px solid #f0c8c2}
.verdict b{font-size:16px}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--sub)}
.nav .btn{flex:0 0 auto}
.empty{text-align:center;color:var(--sub);padding:46px 10px;font-size:15px;line-height:2}
.empty .big{font-size:34px;display:block;margin-bottom:6px}

/* ---------- 清单 ---------- */
.unitbox{margin-top:16px}
.unitbox>h3{font-size:15px;margin:0 0 8px;padding:8px 12px;background:var(--acc-soft);color:var(--acc);border-radius:9px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.unitbox>h3 span{font-size:12px;font-weight:400;color:var(--sub)}
details.k{margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
details.k>summary{cursor:pointer;padding:11px 14px;font-size:15px;font-weight:600;line-height:1.6;list-style:none;display:flex;gap:8px;align-items:flex-start}
details.k>summary::-webkit-details-marker{display:none}
details.k>summary::before{content:"▸";color:var(--acc);flex:0 0 auto;transition:.15s}
details.k[open]>summary::before{transform:rotate(90deg)}
details.k>summary:hover{background:var(--acc-soft)}
details.k .bd{padding:0 14px 14px}
.lv{flex:0 0 auto;font-size:11px;font-weight:500;border-radius:6px;padding:1px 7px;margin-top:4px}
.lv0{background:#eee;color:#8b8b8b}.lv1{background:var(--warn-soft);color:var(--warn)}
.lv2{background:var(--acc-soft);color:var(--acc)}.lv3{background:var(--ok-soft);color:var(--ok)}
.lv4{background:var(--bad-soft);color:var(--bad)}
.searchbox{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;margin-top:12px}
.report{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:16px}
.report h3{margin:0 0 8px;font-size:15px}
.report ul{margin:0;padding-left:20px;font-size:14px;line-height:1.9}
.report li b{color:var(--bad)}
.ubars{margin:8px 0 0}
.ubar{display:flex;align-items:center;gap:9px;font-size:13px;margin:5px 0;color:var(--sub)}
.ubar .nm{flex:0 0 246px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubar .tr{flex:1;height:7px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.ubar .tr i{display:block;height:100%;background:var(--ok);width:0}
.ubar .pc{flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}

/* ---------- 套卷（⑥） ---------- */
.pstem{font-size:17px;line-height:1.8;font-weight:600;margin:0 0 10px}
.pstem p{margin:0 0 8px}
.pstem p:last-child{margin-bottom:0}
.figs{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 12px}
.figs figure{margin:0;flex:1 1 200px;min-width:120px;max-width:100%}
.figs img{width:100%;height:auto;border:1px solid var(--line);border-radius:9px;background:#fff;display:block}
.ptbl{width:100%;border-collapse:collapse;margin:4px 0 12px;font-size:14px;table-layout:auto}
.ptbl td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;line-height:1.75}
.ptbl td.cap{background:var(--acc-soft);color:var(--acc);font-weight:600;border-color:var(--acc-soft)}
.ptbl td img{max-width:100%;height:auto;border-radius:7px;display:block;margin:0 0 6px}
.ptbl .tx{white-space:pre-line;display:block}
.whybox{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
.whybox .lead{color:var(--sub);font-size:12px;margin:0 0 8px}
.whyrow{display:flex;gap:9px;font-size:14.5px;line-height:1.85;margin:0 0 8px;color:var(--sub)}
.whyrow .k{flex:0 0 auto;width:21px;height:21px;line-height:21px;text-align:center;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--sub);margin-top:3px}
.whyrow.right{color:var(--ink)}
.whyrow.right .k{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.whyrow.right .tx{font-weight:600}
.whysol{font-size:14.5px;line-height:1.9;white-space:pre-line}
.pno{font-variant-numeric:tabular-nums}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.jump button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--bad)}
.jump button:hover{border-color:var(--acc);color:var(--acc)}
.optrow{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:15.5px;line-height:1.65;margin:0 0 8px;background:#fff}
.optrow .kk{flex:0 0 auto;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;background:var(--bg);font-size:12px;color:var(--sub);margin-top:2px}
.optrow.c{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.optrow.c .kk{background:var(--ok);color:#fff}
.scoreline{font-size:15px;line-height:2}
.scoreline b{font-size:22px;color:var(--acc);margin:0 3px}

@media (max-width:520px){
  /* 手机端整体小一档：正文 16→15px、题干 19→16.5px、行高 1.75→1.68，
     顶栏/统计条/卡片一起收紧，一屏大约能多显示 15%–20% 的内容 */
  body{font-size:15px;line-height:1.68}
  .wrap{padding:0 12px 72px}
  .hd{padding:8px 12px 0}
  .brand b{font-size:14.5px}
  .brand span{font-size:11.5px}
  .tabs{gap:5px;padding:6px 0 7px}
  /* 六个标签尽量一屏放下，手机上不用横向滚才发现 ⑥ */
  .tabs button{padding:5px 9px;font-size:12.5px}
  .bar{font-size:12px;gap:6px;margin:9px 0 2px}
  .bar .row{gap:5px}
  .pill{padding:2px 8px}
  .pill b{font-size:13px}
  .bar select{font-size:12.5px;padding:3px 7px;max-width:108px}
  .bar select#fs{max-width:84px}
  .linkbtn{font-size:12px;padding:3px 2px}
  .prog{margin:6px 0 0}
  .resume{margin-top:9px;padding:7px 10px;font-size:12.5px;gap:6px;border-radius:0 9px 9px 0}
  .resume .sp{display:none}
  .resume .rtext{flex:1 1 100%}
  .resume .muted{font-size:11.5px}
  .resume button{font-size:12px;padding:3px 8px}
  .card{padding:13px 12px 12px;margin-top:10px}
  .meta{font-size:11.5px;margin-bottom:8px}
  .q{font-size:16.5px;line-height:1.55}
  .q .tag{font-size:11px}
  .ans{margin-top:11px;padding-top:10px}
  .ans .ln{line-height:1.8}
  .ans .lead{font-size:11.5px}
  .warn{font-size:12.5px;line-height:1.6;padding:6px 10px}
  table.tb{font-size:12.5px}
  table.tb th{font-size:12px}
  .bi{font-size:14px}
  .opts{gap:7px;margin-top:11px}
  .opts button{padding:9px 12px;font-size:14.5px}
  .acts{gap:7px;margin-top:12px}
  .btn{padding:8px 15px;font-size:14px}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .verdict{font-size:14px;padding:9px 12px}
  .nav{font-size:12px;margin-top:11px}
  .pstem{font-size:15px;line-height:1.7}
  .ptbl{font-size:12.5px}
  .ptbl td{padding:5px 7px}
  .optrow{font-size:14px;padding:8px 11px}
  .whyrow{font-size:13.2px;line-height:1.75}
  .whysol{font-size:13.2px;line-height:1.8}
  .scoreline{font-size:14px}
  .scoreline b{font-size:20px}
  .unitbox>h3{font-size:14px}
  details.k>summary{font-size:14px;padding:9px 12px}
  .searchbox{font-size:14px;padding:8px 12px}
  .ubar .nm{flex-basis:140px}
  .report ul{font-size:13px}
}
@media print{
  header,.tabs,.bar,.acts,.nav,.searchbox,.no-print{display:none!important}
  body{background:#fff}
  .card,details.k,.unitbox{box-shadow:none;break-inside:avoid}
  details.k .bd{display:block!important}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><b id="ttl">核心考点训练</b><span id="sb"></span></div>
    <div class="tabs" id="tabs">
      <button data-mode="recite" aria-selected="true">① 翻卡背</button>
      <button data-mode="cloze">② 填空闯</button>
      <button data-mode="choice">③ 四选一</button>
      <button data-mode="wrong">④ 错题强化</button>
      <button data-mode="list">⑤ 清单</button>
      <button data-mode="paper" id="tabPaper" hidden>⑥ 套卷</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="bar" id="bar"></div>
  <div class="prog" id="prog" hidden><i></i></div>
  <div class="resume" id="resume" hidden></div>
  <main id="stage"></main>
</div>

<script>
/* ================================================================
   数据（构建时由 考点数据.json 注入）
   ================================================================ */

生","no":"8","q":"原始社会解体、人类进入奴隶社会的标志是什么？","a":["【阶级的产生】和【国家的出现】，标志着原始社会解体，人类进入奴隶社会。"],"star":2},{"id":"ls-p1-10","page":1,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第2课 古代两河流域","node":"知识点1 两河流域文明概况","no":"1","q":"两河流域文明的地理范围在哪里？","a":["【幼发拉底河】与【底格里斯河】流域，又称“【美索不达米亚】”（意为“两河之间的土地”）。"],"star":1},{"id":"ls-p1-11","page":1,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第2课 古代两河流域","node":"知识点1 两河流域文明概况","no":"2","q":"两河流域文明大约产生于什么时候？","a":["约【公元前3500年】。"],"star":1},{"id":"ls-p1-12","page":1,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第2课 古代两河流域","node":"知识点1 两河流域文明概况","no":"3","q":"苏美尔人的贡献有哪些？","a":["①发明【楔形文字】；②制定【阴历】；③实行【7天一星期制度】；④发明【60进制】。"],"star":2},{"id":"ls-p1-13","page":1,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第2课 古代两河流域","node":"知识点2 古巴比伦王国","no":"4","q":"古巴比伦王国是怎样实现统一的？（汉谟拉比的统一）","a":["【公元前18世纪】，【汉谟拉比】统一两河流域，建立强大的【中央集权奴隶制国家】，实行【君主专制】。"],"star":1},{"id":"ls-p1-14","page":1,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第2课 古代两河流域","node":"知识点3 《汉谟拉比法典》","no":"5","q":"《汉谟拉比法典》的地位是什么？","a":["迄今已知世界上【第一部较为完整的成文法典】。"],"star":2},{"id":"ls-p1-15","page":1,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第2课 古代两河流域","node":"知识点3 《汉谟拉比法典》","no":"6","q":"《汉谟拉比法典》的内容是什么？","a":["社会分为三个等级：【自由民】、【半自由民】、【奴隶】；【商品经济】活跃。"],"star":1},{"id":"ls-p1-16","page":1,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第2课 古代两河流域","node":"知识点3 《汉谟拉比法典》","no":"7","q":"《汉谟拉比法典》的实质是什么？","a":["严格保护【奴隶主阶级】的利益，是维护【奴隶统治】的工具。"],"star":2},{"id":"ls-p1-16b","page":1,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第2课 古代两河流域","node":"本课必背一句话","q":"第2课 古代两河流域的「本课必背一句话」是什么？","a":["《汉谟拉比法典》是世界上第一部较为完整的成文法典，其实质是维护奴隶主阶级的利益"],"star":2},{"id":"ls-p1-17","page":1,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第2课 古代两河流域","node":"知识点3 《汉谟拉比法典》","no":"8","q":"《汉谟拉比法典》的意义是什么？","a":["表明人类社会的【法制传统】源远流长。"],"star":1},{"id":"ls-p2-01","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第3课 古代埃及","node":"知识点1 古埃及文明的发展历程","no":"1","q":"古埃及文明的发源地在哪里？","a":["【非洲东北角尼罗河流域】（“埃及是尼罗河的赠礼”）。"],"star":1},{"id":"ls-p2-02","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第3课 古代埃及","node":"知识点1 古埃及文明的发展历程","no":"2","q":"古埃及何时实现统一？","a":["【公元前3100年】左右。"],"star":1},{"id":"ls-p2-03","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第3课 古代埃及","node":"知识点1 古埃及文明的发展历程","no":"3","q":"古埃及的强盛与灭亡过程是怎样的？","a":["【新王国时代图特摩斯三世】统治时期，成为横跨非、亚两洲的大帝国；【公元前525年】被【波斯帝国】吞并。"],"star":1},{"id":"ls-p2-04","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第3课 古代埃及","node":"知识点2 古埃及文明成就","no":"4","q":"古埃及的太阳历有什么地位？","a":["今天世界通用的【公历】的渊源。"],"star":1},{"id":"ls-p2-05","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第3课 古代埃及","node":"知识点2 古埃及文明成就","no":"5","q":"古埃及人创造的象形文字是什么？","a":["【象形文字】：古埃及人创造的文字体系。"],"star":1},{"id":"ls-p2-06","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第3课 古代埃及","node":"知识点2 古埃及文明成就","no":"6","q":"金字塔的地位是什么？（为什么说金字塔是古埃及文明的象征）","a":["①古埃及文明的【象征】；②反映了古埃及【社会经济发展的较高水平】和法老的【专制权力】；③是古埃及人民【智慧】的结晶。"],"star":2},{"id":"ls-p2-07","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第3课 古代埃及","node":"知识点3 法老的统治","no":"7","q":"法老拥有怎样的权力？","a":["集【军、政、财、神】等大权于一身，具有【至高无上的权威】。"],"star":2},{"id":"ls-p2-07b","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第3课 古代埃及","node":"本课必背一句话","q":"第3课 古代埃及的「本课必背一句话」是什么？","a":["古埃及文明是尼罗河的赠礼，金字塔是其文明的象征，反映了法老的专制权力"],"star":2},{"id":"ls-p2-08","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"知识点1 古印度文明概况","no":"1","q":"古印度文明的发源地在哪里？","a":["【南亚印度河流域】。"],"star":1},{"id":"ls-p2-09","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"知识点1 古印度文明概况","no":"2","q":"古印度文明的鼎盛时期是什么？","a":["【孔雀王朝】。"],"star":1},{"id":"ls-p2-10","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"知识点2 种姓制度","no":"3","q":"古印度种姓制度的四个等级分别是什么？","a":["【婆罗门】（祭司）、【刹帝利】（国王/武士）、【吠舍】（平民）、【首陀罗】（奴隶）。此外还有“【贱民】”。"],"star":2},{"id":"ls-p2-11","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"知识点2 种姓制度","no":"4","q":"种姓制度的特点是什么？","a":["各等级【世代相袭】、【贵贱分明】、不同等级之间【禁止通婚】。"],"star":2},{"id":"ls-p2-12","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"知识点2 种姓制度","no":"5","q":"种姓制度的实质是什么？","a":["维护【奴隶主贵族统治】的工具，是【社会不平等】的根源。"],"star":2},{"id":"ls-p2-12b","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"本课必背一句话","q":"第4课 古代印度的「本课必背一句话」是什么？","a":["种姓制度是古印度严格的等级制度，其实质是维护奴隶主贵族统治的工具"],"star":2},{"id":"ls-p2-13","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"知识点3 佛教","no":"6","q":"佛教创立的时间、创始人及所属等级是什么？","a":["【公元前6世纪】，创始人【乔达摩·悉达多】（释迦牟尼），属于【刹帝利】等级。"],"star":1},{"id":"ls-p2-14","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"知识点3 佛教","no":"7","q":"佛教的核心教义是什么？","a":["“【众生平等】”、【忍耐顺从】。"],"star":2},{"id":"ls-p2-15","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"知识点3 佛教","no":"8","q":"佛教是怎样传播的？","a":["【公元前3世纪】开始向外传播；【公元前后】传入中国。"],"star":1},{"id":"ls-p2-15b","page":2,"unit":"第一单元 文明的产生与古代亚非文明","lesson":"第4课 古代印度","node":"本课必背一句话","q":"第4课 古代印度的「本课必背一句话」是什么？","a":["佛教的“众生平等”主张对种姓制度形成了一定冲击"],"star":2},{"id":"ls-p2-16","page":2,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点1 古希腊文明概况","no":"1","q":"古希腊文明的地位是什么？","a":["【欧洲文明的发祥地】。"],"star":1},{"id":"ls-p2-17","page":2,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点1 古希腊文明概况","no":"2","q":"古希腊的地理环境有什么特点？","a":["【环海】、【多山】、【多岛屿】，适宜【航海和海外贸易】（【海洋文明】）。"],"star":1},{"id":"ls-p2-18","page":2,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点1 古希腊文明概况","no":"3","q":"古希腊的发展历程是怎样的？","a":["【爱琴文明】 → 【荷马时代】 → 【城邦时代】（【公元前8世纪】开始）。"],"star":1},{"id":"ls-p3-01","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点2 希腊城邦与雅典民主","no":"4","q":"希腊城邦的特点和著名城邦是什么？","a":["城邦特点：【小国寡民】。著名城邦：【雅典】和【斯巴达】。"],"star":1},{"id":"ls-p3-02","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点2 希腊城邦与雅典民主","no":"5","q":"雅典民主政治的高峰出现在什么时候？公民大会的地位如何？","a":["【公元前5世纪中后期】，【伯里克利】主政。【成年男性公民】可参加【公民大会】（最高权力机构），建立【津贴制度】。"],"star":1},{"id":"ls-p3-03","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点2 希腊城邦与雅典民主","no":"6","q":"如何评价雅典民主政治？（积极影响与局限）","a":["①积极：促进【雅典繁荣】，是【现代民主政治的源头】；②局限：【外邦人、奴隶、妇女无权】，属于【奴隶主阶级的民主】。"],"star":2,"warn":"易混易错：雅典民主是“成年男性公民”的民主，不是全民民主；注意区分：古希腊是“民主政治”，古罗马是“完备法律”"},{"id":"ls-p3-04","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点3 亚历山大东征","no":"7","q":"亚历山大东征的影响是什么？（如何评价）","a":["①消极：具有【侵略性质】，给东方人民带来【深重灾难】；②积极：促进了【东西方文化的大交汇】。"],"star":2},{"id":"ls-p3-05","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点4 古希腊文化","no":"8","q":"古希腊文学的代表作品是什么？","a":["《【荷马史诗】》（了解【早期希腊社会】的主要文献）。"],"star":1},{"id":"ls-p3-06","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点4 古希腊文化","no":"9","q":"古希腊雕塑的代表作品有哪些？","a":["【奥林匹亚神庙中的宙斯像】、《【掷铁饼者】》。"],"star":1},{"id":"ls-p3-07","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点4 古希腊文化","no":"10","q":"古希腊建筑的代表是什么？","a":["【雅典帕特农神庙】。"],"star":1},{"id":"ls-p3-08","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"知识点4 古希腊文化","no":"11","q":"古希腊哲学的代表人物及其主张、成就是什么？","a":["【苏格拉底】（主张“【认识你自己】”）、【亚里士多德】（【百科全书式】的学者，创立【逻辑学】）。"],"star":1,"warn":"古希腊文化在哲学、文学、建筑等方面成就辉煌"},{"id":"ls-p3-08b","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第5课 古代希腊","node":"本课必背一句话","q":"第5课 古代希腊的「本课必背一句话」是什么？","a":["雅典民主政治是西方民主的源头，但实质是奴隶主阶级的民主"],"star":2},{"id":"ls-p3-09","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点1 罗马共和国","no":"1","q":"罗马共和国建立于何时？","a":["【公元前509年】建立罗马共和国。"],"star":1},{"id":"ls-p3-10","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点1 罗马共和国","no":"2","q":"罗马共和国的统治机构有哪些？","a":["【元老院】（掌握国家实际权力）、【执政官】、【公民大会】。"],"star":1},{"id":"ls-p3-11","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点2 罗马帝国","no":"3","q":"罗马帝国是怎样建立的？","a":["【公元前27年】，【屋大维】首创“【元首制】”，罗马共和国演变为【罗马帝国】。"],"star":1},{"id":"ls-p3-12","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点2 罗马帝国","no":"4","q":"罗马帝国的鼎盛情况如何？","a":["【2世纪】，地跨【欧亚非三洲】，【地中海】成为罗马帝国的“【内湖】”。"],"star":1},{"id":"ls-p3-13","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点2 罗马帝国","no":"5","q":"罗马帝国是怎样衰亡的？（西罗马帝国灭亡的标志意义）","a":["【395年】分裂；【476年】【西罗马帝国】灭亡，标志着【西欧奴隶社会】的结束，进入【封建社会】。"],"star":1},{"id":"ls-p3-14","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点3 古罗马文化","no":"6","q":"古罗马的历法成就是什么？","a":["【凯撒】命人编制“【儒略历】”（今天【公历】的基础）。"],"star":1},{"id":"ls-p3-15","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点3 古罗马文化","no":"7","q":"古罗马建筑的代表有哪些？","a":["【大竞技场】、【引水道工程】、【凯旋门】、【万神庙】。"],"star":1},{"id":"ls-p3-16","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点3 古罗马文化","no":"8","q":"古罗马的法律成就及其地位是什么？","a":["【罗马法体系完备】，是后世【欧洲法学的渊源】。（《【十二铜表法】》是罗马法制建设的【第一步】。）"],"star":1},{"id":"ls-p3-17","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"知识点3 古罗马文化","no":"9","q":"古罗马的史学成就有哪些？","a":["【李维】：《【罗马史】》（记述罗马建城以来的历史）。","【塔西佗】：《【日耳曼尼亚志】》（记载了日耳曼人的早期情况）。"],"star":2,"warn":"古罗马的儒略历、罗马法以及文学史学成就对后世影响深远"},{"id":"ls-p3-17b","page":3,"unit":"第二单元 古代欧洲文明","lesson":"第6课 古代罗马","node":"本课必背一句话","q":"第6课 古代罗马的「本课必背一句话」是什么？","a":["屋大维建立罗马帝国，西罗马帝国的灭亡标志着西欧进入封建社会"],"star":2},{"id":"ls-p4-01","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点1 基督教的兴起","no":"1","q":"基督教创立的时间、地点和创始人是什么？","a":["【1世纪】，创立于【巴勒斯坦地区】，创始人是【耶稣】。"],"star":1},{"id":"ls-p4-02","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点1 基督教的兴起","no":"2","q":"基督教是怎样发展的？","a":["【4世纪末】，基督教成为【罗马帝国的国教】。"],"star":1},{"id":"ls-p4-03","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点2 法兰克王国","no":"3","q":"法兰克王国建立于何时？由谁建立？","a":["【481年】，【克洛维】建立法兰克王国。"],"star":1},{"id":"ls-p4-04","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点2 法兰克王国","no":"4","q":"克洛维的统治措施有哪些？","a":["①【皈依基督教】，承认【罗马教会】在欧洲的重要地位；②【保留了原来罗马大地主的土地】；③把【国有土地和无主土地】赐给亲兵和教会，取得了罗马教会和信奉基督教的【高卢罗马人】的支持。"],"star":1},{"id":"ls-p4-05","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点3 封君封臣制度","no":"5","q":"封君封臣制度是怎样形成的？","a":["【8世纪前期】，以【土地封赐】为纽带，形成封君封臣制度。"],"star":1},{"id":"ls-p4-06","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点3 封君封臣制度","no":"6","q":"封君与封臣的关系是什么？","a":["①封臣对封君要【忠诚、服兵役】；②封君对封臣要【保护封臣的人身安全和生活】。"],"star":1},{"id":"ls-p4-07","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点3 封君封臣制度","no":"7","q":"封君封臣制度的特点是什么？","a":["①以【土地的封赐】为纽带；②【等级森严】；③“【我的附庸的附庸，不是我的附庸】”；④【权利与义务交织】。"],"star":2},{"id":"ls-p4-08","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点4 查理曼帝国","no":"8","q":"查理曼（查理大帝）的称号是怎么来的？","a":["【800年】，教皇在罗马为查理举行【加冕礼】，查理被称为“【查理大帝】”或“查理曼”。"],"star":1},{"id":"ls-p4-09","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点4 查理曼帝国","no":"9","q":"查理曼帝国是怎样分裂的？","a":["【843年】，查理曼的三个孙子缔结条约，将帝国【一分为三】，形成了后来【德意志、法兰西和意大利】三个国家的雏形。"],"star":1},{"id":"ls-p4-10","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点5 西欧庄园","no":"10","q":"西欧庄园的性质是什么？","a":["【自给自足】的经济组织和【相对独立】的政治单位。"],"star":1},{"id":"ls-p4-11","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点5 西欧庄园","no":"11","q":"西欧庄园的居民有哪些？","a":["【领主】和【佃户】，佃户包括【自由的农民】和【缺少自由的农奴】。"],"star":1},{"id":"ls-p4-12","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点5 西欧庄园","no":"12","q":"领主与佃户之间是什么关系？","a":["【统治与被统治】、【剥削与被剥削】的关系。"],"star":1},{"id":"ls-p4-13","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"知识点5 西欧庄园","no":"13","q":"庄园法庭的职责与特点是什么？","a":["①维护【领主利益】；②处罚方式通常是【罚金】；③依据【习惯法或村法】；④在一定程度上【限制了领主的特权】。"],"star":2},{"id":"ls-p4-13b","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第7课 法兰克王国和西欧封建制度","node":"本课必背一句话","q":"第7课 法兰克王国和西欧封建制度的「本课必背一句话」是什么？","a":["封君封臣制度构成了西欧封建社会的政治基础，西欧庄园构成了其经济基础"],"star":2},{"id":"ls-p4-14","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"1","q":"西欧城市重新兴起的时间和背景是什么？","a":["从【10世纪】起，西欧开始恢复，城市重新兴起。"],"star":1},{"id":"ls-p4-15","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"2","q":"西欧城市主要分布在哪里？","a":["主要集中在【道路交会处】、【港口】、【主教驻地】等。"],"star":1},{"id":"ls-p4-16","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"3","q":"西欧城市争取自治的方式有哪些？","a":["①【金钱赎买】；②【武力斗争】。"],"star":2},{"id":"ls-p4-17","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"4","q":"西欧城市争取自治的典型案例是什么？","a":["法国【琅城】人民通过【武力斗争】获得自治权。"],"star":1},{"id":"ls-p4-18","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点1 西欧城市的兴起","no":"5","q":"农奴怎样才能获得市民身份？","a":["农奴进入城市住满【一年零一天】，即可获得【市民身份】，不再受【领主管辖】。"],"star":2},{"id":"ls-p4-19","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点2 大学的兴起","no":"6","q":"欧洲大学兴起的时间及其美誉是什么？","a":["【12世纪】，欧洲出现了许多大学，被誉为中世纪教育“【最美好的花朵】”。"],"star":1},{"id":"ls-p4-20","page":4,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点2 大学的兴起","no":"7","q":"早期大学有哪些代表？","a":["【博洛尼亚大学】、【巴黎大学】等。"],"star":1},{"id":"ls-p5-01","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点2 大学的兴起","no":"8","q":"大学的自治权表现在哪些方面？","a":["大学享有【免赋税特权】、【司法特权】和【教育自主权】。"],"star":2},{"id":"ls-p5-02","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点2 大学的兴起","no":"9","q":"大学的课程设置是怎样的？","a":["①【基础课程】包括文法、修辞、逻辑、算术、几何、天文、音乐；②【专业课程】包括法学、医学等。"],"star":1},{"id":"ls-p5-03","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点3 城市和大学兴起的意义","no":"10","q":"城市和大学兴起的意义之经济方面是什么？","a":["【经济方面】：促进了【商品经济发展】，为【资本主义的兴起】准备了条件。"],"star":2},{"id":"ls-p5-04","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点3 城市和大学兴起的意义","no":"11","q":"城市和大学兴起的意义之文化方面是什么？","a":["【文化方面】：打破了【教会对教育的垄断】，促进了【理性文化】的传播。"],"star":2},{"id":"ls-p5-05","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","node":"知识点3 城市和大学兴起的意义","no":"12","q":"城市和大学兴起的意义之社会方面是什么？","a":["【社会方面】：【市民阶层】形成，分化出【早期的资产阶级】，为资本主义的出现准备了条件。"],"star":2},{"id":"ls-p5-06","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第8课 西欧的城市和大学","q":"第8课《西欧的城市和大学》本课必背一句话是什么？","a":["城市和大学的兴起促进了【商品经济发展】和【市民阶层形成】，为【资本主义的兴起】准备了条件。"],"star":1},{"id":"ls-p5-07","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点1 拜占庭帝国概况","no":"1","q":"拜占庭帝国的概况如何（名称、首都、疆域）？","a":["拜占庭帝国即【东罗马帝国】，首都【君士坦丁堡】，地跨【欧亚非三洲】。"],"star":1},{"id":"ls-p5-08","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点1 拜占庭帝国概况","no":"2","q":"拜占庭帝国的经济状况如何？","a":["【经济繁荣】，【商业贸易发达】，是当时欧洲经济最发达的地区之一。"],"star":1},{"id":"ls-p5-09","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点2 《罗马民法大全》","no":"3","q":"《罗马民法大全》的编纂背景是什么？","a":["编纂背景：【6世纪】，【查士丁尼】组织编纂法典。"],"star":1},{"id":"ls-p5-10","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点2 《罗马民法大全》","no":"4","q":"《罗马民法大全》由哪几部法律组成？","a":["《【查士丁尼法典】》（历代罗马皇帝法令）、《【法学汇纂】》（法学家著作）、《【法理概要】》（法律教科书）、《【新法典】》（查士丁尼执政时期法令）。"],"star":2},{"id":"ls-p5-11","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点2 《罗马民法大全》","no":"5","q":"《罗马民法大全》的影响是什么？","a":["标志着【罗马法体系】的最终完成，奠定了【欧洲民法】的基础，对后世法律（如《拿破仑法典》）产生了【深远影响】。"],"star":2},{"id":"ls-p5-12","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点2 《罗马民法大全》","no":"6","q":"《罗马民法大全》的局限性是什么？","a":["本质上仍是为了维护【奴隶主阶级】（或帝国统治）的利益，【妇女和奴隶】的地位依然低下，具有明显的【阶级局限性】。"],"star":2},{"id":"ls-p5-13","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点3 拜占庭帝国的灭亡","no":"7","q":"拜占庭帝国衰亡的原因有哪些？","a":["①【长期对外战争】，国力衰弱；②【奥斯曼土耳其】的兴起和扩张。"],"star":1},{"id":"ls-p5-14","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点3 拜占庭帝国的灭亡","no":"8","q":"拜占庭帝国何时、被谁灭亡？","a":["【1453年】，【奥斯曼土耳其】攻陷【君士坦丁堡】，拜占庭帝国灭亡。"],"star":1},{"id":"ls-p5-15","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点3 拜占庭帝国的灭亡","no":"9","q":"拜占庭帝国的历史贡献有哪些？","a":["①保存了大量【古希腊罗马文化】；②《罗马民法大全》对后世法律影响深远；③对【东欧斯拉夫文化】的发展产生了重要影响。"],"star":2},{"id":"ls-p5-16","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点4 拜占庭文化","no":"10","q":"拜占庭文化的特点是什么？","a":["【兼收并蓄】（对基督教、希腊罗马的古典文化传统，以及西亚、北非等地的【东方文化】因素兼收并蓄）。"],"star":2},{"id":"ls-p5-17","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点4 拜占庭文化","no":"11","q":"拜占庭文化的成就有哪些？","a":["史学：普洛科比的《【战争史】》和《【秘史】》。","建筑：【圣索菲亚大教堂】（展现了【东西方文化的交融】）。"],"star":2},{"id":"ls-p5-18","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","node":"知识点4 拜占庭文化","no":"12","q":"拜占庭文化的地位与影响是什么？","a":["①保存了大量【希腊罗马古典作品】，为后来【文艺复兴运动】提供了丰富的文化素材。","②【东正教】传入俄罗斯等东欧地区，拜占庭通用的【希腊字母】对后来东欧文字的形成有促进作用。","③是东西方贸易和文化交流的“金桥”。"],"star":2},{"id":"ls-p5-19","page":5,"unit":"第三单元 封建时代的欧洲","lesson":"第9课 拜占庭帝国","q":"第9课《拜占庭帝国》本课必背一句话是什么？","a":["拜占庭帝国文化【兼收并蓄】，其编纂的《罗马民法大全》奠定了【欧洲民法】的基础，保存的古典文化为文艺复兴提供了素材，是东西方交流的“金桥”。"],"star":1},{"id":"ls-p6-01","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点1 大和政权","no":"1","q":"5世纪时日本大和政权的情况如何？","a":["【5世纪】，【大和政权】基本统一日本。"],"star":1},{"id":"ls-p6-02","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点1 大和政权","no":"2","q":"大和政权的最高统治者如何称呼？","a":["大和的最高统治者称为“【大王】”，后改称“【天皇】”。"],"star":1},{"id":"ls-p6-03","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"3","q":"大化改新开始于哪一年？","a":["时间：【646年】开始。"],"star":1},{"id":"ls-p6-04","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"4","q":"大化改新的内容仿效的是哪国的典章制度？","a":["内容（仿效中国【唐朝的典章制度】）："],"star":2,"warn":"本条仅为总起句，具体内容见第5条（政治）与第6条（经济）"},{"id":"ls-p6-05","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"5","q":"大化改新在政治上的内容是什么？","a":["【政治上】：建立以【天皇为中心】的【中央集权制度】，地方设国、郡、里，由中央派人管理。"],"star":1},{"id":"ls-p6-06","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"6","q":"大化改新在经济上的内容是什么？","a":["【经济上】：将【土地、部民】收归国有，国家将土地分给公民耕种，【统一赋税】。"],"star":1},{"id":"ls-p6-07","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"7","q":"大化改新的意义是什么？","a":["使日本从【奴隶社会】向【封建社会】过渡，是日本历史上的【重大转折点】。"],"star":2},{"id":"ls-p6-08","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点2 大化改新","no":"8","q":"大化改新给我们什么启示？","a":["改革是推动【社会发展】的【重要动力】；要善于【学习先进文化】。"],"star":1},{"id":"ls-p6-09","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点3 幕府统治","no":"9","q":"日本幕府统治建立的背景是什么？","a":["背景：大化改新百余年后，日本社会出现【庄园】和【武士阶层】。"],"star":1},{"id":"ls-p6-10","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点3 幕府统治","no":"10","q":"日本幕府统治是怎样建立的？","a":["建立：【12世纪晚期】，【源赖朝】建立【镰仓幕府】。"],"star":1},{"id":"ls-p6-11","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","node":"知识点3 幕府统治","no":"11","q":"日本幕府统治的特点是什么？","a":["①【天皇大权旁落】，【幕府将军】掌握实权；②幕府与天皇并存的局面持续了近【700年】。"],"star":2},{"id":"ls-p6-12","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第10课 封建时代的日本","q":"第10课《封建时代的日本》本课必背一句话是什么？","a":["【大化改新】使日本由【奴隶社会】过渡到【封建社会】，是日本历史的重大转折点。"],"star":1},{"id":"ls-p6-13","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点1 伊斯兰教的创立","no":"1","q":"伊斯兰教何时、由谁、在哪里创立？","a":["创立：【7世纪初】，【穆罕默德】在【阿拉伯半岛】创立伊斯兰教。"],"star":1},{"id":"ls-p6-14","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点1 伊斯兰教的创立","no":"2","q":"伊斯兰教创立初期的发展情况如何？","a":["发展：【622年】，穆罕默德率众从【麦加】出走【麦地那】，建立【穆斯林公社】（阿拉伯国家的雏形），622年被定为伊斯兰教【教历元年】。630年，占领麦加。"],"star":1},{"id":"ls-p6-15","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点2 阿拉伯帝国","no":"3","q":"阿拉伯帝国是怎样建立的？","a":["建立：穆罕默德去世后，其继承者不断【扩张】。"],"star":1},{"id":"ls-p6-16","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点2 阿拉伯帝国","no":"4","q":"阿拉伯帝国的鼎盛情况如何？","a":["鼎盛：【8世纪中期】，阿拉伯帝国成为地跨【欧亚非三洲】的大帝国。"],"star":1},{"id":"ls-p6-17","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点2 阿拉伯帝国","no":"5","q":"阿拉伯帝国的特点是什么？","a":["【政教合一】，【哈里发】为最高统治者，掌握军政大权和宗教最高权力。"],"star":2},{"id":"ls-p6-18","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"6","q":"“阿拉伯数字”的来源与传播是怎样的？","a":["阿拉伯数字：改进并传播了【古印度人】从【0到9】的计数法，将其传播到欧洲。"],"star":1,"warn":"阿拉伯数字是古印度人发明的，阿拉伯人改进并传播"},{"id":"ls-p6-19","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"7","q":"阿拉伯人的医学成就是什么？","a":["医学：《【医学集成】》和《【医典】》长期被欧洲医学界奉为【经典】。"],"star":1},{"id":"ls-p6-20","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"8","q":"阿拉伯文学的代表作是什么？","a":["文学：《【一千零一夜】》（又名《【天方夜谭】》）。"],"star":2},{"id":"ls-p6-21","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"9","q":"阿拉伯人是怎样保存古代文献的？","a":["翻译保存：翻译保存了大量【古希腊罗马】文献。"],"star":1},{"id":"ls-p6-22","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","node":"知识点3 阿拉伯文化","no":"10","q":"阿拉伯人的历史地位如何？","a":["历史地位：阿拉伯人在东西方文化交流中起了【桥梁】作用。"],"star":2},{"id":"ls-p6-23","page":6,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第11课 阿拉伯帝国","q":"第11课《阿拉伯帝国》本课必背一句话是什么？","a":["阿拉伯人在东西方文化交流中充当了【桥梁】的作用。"],"star":1},{"id":"ls-p7-01","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点1 西非三大帝国","no":"1","q":"加纳帝国的概况如何？","a":["加纳：①约【8世纪末】建立；②控制着【黄金和食盐】的贸易；③被称为“【黄金之国】”。"],"star":1},{"id":"ls-p7-02","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点1 西非三大帝国","no":"2","q":"马里帝国的概况如何？","a":["马里：①【13世纪】独立并取代加纳；②【14世纪】达到鼎盛；③【曼萨·穆萨】1324年前往【麦加朝圣】；④【廷巴克图】成为学术中心。"],"star":1},{"id":"ls-p7-03","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点1 西非三大帝国","no":"3","q":"桑海帝国的概况如何？","a":["桑海：①【15世纪后期】建立；②【16世纪】达到鼎盛；③16世纪末【摩洛哥】入侵，桑海衰落。"],"star":1},{"id":"ls-p7-04","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点2 美洲三大文明","no":"4","q":"玛雅文明有哪些特点？","a":["①位于【中美洲】；②【历法精确】；③创造了【象形文字】；④建造了【金字塔神庙】。"],"star":2},{"id":"ls-p7-05","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点2 美洲三大文明","no":"5","q":"阿兹特克文明有哪些特点？","a":["①【14世纪】兴起于【墨西哥高原】；②建造【浮动园地】扩大耕种面积；③建造【金字塔神庙】。"],"star":1},{"id":"ls-p7-06","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","node":"知识点2 美洲三大文明","no":"6","q":"印加文明有哪些特点？","a":["①位于【南美安第斯山区】；②【15—16世纪】达到鼎盛；③修建道路和城池；④建造【太阳庙】。"],"star":1},{"id":"ls-p7-07","page":7,"unit":"第四单元 中古时期的亚洲、非洲和美洲","lesson":"第12课 中古时期的非洲和美洲","q":"第12课《中古时期的非洲和美洲》本课必背一句话是什么？","a":["中古时期的非洲和美洲创造了各具特色的文明，其中【玛雅文明】是美洲文明的代表。"],"star":1},{"id":"ls-p7-08","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点1 西欧经济社会发展","no":"1","q":"13世纪以后西欧农村出现了什么变化？","a":["农村变化：【13世纪】以后，农村出现【租地农场】，新的生产经营方式开始出现。"],"star":1},{"id":"ls-p7-09","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点1 西欧经济社会发展","no":"2","q":"西欧手工业出现了什么变化？","a":["手工业变化：【手工工场】出现，劳动者与雇主形成【雇佣与被雇佣】的关系。"],"star":1},{"id":"ls-p7-10","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点1 西欧经济社会发展","no":"3","q":"资本主义生产关系是怎样出现的（标志与特征）？","a":["①【租地农场】和【手工工场】的出现标志着资本主义生产关系的出现；②资本主义生产的两大特征：【雇佣关系】、面向市场。"],"star":2},{"id":"ls-p7-11","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点1 西欧经济社会发展","no":"4","q":"租地农场和手工工场的影响是什么？","a":["①经济：推动农业和手工业逐渐【资本主义化】，开始改变中世纪西欧社会的【整体面貌】。","②政治：【新兴资产阶级】开始形成。"],"star":2},{"id":"ls-p7-12","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"5","q":"文艺复兴运动兴起的时间和发源地是什么？","a":["时间：【14世纪】兴起。发源地：【意大利】。"],"star":1},{"id":"ls-p7-13","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"6","q":"文艺复兴运动的核心思想是什么？","a":["【人文主义】——以人为中心而不是以神为中心，发扬人的个性，追求享受【现世生活】。"],"star":1},{"id":"ls-p7-14","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"7","q":"文艺复兴的代表人物及作品有哪些？","a":["【文学三杰】：但丁（先驱，《【神曲】》）、彼特拉克、薄伽丘（《【十日谈】》）。","【美术三杰】：【达·芬奇】（《【蒙娜丽莎】》《最后的晚餐》）、米开朗琪罗、拉斐尔。"],"star":2},{"id":"ls-p7-15","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"8","q":"文艺复兴是怎样扩展的？","a":["扩展：【15、16世纪】，向【西欧其他国家和地区】传播。"],"star":2},{"id":"ls-p7-16","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"9","q":"文艺复兴除意大利外还有哪些代表人物？","a":["代表：【莎士比亚】（英国，《哈姆雷特》《罗密欧与朱丽叶》）、【拉伯雷】（法国）、【塞万提斯】（西班牙，《堂吉诃德》）。"],"star":1},{"id":"ls-p7-17","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"10","q":"文艺复兴运动的本质是什么？","a":["本质：反映【新兴资产阶级】诉求的【思想解放运动】。"],"star":1},{"id":"ls-p7-18","page":7,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","node":"知识点2 文艺复兴运动","no":"11","q":"文艺复兴运动的影响是什么？","a":["①推动了欧洲【文化和思想】的繁荣。","②被认为是【资本主义时代】的曙光。","③冲击了封建时代【神学】的精神束缚，解放了人们的思想，促进了资本主义的发展。","④对欧洲乃至世界历史产生重要影响（为欧洲资本主义社会的产生和发展奠定了【思想文化基础】）。"],"star":2},{"id":"ls-p8-01","page":8,"unit":"第五单元 走向近代","lesson":"第13课 西欧经济社会发展与文艺复兴运动","q":"第13课《西欧经济社会发展与文艺复兴运动》本课必背一句话是什么？","a":["租地农场和手工工场推动西欧经济【资本主义化】，促使【新兴资产阶级】开始形成；","文艺复兴是【资本主义时代的曙光】，解放了人们的思想，为资本主义的产生奠定了【思想文化基础】。"],"star":1},{"id":"ls-p8-02","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点1 新航路开辟的背景","no":"1","q":"新航路开辟的经济根源是什么？","a":["经济根源：欧洲【商品经济】发展，对【东方商品】的需求增加。"],"star":1},{"id":"ls-p8-03","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点1 新航路开辟的背景","no":"2","q":"新航路开辟的社会根源是什么？","a":["社会根源：《【马可·波罗行纪】》的影响，欧洲人对【东方】充满向往。"],"star":1},{"id":"ls-p8-04","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点1 新航路开辟的背景","no":"3","q":"新航路开辟的直接原因是什么？","a":["直接原因：【奥斯曼帝国】控制了东西方传统商路，对过往商品【征收重税】。"],"star":1},{"id":"ls-p8-05","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点1 新航路开辟的背景","no":"4","q":"新航路开辟的客观条件有哪些？","a":["①【地圆学说】的普及；②【航海技术】的进步；③【造船技术】的进步；④【指南针】的应用。","⑤【西班牙、葡萄牙王室】的支持。"],"star":1},{"id":"ls-p8-06","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点2 四大航海活动","no":"5","q":"迪亚士的航海成就是什么？","a":["迪亚士：【1487—1488年】，到达非洲【好望角】。"],"star":1},{"id":"ls-p8-07","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点2 四大航海活动","no":"6","q":"达·伽马的航海成就是什么？","a":["达·伽马：【1497—1498年】，绕过好望角，横渡【印度洋】，到达【印度】。"],"star":1},{"id":"ls-p8-08","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点2 四大航海活动","no":"7","q":"哥伦布的航海成就是什么？","a":["哥伦布：【1492年】，横渡【大西洋】，到达【美洲】（他认为到达了印度，称当地人为“【印第安人】”）。"],"star":1},{"id":"ls-p8-09","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点2 四大航海活动","no":"8","q":"麦哲伦船队的航海成就是什么？","a":["麦哲伦船队：【1519—1522年】，完成了人类历史上第一次【环球航行】。"],"star":1},{"id":"ls-p8-10","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点3 新航路开辟的影响（新教材重点）","no":"①","q":"新航路开辟对世界的影响是什么？","a":["对世界：世界主要的大洋和大陆之间建立起【直接的海上联系】，逐渐【连成为一个整体】。"],"star":2},{"id":"ls-p8-11","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点3 新航路开辟的影响（新教材重点）","no":"②","q":"新航路开辟对物种的影响是什么？","a":["对物种：有利于【动植物物种】的传播，为人们提供了更加丰富的【食物】。"],"star":2},{"id":"ls-p8-12","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点3 新航路开辟的影响（新教材重点）","no":"③","q":"新航路开辟对欧洲的影响是什么？","a":["对欧洲：推动欧洲国家扩大【海外市场】，进行【殖民掠夺】，增加了【资本原始积累】，促进了资本主义发展。"],"star":2},{"id":"ls-p8-13","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","node":"知识点3 新航路开辟的影响（新教材重点）","no":"④","q":"新航路开辟对亚非拉等其他地区的影响是什么？","a":["对亚非拉等其他地区：在非洲、美洲、大洋洲和亚洲的很多地方，当地居民遭到【屠杀与掳掠】，原有的【社会发展轨迹】被打断，一些地区开始沦为欧洲的【殖民地和半殖民地】（带来了深重灾难）。"],"star":2},{"id":"ls-p8-14","page":8,"unit":"第五单元 走向近代","lesson":"第14课 探寻新航路","q":"第14课《探寻新航路》本课必背一句话是什么？","a":["新航路开辟使世界开始【连为一个整体】，促进了【物种传播】和欧洲资本主义的发展，但也开启了【殖民掠夺】，给亚非美等地区带来深重灾难。"],"star":1},{"id":"ls-p8-15","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点1 葡萄牙的殖民扩张","no":"1","q":"葡萄牙殖民扩张的方式是什么？","a":["方式：在【亚洲、非洲、拉丁美洲】建立【殖民据点】和【商站】。"],"star":1},{"id":"ls-p8-16","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点1 葡萄牙的殖民扩张","no":"2","q":"葡萄牙殖民扩张的特点是什么？","a":["特点：进行【劫掠式贸易】，以【欺骗】和【抢劫】获取财富。"],"star":1},{"id":"ls-p8-17","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点2 西班牙的殖民掠夺","no":"3","q":"西班牙殖民掠夺的方式是什么？","a":["方式：在美洲建立【殖民帝国】，掠夺【金银】，强迫【印第安人】劳动。"],"star":1},{"id":"ls-p8-18","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点2 西班牙的殖民掠夺","no":"4","q":"西班牙在殖民扩张中的地位如何？","a":["地位：【16世纪】，西班牙成为最强大的【殖民帝国】。"],"star":1},{"id":"ls-p8-19","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点3 英法荷的殖民扩张","no":"5","q":"英国是怎样成为海上霸主的？","a":["【1588年】，英国击败西班牙“【无敌舰队】”，逐渐成为【海上霸主】。"],"star":1},{"id":"ls-p8-20","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点3 英法荷的殖民扩张","no":"6","q":"17世纪的荷兰被称为什么？","a":["【17世纪】，荷兰成为“【海上马车夫】”。"],"star":1},{"id":"ls-p8-21","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点3 英法荷的殖民扩张","no":"7","q":"英国是怎样建立殖民霸权的？","a":["【18世纪中后期】，英国打败【荷兰、法国】，开始建立【殖民霸权】。"],"star":1},{"id":"ls-p8-22","page":8,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点4 “三角贸易”","no":"8","q":"“三角贸易”的路线是怎样的？","a":["①出程：欧洲（携带【手工业品】）→非洲；②中程：非洲（【掳掠黑奴】）→美洲（【出售黑奴】，获取原料）；③归程：美洲→欧洲（运送【原料和金银】回欧洲）。"],"star":2},{"id":"ls-p9-01","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点4 早期殖民掠夺的影响","q":"早期殖民掠夺对非洲产生了什么影响？","a":["①对非洲：对非洲人民犯下【滔天罪行】，非洲损失的人口总数可能有【近亿人】，发展进程受到严重影响。"],"star":1},{"id":"ls-p9-02","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点4 早期殖民掠夺的影响","q":"早期殖民掠夺对欧洲（殖民者）产生了什么影响？","a":["②欧洲：使欧洲殖民者【大发横财】，加速了【资本原始积累】，推动了欧洲资本主义的发展。"],"star":1},{"id":"ls-p9-03","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点5 早期殖民掠夺的整体影响","q":"早期殖民掠夺对欧洲的客观影响是什么？","a":["①★对欧洲：客观上有助于欧洲殖民国家的【资本原始积累】，推动了欧洲资本主义的发展。"],"star":2},{"id":"ls-p9-04","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点5 早期殖民掠夺的整体影响","q":"早期殖民掠夺对世界的影响是什么？","a":["②★对世界：有助于【世界市场】逐渐形成，促进全球文化、物种和经济的交流。"],"star":2},{"id":"ls-p9-05","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"知识点5 早期殖民掠夺的整体影响","q":"早期殖民掠夺对殖民地的影响是什么？","a":["③★对殖民地：给殖民地人民带来了【深重的灾难】；欧洲文化传到殖民地，对殖民地社会的发展产生了【深远的影响】。"],"star":2},{"id":"ls-p9-06","page":9,"unit":"第五单元 走向近代","lesson":"第15课 早期殖民掠夺","node":"本课必背一句话","q":"三角贸易和早期殖民掠夺的影响——本课必背一句话是什么？","a":["三角贸易和早期殖民掠夺加速了欧洲的【资本原始积累】，促进了【世界市场】的形成，但也给亚非拉殖民地人民带来了【深重灾难】。"],"star":1},{"id":"ls-p9-07","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点1 革命背景","no":"1","q":"英国资产阶级革命的根本原因是什么？","a":["★根本原因：【斯图亚特王朝】的专制统治严重阻碍了英国资本主义的发展。"],"star":2},{"id":"ls-p9-08","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点1 革命背景","no":"2","q":"英国资产阶级革命的阶级基础是什么？","a":["阶级基础：【资产阶级和新贵族】的形成。"],"star":1},{"id":"ls-p9-09","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点1 革命背景","no":"3","q":"英国资产阶级革命的导火线是什么？","a":["★导火线：【苏格兰人民起义】。"],"star":2},{"id":"ls-p9-10","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"4","q":"英国资产阶级革命开始的标志是什么？","a":["开始：1640年，议会重新召开，揭开了英国资产阶级革命的【序幕】。"],"star":1},{"id":"ls-p9-11","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"5","q":"英国内战的结果如何？","a":["内战：【克伦威尔】率领议会军队打败国王军队。"],"star":1},{"id":"ls-p9-12","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"6","q":"英国何时宣布为共和国？","a":["共和：1649年，查理一世被推上断头台，英国宣布为【共和国】。"],"star":1},{"id":"ls-p9-13","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"7","q":"克伦威尔的独裁与斯图亚特王朝复辟的情况如何？","a":["独裁与复辟：克伦威尔就任“【护国公】”实行独裁；1660年【斯图亚特王朝复辟】。"],"star":1},{"id":"ls-p9-14","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点2 革命过程","no":"8","q":"英国资产阶级革命结束的标志是什么？","a":["结束：1688年，“【光荣革命】”（资产阶级和新贵族发动宫廷政变，未流血）。"],"star":1},{"id":"ls-p9-15","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点3 《权利法案》","no":"9","q":"《权利法案》的颁布时间是什么？","a":["颁布时间：【1689年】。"],"star":1},{"id":"ls-p9-16","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点3 《权利法案》","no":"10","q":"《权利法案》的核心内容是什么？","a":["★核心内容：限制国王权力，确立【议会权力至上】。"],"star":2},{"id":"ls-p9-17","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点3 《权利法案》","no":"11","q":"《权利法案》的意义是什么？","a":["★意义：①以法律形式对国王的权力进行了明确的制约；②确立了议会在国家政治生活中的【最高地位】；③逐渐形成了【君主立宪制】。"],"star":2},{"id":"ls-p9-18","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点4 英国资产阶级革命的影响","q":"英国资产阶级革命对英国的影响是什么？","a":["①对英国：推翻了封建君主的【专制统治】，为英国资本主义的进一步发展【开辟了道路】。"],"star":1},{"id":"ls-p9-19","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"知识点4 英国资产阶级革命的影响","q":"英国资产阶级革命对世界的影响是什么？","a":["②对世界：对世界历史产生了重要影响，标志着人类社会从封建时代走向【资本主义时代】。"],"star":1},{"id":"ls-p9-20","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第16课 英国资产阶级革命","node":"本课必背一句话","q":"《权利法案》与英国资产阶级革命——本课必背一句话是什么？","a":["《权利法案》以法律形式【限制王权】，标志着英国确立了【君主立宪制】，为资本主义发展【开辟了道路】。"],"star":1},{"id":"ls-p9-21","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"1","q":"美国独立战争的根本原因是什么？","a":["★根本原因：英国殖民统治严重阻碍了【北美资本主义】的发展。"],"star":2},{"id":"ls-p9-22","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"2","q":"美国独立战争的导火线是什么？","a":["★导火线：1773年【波士顿倾茶事件】。"],"star":2},{"id":"ls-p9-23","page":9,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"3","q":"美国独立战争爆发的标志是什么？","a":["爆发：1775年【来克星顿枪声】。"],"star":1},{"id":"ls-p10-01","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"4","q":"美国独立战争中的建军情况如何？","a":["建军：第二届大陆会议组建【大陆军】，【华盛顿】任总司令。"],"star":1},{"id":"ls-p10-02","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"5","q":"美国何时宣告独立？","a":["宣告独立：1776年7月4日，发表【《独立宣言》】，宣告美国诞生。"],"star":1},{"id":"ls-p10-03","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"6","q":"美国独立战争的转折点是什么？","a":["转折：1777年【萨拉托加大捷】。"],"star":1},{"id":"ls-p10-04","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点1 独立战争的背景与过程","no":"7","q":"美国独立战争胜利与结束的标志是什么？","a":["胜利与结束：1781年【约克镇战役】胜利；1783年英国承认美国独立。"],"star":1},{"id":"ls-p10-05","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点2 《独立宣言》","no":"8","q":"《独立宣言》的内容是什么？","a":["内容：宣布【人人生而平等】，享有生命权、自由权和追求幸福的权利；宣告北美13个殖民地【脱离英国而独立】。"],"star":1},{"id":"ls-p10-06","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点2 《独立宣言》","no":"9","q":"《独立宣言》的局限性是什么？","a":["★局限：没有宣布废除【奴隶制】，也没有给予广大黑人和印第安人基本权利。"],"star":2},{"id":"ls-p10-07","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点3 1787年宪法","no":"10","q":"1787年宪法的设计原则是什么？","a":["原则：依据【分权制衡】原则设计（立法权归国会；行政权归总统；司法权归最高法院）。"],"star":1},{"id":"ls-p10-08","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点3 1787年宪法","no":"11","q":"1787年宪法确立了什么政体？","a":["政体：确立了【联邦制共和国】。"],"star":1},{"id":"ls-p10-09","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点3 1787年宪法","no":"12","q":"1787年宪法的历史地位是什么？","a":["地位：是世界上第一部【资产阶级成文宪法】。"],"star":1},{"id":"ls-p10-10","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"知识点3 1787年宪法","no":"13","q":"1787年宪法的局限性是什么？","a":["★局限：允许奴隶制存在，不承认妇女、黑人和印第安人拥有和白人男子【同等的权利】。"],"star":2},{"id":"ls-p10-11","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第17课 美国的独立","node":"本课必背一句话","q":"《独立宣言》与1787年宪法——本课必背一句话是什么？","a":["《独立宣言》宣告【美国诞生】；1787年宪法确立了【分权制衡】的联邦制共和国，是世界第一部【资产阶级成文宪法】。"],"star":1},{"id":"ls-p10-12","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"1","q":"法国大革命的根本原因是什么？","a":["★根本原因：【波旁王朝】的专制统治严重阻碍了法国资本主义的发展。"],"star":2},{"id":"ls-p10-13","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"2","q":"法国大革命的思想准备是什么？","a":["思想准备：【启蒙运动】（伏尔泰、孟德斯鸠、卢梭）为法国大革命提供了思想理论基础。"],"star":1},{"id":"ls-p10-14","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"3","q":"法国大革命的导火线是什么？","a":["★导火线：1789年，路易十六召开【三级会议】。"],"star":2},{"id":"ls-p10-15","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"4","q":"法国大革命爆发的标志是什么？","a":["爆发：1789年7月14日，巴黎人民攻占【巴士底狱】，法国大革命爆发。"],"star":1},{"id":"ls-p10-16","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点1 大革命背景与过程","no":"5","q":"法国大革命的发展表现在哪里？","a":["发展：1792年建立【法兰西第一共和国】；1793年处死路易十六。"],"star":1},{"id":"ls-p10-17","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点2 《人权宣言》","no":"6","q":"《人权宣言》何时由什么机构颁布？","a":["★颁布：1789年，【制宪议会】通过。"],"star":2},{"id":"ls-p10-18","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点2 《人权宣言》","no":"7","q":"《人权宣言》的内容是什么？","a":["★内容：宣告人们生来【自由、权利平等】，【私有财产神圣不可侵犯】。"],"star":2},{"id":"ls-p10-19","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点2 《人权宣言》","no":"8","q":"《人权宣言》的历史地位是什么？","a":["地位：是法国大革命的【纲领性文件】。"],"star":1},{"id":"ls-p10-20","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"9","q":"法国大革命是如何深入发展（被推向高潮）的？","a":["深入发展：以【罗伯斯庇尔】为首的【雅各宾派】掌权，把法国大革命推向高潮。"],"star":1},{"id":"ls-p10-21","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"10","q":"法国大革命高潮结束的标志是什么？","a":["高潮结束：1794年“【热月政变】”，罗伯斯庇尔等人被处死，法国大革命高潮结束。"],"star":1},{"id":"ls-p10-22","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"11","q":"法国大革命对法国的影响是什么？","a":["①对法国：摧毁了法国的【封建君主专制统治】，为法国资本主义的发展【扫清了障碍】。"],"star":2},{"id":"ls-p10-23","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"11","q":"法国大革命对思想的影响是什么？","a":["②对思想：传播了资产阶级【自由民主】的进步思想，沉重打击了欧洲的封建制度。"],"star":2},{"id":"ls-p10-24","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点3 法国大革命","no":"11","q":"法国大革命对世界的影响是什么？","a":["③对世界：具有世界性影响。它是世界历史上【规模最大、最彻底】的一次资产阶级革命，对欧洲乃至世界历史的发展产生了深远影响。"],"star":2},{"id":"ls-p10-25","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"12","q":"拿破仑帝国何时建立？","a":["建立：1804年，拿破仑【加冕称帝】，建立【法兰西第一帝国】（拿破仑帝国）。"],"star":1},{"id":"ls-p10-26","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"13","q":"拿破仑帝国的主要活动——对内采取了哪些措施？","a":["①对内：采取各种措施巩固资产阶级统治，发展经济，改善财政；主持制定【《拿破仑法典》】，该法典肯定了法国大革命的基本成果，确立了【资本主义社会重要的立法规范】。"],"star":2},{"id":"ls-p10-27","page":10,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"13","q":"拿破仑帝国的主要活动——对外采取了哪些措施？","a":["②对外：多次击退【反法联盟】，发动对外战争。"],"star":2},{"id":"ls-p11-01","page":11,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"14","q":"评价拿破仑对外战争的革命性（进步性）？","a":["①革命性：沉重打击了欧洲的【封建势力】，传播了法国大革命的思想。"],"star":2},{"id":"ls-p11-02","page":11,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"14","q":"评价拿破仑对外战争的侵略性？","a":["②侵略性：当地人民遭到【压榨和掠夺】。"],"star":2,"warn":"第10页末为“14.★评价对外战争”，其答案①②在第11页"},{"id":"ls-p11-03","page":11,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"知识点4 拿破仑帝国","no":"15","q":"拿破仑帝国覆灭的结果如何？","a":["结果：1812年，拿破仑率军【远征俄国大败而归】；1815年，【滑铁卢战役】失败，拿破仑帝国覆灭。"],"star":1},{"id":"ls-p11-04","page":11,"unit":"第六单元 资本主义制度的初步确立","lesson":"第18课 法国大革命和拿破仑帝国","node":"本课必背一句话","q":"《人权宣言》《拿破仑法典》与法国大革命——本课必背一句话是什么？","a":["《人权宣言》传播了【自由平等】思想；法国大革命是最彻底的资产阶级革命；【《拿破仑法典》】确立了资本主义社会的【立法规范】。"],"star":1},{"id":"ls-p11-05","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"1","q":"第一次工业革命开始的时间是什么时候？","a":["时间：【18世纪60年代】开始。"],"star":1},{"id":"ls-p11-06","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"2","q":"第一次工业革命首先发生在哪个国家、哪个领域？","a":["首先发生国：英国。首先开始领域：【棉纺织业】。"],"star":1},{"id":"ls-p11-07","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"4","q":"英国率先开始工业革命的政治前提是什么？","a":["政治前提：【君主立宪制】确立，政局稳定。"],"star":2,"warn":"本条属于“3.★英国率先开始工业革命的条件”之下的一目"},{"id":"ls-p11-08","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"5","q":"英国率先开始工业革命的经济基础是什么？","a":["经济基础：海外贸易和【殖民掠夺】积累了大量资本。"],"star":2,"warn":"本条属于“3.★英国率先开始工业革命的条件”之下的一目"},{"id":"ls-p11-09","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点1 工业革命的背景与概况","no":"6","q":"英国率先开始工业革命在市场和劳动力方面的条件是什么？","a":["市场与劳动力：拥有广阔的【海外市场】，【圈地运动】提供了自由劳动力。"],"star":2,"warn":"本条属于“3.★英国率先开始工业革命的条件”之下的一目"},{"id":"ls-p11-10","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"7","q":"工业革命的纺织技术革新有哪些？（发明者与发明）","a":["★纺织技术革新：【哈格里夫斯】发明珍妮纺织机；【阿克莱特】发明水力纺纱机；克隆普顿发明骡机；卡特莱特发明动力织布机。"],"star":2},{"id":"ls-p11-11","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"8","q":"工业革命的动力革新是什么？","a":["★动力革新：1785年，英国人【瓦特】改进后的蒸汽机投入使用。"],"star":2},{"id":"ls-p11-12","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"9","q":"蒸汽机投入使用（动力革新）的影响是什么？","a":["影响：推动了更多新机器、新技术的发明，极大提高了【生产力】。"],"star":1},{"id":"ls-p11-13","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"10","q":"工厂制度是怎样确立的？","a":["★工厂制度：19世纪，传统手工工场逐渐被工厂替代，【工厂制度】最终确立。"],"star":2},{"id":"ls-p11-14","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"11","q":"工业革命在交通工具方面的成就是什么？","a":["★交通工具：1825年，【斯蒂芬森】设计的蒸汽机车试车成功。"],"star":2},{"id":"ls-p11-15","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点2 工业革命的主要成就","no":"12","q":"蒸汽机车（交通工具革新）的影响是什么？","a":["影响：交通更加快捷、便利，【生产和市场之间的联系】更加紧密。"],"star":1},{"id":"ls-p11-16","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点3 工业革命的影响","q":"工业革命对生产生活的影响是什么？","a":["①生产生活：极大地提高了生产力，创造出巨大的社会财富，改变了人们的生产生活方式，人类社会进入“【蒸汽时代】”。"],"star":1},{"id":"ls-p11-17","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点3 工业革命的影响","q":"工业革命对社会结构的影响是什么？","a":["②社会结构：引起社会结构的变化，使社会日益分化为【工业资产阶级】和【工业无产阶级】两大对立阶级。"],"star":1},{"id":"ls-p11-18","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点3 工业革命的影响","q":"工业革命在环境方面带来了什么后果？","a":["③造成了【环境污染】。"],"star":1},{"id":"ls-p11-19","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"知识点3 工业革命的影响","q":"工业革命在贫富差距方面带来了什么后果？","a":["④加剧了【贫富分化】，无产阶级与资产阶级的矛盾日益尖锐。"],"star":1},{"id":"ls-p11-20","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"易混易错","q":"工业革命的“开始标志”与“标志性发明”分别是什么？（易混易错）","a":["◇工业革命开始的标志是【珍妮机】的发明；标志性发明是【瓦特改良蒸汽机】。"],"star":1,"warn":"易混易错：开始标志（珍妮机的发明）≠标志性发明（瓦特改良蒸汽机）"},{"id":"ls-p11-21","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"易混易错","q":"为什么说工业革命不仅是一场技术革命，也是一场深刻的社会变革？","a":["◇工业革命不仅是一场技术革命，也是一场深刻的【社会变革】（工厂制度确立、两大阶级对立）。"],"star":2,"warn":"易混易错"},{"id":"ls-p11-22","page":11,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第19课 第一次工业革命","node":"本课必背一句话","q":"第一次工业革命的影响——本课必背一句话是什么？","a":["【瓦特改良蒸汽机】使人类进入“蒸汽时代”；工业革命极大提高了生产力，使社会日益分化为【工业资产阶级】和【工业无产阶级】两大对立阶级。"],"star":1},{"id":"ls-p12-01","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点1 马克思主义诞生的背景","no":"1","q":"马克思主义诞生的经济基础是什么？","a":["经济基础：工业革命后，资本主义迅速发展，但【阶级矛盾日益尖锐】。"],"star":1},{"id":"ls-p12-02","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点1 马克思主义诞生的背景","no":"2","q":"马克思主义诞生的阶级基础是什么？","a":["★阶级基础：三大工人运动（法国里昂工人起义、英国宪章运动、德国西里西亚织工起义）标志着【工人阶级】作为独立的政治力量登上历史舞台。"],"star":2},{"id":"ls-p12-03","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点1 马克思主义诞生的背景","no":"3","q":"马克思主义诞生的思想基础是什么？","a":["思想基础：【空想社会主义】（圣西门、傅立叶、欧文）。"],"star":1},{"id":"ls-p12-04","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点2 《共产党宣言》","no":"4","q":"《共产党宣言》的发表时间是什么时候？","a":["★发表时间：【1848年】。"],"star":2},{"id":"ls-p12-05","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点2 《共产党宣言》","no":"5","q":"《共产党宣言》的内容之一：社会发展的趋势是什么？","a":["①社会日益分裂为【资产阶级】和【无产阶级】两大对立阶级。"],"star":2},{"id":"ls-p12-06","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点2 《共产党宣言》","no":"5","q":"《共产党宣言》的内容之二：对资本主义前途的判断是什么？","a":["②【资本主义必将被共产主义取代】。"],"star":2},{"id":"ls-p12-07","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点2 《共产党宣言》","no":"5","q":"《共产党宣言》的内容之三：对工人阶级提出了什么号召？","a":["③号召工人阶级组织起来，建立【共产党】，进行无产阶级革命。"],"star":2},{"id":"ls-p12-08","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"知识点2 《共产党宣言》","no":"6","q":"《共产党宣言》发表的意义是什么？","a":["★意义：标志着【马克思主义的诞生】。从此，无产阶级的斗争有了【科学理论的指导】，国际共产主义运动兴起并蓬勃发展。"],"star":2},{"id":"ls-p12-09","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第20课 马克思主义的诞生","node":"本课必背一句话","q":"《共产党宣言》的发表——本课必背一句话是什么？","a":["1848年《共产党宣言》的发表，标志着【马克思主义的诞生】，无产阶级斗争有了【科学理论指导】。"],"star":1},{"id":"ls-p12-10","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点1 第一国际","no":"1","q":"第一国际何时何地成立，正式名称是什么？","a":["成立：1864年，英国伦敦，正式名称是“【国际工人协会】”。"],"star":1},{"id":"ls-p12-11","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点1 第一国际","no":"2","q":"第一国际的主要领导人是谁？","a":["主要领导：【马克思】是创始人和主要领导人。"],"star":1},{"id":"ls-p12-12","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点1 第一国际","no":"3","q":"第一国际成立的意义是什么？","a":["意义：标志着国际工人运动【走向联合】，进入了有组织、国际性斗争的【新阶段】。"],"star":1},{"id":"ls-p12-13","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"4","q":"巴黎公社成立的背景是什么？","a":["背景：1871年，法国在【普法战争】中失败，资产阶级政府对外投降、对内镇压。"],"star":1},{"id":"ls-p12-14","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"5","q":"巴黎公社的经过是怎样的？","a":["经过：1871年3月18日，巴黎人民起义；3月28日，【巴黎公社成立】；5月28日，失败（“【五月流血周】”）。"],"star":1},{"id":"ls-p12-15","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"6","q":"巴黎公社的措施之一：在政治机构方面做了什么？","a":["①废除旧军队、旧警察，建立新的【治安、司法和立法机构】。"],"star":2},{"id":"ls-p12-16","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"6","q":"巴黎公社的措施之二：对公职人员有什么规定？","a":["②公职人员由【民主选举】产生，限制公职人员薪资。"],"star":2},{"id":"ls-p12-17","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"6","q":"巴黎公社的措施之三：对逃亡资本家的工厂如何处理？","a":["③没收逃亡资本家的工厂，交由【工人管理】。"],"star":2},{"id":"ls-p12-18","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"6","q":"巴黎公社的措施之四：在教育方面实行什么制度？","a":["④实行小学【免费义务教育】。"],"star":2},{"id":"ls-p12-19","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"知识点2 巴黎公社","no":"7","q":"巴黎公社的性质与意义是什么？","a":["★性质与意义：世界上第一个【无产阶级政权】（【无产阶级专政】的第一次伟大尝试），丰富了马克思主义理论，为未来无产阶级革命留下了宝贵经验。"],"star":2},{"id":"ls-p12-20","page":12,"unit":"第七单元 第一次工业革命和马克思主义的诞生","lesson":"第21课 第一国际和巴黎公社","node":"本课必背一句话","q":"巴黎公社的历史地位——本课必背一句话是什么？","a":["巴黎公社是无产阶级推翻资产阶级统治、建立【无产阶级专政】的【第一次伟大尝试】。"],"star":1}],"paper":{"id":"ls-paper01","name":"九上历史·选择题100题冲刺专练","exam":"","source":"专练01九年级上册选择题100题冲刺2026-2027年期中历史必考重难点专练（解析版）.docx","questions":[{"no":1,"id":"ls-paper01-q001","unit":"第一单元 文明的产生与古代亚非文明","blocks":[{"t":"p","v":"《汉谟拉比法典》正文共有282条,包括诉讼程序、盗窃处罚、租佃雇佣关系、商业高利贷关系、债务、婚姻、遗产继承、奴隶等,比较全面地反映了古巴比伦的社会状况。上述材料反映了《汉谟拉比法典》的特点是（ ）"}],"opts":["内容广泛","思想落后","传播广泛","影响深远"],"ans":0,"why":{"A":"材料说明《汉谟拉比法典》一共 282 条，包括诉讼程序等众多社会领域，能够全面反映古巴比伦社会，直接体现内容广泛，正确。","B":"题干只列举法典包含的各类条文，没有描述观念落后、残酷压迫这类内容，不能得出思想落后的结论，错误。","C":"材料没有提到法典向外流传、被各地学习使用，不存在传播广泛的信息，错误。","D":"影响深远是指它对后世法律产生长久作用，本段材料没有讲后世影响，错误。"},"sol":""},{"no":2,"id":"ls-paper01-q002","unit":"第一单元 文明的产生与古代亚非文明","blocks":[{"t":"p","v":"《全球通史》记载，距今约一万年前后，西亚的居民开始驯化小麦和大麦，中国长江流域的居民培育出水稻，中美洲的居民则培育出玉米。这些地区的先民在互不往来的情况下，各自完成了从采集、狩猎到农耕的转变。这表明（ ）"}],"opts":["农耕技术自西亚向外扩散","早期国家产生于大河流域","世界文明起源具有多元性","文明演进具有同步性特点"],"ans":2,"why":{"A":"材料明确说各地先民互不往来、各自发展，不是西亚向外传播，错误。","B":"题干讲的是原始农耕起源，没有提到早期国家，和材料无关，错误。","C":"材料显示西亚、东亚、中美洲等不同地区各自独立培育出不同的农作物，说明世界农业文明的起源并非单一，而是具有多元性的特点，正确。","D":"题干未涉及不同地区农业发展的时间对比，且各地农业发展实际上并不同步，错误。"},"sol":""},{"no":3,"id":"ls-paper01-q003","unit":"第二单元 古代欧洲文明","blocks":[{"t":"p","v":"德国的一位法学家说：“罗马曾经三次征服世界：第一次以武力，第二次以宗教，第三次则以法律。而这第三次征服也许是其中最为平和、最为持久的一次。”“第三次则以法律征服世界”指的是（ ）"}],"opts":["古代哲学思想的形成","颁布《十二铜表法》","制定《汉谟拉比法典》","使用儒略历"],"ans":1,"why":{"A":"古代哲学思想属于古希腊的成就，不是罗马法律，错误。","B":"《十二铜表法》是罗马成文法的开端，罗马法是罗马留给后世最重要的法律遗产，正确。","C":"《汉谟拉比法典》是古巴比伦的法典，不是罗马，错误。","D":"儒略历是罗马的历法，不属于 “法律”，错误。"},"sol":""},{"no":4,"id":"ls-paper01-q004","unit":"第二单元 古代欧洲文明","blocks":[{"t":"p","v":"亚里士多德曾写道：“国家的面积应有一定的限度。”这样人民可以密集地参与社会和政治活动，最大限度地参与民主管理国家的事务。下面人物的统治最符合这一观点的是（ ）"}],"opts":["汉谟拉比","伯里克利","释迦牟尼","穆罕默德"],"ans":1,"why":{"A":"汉谟拉比是古巴比伦的君主，实行专制统治，不符合民主管理的要求，错误。","B":"题干中亚里士多德的观点是小国寡民的状态下，公民能广泛直接参与民主政治管理。伯里克利是古希腊雅典的执政者，雅典属于城邦小国寡民，在他统治时期雅典奴隶制直接民主政治发展到顶峰，全体成年男性公民可以广泛参与城邦民主事务，完全契合题干观点，正确。","C":"释迦牟尼是佛教创始人，并非国家统治者，和材料描述的政治统治无关，错误。","D":"穆罕默德是阿拉伯帝国的奠基者，建立的是统一的阿拉伯神权国家，推行的是集权统治，不符合小国寡民下的民主参与特征，错误。"},"sol":""},{"no":5,"id":"ls-paper01-q005","unit":"第一单元 文明的产生与古代亚非文明","blocks":[{"t":"p","v":"下列两幅图片共同反映了（ ）"},{"t":"img","src":"images/试卷/q005_1.webp"}],"opts":["奴隶社会，崇拜神灵","文明古国，亚洲领先","古老文字，形象会意","法制传统，源远流长"],"ans":3,"why":{"A":"两幅图片分别涉及古巴比伦的《汉谟拉比法典》和古埃及法老敕令，虽然都属于奴隶社会，但图片重点展示的是“文字记载的法律”，并非“崇拜神灵”，错误。","B":"古埃及位于非洲，并非亚洲，错误。","C":"图片中确实出现了楔形文字和象形文字，但文字在这里的用途是“记载法律/敕令”，突出的是法律层面，而非单纯的文字特征，错误。","D":"材料中“用楔形文字记载的石柱法”对应古巴比伦的《汉谟拉比法典》，“用象形文字记载法老敕令”对应古埃及的法律文献，两者均表明人类早期法制传统十分悠久，共同反映了“法制传统，源远流长”，正确。"},"sol":""},{"no":6,"id":"ls-paper01-q006","unit":"第四单元 中古时期的亚洲、非洲和美洲","blocks":[{"t":"p","v":"以下是某历史探究小组收集的一组图片。据此推断，他们探究的主题是（ ）"},{"t":"img","src":"images/试卷/q006_1.webp"}],"opts":["古代亚非文明","封建时代的欧洲","古代欧洲文明","封建时代的亚洲国家"],"ans":3,"why":{"A":"古代亚非文明多指早期大河文明，材料里日本幕府、阿拉伯帝国属于封建时期，不符合该主题，错误。","B":"图片内容是日本、阿拉伯相关史实，不属于欧洲，错误。","C":"图片对应的是亚洲地区文明，不是古代欧洲文明，错误。","D":"倭王印、源赖朝代表日本封建时代，伊斯兰教兴起、阿拉伯帝国属于亚洲阿拉伯地区封建文明，都属于封建时代的亚洲国家，正确。"},"sol":""},{"no":7,"id":"ls-paper01-q007","unit":"第四单元 中古时期的亚洲、非洲和美洲","blocks":[{"t":"p","v":"14世纪下半期西班牙人绘制的世界地图上，特意将手持金块的马里国王曼萨·穆萨作为西非的标志（见下图）。这一设计主要反映了（ ）"},{"t":"img","src":"images/试卷/q007_1.webp"}],"opts":["马里是当时世界上最强大的国家","黄金贸易是马里重要的财富来源","西班牙人对西非文明的崇拜","曼萨·穆萨是西非唯一的君主"],"ans":1,"why":{"A":"14世纪有很多实力强大的政权，马里只是西非强国，并非世界最强，错误。","B":"曼萨・穆萨统治时期，马里黄金资源丰富、黄金贸易兴盛，是马里重要的财富来源，正确。","C":"西班牙人绘制这个形象，主要是因为马里盛产黄金，并不是出于崇拜西非文明，错误。","D":"当时西非存在多个政权、多位君主，曼萨・穆萨并不是西非唯一的君主，错误。"},"sol":""},{"no":8,"id":"ls-paper01-q008","unit":"第三单元 封建时代的欧洲","blocks":[{"t":"p","v":"庄园在中世纪的西欧和日本曾经是长期存在的最基本的土地经营单位，二者的相似之处是（ ）"}],"opts":["庄园主和农民之间存在雇佣关系","庄园内耕地分为自营地和份地","庄园内组成了私人武装——武士集团","国王或天皇对庄园的控制力不强"],"ans":3,"why":{"A":"西欧庄园、日本庄园里是依附关系，不是雇佣关系，雇佣是资本主义的关系，错误。","B":"耕地分为自营地、份地，这只是西欧庄园的特点，日本庄园不是，错误。","C":"武士集团是日本庄园的产物，西欧庄园没有武士集团，错误。","D":"西欧庄园领主有很大自主权，日本庄园也逐渐获得 “不输不入” 特权，国王（天皇）对庄园控制力不强，这是二者的共同点。符合题意，正确。"},"sol":""},{"no":9,"id":"ls-paper01-q009","unit":"第四单元 中古时期的亚洲、非洲和美洲","blocks":[{"t":"p","v":"“（马里帝国）好事之一是，极少暴政……还有全境安靖，无论是居家还是旅行，不必担心盗贼或抢劫。”材料陈述的是马里帝国（ ）"}],"opts":["繁荣的原因","崛起的过程","改革的成效","衰落的表现"],"ans":0,"why":{"A":"题干材料描述马里帝国暴政极少、境内社会安定，民众居家、出行都无需担忧盗抢问题。稳定清明的社会环境是国家经济、社会能够稳步发展的重要支撑，属于马里帝国走向繁荣的核心有利条件，对应“繁荣的原因”，正确。","B":"崛起的过程侧重描述帝国从弱到强的扩张、发展阶段历程，和材料描述的社会治理特征不符，错误。","C":"材料仅泛泛提及马里帝国整体的社会治理状态，没有任何信息指向这一安定局面是由某场特定改革（如行政改革、军事改革、经济改革）带来的，无法将材料内容对应为改革的成果，错误。","D":"帝国衰落的典型特征通常是统治腐败、社会动荡、治安崩坏、国力衰退等，和材料里“极少暴政、全境安靖”的描述完全相悖，错误。"},"sol":""},{"no":10,"id":"ls-paper01-q010","unit":"第四单元 中古时期的亚洲、非洲和美洲","blocks":[{"t":"p","v":"模仿与创新相结合是日本民族的一大特色，下列能体现这一点的是（ ）"}],"opts":["大化改新","种姓制度","《汉谟拉比法典》","奴隶制民主政治"],"ans":0,"why":{"A":"大化改新是日本孝德天皇于646年颁布《改新之诏》后推行的改革。它以中国隋唐的政治经济制度为蓝本进行模仿，同时又参酌日本本土的旧有习俗进行创新调整，建立了中央集权的天皇制国家，使日本从奴隶社会过渡到封建社会。这充分体现了日本民族“模仿与创新相结合”的特色，正确。","B":"种姓制度是古代印度的社会等级制度，与日本无关，错误。","C":"《汉谟拉比法典》是古巴比伦王国的法律文献，与日本无关，错误。","D":"奴隶制民主政治是古代雅典（希腊）的政治制度，与日本无关，错误。"},"sol":""},{"no":11,"id":"ls-paper01-q011","unit":"第二单元 古代欧洲文明","blocks":[{"t":"p","v":"依据下面知识卡片的内容，可以判断该国是（ ）"},{"t":"tbl","rows":[[{"t":"地中海曾是它的“内湖”\n帝国的版图横跨欧亚非三洲\n和汉朝通过丝绸之路有过经贸交流\n4世纪末帝国分裂为东西两部分","imgs":[]}]]}],"opts":["罗马帝国","亚历山大帝国","阿拉伯帝国","奥斯曼帝国"],"ans":0,"why":{"A":"罗马帝国将地中海变成它的“内湖”，地跨欧亚非三洲，和汉朝通过丝绸之路有贸易往来，4世纪末分裂为东、西罗马帝国，符合卡片信息，正确。","B":"亚历山大帝国在亚历山大死后不久即分裂，没有在4世纪末分裂，和史实不符，错误。","C":"阿拉伯帝国鼎盛时期虽跨欧亚非，但没有把地中海变为“内湖”，错误。","D":"奥斯曼帝国兴起时间晚，和汉朝没有经贸往来，错误。"},"sol":""},{"no":12,"id":"ls-paper01-q012","unit":"第二单元 古代欧洲文明","blocks":[{"t":"p","v":"2世纪初，罗马帝国成为地跨欧亚非三洲的大帝国，拉丁文也随之不断向外传播，逐渐成为被征服地区的官方语言。材料表明帝国的扩张（ ）"}],"opts":["给被征服地区带来了灾难","有利于推行封建制君主专制","客观上促进人类文明传播","促使地中海成为帝国的内湖"],"ans":2,"why":{"A":"罗马帝国的扩张虽然在现实中有可能带来灾难，但材料的叙述重心是拉丁文的向外传播，而非扩张的破坏性影响，错误。","B":"罗马帝国属于奴隶制政权，并非封建制，材料也没有体现君主专制相关内容，错误。","C":"罗马帝国向外扩张的同时，拉丁文向外传播，成为被征服地区的官方语言，客观上促进人类文明传播，符合材料主旨，正确。","D":"虽然罗马帝国扩张使地中海成为内湖，但材料强调的是拉丁文的传播，而非地中海成为内湖这一结果，错误。"},"sol":""},{"no":13,"id":"ls-paper01-q013","unit":"综合","blocks":[{"t":"p","v":"李同学为参加学校主题活动而收集到如下材料，请判断活动的主题应该是（ ）"},{"t":"tbl","rows":[[{"t":"东西方文化大交汇","imgs":[]},{"t":"东西方文化交流发展新高度","imgs":[]},{"t":"东西方贸易和文化交流的金桥","imgs":[]}],[{"t":"沿途建立了许多希腊式城市。这些城市成为希腊文化与东方文化交汇的节点。埃及亚历山大港逐渐成为地中海世界的文化中心之一。","imgs":[]},{"t":"《后汉书》记载过罗马人到达洛阳的事迹。他们冒充罗马帝国使者觐见东汉皇帝、有的还获得了皇帝的赏赐。","imgs":[]},{"t":"许多希腊、罗马古典作品得以保存并流传到阿拉伯帝国，亚欧各地学者聚集在君士坦丁堡进行学术争论。","imgs":[]}]]}],"opts":["古代法律的传承与发展","古代文明的交流与互鉴","民主政治的兴起与极盛","封建制度的产生与衰落"],"ans":1,"why":{"A":"材料未提及任何古代法律相关内容，三则材料分别对应不同时期，不同形式的东西方文化贸易往来，核心指向不同文明之间的互动，错误。","B":"三则材料分别体现军事扩张带动文明交汇、官方外交往来、文化传播与学术交流，均属于古代文明交流与互鉴的范畴，正确。","C":"三则材料核心指向不同文明之间的互动，未涉及民主政治的发展等相关内容，错误。","D":"材料未提及封建制度的产生、衰落相关信息，三则材料核心指向不同文明之间的互动，错误。"},"sol":""},{"no":14,"id":"ls-paper01-q014","unit":"第二单元 古代欧洲文明","blocks":[{"t":"p","v":"“公元2世纪，帝国疆域达到最大规模，西起西班牙、不列颠，东到幼发拉底河上游，南至非洲北部，北达莱茵河与多瑙河一带，广袤的地中海成为帝国的‘内湖’。”材料描述的是（ ）"}],"opts":["亚历山大帝国","罗马共和国","罗马帝国","拜占庭帝国"],"ans":2,"why":{"A":"亚历山大帝国存在于公元前4世纪，时间与题干不符，错误。","B":"罗马共和国在公元前27年转变为帝国，公元2世纪已经不是共和国阶段，错误。","C":"公元2世纪罗马帝国疆域达到最大，地中海成为它的内湖，正确。","D":"拜占庭帝国是东罗马帝国，鼎盛时期是查士丁尼统治时期（527—565年），和题干的时间、疆域描述不匹配，错误。"},"sol":""},{"no":15,"id":"ls-paper01-q015","unit":"第二单元 古代欧洲文明","blocks":[{"t":"p","v":"腾讯上的一则新闻曾引起大家的广泛关注：《从古罗马的衰落，看金融对国家兴衰的影响》。文章论述了古罗马的兴衰史，你认为文中不可能提及（ ）"}],"opts":["《十二铜表法》让古罗马共和国量刑定罪有了法律依据","斯巴达克起义沉重打击了古罗马共和国","凯撒建立了罗马帝国","罗马帝国版图最鼎盛时，地中海是其“内湖”"],"ans":2,"why":{"A":"《十二铜表法》是罗马第一部成文法，使量刑定罪有了法律依据，正确。","B":"斯巴达克起义沉重打击了罗马共和国的统治，正确。","C":"建立罗马帝国的是屋大维（公元前27年），凯撒是共和国末期的独裁者，并未建立帝国，错误。","D":"罗马帝国版图最盛时地跨欧亚非三洲，地中海成为其“内湖”，正确。"},"sol":""},{"no":16,"id":"ls-paper01-q016","unit":"第一单元 文明的产生与古代亚非文明","blocks":[{"t":"p","v":"雅利安人进入印度后，逐渐建立了严格的社会等级制度，史称“种姓制度”，种姓制度下的各等级世代相袭，种姓制度森严，种姓内通婚，激化了社会矛盾，是佛教兴起的（ ）"}],"opts":["影响","特点","背景","目的"],"ans":2,"why":{"A":"“影响”是指佛教兴起之后带来的后续作用，与题干逻辑相反，错误。","B":"“特点”是事物本身具备的独有属性，种姓制度不是佛教兴起的属性特征，错误。","C":"种姓制度的森严压迫、激化社会矛盾的现实状况，是佛教能够在古印度兴起的特定社会前提条件，属于佛教兴起的背景，正确。","D":"题干中描述的种姓制度的森严压迫、激化社会矛盾的社会现实，是佛教兴起之前就已经存在的客观社会环境，并非佛教兴起的目的，错误。"},"sol":""},{"no":17,"id":"ls-paper01-q017","unit":"第四单元 中古时期的亚洲、非洲和美洲","blocks":[{"t":"p","v":"某历史兴趣小组在研学旅行时，到达目的地麦地那，参观了清真寺，了解了穆斯林的生活习俗。该研学旅行的主题与哪一人物有关（ ）"}],"opts":["耶稣","释迦牟尼","穆罕默德","马丁·路德"],"ans":2,"why":{"A":"耶稣是基督教的创始人，和麦地那、穆斯林无关，不符合题意，错误。","B":"释迦摩尼是佛教的创始人，不符合题意，错误。","C":"穆罕默德在阿拉伯半岛创立伊斯兰教，穆斯林是伊斯兰教信徒，麦地那是伊斯兰教发展史上的重要地点，和史实吻合，正确。","D":"马丁路德是宗教改革的代表人物，和伊斯兰教、麦地那无关，不符合题意，错误。"},"sol":""},{"no":18,"id":"ls-paper01-q018","unit":"第四单元 中古时期的亚洲、非洲和美洲","blocks":[{"t":"p","v":"7世纪初，穆罕默德在阿拉伯半岛创立了 ，后来这一宗教推动了阿拉伯半岛的统一。（ ）"}],"opts":["佛教","基督教","伊斯兰教","道教"],"ans":2,"why":{"A":"“佛教”于公元前6世纪在古印度诞生，创立者是乔达摩·悉达多，与材料时间、地点、创立者均不符，错误。","B":"“基督教”于1世纪在巴勒斯坦地区诞生，据传创立者是耶稣，与材料时间、地点、创立者均不符，错误。","C":"7世纪初，穆罕默德在阿拉伯半岛的麦加创立伊斯兰教，它促进了阿拉伯半岛的思想统一，进而推动了阿拉伯半岛走向统一，正确。","D":"“道教”是中国本土宗教，与阿拉伯半岛无关，错误。"},"sol":""},{"no":19,"id":"ls-paper01-q019","unit":"第一单元 文明的产生与古代亚非文明","blocks":[{"t":"p","v":"在日常生活中，我们常常接触到“众生平等”、“大慈大悲”、“阿弥陀佛”、“觉悟”等词语，这些词语与下列哪一宗教有关（ ）"}],"opts":["印度教","基督教","伊斯兰教","佛教"],"ans":3,"why":{"A":"印度教由古印度婆罗门教慢慢发展演变而来，支持、认可种姓制度，认为人天生有高低等级，等级是生来固定的。与材料不符，错误。","B":"基督教教导人们忍受苦难，死后可以升入 “天堂”，与题干内容不符，错误。","C":"伊斯兰教的创始人是穆罕默德，相信安拉是宇宙万物的创造者、恩养者和唯一的主宰，与题干内容不符，错误。","D":"公元前6世纪，乔达摩·悉达多创立佛教，佛教宣扬“众生平等”，反对婆罗门的特权地位。它认为“四大皆空”，劝人们“忍耐服从”为很多统治者接受，大力扶持佛教。“众生平等”“大慈大悲”“阿弥陀佛”“觉悟” 都是佛教的典型用语，正确。"},"sol":""},{"no":20,"id":"ls-paper01-q020","unit":"第一单元 文明的产生与古代亚非文明","blocks":[{"t":"p","v":"在方文山填词的某歌曲中用歌词传递了历史——“思念像底格里斯河般的漫延……深埋在美索不达米亚平原”，下列属于在此地诞生的文明成就的是（ ）"}],"opts":["金字塔","阿拉伯数字","楔形文字","象形文字"],"ans":2,"why":{"A":"金字塔是古埃及文明成就，诞生于尼罗河流域，不是两河流域的美索不达米亚平原，错误。","B":"阿拉伯数字起源于古印度，属于印度河流域文明成果，和两河流域无关，错误。","C":"楔形文字是两河流域（美索不达米亚平原）的苏美尔人创造的文字，正确。","D":"象形文字是古埃及人发明的文字，诞生在尼罗河流域，和两河流域无关，错误。"},"sol":""},{"no":21,"id":"ls-paper01-q021","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"从14世纪中叶到16世纪，欧洲出现了对古典文明的再发现，但最令人感兴趣的成就都是全新的，因此，当时主要是“兴”，而不是“复兴”。其中的“兴”是指（ ）"}],"opts":["对古典文化的全面继承","中世纪西欧城市的兴起","资产阶级思潮逐渐流行","基督教在西欧的进一步传播"],"ans":2,"why":{"A":"文艺复兴是借助古典文化宣传新思想，并非全盘继承古典文化，错误。","B":"城市兴起时间早于14世纪中叶，和题干时间、事件不符，错误。","C":"文艺复兴核心是人文主义，属于新兴资产阶级的思想解放思潮，对应题干里的“兴”，正确。","D":"文艺复兴一定程度冲击了教会思想束缚，不是推动基督教传播，错误。"},"sol":""},{"no":22,"id":"ls-paper01-q022","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"12世纪前后，中世纪的艺术还未涉及儿童。13世纪末，儿童只是身材缩小的成人。15、16世纪的意大利出现了很多表现孩子天真、可爱的世俗画，儿童逐渐被发现。17世纪后，孩子被看作是家庭中的重要成员，关注子女教育成为新风气。导致“儿童被发现”的主要文化因素是（ ）"}],"opts":["家庭教育观念的变化","父母受教育程度提升","人文主义思想的传播","城市化进程持续加快"],"ans":2,"why":{"A":"家庭教育观念的变化是“儿童被发现”之后带来的结果、表现，不是推动这一变化的文化原因，错误。","B":"题干说的是在17世纪后，孩子被看作是家庭中的重要成员，没有说到父母受教育程度提升，错误。","C":"15、16世纪意大利正值文艺复兴，人文主义重视人、尊重人的价值，承认儿童独立的特点，不再把儿童单纯当成缩小版成人，推动了“儿童被发现”，符合题意，正确。","D":"题干侧重于文化因素，与城市化（经济社会因素）无关，错误。"},"sol":""},{"no":23,"id":"ls-paper01-q023","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"作为文艺复兴时期的代表人物，“文学三杰”与“美术三杰”的共同之处是（ ）"}],"opts":["提倡神权至上","宣扬人文主义","推崇民主政治","重视科学研究"],"ans":1,"why":{"A":"文艺复兴的核心是反对神权至上，提倡以人为中心，与“神权至上”相矛盾，错误。","B":"文艺复兴的核心思想是人文主义，文学三杰（但丁、彼特拉克、薄伽丘）和美术三杰（达·芬奇、米开朗基罗、拉斐尔）都以人文主义为创作核心，主张关注人的价值和现实生活，正确。","C":"文艺复兴是文化思想运动，并非政治运动，与“民主政治”无关，错误。","D":"重视科学研究是文艺复兴后期部分人物的特点，但并非文学三杰与美术三杰的共同之处，错误。"},"sol":""},{"no":24,"id":"ls-paper01-q024","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"据题表可知，当时英国手工工场（ ）"},{"t":"tbl","rows":[[{"t":"题表：英国手工工场情况表","imgs":[]}],[{"t":"时间","imgs":[]},{"t":"工场经营情况","imgs":[]}],[{"t":"1562年","imgs":[]},{"t":"利克啤酒厂外国雇工人数达18位，每年生产上千桶的啤酒","imgs":[]}],[{"t":"1565年","imgs":[]},{"t":"罗伯特布里奇钢铁厂雇用了30位国外工人从事生产","imgs":[]}],[{"t":"1637年","imgs":[]},{"t":"莫特雷克挂毯工场的140名工人几乎全部来自荷兰等低地国家","imgs":[]}]]}],"opts":["生产效率提高","雇佣工人劳动","分工日益细化","扩大生产规模"],"ans":1,"why":{"A":"题中表格仅记录了雇工数量和部分产量，没有体现单位时间产出、技术改进等能证明生产效率提升的信息，无法得出该结论，错误。","B":"表格里的三家手工工场都明确出现了雇工、雇佣工人从事生产的描述，直接体现出这些手工工场都采用雇佣工人劳动的生产模式，符合史实和表格信息，正确。","C":"题中表格没有提及生产环节的拆分、不同工种的细分相关内容，无法体现分工细化，错误。","D":"表格仅呈现了三个不同工场的雇工数据，没有展示同一家工场前后规模变化的对比，不能得出“当时英国手工工场整体在扩大生产规模”的结论，错误。"},"sol":""},{"no":25,"id":"ls-paper01-q025","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"“富裕的农民反而成了土地的拥有者，为了解决同样存在的劳动力问题，富裕农民会雇佣贫穷的农民来自己的农场工作。”材料情境主要出现在（ ）"}],"opts":["雅典城邦","租地农场","日本庄园","手工工场"],"ans":1,"why":{"A":"雅典城邦的土地制度以小农个体所有为主，同时存在贵族占有大量土地的情况，其典型的剥削方式是债务奴隶制，并不存在富裕农民集中土地、雇佣贫困农民从事规模化农场经营的主流生产模式，错误。","B":"中世纪晚期欧洲出现租地农场，富裕农民通过承租、购买等方式集中土地，成为土地的实际经营者，雇佣少地或无地的贫苦农民进行生产，属于资本主义性质的农业生产经营模式，正确。","C":"日本庄园的实际管理者是庄园主，庄园的主要劳作群体是依附于庄园的农奴、依附农民等人口，以劳役地租为主要剥削形式，不存在“富裕农民作为土地拥有者、雇佣自由贫穷农民开展生产”的特征，错误。","D":"手工工场属于手工业领域的生产组织形式，核心是商人雇佣工人在工场中从事手工生产，生产对象是手工业产品，错误。"},"sol":""},{"no":26,"id":"ls-paper01-q026","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"文艺复兴时期掌握政治权力的是君主，他们是文艺复兴的支持者和保护者，也是最直接的受益者。但是，由“大写的人站起来”开启的世俗化进程，最终会实质性地摧毁君主制。此观点旨在说明文艺复兴（ ）"}],"opts":["实现了人性的追求","倡导了人人平等思想","冲破了神学的束缚","客观上推动民主进程"],"ans":3,"why":{"A":"“实现人性追求”是文艺复兴的直接目标，未体现对君主制的冲击，错误。","B":"“人人平等”是启蒙运动的重要主张，出现时间晚于文艺复兴，且与材料强调的文艺复兴对君主制的影响无关，错误。","C":"“冲破神学束缚”是文艺复兴的作用，但材料侧重政治结果而非宗教层面，错误。","D":"“‘大写的人站起来’开启的世俗化进程，最终会实质性地摧毁君主制”说明文艺复兴通过人文主义思想推动世俗化，文艺复兴虽由君主支持，但客观上为民主政治创造了条件，削弱了君主制的根基，正确。"},"sol":""},{"no":27,"id":"ls-paper01-q027","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"14—16世纪，英国共建立了67个租地农场（牧场），其中有37个面积超过200英亩，这些农场大量雇佣劳动力进行生产。这一现象（ ）"}],"opts":["推广了农业庄园式劳作方式","体现农业经营方式的近代化","反映了土地国有化迅速发展","表明圈地运动逐渐走向衰退"],"ans":1,"why":{"A":"农业庄园式劳作方式是封建社会的典型特征，以农奴制为基础。题干中“租地农场”和“雇佣劳动力”正是对传统庄园经济的瓦解，而不是推广，错误。","B":"农业经营方式的近代化（即资本主义化）主要表现为：规模化经营、雇佣劳动力生产、产品面向市场。题干中“租地农场”和“大量雇佣劳动力”正是农业经营方式走向近代化的具体体现，符合题意，正确。","C":"14—16世纪的英国，土地主要是通过圈地运动等方式逐渐集中到新贵族和资产阶级手中，变成私有的大农场，而不是“土地国有化”，错误。","D":"14—16世纪正是英国圈地运动兴起和发展的时期。圈地运动剥夺了农民的土地，为租地农场提供了大量廉价的雇佣劳动力，促进了租地农场的发展，而非走向衰退，错误。"},"sol":""},{"no":28,"id":"ls-paper01-q028","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"下面是一部有关“文艺复兴”的历史著作的部分目录，此目录内容突出体现了文艺复兴（ ）"},{"t":"tbl","rows":[[{"t":"第一章 宗教下的束缚与解放\n第一节 祝福与忏悔并存\n第二节 教会的力量\n第三节 拨开乌云见天日\n第二章 舞动的精灵\n第一节 艺术领域的先行者\n第二节 巨人的时代\n第三节 掩藏在阴谋之下\n……","imgs":[]}]]}],"opts":["发扬个性，肯定人的价值","解放思想，推动文化繁荣","打击教会，冲击封建统治","反对禁欲，促进经济发展"],"ans":1,"why":{"A":"材料中“宗教下的束缚与解放”“拨开乌云见天日”“艺术领域的先行者”“巨人的时代”等内容，主要围绕冲破宗教束缚和艺术文化的发展展开，并未侧重体现“发扬个性，肯定人的价值”这一具体内涵，错误。","B":"材料中“宗教下的束缚与解放”“拨开乌云见天日”体现了思想上的解放，“艺术领域的先行者”“巨人的时代”体现了文化艺术的繁荣，这些内容共同突出了文艺复兴解放思想、推动文化繁荣的特点，正确。","C":"材料涉及的是宗教束缚下的思想解放和艺术发展，并未直接体现对教会和封建统治的打击，错误。","D":"材料中“宗教下的束缚与解放”“拨开乌云见天日”涉及冲破禁欲等宗教束缚，但并未提及“促进经济发展”的内容，错误。"},"sol":""},{"no":29,"id":"ls-paper01-q029","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"在近代前期，英国强调古希腊、罗马文化，以对抗中世纪的封建文化，于是许多希腊和拉丁词汇进入英语。据此推断，影响这一时期英语词汇发展的主要事件是（ ）"}],"opts":["文艺复兴运动","十字军东征","新航路的开辟","古代罗马的扩张"],"ans":0,"why":{"A":"文艺复兴运动以复兴古希腊、罗马文化为旗号，反对中世纪封建教会文化，推动大量希腊、拉丁词汇融入英语，正确。","B":"十字军东征属于中世纪对外军事远征，主旨不是复兴古典文化，错误。","C":"新航路开辟主要是探寻新航线、开展海外殖民，和复兴古希腊罗马文化无关，错误。","D":"古代罗马扩张发生在古罗马时期，不属于近代前期，错误。"},"sol":""},{"no":30,"id":"ls-paper01-q030","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"如下表反映了这一时期的时代特征是（ ）"},{"t":"tbl","rows":[[{"t":"13—14世纪","imgs":[]},{"t":"欧洲农村出现新的生产和经营方式，促使早期资产阶级产生","imgs":[]}],[{"t":"14世纪中叶","imgs":[]},{"t":"形成中的资产阶级在反封建的长期斗争中，掀起了思想解放运动——文艺复兴","imgs":[]}],[{"t":"15世纪开始","imgs":[]},{"t":"开拓者将探索目标推向更加广袤的海域，世界历史进入大航海时代","imgs":[]}]]}],"opts":["走向近代","资本主义制度确立","工业时代来临","共产主义运动兴起"],"ans":0,"why":{"A":"表格里新生产经营方式出现、文艺复兴、新航路开辟，都是欧洲步入近代的重要表现，时代特征为走向近代，符合题意，正确。","B":"资本主义制度确立是英法美早期资产阶级革命之后，和表格时间不符，错误。","C":"工业时代来临开始于第一次工业革命，时间晚于材料时段，错误。","D":"共产主义运动兴起是19世纪，与题干时间不符，错误。"},"sol":""},{"no":31,"id":"ls-paper01-q031","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"16世纪，西班牙人到达并征服墨西哥部分地区后，将当地可可豆（巧克力原料）的饮用方法带回欧洲。之后，巧克力饮品在贵族中备受推崇，进而在意大利、法国和英国流行。巧克力的流行说明（ ）"}],"opts":["物种交换丰富饮食","军事征服改变习俗","海外殖民激化矛盾","国家交流改良技术"],"ans":0,"why":{"A":"可可豆原产美洲，原本欧洲没有这个物种。随着新航路开辟，美洲物产传入欧洲，形成跨洲物种交换，巧克力成为新饮品，丰富了欧洲人的饮食。材料核心就是美洲物种传到欧洲并流行，正确。","B":"西班牙的军事征服只是这件事发生的背景，不是材料要表达的主旨。材料并没有说欧洲原有习俗被武力强行改变；可可饮品是人们主动喜爱、自发流行，不是由于征服而被强制改变的习俗，错误。","C":"整段材料只提到物种交换，没有提到冲突、反抗、矛盾、斗争相关内容，错误。","D":"材料只说了把可可的饮用方法带回欧洲、饮品流行，没有提到改良生产、加工技术；而且这一时期是殖民掠夺，也不是平等的国家交流，错误。"},"sol":""},{"no":32,"id":"ls-paper01-q032","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"新航路的开辟促进了世界各大洲之间的联系。最先开辟新航路的两个国家是（ ）"}],"opts":["英国、法国","西班牙、葡萄牙","英国、荷兰","意大利、荷兰"],"ans":1,"why":{"A":"英国、法国参与海外殖民扩张的时间晚于西班牙、葡萄牙，属于后续跟进的国家，并非最先开辟新航路的国家，错误。","B":"西班牙、葡萄牙最早支持并完成开辟新航路的关键航海活动，正确。","C":"英国、荷兰的海外殖民崛起时间更晚，其中荷兰在17世纪才凭借海上贸易优势成为殖民强国，不属于最先开辟新航路的国家，错误。","D":"意大利城邦并未主导早期远洋新航路探险活动，荷兰崛起时间晚，不符合“最先”的要求，错误。"},"sol":""},{"no":33,"id":"ls-paper01-q033","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"哥伦布和达·伽马船队旗舰都属于卡拉克型帆船。15世纪经欧洲人改造后，它们既能在大西洋的强风中高速行驶，也能在地中海和非洲沿岸多变的海风中较好操控。据此可知，卡拉克型帆船的改造（ ）"}],"opts":["激起欧洲人对东方的向往","主要用于贩卖黑人奴隶","助力首次环球航行的完成","为远洋航海提供了条件"],"ans":3,"why":{"A":"材料强调卡拉克型帆船改造后的航行性能，并未涉及欧洲人对东方的向往，且欧洲人对东方的向往是开辟新航路的社会动因，与帆船改造本身无直接因果关系，错误。","B":"材料提到卡拉克型帆船用于哥伦布和达·伽马的远洋航行，并未体现其主要用于贩卖黑人奴隶，且黑奴贸易主要发生在后来，错误。","C":"首次环球航行由麦哲伦船队完成，并非哥伦布和达·伽马船队，且材料未涉及环球航行，错误。","D":"材料中“既能在大西洋的强风中高速行驶，也能在地中海和非洲沿岸多变的海风中较好操控”说明卡拉克型帆船改造后适应了不同海域的航行条件，提高了远洋航行的安全性和效率，为哥伦布、达·伽马等人的远洋航海提供了条件，正确。"},"sol":""},{"no":34,"id":"ls-paper01-q034","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"“由于商品经济的发展和资本主义萌芽，欧洲各国对铸造货币的黄金的需求量日益增大，由于陆上交通被奥斯曼土耳其切断，商业危机促使欧洲人开辟新的航路。……”这段叙述可以用来说明（ ）"}],"opts":["新航路开辟的过程","新航路开辟的背景","新航路开辟的消极影响","新航路开辟的积极影响"],"ans":1,"why":{"A":"过程指的是新航路开辟的路线、时间等，这与题干不符，错误。","B":"题干说的是商品经济、资本主义萌芽（根本原因）、欧洲渴求黄金、奥斯曼帝国阻断传统商路（直接原因），这些都是推动欧洲人开辟新航路的原因，属于新航路开辟的背景，正确。","C":"消极影响一般指殖民掠夺、黑奴贸易、殖民地灾难等后果，与题意不符，错误。","D":"积极影响一般指世界开始连为一个整体、促进欧洲资本主义发展等结果，不符合题意，错误。"},"sol":""},{"no":35,"id":"ls-paper01-q035","unit":"第五单元 走向近代","blocks":[{"t":"p","v":"时空观念是历史学科五大核心素养之一。观察下面“新航路开辟路线”图，选出人物与图中路线对应正确的一组是（ ）"},{"t":"img","src":"images/试卷/q035_1.webp"}],"opts":["①达·伽马","②哥伦布","③迪亚士","④麦哲伦及船队"],"ans":3,"why":{"A":"地图
