<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>核心考点训练</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf8; --ink:#22201d; --sub:#6b6560; --line:#e2ddd2;
  --acc:#1f6f8b; --acc-soft:#e3eff4; --ok:#1f7a4d; --ok-soft:#e2f3e9;
  --bad:#b3352c; --bad-soft:#fbe7e4; --warn:#b06a11; --warn-soft:#fdf0dc;
  --r:14px; --sh:0 2px 10px rgba(40,35,30,.07);
}
html[data-subj="历史"]{ --acc:#9a5b18; --acc-soft:#f6ecdd; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.75 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button,select,input{font-family:inherit}
/* hidden 属性统一用 display:none 收口：下面 .resume{display:flex} 会把 [hidden] 覆盖掉，
   历史首页因此一直挂着一条空白「继续上次」横条 */
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 90px}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:860px;margin:0 auto;padding:10px 14px 0}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{font-size:17px;letter-spacing:.3px}
.brand span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);
  padding:7px 13px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s;
}
.tabs button:hover{border-color:var(--acc);color:var(--acc)}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

/* ---------- 统计条 ---------- */
.bar{display:flex;flex-direction:column;gap:7px;margin:12px 0 4px;font-size:13px;color:var(--sub)}
.bar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill b{color:var(--ink);font-size:14px}
.pill.ok b{color:var(--ok)} .pill.bad b{color:var(--bad)}
.bar select{font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);max-width:190px}
.bar select#pp{max-width:240px}   /* 卷名比单元名长，给它宽一点 */
.bar select#fs{max-width:118px}
.bar .sp{flex:1}
.linkbtn{background:none;border:0;color:var(--acc);font-size:13px;cursor:pointer;padding:4px 2px;text-decoration:underline dotted}
.prog{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 0}
.prog>i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}

/* ---------- 续练提示（退出/刷新后回到上次位置） ---------- */
.resume{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0;padding:8px 12px;
  border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;
  background:var(--acc-soft);font-size:13px;line-height:1.6;color:#1c4a5c}
.resume b{color:var(--acc);font-weight:700}
.resume .sp{flex:1}
.resume .muted{color:var(--sub);font-size:12px}
.resume .rbtns{display:flex;gap:6px;flex-wrap:wrap}
.resume button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 11px;font-size:12.5px;color:var(--acc);cursor:pointer}
.resume button:hover{border-color:var(--acc)}
.resume button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
/* 套卷：重做提示条 + 错题本 */
.pnote{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0;padding:8px 12px;
  border-left:3px solid var(--acc);background:var(--acc-soft);border-radius:0 9px 9px 0;font-size:13px;color:#6b4a1c}
.pnote b{color:#5a3c12}
.pnote button{flex:0 0 auto}
.wbrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line)}
.wbrow:last-child{border-bottom:0}
.wbm{min-width:0;flex:1 1 240px}
.wbline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.wbbtns{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 18px 16px;margin-top:14px}
.meta{display:flex;align-items:baseline;gap:10px;font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:10px;word-break:break-word}
.meta .mt{flex:1 1 auto;min-width:0}
.meta .mr{flex:0 0 auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.meta .u{color:var(--acc);font-weight:600}
/* 这张卡累计对/错次数（答对不清零，方便看"同一处反复错"） */
.meta .statx{display:inline-block;margin-left:8px;padding:0 7px;border:1px solid var(--line);
  border-radius:99px;font-size:11px;color:var(--sub);background:#fff;white-space:nowrap}
.meta .statx b{font-weight:700;color:var(--ink)}
.meta .statx b.ok{color:var(--ok)}
.meta .statx b.bad{color:var(--bad)}
/* ④ 错题强化里附带的「试卷错题」清单 */
.pwrong{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.pwrong:last-of-type{border-bottom:0}
.pwrong .wq{font-weight:700}
.pwrong .wunit{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.pwrong .wcnt{color:var(--bad);font-size:12px;font-weight:600}
.pwrong .sp{flex:1}
details.k>summary .cnt{flex:0 0 auto;font-size:11px;color:var(--sub);white-space:nowrap;padding-top:2px}
details.k>summary .cnt b{font-weight:700;color:var(--bad)}
.meta .pg a{color:var(--sub);text-decoration:none;border-bottom:1px dotted var(--line)}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px;vertical-align:2px}
.q{font-size:19px;line-height:1.65;font-weight:600;margin:0 0 4px}
.q .tag{display:inline-block;font-size:12px;font-weight:500;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:1px 7px;margin-right:7px;vertical-align:2px}
.ans{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.ans .ln{margin:0 0 9px;line-height:1.95}
.ans .ln:last-child{margin-bottom:0}
.ans .lead{color:var(--sub);font-size:12px;margin:0 0 8px}
.kw{font-style:normal;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:0 3px;box-decoration-break:clone}
.hidekw .kw{color:transparent;background:#efece5;border-radius:4px;cursor:pointer;user-select:none}
.hidekw .kw:hover{color:var(--bad);background:var(--bad-soft)}
.warn{margin-top:8px;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:7px 12px;font-size:13.5px;color:#6d4a12;line-height:1.7}
.warn b{color:var(--warn);margin-right:5px;font-size:12px}
.warn.k-必背{background:var(--acc-soft);border-left-color:var(--acc);color:#1c4a5c}
.warn.k-必背 b{color:var(--acc)}
.warn.k-注意{background:#fdf6e3;border-left-color:#d9a520;color:#6b5312}
.warn.k-注意 b{color:#b8860b}
.warn.k-补充{background:#f3f1ec;border-left-color:#c6bfb2;color:var(--sub);font-size:12.5px}
.warn.k-补充 b{color:#9a9288}
table.tb{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;line-height:1.7}
table.tb th{background:var(--acc-soft);color:var(--acc);font-weight:600;font-size:13px}

/* ---------- 填空 ---------- */
.bi{
  font-size:15px;padding:0 6px;margin:0 2px;border:0;border-bottom:2px dashed var(--acc);
  background:transparent;border-radius:5px 5px 0 0;color:var(--ink);text-align:center;min-width:56px;
}
.bi::placeholder{color:#bdb7ac}
.bi:focus{outline:2px solid var(--acc);outline-offset:1px;background:#fff;border-bottom-style:solid}
.bi.ok{background:var(--ok-soft);border-bottom-style:solid}
.bi.bad{background:var(--bad-soft);border-bottom-style:solid;text-decoration:line-through}
.given{color:var(--ok);font-weight:700;white-space:nowrap}
.given::before{content:"→";font-weight:400;color:var(--sub);margin:0 1px}

/* ---------- 选项 ---------- */
.opts{display:grid;gap:9px;margin-top:14px}
.opts button{
  text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-size:16px;line-height:1.6;cursor:pointer;transition:.12s;color:var(--ink);
}
.opts button:hover{border-color:var(--acc);background:var(--acc-soft)}
.opts button:disabled{cursor:default;opacity:.9}
.opts button.c{background:var(--ok-soft);border-color:var(--ok);font-weight:700;color:var(--ok)}
.opts button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opts button .kk{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;background:var(--bg);font-size:12px;margin-right:9px;color:var(--sub)}

/* ---------- 底部操作 ---------- */
.acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.p:hover{filter:brightness(1.08);color:#fff}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.verdict{margin-top:14px;border-radius:10px;padding:11px 14px;font-size:15px;line-height:1.7}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bfe3cd}
.verdict.bad{background:var(--bad-soft);color:var(--bad);border:1px solid #f0c8c2}
.verdict b{font-size:16px}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--sub)}
.nav .btn{flex:0 0 auto}
.empty{text-align:center;color:var(--sub);padding:46px 10px;font-size:15px;line-height:2}
.empty .big{font-size:34px;display:block;margin-bottom:6px}

/* ---------- 清单 ---------- */
.unitbox{margin-top:16px}
.unitbox>h3{font-size:15px;margin:0 0 8px;padding:8px 12px;background:var(--acc-soft);color:var(--acc);border-radius:9px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.unitbox>h3 span{font-size:12px;font-weight:400;color:var(--sub)}
details.k{margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
details.k>summary{cursor:pointer;padding:11px 14px;font-size:15px;font-weight:600;line-height:1.6;list-style:none;display:flex;gap:8px;align-items:flex-start}
details.k>summary::-webkit-details-marker{display:none}
details.k>summary::before{content:"▸";color:var(--acc);flex:0 0 auto;transition:.15s}
details.k[open]>summary::before{transform:rotate(90deg)}
details.k>summary:hover{background:var(--acc-soft)}
details.k .bd{padding:0 14px 14px}
.lv{flex:0 0 auto;font-size:11px;font-weight:500;border-radius:6px;padding:1px 7px;margin-top:4px}
.lv0{background:#eee;color:#8b8b8b}.lv1{background:var(--warn-soft);color:var(--warn)}
.lv2{background:var(--acc-soft);color:var(--acc)}.lv3{background:var(--ok-soft);color:var(--ok)}
.lv4{background:var(--bad-soft);color:var(--bad)}
.searchbox{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;margin-top:12px}
.report{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:16px}
.report h3{margin:0 0 8px;font-size:15px}
.report ul{margin:0;padding-left:20px;font-size:14px;line-height:1.9}
.report li b{color:var(--bad)}
.ubars{margin:8px 0 0}
.ubar{display:flex;align-items:center;gap:9px;font-size:13px;margin:5px 0;color:var(--sub)}
.ubar .nm{flex:0 0 246px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubar .tr{flex:1;height:7px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.ubar .tr i{display:block;height:100%;background:var(--ok);width:0}
.ubar .pc{flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}

/* ---------- 套卷（⑥） ---------- */
.pstem{font-size:17px;line-height:1.8;font-weight:600;margin:0 0 10px}
.pstem p{margin:0 0 8px}
.pstem p:last-child{margin-bottom:0}
.figs{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 12px}
.figs figure{margin:0;flex:1 1 200px;min-width:120px;max-width:100%}
.figs img{width:100%;height:auto;border:1px solid var(--line);border-radius:9px;background:#fff;display:block}
.ptbl{width:100%;border-collapse:collapse;margin:4px 0 12px;font-size:14px;table-layout:auto}
.ptbl td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;line-height:1.75}
.ptbl td.cap{background:var(--acc-soft);color:var(--acc);font-weight:600;border-color:var(--acc-soft)}
.ptbl td img{max-width:100%;height:auto;border-radius:7px;display:block;margin:0 0 6px}
.ptbl .tx{white-space:pre-line;display:block}
.whybox{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
.whybox .lead{color:var(--sub);font-size:12px;margin:0 0 8px}
.whyrow{display:flex;gap:9px;font-size:14.5px;line-height:1.85;margin:0 0 8px;color:var(--sub)}
.whyrow .k{flex:0 0 auto;width:21px;height:21px;line-height:21px;text-align:center;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--sub);margin-top:3px}
.whyrow.right{color:var(--ink)}
.whyrow.right .k{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.whyrow.right .tx{font-weight:600}
.whysol{font-size:14.5px;line-height:1.9;white-space:pre-line}
.pno{font-variant-numeric:tabular-nums}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.jump button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--bad)}
.jump button:hover{border-color:var(--acc);color:var(--acc)}
.optrow{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:15.5px;line-height:1.65;margin:0 0 8px;background:#fff}
.optrow .kk{flex:0 0 auto;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;background:var(--bg);font-size:12px;color:var(--sub);margin-top:2px}
.optrow.c{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.optrow.c .kk{background:var(--ok);color:#fff}
/* 主观题（材料题）：先写 → 对照参考答案 → 逐条勾采分点 */
.subask{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:15.5px;line-height:1.85;
  margin:12px 0 0;padding:10px 13px;border-left:3px solid var(--acc);background:var(--acc-soft);border-radius:0 8px 8px 0}
.subask .kk{flex:0 0 auto;font-weight:700;color:var(--acc)}
.subask .sc{flex:0 0 auto;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:1px 8px;background:#fff}
.refans{margin:10px 0 0;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#fff}
.refans .lead{font-size:12px;color:var(--sub);margin:0 0 6px}
.refans .tx{font-size:14.5px;line-height:1.9;white-space:pre-line}
.ptline{margin:10px 0 0;border-top:1px dashed var(--line);padding-top:9px}
.ptline .cap2{font-size:12px;color:var(--sub);margin:0 0 6px}
.ptitem{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;line-height:1.7;color:var(--sub);cursor:pointer;padding:3px 0}
.ptitem input{margin:4px 0 0;flex:0 0 auto}
.ptitem.on{color:var(--ok);font-weight:600}
.selfbar{font-size:13px;color:var(--sub);margin:12px 0 0}
.selfbar b{color:var(--acc);font-size:17px}
.scoreline{font-size:15px;line-height:2}
.scoreline b{font-size:22px;color:var(--acc);margin:0 3px}

@media (max-width:520px){
  /* 手机端整体小一档：正文 16→15px、题干 19→16.5px、行高 1.75→1.68，
     顶栏/统计条/卡片一起收紧，一屏大约能多显示 15%–20% 的内容 */
  body{font-size:15px;line-height:1.68}
  .wrap{padding:0 12px 72px}
  .hd{padding:8px 12px 0}
  .brand b{font-size:14.5px}
  .brand span{font-size:11.5px}
  .tabs{gap:5px;padding:6px 0 7px}
  /* 六个标签尽量一屏放下，手机上不用横向滚才发现 ⑥ */
  .tabs button{padding:5px 9px;font-size:12.5px}
  .bar{font-size:12px;gap:6px;margin:9px 0 2px}
  .bar .row{gap:5px}
  .pill{padding:2px 8px}
  .pill b{font-size:13px}
  .bar select{font-size:12.5px;padding:3px 7px;max-width:108px}
  .bar select#pp{max-width:150px}
  .bar select#fs{max-width:84px}
  .linkbtn{font-size:12px;padding:3px 2px}
  .prog{margin:6px 0 0}
  .resume{margin-top:9px;padding:7px 10px;font-size:12.5px;gap:6px;border-radius:0 9px 9px 0}
  .resume .sp{display:none}
  .resume .rtext{flex:1 1 100%}
  .resume .muted{font-size:11.5px}
  .resume button{font-size:12px;padding:3px 8px}
  .card{padding:13px 12px 12px;margin-top:10px}
  .meta{font-size:11.5px;margin-bottom:8px}
  .q{font-size:16.5px;line-height:1.55}
  .q .tag{font-size:11px}
  .ans{margin-top:11px;padding-top:10px}
  .ans .ln{line-height:1.8}
  .ans .lead{font-size:11.5px}
  .warn{font-size:12.5px;line-height:1.6;padding:6px 10px}
  table.tb{font-size:12.5px}
  table.tb th{font-size:12px}
  .bi{font-size:14px}
  .opts{gap:7px;margin-top:11px}
  .opts button{padding:9px 12px;font-size:14.5px}
  .acts{gap:7px;margin-top:12px}
  .btn{padding:8px 15px;font-size:14px}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .verdict{font-size:14px;padding:9px 12px}
  .nav{font-size:12px;margin-top:11px}
  .pstem{font-size:15px;line-height:1.7}
  .ptbl{font-size:12.5px}
  .ptbl td{padding:5px 7px}
  .optrow{font-size:14px;padding:8px 11px}
  .whyrow{font-size:13.2px;line-height:1.75}
  .whysol{font-size:13.2px;line-height:1.8}
  .scoreline{font-size:14px}
  .scoreline b{font-size:20px}
  .unitbox>h3{font-size:14px}
  details.k>summary{font-size:14px;padding:9px 12px}
  .searchbox{font-size:14px;padding:8px 12px}
  .ubar .nm{flex-basis:140px}
  .report ul{font-size:13px}
}
@media print{
  header,.tabs,.bar,.acts,.nav,.searchbox,.no-print{display:none!important}
  body{background:#fff}
  .card,details.k,.unitbox{box-shadow:none;break-inside:avoid}
  details.k .bd{display:block!important}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><b id="ttl">核心考点训练</b><span id="sb"></span></div>

精神风范和【意志品质】。"],"star":3},{"id":"zz-p1-09","page":1,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"1","q":"伟大建党精神之“对党忠诚、不负人民”的具体内涵是什么？","a":["就是无条件地对党的【信仰】、【组织】、【理论】和【路线方针政策】忠诚，始终坚持【全心全意为人民服务】的【根本宗旨】，【政治担当和人民立场】。"],"star":3},{"id":"zz-p1-10","page":1,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"2","q":"伟大建党精神的地位是什么？（重要性之一）","a":["地位：伟大建党精神是中国共产党人的【精神之源】。"],"star":3,"warn":"时代价值/作用/为什么要"},{"id":"zz-p1-11","page":1,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"2","q":"伟大建党精神的重要性之①：为什么说精神代代相传？","a":["①精神代代相传。伟大建党精神成为激励全党全国各族人民【攻坚克难、奋勇前行】的【强大精神动力】。在长期奋斗中构建起中国共产党人的【精神谱系】。"],"star":3,"warn":"不是物质力量"},{"id":"zz-p1-12","page":1,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"2","q":"伟大建党精神的重要性之②：以伟大建党精神为源头的精神谱系有什么意义？","a":["②以伟大建党精神为源头的中国共产党人的【精神谱系】，【跨越时空、历久弥新】，凝聚着中国共产党人的【伟大品格】。党才能【生生不息】"],"star":3},{"id":"zz-p2-01","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"3","q":"我们如何弘扬伟大建党精神？（1）（学习上：学、知）","a":["（1）学习【革命先辈事迹和精神】，传承【红色基因】。"],"star":1,"warn":"书上标注：学、知"},{"id":"zz-p2-02","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"3","q":"我们如何弘扬伟大建党精神？（2）（行动上：行）","a":["（2）积极参加【志愿服务活动】，把伟大建党精神转化为【学习和生活的实际行动】。"],"star":1,"warn":"书上标注：行"},{"id":"zz-p2-03","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"3","q":"我们如何弘扬伟大建党精神？（3）（情感上：情）","a":["（3）积极参与【红色文化教育活动】，【厚植爱国主义】，增强【爱党爱国情感】。"],"star":1,"warn":"书上标注：情"},{"id":"zz-p2-04","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"3","q":"我们如何弘扬伟大建党精神？（4）（信念上：信、思）","a":["（4）【坚定信仰】，把【个人理想】和【国家理想】（【民族复兴梦】）相结合。"],"star":1,"warn":"书上标注：信、思"},{"id":"zz-p2-05","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","q":"★题型总结：青少年为主体的开放性做法类、问答题的答题思路是什么？","a":["①思想上：学习【榜样和精神】，个人与理想【国家理想】相结合；【厚植爱国主义】，听党话跟党走；","②行动上：践行【精神】，勇担责任，【志愿服务奉献】。","③学习上：学习【知识】、提升【能力】，为复兴梦【成才】。"],"star":3,"warn":"青少年为主体的开放性做法类、问答题：可根据主题和要求适当合并；紧扣主题"},{"id":"zz-p2-06","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"1","q":"中国共产党的初心使命是什么？","a":["——为【中国人民谋幸福】，为【中华民族谋复兴】。"],"star":3,"warn":"以人民为中心是发展思想；人民≠公民"},{"id":"zz-p2-07","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？（1）重要性","a":["（1）重要性：初心和使命，是激励一代代中国共产党人【前赴后继、英勇奋斗】的【根本动力】。"],"star":3,"warn":"多角度：必要性、重要性、意义"},{"id":"zz-p2-08","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？（2）重要地位","a":["（2）重要地位：初心使命是党的【性质宗旨】、【理想信念】、【奋斗目标】的【集中体现】。"],"star":3},{"id":"zz-p2-09","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？①党的性质是什么？","a":["①党的性质：中国共产党是【中国工人阶级的先锋队】，同时是【中国人民和中华民族的先锋队】，是中国特色社会主义事业的【领导核心】，代表中国先进【生产力】发展要求，代表中国先进【文化】的前进方向，代表中国【最广大人民的根本利益】"],"star":3},{"id":"zz-p2-10","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？②党的宗旨是什么？","a":["②党的宗旨：【全心全意为人民服务】"],"star":3},{"id":"zz-p2-11","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？③党的最高理想和最终目标是什么？","a":["③党的最高理想和最终目标：实现【共产主义】"],"star":3,"warn":"易错点"},{"id":"zz-p2-12","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？（3）初心使命的意义","a":["（3）初心使命的意义：①我们党才能在【极端困境中发展壮大】。②得到【人民拥护和支持】，书写【千秋伟业】，确保走在【时代前列】。"],"star":3},{"id":"zz-p2-13","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","q":"党的奋斗目标始终是什么？目标有什么特点？（补充了解）","a":["党的奋斗目标始终是：【人民对美好生活的向往】。","但目标不是抽象的，而是具体的，会结合实际、与时俱进。不同时期有不同目标。"],"star":1,"warn":"补充了解即可"},{"id":"zz-p2-14","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","q":"关于人民与江山关系的经典表述是什么？","a":["【人民就是江山，江山就是人民】。"],"star":2},{"id":"zz-p2-15","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"1","q":"为什么中国共产党要站稳人民立场？（1）（立场本身）","a":["（1）人民立场是中国共产党的【根本政治立场】。"],"star":3,"warn":"人民重要性、党与人民；其他原因可开放作答"},{"id":"zz-p2-16","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"1","q":"为什么中国共产党要站稳人民立场？（2）（人民的作用）","a":["（2）人民是【历史的创造者】，是决定党和国家前途命运的【根本力量】。"],"star":3,"warn":"易错点"},{"id":"zz-p2-17","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"1","q":"为什么中国共产党要站稳人民立场？（3）（作为马克思主义政党）","a":["（3）作为【马克思主义政党】，中国共产党始终【同人民在一起】，把【人民利益】放在第一位。"],"star":3},{"id":"zz-p2-18","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"2","q":"中国共产党如何站稳人民立场？（1）（践行党的根本宗旨）","a":["（1）我们党始终【践行党的根本宗旨】。（做法：坚持【全心全意为人民服务】，把人民【拥护不拥护、赞成不赞成】、【高兴不高兴、答应不答应】作为衡量一切工作得失的【根本标准】。）"],"star":3},{"id":"zz-p2-19","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"2","q":"中国共产党如何站稳人民立场？（2）（贯彻党的群众路线）","a":["（2）我们党始终自觉【贯彻党的群众路线】。（做法：坚持【一切为了群众，一切依靠群众】，【从群众中来，到群众中去】，充分相信群众，依靠群众，发挥人民群众的【积极性、主动性、创造性】，使党的路线方针政策充分体现【人民群众的意愿】并得到有效贯彻落实。）"],"star":3},{"id":"zz-p3-01","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？①（党是领导一切的）","a":["①党是【领导一切】的。办好中国的事情，【关键在党】。坚持党对一切工作的领导，是党和国家的【根本所在、命脉所在】，是【中国各族人民】的【利益所在、幸福所在】。（P21）"],"star":3},{"id":"zz-p3-02","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？②（历史和现实的结论）","a":["②历史和现实都告诉我们，【没有中国共产党，就没有新中国】，就没有中国特色社会主义，就没有中华民族伟大复兴。中国共产党是中国特色社会主义事业的【坚强领导核心】"],"star":3},{"id":"zz-p3-03","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？③（最本质的特征）","a":["③中国共产党的领导是中国特色社会主义【最本质的特征】"],"star":3},{"id":"zz-p3-04","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？④（制度的最大优势）","a":["④中国共产党的领导是中国特色社会主义制度的【最大优势】"],"star":3},{"id":"zz-p3-05","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？⑤（最根本保证）","a":["⑤中国共产党的领导是实现【社会主义现代化】和【民族复兴】的【最根本保证】"],"star":3,"warn":"定海神针"},{"id":"zz-p3-06","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？⑥（党自身的角度）","a":["⑥坚持党的领导也是党自身的【宗旨和性质】决定的。"],"star":3},{"id":"zz-p3-07","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"1：党的领导与中国特色社会主义是什么关系？","a":["党的领导直接关系中国特色社会主义的【性质、方向和命运】。中国最大的【国情】就是【中国共产党的领导】。"],"star":2,"warn":"注意提法"},{"id":"zz-p3-08","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"2：执政党、党组织、党员分别起什么作用？","a":["【执政党】、党中央【举旗定向】；党组织【战斗堡垒】；党员【先锋模范】“火种”。"],"star":2,"warn":"注意提法"},{"id":"zz-p3-09","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"2","q":"党的领导的特点是什么？领导核心的含义是什么？","a":["（1）特点：党的领导是【全面的、系统的、整体的】。领导核心：【总揽全局、协调各方】。"],"star":3},{"id":"zz-p3-10","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"2","q":"党的领导的作用是什么？","a":["（2）作用：党的领导体现在党和国家事业【各领域各方面各环节】，起到【把方向、谋大局、定政策、促改革】的【决定性作用】。"],"star":3},{"id":"zz-p3-11","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"3","q":"如何坚持和加强党的全面领导？（1）国家层面①（最重要）","a":["①坚持和加强党的全面领导，最重要的是【坚决维护党中央权威和集中统一领导】","原因：才能【统一思想】、【统一意志】，【步调一致】向前进。"],"star":3,"warn":"做法；国家层面：两个维护"},{"id":"zz-p3-12","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"3","q":"如何坚持和加强党的全面领导？（1）国家层面②（最关键，新时代）","a":["②在新时代，坚决维护党中央权威和集中统一领导，最关键的是坚决维护【习近平同志】党中央的【核心】、全党的【核心地位】","原因：是事业沿着【正确方向】发展的【根本保证】。"],"star":3},{"id":"zz-p3-13","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"3","q":"如何坚持和加强党的全面领导？（2）个人层面的总体要求是什么？","a":["我们要坚定不移【听党话、跟党走】，努力成长为【德智体美劳全面发展】的【社会主义建设者和接班人】"],"star":3},{"id":"zz-p3-14","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","q":"个人层面做法（补充）：思想上怎么做？","a":["①思想上：【认同党的领导】，学习党的【理论知识】，坚定【道路自信】。"],"star":1,"warn":"补充：我们在日常生活中的具体做法；开放性"},{"id":"zz-p3-15","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","q":"个人层面做法（补充）：行动上怎么做？","a":["②行动上：努力学习，遵守规则，勇担【社会责任】，积极加入【共青团】。"],"star":1},{"id":"zz-p3-16","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","q":"个人层面做法（补充）：生活中怎么做？","a":["③生活中：维护【国家利益】，传承【红色基因】，践行【社会主义核心价值观】。"],"star":1},{"id":"zz-p3-17","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","q":"个人层面做法（补充）：还有哪些具体举例？","a":["【积极宣传】……；【参观】…… 增强【爱党爱国情感】，传承【伟大建党精神】 等等"],"star":1},{"id":"zz-p4-01","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"1","q":"新时代我国社会主要矛盾是什么？（内涵与地位）","a":["（1）内涵：我国社会主要矛盾已经转化为【人民日益增长的美好生活需要】和【不平衡不充分的发展】之间的矛盾。","（2）地位：这是我国进入新时代的【基本依据】。"],"star":2},{"id":"zz-p4-02","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"2","q":"为什么社会主要矛盾会发生转化？","a":["（1）随着改革开放深入推进，社会生产力水平总体上【显著提高】。","（2）进入新时代，人民对美好生活的向往更加强烈、需要日益广泛。","（3）我国的发展不平衡不充分，已经成为满足人民日益增长的美好生活需要的【主要制约因素】。"],"star":1,"warn":"了解层次"},{"id":"zz-p4-03","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"3","q":"如何准确认识和把握社会主要矛盾的变化？（发展是动态的）","a":["（1）发展是动态的，不平衡不充分是永远存在的。"],"star":1},{"id":"zz-p4-04","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"3","q":"我国社会主要矛盾发生变化后，仍然没有变的“两个没有变”是什么？","a":["（2）我国社会主要矛盾发生变化，但我国仍处于并将长期处于【社会主义初级阶段】的基本国情没有变，我国是【世界最大发展中国家】的国际地位没有变。"],"star":2},{"id":"zz-p4-05","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"3","q":"准确认识和把握社会主要矛盾的变化，提出了什么要求？","a":["（3）要求：要牢牢把握社会主义初级阶段这个【基本国情】，牢牢立足社会主义初级阶段这个【最大实际】，毫不动摇贯彻党在社会主义初级阶段的【基本路线】。"],"star":1},{"id":"zz-p4-06","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"4","q":"党在社会主义初级阶段的基本路线是什么？","a":["领导和团结全国各族人民，以【经济建设】为中心，坚持【四项基本原则】，坚持【改革开放】，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。"],"star":1,"warn":"了解层次"},{"id":"zz-p4-07","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"1","q":"进入新时代的时间是？","a":["【党的十八大】以来，中国特色社会主义进入新时代。"],"star":1},{"id":"zz-p4-08","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"2","q":"中国特色社会主义进入新时代的意义（总述）？","a":["（1）总述：中国特色社会主义进入新时代，在【中华人民共和国发展史】上、【中华民族发展史】上具有重大意义，在【世界社会主义发展史】上、人类社会发展史上也具有重大意义。"],"star":2},{"id":"zz-p4-09","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"2","q":"中国特色社会主义进入新时代的第一个“意味着”是什么？（中华民族）","a":["①中国特色社会主义进入新时代，意味着近代以来久经磨难的中华民族迎来了从【站起来、富起来到强起来】的伟大飞跃，迎来了实现【中华民族伟大复兴】的光明前景。"],"star":2,"warn":"三个意味着：能对接上面判断即可"},{"id":"zz-p4-10","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"2","q":"中国特色社会主义进入新时代的第二个“意味着”是什么？（科学社会主义）","a":["②中国特色社会主义进入新时代，意味着【科学社会主义】在二十一世纪的中国焕发出强大生机活力，在世界上高高举起了【中国特色社会主义伟大旗帜】。"],"star":2,"warn":"三个意味着：能对接上面判断即可"},{"id":"zz-p4-11","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"2","q":"中国特色社会主义进入新时代的第三个“意味着”是什么？（发展中国家走向现代化）","a":["③中国特色社会主义进入新时代，意味着中国特色社会主义【道路、理论、制度、文化】不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了【全新选择】，为解决人类问题贡献了【中国智慧和中国方案】。"],"star":2,"warn":"不是其他国家都可照用"},{"id":"zz-p4-12","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（历史脉络）是什么？","a":["（1）中国特色社会主义新时代是【承前启后、继往开来】、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代。"],"star":1,"warn":"能判断；本点对应“历史脉络”"},{"id":"zz-p4-13","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（国家发展）是什么？","a":["（2）是决胜【全面建成小康社会】、进而【全面建设社会主义现代化强国】的时代。"],"star":1,"warn":"能判断；本点对应“国家发展”"},{"id":"zz-p4-14","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（价值立场）是什么？","a":["（3）是全国各族人民团结奋斗、不断创造美好生活、逐步实现【全体人民共同富裕】的时代。"],"star":1,"warn":"能判断；本点对应“价值立场”"},{"id":"zz-p4-15","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（民族复兴）是什么？","a":["（4）是全体中华儿女戮力同心、奋力实现【中华民族伟大复兴】中国梦的时代。"],"star":1,"warn":"能判断；本点对应“民族复兴”"},{"id":"zz-p4-16","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（国际视野）是什么？","a":["（5）是我国不断为【人类作出更大贡献】的时代。"],"star":1,"warn":"能判断；本点对应“国际视野”"},{"id":"zz-p5-01","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"一、系统科学的理论体系","no":"1","q":"习近平新时代中国特色社会主义思想是怎样创立的？（源头、背景、主体、中国化路径）","a":["（1）源头：时代是思想之母，实践是理论之源。","（2）背景：新时代以来，面对国内外形势新变化和实践新要求","（3）主体：以习近平同志为主要代表的中国共产党人","（4）中国化路径：坚持把马克思主义基本原理同【中国具体实际】相结合、同【中华优秀传统文化】相结合。"],"star":2},{"id":"zz-p5-02","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"一、系统科学的理论体系","no":"1","q":"习近平新时代中国特色社会主义思想科学回答的“三大时代课题”是什么？","a":["（5）三大时代课题：科学回答了在新时代","①坚持和发展什么样的【中国特色社会主义】、怎样坚持和发展中国特色社会主义（方向性质）","②建设什么样的【社会主义现代化强国】、怎样建设社会主义现代化强国（目标路径）","③建设什么样的【长期执政的马克思主义政党】、怎样建设长期执政的马克思主义政党（力量保证）"],"star":2},{"id":"zz-p5-03","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"一、系统科学的理论体系","no":"2","q":"习近平新时代中国特色社会主义思想的主要内容及其重要体现是什么？","a":["（1）主要内容：“【十个明确】”、“【十四个坚持】”、“【十三个方面成就】”。","（2）重要体现：“【六个必须坚持】”是这一思想的世界观、方法论、立场观点方法。"],"star":2},{"id":"zz-p5-04","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"一、系统科学的理论体系","no":"2","q":"如何理解习近平新时代中国特色社会主义思想是一个系统科学的理论体系？（四者的关系）","a":["（3）关系：以上四个是【内在贯通、有机统一】，共同构成了习近平新时代中国特色社会主义思想的【科学体系】。"],"star":2},{"id":"zz-p5-05","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（总结）","a":["（1）总结：【实践】是理论的基础，科学理论对实践具有【巨大指导作用】。","它是系统科学的理论体系，有巨大指导作用。"],"star":2},{"id":"zz-p5-06","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（历史经验）","a":["（2）历史经验：新时代党和国家事业之所以取得【历史性成就】，最根本的原因在于有习近平同志作为【党中央的核心、全党的核心】掌舵领航，在于有习近平新时代中国特色社会主义思想【科学指引】。"],"star":2},{"id":"zz-p5-07","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（思想武器）","a":["（3）思想武器：它植根于新时代伟大实践，是经过实践检验又指导实践发展的【强大思想武器】。"],"star":2},{"id":"zz-p5-08","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（思想地位）","a":["（4）思想地位：它是【当代中国马克思主义、二十一世纪马克思主义】，是中华文化和中国精神的【时代精华】，实现了【马克思主义中国化时代化】新的飞跃。"],"star":2},{"id":"zz-p5-09","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（行动指南）","a":["（5）行动指南：它是新时代中国共产党的【思想旗帜】，是全党全国人民为实现中华民族伟大复兴而奋斗的【行动指南】，是新时代党和国家事业发展的【根本遵循】。"],"star":2},{"id":"zz-p5-10","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"2","q":"怎样长期坚持习近平新时代中国特色社会主义思想？（国家角度·两个不动摇）","a":["（1）国家角度（两个不动摇）：必须高举马克思主义、【中国特色社会主义旗帜】不动摇，必须坚持习近平新时代中国特色社会主义思想【指导地位】不动摇。"],"star":1},{"id":"zz-p5-11","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"2","q":"怎样长期坚持习近平新时代中国特色社会主义思想？（青年角度）","a":["（2）青年角度：要坚持不懈用习近平新时代中国特色社会主义思想【武装头脑】，积极投身新时代中国特色社会主义【伟大事业】，在实现民族复兴的赛道上【奋勇争先】，在为人民利益的不懈奋斗中书写人生华章。"],"star":2,"warn":"中学生；思想、学习、实践等层次"},{"id":"zz-p6-01","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"主要观点","q":"第六课主要观点：新时代成就的背景、总体布局与两大奇迹是什么？","a":["新时代以来，在以习近平同志为核心的党中央坚强领导下，在习近平新时代中国特色社会主义思想科学指引下，我们党统筹推进经济建设、政治建设、文化建设、社会建设、生态文明建设“五位一体”【总体布局】，书写了【经济快速发展】和【社会长期稳定】两大奇迹新篇章。"],"star":2,"warn":"逻辑：背景—两个根本原因—重点做什么—铸就两大奇迹"},{"id":"zz-p6-02","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"经济实力大幅跃升的表现之一：社会主义基本经济制度不断完善（含其地位）？","a":["（1）社会主义基本经济制度【不断完善】，经济发展的【制度基础】更加坚实。","①地位：我国基本经济制度是中国特色社会主义制度的【重要支柱】。"],"star":2},{"id":"zz-p6-03","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"我国社会主义基本经济制度的内容是什么？","a":["②内容：【公有制为主体、多种所有制经济共同发展】，【按劳分配为主体、多种分配方式并存】，【社会主义市场经济体制】等社会主义基本经济制度。"],"star":2,"warn":"名称易错"},{"id":"zz-p6-04","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"社会主义基本经济制度的优越性是什么？","a":["③优越性：既体现了社会主义制度优越性（如：集中力量办大事，调动积极性、推动实现共同富裕等），又同我国社会主义初级阶段【社会生产力发展水平】相适应。"],"star":2},{"id":"zz-p6-05","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"经济实力大幅跃升的表现之二：经济持续健康发展、综合实力大幅提升（具体位次）？","a":["（2）经济持续健康发展，综合实力【大幅提升】。","我国经济总量稳居【世界第二位】，制造业增加值多年位居【世界首位】，我国是全球货物贸易第一大国、服务贸易第二大国、商品消费第二大国、【外汇储备第一大国】。"],"star":2},{"id":"zz-p6-06","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"经济实力大幅跃升的表现之三：创新活力不断迸发、科技实力实现跨越式发展？","a":["（3）创新活力不断迸发，科技实力实现【跨越式发展】。","党坚持实施【创新驱动发展战略】，全面谋划科技创新工作，重大科技创新成果竞相涌现，一些前沿领域开始进入【并跑、领跑】阶段，我国已经进入【创新型国家】行列。"],"star":2,"warn":"不是前列、强国"},{"id":"zz-p6-07","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"经济实力大幅跃升的表现之四：经济结构不断优化（制造强国、新型城镇化、乡村振兴）？","a":["（4）经济结构不断优化，经济发展质量【明显提升】。","①加快实施【制造强国】战略，产业发展向【中高端】迈进；","②加快推进【新型城镇化】战略和【乡村振兴】战略，城乡发展差距进一步缩小；"],"star":2,"warn":"城乡发展差距是缩小，不是消除"},{"id":"zz-p6-08","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"区域协调发展呈现新格局的表现是什么？（“四大板块”）","a":["③东中西部和东北地区【“四大板块”联动发展】，区域协调发展呈现【新格局】。（区域协调发展战略）"],"star":2},{"id":"zz-p6-09","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"2","q":"新时代我国经济取得成就的原因之一：抓住发展这个第一要务？","a":["（1）抓住发展是党【执政兴国的第一要务】，是解决我国一切问题的【基础和关键】。"],"star":2,"warn":"易错点；成功的原因/成功的密码/如何取得成就＝做法＋效果；第六课五个框题都是"},{"id":"zz-p6-10","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"2","q":"新时代我国经济取得成就的原因之二：在习近平经济思想指引下以经济建设为中心？","a":["（2）新时代以来，在【习近平经济思想】指引下，我们党团结带领中国人民以【经济建设】为中心——不断解放和发展社会生产力，国家经济实力、科技实力和综合国力【显著增强】。"],"star":2},{"id":"zz-p6-11","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"2","q":"新时代我国经济取得成就的原因之三：其他（如五大战略）？","a":["（3）其他：如【五大战略】——"],"star":2,"warn":"书上此条只写到“如五大战略——”，未列具体内容"},{"id":"zz-p7-01","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"民主政治的主线是什么？全过程人民民主有哪些特点（是什么）？","a":["民主政治的主线：【全过程人民民主】。","全过程人民民主是【全链条】、【全方位】、【全覆盖】的民主，有完整的【制度程序】，也有完整的【参与实践】。","全过程人民民主是社会主义民主政治的【本质属性】，是【最广泛、最真实、最管用】的民主。（P51）"],"star":1,"warn":"复习思路：有哪些成果？——成功的原因？"},{"id":"zz-p7-02","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","no":"1","q":"新时代以来我国民主政治不断发展的表现（成就一）：人民当家作主制度体系是怎样不断完善、提供制度保障的？","a":["人民代表大会制度、中国共产党领导的【多党合作和政治协商制度】、【民族区域自治制度】、【基层群众自治制度】等各项政治制度不断完善和发展，为发展全过程人民民主提供了【可靠制度保障】。"],"star":2,"warn":"标志性成果、成就"},{"id":"zz-p7-03","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"表现（成就二）：协商民主广泛深入发展——人民民主的真谛是什么？","a":["人民民主的真谛是——【有事好商量】，【众人的事情由众人商量】。"],"star":2},{"id":"zz-p7-04","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"协商民主广泛深入发展的做法与效果是什么？","a":["积极拓宽【民主协商渠道】，深入开展【多种协商】，建立健全多种协商方式，人民在日常政治生活中有【广泛持续深入参与】的权利。"],"star":2,"warn":"做法+效果"},{"id":"zz-p7-05","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"公民行使民主权利、维护自身合法权益的途径有哪些？","a":["公民行使民主权利，维护自身的合法权益的途径：【民主选举】、【民主协商】、【民主决策】、【民主管理】、【民主监督】。"],"star":2},{"id":"zz-p7-06","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"表现（成就三）：基层民主活力增强的做法与效果？","a":["不断完善【基层民主制度】，完善【办事公开制度】，健全【党组织领导】的城乡基层治理体系，基层群众【自我管理】、【自我服务】、【自我教育】、【自我监督】的实效不断增强。"],"star":2,"warn":"做法+效果"},{"id":"zz-p7-07","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"表现（成就四）：民主与法治是什么关系？","a":["【民主是法治的基础】，【法治是民主的保障】。"],"star":2,"warn":"不能颠倒搭配：民主是法治的基础，法治是民主的保障"},{"id":"zz-p7-08","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"表现（成就四）：法治中国建设迈出坚实步伐的具体表现（做法+效果）？","a":["确立【习近平法治思想】在全面依法治国工作中的【指导地位】；社会主义法治国家建设深入推进，全面依法治国【总体格局基本形成】，中国特色社会主义【法治体系】加快建设，【司法体制改革】取得重大进展，社会【公平正义】保障更为坚实。"],"star":2,"warn":"做法+效果"},{"id":"zz-p7-09","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","no":"2","q":"新时代以来我国民主政治不断发展的原因①：为什么说人民民主是社会主义的生命？","a":["人民民主是社会主义的【生命】，是全面建设社会主义现代化国家的【应有之义】。"],"star":3},{"id":"zz-p7-10","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"民主政治不断发展的原因②：党是怎样团结带领人民推动我国民主政治建设取得重要进展的？","a":["新时代以来，党团结带领全国各族人民坚定不移走【中国特色社会主义政治发展道路】，坚持【党的领导、人民当家作主、依法治国有机统一】，创造性地提出【全过程人民民主】重大理念并大力推进，我国民主政治建设取得重要进展。"],"star":3},{"id":"zz-p7-11","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"民主政治不断发展的原因③：还有哪些其他原因？","a":["其他：如有【制度保障】；【法治保障】；"],"star":3,"warn":"党领导；思想指引；重视民主；道路发展；优势"},{"id":"zz-p7-12","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","no":"1","q":"文化自信日益增强的表现（成就一）：意识形态建设成效卓著体现在哪里？","a":["确立和坚持【马克思主义】在意识形态领域【指导地位】的【根本制度】，我国意识形态领域形势发生了【全局性、根本性转变】。"],"star":2,"warn":"标志性成果、成就；P64-"},{"id":"zz-p8-01","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的表现（成就二）：社会主义核心价值观深入人心有哪些举措与意义？","a":["这是【基础工程】。开展【宣传教育】，建立【功勋荣誉表彰制度】，设立【烈士纪念日】，不断夯实中国特色社会主义的【思想道德基础】。"],"star":2,"warn":"标志性成果、成就"},{"id":"zz-p8-02","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的表现（成就三）：中华优秀传统文化焕发蓬勃生机的关键是什么？","a":["关键是要推动中华优秀传统文化【创造性转化】、【创新性发展】，增强全社会【文物保护意识】，加大【文化遗产保护力度】，中华优秀传统文化的【影响力、感召力】显著增强。"],"star":2,"warn":"做法+效果"},{"id":"zz-p8-03","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的表现（成就四）①：文艺事业展现时代新貌——文艺创作的导向是什么？","a":["坚持以【人民为中心】的【创作导向】，推动文艺工作取得长足进步。"],"star":2},{"id":"zz-p8-04","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的表现（成就四）②：文艺事业繁荣的具体体现是什么？","a":["有【优秀作品、人才】，呈现【百花齐放】、生机勃勃。"],"star":2,"warn":"能满足人民美好精神文化需求"},{"id":"zz-p8-05","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","no":"2","q":"文化自信日益增强的原因①：坚定文化自信——文化自信的地位和重要性是什么？","a":["【坚定文化自信】。","文化自信是【更基础、更广泛、更深厚的自信】，是一个国家、一个民族发展中最【基本】、最【深沉】、最【持久】的力量。"],"star":3,"warn":"重要性"},{"id":"zz-p8-06","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的原因②：新时代以来党是怎样推动文化繁荣、建设文化强国的？","a":["新时代以来，在【习近平文化思想】指引下，我们党把【文化建设】摆在【全局工作】的重要位置，在新的起点上推动【文化繁荣】，建设【文化强国】。"],"star":3},{"id":"zz-p8-07","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的原因③：还有哪些其他原因？","a":["其他如：【双创】。"],"star":3,"warn":"党领导；思想指引；坚定自信；工作重视"},{"id":"zz-p8-08","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"传承和弘扬中华优秀传统文化，关键是什么？要坚持什么、做到什么？","a":["关键是推动中华优秀传统文化【创造性转化】、【创新性发展】。","要坚持【古为今用】、【推陈出新】（即【取其精华、去其糟粕】，【批判继承】传统文化）。","要做到【兼收并蓄】、【择善而从】（【文明互鉴】，【尊重多样】，【洋为中用】）。"],"star":1,"warn":"注意1：传承和弘扬中华优秀传统文化"},{"id":"zz-p8-09","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"推动“双创”、提升中华文化影响力感召力，青少年怎么做？","a":["①主动学习和了解中华优秀传统文化，如【阅读经典古籍】、【学习传统技艺】、【参观文化遗产】；","②积极参与【文化传承实践活动】，如参与传统文化主题的校园活动、宣传优秀传统文化的志愿服务活动；","③尊重和保护【文化遗产】，增强【文化保护意识】，抵制损害传统文化的行为；","④践行【社会主义核心价值观】，将传统文化中的优秀精神融入【日常行为】，传递文化正能量；","⑤结合时代特点【创新表达】，如用【短视频】、文创作品等形式展现优秀传统文化魅力。"],"star":1,"warn":"注意2；积累（答题素材）"},{"id":"zz-p8-10","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","no":"1","q":"民生福祉持续推进的成就（成就一）：完成脱贫攻坚与全面建成小康社会的历史任务有什么意义？","a":["打赢了人类历史上规模最大的【脱贫攻坚战】，历史性地解决了【绝对贫困】问题，创造了人类【减贫史】上的奇迹，实现了全面建成小康社会的【千年梦想】。"],"star":2,"warn":"标志性成果、成就；社会长期稳定奇迹；P56-60"},{"id":"zz-p9-01","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉成就（二）：教育普及水平实现历史性跨越体现在哪里？","a":["坚持【教育优先发展】，深化【教育综合改革】，优化区域教育资源配置，建成了世界上【规模最大的教育体系】，各级教育普及程度达到或超过【中高收入国家】平均水平。"],"star":2},{"id":"zz-p9-02","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉成就（三）：社会保障体系不断完善体现在哪里？","a":["实现基本养老保险【全国统筹】、多层次医疗保障【有序衔接】、社会救助体系【兜底】，建成了世界上【规模最大的社会保障体系】。"],"star":2},{"id":"zz-p9-03","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉成就（四）：平安中国建设迈向更高水平体现在哪里？","a":["建设【人人有责、人人尽责、人人享有】的【社会治理共同体】；加强社会治安【综合治理】，开展【扫黑除恶】专项斗争，人民群众【安全感】持续增强。"],"star":2},{"id":"zz-p9-04","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","no":"2","q":"民生福祉能够持续推进的原因①：发展的根本目的是什么？","a":["发展的根本目的是：【增进民生福祉】。"],"star":3,"warn":""},{"id":"zz-p9-05","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉能够持续推进的原因②：党把什么作为一切工作的出发点和落脚点？","a":["党领导下，把【让老百姓过上好日子】作为一切工作的【出发点和落脚点】。"],"star":3},{"id":"zz-p9-06","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"为让老百姓过上好日子，党具体做到了什么？","a":["补齐【民生保障短板】，解决好人民群众【急难愁盼】问题，不断推动【共同富裕】取得新成效。"],"star":3,"warn":"易错点：共同富裕不是同时富裕、同步富裕、同等富裕"},{"id":"zz-p9-07","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉能够持续推进的原因（其他）：还有哪些原因？","a":["坚持以【以人民为中心】的发展思想；坚持【全心全意为人民服务】的根本宗旨，践行人民谋幸福、为民族谋复兴的【初心使命】，坚持【人民立场】；等等。"],"star":3,"warn":"讲成功推进的原因——表述为做法+效果；讲为什么要重视民生——表述为重要性、道理依据"},{"id":"zz-p9-08","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","no":"1","q":"美丽中国加快建设的表现（成就一）：生态文明制度体系更加健全体现在哪里？","a":["我国生态文明【顶层设计】不断推进，【制度体系】基本建立，协同推进【降碳、减污、扩绿、增长】，为推进美丽中国建设提供了重要【制度保障】。"],"star":2,"warn":"标志性成果、成就"},{"id":"zz-p9-09","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"美丽中国建设表现（成就二）：污染防治攻坚向纵深推进的做法与成效？","a":["坚持【精准治污、科学治污、依法治污】，深入推进【蓝天、碧水、净土】三大保卫战，城乡人居环境持续改善，进口“洋垃圾”得到全面禁止，【生态环境质量】不断提高。"],"star":2},{"id":"zz-p9-10","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"美丽中国建设表现（成就三）：绿色、循环、低碳发展迈出坚实步伐体现在哪里？","a":["我国【生态优先】、【节约集约】、绿色低碳发展取得明显成效，【简约适度】、绿色低碳的生活方式日益深入人心，【绿色消费】、理性消费渐成风尚。"],"star":2},{"id":"zz-p9-11","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","no":"2","q":"美丽中国建设取得成就的原因①：树立正确生态文明观，其重要性是什么？","a":["树立正确【生态文明观】：【保护自然】就是保护人类，【建设生态文明】就是造福人类。"],"star":3,"warn":"人与自然和谐共生、人与自然是生命共同体"},{"id":"zz-p9-12","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"美丽中国建设取得成就的原因②：新时代以来党是怎样领导推进美丽中国建设的？","a":["在【习近平生态文明思想】指引下，我们党坚持【绿水青山就是金山银山】的理念，坚持【山水林田湖草沙】一体化保护和系统治理，开展了一系列【开创性工作】，美丽中国建设迈出重大步伐。"],"star":3,"warn":"理念；党；指导思想；核心理念；工作"},{"id":"zz-p10-01","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"如何理解“绿水青山就是金山银山”这一理念①：它阐述了什么关系、揭示了什么道理？","a":["绿水青山就是金山银山，阐述了【经济发展和生态环境保护】的关系，揭示了【保护生态环境就是保护生产力】、【改善生态环境就是发展生产力】的道理。"],"star":1,"warn":"易错点；不能颠倒前后"},{"id":"zz-p10-02","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"如何理解“绿水青山就是金山银山”这一理念②：生态环境保护与经济发展是什么关系？","a":["生态环境保护和经济发展【不是相互对立】的关系，而是【辩证统一】的关系。良好生态本身蕴含着无穷的【经济价值】，能够源源不断创造【综合效益】，实现经济社会【可持续发展】。"],"star":1,"warn":"易错点；不能颠倒前后"},{"id":"zz-p10-03","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","no":"3","q":"作为青少年，我们能为推进美丽中国建设做些什么？①生活理念方面","a":["树立【绿色低碳】生活理念，养成【物尽其用】、减少废弃物的文明习惯。"],"star":1,"warn":"积累"},{"id":"zz-p10-04","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"推进美丽中国建设，青少年怎么做？②产品选择方面","a":["注重产品的【内在品质】，拒绝购买【过度包装】产品。"],"star":1},{"id":"zz-p10-05","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"推进美丽中国建设，青少年怎么做？③一次性产品方面","a":["合理使用【一次性产品】，选购和使用【可再生材料】制品。"],"star":1},{"id":"zz-p10-06","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"推进美丽中国建设，青少年怎么做？④节约粮食方面","a":["【节约粮食】，避免浪费，适量点餐，践行【光盘行动】。"],"star":1},{"id":"zz-p10-07","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"推进美丽中国建设，青少年怎么做？⑤出行方面","a":["【绿色出行】，尽量搭乘【公共交通工具】，多骑自行车。"],"star":1},{"id":"zz-p10-08","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"推进美丽中国建设，青少年怎么做？⑥垃圾分类方面","a":["学习【垃圾分类】知识，养成垃圾分类良好习惯。"],"star":1}],"papers":[{"id":"zz-mid01","name":"2026-2027 期中·道德与法治（九上）","exam":"2026-2027学年度第一学期期中·初三级道德与法治","source":"题库/2026-2027学年度第一学期期中/01.jpg–08.jpg（照片转录，忽略手写草稿）","note":"选择题 17 题（34 分）＋ 非选择题 3 大题（36 分），全卷 70 分。考查范围：第一单元 坚持党的全面领导、第二单元 进入新时代（第 1—6 课）。答案与解析自拟。","questions":[{"no":1,"id":"zz-mid01-q01","unit":"第一单元 坚持党的全面领导","blocks":[{"t":"p","v":"“我们唱着东方红，当家作主站起来，我们讲着春天的故事，改革开放富起来。”“当家作主站起来”和“改革开放富起来”代表的我国重大历史事件分别是（　）"}],"opts":["中国共产党成立和中华人民共和国成立","中华人民共和国成立和党的十一届三中全会","中华人民共和国成立和党的十八大","中国共产党成立和社会主义三大改造的完成"],"ans":1,"why":{"A":"中国共产党的成立是1921年，党带领人民站起来是在新中国成立之时，前半句对不上，错误。","B":"1949年中华人民共和国成立，中国人民从此站起来了；1978年党的十一届三中全会作出改革开放的历史性决策，中国人民富起来了，正确。","C":"党的十八大（2012年）是新时代的起点，不是改革开放的开始，错误。","D":"三大改造完成（1956年）标志社会主义制度建立，与“改革开放富起来”不对应，错误。"},"sol":""},{"no":2,"id":"zz-mid01-q02","unit":"第一单元 坚持党的全面领导","blocks":[{"t":"p","v":"某校在“文明素养培育月”活动中向学生推荐了以下阅读篇目。"},{"t":"tbl","rows":[[{"t":"推荐篇目","imgs":[]},{"t":"推荐理由","imgs":[]}],[{"t":"《红岩》","imgs":[]},{"t":"中共地下党员江姐、许云峰等革命志士在狱中坚持斗争，为共产主义信仰英勇献身","imgs":[]}],[{"t":"《“七一勋章”获得者赵亚夫》","imgs":[]},{"t":"共产党员赵亚夫扎根农村60余年，帮助农民增收超300亿元","imgs":[]}]]},{"t":"p","v":"根据以上推荐篇目及推荐理由，你认为该活动的主题应该是（　）"}],"opts":["品读文学经典，提升审美素养","强化党建引领，发挥“堡垒”作用","坚持自主创新，探索科技前沿","学习党员榜样，厚植家国情怀"],"ans":3,"why":{"A":"两篇推荐的理由都落在人物的信仰与奉献上，不是文学审美，错误。","B":"“堡垒”作用指党组织的战斗堡垒作用，材料讲的是党员个人的事迹，不是党组织建设，错误。","C":"材料与科技创新无关，错误。","D":"江姐为信仰献身、赵亚夫扎根农村为民增收，都是共产党员的榜样，读这些篇目正是为了学习榜样、涵养家国情怀，正确。"},"sol":""},{"no":3,"id":"zz-mid01-q03","unit":"第一单元 坚持党的全面领导","blocks":[{"t":"p","v":"下面的歌曲《领航》讴歌的是（　）"},{"t":"p","v":"（歌曲《领航》歌词节选）“无论多久 你都在我们身旁／相依相恋 情深意长／江山就是人民 汇成你胸中景象／为了千秋伟业 为了时代华章／前赴后继 铸就辉煌……”“伟大的中国共产党 风华正茂 山高水长／昂首挺立在新时代的征程上……”"}],"opts":["中国共产党，为群众闪耀“火种”光芒","中国共产党，带领人民谱写了恢宏史诗","人民代表大会，代表人民行使国家权力","国家主席，中华人民共和国的国家代表"],"ans":1,"why":{"A":"“火种”多用来形容革命年代的播火者，歌词落点是“千秋伟业”“时代华章”“新时代的征程”，概括不全，错误。","B":"歌词反复唱“江山就是人民”“为了千秋伟业”“伟大的中国共产党”，讴歌的是党带领人民创造历史、书写恢宏史诗，正确。","C":"歌曲讴歌的对象是中国共产党，不是人民代表大会，错误。","D":"国家主席是国家机构职务，与歌词歌颂的对象不符，错误。"},"sol":""},{"no":4,"id":"zz-mid01-q04","unit":"第一单元 坚持党的全面领导","blocks":[{"t":"p","v":"马克思指出：“一个单独的提琴手是自己指挥自己，一个乐队就需要一个乐队指挥。”关于新时代坚持党的全面领导，以下理解正确的是（　）"},{"t":"p","v":"①最重要的是坚决维护党中央权威和集中统一领导\n②最关键的是坚决维护习近平总书记党中央的核心、全党的核心地位\n③党中央的权威是自然而然形成的，与我们中学生没什么关系\n④全党有核心才能统一思想、统一意志、步调一致向前进"}],"opts":["①②③","①②④","①③④","②③④"],"ans":1,"why":{"A":"③错误：党中央权威来自党的团结统一和全党共同维护，坚持党的全面领导人人有责，与中学生同样有关，不能选。","B":"①②④都是关于坚持党的全面领导的正确理解，“乐队需要指挥”正说明全党必须有核心才能统一思想、统一意志、步调一致，正确。","C":"同样含错误的③，错误。","D":"含错误的③，错误。"},"sol":""},{"no":5,"id":"zz-mid01-q05","unit":"第一单元 坚持党的全面领导","blocks":[{"t":"p","v":"党的十九届四中全会强调：制度竞争是综合国力竞争的重要方面，制度优势是一个国家的最大优势。中国特色社会主义制度最大的优势是（　）"}],"opts":["集中力量办大事","调动积极性","中国共产党领导","坚持改革开放"],"ans":2,"why":{"A":"集中力量办大事是我国国家制度和国家治理体系的显著优势之一，但不是“最大优势”，错误。","B":"调动各方面积极性也是制度优势的表现，同样不是最大优势，错误。","C":"中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，正确。","D":"改革开放是强国之路，是制度优势发挥的条件，不是制度本身的最大优势，错误。"},"sol":""},{"no":6,"id":"zz-mid01-q06","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。下列能够反映广东着力解决社会主要矛盾的是（　）"},{"t":"p","v":"①全省各地深入推进绿美广东生态建设，推动构建宜居宜业和美乡村\n②不断提升农村基础设施，乡村快递基本服务全覆盖\n③强化种植业科技创新，发展农村新质生产力\n④县域面积占广东的71.7%，但县域GDP仅占广东的12.5%"}],"opts":["①②③","①②④","①③④","②③④"],"ans":0,"why":{"A":"①②③都是广东为满足人民美好生活需要、缩小城乡区域差距而采取的措施，能反映着力解决主要矛盾，正确。","B":"④只是县域发展滞后的数据，说明发展不平衡，属于问题本身而不是解决问题的举措，不能选。","C":"同样含④，错误。","D":"同样含④，错误。"},"sol":""},{"no":7,"id":"zz-mid01-q07","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"2026年“十五五”规划纲要要将“人民生活品质不断提高”列为主要目标之一，强调要让改革发展成果更多更公平惠及全体人民。这一部署体现了新时代是（　）"}],"opts":["承前启后、继往开来、继续夺取中国特色社会主义伟大胜利的时代","决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代","全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代","我国不断为人类作出更大贡献的时代"],"ans":2,"why":{"A":"这一表述侧重接续奋斗、夺取新胜利，没有扣住“人民生活品质”“惠及全体人民”，错误。","B":"全面建成小康社会已在2021年实现，且材料讲的是民生福祉而非小康目标，错误。","C":"“人民生活品质不断提高”“改革发展成果更多更公平惠及全体人民”直接对应创造美好生活、实现共同富裕，正确。","D":"这一表述讲的是我国对世界的贡献，材料讲的是国内民生，错误。"},"sol":""},{"no":8,"id":"zz-mid01-q08","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"中国共产党为什么能，归根到底是马克思主义行，是中国化时代化的马克思主义行。实现马克思主义中国化时代化的实践路径，就是坚持把马克思主义基本原理与________、与________相结合（　）"}],"opts":["中国具体实际　中华优秀传统文化","中国改革开放　中华传统文化","社会主要矛盾　中华优秀传统文化","中国革命实际　中华传统文化"],"ans":0,"why":{"A":"“两个结合”就是坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，正确。","B":"改革开放是实践内容之一，不能与“中国具体实际”并列作为“两个结合”的表述，错误。","C":"社会主要矛盾是具体实际的一部分，不是“两个结合”的另一半，错误。","D":"“中国革命实际”只覆盖革命时期，“中华传统文化”缺少“优秀”二字，表述不准确，错误。"},"sol":""},{"no":9,"id":"zz-mid01-q09","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"习近平新时代中国特色社会主义思想是我们党和国家必须长期坚持的指导思想，以下对这一思想的认识正确的是（　）"},{"t":"p","v":"①作为系统科学的理论体系，对实践有巨大指导作用\n②“十个明确”“十四个坚持”“十三个方面成就”“六个坚持”概括了它的主要内容\n③是解决我国一切问题的基础和关键\n④实现了马克思主义中国化时代化新的飞跃"}],"opts":["①②","①④","②③","②④"],"ans":1,"why":{"A":"②表述不准确：这一思想的主要内容是“十个明确”“十四个坚持”“十三个方面成就”，“六个必须坚持”是其世界观和方法论，不能并列进“主要内容”，错误。","B":"①它确实是系统科学的理论体系、对实践有巨大指导作用；④它实现了马克思主义中国化时代化新的飞跃，两项都正确。","C":"含错误的③——发展才是解决我国一切问题的基础和关键，错误。","D":"含错误的②，错误。"},"sol":""},{"no":10,"id":"zz-mid01-q10","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"新时代以来，我们党统筹推进“五位一体”总体布局，书写了________和________两大奇迹新篇章（　）"}],"opts":["经济快速发展　经济总量全球第一","全面建成小康　已经建成创新型强国","经济快速发展　社会长期稳定","解决主要矛盾　意识形态建设成效卓著"],"ans":2,"why":{"A":"我国经济总量居世界第二，“全球第一”不符合事实，错误。","B":"全面建成小康社会已经实现，创新型强国尚未建成（目标是2035年进入创新型国家前列），错误。","C":"我们党领导人民创造了世所罕见的“经济快速发展奇迹”和“社会长期稳定奇迹”，正确。","D":"解决主要矛盾是一个过程，不是与“社会长期稳定”并列的“奇迹”，错误。"},"sol":""},{"no":11,"id":"zz-mid01-q11","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"粤港澳大湾区是由香港、澳门和珠三角九市组成的国家级战略湾区，成为内地与港澳深度合作示范区。这直接反映下列思维导图中的________战略（　）"},{"t":"p","v":"【思维导图】我国的国家战略：A．乡村振兴战略　B．健康中国战略　C．西部大开发战略　D．区域协调发展战略　……"}],"opts":["A（乡村振兴战略）","B（健康中国战略）","C（西部大开发战略）","D（区域协调发展战略）"],"ans":3,"why":{"A":"乡村振兴战略针对的是农业农村现代化，与大湾区建设不符，错误。","B":"健康中国战略聚焦人民健康，与大湾区建设不符，错误。","C":"西部大开发针对西部地区发展，粤港澳大湾区不属于西部，错误。","D":"粤港澳大湾区建设推动内地与港澳深度合作、促进区域协调发展，属于区域协调发展战略，正确。"},"sol":""},{"no":12,"id":"zz-mid01-q12","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"右图为2012年以来我国农村绝对贫困人口变化情况示意图。这意味着我国（　）"},{"t":"tbl","rows":[[{"t":"2012年以来我国农村绝对贫困人口变化示意图（单位：万人）","imgs":[]}],[{"t":"2012年\n9899","imgs":[]},{"t":"2013年\n8249","imgs":[]},{"t":"2014年\n7017","imgs":[]},{"t":"2015年\n5575","imgs":[]},{"t":"2016年\n4335","imgs":[]},{"t":"2017年\n3046","imgs":[]},{"t":"2018年\n1660","imgs":[]},{"t":"2019年\n551","imgs":[]},{"t":"2021年\n0","imgs":[]}]]}],"opts":["已取得脱贫攻坚战的胜利","同步富裕取得阶段性成果","已消除了城乡发展的差距","已摆脱社会主义初级阶段"],"ans":0,"why":{"A":"图示农村绝对贫困人口从9899万降到0，说明我国脱贫攻坚战取得全面胜利，正确。","B":"我们追求的是共同富裕，“同步富裕”本身就是错误说法，错误。","C":"城乡发展差距仍然存在，只是不断缩小，错误。","D":"我国仍处于并将长期处于社会主义初级阶段，错误。"},"sol":""},{"no":13,"id":"zz-mid01-q13","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"近年来，广州市人大常委会对全市人大代表联络站编号编码，群众扫码就能反映情况。“民意码上说、实事马上办”既解决了群众实际问题，又将群众的“金点子”转化为好建议。这说明（　）"},{"t":"p","v":"①民主是社会主义的生命\n②全过程人民民主是最广泛、最真实、最管用的民主\n③民主就是自由发表意见\n④民主选举是人民实现民主权利的重要形式"}],"opts":["①②","①④","②③","③④"],"ans":0,"why":{"A":"群众扫码提意见、实事马上办，体现了人民当家作主，也体现全过程人民民主的真实、管用，①②正确。","B":"④讲的是民主选举，材料反映的是民主协商、民主监督和民主管理，不对应，错误。","C":"③把民主等同于自由发表意见，缩小了民主的内涵（民主还包括选举、决策、管理、监督等），错误。","D":"含错误的③④，错误。"},"sol":""},{"no":14,"id":"zz-mid01-q14","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"某社区党组织推行“小院议事厅”协商实践，明确各环节操作标准，建立收集议题、筛选确定、会前公示、组织协商、形成决议、监督执行、反馈评估等闭环流程。这说明（　）"}],"opts":["法治是民主的基础，民主是法治的保障","中国共产党领导的多党合作与政治协商制度不断完善","协商民主只能解决小事，不能解决大事","基层民主制度不断完善，民主参与更加规范有序"],"ans":3,"why":{"A":"材料讲的是社区协商议事流程，没有涉及法治与民主的关系，错误。","B":"“小院议事厅”是基层群众自治中的协商实践，不是政党制度，错误。","C":"协商民主既议小事也议大事，“只能解决小事”说法错误。","D":"明确操作标准、建立从收集议题到反馈评估的闭环流程，说明基层民主制度不断完善、参与更加规范有序，正确。"},"sol":""},{"no":15,"id":"zz-mid01-q15","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"下面是小快时政学习中收集的资料，它们共同反映的主题是（　）"},{"t":"p","v":"★坚持教育优先发展\n★完善义务教育优质均衡推进机制\n★建成了世界规模最大的教育体系"}],"opts":["社会保障体系不断完善","意识形态建设成效卓著","平安中国建设迈向更高水平","教育普及水平实现历史性跨越"],"ans":3,"why":{"A":"社会保障讲的是养老、医疗、低保等，材料讲的是教育，错误。","B":"三条资料都与教育有关，不是意识形态建设，错误。","C":"平安中国建设指社会治安、公共安全，与材料无关，错误。","D":"“教育优先发展”“义务教育优质均衡”“世界规模最大的教育体系”共同指向教育普及水平的历史性跨越，正确。"},"sol":""},{"no":16,"id":"zz-mid01-q16","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"我国最北高铁——哈伊高铁，于2026年9月正式通车运营，两地之间的铁路运行时间由原来7小时缩短至最快1小时46分钟，极大提升沿线周边广大人民群众的出行品质。这条高铁的建成充分体现了我国（　）"}],"opts":["交通水平已领先世界","社会主要矛盾已得到解决","在发展中保障和改善民生","以交通建设作为工作中心"],"ans":2,"why":{"A":"“已领先世界”缺少依据，我国交通发展快但整体仍未全面领先，错误。","B":"社会主要矛盾仍然存在，正在通过发展逐步解决，错误。","C":"缩短出行时间、提升出行品质，直接改善人民生活，体现发展为了人民、在发展中保障和改善民生，正确。","D":"我国以经济建设为中心，交通建设是重要方面而不是工作中心，错误。"},"sol":""},{"no":17,"id":"zz-mid01-q17","unit":"第二单元 进入新时代","blocks":[{"t":"p","v":"从“盼温饱”到“盼环保”，从“求生存”到“求生态”，绿色正在充盈当代中国人的新梦想。践行简约适度、绿色低碳的生活方式，公民应该（　）"},{"t":"p","v":"①减少浪费，主动践行“光盘行动”\n②保护环境，严惩破坏环境的行为\n③垃圾分类，倡导文明生活新风尚\n④讲究环保，杜绝使用一次性筷子"}],"opts":["①②","①③","②④","③④"],"ans":1,"why":{"A":"②“严惩破坏环境的行为”是执法机关、政府的职责，不是公民个人能做到的，错误。","B":"①光盘行动减少浪费、③垃圾分类都是公民可以身体力行的绿色生活方式，正确。","C":"含错误的②，且④“杜绝”过于绝对，错误。","D":"④“杜绝使用”表述绝对化，公民应尽量少用而不是完全杜绝，错误。"},"sol":""},{"no":18,"id":"zz-mid01-q18","kind":"sub","unit":"第一单元 坚持党的全面领导","score":12,"blocks":[{"t":"p","v":"18.（12分）2026年是红军长征胜利90周年。传承长征精神，凝聚复兴伟力。"},{"t":"p","v":"【识·精神内涵】\n材料一　长征精神是中国共产党工农红军广大指战员在长征中所体现出来的为共产主义理想奋斗到底的精神。主要内涵：坚决跟着中国共产党走，高举马列主义、毛泽东思想的伟大旗帜；英勇顽强、艰苦奋斗、不怕困难、不怕牺牲的大无畏精神、集体主义、阶级友爱、严守纪律、同战友和群众患难与共、生死相依的革命精神；为祖国解放、为人民幸福不辞千辛万苦，甘愿赴汤蹈火的爱国主义精神，为共产主义崇高理想而奋斗的革命精神。\n（材料选自百度百科）"},{"t":"p","v":"【探·精神之源】\n材料二　一百多年前，中国共产党的先驱们创建了中国共产党，形成了伟大建党精神。一百多年来，中国共产党人弘扬伟大建党精神，在长期奋斗中构建起跨越时空、历久弥新的精神谱系。伟大长征精神形成于艰苦卓绝的革命岁月，它支撑着党领导人民创造了人类战争史上的奇迹。2021年9月，党中央批准了中央宣传部梳理的第一批纳入中国共产党人精神谱系的伟大精神，长征精神被纳入党的精神谱系之中。\n习近平总书记强调：“每一代人有每一代人的长征路，每一代人都要走好自己的长征路。”新的长征路，是党团结带领人民推进强国建设、民族复兴伟业的历史进程。弘扬长征精神，对于赓续红色血脉、坚定历史自信、走好新的长征路仍具有重要意义。"}],"parts":[{"ask":"历史川流不息，精神代代相传。长征精神中的“高举马列主义、毛泽东思想的伟大旗帜、坚定革命的理想和信念”是建党精神的内涵中“________、________”的具体体现。长征精神是属于________阶段的中国共产党人精神谱系。","score":4,"ans":"①坚持真理　②坚守理想；③新民主主义革命时期。（伟大建党精神的内涵是“坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民”；长征精神产生于新民主主义革命时期。）","pts":["坚持真理","坚守理想","新民主主义革命时期"]},{"ask":"走好新时代的长征路，长征精神仍有重要时代价值。请结合材料二，运用“弘扬伟大建党精神”的相关知识，对此加以说明。","score":8,"ans":"①伟大建党精神是中国共产党的精神之源，长征精神是其精神谱系中的重要内容，传承长征精神就是赓续红色血脉、传承党的精神基因。②长征精神所蕴含的坚定理想信念、不怕牺牲、艰苦奋斗的品格，能激励我们在推进强国建设、民族复兴的新征程上战胜各种困难挑战。③弘扬长征精神有利于坚定历史自信，凝聚起全体人民团结奋斗的精神力量。④每一代人有每一代人的长征路，青少年要继承和弘扬伟大建党精神，把个人理想融入国家和民族的事业，走好自己的长征路。","pts":["伟大建党精神是党的精神之源，长征精神是精神谱系的重要内容（赓续红色血脉）","坚定理想信念／不怕困难、艰苦奋斗，为新征程提供精神动力","坚定历史自信，凝聚民族复兴的精神力量","落实到青少年：弘扬伟大建党精神、走好自己的长征路"]}]},{"no":19,"id":"zz-mid01-q19","kind":"sub","unit":"第一单元 坚持党的全面领导","score":12,"blocks":[{"t":"p","v":"19.（12分）行程万里，人民至上。"},{"t":"p","v":"材料一　红色故事蕴含着中国共产党人的红色基因。\n故事一　在物质匮乏的60年代，铁人王进喜率领1205钻井队用生命找石油，“宁可少活二十年，拼命也要拿下大油田”，为新中国甩掉“贫油”的帽子作出了突出贡献。\n故事二　“国家需要我，我一定全力以赴。”于敏，28载隐姓埋名，带领科研团队，在氢弹技术上打破西方垄断，为我国氢弹的成功试爆作出了卓越贡献。\n故事三　决战脱贫，不满30岁的黄文秀放弃大城市的工作机会，主动请缨扎根大山，与群众想在一起、干在一起，谱写了新时代的青春之歌。"},{"t":"p","v":"材料二　以下是国家主席习近平近四年的新年贺词摘选。"},{"t":"tbl","rows":[[{"t":"时间","imgs":[]},{"t":"贺词摘选","imgs":[]}],[{"t":"2023","imgs":[]},{"t":"我们始终坚持人民至上，生命至上。","imgs":[]}],[{"t":"2024","imgs":[]},{"t":"人民永远是我们战胜一切困难挑战的最大依靠。我们的目标很宏伟，也很朴素，归根到底就是让老百姓过上更好的日子。","imgs":[]}],[{"t":"2025","imgs":[]},{"t":"家事国事天下事，让人民过上幸福生活是头等大事。","imgs":[]}],[{"t":"2026","imgs":[]},{"t":"“民生无小事，枝叶总关情”。柴米油盐、三餐四季，每个“小家”热气腾腾，中国这个“大家”就蒸蒸日上。","imgs":[]}]]}],"parts":[{"ask":"请阅读材料一，概括故事中的英雄人物共同展示的两个优秀品格。","score":4,"ans":"示例：①爱国奉献，把国家需要放在第一位（王进喜为甩掉“贫油”帽子拼命找石油，于敏为国研制氢弹隐姓埋名）；②艰苦奋斗、勇于担当（王进喜在物质匮乏的年代艰苦创业，黄文秀放弃大城市机会扎根大山脱贫攻坚）。（答出两点、言之有理即可，如“爱岗敬业”“服务人民”“甘于奉献”等亦可）","pts":["答出第一个品格（爱国奉献／国家利益至上／勇担重任）","答出第二个品格（艰苦奋斗／爱岗敬业／服务人民、甘于奉献）"]},{"ask":"请结合新年贺词，运用九上所学的知识，简要阐释党和国家为什么要坚持人民至上、重视民生福祉。","score":8,"ans":"①中国共产党的根本宗旨是全心全意为人民服务，党的初心使命是为中国人民谋幸福、为中华民族谋复兴，坚持人民至上是党的性质宗旨的必然要求。②我国是人民民主专政的社会主义国家，国家一切权力属于人民，人民是国家的主人。③党和政府坚持以人民为中心的发展思想，让人民群众共享发展成果；人民对美好生活的向往，就是党的奋斗目标。④发展的根本目的就是增进民生福祉，重视民生有利于实现共同富裕、促进社会公平正义，增强人民群众的获得感、幸福感、安全感。","pts":["党的性质宗旨／初心使命（全心全意为人民服务、为中国人民谋幸福）","国家性质：人民当家作主，国家一切权力属于人民","以人民为中心的发展思想／共享发展成果／党的奋斗目标","发展的根本目的是增进民生福祉（共同富裕、公平正义、获得感幸福感安全感）"]}]},{"no":20,"id":"zz-mid01-q20","kind":"sub","unit":"第二单元 进入新时代","score":12,"blocks":[{"t":"p","v":"20.（12分）某校开展“青春逢盛世，奋进‘十五五’”主题学习活动，请你参与。"},{"t":"p","v":"【成就篇】\n2025年是“十四五”收官之年，以习近平同志为核心的党中央团结带领全国各族人民，推动党和国家事业取得新的重大成就，第二个百年奋斗目标新征程实现良好开局。\n以下是初三某班展示的“中国腾飞谱新篇”展板（部分）"},{"t":"p","v":"展板一　◎经济实力大幅跃升。“十四五”时期，中国经济总量先后突破110万亿元、120万亿元、130万亿元、140万亿元，实现“四连跳”，以5.4%的年均增长继续领跑全球主要经济体。\n◎科技实力实现跨越式发展。全社会研发经费投入年均增长10%，每万人口高价值发明专利拥有量达到16件，攻克一批重大关键核心技术。"},{"t":"p","v":"展板二　◎中华优秀传统文化焕发生机，文物保护意识、文化遗产保护力度不断增强。\n◎2026年春晚节目《贺花神》以“十二花神”为叙事主线，融合历史人物、诗词典故与现代AI舞台技术和时代审美意象，让古老文化焕发全新面貌，一时间风靡海外。"},{"t":"p","v":"展板三　◎新时代以来，在习近平生态文明思想指引下，我国坚持山水林田湖草沙一体化保护和系统治理，深入推进蓝天、碧水、净土三大保卫战，生态环境质量不断提高。\n◎我国成为全球森林资源增长最快最多的国家，构建起全球最大、发展最快的可再生能源体系。良好生态不断创造综合效益，实现经济社会可持续发展。"},{"t":"p","v":"【奋进篇】\n“十五五”时期是我国基本实现社会主义现代化的关键时期。今年是中国共产党成立105周年，也是“十五五”规划开局之年。青春逢盛世，奋斗正当时。\n初三（1）班向全体同学发出了“与祖国共奋进”的行动倡议。\n倡议书：同学们：青春逢盛世，奋进“十五五”。与祖国同行，我们要自觉做到：①________。②________。让我们一起行动吧！——初三（1）班"}],"parts":[{"ask":"根据材料，运用所学道德与法治的知识，揭秘“中国腾飞谱新篇”的成功密码。","score":8,"ans":"①坚持中国共产党的领导，发挥党总揽全局、协调各方的领导核心作用（根本保证）。②坚持以经济建设为中心，坚持改革开放，推动高质量发展；坚持科教兴国、创新驱动发展战略，实现科技自立自强（展板一：经济总量“四连跳”、研发投入增长、攻克关键核心技术）。③坚定文化自信，推动中华优秀传统文化创造性转化、创新性发展，让传统文化与现代科技、时代审美相结合（展板二：《贺花神》）。④坚持人与自然和谐共生，践行绿水青山就是金山银山的理念，走绿色发展道路，建设美丽中国（展板三：生态保护与可再生能源）。⑤坚持以人民为中心的发展思想，让发展成果更多更公平惠及人民。","pts":["坚持中国共产党的领导（根本保证）","以经济建设为中心／改革开放／高质量发展、创新驱动、科技自立自强","坚定文化自信、推动中华优秀传统文化创造性转化创新性发展","坚持人与自然和谐共生、绿色发展（或坚持以人民为中心、共享发展）"]},{"ask":"请根据材料，结合实际，写出两点做法，将倡议书补充完整。","score":4,"ans":"示例：①树立远大理想，努力学习科学文化知识，培养创新精神和实践能力，为投身“十五五”建设打好基础；②从身边做起，践行绿色低碳生活，节约资源、垃圾分类，为建设美丽中国出一份力；③积极宣传中华优秀传统文化，做文化自信的传播者；④关注国家发展，参加社会实践和志愿服务，把个人梦想融入中国梦。（写出两点、具体可操作即可）","pts":["写出第一点具体做法（学习/创新/理想）","写出第二点具体做法（绿色生活/文化传承/社会实践），与“与祖国共奋进”相扣"]}]}]}]};

/* ================================================================
   基础工具
   ================================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const STAR=n=>'★'.repeat(Math.max(0,(n||1)-1));

/* 判分归一化：去空白、去标点、全角转半角 */
function norm(s){
  return String(s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s，。、；：""''（）()《》〈〉·—…\-__,.;:"'`~!@#$%^&*+=|\\/\[\]{}<>?！？]/g,'')
    .toLowerCase();
}
/* 长答案包容性判分：去掉"的地得了着和与及其之"再比，避免因为虚词差一个字就判错 */
const loose=s=>norm(s).replace(/[的地得了着和与及其之]/g,'');

/* ================================================================
   持久化
   ================================================================ */
const SK='kss_v1_'+(DATA&&DATA.subject||'x');
/* 续练会话单独存一个 key：不属于练习记录，系统「清空/导入记录」时一并重置 */
const SSK='kss_sess_v1_'+(DATA&&DATA.subject||'x');
const SCOPES=['all','star','weak','unseen'];
const SESS_MODES=['recite','cloze','choice','wrong','list','paper'];
const MODE_TXT={recite:'① 翻卡背',cloze:'② 填空闯',choice:'③ 四选一',wrong:'④ 错题强化',list:'⑤ 清单',paper:'⑥ 套卷'};
let P=loadProg();
function loadProg(){
  let d={cards:{},days:{},paper:{}};
  try{const raw=localStorage.getItem(SK);if(raw){const o=JSON.parse(raw);if(o&&o.cards)d=o;}}catch(e){}
  if(!d.days)d.days={};
  if(!d.paper)d.paper={};
  return d;
}
function saveProg(){ try{localStorage.setItem(SK,JSON.stringify(P));}catch(e){console.warn('保存失败',e);} }
/* ---- 续练会话：记住"练到哪一张/哪一轮"，退出或刷新后能接着练 ---- */
function saveSess(){
  if(!DATA)return;
  /* ⑤ 清单只是查看，不算"练到哪"：不覆盖上一次的练习位置 */
  if(S.mode==='list')return;
  const o={v:1,mode:S.mode,unit:S.unit,scope:S.scope,qi:S.qi,queue:S.queue.slice(),revealed:!!S.revealed,ts:Date.now()};
  if(PAPER)o.paper={pi:S.paper.pi,unit:S.paper.unit,range:S.paper.range,qi:S.paper.qi,queue:S.paper.queue.slice(),log:S.paper.log};
  try{localStorage.setItem(SSK,JSON.stringify(o));}catch(e){/* 隐私模式等存不了就算了 */}
}
function loadSess(){
  try{const raw=localStorage.getItem(SSK);if(!raw)return null;const o=JSON.parse(raw);return o&&o.v===1?o:null;}catch(e){return null;}
}
function clearSess(){try{localStorage.removeItem(SSK);}catch(e){}const el=$('#resume');if(el){el.hidden=true;el.innerHTML='';}}
function rec(cardId,ok,mode,opts){
  const p=P.cards[cardId]||(P.cards[cardId]={seen:0,ok:0,wrong:0,streak:0,last:0,mode:''});
  /* 第一次作答（seen 0→1）时记下这一次有没有答对：面板算「首次正确率」用，已有值不覆盖 */
  if(!p.seen&&p.firstOk==null)p.firstOk=ok?1:0;
  p.seen++;p.last=Date.now();p.mode=mode||p.mode;
  if(ok){p.ok++;p.streak=Math.min(9,p.streak+1);}else{p.wrong++;p.streak=0;}
  if(opts&&opts.skim)p.skim=(p.skim||0)+1;
  const d=todayKey(),t=P.days[d]||(P.days[d]={n:0,ok:0});
  t.n++;if(ok)t.ok++;
  saveProg();
  refreshStatx(cardId);   /* 答完当场更新题头的「对 X · 错 Y」 */
}
const getP=id=>P.cards[id]||null;
/* 安全取值：还没练过的卡也要能排序、能比大小 */
const PW=id=>getP(id)||{seen:0,ok:0,wrong:0,streak:0,last:0};
const scrollTop=()=>{try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){/* 有些环境没实现 */}};
function level(id){
  const p=getP(id);
  if(!p||!p.seen)return 0;
  if(p.streak>=3)return 3;
  if(p.streak>0)return 2;
  return 4; /* 有错待强化 */
}
const LVTXT={0:'未学',1:'未学',2:'记过',3:'熟练',4:'待强化'};

/* ================================================================
   考点解析：把【关键词】切出来
   ================================================================ */
function tokens(text){
  const out=[];let last=0,m;const re=/【([^】]+)】/g;
  while((m=re.exec(text))){
    if(m.index>last)out.push({t:'s',v:text.slice(last,m.index)});
    out.push({t:'b',v:m[1].split('|').map(s=>s.trim()).filter(Boolean)});
    last=m.index+m[0].length;
  }
  if(last<text.length)out.push({t:'s',v:text.slice(last)});
  return out;
}
/* 生成一张卡的渲染计划：段落 + 表格，占位符按出现顺序编号 */
function planOf(c){
  let k=0;const blanks=[];
  const paint=toks=>toks.map(t=>{
    if(t.t!=='b')return t;
    const o={t:'b',v:t.v,k:k};blanks.push(t.v);k++;return o;
  });
  const body=(c.a||[]).map(txt=>({type:'p',toks:paint(tokens(txt))}));
  if(c.table){
    const rows=(c.table.rows||[]).map(r=>r.map(cell=>paint(tokens(cell))));
    body.push({type:'table',head:c.table.head||[],rows});
  }
  return {body,blanks,count:k};
}
const PLAN={};DATA&&DATA.cards.forEach(c=>{PLAN[c.id]=planOf(c);});

function nowLine(toks){
  return toks.map(t=>t.t==='s'?esc(t.v):`<em class="kw" title="${esc(t.v.slice(1).join(' / ')||t.v[0])}">${esc(t.v[0])}</em>`).join('');
}
function inputLine(toks){
  return toks.map(t=>{
    if(t.t==='s')return esc(t.v);
    const w=Math.max(3,Math.min(11,t.v[0].length+1));
    return `<input class="bi" data-k="${t.k}" size="${w}" autocomplete="off" spellcheck="false" aria-label="填空">`;
  }).join('');
}

function renderAns(c,plan,cloze){
  const html=plan.body.map(it=>{
    if(it.type==='p'){
      return `<p class="ln">${cloze?inputLine(it.toks):nowLine(it.toks)}</p>`;
    }
    const head=it.head.map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=it.rows.map(r=>'<tr>'+r.map(cell=>`<td>${cloze?inputLine(cell):nowLine(cell)}</td>`).join('')+'</tr>').join('');
    return `<table class="tb"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }).join('');
  return html;
}
/* 批注分色显示：本课必背 / 易错 / 注意 / 补充（转录备注） */
function warnHTML(c){
  if(!c.warn)return '';
  return String(c.warn).split('；').map(s=>s.trim()).filter(Boolean).map(s=>{
    let kind='补充',body=s,m;
    if(m=s.match(/^本课必背(一句话)?[：:]?\s*(.*)$/)){kind='必背';body=m[2];}
    else if(m=s.match(/^(易错点|易混易错|易错|易混)[：:]?\s*(.*)$/)){kind='易错';body=m[2];}
    else if(m=s.match(/^(注意提法|注意)[：:]?\s*(.*)$/)){kind='注意';body=m[2];}
    return `<div class="warn k-${kind}"><b>${kind}</b>${esc(body)}</div>`;
  }).join('');
}
function pageLink(c){
  if(!c.page)return '';
  const base=(DATA.imgBase||'images/'),pre=DATA.imgPrefix||'',ext=DATA.imgExt||'jpg';
  return ` <a href="${esc(base+pre+c.page+'.'+ext)}" target="_blank" rel="noopener">对照原页 p${c.page}</a>`;
}
/* 累计对/错次数标签：同一张卡反复错会一直累加，答对也不清零 */
function statxHTML(id){
  const p=getP(id);
  if(!p||!p.seen)return '';
  return `<span class="statx" title="这张卡累计答对 / 答错次数（答对不清零，方便看同一处反复错）">`+
    `<b class="ok">对 ${p.ok}</b> · <b class="${p.wrong>0?'bad':''}">错 ${p.wrong}</b> · 做过 ${p.seen}</span>`;
}
/* 刚答完就要更新题头，不能等下一题重渲染 */
function refreshStatx(id){
  const box=document.querySelector('#stage .card .meta .mt');
  if(!box)return;
  const html=statxHTML(id);
  if(!html)return;
  const el=box.querySelector('.statx');
  if(el)el.outerHTML=html; else box.insertAdjacentHTML('beforeend',html);
}
function metaHTML(c){
  const bits=[];
  if(c.unit)bits.push(`<span class="u">${esc(c.unit)}</span>`);
  if(c.lesson)bits.push(esc(c.lesson));
  if(c.node)bits.push(esc(c.node));
  const lv=level(c.id);
  const statx=statxHTML(c.id);
  return `<div class="meta"><span class="mt">${bits.join(' ／ ')}${statx}</span>`+
    `<span class="mr">${pageLink(c)}<span class="stars">${STAR(c.star)}</span>`+
    `<span class="lv lv${lv}">${lv===4?'待强化':LVTXT[lv]}</span></span></div>`;
}

/* ================================================================
   全局状态
   ================================================================ */
const UNITS=[...new Set((DATA?DATA.cards:[]).map(c=>c.unit||'未分单元'))];
const S={mode:'recite',unit:'全部',scope:'all',queue:[],qi:0,revealed:false,scored:false,cur:null,curPlan:null,choice:null,optDone:false,
  paper:{pi:0,unit:'全部',range:'seq',queue:[],qi:0,log:{},pick:null,echo:null}};
const hasBlanks=c=>PLAN[c.id].count>0;
const CARD_BY=id=>DATA.cards.find(c=>c.id===id);

/* ================================================================
   统计条
   ================================================================ */
function renderBar(){
  if(S.mode==='paper'&&PAPER){paperBar();return;}
  const cards=DATA.cards;
  const n=cards.length;
  let ok=0,weak=0,done=0,tok=0,twrong=0;
  cards.forEach(c=>{const p=getP(c.id);if(!p||!p.seen)return;done++;
    tok+=p.ok||0;twrong+=p.wrong||0;
    const lv=level(c.id);if(lv===3)ok++;if(lv===4)weak++;});
  const d=P.days[todayKey()]||{n:0,ok:0};
  const rate=d.n?Math.round(d.ok/d.n*100):0;
  $('#bar').innerHTML=
    `<div class="row"><span class="pill">考点 <b>${n}</b></span>`+
    `<span class="pill ok">已熟练 <b>${ok}</b></span>`+
    `<span class="pill bad">待强化 <b>${weak}</b></span>`+
    `<span class="pill" title="全部考点卡的累计答对 / 答错次数（同一张卡反复错也会累加）">累计 对 <b style="color:var(--ok)">${tok}</b> / 错 <b style="color:var(--bad)">${twrong}</b></span>`+
    `<span class="pill">今天 <b>${d.n}</b> 题 · <b>${rate}%</b></span></div>`+
    `<div class="row">`+
    `<select id="fu" title="按单元（做题和 ⑤ 清单 都按它筛）">${['全部',...UNITS].map(u=>`<option${u===S.unit?' selected':''}>${esc(u)}</option>`).join('')}</select>`+
    `<select id="fs" title="${S.mode==='list'?'筛选范围（清单里只显示符合条件的卡）':'练习范围（做题和 ⑤ 清单 都按它筛）'}">
      <option value="all"${S.scope==='all'?' selected':''}>全部范围</option>
      <option value="star"${S.scope==='star'?' selected':''}>${S.mode==='list'?'只看★必背':'只练★必背'}</option>
      <option value="weak"${S.scope==='weak'?' selected':''}>${S.mode==='list'?'只看待强化':'只练未熟练'}</option>
      <option value="unseen"${S.scope==='unseen'?' selected':''}>${S.mode==='list'?'只看没练过':'只练没练过'}</option>
    </select>`+
    `<span class="sp"></span>`+
    `<button class="linkbtn" id="exp" title="把练习记录导出成文件（备份/换设备）">导出记录</button>`+
    `<button class="linkbtn" id="imp" title="从文件导入练习记录">导入记录</button>`+
    `<button class="linkbtn" id="rst" title="清空本机的练习记录">清空</button></div>`;
  $('#fu').onchange=e=>{S.unit=e.target.value;S.qi=0;buildQueue();render();};
  $('#fs').onchange=e=>{S.scope=e.target.value;S.qi=0;buildQueue();render();};
  $('#exp').onclick=exportProg;
  $('#imp').onclick=importProg;
  $('#rst').onclick=()=>{
    if(!confirm('清空全部练习记录？（不可恢复，建议先「导出记录」）'))return;
    P={cards:{},days:{},paper:{}};saveProg();
    clearSess();
    if(S.mode==='paper')buildPaper();
    S.qi=0;buildQueue();render();
  };
}
function exportProg(){
  const blob=new Blob([JSON.stringify({subject:DATA.subject,exported:new Date().toISOString(),data:P},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${DATA.subject}-练习记录-${todayKey()}.json`;
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function importProg(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        const d=o.data&&o.data.cards?o.data:o;
        if(!d.cards)throw new Error('文件里没有 cards');
        if(!confirm(`导入后会用文件里的记录覆盖本机记录（文件里 ${Object.keys(d.cards).length} 张卡的记录）。继续？`))return;
        P={cards:d.cards||{},days:d.days||{},paper:d.paper||{}};saveProg();
        clearSess();
        if(S.mode==='paper')buildPaper();
        S.qi=0;buildQueue();render();
      }catch(e){alert('导入失败：'+e.message);}
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ================================================================
   队列
   ================================================================ */
function pool(){
  let a=DATA.cards.slice();
  if(S.unit!=='全部')a=a.filter(c=>(c.unit||'未分单元')===S.unit);
  if(S.scope==='star')a=a.filter(c=>(c.star||1)>=2);
  if(S.scope==='unseen')a=a.filter(c=>!getP(c.id)||!getP(c.id).seen);
  if(S.scope==='weak')a=a.filter(c=>{const lv=level(c.id);return lv===0||lv===2||lv===4;});
  return a;
}
function buildQueue(){
  let a=pool();
  if(S.mode==='cloze')a=a.filter(hasBlanks);
  if(S.mode==='wrong')a=a.filter(c=>{const p=getP(c.id);return p&&p.wrong>0&&p.streak<2;});
  if(S.mode==='choice')a=a.filter(hasBlanks);
  if(S.mode==='wrong'||S.mode==='choice')a.sort((x,y)=>PW(y.id).wrong-PW(x.id).wrong);
  else a.sort((x,y)=>(PW(x.id).seen?1:0)-(PW(y.id).seen?1:0));
  S.queue=a.map(c=>c.id);
  if(S.qi>=S.queue.length)S.qi=0;
}
function setProg(){
  const el=$('#prog');
  if(S.mode==='paper'){
    if(!S.paper.queue.length){el.hidden=true;return;}
    el.hidden=false;
    $('i',el).style.width=Math.round((S.paper.qi+1)/S.paper.queue.length*100)+'%';
    return;
  }
  if(!['recite','cloze','choice','wrong'].includes(S.mode)||!S.queue.length){el.hidden=true;return;}
  el.hidden=false;
  $('i',el).style.width=Math.round((S.qi+1)/S.queue.length*100)+'%';
}

/* ================================================================
   渲染入口
   ================================================================ */
function render(){
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===S.mode));
  renderBar();setProg();
  const st=$('#stage');
  if(S.mode==='list')renderList(st);
  else if(S.mode==='paper')renderPaper(st);
  else if(!S.queue.length){st.innerHTML=emptyHTML();renderNav(st);}
  else{
    const c=CARD_BY(S.queue[S.qi]);
    if(!c)st.innerHTML=emptyHTML();
    else{
      if(S.mode==='choice')renderChoice(st,c);
      else if(S.mode==='cloze')renderCloze(st,c);
      else renderRecite(st,c);
      renderNav(st);
    }
  }
  /* ④ 错题强化：套卷错题不在卡片队列里，单独列一块，免得以为"错题没进错题栏" */
  if(S.mode==='wrong')appendPaperWrong(st);
  /* 每次状态变化都顺手记下位置：手机切走/刷新/被杀掉后能回到这里 */
  saveSess();
}
function emptyHTML(){
  if(S.mode==='paper'){
    const tips={
      weak:'错过的题会自动进来；做对了也留着，确认真会了在「错题本」里勾「我会了」才清掉。',
      unseen:'这个范围里的题都做过了，换成「整卷顺序」或「只做错题」。',
      seq:'换一个单元，或把范围改成「整卷顺序」。',
      round:'这一份卷子没有匹配的题。'
    };
    return `<div class="card empty"><span class="big">${S.paper.range==='weak'?'🎉':'🗂'}</span>${
      S.paper.range==='weak'?'当前范围没有待强化的错题。':'当前范围没有可做的题。'}
      <div class="hint">${tips[S.paper.range]||''}</div></div>`;
  }
  const pwN=PAPER?wrongBookList().length:0;
  const tips={
    recite:'把「练习范围」改成"全部范围"，或点上面的单元重新选。',
    cloze:'这一类里没有可挖空的考点，换「翻卡背」练。',
    choice:'这一类里没有可挖空的考点，换「翻卡背」练。',
    wrong:pwN?'下面列的就是套卷错题，点「回炉这题」直接做。':'太棒了，错题已经清空。错过的题会自动进来；做对了也留着，勾「我会了」才清掉。'
  };
  const wrongEmpty=pwN?('考点卡这边清空了，下面还有 '+pwN+' 道<b>试卷错题</b>。'):'当前范围没有待强化的错题。';
  return `<div class="card empty"><span class="big">${S.mode==='wrong'?'🎉':'🗂'}</span>${
    S.mode==='wrong'?wrongEmpty:(S.scope==='unseen'?'这个范围里的考点都练过了。':'当前范围没有匹配的考点。')}
    <div class="hint">${tips[S.mode]||''}</div></div>`;
}
/* ④ 里的「试卷错题」区块：只列套卷错题（卡片错题已经在上面排队了） */
function paperWrongSection(){
  if(!PAPER)return '';
  const all=wrongBookList();
  if(!all.length)return '';
  const list=all.slice(0,10);
  const rows=list.map(({q,p})=>`<div class="pwrong">
      <span class="wq">第 ${esc(q.no)} 题</span>
      <span class="wunit">${esc(q.unit||'未分单元')}</span>
      <span class="wcnt">累计错 ${p.wrong} 次</span>
      <span class="sp"></span>
      <button class="btn sm" data-pwredo="${esc(q.id)}">回炉这题</button>
    </div>`).join('');
  return `<div class="card"><div class="row" style="display:flex;align-items:center;gap:8px">
      <h3 style="margin:0;font-size:15px">试卷错题（${all.length} 道）</h3>
      <button class="linkbtn" data-pwall="1" style="margin-left:auto">打开套卷错题本 →</button>
    </div>
    <div class="hint" style="margin-top:6px">这是 ⑥ 套卷里错过的题，不在上面的考点卡队列里。做对了也留着（记着累计错次），真会了去错题本勾「我会了」清掉。</div>
    ${rows}
    ${all.length>list.length?`<div class="hint">还有 ${all.length-list.length} 道，去套卷错题本里看全。</div>`:''}</div>`;
}
function appendPaperWrong(st){
  const html=paperWrongSection();
  if(!html)return;
  st.insertAdjacentHTML('beforeend',html);
  const box=st.lastElementChild;
  const go=id=>{
    S.mode='paper'; S.paper.range='weak';
    buildPaper();
    let i=S.paper.queue.indexOf(id);
    if(i<0){ S.paper.queue.push(id); i=S.paper.queue.length-1; }
    S.paper.qi=i; S.paper.echo=null;
    render(); scrollTop();
  };
  $$('[data-pwredo]',box).forEach(b=>b.onclick=()=>go(b.dataset.pwredo));
  const all=$('[data-pwall]',box);
  if(all)all.onclick=()=>renderWrongBook();
}
function renderNav(st){
  const nav=document.createElement('div');
  nav.className='nav';
  if(S.mode==='paper'){
    if(!S.paper.queue.length)return;
    nav.innerHTML=`<button class="btn sm" id="pv"${S.paper.qi===0?' disabled':''}>← 上一题</button>
       <span>${S.paper.qi+1} / ${S.paper.queue.length}</span>
       <button class="btn sm" id="nx">下一题 →</button>`;
    st.appendChild(nav);
    const pv=$('#pv',nav),nx=$('#nx',nav);
    if(pv&&!pv.disabled)pv.onclick=()=>{S.paper.qi--;S.paper.echo=null;render();scrollTop();};
    if(nx)nx.onclick=()=>paperNext();
    return;
  }
  const inSess=['recite','cloze','choice','wrong'].includes(S.mode);
  nav.innerHTML=inSess&&S.queue.length
    ? `<button class="btn sm" id="pv"${S.qi===0?' disabled':''}>← 上一题</button>
       <span>${S.qi+1} / ${S.queue.length}</span>
       <button class="btn sm" id="nx">下一题 →</button>`
    : `<span></span><span></span><span></span>`;
  st.appendChild(nav);
  const pv=$('#pv',nav),nx=$('#nx',nav);
  if(pv&&!pv.disabled)pv.onclick=()=>{S.qi--;S.revealed=false;S.scored=false;render();};
  if(nx)nx.onclick=()=>{nextCard();};
}
function nextCard(){
  if(S.qi<S.queue.length-1){S.qi++;S.revealed=false;S.scored=false;render();}
  else{
    const st=$('#stage');
    st.insertAdjacentHTML('afterbegin',`<div class="verdict ok" style="margin-bottom:0"><b>这一轮走完了 ✓</b><br>一共 ${S.queue.length} 题。看看上面的统计：标「待强化」的就是还没拿稳的，去 ④ 错题强化 或 ⑤ 清单 里再处理。</div>`);
    scrollTop();
  }
}

/* ---------------- ① 翻卡背 ---------------- */
function renderRecite(st,c){
  const p=PLAN[c.id];
  st.innerHTML=`<div class="card">${metaHTML(c)}
    <div class="q" id="q">${esc(c.q)}</div>
    ${S.revealed?`<div class="ans" id="ans"><div class="lead">答案要点：</div>${renderAns(c,p,false)}${warnHTML(c)}</div>`:''}
    <div class="acts" id="acts"></div>
  </div>`;
  const acts=$('#acts',st);
  if(!S.revealed){
    acts.innerHTML=`<button class="btn p" id="show">显示答案（空格）</button>

  }else{
    acts.innerHTML=`<span class="hint" style="margin:0 4px 0 0">老实说：</span>
      <button class="btn g" data-v="1">会了（1）</button>
      <button class="btn" data-v="0.5">有点模糊（2）</button>
