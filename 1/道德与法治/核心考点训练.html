<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>核心考点训练</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf8; --ink:#22201d; --sub:#6b6560; --line:#e2ddd2;
  --acc:#1f6f8b; --acc-soft:#e3eff4; --ok:#1f7a4d; --ok-soft:#e2f3e9;
  --bad:#b3352c; --bad-soft:#fbe7e4; --warn:#b06a11; --warn-soft:#fdf0dc;
  --r:14px; --sh:0 2px 10px rgba(40,35,30,.07);
}
html[data-subj="历史"]{ --acc:#9a5b18; --acc-soft:#f6ecdd; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.75 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button,select,input{font-family:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 90px}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:860px;margin:0 auto;padding:10px 14px 0}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{font-size:17px;letter-spacing:.3px}
.brand span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);
  padding:7px 13px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s;
}
.tabs button:hover{border-color:var(--acc);color:var(--acc)}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

/* ---------- 统计条 ---------- */
.bar{display:flex;flex-direction:column;gap:7px;margin:12px 0 4px;font-size:13px;color:var(--sub)}
.bar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill b{color:var(--ink);font-size:14px}
.pill.ok b{color:var(--ok)} .pill.bad b{color:var(--bad)}
.bar select{font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);max-width:190px}
.bar select#fs{max-width:118px}
.bar .sp{flex:1}
.linkbtn{background:none;border:0;color:var(--acc);font-size:13px;cursor:pointer;padding:4px 2px;text-decoration:underline dotted}
.prog{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 0}
.prog>i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 18px 16px;margin-top:14px}
.meta{display:flex;align-items:baseline;gap:10px;font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:10px;word-break:break-word}
.meta .mt{flex:1 1 auto;min-width:0}
.meta .mr{flex:0 0 auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.meta .u{color:var(--acc);font-weight:600}
.meta .pg a{color:var(--sub);text-decoration:none;border-bottom:1px dotted var(--line)}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px;vertical-align:2px}
.q{font-size:19px;line-height:1.65;font-weight:600;margin:0 0 4px}
.q .tag{display:inline-block;font-size:12px;font-weight:500;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:1px 7px;margin-right:7px;vertical-align:2px}
.ans{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.ans .ln{margin:0 0 9px;line-height:1.95}
.ans .ln:last-child{margin-bottom:0}
.ans .lead{color:var(--sub);font-size:12px;margin:0 0 8px}
.kw{font-style:normal;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:0 3px;box-decoration-break:clone}
.hidekw .kw{color:transparent;background:#efece5;border-radius:4px;cursor:pointer;user-select:none}
.hidekw .kw:hover{color:var(--bad);background:var(--bad-soft)}
.warn{margin-top:8px;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:7px 12px;font-size:13.5px;color:#6d4a12;line-height:1.7}
.warn b{color:var(--warn);margin-right:5px;font-size:12px}
.warn.k-必背{background:var(--acc-soft);border-left-color:var(--acc);color:#1c4a5c}
.warn.k-必背 b{color:var(--acc)}
.warn.k-注意{background:#fdf6e3;border-left-color:#d9a520;color:#6b5312}
.warn.k-注意 b{color:#b8860b}
.warn.k-补充{background:#f3f1ec;border-left-color:#c6bfb2;color:var(--sub);font-size:12.5px}
.warn.k-补充 b{color:#9a9288}
table.tb{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;line-height:1.7}
table.tb th{background:var(--acc-soft);color:var(--acc);font-weight:600;font-size:13px}

/* ---------- 填空 ---------- */
.bi{
  font-size:15px;padding:0 6px;margin:0 2px;border:0;border-bottom:2px dashed var(--acc);
  background:transparent;border-radius:5px 5px 0 0;color:var(--ink);text-align:center;min-width:56px;
}
.bi::placeholder{color:#bdb7ac}
.bi:focus{outline:2px solid var(--acc);outline-offset:1px;background:#fff;border-bottom-style:solid}
.bi.ok{background:var(--ok-soft);border-bottom-style:solid}
.bi.bad{background:var(--bad-soft);border-bottom-style:solid;text-decoration:line-through}
.given{color:var(--ok);font-weight:700;white-space:nowrap}
.given::before{content:"→";font-weight:400;color:var(--sub);margin:0 1px}

/* ---------- 选项 ---------- */
.opts{display:grid;gap:9px;margin-top:14px}
.opts button{
  text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-size:16px;line-height:1.6;cursor:pointer;transition:.12s;color:var(--ink);
}
.opts button:hover{border-color:var(--acc);background:var(--acc-soft)}
.opts button:disabled{cursor:default;opacity:.9}
.opts button.c{background:var(--ok-soft);border-color:var(--ok);font-weight:700;color:var(--ok)}
.opts button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opts button .kk{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;background:var(--bg);font-size:12px;margin-right:9px;color:var(--sub)}

/* ---------- 底部操作 ---------- */
.acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.p:hover{filter:brightness(1.08);color:#fff}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.verdict{margin-top:14px;border-radius:10px;padding:11px 14px;font-size:15px;line-height:1.7}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bfe3cd}
.verdict.bad{background:var(--bad-soft);color:var(--bad);border:1px solid #f0c8c2}
.verdict b{font-size:16px}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--sub)}
.nav .btn{flex:0 0 auto}
.empty{text-align:center;color:var(--sub);padding:46px 10px;font-size:15px;line-height:2}
.empty .big{font-size:34px;display:block;margin-bottom:6px}

/* ---------- 清单 ---------- */
.unitbox{margin-top:16px}
.unitbox>h3{font-size:15px;margin:0 0 8px;padding:8px 12px;background:var(--acc-soft);color:var(--acc);border-radius:9px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.unitbox>h3 span{font-size:12px;font-weight:400;color:var(--sub)}
details.k{margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
details.k>summary{cursor:pointer;padding:11px 14px;font-size:15px;font-weight:600;line-height:1.6;list-style:none;display:flex;gap:8px;align-items:flex-start}
details.k>summary::-webkit-details-marker{display:none}
details.k>summary::before{content:"▸";color:var(--acc);flex:0 0 auto;transition:.15s}
details.k[open]>summary::before{transform:rotate(90deg)}
details.k>summary:hover{background:var(--acc-soft)}
details.k .bd{padding:0 14px 14px}
.lv{flex:0 0 auto;font-size:11px;font-weight:500;border-radius:6px;padding:1px 7px;margin-top:4px}
.lv0{background:#eee;color:#8b8b8b}.lv1{background:var(--warn-soft);color:var(--warn)}
.lv2{background:var(--acc-soft);color:var(--acc)}.lv3{background:var(--ok-soft);color:var(--ok)}
.lv4{background:var(--bad-soft);color:var(--bad)}
.searchbox{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;margin-top:12px}
.report{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:16px}
.report h3{margin:0 0 8px;font-size:15px}
.report ul{margin:0;padding-left:20px;font-size:14px;line-height:1.9}
.report li b{color:var(--bad)}
.ubars{margin:8px 0 0}
.ubar{display:flex;align-items:center;gap:9px;font-size:13px;margin:5px 0;color:var(--sub)}
.ubar .nm{flex:0 0 246px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubar .tr{flex:1;height:7px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.ubar .tr i{display:block;height:100%;background:var(--ok);width:0}
.ubar .pc{flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}

/* ---------- 套卷（⑥） ---------- */
.pstem{font-size:17px;line-height:1.8;font-weight:600;margin:0 0 10px}
.pstem p{margin:0 0 8px}
.pstem p:last-child{margin-bottom:0}
.figs{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 12px}
.figs figure{margin:0;flex:1 1 200px;min-width:120px;max-width:100%}
.figs img{width:100%;height:auto;border:1px solid var(--line);border-radius:9px;background:#fff;display:block}
.ptbl{width:100%;border-collapse:collapse;margin:4px 0 12px;font-size:14px;table-layout:auto}
.ptbl td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;line-height:1.75}
.ptbl td.cap{background:var(--acc-soft);color:var(--acc);font-weight:600;border-color:var(--acc-soft)}
.ptbl td img{max-width:100%;height:auto;border-radius:7px;display:block;margin:0 0 6px}
.ptbl .tx{white-space:pre-line;display:block}
.whybox{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
.whybox .lead{color:var(--sub);font-size:12px;margin:0 0 8px}
.whyrow{display:flex;gap:9px;font-size:14.5px;line-height:1.85;margin:0 0 8px;color:var(--sub)}
.whyrow .k{flex:0 0 auto;width:21px;height:21px;line-height:21px;text-align:center;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--sub);margin-top:3px}
.whyrow.right{color:var(--ink)}
.whyrow.right .k{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.whyrow.right .tx{font-weight:600}
.whysol{font-size:14.5px;line-height:1.9;white-space:pre-line}
.pno{font-variant-numeric:tabular-nums}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.jump button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--bad)}
.jump button:hover{border-color:var(--acc);color:var(--acc)}
.optrow{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:15.5px;line-height:1.65;margin:0 0 8px;background:#fff}
.optrow .kk{flex:0 0 auto;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;background:var(--bg);font-size:12px;color:var(--sub);margin-top:2px}
.optrow.c{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.optrow.c .kk{background:var(--ok);color:#fff}
.scoreline{font-size:15px;line-height:2}
.scoreline b{font-size:22px;color:var(--acc);margin:0 3px}

@media (max-width:520px){
  .q{font-size:17.5px}
  .card{padding:15px 13px 13px}
  .brand b{font-size:15px}
  .pill{padding:2px 9px}
  .ubar .nm{flex-basis:150px}
  /* 六个标签尽量一屏放下，手机上不用横向滚才发现 ⑥ */
  .tabs button{padding:6px 9px;font-size:13px}
  .tabs{gap:5px}
  .pstem{font-size:16px}
  .ptbl{font-size:13px}
  .ptbl td{padding:6px 8px}
}
@media print{
  header,.tabs,.bar,.acts,.nav,.searchbox,.no-print{display:none!important}
  body{background:#fff}
  .card,details.k,.unitbox{box-shadow:none;break-inside:avoid}
  details.k .bd{display:block!important}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><b id="ttl">核心考点训练</b><span id="sb"></span></div>
    <div class="tabs" id="tabs">
      <button data-mode="recite" aria-selected="true">① 翻卡背</button>
      <button data-mode="cloze">② 填空闯</button>
      <button data-mode="choice">③ 四选一</button>
      <button data-mode="wrong">④ 错题强化</button>
      <button data-mode="list">⑤ 清单</button>
      <button data-mode="paper" id="tabPaper" hidden>⑥ 套卷</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="bar" id="bar"></div>
  <div class="prog" id="prog" hidden><i></i></div>
  <main id="stage"></main>
</div>

精神风范和【意志品质】。"],"star":3},{"id":"zz-p1-09","page":1,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"1","q":"伟大建党精神之“对党忠诚、不负人民”的具体内涵是什么？","a":["就是无条件地对党的【信仰】、【组织】、【理论】和【路线方针政策】忠诚，始终坚持【全心全意为人民服务】的【根本宗旨】，【政治担当和人民立场】。"],"star":3},{"id":"zz-p1-10","page":1,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"2","q":"伟大建党精神的地位是什么？（重要性之一）","a":["地位：伟大建党精神是中国共产党人的【精神之源】。"],"star":3,"warn":"时代价值/作用/为什么要"},{"id":"zz-p1-11","page":1,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"2","q":"伟大建党精神的重要性之①：为什么说精神代代相传？","a":["①精神代代相传。伟大建党精神成为激励全党全国各族人民【攻坚克难、奋勇前行】的【强大精神动力】。在长期奋斗中构建起中国共产党人的【精神谱系】。"],"star":3,"warn":"不是物质力量"},{"id":"zz-p1-12","page":1,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"2","q":"伟大建党精神的重要性之②：以伟大建党精神为源头的精神谱系有什么意义？","a":["②以伟大建党精神为源头的中国共产党人的【精神谱系】，【跨越时空、历久弥新】，凝聚着中国共产党人的【伟大品格】。党才能【生生不息】"],"star":3},{"id":"zz-p2-01","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"3","q":"我们如何弘扬伟大建党精神？（1）（学习上：学、知）","a":["（1）学习【革命先辈事迹和精神】，传承【红色基因】。"],"star":1,"warn":"书上标注：学、知"},{"id":"zz-p2-02","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"3","q":"我们如何弘扬伟大建党精神？（2）（行动上：行）","a":["（2）积极参加【志愿服务活动】，把伟大建党精神转化为【学习和生活的实际行动】。"],"star":1,"warn":"书上标注：行"},{"id":"zz-p2-03","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"3","q":"我们如何弘扬伟大建党精神？（3）（情感上：情）","a":["（3）积极参与【红色文化教育活动】，【厚植爱国主义】，增强【爱党爱国情感】。"],"star":1,"warn":"书上标注：情"},{"id":"zz-p2-04","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","no":"3","q":"我们如何弘扬伟大建党精神？（4）（信念上：信、思）","a":["（4）【坚定信仰】，把【个人理想】和【国家理想】（【民族复兴梦】）相结合。"],"star":1,"warn":"书上标注：信、思"},{"id":"zz-p2-05","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第一课 百年大党风华正茂","node":"二、弘扬伟大建党精神","q":"★题型总结：青少年为主体的开放性做法类、问答题的答题思路是什么？","a":["①思想上：学习【榜样和精神】，个人与理想【国家理想】相结合；【厚植爱国主义】，听党话跟党走；","②行动上：践行【精神】，勇担责任，【志愿服务奉献】。","③学习上：学习【知识】、提升【能力】，为复兴梦【成才】。"],"star":3,"warn":"青少年为主体的开放性做法类、问答题：可根据主题和要求适当合并；紧扣主题"},{"id":"zz-p2-06","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"1","q":"中国共产党的初心使命是什么？","a":["——为【中国人民谋幸福】，为【中华民族谋复兴】。"],"star":3,"warn":"以人民为中心是发展思想；人民≠公民"},{"id":"zz-p2-07","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？（1）重要性","a":["（1）重要性：初心和使命，是激励一代代中国共产党人【前赴后继、英勇奋斗】的【根本动力】。"],"star":3,"warn":"多角度：必要性、重要性、意义"},{"id":"zz-p2-08","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？（2）重要地位","a":["（2）重要地位：初心使命是党的【性质宗旨】、【理想信念】、【奋斗目标】的【集中体现】。"],"star":3},{"id":"zz-p2-09","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？①党的性质是什么？","a":["①党的性质：中国共产党是【中国工人阶级的先锋队】，同时是【中国人民和中华民族的先锋队】，是中国特色社会主义事业的【领导核心】，代表中国先进【生产力】发展要求，代表中国先进【文化】的前进方向，代表中国【最广大人民的根本利益】"],"star":3},{"id":"zz-p2-10","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？②党的宗旨是什么？","a":["②党的宗旨：【全心全意为人民服务】"],"star":3},{"id":"zz-p2-11","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？③党的最高理想和最终目标是什么？","a":["③党的最高理想和最终目标：实现【共产主义】"],"star":3,"warn":"易错点"},{"id":"zz-p2-12","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","no":"2","q":"为什么要坚守党的初心使命？（3）初心使命的意义","a":["（3）初心使命的意义：①我们党才能在【极端困境中发展壮大】。②得到【人民拥护和支持】，书写【千秋伟业】，确保走在【时代前列】。"],"star":3},{"id":"zz-p2-13","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"一、牢记初心使命","q":"党的奋斗目标始终是什么？目标有什么特点？（补充了解）","a":["党的奋斗目标始终是：【人民对美好生活的向往】。","但目标不是抽象的，而是具体的，会结合实际、与时俱进。不同时期有不同目标。"],"star":1,"warn":"补充了解即可"},{"id":"zz-p2-14","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","q":"关于人民与江山关系的经典表述是什么？","a":["【人民就是江山，江山就是人民】。"],"star":2},{"id":"zz-p2-15","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"1","q":"为什么中国共产党要站稳人民立场？（1）（立场本身）","a":["（1）人民立场是中国共产党的【根本政治立场】。"],"star":3,"warn":"人民重要性、党与人民；其他原因可开放作答"},{"id":"zz-p2-16","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"1","q":"为什么中国共产党要站稳人民立场？（2）（人民的作用）","a":["（2）人民是【历史的创造者】，是决定党和国家前途命运的【根本力量】。"],"star":3,"warn":"易错点"},{"id":"zz-p2-17","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"1","q":"为什么中国共产党要站稳人民立场？（3）（作为马克思主义政党）","a":["（3）作为【马克思主义政党】，中国共产党始终【同人民在一起】，把【人民利益】放在第一位。"],"star":3},{"id":"zz-p2-18","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"2","q":"中国共产党如何站稳人民立场？（1）（践行党的根本宗旨）","a":["（1）我们党始终【践行党的根本宗旨】。（做法：坚持【全心全意为人民服务】，把人民【拥护不拥护、赞成不赞成】、【高兴不高兴、答应不答应】作为衡量一切工作得失的【根本标准】。）"],"star":3},{"id":"zz-p2-19","page":2,"unit":"第一单元 坚持党的全面领导","lesson":"第二课 坚持以人民为中心","node":"二、站稳人民立场","no":"2","q":"中国共产党如何站稳人民立场？（2）（贯彻党的群众路线）","a":["（2）我们党始终自觉【贯彻党的群众路线】。（做法：坚持【一切为了群众，一切依靠群众】，【从群众中来，到群众中去】，充分相信群众，依靠群众，发挥人民群众的【积极性、主动性、创造性】，使党的路线方针政策充分体现【人民群众的意愿】并得到有效贯彻落实。）"],"star":3},{"id":"zz-p3-01","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？①（党是领导一切的）","a":["①党是【领导一切】的。办好中国的事情，【关键在党】。坚持党对一切工作的领导，是党和国家的【根本所在、命脉所在】，是【中国各族人民】的【利益所在、幸福所在】。（P21）"],"star":3},{"id":"zz-p3-02","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？②（历史和现实的结论）","a":["②历史和现实都告诉我们，【没有中国共产党，就没有新中国】，就没有中国特色社会主义，就没有中华民族伟大复兴。中国共产党是中国特色社会主义事业的【坚强领导核心】"],"star":3},{"id":"zz-p3-03","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？③（最本质的特征）","a":["③中国共产党的领导是中国特色社会主义【最本质的特征】"],"star":3},{"id":"zz-p3-04","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？④（制度的最大优势）","a":["④中国共产党的领导是中国特色社会主义制度的【最大优势】"],"star":3},{"id":"zz-p3-05","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？⑤（最根本保证）","a":["⑤中国共产党的领导是实现【社会主义现代化】和【民族复兴】的【最根本保证】"],"star":3,"warn":"定海神针"},{"id":"zz-p3-06","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"为什么要坚持党的领导？⑥（党自身的角度）","a":["⑥坚持党的领导也是党自身的【宗旨和性质】决定的。"],"star":3},{"id":"zz-p3-07","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"1：党的领导与中国特色社会主义是什么关系？","a":["党的领导直接关系中国特色社会主义的【性质、方向和命运】。中国最大的【国情】就是【中国共产党的领导】。"],"star":2,"warn":"注意提法"},{"id":"zz-p3-08","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"一、坚强的领导核心","no":"1","q":"2：执政党、党组织、党员分别起什么作用？","a":["【执政党】、党中央【举旗定向】；党组织【战斗堡垒】；党员【先锋模范】“火种”。"],"star":2,"warn":"注意提法"},{"id":"zz-p3-09","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"2","q":"党的领导的特点是什么？领导核心的含义是什么？","a":["（1）特点：党的领导是【全面的、系统的、整体的】。领导核心：【总揽全局、协调各方】。"],"star":3},{"id":"zz-p3-10","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"2","q":"党的领导的作用是什么？","a":["（2）作用：党的领导体现在党和国家事业【各领域各方面各环节】，起到【把方向、谋大局、定政策、促改革】的【决定性作用】。"],"star":3},{"id":"zz-p3-11","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"3","q":"如何坚持和加强党的全面领导？（1）国家层面①（最重要）","a":["①坚持和加强党的全面领导，最重要的是【坚决维护党中央权威和集中统一领导】","原因：才能【统一思想】、【统一意志】，【步调一致】向前进。"],"star":3,"warn":"做法；国家层面：两个维护"},{"id":"zz-p3-12","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"3","q":"如何坚持和加强党的全面领导？（1）国家层面②（最关键，新时代）","a":["②在新时代，坚决维护党中央权威和集中统一领导，最关键的是坚决维护【习近平同志】党中央的【核心】、全党的【核心地位】","原因：是事业沿着【正确方向】发展的【根本保证】。"],"star":3},{"id":"zz-p3-13","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","no":"3","q":"如何坚持和加强党的全面领导？（2）个人层面的总体要求是什么？","a":["我们要坚定不移【听党话、跟党走】，努力成长为【德智体美劳全面发展】的【社会主义建设者和接班人】"],"star":3},{"id":"zz-p3-14","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","q":"个人层面做法（补充）：思想上怎么做？","a":["①思想上：【认同党的领导】，学习党的【理论知识】，坚定【道路自信】。"],"star":1,"warn":"补充：我们在日常生活中的具体做法；开放性"},{"id":"zz-p3-15","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","q":"个人层面做法（补充）：行动上怎么做？","a":["②行动上：努力学习，遵守规则，勇担【社会责任】，积极加入【共青团】。"],"star":1},{"id":"zz-p3-16","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","q":"个人层面做法（补充）：生活中怎么做？","a":["③生活中：维护【国家利益】，传承【红色基因】，践行【社会主义核心价值观】。"],"star":1},{"id":"zz-p3-17","page":3,"unit":"第一单元 坚持党的全面领导","lesson":"第三课 党是领导一切的","node":"二、坚持和加强党的全面领导","q":"个人层面做法（补充）：还有哪些具体举例？","a":["【积极宣传】……；【参观】…… 增强【爱党爱国情感】，传承【伟大建党精神】 等等"],"star":1},{"id":"zz-p4-01","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"1","q":"新时代我国社会主要矛盾是什么？（内涵与地位）","a":["（1）内涵：我国社会主要矛盾已经转化为【人民日益增长的美好生活需要】和【不平衡不充分的发展】之间的矛盾。","（2）地位：这是我国进入新时代的【基本依据】。"],"star":2},{"id":"zz-p4-02","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"2","q":"为什么社会主要矛盾会发生转化？","a":["（1）随着改革开放深入推进，社会生产力水平总体上【显著提高】。","（2）进入新时代，人民对美好生活的向往更加强烈、需要日益广泛。","（3）我国的发展不平衡不充分，已经成为满足人民日益增长的美好生活需要的【主要制约因素】。"],"star":1,"warn":"了解层次"},{"id":"zz-p4-03","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"3","q":"如何准确认识和把握社会主要矛盾的变化？（发展是动态的）","a":["（1）发展是动态的，不平衡不充分是永远存在的。"],"star":1},{"id":"zz-p4-04","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"3","q":"我国社会主要矛盾发生变化后，仍然没有变的“两个没有变”是什么？","a":["（2）我国社会主要矛盾发生变化，但我国仍处于并将长期处于【社会主义初级阶段】的基本国情没有变，我国是【世界最大发展中国家】的国际地位没有变。"],"star":2},{"id":"zz-p4-05","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"3","q":"准确认识和把握社会主要矛盾的变化，提出了什么要求？","a":["（3）要求：要牢牢把握社会主义初级阶段这个【基本国情】，牢牢立足社会主义初级阶段这个【最大实际】，毫不动摇贯彻党在社会主义初级阶段的【基本路线】。"],"star":1},{"id":"zz-p4-06","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"一、社会主要矛盾的变化","no":"4","q":"党在社会主义初级阶段的基本路线是什么？","a":["领导和团结全国各族人民，以【经济建设】为中心，坚持【四项基本原则】，坚持【改革开放】，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。"],"star":1,"warn":"了解层次"},{"id":"zz-p4-07","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"1","q":"进入新时代的时间是？","a":["【党的十八大】以来，中国特色社会主义进入新时代。"],"star":1},{"id":"zz-p4-08","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"2","q":"中国特色社会主义进入新时代的意义（总述）？","a":["（1）总述：中国特色社会主义进入新时代，在【中华人民共和国发展史】上、【中华民族发展史】上具有重大意义，在【世界社会主义发展史】上、人类社会发展史上也具有重大意义。"],"star":2},{"id":"zz-p4-09","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"2","q":"中国特色社会主义进入新时代的第一个“意味着”是什么？（中华民族）","a":["①中国特色社会主义进入新时代，意味着近代以来久经磨难的中华民族迎来了从【站起来、富起来到强起来】的伟大飞跃，迎来了实现【中华民族伟大复兴】的光明前景。"],"star":2,"warn":"三个意味着：能对接上面判断即可"},{"id":"zz-p4-10","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"2","q":"中国特色社会主义进入新时代的第二个“意味着”是什么？（科学社会主义）","a":["②中国特色社会主义进入新时代，意味着【科学社会主义】在二十一世纪的中国焕发出强大生机活力，在世界上高高举起了【中国特色社会主义伟大旗帜】。"],"star":2,"warn":"三个意味着：能对接上面判断即可"},{"id":"zz-p4-11","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"2","q":"中国特色社会主义进入新时代的第三个“意味着”是什么？（发展中国家走向现代化）","a":["③中国特色社会主义进入新时代，意味着中国特色社会主义【道路、理论、制度、文化】不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了【全新选择】，为解决人类问题贡献了【中国智慧和中国方案】。"],"star":2,"warn":"不是其他国家都可照用"},{"id":"zz-p4-12","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（历史脉络）是什么？","a":["（1）中国特色社会主义新时代是【承前启后、继往开来】、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代。"],"star":1,"warn":"能判断；本点对应“历史脉络”"},{"id":"zz-p4-13","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（国家发展）是什么？","a":["（2）是决胜【全面建成小康社会】、进而【全面建设社会主义现代化强国】的时代。"],"star":1,"warn":"能判断；本点对应“国家发展”"},{"id":"zz-p4-14","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（价值立场）是什么？","a":["（3）是全国各族人民团结奋斗、不断创造美好生活、逐步实现【全体人民共同富裕】的时代。"],"star":1,"warn":"能判断；本点对应“价值立场”"},{"id":"zz-p4-15","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（民族复兴）是什么？","a":["（4）是全体中华儿女戮力同心、奋力实现【中华民族伟大复兴】中国梦的时代。"],"star":1,"warn":"能判断；本点对应“民族复兴”"},{"id":"zz-p4-16","page":4,"unit":"第二单元 进入新时代","lesson":"第四课 新的历史方位","node":"二、进入新时代的意义","no":"3","q":"新时代的内涵之一（国际视野）是什么？","a":["（5）是我国不断为【人类作出更大贡献】的时代。"],"star":1,"warn":"能判断；本点对应“国际视野”"},{"id":"zz-p5-01","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"一、系统科学的理论体系","no":"1","q":"习近平新时代中国特色社会主义思想是怎样创立的？（源头、背景、主体、中国化路径）","a":["（1）源头：时代是思想之母，实践是理论之源。","（2）背景：新时代以来，面对国内外形势新变化和实践新要求","（3）主体：以习近平同志为主要代表的中国共产党人","（4）中国化路径：坚持把马克思主义基本原理同【中国具体实际】相结合、同【中华优秀传统文化】相结合。"],"star":2},{"id":"zz-p5-02","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"一、系统科学的理论体系","no":"1","q":"习近平新时代中国特色社会主义思想科学回答的“三大时代课题”是什么？","a":["（5）三大时代课题：科学回答了在新时代","①坚持和发展什么样的【中国特色社会主义】、怎样坚持和发展中国特色社会主义（方向性质）","②建设什么样的【社会主义现代化强国】、怎样建设社会主义现代化强国（目标路径）","③建设什么样的【长期执政的马克思主义政党】、怎样建设长期执政的马克思主义政党（力量保证）"],"star":2},{"id":"zz-p5-03","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"一、系统科学的理论体系","no":"2","q":"习近平新时代中国特色社会主义思想的主要内容及其重要体现是什么？","a":["（1）主要内容：“【十个明确】”、“【十四个坚持】”、“【十三个方面成就】”。","（2）重要体现：“【六个必须坚持】”是这一思想的世界观、方法论、立场观点方法。"],"star":2},{"id":"zz-p5-04","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"一、系统科学的理论体系","no":"2","q":"如何理解习近平新时代中国特色社会主义思想是一个系统科学的理论体系？（四者的关系）","a":["（3）关系：以上四个是【内在贯通、有机统一】，共同构成了习近平新时代中国特色社会主义思想的【科学体系】。"],"star":2},{"id":"zz-p5-05","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（总结）","a":["（1）总结：【实践】是理论的基础，科学理论对实践具有【巨大指导作用】。","它是系统科学的理论体系，有巨大指导作用。"],"star":2},{"id":"zz-p5-06","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（历史经验）","a":["（2）历史经验：新时代党和国家事业之所以取得【历史性成就】，最根本的原因在于有习近平同志作为【党中央的核心、全党的核心】掌舵领航，在于有习近平新时代中国特色社会主义思想【科学指引】。"],"star":2},{"id":"zz-p5-07","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（思想武器）","a":["（3）思想武器：它植根于新时代伟大实践，是经过实践检验又指导实践发展的【强大思想武器】。"],"star":2},{"id":"zz-p5-08","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（思想地位）","a":["（4）思想地位：它是【当代中国马克思主义、二十一世纪马克思主义】，是中华文化和中国精神的【时代精华】，实现了【马克思主义中国化时代化】新的飞跃。"],"star":2},{"id":"zz-p5-09","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"1","q":"为什么要长期坚持习近平新时代中国特色社会主义思想？（行动指南）","a":["（5）行动指南：它是新时代中国共产党的【思想旗帜】，是全党全国人民为实现中华民族伟大复兴而奋斗的【行动指南】，是新时代党和国家事业发展的【根本遵循】。"],"star":2},{"id":"zz-p5-10","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"2","q":"怎样长期坚持习近平新时代中国特色社会主义思想？（国家角度·两个不动摇）","a":["（1）国家角度（两个不动摇）：必须高举马克思主义、【中国特色社会主义旗帜】不动摇，必须坚持习近平新时代中国特色社会主义思想【指导地位】不动摇。"],"star":1},{"id":"zz-p5-11","page":5,"unit":"第二单元 进入新时代","lesson":"第五课 新时代的思想旗帜","node":"二、必须长期坚持的指导思想","no":"2","q":"怎样长期坚持习近平新时代中国特色社会主义思想？（青年角度）","a":["（2）青年角度：要坚持不懈用习近平新时代中国特色社会主义思想【武装头脑】，积极投身新时代中国特色社会主义【伟大事业】，在实现民族复兴的赛道上【奋勇争先】，在为人民利益的不懈奋斗中书写人生华章。"],"star":2,"warn":"中学生；思想、学习、实践等层次"},{"id":"zz-p6-01","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"主要观点","q":"第六课主要观点：新时代成就的背景、总体布局与两大奇迹是什么？","a":["新时代以来，在以习近平同志为核心的党中央坚强领导下，在习近平新时代中国特色社会主义思想科学指引下，我们党统筹推进经济建设、政治建设、文化建设、社会建设、生态文明建设“五位一体”【总体布局】，书写了【经济快速发展】和【社会长期稳定】两大奇迹新篇章。"],"star":2,"warn":"逻辑：背景—两个根本原因—重点做什么—铸就两大奇迹"},{"id":"zz-p6-02","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"经济实力大幅跃升的表现之一：社会主义基本经济制度不断完善（含其地位）？","a":["（1）社会主义基本经济制度【不断完善】，经济发展的【制度基础】更加坚实。","①地位：我国基本经济制度是中国特色社会主义制度的【重要支柱】。"],"star":2},{"id":"zz-p6-03","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"我国社会主义基本经济制度的内容是什么？","a":["②内容：【公有制为主体、多种所有制经济共同发展】，【按劳分配为主体、多种分配方式并存】，【社会主义市场经济体制】等社会主义基本经济制度。"],"star":2,"warn":"名称易错"},{"id":"zz-p6-04","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"社会主义基本经济制度的优越性是什么？","a":["③优越性：既体现了社会主义制度优越性（如：集中力量办大事，调动积极性、推动实现共同富裕等），又同我国社会主义初级阶段【社会生产力发展水平】相适应。"],"star":2},{"id":"zz-p6-05","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"经济实力大幅跃升的表现之二：经济持续健康发展、综合实力大幅提升（具体位次）？","a":["（2）经济持续健康发展，综合实力【大幅提升】。","我国经济总量稳居【世界第二位】，制造业增加值多年位居【世界首位】，我国是全球货物贸易第一大国、服务贸易第二大国、商品消费第二大国、【外汇储备第一大国】。"],"star":2},{"id":"zz-p6-06","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"经济实力大幅跃升的表现之三：创新活力不断迸发、科技实力实现跨越式发展？","a":["（3）创新活力不断迸发，科技实力实现【跨越式发展】。","党坚持实施【创新驱动发展战略】，全面谋划科技创新工作，重大科技创新成果竞相涌现，一些前沿领域开始进入【并跑、领跑】阶段，我国已经进入【创新型国家】行列。"],"star":2,"warn":"不是前列、强国"},{"id":"zz-p6-07","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"经济实力大幅跃升的表现之四：经济结构不断优化（制造强国、新型城镇化、乡村振兴）？","a":["（4）经济结构不断优化，经济发展质量【明显提升】。","①加快实施【制造强国】战略，产业发展向【中高端】迈进；","②加快推进【新型城镇化】战略和【乡村振兴】战略，城乡发展差距进一步缩小；"],"star":2,"warn":"城乡发展差距是缩小，不是消除"},{"id":"zz-p6-08","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"1","q":"区域协调发展呈现新格局的表现是什么？（“四大板块”）","a":["③东中西部和东北地区【“四大板块”联动发展】，区域协调发展呈现【新格局】。（区域协调发展战略）"],"star":2},{"id":"zz-p6-09","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"2","q":"新时代我国经济取得成就的原因之一：抓住发展这个第一要务？","a":["（1）抓住发展是党【执政兴国的第一要务】，是解决我国一切问题的【基础和关键】。"],"star":2,"warn":"易错点；成功的原因/成功的密码/如何取得成就＝做法＋效果；第六课五个框题都是"},{"id":"zz-p6-10","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"2","q":"新时代我国经济取得成就的原因之二：在习近平经济思想指引下以经济建设为中心？","a":["（2）新时代以来，在【习近平经济思想】指引下，我们党团结带领中国人民以【经济建设】为中心——不断解放和发展社会生产力，国家经济实力、科技实力和综合国力【显著增强】。"],"star":2},{"id":"zz-p6-11","page":6,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"一、经济实力大幅跃升（核心观点）","no":"2","q":"新时代我国经济取得成就的原因之三：其他（如五大战略）？","a":["（3）其他：如【五大战略】——"],"star":2,"warn":"书上此条只写到“如五大战略——”，未列具体内容"},{"id":"zz-p7-01","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"民主政治的主线是什么？全过程人民民主有哪些特点（是什么）？","a":["民主政治的主线：【全过程人民民主】。","全过程人民民主是【全链条】、【全方位】、【全覆盖】的民主，有完整的【制度程序】，也有完整的【参与实践】。","全过程人民民主是社会主义民主政治的【本质属性】，是【最广泛、最真实、最管用】的民主。（P51）"],"star":1,"warn":"复习思路：有哪些成果？——成功的原因？"},{"id":"zz-p7-02","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","no":"1","q":"新时代以来我国民主政治不断发展的表现（成就一）：人民当家作主制度体系是怎样不断完善、提供制度保障的？","a":["人民代表大会制度、中国共产党领导的【多党合作和政治协商制度】、【民族区域自治制度】、【基层群众自治制度】等各项政治制度不断完善和发展，为发展全过程人民民主提供了【可靠制度保障】。"],"star":2,"warn":"标志性成果、成就"},{"id":"zz-p7-03","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"表现（成就二）：协商民主广泛深入发展——人民民主的真谛是什么？","a":["人民民主的真谛是——【有事好商量】，【众人的事情由众人商量】。"],"star":2},{"id":"zz-p7-04","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"协商民主广泛深入发展的做法与效果是什么？","a":["积极拓宽【民主协商渠道】，深入开展【多种协商】，建立健全多种协商方式，人民在日常政治生活中有【广泛持续深入参与】的权利。"],"star":2,"warn":"做法+效果"},{"id":"zz-p7-05","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"公民行使民主权利、维护自身合法权益的途径有哪些？","a":["公民行使民主权利，维护自身的合法权益的途径：【民主选举】、【民主协商】、【民主决策】、【民主管理】、【民主监督】。"],"star":2},{"id":"zz-p7-06","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"表现（成就三）：基层民主活力增强的做法与效果？","a":["不断完善【基层民主制度】，完善【办事公开制度】，健全【党组织领导】的城乡基层治理体系，基层群众【自我管理】、【自我服务】、【自我教育】、【自我监督】的实效不断增强。"],"star":2,"warn":"做法+效果"},{"id":"zz-p7-07","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"表现（成就四）：民主与法治是什么关系？","a":["【民主是法治的基础】，【法治是民主的保障】。"],"star":2,"warn":"不能颠倒搭配：民主是法治的基础，法治是民主的保障"},{"id":"zz-p7-08","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"表现（成就四）：法治中国建设迈出坚实步伐的具体表现（做法+效果）？","a":["确立【习近平法治思想】在全面依法治国工作中的【指导地位】；社会主义法治国家建设深入推进，全面依法治国【总体格局基本形成】，中国特色社会主义【法治体系】加快建设，【司法体制改革】取得重大进展，社会【公平正义】保障更为坚实。"],"star":2,"warn":"做法+效果"},{"id":"zz-p7-09","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","no":"2","q":"新时代以来我国民主政治不断发展的原因①：为什么说人民民主是社会主义的生命？","a":["人民民主是社会主义的【生命】，是全面建设社会主义现代化国家的【应有之义】。"],"star":3},{"id":"zz-p7-10","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"民主政治不断发展的原因②：党是怎样团结带领人民推动我国民主政治建设取得重要进展的？","a":["新时代以来，党团结带领全国各族人民坚定不移走【中国特色社会主义政治发展道路】，坚持【党的领导、人民当家作主、依法治国有机统一】，创造性地提出【全过程人民民主】重大理念并大力推进，我国民主政治建设取得重要进展。"],"star":3},{"id":"zz-p7-11","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"二、民主政治不断发展","q":"民主政治不断发展的原因③：还有哪些其他原因？","a":["其他：如有【制度保障】；【法治保障】；"],"star":3,"warn":"党领导；思想指引；重视民主；道路发展；优势"},{"id":"zz-p7-12","page":7,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","no":"1","q":"文化自信日益增强的表现（成就一）：意识形态建设成效卓著体现在哪里？","a":["确立和坚持【马克思主义】在意识形态领域【指导地位】的【根本制度】，我国意识形态领域形势发生了【全局性、根本性转变】。"],"star":2,"warn":"标志性成果、成就；P64-"},{"id":"zz-p8-01","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的表现（成就二）：社会主义核心价值观深入人心有哪些举措与意义？","a":["这是【基础工程】。开展【宣传教育】，建立【功勋荣誉表彰制度】，设立【烈士纪念日】，不断夯实中国特色社会主义的【思想道德基础】。"],"star":2,"warn":"标志性成果、成就"},{"id":"zz-p8-02","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的表现（成就三）：中华优秀传统文化焕发蓬勃生机的关键是什么？","a":["关键是要推动中华优秀传统文化【创造性转化】、【创新性发展】，增强全社会【文物保护意识】，加大【文化遗产保护力度】，中华优秀传统文化的【影响力、感召力】显著增强。"],"star":2,"warn":"做法+效果"},{"id":"zz-p8-03","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的表现（成就四）①：文艺事业展现时代新貌——文艺创作的导向是什么？","a":["坚持以【人民为中心】的【创作导向】，推动文艺工作取得长足进步。"],"star":2},{"id":"zz-p8-04","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的表现（成就四）②：文艺事业繁荣的具体体现是什么？","a":["有【优秀作品、人才】，呈现【百花齐放】、生机勃勃。"],"star":2,"warn":"能满足人民美好精神文化需求"},{"id":"zz-p8-05","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","no":"2","q":"文化自信日益增强的原因①：坚定文化自信——文化自信的地位和重要性是什么？","a":["【坚定文化自信】。","文化自信是【更基础、更广泛、更深厚的自信】，是一个国家、一个民族发展中最【基本】、最【深沉】、最【持久】的力量。"],"star":3,"warn":"重要性"},{"id":"zz-p8-06","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的原因②：新时代以来党是怎样推动文化繁荣、建设文化强国的？","a":["新时代以来，在【习近平文化思想】指引下，我们党把【文化建设】摆在【全局工作】的重要位置，在新的起点上推动【文化繁荣】，建设【文化强国】。"],"star":3},{"id":"zz-p8-07","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"文化自信日益增强的原因③：还有哪些其他原因？","a":["其他如：【双创】。"],"star":3,"warn":"党领导；思想指引；坚定自信；工作重视"},{"id":"zz-p8-08","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"传承和弘扬中华优秀传统文化，关键是什么？要坚持什么、做到什么？","a":["关键是推动中华优秀传统文化【创造性转化】、【创新性发展】。","要坚持【古为今用】、【推陈出新】（即【取其精华、去其糟粕】，【批判继承】传统文化）。","要做到【兼收并蓄】、【择善而从】（【文明互鉴】，【尊重多样】，【洋为中用】）。"],"star":1,"warn":"注意1：传承和弘扬中华优秀传统文化"},{"id":"zz-p8-09","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"三、文化自信日益增强","q":"推动“双创”、提升中华文化影响力感召力，青少年怎么做？","a":["①主动学习和了解中华优秀传统文化，如【阅读经典古籍】、【学习传统技艺】、【参观文化遗产】；","②积极参与【文化传承实践活动】，如参与传统文化主题的校园活动、宣传优秀传统文化的志愿服务活动；","③尊重和保护【文化遗产】，增强【文化保护意识】，抵制损害传统文化的行为；","④践行【社会主义核心价值观】，将传统文化中的优秀精神融入【日常行为】，传递文化正能量；","⑤结合时代特点【创新表达】，如用【短视频】、文创作品等形式展现优秀传统文化魅力。"],"star":1,"warn":"注意2；积累（答题素材）"},{"id":"zz-p8-10","page":8,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","no":"1","q":"民生福祉持续推进的成就（成就一）：完成脱贫攻坚与全面建成小康社会的历史任务有什么意义？","a":["打赢了人类历史上规模最大的【脱贫攻坚战】，历史性地解决了【绝对贫困】问题，创造了人类【减贫史】上的奇迹，实现了全面建成小康社会的【千年梦想】。"],"star":2,"warn":"标志性成果、成就；社会长期稳定奇迹；P56-60"},{"id":"zz-p9-01","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉成就（二）：教育普及水平实现历史性跨越体现在哪里？","a":["坚持【教育优先发展】，深化【教育综合改革】，优化区域教育资源配置，建成了世界上【规模最大的教育体系】，各级教育普及程度达到或超过【中高收入国家】平均水平。"],"star":2},{"id":"zz-p9-02","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉成就（三）：社会保障体系不断完善体现在哪里？","a":["实现基本养老保险【全国统筹】、多层次医疗保障【有序衔接】、社会救助体系【兜底】，建成了世界上【规模最大的社会保障体系】。"],"star":2},{"id":"zz-p9-03","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉成就（四）：平安中国建设迈向更高水平体现在哪里？","a":["建设【人人有责、人人尽责、人人享有】的【社会治理共同体】；加强社会治安【综合治理】，开展【扫黑除恶】专项斗争，人民群众【安全感】持续增强。"],"star":2},{"id":"zz-p9-04","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","no":"2","q":"民生福祉能够持续推进的原因①：发展的根本目的是什么？","a":["发展的根本目的是：【增进民生福祉】。"],"star":3,"warn":""},{"id":"zz-p9-05","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉能够持续推进的原因②：党把什么作为一切工作的出发点和落脚点？","a":["党领导下，把【让老百姓过上好日子】作为一切工作的【出发点和落脚点】。"],"star":3},{"id":"zz-p9-06","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"为让老百姓过上好日子，党具体做到了什么？","a":["补齐【民生保障短板】，解决好人民群众【急难愁盼】问题，不断推动【共同富裕】取得新成效。"],"star":3,"warn":"易错点：共同富裕不是同时富裕、同步富裕、同等富裕"},{"id":"zz-p9-07","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"四、民生福祉持续推进","q":"民生福祉能够持续推进的原因（其他）：还有哪些原因？","a":["坚持以【以人民为中心】的发展思想；坚持【全心全意为人民服务】的根本宗旨，践行人民谋幸福、为民族谋复兴的【初心使命】，坚持【人民立场】；等等。"],"star":3,"warn":"讲成功推进的原因——表述为做法+效果；讲为什么要重视民生——表述为重要性、道理依据"},{"id":"zz-p9-08","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","no":"1","q":"美丽中国加快建设的表现（成就一）：生态文明制度体系更加健全体现在哪里？","a":["我国生态文明【顶层设计】不断推进，【制度体系】基本建立，协同推进【降碳、减污、扩绿、增长】，为推进美丽中国建设提供了重要【制度保障】。"],"star":2,"warn":"标志性成果、成就"},{"id":"zz-p9-09","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"美丽中国建设表现（成就二）：污染防治攻坚向纵深推进的做法与成效？","a":["坚持【精准治污、科学治污、依法治污】，深入推进【蓝天、碧水、净土】三大保卫战，城乡人居环境持续改善，进口“洋垃圾”得到全面禁止，【生态环境质量】不断提高。"],"star":2},{"id":"zz-p9-10","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"美丽中国建设表现（成就三）：绿色、循环、低碳发展迈出坚实步伐体现在哪里？","a":["我国【生态优先】、【节约集约】、绿色低碳发展取得明显成效，【简约适度】、绿色低碳的生活方式日益深入人心，【绿色消费】、理性消费渐成风尚。"],"star":2},{"id":"zz-p9-11","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","no":"2","q":"美丽中国建设取得成就的原因①：树立正确生态文明观，其重要性是什么？","a":["树立正确【生态文明观】：【保护自然】就是保护人类，【建设生态文明】就是造福人类。"],"star":3,"warn":"人与自然和谐共生、人与自然是生命共同体"},{"id":"zz-p9-12","page":9,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"美丽中国建设取得成就的原因②：新时代以来党是怎样领导推进美丽中国建设的？","a":["在【习近平生态文明思想】指引下，我们党坚持【绿水青山就是金山银山】的理念，坚持【山水林田湖草沙】一体化保护和系统治理，开展了一系列【开创性工作】，美丽中国建设迈出重大步伐。"],"star":3,"warn":"理念；党；指导思想；核心理念；工作"},{"id":"zz-p10-01","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"如何理解“绿水青山就是金山银山”这一理念①：它阐述了什么关系、揭示了什么道理？","a":["绿水青山就是金山银山，阐述了【经济发展和生态环境保护】的关系，揭示了【保护生态环境就是保护生产力】、【改善生态环境就是发展生产力】的道理。"],"star":1,"warn":"易错点；不能颠倒前后"},{"id":"zz-p10-02","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"如何理解“绿水青山就是金山银山”这一理念②：生态环境保护与经济发展是什么关系？","a":["生态环境保护和经济发展【不是相互对立】的关系，而是【辩证统一】的关系。良好生态本身蕴含着无穷的【经济价值】，能够源源不断创造【综合效益】，实现经济社会【可持续发展】。"],"star":1,"warn":"易错点；不能颠倒前后"},{"id":"zz-p10-03","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","no":"3","q":"作为青少年，我们能为推进美丽中国建设做些什么？①生活理念方面","a":["树立【绿色低碳】生活理念，养成【物尽其用】、减少废弃物的文明习惯。"],"star":1,"warn":"积累"},{"id":"zz-p10-04","page":10,"unit":"第二单元 进入新时代","lesson":"第六课 中国腾飞谱新篇","node":"五、美丽中国加快建设","q":"推进美丽中国建设，青少年怎么做？②产品选择方面" /* ================================================================
   基础工具
   ================================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const STAR=n=>'★'.repeat(Math.max(0,(n||1)-1));

/* 判分归一化：去空白、去标点、全角转半角 */
function norm(s){
  return String(s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s，。、；：""''（）()《》〈〉·—…\-__,.;:"'`~!@#$%^&*+=|\\/\[\]{}<>?！？]/g,'')
    .toLowerCase();
}
/* 长答案包容性判分：去掉"的地得了着和与及其之"再比，避免因为虚词差一个字就判错 */
const loose=s=>norm(s).replace(/[的地得了着和与及其之]/g,'');

/* ================================================================
   持久化
   ================================================================ */
const SK='kss_v1_'+(DATA&&DATA.subject||'x');
let P=loadProg();
function loadProg(){
  let d={cards:{},days:{},paper:{}};
  try{const raw=localStorage.getItem(SK);if(raw){const o=JSON.parse(raw);if(o&&o.cards)d=o;}}catch(e){}
  if(!d.days)d.days={};
  if(!d.paper)d.paper={};
  return d;
}
function saveProg(){ try{localStorage.setItem(SK,JSON.stringify(P));}catch(e){console.warn('保存失败',e);} }
function rec(cardId,ok,mode,opts){
  const p=P.cards[cardId]||(P.cards[cardId]={seen:0,ok:0,wrong:0,streak:0,last:0,mode:''});
  p.seen++;p.last=Date.now();p.mode=mode||p.mode;
  if(ok){p.ok++;p.streak=Math.min(9,p.streak+1);}else{p.wrong++;p.streak=0;}
  if(opts&&opts.skim)p.skim=(p.skim||0)+1;
  const d=todayKey(),t=P.days[d]||(P.days[d]={n:0,ok:0});
  t.n++;if(ok)t.ok++;
  saveProg();
}
const getP=id=>P.cards[id]||null;
/* 安全取值：还没练过的卡也要能排序、能比大小 */
const PW=id=>getP(id)||{seen:0,ok:0,wrong:0,streak:0,last:0};
const scrollTop=()=>{try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){/* 有些环境没实现 */}};
function level(id){
  const p=getP(id);
  if(!p||!p.seen)return 0;
  if(p.streak>=3)return 3;
  if(p.streak>0)return 2;
  return 4; /* 有错待强化 */
}
const LVTXT={0:'未学',1:'未学',2:'记过',3:'熟练',4:'待强化'};

/* ================================================================
   考点解析：把【关键词】切出来
   ================================================================ */
function tokens(text){
  const out=[];let last=0,m;const re=/【([^】]+)】/g;
  while((m=re.exec(text))){
    if(m.index>last)out.push({t:'s',v:text.slice(last,m.index)});
    out.push({t:'b',v:m[1].split('|').map(s=>s.trim()).filter(Boolean)});
    last=m.index+m[0].length;
  }
  if(last<text.length)out.push({t:'s',v:text.slice(last)});
  return out;
}
/* 生成一张卡的渲染计划：段落 + 表格，占位符按出现顺序编号 */
function planOf(c){
  let k=0;const blanks=[];
  const paint=toks=>toks.map(t=>{
    if(t.t!=='b')return t;
    const o={t:'b',v:t.v,k:k};blanks.push(t.v);k++;return o;
  });
  const body=(c.a||[]).map(txt=>({type:'p',toks:paint(tokens(txt))}));
  if(c.table){
    const rows=(c.table.rows||[]).map(r=>r.map(cell=>paint(tokens(cell))));
    body.push({type:'table',head:c.table.head||[],rows});
  }
  return {body,blanks,count:k};
}
const PLAN={};DATA&&DATA.cards.forEach(c=>{PLAN[c.id]=planOf(c);});

function nowLine(toks){
  return toks.map(t=>t.t==='s'?esc(t.v):`<em class="kw" title="${esc(t.v.slice(1).join(' / ')||t.v[0])}">${esc(t.v[0])}</em>`).join('');
}
function inputLine(toks){
  return toks.map(t=>{
    if(t.t==='s')return esc(t.v);
    const w=Math.max(3,Math.min(11,t.v[0].length+1));
    return `<input class="bi" data-k="${t.k}" size="${w}" autocomplete="off" spellcheck="false" aria-label="填空">`;
  }).join('');
}

function renderAns(c,plan,cloze){
  const html=plan.body.map(it=>{
    if(it.type==='p'){
      return `<p class="ln">${cloze?inputLine(it.toks):nowLine(it.toks)}</p>`;
    }
    const head=it.head.map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=it.rows.map(r=>'<tr>'+r.map(cell=>`<td>${cloze?inputLine(cell):nowLine(cell)}</td>`).join('')+'</tr>').join('');
    return `<table class="tb"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }).join('');
  return html;
}
/* 批注分色显示：本课必背 / 易错 / 注意 / 补充（转录备注） */
function warnHTML(c){
  if(!c.warn)return '';
  return String(c.warn).split('；').map(s=>s.trim()).filter(Boolean).map(s=>{
    let kind='补充',body=s,m;
    if(m=s.match(/^本课必背(一句话)?[：:]?\s*(.*)$/)){kind='必背';body=m[2];}
    else if(m=s.match(/^(易错点|易混易错|易错|易混)[：:]?\s*(.*)$/)){kind='易错';body=m[2];}
    else if(m=s.match(/^(注意提法|注意)[：:]?\s*(.*)$/)){kind='注意';body=m[2];}
    return `<div class="warn k-${kind}"><b>${kind}</b>${esc(body)}</div>`;
  }).join('');
}
function pageLink(c){
  if(!c.page)return '';
  const base=(DATA.imgBase||'images/'),pre=DATA.imgPrefix||'',ext=DATA.imgExt||'jpg';
  return ` <a href="${esc(base+pre+c.page+'.'+ext)}" target="_blank" rel="noopener">对照原页 p${c.page}</a>`;
}
function metaHTML(c){
  const bits=[];
  if(c.unit)bits.push(`<span class="u">${esc(c.unit)}</span>`);
  if(c.lesson)bits.push(esc(c.lesson));
  if(c.node)bits.push(esc(c.node));
  const lv=level(c.id);
  return `<div class="meta"><span class="mt">${bits.join(' ／ ')}</span>`+
    `<span class="mr">${pageLink(c)}<span class="stars">${STAR(c.star)}</span>`+
    `<span class="lv lv${lv}">${lv===4?'待强化':LVTXT[lv]}</span></span></div>`;
}

const UNITS=[...new Set((DATA?DATA.cards:[]).map(c=>c.unit||'未分单元'))];
const S={mode:'recite',unit:'全部',scope:'all',queue:[],qi:0,revealed:false,scored:false,cur:null,curPlan:null,choice:null,optDone:false,
  paper:{unit:'全部',range:'seq',queue:[],qi:0,log:{},pick:null}};
const hasBlanks=c=>PLAN[c.id].count>0;
const CARD_BY=id=>DATA.cards.find(c=>c.id===id);

/* ================================================================
   统计条
   ================================================================ */
function renderBar(){
  if(S.mode==='paper'&&PAPER){paperBar();return;}
  const cards=DATA.cards;
  const n=cards.length;
  let ok=0,weak=0,done=0;
  cards.forEach(c=>{const p=getP(c.id);if(!p||!p.seen)return;done++;
    const lv=level(c.id);if(lv===3)ok++;if(lv===4)weak++;});
  const d=P.days[todayKey()]||{n:0,ok:0};
  const rate=d.n?Math.round(d.ok/d.n*100):0;
  $('#bar').innerHTML=
    `<div class="row"><span class="pill">考点 <b>${n}</b></span>`+
    `<span class="pill ok">已熟练 <b>${ok}</b></span>`+
    `<span class="pill bad">待强化 <b>${weak}</b></span>`+
    `<span class="pill">今天 <b>${d.n}</b> 题 · <b>${rate}%</b></span></div>`+
    `<div class="row">`+
    `<select id="fu" title="按单元（做题和 ⑤ 清单 都按它筛）">${['全部',...UNITS].map(u=>`<option${u===S.unit?' selected':''}>${esc(u)}</option>`).join('')}</select>`+
    `<select id="fs" title="${S.mode==='list'?'筛选范围（清单里只显示符合条件的卡）':'练习范围（做题和 ⑤ 清单 都按它筛）'}">
      <option value="all"${S.scope==='all'?' selected':''}>全部范围</option>
      <option value="star"${S.scope==='star'?' selected':''}>${S.mode==='list'?'只看★必背':'只练★必背'}</option>
      <option value="weak"${S.scope==='weak'?' selected':''}>${S.mode==='list'?'只看待强化':'只练未熟练'}</option>
      <option value="unseen"${S.scope==='unseen'?' selected':''}>${S.mode==='list'?'只看没练过':'只练没练过'}</option>
    </select>`+
    `<span class="sp"></span>`+
    `<button class="linkbtn" id="exp" title="把练习记录导出成文件（备份/换设备）">导出记录</button>`+
    `<button class="linkbtn" id="imp" title="从文件导入练习记录">导入记录</button>`+
    `<button class="linkbtn" id="rst" title="清空本机的练习记录">清空</button></div>`;
  $('#fu').onchange=e=>{S.unit=e.target.value;S.qi=0;buildQueue();render();};
  $('#fs').onchange=e=>{S.scope=e.target.value;S.qi=0;buildQueue();render();};
  $('#exp').onclick=exportProg;
  $('#imp').onclick=importProg;
  $('#rst').onclick=()=>{
    if(!confirm('清空全部练习记录？（不可恢复，建议先「导出记录」）'))return;
    P={cards:{},days:{},paper:{}};saveProg();
    if(S.mode==='paper')buildPaper();
    S.qi=0;buildQueue();render();
  };
}
function exportProg(){
  const blob=new Blob([JSON.stringify({subject:DATA.subject,exported:new Date().toISOString(),data:P},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${DATA.subject}-练习记录-${todayKey()}.json`;
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function importProg(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        const d=o.data&&o.data.cards?o.data:o;
        if(!d.cards)throw new Error('文件里没有 cards');
        if(!confirm(`导入后会用文件里的记录覆盖本机记录（文件里 ${Object.keys(d.cards).length} 张卡的记录）。继续？`))return;
        P={cards:d.cards||{},days:d.days||{},paper:d.paper||{}};saveProg();
        if(S.mode==='paper')buildPaper();
        S.qi=0;buildQueue();render();
      }catch(e){alert('导入失败：'+e.message);}
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ================================================================
   队列
   ================================================================ */
function pool(){
  let a=DATA.cards.slice();
  if(S.unit!=='全部')a=a.filter(c=>(c.unit||'未分单元')===S.unit);
  if(S.scope==='star')a=a.filter(c=>(c.star||1)>=2);
  if(S.scope==='unseen')a=a.filter(c=>!getP(c.id)||!getP(c.id).seen);
  if(S.scope==='weak')a=a.filter(c=>{const lv=level(c.id);return lv===0||lv===2||lv===4;});
  return a;
}
function buildQueue(){
  let a=pool();
  if(S.mode==='cloze')a=a.filter(hasBlanks);
  if(S.mode==='wrong')a=a.filter(c=>{const p=getP(c.id);return p&&p.wrong>0&&p.streak<2;});
  if(S.mode==='choice')a=a.filter(hasBlanks);
  if(S.mode==='wrong'||S.mode==='choice')a.sort((x,y)=>PW(y.id).wrong-PW(x.id).wrong);
  else a.sort((x,y)=>(PW(x.id).seen?1:0)-(PW(y.id).seen?1:0));
  S.queue=a.map(c=>c.id);
  if(S.qi>=S.queue.length)S.qi=0;
}
function setProg(){
  const el=$('#prog');
  if(S.mode==='paper'){
    if(!S.paper.queue.length){el.hidden=true;return;}
    el.hidden=false;
    $('i',el).style.width=Math.round((S.paper.qi+1)/S.paper.queue.length*100)+'%';
    return;
  }
  if(!['recite','cloze','choice','wrong'].includes(S.mode)||!S.queue.length){el.hidden=true;return;}
  el.hidden=false;
  $('i',el).style.width=Math.round((S.qi+1)/S.queue.length*100)+'%';
}

/* ================================================================
   渲染入口
   ================================================================ */
function render(){
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===S.mode));
  renderBar();setProg();
  const st=$('#stage');
  if(S.mode==='list'){renderList(st);return;}
  if(S.mode==='paper'){renderPaper(st);return;}
  if(!S.queue.length){st.innerHTML=emptyHTML();renderNav(st);return;}
  const c=CARD_BY(S.queue[S.qi]);
  if(!c){st.innerHTML=emptyHTML();return;}
  if(S.mode==='choice')renderChoice(st,c);
  else if(S.mode==='cloze')renderCloze(st,c);
  else renderRecite(st,c);
  renderNav(st);
}

function renderNav(st){

    ? `<button class="btn sm" id="pv"${S.qi===0?' disabled':''}>← 上一题</button>

function nextCard(){
  if(S.qi<S.queue.length-1){S.qi++;S.revealed=false;S.scored=false;render();}
  else{
    const st=$('#stage');

/* ---------------- ② 填空闯 ---------------- */
function renderCloze(st,c){

      ${renderAns(c,p,true)}

    let bad=0,empty=0;
    inputs.forEach(inp=>{

      const ok=v!=='' && (alts.some(a=>norm(a)===v) ||
        (norm(alts[0]).length>=8 && alts.some(a=>loose(a)===loose(v))));
      inp.classList.toggle('ok',ok);inp.classList.toggle('bad',!ok);

      inp.disabled=true;
    });
    if(!S.scored){rec(c.id,bad===0,'cloze');S.scored=true;}
    $('#fb',st).innerHTML=`<div class="verdict ${bad===0?'ok':'bad'}">${
      bad===0?'<b>全对 ✓</b> 这张卡记得住。':
      `<b>错 ${bad} 处</b>${empty?`（其中 ${empty} 空没填）`:''}，前面绿色的是正解，红色的是你填的。`}</div>`;
    acts.innerHTML=`<button class="btn p" id="nx2">下一题（回车）</button>
      <button class="btn" id="again">再填一次</button>
      ${bad>0?'<button class="btn sm" id="forgive">我其实答对了（算对）</button>':''}
      <span class="hint">这一题已记入${bad>0?'错题本':'熟练'}。</span>`;
    $('#nx2',acts).onclick=nextCard;
    $('#again',acts).onclick=()=>{
      inputs.forEach(inp=>{inp.disabled=false;inp.value='';inp.classList.remove('ok','bad');});
      $$('.given',st).forEach(e=>e.remove());
      $('#fb',st).innerHTML='';S.scored=true; // 重练不重复计分
      acts.innerHTML=`<button class="btn p" id="sub">提交判分</button>`;
      $('#sub',acts).onclick=submit;
      inputs[0]&&inputs[0].focus();
    };
    const fg=$('#forgive',acts);
    if(fg)fg.onclick=()=>{const q=getP(c.id);if(q){q.wrong=Math.max(0,q.wrong-1);q.streak=1;saveProg();}renderBar();fg.textContent='已改判 ✓';fg.disabled=true;};
  };
  acts.innerHTML=`<button class="btn p" id="sub">提交判分（回车）</button>
    <button class="btn sm" id="peek">看答案（算不会）</button>`;
  $('#sub',acts).onclick=submit;
  $('#peek',acts).onclick=()=>{

  };

    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(S.scored)nextCard();else submit();}};
    if(i===0)inp.focus({preventScroll:true});
  });
}

/* ---------------- ③ 四选一 ---------------- */
function termPool(){
  if(termPool._c)return termPool._c;
  const all=[];
  DATA.cards.forEach(c=>{
    const p=PLAN[c.id];
    p.blanks.forEach(alts=>{if(alts[0])all.push({t:alts[0],unit:c.unit||'',id:c.id});});
  });
  termPool._c=all;return all;
}
function distractors(card,plan,k,n){
  const right=plan.blanks[k][0];
  const all=termPool();
  const sameUnit=all.filter(x=>x.unit===(card.unit||'')&&norm(x.t)!==norm(right));
  const other=all.filter(x=>x.unit!==(card.unit||'')&&norm(x.t)!==norm(right));
  const picked=[];const seen=new Set([norm(right)]);
  const take=arr=>{
    const sh=shuffle(arr.slice());
    for(const x of sh){
      if(picked.length>=n)return;
      const key=norm(x.t);
      if(seen.has(key))continue;
      seen.add(key);picked.push(x.t);
    }
  };
  take(sameUnit);take(other);
  return picked;
}
function renderChoice(st,c){
  const p=PLAN[c.id];
  // 选一个空（优先没练过的位置）
  if(!S.choice||S.choice.id!==c.id||S.choice.k>=p.count)S.choice={id:c.id,k:0};
  const k=S.choice.k;
  const right=p.blanks[k][0];
  const opts=shuffle([right,...distractors(c,p,k,3)]);
  const toks=PICK_TOKENS(p,k);
  st.innerHTML=`<div class="card">${metaHTML(c)}
    <div class="q" style="font-size:16px">${esc(c.q)}</div>
    <div class="ans" id="ans"><div class="lead">补全下面这句话（第 ${k+1}/${p.count} 空）：</div>
      <p class="ln" style="font-size:17px">${toks.before}<span style="display:inline-block;min-width:72px;border-bottom:2px solid var(--acc);text-align:center;color:var(--acc);font-weight:700">?</span>${toks.after}</p>
      ${p.count>1&&k+1<p.count?`<div class="hint">还可以练这题的第 ${k+2} 空 →</div>`:''}
    </div>
    <div class="opts" id="opts">${opts.map((o,i)=>`<button data-i="${i}" data-o="${esc(o)}"><span class="kk">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>
    <div class="acts" id="acts"><span class="hint">点选项或按 1–4；答错自动进错题本。</span></div>
  </div>`;
  const btns=$$('#opts button',st);
  let done=false;
  const answer=btn=>{
    if(done)return;done=true;
    const val=btn.dataset.o;
    const ok=norm(val)===norm(right);
    btns.forEach(b=>{
      b.disabled=true;
      if(norm(b.dataset.o)===norm(right))b.classList.add('c');
    });
    if(!ok)btn.classList.add('w');
    rec(c.id,ok,'choice');
    renderBar();
    const acts=$('#acts',st);
    const more=k+1<p.count;
    acts.innerHTML=`<button class="btn p" id="nx3">下一题（回车）</button>`+
      (more?`<button class="btn" id="nb">再练这题下一空</button>`:'')+
      (ok?'':'<button class="btn sm" id="why">看整条答案</button>');
    $('#nx3',acts).onclick=nextCard;
    if(more)$('#nb',acts).onclick=()=>{S.choice={id:c.id,k:k+1};S.revealed=false;render();};
    const wy=$('#why',acts);
    if(wy)wy.onclick=()=>{
      $('#ans',st).insertAdjacentHTML('beforeend',renderAns(c,p,false)+warnHTML(c));
      wy.disabled=true;
    };
  };
  btns.forEach(b=>b.onclick=()=>answer(b));
  st.onkeydown=e=>{
    if('1234'.includes(e.key)){const i=+e.key-1;if(btns[i]&&!btns[i].disabled)answer(btns[i]);}
    else if(e.key==='Enter'){if(done)nextCard();}
  };
}
/* 取出第 k 个空所在的那一句话，切成 前 / 空 / 后 */
function PICK_TOKENS(p,k){
  for(const it of p.body){
    if(it.type==='p'){
      const idx=it.toks.findIndex(t=>t.t==='b'&&t.k===k);
      if(idx>=0){
        const before=it.toks.slice(0,idx).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
        const after=it.toks.slice(idx+1).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
        return {before,after};
      }
    }else{
      for(const r of it.rows)for(const cell of r){
        const idx=cell.findIndex(t=>t.t==='b'&&t.k===k);
        if(idx>=0){
          const before=cell.slice(0,idx).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
          const after=cell.slice(idx+1).map(t=>t.t==='s'?esc(t.v):`<em class="kw">${esc(t.v[0])}</em>`).join('');
          return {before,after};
        }
      }
    }
  }
  return {before:'',after:''};
}

/* ---------------- ⑤ 清单 ---------------- */
let LISTQ='',LISTHIDE=false;
const SCOPE_TXT={all:'全部范围',star:'只看★必背',weak:'只看待强化',unseen:'只看没练过'};
function renderList(st){
  const q=LISTQ.trim();
  /* 顶部「按单元 / 练习范围」两个下拉框在清单里同样生效，而不是只影响做题队列 */
  const base=pool();
  const hit=c=>{
    if(!q)return true;
    const hay=(c.q+' '+(c.a||[]).join(' ')+' '+(c.warn||'')+' '+(c.lesson||'')+' '+(c.unit||'')+' '+(c.node||'')).toLowerCase();
    return hay.includes(q.toLowerCase());
  };
  const cards=base.filter(hit);
  const filtering=S.unit!=='全部'||S.scope!=='all';
  const byUnit=new Map();
  cards.forEach(c=>{
    const u=c.unit||'未分单元';
    if(!byUnit.has(u))byUnit.set(u,[]);
    byUnit.get(u).push(c);
  });
  // 单元进度（按筛选后的范围算，不受搜索词影响）
  const baseByUnit=new Map();
  base.forEach(c=>{
    const u=c.unit||'未分单元';
    if(!baseByUnit.has(u))baseByUnit.set(u,[]);
    baseByUnit.get(u).push(c);
  });
  const ubars=[...baseByUnit.entries()].map(([u,arr])=>{
    const doneN=arr.filter(c=>level(c.id)===3).length;
    const pc=Math.round(doneN/arr.length*100);
    return `<div class="ubar"><span class="nm" title="${esc(u)}">${esc(u)}</span><span class="tr"><i style="width:${pc}%"></i></span><span class="pc">${pc}%</span></div>`;
  }).join('');
  // 最该补的 10 张（同样只看当前筛选范围）
  const weak=base.map(c=>({c,lv:level(c.id),p:getP(c.id)}))
    .filter(x=>x.p&&x.p.wrong>0&&x.lv!==3)
    .sort((a,b)=>b.p.wrong-a.p.wrong||a.lv-b.lv).slice(0,10);
  const weakHTML=weak.length?`<div class="report"><h3>最该补的 ${weak.length} 张（错得最多 / 还没拿稳）</h3><ul>${
    weak.map(({c,p})=>`<li>${esc(c.q)} <b>错 ${p.wrong} 次</b> <span class="hint">· ${esc(c.lesson||c.unit||'')}</span></li>`).join('')
  }</ul><div class="hint">这些卡会优先出现在 ④ 错题强化 里。</div></div>`:'';
  const chips=filtering?`<div class="row" style="font-size:13px">
      <span class="pill">筛选结果 <b>${cards.length}</b> 张</span>
      <span class="pill">${esc(S.unit==='全部'?'全部单元':S.unit)} · ${esc(SCOPE_TXT[S.scope]||'')}</span>
      <button class="linkbtn" id="lclr">清除筛选（显示全部 ${DATA.cards.length} 张）</button></div>`:'';
  const empty=filtering||q
    ? `<div class="card empty"><span class="big">🔍</span>${q?`没搜到「${esc(LISTQ)}」。`:'这个筛选下没有考点。'}
        <div class="hint">${filtering?'把顶部两个下拉框改回「全部范围 / 全部」，或点下面的按钮。':'换个词试试。'}</div>
        ${filtering?'<div class="acts" style="justify-content:center"><button class="btn sm" id="lclr2">清除筛选</button></div>':''}</div>`
    : '<div class="card empty"><span class="big">🗂</span>没有考点数据。</div>';

  st.innerHTML=`<input class="searchbox" id="sq" placeholder="搜索考点关键词，比如「民主」「瓦特」「条约」…" value="${esc(LISTQ)}">
    <div class="bar" style="margin-top:10px"><div class="row">
      <label style="display:flex;gap:6px;align-items:center;cursor:pointer">
      <input type="checkbox" id="hide"${LISTHIDE?' checked':''}> 遮住红字（自测用，点一下灰块能揭开）</label>
      <span class="sp"></span><button class="linkbtn" id="prt">打印这份清单</button></div>
      ${chips}</div>
    ${ubars?`<div class="report"><h3>各单元熟练度（连续答对 3 次才算熟练）</h3><div class="ubars">${ubars}</div></div>`:''}
    ${weakHTML}
    ${cards.length?[...byUnit.entries()].map(([u,arr])=>`
      <div class="unitbox">
        <h3>${esc(u)} <span>${arr.length} 个考点</span></h3>
        ${arr.map(c=>{
          const lv=level(c.id);
          return `<details class="k" data-id="${c.id}">
            <summary><span style="flex:1">${esc(c.q)}</span>
              <span class="lv lv${lv}">${lv===4?'待强化':LVTXT[lv]}</span></summary>
            <div class="bd${LISTHIDE?' hidekw':''}">
              <div class="meta"><span class="mt">${esc(c.lesson||'')}${c.node?' ／ '+esc(c.node):''}</span><span class="mr">${pageLink(c)}<span class="stars">${STAR(c.star)}</span></span></div>
              <div class="ans" style="border-top:0;padding-top:0;margin-top:6px">${renderAns(c,PLAN[c.id],false)}</div>
              ${warnHTML(c)}
              <div class="acts"><button class="btn sm" data-solo="${c.id}">只练这张</button></div>
            </div>
          </details>`;
        }).join('')}
      </div>`).join(''):empty}`;

  $('#sq',st).oninput=e=>{LISTQ=e.target.value;const pos=e.target.selectionStart;renderList(st);const n=$('#sq',st);n.focus();n.setSelectionRange(pos,pos);};
  $('#hide',st).onchange=e=>{LISTHIDE=e.target.checked;renderList(st);};
  $('#prt',st).onclick=()=>window.print();
  const clear=()=>{S.unit='全部';S.scope='all';S.qi=0;buildQueue();render();};
  const c1=$('#lclr',st);if(c1)c1.onclick=clear;
  const c2=$('#lclr2',st);if(c2)c2.onclick=clear;
  $$('[data-solo]',st).forEach(b=>b.onclick=()=>{
    S.queue=[b.dataset.solo];S.qi=0;S.mode='recite';S.revealed=true;S.scored=false;render();
  });
}

/* ================================================================
   ⑥ 套卷（可选的 DATA.paper：一整份带解析的选择题卷）
   ================================================================ */
const PAPER=DATA&&DATA.paper?DATA.paper:null;
const PQ=PAPER?(PAPER.questions||[]):[];
const PQ_BY=id=>PQ.find(q=>q.id===id);
const PUNITS=[...new Set(PQ.map(q=>q.unit||'未分单元'))];
const PPLAN={};PQ.forEach((q,i)=>{PPLAN[q.id]=i;});
function pState(id){return (P.paper||{})[id]||null;}
function pTally(){
  let seen=0,att=0,right=0,weak=0;
  PQ.forEach(q=>{const p=pState(q.id);if(!p||!p.seen)return;
    seen++;att+=p.seen;right+=p.ok;if(p.wrong>0&&p.streak<2)weak++;});
  return {n:PQ.length,seen,att,right,weak,rate:att?Math.round(right/att*100):0};
}
function recPaper(q,ok,pick){
  if(!P.paper)P.paper={};
  const p=P.paper[q.id]||(P.paper[q.id]={seen:0,ok:0,wrong:0,streak:0,last:0,pick:-1});
  p.seen++;p.last=Date.now();p.pick=pick;
  if(ok){p.ok++;p.streak=Math.min(9,p.streak+1);}else{p.wrong++;p.streak=0;}
  const d=todayKey(),t=P.days[d]||(P.days[d]={n:0,ok:0});
  t.n++;if(ok)t.ok++;
  saveProg();
}
/* 队列：整套顺序 / 随机 20 题 / 只做错题 / 只做没做过，可按单元筛 */
function buildPaper(){
  const st=S.paper;
  let a=PQ.slice();
  if(st.unit!=='全部')a=a.filter(q=>(q.unit||'未分单元')===st.unit);
  if(st.range==='weak')a=a.filter(q=>{const p=pState(q.id);return p&&p.wrong>0&&p.streak<2;});
  if(st.range==='unseen')a=a.filter(q=>!pState(q.id)||!pState(q.id).seen);
  if(st.range==='weak')a.sort((x,y)=>pState(y.id).wrong-pState(x.id).wrong);
  else if(st.range!=='seq')a=shuffle(a.slice());
  if(st.range==='round')a=a.slice(0,20);
  if(st.range==='seq')a.sort((x,y)=>x.no-y.no);
  st.queue=a.map(q=>q.id);
  st.qi=0;st.log={};st.pick=null;
}
function paperBar(){
  const t=pTally();
  $('#bar').innerHTML=
    `<div class="row"><span class="pill">套卷 <b>${t.n}</b> 题</span>`+
    `<span class="pill">已做 <b>${t.seen}</b>/${t.n}</span>`+
    `<span class="pill ok">正确率 <b>${t.rate}%</b></span>`+
    `<span class="pill bad">待强化 <b>${t.weak}</b></span>`+
    `<span class="pill">今天 <b>${(P.days[todayKey()]||{n:0}).n}</b> 题</span></div>`+
    `<div class="row">`+
    `<select id="pu" title="按单元做">${['全部',...PUNITS].map(u=>`<option${u===S.paper.unit?' selected':''}>${esc(u)}</option>`).join('')}</select>`+
    `<select id="pr" title="做题范围">
      <option value="seq"${S.paper.range==='seq'?' selected':''}>整卷顺序</option>
      <option value="round"${S.paper.range==='round'?' selected':''}>随机 20 题</option>
      <option value="weak"${S.paper.range==='weak'?' selected':''}>只做错题</option>
      <option value="unseen"${S.paper.range==='unseen'?' selected':''}>只做没做过</option>
    </select>`+
    `<span class="sp"></span>`+
    `<button class="linkbtn" id="exp" title="把练习记录导出成文件（备份/换设备）">导出记录</button>`+
    `<button class="linkbtn" id="imp" title="从文件导入练习记录">导入记录</button>`+
    `<button class="linkbtn" id="prt2" title="打印整份试卷（题干+答案+解析）">打印整卷</button></div>`;
  $('#pu').onchange=e=>{S.paper.unit=e.target.value;buildPaper();render();};
  $('#pr').onchange=e=>{S.paper.range=e.target.value;buildPaper();render();};
  $('#exp').onclick=exportProg;
  $('#imp').onclick=importProg;
  $('#prt2').onclick=()=>paperPrint();
}
/* 整卷打印视图：题干 + 选项（正确项标绿）+ 解析，一份可打印的解析版 */
function paperPrint(){
  const st=$('#stage');
  st.innerHTML=`<div class="card no-print"><div class="acts" style="margin:0">
      <button class="btn" id="pback">← 返回做题</button>
      <button class="btn p" id="pprt">打印 / 存成 PDF</button>
    </div><div class="hint" style="margin-top:8px">整份 ${PQ.length} 题，含答案与逐项解析。打印时会自动去掉顶栏和按钮。</div></div>`+
    PQ.map(q=>`<div class="card">
      <div class="meta"><span class="mt"><b>第 ${q.no} 题</b> ／ ${esc(q.unit||'')}</span><span class="mr">答案 ${'ABCD'[q.ans]}</span></div>
      <div class="pstem">${paperBody(q)}</div>
      ${q.opts.map((o,i)=>`<div class="optrow${i===q.ans?' c':''}"><span class="kk">${'ABCD'[i]}</span><span>${esc(o)}</span></div>`).join('')}
      ${whyHTML(q)}
    </div>`).join('');
  $('#pback').onclick=()=>render();
  $('#pprt').onclick=()=>window.print();
  scrollTop();
}
const pImg=s=>`<a href="${esc(s)}" target="_blank" rel="noopener"><img src="${esc(s)}" alt="题目配图" loading="lazy"></a>`;
function paperTable(b){
  const rows0=b.rows||[];
  const cols=Math.max(1,...rows0.filter(r=>r.length>1).map(r=>r.length));
  const rows=rows0.map(r=>{
    if(r.length===1){
      const c=r[0];
      return `<tr><td class="cap" colspan="${cols}">${esc(c.t)}${(c.imgs||[]).map(pImg).join('')}</td></tr>`;
    }
    return '<tr>'+r.map(c=>`<td>${(c.imgs||[]).map(pImg).join('')}<span class="tx">${esc(c.t)}</span></td>`).join('')+'</tr>';
  }).join('');
  return `<table class="ptbl">${rows}</table>`;
}
function paperBody(q){
  let out='',figs=[];
  const flush=()=>{if(figs.length){out+=`<div class="figs">${figs.join('')}</div>`;figs=[];}};
  (q.blocks||[]).forEach(b=>{
    if(b.t==='p'){flush();out+=`<p>${esc(b.v)}</p>`;}
    else if(b.t==='img'){figs.push(`<figure>${pImg(b.src)}</figure>`);}
    else if(b.t==='tbl'){flush();out+=paperTable(b);}
  });
  flush();
  return out;
}
function whyHTML(q){
  const L=['A','B','C','D'];
  if(q.why&&Object.keys(q.why).length){
    return `<div class="whybox"><div class="lead">逐项解析（绿的是正确项）</div>`+
      L.map((k,i)=>{
        const t=q.why[k];if(!t)return '';
        return `<div class="whyrow${i===q.ans?' right':''}"><span class="k">${k}</span><span class="tx">${esc(t)}</span></div>`;
      }).join('')+`</div>`;
  }
  return `<div class="whybox"><div class="lead">解析</div><div class="whysol">${esc(q.sol||'')}</div></div>`;
}
function renderPaper(st){
  const id=S.paper.queue[S.paper.qi];
  if(!id){st.innerHTML=emptyHTML();return;}
  const q=PQ_BY(id),t=pTally();
  const logged=S.paper.log[id];
  const done=logged!==undefined;
  const pick=done?logged:null;
  st.innerHTML=`<div class="card">
    <div class="meta"><span class="mt"><b>第 ${q.no} 题</b> ／ 共 ${t.n} 题 ／ ${esc(q.unit||'未分单元')}</span>
      <span class="mr"><span class="pno">${S.paper.qi+1} / ${S.paper.queue.length}</span></span></div>
    <div class="pstem">${paperBody(q)}</div>
    <div class="opts" id="opts">${q.opts.map((o,i)=>
      `<button data-i="${i}"${done?' disabled':''} class="${done?(i===q.ans?'c':(i===pick?'w':'')):''}"><span class="kk">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>
    <div id="fb">${done?paperVerdict(q,pick):''}</div>
    ${done?whyHTML(q):''}
    <div class="acts" id="acts">${done?paperActs(q,pick):`<span class="hint">点选项或按 1–4；答完立刻给解析，错题自动进「只做错题」。</span>`}</div>
  </div>`;
  const btns=$$('#opts button',st);
  if(!done)btns.forEach(b=>b.onclick=()=>answerPaper(+b.dataset.i));
  else bindPaperActs(st,q);
  renderNav(st);
}
function paperVerdict(q,pick){
  const L='ABCD';
  if(pick===q.ans)return `<div class="verdict ok"><b>答对了 ✓</b> 正确答案 ${L[q.ans]}。</div>`;
  return `<div class="verdict bad"><b>答错了</b> 你选的是 ${L[pick]}，正确答案是 <b>${L[q.ans]}</b>。看完下面的解析再往下走。</div>`;
}
function paperActs(q,pick){
  const more=S.paper.qi<S.paper.queue.length-1;
  return `<button class="btn p" id="pnx">${more?'下一题（回车）':'本轮完成（回车）'}</button>`+
    (pick===q.ans?'':`<button class="btn sm" id="pgo" title="去⑤清单看这一单元的考点卡">看本单元考点</button>`)+
    `<span class="hint">${S.paper.qi+1} / ${S.paper.queue.length}</span>`;
}
function bindPaperActs(st,q){
  const nx=$('#pnx',st);
  if(nx)nx.onclick=()=>paperNext();
  const go=$('#pgo',st);
  if(go)go.onclick=()=>{S.mode='list';LISTQ=q.unit||'';buildQueue();render();scrollTop();};
}
function answerPaper(i){
  const id=S.paper.queue[S.paper.qi];
  if(S.paper.log[id]!==undefined)return;
  const q=PQ_BY(id);
  S.paper.log[id]=i;
  recPaper(q,i===q.ans,i);
  render();
}
function paperNext(){
  const st=$('#stage');
  if(S.paper.qi<S.paper.queue.length-1){
    S.paper.qi++;render();scrollTop();return;
  }
  st.innerHTML=paperSummary();
  $$('[data-jump]',st).forEach(b=>b.onclick=()=>{
    const id=b.dataset.jump;
    S.paper.qi=S.paper.queue.indexOf(id);
    render();scrollTop();
  });
  const again=$('#pagain',st);
  if(again)again.onclick=()=>{S.paper.log={};S.paper.qi=0;render();scrollTop();};
  const next=$('#pnext',st);
  if(next)next.onclick=()=>{S.paper.range='round';buildPaper();render();scrollTop();};
  const weak=$('#pweak',st);
  if(weak&&!weak.disabled)weak.onclick=()=>{S.paper.range='weak';buildPaper();render();scrollTop();};
  scrollTop();
}
function paperSummary(){
  const ids=S.paper.queue;
  let right=0;const wrong=[];
  ids.forEach(id=>{const p=pickOf(id);if(p===undefined)return;
    const q=PQ_BY(id);if(p===q.ans)right++;else wrong.push(q);});
  const tot=ids.length,rate=tot?Math.round(right/tot*100):0;
  const t=pTally();
  return `<div class="card">
    <div class="meta"><span class="mt">本轮走完了</span><span class="mr">${tot} 题</span></div>
    <div class="scoreline">对 <b>${right}</b> 题 · 错 <b>${wrong.length}</b> 题 · 正确率 <b>${rate}%</b></div>
    ${wrong.length?`<div class="hint" style="margin-top:6px">做错的题（点题号回到那一题看解析）：</div>
      <div class="jump">${wrong.map(q=>`<button data-jump="${esc(q.id)}">第 ${q.no} 题</button>`).join('')}</div>`
      :'<div class="verdict ok" style="margin-top:10px"><b>全对 ✓</b> 这一轮没有错题。</div>'}    <div class="acts">
      <button class="btn p" id="pagain">重做这一轮</button>
      <button class="btn" id="pnext">换一批（随机 20 题）</button>
      <button class="btn" id="pweak"${t.weak?'':' disabled'}>只做错题（${t.weak}）</button>
    </div>
    <div class="hint">全卷进度：已做 ${t.seen}/${t.n} 题，累计正确率 ${t.rate}%。错题在「只做错题」里连对 2 次才算过关。</div>
  </div>`;
}
function pickOf(id){
  const l=S.paper.log;
  return l[id];
}

/* ================================================================
   启动
   ================================================================ */
function boot(){
  if(!DATA||!DATA.cards||!DATA.cards.length){
    $('#stage').innerHTML='<div class="card empty"><span class="big">⚠</span>没有读到考点数据。<br>请确认这个文件没有被改动过。</div>';
    return;
  }
  document.documentElement.dataset.subj=DATA.subject||'';
  document.title=DATA.title||'核心考点训练';
  $('#ttl').textContent=DATA.title||'核心考点训练';
  $('#sb').textContent=PAPER
    ? `共 ${DATA.cards.length} 个考点 · 套卷 ${PQ.length} 题 · 记录存在本机浏览器`
    : `共 ${DATA.cards.length} 个考点 · 记录存在本机浏览器`;
  if(PAPER&&PQ.length){
    const tp=$('#tabPaper');
    if(tp){tp.hidden=false;tp.textContent='⑥ 套卷';}
  }
  $$('#tabs button').forEach(b=>b.onclick=()=>{
    if(b.dataset.mode===S.mode)return;
    S.mode=b.dataset.mode;S.qi=0;S.revealed=false;S.scored=false;S.cur=null;S.choice=null;
    if(S.mode==='paper')buildPaper();
    buildQueue();render();scrollTop();
  });
  buildQueue();render();
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea'))return;
    if(S.mode==='paper'){
      const id=S.paper.queue[S.paper.qi];
      if(!id)return;
      const answered=S.paper.log.hasOwnProperty(id);
      if(!answered&&'1234'.includes(e.key)){e.preventDefault();answerPaper(+e.key-1);}
      else if(answered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();paperNext();}
      else if(e.key==='ArrowLeft'&&S.paper.qi>0){e.preventDefault();S.paper.qi--;render();scrollTop();}
      return;
    }
    if(S.mode==='recite'){
      if(!S.revealed&&(e.key===' '||e.code==='Space')){e.preventDefault();S.revealed=true;render();}
      else if(S.revealed){
        const map={'1':'1','2':'0.5','3':'0'};
        if(map[e.key]){e.preventDefault();const f=$(`#acts button[data-v="${map[e.key]}"]`);if(f)f.click();}
      }
    }else if(S.mode==='cloze'&&e.key==='Enter'){
      const s=$('#sub'),n=$('#nx2');if(s)s.click();else if(n)n.click();
    }else if(S.mode==='choice'&&e.key==='Enter'){
      const n=$('#nx3');if(n)n.click();
    }
  });
}
boot();
</script>
