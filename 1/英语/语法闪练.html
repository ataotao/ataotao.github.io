  function spotStateOf(item) {
    if (!R || !R.spot || R.phase !== "main" || !item) return "";
    if (R.results && R.results[item.id]) return "";
    if (spotPickedIndex(item) < 0) return "judge";
    return R.spot.hold === item.id ? "hold" : "answer";
  }
  function spotPanelHTML(item) {
    var order = spotOrderOf(item);
    var h = '<p class="spot-lead">这题在考哪个考点？</p><div class="spot-panel" role="group" aria-label="考点">';
    order.forEach(function (t, i) {
      h += '<button type="button" class="spot-opt" data-i="' + i + '">' +
        '<span class="badge">' + (i + 1) + '</span><span class="txt">' + esc(t) + "</span>" +
        '<span class="mark"></span></button>';
    });
    return h + "</div>";
  }
  function spotFeedbackHTML(item) {
    var pi = spotPickedIndex(item);
    var ok = pi >= 0 && spotOrderOf(item)[pi] === item.topic;
    var h = '<p class="fb-head">' + (ok ? "✓" : "✗") + " 考点：<b>" + esc(item.topic || "未分类") + "</b></p>";
    h += cueLineHTML(item);           // 判考点这一屏就是教「怎么认」的地方
    h += '<p class="fb-line"><b>规则：</b>' + esc(item.rule || "") + "</p>";
    h += '<button type="button" class="btn ack" data-act="ack">看选项，选答案 →</button>';
    return h;
  }
  /* 判考点：只改 R.spot，绝不动 store.stat / perTopic / R.ok / R.done（答案口径不变） */
  function judgeSpot(i) {
    if (!R || !R.spot || R.phase !== "main") return;
    var item = currentItem();
    if (!item || R.results[item.id] || spotPickedIndex(item) >= 0) return;
    var order = spotOrderOf(item);
    i = Math.floor(Number(i));
    if (!isFinite(i) || i < 0 || i >= order.length) return;
    R.spot.picked[item.id] = i;
    R.spot.total += 1;
    if (order[i] === item.topic) R.spot.ok += 1;
    else if (R.spot.wrongTopics.indexOf(item.topic) < 0) R.spot.wrongTopics.push(item.topic);
    R.spot.hold = item.id;      // 停在第一屏讲解态，点 ack / Enter 才进第二屏
    R.locked = true;
    paintSpotPanel(item);
    updateBar();
    snapshotRound();
  }
  /* 第一屏判完后就地画绿/红 + 反馈（不重渲染整张卡） */
  function paintSpotPanel(item) {
    var pi = spotPickedIndex(item);
    if (pi < 0) return;
    var order = spotOrderOf(item);
    var correctIdx = order.indexOf(item.topic);
    var ok = order[pi] === item.topic;
    var els = $$(".spot-opt", $("#qcard"));
    els.forEach(function (el) { el.disabled = true; });
    var picked = els[pi];
    if (picked) {
      picked.classList.add(ok ? "is-ok" : "is-bad");
      var mark = picked.querySelector(".mark");
      if (mark) mark.textContent = ok ? "✓" : "✗";
    }
    if (!ok && els[correctIdx]) els[correctIdx].classList.add("is-right");
    var fb = $("#fb");
    if (fb) { fb.className = "fb show " + (ok ? "fb-ok" : "fb-bad"); fb.innerHTML = spotFeedbackHTML(item); }
  }
  /* 考点判错时，答案反馈里追加一行 */
  function spotWrongNoteHTML(item) {
    if (!R || !R.spot || R.phase !== "main" || !item) return "";
    var pi = spotPickedIndex(item);
    if (pi < 0) return "";
    var order = spotOrderOf(item);
    if (!order[pi] || order[pi] === item.topic) return "";
    return '<p class="fb-line fb-spotwarn">⚠ 考点判错了：你选的是 ' + esc(order[pi]) + "</p>";
  }

  function currentItem() { return R && R.idx < R.list.length ? R.list[R.idx] : null; }

  function updateBar() {
    if (!R) return;
    var total = R.list.length;
    var pct = total ? Math.round((R.done / total) * 100) : 0;
    $("#pg-fill").style.width = pct + "%";
    $("#bar-progress").textContent = R.done + "/" + total + (R.phase === "redo" ? " 重练" : "");
    var navCount = $("#nav-count");
    if (navCount) navCount.textContent = Math.min(R.idx + 1, total) + "/" + total;
    // 看答案的题不计入正确率的分子/分母
    var judged = Math.max(0, R.done - phasePeekCount());
    $("#bar-rate").innerHTML = judged > 0
      ? "正确率 <b>" + R.phaseOk + "/" + judged + " " + Math.round((R.phaseOk / judged) * 100) + "%</b>"
      : "正确率 <b>—</b>";
  }
  function phasePeekCount() {
    if (!R) return 0;
    // 直接用本题结果里标了 peek 的条数：主轮/重练轮、刷新后同一口径
    var n = 0, rs = R.results || {};
    Object.keys(rs).forEach(function (id) { if (rs[id] && rs[id].peek) n += 1; });
    return n;
  }

  /* 单题历史：这一题历史上做对几次、做错几次、看答案几次。
     数据一直在 store.stat（recordAttempt 累加），只是以前没显示；它是持久化的，所以刷新后照样在。 */
  function statOf(id) { return store.stat[id] || null; }
  function histText(id) {
    var s = statOf(id);
    if (!s) return "";
    var att = num(s.att), ok = num(s.ok), wrong = num(s.wrong), peek = num(s.peek);
    if (!att && !peek) return "";
    var parts = [];
    if (ok) parts.push("做对 " + ok + " 次");
    if (wrong) parts.push("做错 " + wrong + " 次");
    if (peek) parts.push("看答案 " + peek + " 次");
    if (!parts.length) return "";
    return "历史：" + parts.join(" · ") + "（共 " + (att + peek) + " 次）";
  }
  function paintHist() {
    var el = $("#qhist");
    if (!el) return;
    var item = currentItem();
    var t = item ? histText(item.id) : "";
    el.textContent = t;
    el.classList.toggle("show", !!t);
    var s = item ? statOf(item.id) : null;
    if (s && s.at) el.title = "上次作答：" + fmtDateTime(new Date(s.at));
    else el.removeAttribute("title");
  }

  function renderQuestion() {
    var item = currentItem();
    if (!item) { endPhase(); return; }
    var res = R.results[item.id] || null;
    var sp = spotStateOf(item);
    if (R.spot) R.spot.hold = null;      // 重新渲染＝离开「刚判完考点」的停留态
    R.locked = !!res || sp === "judge";
    R.peekHold = !!(res && res.peek);
    R.justAnswered = false;
    clearTimeout(R.autoTimer);
    if (R.phase === "redo" && res && res.peek) R.redoPeek = Math.max(1, R.redoPeek);
    var wrap = $("#qcard");
    hideTip();                            // 换题/重绘：先把词义浮层收掉
    var html = '<div class="qhist" id="qhist"></div>';
    html += '<div class="qstem" id="qstem">' + stemHTML(item) + "</div>";
    if (item.cn && res) html += cnHTML(item.cn);   // 译文只在答完/看答案后出现
    if (sp === "judge") {
      // 第一屏：只有考点按钮，绝不出现 A/B/C/D，也不出现「看答案」
      html += spotPanelHTML(item);
    } else {
      html += '<div class="opts" role="group" aria-label="选项">';
      item.options.slice(0, 4).forEach(function (txt, i) {
        html += '<button type="button" class="opt" data-i="' + i + '" data-k="' + LETTERS[i] + '">' +
          '<span class="badge">' + LETTERS[i] + '</span><span class="txt">' + esc(txt) + "</span>" +
          '<span class="mark"></span></button>';
      });
      html += "</div>";
      // 逃生阀：只在「还没判、也没看答案」时出现
      if (!res) html += '<button type="button" class="peeklink" data-act="peek">看答案</button>';
    }
    html += '<div class="fb" id="fb"></div>';
    wrap.innerHTML = html;
    if (res) paintResult(item, res);   // 切回已作答的题：只还原画面，不动任何统计
    paintHist();
    $("#bar-topic").textContent = sp === "judge" ? "考点？" : (item.topic || "—");
    var hint = $("#drill-line");
    if (hint) {
      hint.textContent = (R.spot && R.phase === "main" && sp === "judge")
        ? "1–4 选考点 · Enter 继续 · ← → 换题 · Esc 退出"
        : "← → 换题 · 1–4 / A–D 选答案 · Enter 下一题 · Esc 退出 · 悬停词看中文";
    }
    $("#bar-time").textContent = fmtClock(Date.now() - R.startAt);
    updateBar();
    var q = $(".qwrap"); if (q) q.scrollTop = 0;
    snapshotRound();
  }

  /* 已作答的题重新显示时用：把当时的判分/看答案状态原样画出来（只读） */
  function paintResult(item, res) {
    var els = $$(".opt", $("#qcard"));
    els.forEach(function (el) { el.disabled = true; });
    var correctIdx = LETTERS.indexOf(item.answer);
    if (res.peek) {
      if (els[correctIdx]) els[correctIdx].classList.add("is-right");
      var fbP = $("#fb");
      if (fbP) { fbP.className = "fb show fb-peek"; fbP.innerHTML = peekHTML(item); }
      return;
    }
    var picked = els[res.picked];
    if (picked) {
      picked.classList.add(res.correct ? "is-ok" : "is-bad");
      var mark = picked.querySelector(".mark");
      if (mark) mark.textContent = res.correct ? "✓" : "✗";
    }
    if (res.correct !== true && els[correctIdx]) els[correctIdx].classList.add("is-right");
    var fb = $("#fb");
    if (fb) { fb.className = "fb show " + (res.correct === true ? "fb-ok" : "fb-bad"); fb.innerHTML = feedbackHTML(item, res.correct === true); }
  }

  function judge(optIdx) {
    if (!R || R.locked) return;
    var item = currentItem();
    if (!item || R.results[item.id]) return;
    var opts = item.options.slice(0, 4);
    if (optIdx < 0 || optIdx >= opts.length) return;
    var correctIdx = LETTERS.indexOf(item.answer);
    if (correctIdx < 0 || correctIdx >= opts.length) return;
    var correct = optIdx === correctIdx;
    R.locked = true;
    R.peekHold = false;
    R.justAnswered = true;
    R.judgeCount += 1;
    R.results[item.id] = { picked: optIdx, peek: false, correct: correct };
    hidePeek();

    var els = $$(".opt", $("#qcard"));
    var picked = els[optIdx];
    if (picked) {
      picked.classList.add(correct ? "is-ok" : "is-bad");
      picked.querySelector(".mark").textContent = correct ? "✓" : "✗";
    }
    if (!correct && els[correctIdx]) els[correctIdx].classList.add("is-right");
    els.forEach(function (el) { el.disabled = true; });

    recordAttempt(item, correct);
    paintHist();     // 历史次数把这一次也算进去

    var fb = $("#fb");
    if (correct) {
      R.phaseOk += 1;
      if (R.phase === "main") {
        R.ok += 1;
        var t = R.perTopic[item.topic];
        if (t) t.ok += 1;
      }
      if (fb) { fb.className = "fb show fb-ok"; fb.innerHTML = feedbackHTML(item, true); }
      if (autoNextOn()) R.autoTimer = setTimeout(advance, 1000);
    } else {
      if (R.phase === "main") R.wrongIds.push(item.id);
      R.pendingRedo.push(item);
      if (fb) { fb.className = "fb show fb-bad"; fb.innerHTML = feedbackHTML(item, false); }
    }
    R.done += 1;
    updateBar();
    revealCn(item);      // 答完：题干下方显示整句译文
    hideTip();
    snapshotRound();
  }

  /* ══ 看答案（逃生阀：不计分，但进重练） ═══════════ */
  function hidePeek() {
    var pl = $("#qcard [data-act='peek']");
    if (pl) pl.remove();
  }
  function peekHTML(item) {
    var addRedo = R && R.phase === "main";
    var h = '<p class="fb-head">👀 看答案 · 考点：<b>' + esc(item.topic || "未分类") + "</b></p>";
    h += cueLineHTML(item);
    h += '<p class="fb-line"><b>规则：</b>' + esc(item.rule || "") + "</p>";
    if (item.trap) h += '<p class="fb-line"><b>易错点：</b>' + esc(item.trap) + "</p>";
    if (item.src) h += '<p class="fb-src">出处：' + esc(item.src) + "</p>";
    h += '<p class="fb-note">这题没计入正确率' + (addRedo ? "，已加入重练" : "") + "</p>";
    h += '<button type="button" class="btn ack" data-act="ack">下一题 →</button>';
    return h;
  }
  function paintPeek(item) {
    if (!item) return;
    var els = $$(".opt", $("#qcard"));
    var ci = LETTERS.indexOf(item.answer);
    els.forEach(function (el) { el.disabled = true; });
    if (els[ci]) els[ci].classList.add("is-right");   // 只标正确项，不给任何选项标红
    hidePeek();
    var fb = $("#fb");
    if (fb) { fb.className = "fb show fb-peek"; fb.innerHTML = peekHTML(item); }
    revealCn(item);      // 看答案 = 已揭晓，译文同时出现
    hideTip();
  }
  function doPeek() {
    if (!R || R.locked) return;
    var item = currentItem();
    if (!item || R.results[item.id]) return;
    R.locked = true;
    R.peekHold = true;
    R.justAnswered = true;
    R.done += 1;
    R.results[item.id] = { picked: -1, peek: true, correct: null };
    // 看答案也记进单题历史（只加 peek 计数，绝不动 att/ok/wrong，所以正确率口径不变）
    var st = statOf(item.id);
    if (!st) st = store.stat[item.id] = { att: 0, ok: 0, wrong: 0, at: "" };
    st.peek = num(st.peek) + 1;
    saveStore();
    if (R.phase === "main") {
      if (R.peekIds.indexOf(item.id) < 0) {
        R.peekIds.push(item.id);
        var pt = R.perTopic[item.topic];      // 该考点的「看答案」计数：结算表要从题数/正确率里剔掉
        if (pt) pt.peek += 1;
      }
      R.pendingRedo.push(item);           // 没想起来 = 没掌握，末尾必须再做一次
    } else {
      R.redoPeek += 1;                    // 重练轮再看答案不再重排，避免死循环
    }
    paintPeek(item);
    paintHist();
    updateBar();
    snapshotRound();
    toast(R.phase === "main" ? "这题不计分，已加入重练" : "这题不计分");
  }

  /* 「下一题 →」= 继续：跳到下一道还没做的题；全做完就进重练/结算 */
  function advance() {
    if (!R) return;
    hideTip();
    clearTimeout(R.autoTimer);
    R.autoTimer = null;
    R.peekHold = false;
    R.justAnswered = false;
    if (R.done >= R.list.length) { endPhase(); return; }
    var next = firstUnansweredAfter(R.idx);
    if (next < 0) { endPhase(); return; }
    R.idx = next;
    renderQuestion();
  }
  function firstUnansweredAfter(from) {
    if (!R) return -1;
    var n = R.list.length;
    for (var k = 1; k <= n; k++) {
      var i = (from + k) % n;
      if (!R.results[R.list[i].id]) return i;
    }
    return -1;
  }
  function firstUnansweredIndex() {
    if (!R) return -1;
    for (var i = 0; i < R.list.length; i++) {
      if (!R.results[R.list[i].id]) return i;
    }
    return -1;
  }

  /* ══ 换题（答题卡 / 上一题 / 下一题） ═════════
     切题本身不判分、不计进度；已作答的题切回来只读回看，不重复计分。 */
  function navStep(d) {
    if (!R) return;
    var n = R.list.length;
    if (!n) return;
    var item = currentItem();
    if (d > 0 && item && R.results[item.id]) { advance(); return; }  // 已作答时「下一题」= 继续
    clearTimeout(R.autoTimer);
    R.autoTimer = null;
    R.idx = ((R.idx + d) % n + n) % n;
    R.justAnswered = false;
    renderQuestion();
  }
  function jumpTo(i) {
    if (!R || !isFinite(i) || i < 0 || i >= R.list.length) return;
    closeModal();
    clearTimeout(R.autoTimer);
    R.autoTimer = null;
    R.idx = Math.floor(i);
    R.justAnswered = false;
    renderQuestion();
  }
  function sheetCell(item, i) {
    var res = R.results[item.id];
    var cls = "sheet-cell", status = "未做";
    if (res) {
      if (res.peek) { cls += " is-peek"; status = "看答案"; }
      else if (res.correct === true) { cls += " is-ok"; status = "做对"; }
      else if (res.correct === false) { cls += " is-bad"; status = "做错"; }
      else { status = "已做"; }
    }
    if (i === R.idx) cls += " is-cur";
    return '<button type="button" class="' + cls + '" data-act="sheet-go" data-i="' + i +
      '" data-id="' + esc(item.id) + '" title="第 ' + (i + 1) + " 题 · " + esc(item.topic || "") +
      " · " + status + '">' + (i + 1) + "</button>";
  }
  function openSheet() {
    if (!R) return;
    clearTimeout(R.autoTimer);
    R.autoTimer = null;
    var n = R.list.length;
    var html = "<h3>答题卡</h3>" +
      '<p class="sheet-sub">' + esc(R.title || "") + " · 共 " + n + " 题 · 已做 " + R.done + " 题" +
      (R.phase === "redo" ? " · 重练轮" : "") + "</p>" +
      '<div class="sheet-legend"><span><i class="l-ok"></i>做对</span><span><i class="l-bad"></i>做错</span>' +
      '<span><i class="l-peek"></i>看答案</span><span><i style="background:#fff"></i>未做</span>' +
      '<span><i class="l-cur"></i>当前题</span></div>' +
      '<div class="sheet-grid">' + R.list.map(sheetCell).join("") + "</div>" +
      '<div class="modal-actions"><button class="btn" data-act="modal-cancel">关闭</button></div>';
    openModal(html);
  }

  function uniq(list) {
    var seen = {}, out = [];
    list.forEach(function (it) { if (it && !seen[it.id]) { seen[it.id] = 1; out.push(it); } });
    return out;
  }

  function endPhase() {
    if (!R) return;
    var next = uniq(R.pendingRedo);
    if (next.length) {
      R.pendingRedo = [];
      R.list = next;
      R.phase = "redo";
      R.idx = 0; R.done = 0; R.phaseOk = 0; R.redoPeek = 0;
      R.results = {}; R.justAnswered = false;
      toast("错题重练：" + next.length + " 题，做对才算过");
      renderQuestion();
      return;
    }
    finishRound();
  }

  function topicRows(perTopic) {
    return Object.keys(perTopic || {}).map(function (k) {
      var t = perTopic[k] || {};
      var peek = num(t.peek);
      var judged = Math.max(0, num(t.total) - peek);
      return {
        topic: t.topic || k, total: num(t.total), ok: num(t.ok), peek: peek, judged: judged,
        rate: judged ? Math.round((num(t.ok) / judged) * 100) : null   // null = 这个考点全是看答案
      };
    }).sort(function (a, b) {
      var ar = a.rate === null ? -1 : a.rate, br = b.rate === null ? -1 : b.rate;
      return ar - br;
    });
  }

  function commitRound(entry, perTopic, mainIds) {
    store.rounds.push(entry);
    if (store.rounds.length > 200) store.rounds = store.rounds.slice(-200);
    store.last = {
      mode: entry.mode, startAt: entry.startAt, endAt: entry.endAt, costMs: entry.costMs,
      total: entry.total, ok: entry.ok, wrongIds: entry.wrongIds.slice(),
      itemIds: (mainIds || []).slice(),
      // perTopic 只加一个 peek 字段（看答案数），total/ok 语义不变
      perTopic: (perTopic || []).map(function (t) {
        return { topic: t.topic, total: num(t.total), ok: num(t.ok), peek: num(t.peek) };
      }),
      // 旧数据没有 spot → null（渲染时按「不是考点模式」处理）
      spot: normSpotComp(entry.spot)
    };
    store.current = null;
    saveStore();
    var result = store.last;
    R = null;
    stopTimer();
    renderResult(result);
  }

  function finishRound() {
    if (!R) return;
    var endAt = new Date();
    var entry = {
      mode: normMode(R.mode),
      startAt: new Date(R.startAt).toISOString(),
      endAt: endAt.toISOString(),
      costMs: Math.max(0, endAt.getTime() - R.startAt),
      total: R.main.length,
      ok: R.ok,
      wrongIds: R.wrongIds.slice(),
      peek: R.peekIds.length,
      peekIds: R.peekIds.slice(),
      // 只判考点：单独计数，不动 total/ok（答案口径）
      spot: R.spot ? { total: R.spot.total, ok: R.spot.ok, wrongTopics: R.spot.wrongTopics.slice() } : null
    };
    commitRound(entry, topicRows(R.perTopic), R.main.map(function (it) { return it.id; }));
  }

  /* 刷新前落盘：判分 / 翻题 / 切题后都写。
     刚判完还没翻页时按「下一题」记（避免刷新后重复判分）；看答案停留态按本题记。 */
  function snapshotRound() {
    if (!R) {
      if (store.current) { store.current = null; saveStore(); }
      return;
    }
    var ids = R.list.map(function (it) { return it.id; });
    var phase = R.phase;
    var idx = (R.justAnswered && !R.peekHold) ? R.idx + 1 : R.idx;
    var done = R.done;
    var phaseOk = R.phaseOk;
    var pending = uniq(R.pendingRedo).map(function (it) { return it.id; });
    var results = R.results;
    if (done >= ids.length) {
      if (pending.length) {          // 本阶段答完，且还有错题 → 快照直接进重练轮
        ids = pending; idx = 0; done = 0; phase = "redo"; phaseOk = 0; pending = []; results = {};
      } else {
        idx = ids.length;            // 本轮已答完（刷新后会直接看到结算）
        done = ids.length;
      }
    } else if (idx >= ids.length) {
      idx = firstUnansweredIndex();  // 有跳过的题：刷新回到第一道还没做的
      if (idx < 0) idx = 0;
    }
    done = Math.min(done, ids.length);
    store.current = {
      mode: normMode(R.mode), title: R.title || "",
      ids: ids, mainIds: R.main.map(function (it) { return it.id; }),
      idx: idx, done: done, ok: R.ok, phase: phase,
      wrongIds: R.wrongIds.slice(), pendingRedoIds: pending,
      peekIds: R.peekIds.slice(), results: results,
      // 考点屏已判、答案未答的题：这里带上 picked/order，刷新后回到第二屏且不重判考点
      spot: R.spot ? {
        total: R.spot.total, ok: R.spot.ok,
        picked: R.spot.picked, order: R.spot.order,
        wrongTopics: R.spot.wrongTopics.slice()
      } : null,
      phaseOk: phaseOk, phaseDone: done,
      perTopic: R.perTopic, startAt: new Date(R.startAt).toISOString(),
      autoNext: autoNextOn()
    };
    saveStore();
  }

  function finishFromCurrent(c) {
    var endAt = new Date();
    var startMs = new Date(c.startAt).getTime();
    if (!isFinite(startMs) || startMs <= 0) startMs = endAt.getTime();
    var entry = {
      mode: normMode(c.mode), startAt: new Date(startMs).toISOString(),
      endAt: endAt.toISOString(), costMs: Math.max(0, endAt.getTime() - startMs),
      total: c.mainIds.length, ok: c.ok, wrongIds: c.wrongIds.slice(),
      peek: c.peekIds.length, peekIds: c.peekIds.slice(),
      spot: c.spot ? { total: c.spot.total, ok: c.spot.ok, wrongTopics: (c.spot.wrongTopics || []).slice() } : null
    };
    commitRound(entry, topicRows(c.perTopic), c.mainIds);
  }

  /* 旧版快照没有 results：按「前 done 题顺序已做」补一份，避免切回去重复判分。
     新快照永远带 results，这条分支只为兼容旧记录。 */
  function legacyResults(list, done, wrongIds, peekIds, pendingIds, phase) {
    var out = {};
    var n = Math.min(done, list.length);
    for (var i = 0; i < n; i++) {
      var id = list[i].id;
      if (phase === "main") {
        if (peekIds.indexOf(id) >= 0) out[id] = { picked: -1, peek: true, correct: null };
        else if (wrongIds.indexOf(id) >= 0) out[id] = { picked: -1, peek: false, correct: false };
        else out[id] = { picked: -1, peek: false, correct: true };
      } else {
        out[id] = { picked: -1, peek: false, correct: pendingIds.indexOf(id) < 0 };
      }
    }
    return out;
  }
  function firstUnansweredIn(list, results) {
    for (var i = 0; i < list.length; i++) if (!results[list[i].id]) return i;
    return -1;
  }
  /* 启动时恢复进行中的本轮（刷新不丢进度） */
  function resumeRound() {
    var c = store.current;
    if (!c) return false;
    var list = [], keptIds = [];
    c.ids.forEach(function (id) {
      var it = itemById[id];
      if (it) { list.push(it); keptIds.push(id); }
    });
    if (!list.length) { store.current = null; saveStore(); return false; }
    var pending = c.pendingRedoIds.map(function (id) { return itemById[id]; }).filter(Boolean);
    var mainItems = c.mainIds.map(function (id) { return itemById[id]; }).filter(Boolean);
    if (!mainItems.length) mainItems = c.phase === "main" ? list.slice() : [];
    var done = Math.min(c.done, list.length);
    var results = c.results || {};
    if (c.legacy && done > 0) {
      results = legacyResults(list, done, c.wrongIds, c.peekIds, c.pendingRedoIds, c.phase);
    }
    var idx = Math.min(c.idx, list.length);

    if (idx >= list.length) {
      if (done >= list.length && pending.length) {
        R = makeRound({
          mode: c.mode, title: c.title, main: mainItems, list: pending.slice(), phase: "redo",
          idx: 0, done: 0, phaseOk: 0, ok: c.ok, wrongIds: c.wrongIds,
          pendingRedo: [], perTopic: c.perTopic, startAt: c.startAt, peekIds: c.peekIds, results: {},
          spot: c.spot
        });
        switchView("drill"); updateAutoBtn(); renderQuestion(); startTimer();
        toast("还有错题没重练：共 " + pending.length + " 题", 2600);
        return true;
      }
      if (done >= list.length) { finishFromCurrent(c); return true; }
      idx = firstUnansweredIn(list, results);   // 有跳过的题：回到第一道没做的
      if (idx < 0) idx = 0;
    }

    R = makeRound({
      mode: c.mode, title: c.title, main: mainItems, list: list, phase: c.phase,
      idx: idx, done: done, phaseOk: c.phaseOk, ok: c.ok, wrongIds: c.wrongIds,
      pendingRedo: pending, perTopic: c.perTopic, startAt: c.startAt, peekIds: c.peekIds,
      results: results, spot: c.spot
    });
    R.judgeCount = done;
    switchView("drill");
    updateAutoBtn();
    renderQuestion();   // 已经作答的那道题（含看答案停留态）由 results 自动还原
    startTimer();
    toast("接着上次：已做 " + done + "/" + list.length + (c.phase === "redo" ? "（重练）" : ""));
    return true;
  }

  /* ══ 计时 ══════════════════════════════════ */
  function startTimer() {
    stopTimer();
    timerId = setInterval(function () {
      if (!R) return;
      var el = $("#bar-time");
      if (el) el.textContent = fmtClock(Date.now() - R.startAt);
    }, 500);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    if (R && R.autoTimer) { clearTimeout(R.autoTimer); R.autoTimer = null; }
  }

  /* ══ 结算屏 ════════════════════════════════ */
  /* 「看答案」的题不在 last 里（last 契约不变），从对应那轮 rounds 记录里取 */
  function peekOfResult(res) {
    if (!res) return { count: 0, ids: [] };
    var rs = store.rounds || [];
    for (var i = rs.length - 1; i >= 0; i--) {
      var r = rs[i];
      if (r && r.startAt === res.startAt) {
        var ids = (r.peekIds || []).filter(function (x) { return typeof x === "string" && itemById[x]; });
        return { count: num(r.peek), ids: ids };
      }
    }
    return { count: 0, ids: [] };
  }

  /* 结算屏「考点识别 对 X/Y」一行：只有只判考点模式才有；旧数据 spot=null 时整行隐藏 */
  function renderSpotLine(res) {
    var el = $("#rt-spot");
    if (!el) return;
    var sp = res && res.spot;
    var st = sp ? Math.floor(num(sp.total)) : 0;
    if (!st) { el.innerHTML = ""; el.classList.remove("show"); return; }
    var so = Math.min(st, Math.floor(num(sp.ok)));
    var srate = Math.round((so / st) * 100);
    var total = Number(res.total) || 0, ok = Number(res.ok) || 0;
    var pk = peekOfResult(res);
    var judged = Math.max(0, total - pk.count);
    var arate = judged ? Math.round((ok / judged) * 100) : 0;
    var h = "考点识别 对 <b>" + so + "</b>/" + st + "（<b>" + srate + "%</b>） · 答案 对 <b>" + ok + "</b>/" +
      judged + "（" + (judged ? arate + "%" : "—") + "）";
    var wt = strList(sp.wrongTopics);
    if (wt.length) {
      h += '<span class="rt-spot-wt">判错的考点：' + esc(wt.slice(0, 5).join("、")) +
        (wt.length > 5 ? " 等" : "") + "</span>";
    }
    el.innerHTML = h;
    el.classList.add("show");
  }

  function renderResult(res) {
    if (!res) { renderHome(); return; }
    var total = Number(res.total) || 0;
    var ok = Number(res.ok) || 0;
    var pk = peekOfResult(res);
    var judged = Math.max(0, total - pk.count);       // 看答案的题不计入分母
    var rate = judged ? Math.round((ok / judged) * 100) : 0;
    var pctEl = $("#rt-pct");
    pctEl.textContent = judged ? rate + "%" : "—";
    pctEl.classList.toggle("is-weak", judged > 0 && rate < 60);
    $("#rt-sub").innerHTML = "对 <b>" + ok + "</b> / " + judged + " · 用时 <b>" + fmtClock(res.costMs) + "</b>";
    var peekEl = $("#rt-peek");
    if (pk.count > 0) {
      peekEl.innerHTML = "另有 <b>" + pk.count + "</b> 题看了答案（没计入正确率，已加入重练）";
      peekEl.classList.add("show");
    } else {
      peekEl.innerHTML = "";
      peekEl.classList.remove("show");
    }
    renderSpotLine(res);

    // 每个考点：题数/正确率都剔掉「看答案」的题（与大号正确率、对 X/Y 同口径）
    var rows = (res.perTopic || []).map(function (t) {
      var peek = num(t.peek);
      var judged = Math.max(0, num(t.total) - peek);
      return {
        topic: t.topic, ok: num(t.ok), peek: peek, judged: judged,
        rate: judged ? Math.round((num(t.ok) / judged) * 100) : null
      };
    });
    rows.sort(function (a, b) {
      var ar = a.rate === null ? -1 : a.rate, br = b.rate === null ? -1 : b.rate;
      return ar - br;
    });
    var isWeak = function (t) { return t.rate === null || t.rate < 60; };
    var weak = rows.filter(isWeak);
    var body = $("#rt-body");
    body.innerHTML = rows.map(function (t) {
      var cls = isWeak(t) ? ' class="weak"' : "";
      var rateTxt = t.rate === null ? "—" : t.rate + "%";
      return "<tr" + cls + '><td class="tp">' + esc(t.topic) + '</td><td class="num">' + t.judged +
        '</td><td class="num">' + t.ok + '</td><td class="num rate">' + rateTxt + "</td></tr>";
    }).join("") || '<tr><td colspan="4" style="color:#9a9aa5">本轮没有数据</td></tr>';

    // 看了答案的题：琥珀色 chips，点一下回看这道题
    var chips = $("#rt-chips");
    if (pk.ids.length) {
      chips.innerHTML = '<span class="ct">看了答案的题（点一下回看）</span>' + pk.ids.map(function (id) {
        var it = itemById[id];
        return '<button type="button" class="chip" data-act="peek-id" data-id="' + esc(id) + '">' +
          esc(it.topic) + '</button>';
      }).join("");
      chips.classList.add("show");
    } else {
      chips.innerHTML = "";
      chips.classList.remove("show");
    }

    var note = $("#rt-note");
    note.className = "rt-note";
    // 只判考点模式：答案分再高，考点识别不到 80% 也先别夸「稳了」
    var sp = res.spot;
    var spTotal = sp ? Math.floor(num(sp.total)) : 0;
    var spRate = spTotal ? Math.round((Math.min(spTotal, Math.floor(num(sp.ok))) / spTotal) * 100) : null;
    if (weak.length) {
      note.classList.add("warn");
      note.innerHTML = "明早考前把这 <b>" + weak.length + "</b> 个点再看一眼：" + esc(weak.slice(0, 4).map(function (t) { return t.topic; }).join("、")) +
        (weak.length > 4 ? " 等" : "") + "。";
    } else if (spRate !== null && spRate < 80) {
      note.classList.add("warn");
      note.innerHTML = "答案对了 " + rate + "%，但考点识别只有 <b>" + spRate + "%</b>：先把「判考点」练到 8/10，再回普通模式刷速度。";
    } else if (rate >= 85) {
      note.innerHTML = "今晚这块稳了（" + rate + "%），明早保持手感就行。";
    } else {
      note.innerHTML = "没有低于 60% 的考点了，睡前再扫一遍规则就够。";
    }

    var nr = (res.wrongIds || []).length;
    $("#act-redo").textContent = "重练错题（" + nr + "）";
    $("#act-redo").disabled = nr === 0;
    $("#act-again").textContent = res.mode === "spot" ? "下一组 10 题" : "再来一轮";
    $("#act-again").disabled = !(res.itemIds && res.itemIds.length);
    switchView("result");
  }

  /* 结算页 chips 点开：回看这道题（只读，不动成绩） */
  function openPeekReview(id) {
    var it = itemById[id];
    if (!it) { toast("题库里找不到这道题"); return; }
    var ci = LETTERS.indexOf(it.answer);
    var html = '<h3>回看 · ' + esc(it.topic || "") + "</h3>";
    var cue = cueOf(it);
    if (cue) html += '<p class="rv-line rv-cue"><b>怎么认出：</b>' + esc(cue) + "</p>";
    html += '<p class="rv-stem">' + stemHTML(it) + "</p>";
    if (it.cn) html += '<p class="rv-cn"><span class="qcn-tag">译</span><span class="qcn-txt">' + esc(it.cn) + "</span></p>";
    html += '<div class="rv-opts">' + it.options.slice(0, 4).map(function (txt, i) {
      return '<div class="rv-opt' + (i === ci ? " is-right" : "") + '"><span class="badge">' + LETTERS[i] +
        "</span><span>" + esc(txt) + (i === ci ? " ✓" : "") + "</span></div>";
    }).join("") + "</div>";
    html += '<p class="rv-line"><b>规则：</b>' + esc(it.rule || "") + "</p>";
    if (it.trap) html += '<p class="rv-line"><b>易错点：</b>' + esc(it.trap) + "</p>";
    var h = histText(id);
    if (h) html += '<p class="rv-hist">' + esc(h) + "</p>";
    if (it.src) html += '<p class="rv-src">出处：' + esc(it.src) + "</p>";
    html += '<div class="modal-actions"><button class="btn primary" data-act="modal-cancel">关闭</button></div>';
    openModal(html);
  }

  function lastResult() { return store.last && store.last.total ? store.last : null; }

  function copySummary() {
    var text = summaryText();
    if (!text) { toast("还没有可复制的记录"); return; }
    var done = function () { toast("今晚小结已复制，可以粘贴给家长/老师"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else fallbackCopy(text, done);
  }
  function summaryText() {
    var res = lastResult();
    if (!res) return "";
    var total = Number(res.total) || 0, ok = Number(res.ok) || 0;
    var pk = peekOfResult(res);
    var judged = Math.max(0, total - pk.count);
    var rate = judged ? Math.round((ok / judged) * 100) : 0;
    // 考点小结与结算表同口径：题数/正确率都剔掉看答案的题
    var rows = (res.perTopic || []).map(function (t) {
      var peek = num(t.peek);
      var judgedT = Math.max(0, num(t.total) - peek);
      return { topic: t.topic, ok: num(t.ok), judged: judgedT,
        rate: judgedT ? Math.round((num(t.ok) / judgedT) * 100) : null };
    });
    var weak = rows.filter(function (t) { return t.rate === null || t.rate < 60; })
      .sort(function (a, b) {
        var ar = a.rate === null ? -1 : a.rate, br = b.rate === null ? -1 : b.rate;
        return ar - br;
      });
    var lines = [];
    lines.push("# 语法闪练 · 今晚小结");
    lines.push("");
    lines.push("- 时间：" + (res.endAt ? fmtDateTime(new Date(res.endAt)) : fmtDateTime(new Date())));
    lines.push("- 正确率：" + (judged ? rate + "%" : "—") + "（对 " + ok + " / " + judged + "）");
    if (res.spot && num(res.spot.total)) {
      var st = Math.floor(num(res.spot.total)), so = Math.min(st, Math.floor(num(res.spot.ok)));
      lines.push("- 考点识别：" + so + " / " + st + "（" + Math.round((so / st) * 100) + "%）");
      var wt = strList(res.spot.wrongTopics);
      if (wt.length) lines.push("- 判错的考点：" + wt.slice(0, 5).join("、") + (wt.length > 5 ? " 等" : ""));
    }
    if (pk.count > 0) lines.push("- 另有 " + pk.count + " 题看了答案（没计入正确率，已加入重练）");
    lines.push("- 用时：" + fmtClock(res.costMs));
    lines.push("");
    if (weak.length) {
      lines.push("## 低于 60% 的考点（明早再看一眼）");
      weak.forEach(function (t) {
        lines.push("- " + t.topic + "：" + t.judged + " 题对 " + t.ok + "（" + (t.rate === null ? "—" : t.rate + "%") + "）");
      });
    } else {
      lines.push("## 低于 60% 的考点");
      lines.push("- 无");
    }
    lines.push("");
    lines.push("## 错题");
    var ids = res.wrongIds || [];
    if (!ids.length) lines.push("- 无");
    else ids.forEach(function (id) {
      var it = itemById[id];
      lines.push("- " + id + " · " + (it ? it.topic : "（题库里已找不到这道题）") +
        (it && it.src ? " · 出处：" + it.src : ""));
    });
    lines.push("");
    lines.push("## 看了答案的题");
    var pids = peekOfResult(res).ids;
    if (!pids.length) lines.push("- 无");
    else pids.forEach(function (id) {
      var it = itemById[id];
      lines.push("- " + id + " · " + (it ? it.topic : "（题库里已找不到这道题）") +
        (it && it.src ? " · 出处：" + it.src : ""));
    });
    return lines.join("\n");
  }
  function fallbackCopy(text, done) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      done();
    } catch (e) { toast("复制失败，请手动选择文本"); }
  }

  /* ══ 导出 / 导入 / 清空 ════════════════════ */
  function exportPayload() {
    return {
      schema: "lt.practice-records/1", subject: "英语", tool: "语法闪练",
      exportedAt: new Date().toISOString(), data: store
    };
  }
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || "application/json;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  function exportJSON() {
    var count = Object.keys(store.stat).length;
    download("英语-语法闪练-" + fmtDate() + ".json", JSON.stringify(exportPayload(), null, 1));
    toast("已导出 " + count + " 条作答记录");
  }
  function applyImportText(text) {
    var parsed;
    try { parsed = JSON.parse(String(text || "")); } catch (e) { alert("导入失败：不是合法的 JSON 文件。"); return false; }
    if (!parsed || typeof parsed !== "object" || !parsed.data || typeof parsed.data !== "object") {
      alert("导入失败：文件里没有练习记录数据。");
      return false;
    }
    var next = normalizeStore(parsed.data);
    var before = Object.keys(store.stat).length;
    var after = Object.keys(next.stat).length;
    var beforeR = store.rounds.length, afterR = next.rounds.length;
    if (!confirm("导入会整份覆盖现在的记录（现在 " + before + " 条作答 / " + beforeR + " 轮 → 导入 " + after + " 条作答 / " + afterR + " 轮）。继续？")) return false;
    store = next;
    saveStore();
    toast("已导入 " + after + " 条作答记录");
    renderHome();
    return true;
  }
  function importJSON() {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json";
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { applyImportText(String(reader.result || "")); };
      reader.onerror = function () { alert("导入失败：文件读不出来。"); };
      reader.readAsText(f);
    });
    input.click();
  }
  function clearAll() {
    if (!confirm("清空全部练习记录（作答统计 + 每轮成绩）？此操作不可撤销。")) return;
    var keepAuto = autoNextOn();
    store = blankStore();
    store.settings.autoNext = keepAuto;
    saveStore();
    toast("已清空全部记录");
    renderHome();
  }

  /* ══ 弹窗 ══════════════════════════════════ */
  function openModal(html, onClose) {
    $("#modal-card").innerHTML = html;
    $("#modal").classList.add("is-open");
    modalClose = onClose || null;
  }
  function closeModal() {
    $("#modal").classList.remove("is-open");
    var f = modalClose; modalClose = null;
    if (f) f();
  }
  function openPlanModal() {
    if (!blocks.length) { toast("题库还没生成"); return; }
    var total = planItems().length;
    var mins = planMinutes();
    openModal(
      "<h3>今晚方案</h3>" +
      "<p>" + blocks.length + " 个 block · 共 <b>" + total + "</b> 题 · 预计 <b>" + mins + "</b> 分钟</p>" +
      '<p class="modal-hint">按 Block ' + blocks.map(function (b) { return b.block; }).join(" → ") +
      " 顺序刷；卡住可换题或看答案，答错/看答案的题本轮末尾自动重练，做对才进结算。</p>" +
      '<div class="modal-actions"><button class="btn" data-act="modal-cancel">再看看</button>' +
      '<button class="btn primary" data-act="plan-start">开始</button></div>'
    );
  }

  /* ══ 交互 ══════════════════════════════════ */
  function askQuit() {
    if (!R) { renderHome(); return; }
    var total = R.main.length;
    var msg;
    if (R.phase === "redo") {
      msg = "本轮 " + total + " 题已做完，错题还没重练完，确定退出？";
    } else {
      var done = Math.min(R.done, total);
      msg = done === 0
        ? "本轮 " + total + " 题还没开始做，确定退出？"
        : "本轮 " + total + " 题只做了 " + done + " 题，确定退出？";
    }
    if (!confirm(msg)) return;
    stopTimer();
    R = null;
    store.current = null;      // 退出＝放弃本轮，不写 rounds
    saveStore();
    renderHome();
    toast("已退出，本轮已放弃（不写成绩记录）");
  }

  /* ══ 页内文档（构建期把 md 转成 HTML 注入 FLASH_DOCS） ══ */
  function openDoc(key, from) {
    var docs = window.FLASH_DOCS;
    var d = docs && docs[key];
    if (!d || !d.html) { toast("文档还没打包，先跑 node build.mjs"); return false; }
    S.docFrom = from || (S.view === "result" ? "result" : "home");
    $("#doc-title").textContent = d.title || "文档";
    var body = $("#doc-body");
    body.innerHTML = d.html;
    $$("table", body).forEach(function (t) {
      var w = document.createElement("div");
      w.className = "tablewrap";
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
    switchView("doc");
    return true;
  }
  function closeDoc() {
    if (S.docFrom === "result" && lastResult()) { renderResult(lastResult()); return; }
    renderHome();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-act]") : null;
    if (t) {
      var act = t.getAttribute("data-act");
      if (act === "plan") { openPlanModal(); return; }
      if (act === "plan-start") { closeModal(); startRound("plan", planItems(), { title: "今晚方案" }); return; }
      if (act === "modal-cancel") { closeModal(); return; }
      if (act === "wrong-queue") {
        var w = wrongItems();
        if (!w.length) { toast("还没有错过的题（做错或看答案都算）"); return; }
        startRound("redo", w, { title: "只刷错题" });
        return;
      }
      if (act === "spot") { startSpot(); return; }
      if (act === "prev") { navStep(-1); return; }
      if (act === "next") { navStep(1); return; }
      if (act === "sheet") { openSheet(); return; }
      if (act === "sheet-go") { jumpTo(Number(t.getAttribute("data-i"))); return; }
      if (act === "quit") { askQuit(); return; }
      if (act === "ack") {
        var ackItem = currentItem();
        if (R && R.spot && ackItem && R.spot.hold === ackItem.id) {   // 第一屏「看选项，选答案 →」
          R.spot.hold = null;
          renderQuestion();
          return;
        }
        advance();
        return;
      }
      if (act === "peek") { doPeek(); return; }
      if (act === "peek-id") { openPeekReview(t.getAttribute("data-id")); return; }
      if (act === "auto") { toggleAuto(); return; }
      if (act === "doc") { openDoc(t.getAttribute("data-doc")); return; }
      if (act === "doc-back") { closeDoc(); return; }
      if (act === "redo-wrong") {
        var res = lastResult();
        if (!res || !res.wrongIds.length) return;
        var items = res.wrongIds.map(function (id) { return itemById[id]; }).filter(Boolean);
        startRound("redo", items, { title: "重练错题" });
        return;
      }
      if (act === "again") {
        var r2 = lastResult();
        if (!r2 || !r2.itemIds.length) return;
        // 只判考点：这里的按钮是「下一组 10 题」，顺着题库往后开新一组，而不是把同 10 题再做一遍
        if (r2.mode === "spot") { startSpot(); return; }
        var its = r2.itemIds.map(function (id) { return itemById[id]; }).filter(Boolean);
        startRound(r2.mode || "block", its, { title: "再来一轮" });
        return;
      }
      if (act === "copy") { copySummary(); return; }
      if (act === "home") { renderHome(); return; }
      if (act === "export") { exportJSON(); return; }
      if (act === "import") { importJSON(); return; }
      if (act === "clear") { clearAll(); return; }
      return;
    }
    var opt = e.target.closest ? e.target.closest(".opt") : null;
    if (opt && !opt.disabled && R && S.view === "drill") { judge(Number(opt.getAttribute("data-i"))); return; }
    var spotOpt = e.target.closest ? e.target.closest(".spot-opt") : null;
    if (spotOpt && !spotOpt.disabled && R && S.view === "drill") { judgeSpot(Number(spotOpt.getAttribute("data-i"))); return; }
    var card = e.target.closest ? e.target.closest(".bcard") : null;
    if (card && !card.disabled && card.dataset.block) {
      var no = Number(card.dataset.block);
      var b = blockByNo[no];
      if (b) startRound("block", b.items.slice(), { title: "Block " + no });
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.isComposing) return;
    if (e.key === "Escape") {
      if ($("#modal").classList.contains("is-open")) { closeModal(); e.preventDefault(); return; }
      if (S.view === "drill") { e.preventDefault(); askQuit(); return; }
      if (S.view === "doc") { e.preventDefault(); closeDoc(); return; }
      if (S.view === "result") { renderHome(); return; }
      return;
    }
    if (S.view !== "drill" || !R) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ($("#modal").classList.contains("is-open")) return;
    var spSt = spotStateOf(currentItem());
    if (spSt === "judge") {          // 考点屏：1–4 选考点，其他键先不判答案
      if (e.key === "ArrowLeft") { e.preventDefault(); navStep(-1); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); navStep(1); return; }
      if (/^[1-4]$/.test(e.key)) { e.preventDefault(); judgeSpot(Number(e.key) - 1); return; }
      if (e.key === "Enter") { e.preventDefault(); }   // 考点还没判，Enter 不翻页
      return;
    }
    if (spSt === "hold") {           // 刚判完考点：Enter 进第二屏
      if (e.key === "ArrowLeft") { e.preventDefault(); navStep(-1); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); navStep(1); return; }
      if (e.key === "Enter") { e.preventDefault(); R.spot.hold = null; renderQuestion(); return; }
      return;
    }
    if (e.key === "ArrowLeft") { e.preventDefault(); navStep(-1); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); navStep(1); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      if (R.locked) advance();
      return;
    }
    if (R.locked) return;
    var i = -1;
    if (/^[1-4]$/.test(e.key)) i = Number(e.key) - 1;
    else if (/^[a-dA-D]$/.test(e.key)) i = LETTERS.indexOf(e.key.toUpperCase());
    if (i >= 0) { e.preventDefault(); judge(i); }
  });

  /* ══ 深链（只在启动读一次） ════════════════ */
  function parseHash() {
    var out = {};
    var h = String(location.hash || "").replace(/^#/, "");
    if (!h) return out;
    h.split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? "" : kv.slice(i + 1);
      if (!k) return;
      try { out[decodeURIComponent(k)] = decodeURIComponent(v); } catch (err) { out[k] = v; }
    });
    return out;
  }
  function boot() {
    loadGloss();
    initZhHover();
    initData();
    indexBlocks();
    updateAutoBtn();
    var hq = parseHash();
    if (hq.view === "doc") {
      var docs = window.FLASH_DOCS;
      if (docs && docs[hq.doc] && openDoc(hq.doc, "home")) return;
    }
    if (!blocks.length) { renderHome(); return; }
    if (hq.view === "result") {
      if (lastResult()) { renderResult(lastResult()); return; }
    }
    // 「只刷错题」是明确指令，优先于"接着上次"
    if (hq.list === "wrong") {
      var w = wrongItems();
      if (w.length) { startRound("redo", w, { title: "只刷错题" }); return; }
    }
    // 有进行中的本轮就接着做：刷新时地址栏可能还带着 #block=N / #view=drill，
    // 那也是"刷新"，不该把进度清零。要换组或放弃本轮，请先按「退出」。
    if (store.current && resumeRound()) return;
    if (hq.block) {
      var no = Number(hq.block);
      if (/^[1-9]$/.test(String(hq.block)) && blockByNo[no]) {
        startRound("block", blockByNo[no].items.slice(), { title: "Block " + no });
        return;
      }
    }
    if (hq.view === "drill") {
      if (planItems().length) { startRound("plan", planItems(), { title: "今晚方案" }); return; }
    }
    renderHome();
  }

  /* 测试钩子（qa.mjs 用；不影响正常使用） */
  window.FLASH_APP = {
    state: function () {
      var it = currentItem();
      return {
        view: S.view,
        settings: store.settings,
        current: store.current,
        docs: window.FLASH_DOCS ? Object.keys(window.FLASH_DOCS) : [],
        blocks: blocks.map(function (b) { return { block: b.block, title: b.title, n: b.items.length, minutes: b.minutes }; }),
        round: R ? {
          mode: R.mode, title: R.title, phase: R.phase, idx: R.idx, listLen: R.list.length, done: R.done,
          listIds: R.list.map(function (it) { return it.id; }),
          judged: R.judgeCount, ok: R.ok, phaseOk: R.phaseOk, locked: R.locked,
          pendingRedo: R.pendingRedo.length, wrongIds: R.wrongIds.slice(),
          peekIds: R.peekIds.slice(), peekCount: phasePeekCount(), peekHold: R.peekHold,
          itemId: it ? it.id : null, topic: it ? it.topic : null, answer: it ? it.answer : null,
          src: it ? (it.src || "") : null, cn: it ? (it.cn || null) : null
        } : null,
        store: store,
        // 悬停词义：全局词表规模（qa 用它断言词表已注入）
        gloss: { words: Object.keys(GLOSS.words).length, phrases: GLOSS.phrases.length },
        // 只判考点：当前阶段（judge/hold/answer）、计数、每题选项顺序（非该模式为 null）
        spot: R && R.spot ? {
          stage: it ? (spotStateOf(it) || (R.results && R.results[it.id] ? "done" : "")) : "",
          total: R.spot.total, ok: R.spot.ok,
          picked: R.spot.picked, order: R.spot.order,
          wrongTopics: R.spot.wrongTopics.slice()
        } : null,
        items: allItems().map(function (i) { return { id: i.id, block: i.block, topic: i.topic, answer: i.answer, src: i.src || "", cn: i.cn || null }; })
      };
    },
    exportPayload: exportPayload,
    importText: applyImportText,
    summary: summaryText,
    startBlock: function (no) { if (blockByNo[no]) startRound("block", blockByNo[no].items.slice(), { title: "Block " + no }); },
    startSpot: startSpot,          // 只判考点：n 可选，默认 10 题
    spotItems: spotItems,          // 只判考点的选题（qa / 调试用）
    home: renderHome,
    judge: judge,
    advance: advance,
    peek: doPeek,
    jumpTo: jumpTo,
    navStep: navStep,
    openSheet: openSheet,
    openDoc: openDoc,
    closeDoc: closeDoc,
    toggleAuto: toggleAuto
  };

  boot();
})();
</script>
</body>
</html>
