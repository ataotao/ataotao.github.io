<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c5cd6">
<title>语法闪练 · 九上 U1–U4</title>
<style>
:root{
  --accent:#7c5cd6; --accent-soft:#efeafe; --accent-line:#d9cffb;
  --ok:#1f8a4c; --ok-soft:#e9f6ee;
  --bad:#c0392b; --bad-soft:#fdecea;
  --bg:#f6f6f8; --card:#fff; --ink:#1c1c22; --ink-2:#3a3a45; --muted:#6b6b78;
  --line:#e6e6ee; --radius:14px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
.screen{display:none;max-width:760px;margin:0 auto;padding:0 14px 28px}
.screen.is-active{display:block}
html.drilling{overflow:hidden}
html.drilling body{overflow:hidden}

/* ── 开始屏 ───────────────────────────── */
.hero{padding:22px 2px 10px}
.hero h1{font-size:clamp(23px,6vw,30px);line-height:1.25;margin:0 0 6px;letter-spacing:.2px}
.hero .sub{margin:0;color:var(--muted);font-size:13.5px}
.hero .accent{color:var(--accent)}
.home-stat{margin:14px 0 0;font-size:12.5px;color:var(--muted)}
.home-stat b{color:var(--ink-2);font-weight:600}
.banner{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:#fff6e6;border:1px solid #f2dfb8;
  color:#8a6516;font-size:13px;line-height:1.55}
.banner code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;padding:1px 5px;border-radius:4px}
.actions{display:flex;flex-direction:column;gap:9px;margin:16px 0 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;
  border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer;
  transition:transform .1s,background .12s,border-color .12s,opacity .12s}
.btn:active{transform:scale(.988)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -12px rgba(124,92,214,.9)}
.btn.primary:active{background:#6b4cc4}
.btn.ghost{background:#fff;border-color:var(--accent-line);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:9px;font-weight:500}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 0;min-height:16px}

.block-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:16px 0 8px}
@media(min-width:560px){.block-grid{grid-template-columns:1fr 1fr}}
.bcard{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:5px;
  box-shadow:0 1px 2px rgba(20,20,40,.04);transition:border-color .12s,transform .1s,box-shadow .12s}
.bcard:hover{border-color:var(--accent-line)}
.bcard:active{transform:scale(.99)}
.bcard .bh{display:flex;align-items:baseline;gap:7px}
.bcard .bno{font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--accent);text-transform:uppercase}
.bcard .btl{font-size:15px;font-weight:700;color:var(--ink);line-height:1.3}
.bcard .bmeta{font-size:12.5px;color:var(--muted)}
.bcard .btopics{font-size:12px;color:#8b8b98;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcard .bhint{font-size:11.5px;color:#9a94b3;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.bcard .chev{position:absolute;right:13px;bottom:11px;color:#c8c3dd;font-size:16px;line-height:1}
.bcard.is-missing{background:#f1f1f5;border-color:#e6e6ee;cursor:not-allowed;opacity:.75}
.bcard.is-missing .bno{color:#9a9aa8}
.bcard.is-missing .btl{color:#8c8c99}
.bcard .tag-miss{align-self:flex-start;font-size:11.5px;color:#8a8a97;background:#e7e7ee;border-radius:999px;padding:2px 9px}

.foot{border-top:1px solid var(--line);margin-top:18px;padding-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.foot .btn{flex:1 1 auto;min-width:120px;min-height:38px;font-size:13px;font-weight:500;color:var(--ink-2)}
.foot-note{width:100%;font-size:11.5px;color:#9a9aa5;line-height:1.5;margin-top:2px}

/* ── 做题屏 ───────────────────────────── */
#scr-drill.is-active{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0 12px 8px;gap:6px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,246,248,.96);padding:8px 0 4px;flex:0 0 auto}
.tb-row{display:flex;align-items:center;gap:9px}
.quit{flex:0 0 auto;min-height:34px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink-2);
  background:#fff;border:1.5px solid var(--line);border-radius:9px;cursor:pointer}
.quit:active{transform:scale(.97)}
.pg{flex:1 1 auto;height:8px;border-radius:999px;background:#e3e3ec;overflow:hidden}
.pg i{display:block;height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#9d84e6,var(--accent));transition:width .25s ease}
.tb-time{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.tb-time b{color:var(--ink-2);font-weight:600}
.tb-row2{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--muted);min-width:0}
.tb-prog{flex:0 0 auto;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tb-rate{flex:0 0 auto;font-variant-numeric:tabular-nums}
.tb-rate b{color:var(--ok);font-weight:700}
.topic-chip{margin-left:auto;flex:0 1 auto;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.qwrap{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;
  -webkit-overflow-scrolling:touch;padding-bottom:2px}
.qcard{background:var(--card);border-radius:var(--radius);padding:14px 14px 13px;margin:2px 0 auto;
  box-shadow:0 1px 2px rgba(20,20,40,.05),0 10px 26px -22px rgba(20,20,40,.5);
  display:flex;flex-direction:column;gap:10px}
.qstem{font-family:var(--serif);font-size:clamp(18px,4.8vw,24px);line-height:1.52;letter-spacing:.1px;color:var(--ink)}
.blank{display:inline-block;width:3.2em;height:1.12em;vertical-align:-.14em;margin:0 .14em;
  border-bottom:2px solid var(--accent);background:rgba(124,92,214,.11);border-radius:2px 2px 0 0}
/* 答完题后的整句译文：出现在英文题干下方 */
.qcn{display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.6;color:#4d4a63;
  background:#faf9ff;border-left:3px solid var(--accent-line);border-radius:6px;padding:6px 9px;
  animation:cnIn .18s ease}
.qcn .qcn-tag,.rv-cn .qcn-tag{flex:0 0 auto;margin-top:1px;font-size:10.5px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:1px 5px;line-height:1.5}
.qcn .qcn-txt,.rv-cn .qcn-txt{flex:1 1 auto;min-width:0}
@keyframes cnIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
/* 悬停词义：题干里有释义的词/短语包一层 .zw，悬停或点按显示 #zh-tip */
.qstem .zw,.rv-stem .zw{cursor:help;border-radius:3px;transition:background .1s,color .1s,box-shadow .1s}
.qstem .zw:hover,.qstem .zw.is-hot,.rv-stem .zw:hover,.rv-stem .zw.is-hot{
  background:var(--accent-soft);color:#5b3fb0;box-shadow:0 0 0 1px #e3dafb}
#zh-tip{position:fixed;left:0;top:0;z-index:85;max-width:min(72vw,320px);transform:translateX(-50%);
  display:none;flex-direction:column;gap:1px;padding:7px 11px;border-radius:9px;text-align:center;
  background:rgba(30,28,40,.96);color:#fff;pointer-events:none;
  box-shadow:0 12px 28px -12px rgba(20,20,40,.75)}
#zh-tip.show{display:flex}
#zh-tip .zt-zh{font-size:14px;line-height:1.4;font-weight:600}
#zh-tip .zt-en{font-size:11px;line-height:1.3;color:rgba(255,255,255,.62);font-family:var(--serif)}
#zh-tip::after{content:"";position:absolute;left:var(--arrow,50%);bottom:-4px;width:9px;height:9px;margin-left:-4.5px;
  background:rgba(30,28,40,.96);transform:rotate(45deg);border-radius:2px}
#zh-tip.below::after{bottom:auto;top:-4px}
/* 单题历史（做对/做错/看答案的累计次数）：存在 stat 里，刷新后仍在 */
.qhist{display:none;font-size:11.5px;line-height:1.4;color:#8a8a97;text-align:right;
  font-variant-numeric:tabular-nums;margin:0 0 -4px}
.qhist.show{display:block}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:7px 12px;border-radius:12px;
  border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:left;
  font-family:var(--serif);font-size:clamp(16px,4.2vw,18px);line-height:1.3;color:var(--ink);
  transition:background .12s,border-color .12s,transform .08s}
.opt:active{transform:scale(.994)}
.opt .badge{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #cfcfdc;color:#6b6b78;font-family:var(--sans);font-size:12.5px;font-weight:700}
.opt .txt{flex:1 1 auto;min-width:0}
.opt .mark{flex:0 0 auto;width:16px;text-align:center;font-family:var(--sans);font-size:15px;font-weight:700}
.opt.is-ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.is-ok .badge{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.is-ok .mark{color:var(--ok)}
.opt.is-bad{background:var(--bad-soft);border-color:var(--bad)}
.opt.is-bad .badge{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-bad .mark{color:var(--bad)}
.opt.is-right{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.is-right .badge{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
/* 判分反馈：对/错都显示「考点」，错的再展开「易错点」 */
.fb{display:none;flex-direction:column;gap:6px;border-radius:10px;padding:9px 11px;border-left:3px solid transparent}
.fb.show{display:flex}
.fb-ok{background:var(--ok-soft);border-left-color:var(--ok)}
.fb-bad{background:#fff8f7;border-left-color:var(--bad)}
.fb-head{margin:0;font-size:13.5px;font-weight:800;line-height:1.4}
.fb-ok .fb-head{color:var(--ok)}
.fb-bad .fb-head{color:var(--bad)}
.fb-line{margin:0;font-size:12.8px;line-height:1.5;color:#3f3f4a}
.fb-line b{font-weight:700;color:#2d2d38}
.fb-bad .fb-line b{color:#7c2f26}
.fb-src{margin:0;font-size:11.5px;line-height:1.45;color:#9a9aa5}
.fb .ack{margin-top:2px}
.ack{min-height:46px;font-size:15px;font-weight:700;background:var(--accent);border-color:var(--accent);color:#fff}
.ack:active{background:#6b4cc4}
.quitline{flex:0 0 auto;font-size:11px;color:#a0a0ad;text-align:center;padding-top:2px}
/* 顶栏「自动跳题」开关：极小，不抢地方 */
.auto{flex:0 0 auto;min-height:30px;padding:3px 8px;font-size:11.5px;line-height:1;border-radius:8px;
  border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
.auto.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:700}
/* 「看答案」逃生阀：次要样式，别抢「下一题」的注意力 */
.peeklink{align-self:center;margin-top:1px;min-height:34px;padding:5px 16px;border-radius:999px;
  border:1.5px dashed #d6d6e2;background:#fbfbfd;color:#7b7b8a;font-size:12.5px;font-weight:600;
  cursor:pointer;line-height:1.2}
.peeklink:active{transform:scale(.97)}
/* 「只判考点」第一屏：4 个考点按钮（故意和 A/B/C/D 选项长得不一样，避免当成选项） */
.spot-lead{margin:0;font-size:12.5px;color:var(--muted);text-align:center}
.spot-panel{display:flex;flex-direction:column;gap:8px}
.spot-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;border-radius:12px;
  border:1.5px dashed var(--accent-line);background:#fbfaff;cursor:pointer;text-align:left;
  font-size:14px;font-weight:600;line-height:1.35;color:var(--ink-2);
  transition:background .12s,border-color .12s,transform .08s}
.spot-opt:active{transform:scale(.994)}
.spot-opt .badge{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #cfcfdc;background:#fff;color:#6b6b78;font-size:12px;font-weight:700}
.spot-opt .txt{flex:1 1 auto;min-width:0}
.spot-opt .mark{flex:0 0 auto;width:16px;text-align:center;font-size:15px;font-weight:700}
.spot-opt.is-ok{background:var(--ok-soft);border-style:solid;border-color:var(--ok);color:var(--ok)}
.spot-opt.is-ok .badge{background:var(--ok);border-color:var(--ok);color:#fff}
.spot-opt.is-ok .mark{color:var(--ok)}
.spot-opt.is-bad{background:var(--bad-soft);border-style:solid;border-color:var(--bad);color:var(--bad)}
.spot-opt.is-bad .badge{background:var(--bad);border-color:var(--bad);color:#fff}
.spot-opt.is-bad .mark{color:var(--bad)}
.spot-opt.is-right{border-style:solid;border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok);color:var(--ok)}
.spot-opt.is-right .badge{border-color:var(--ok);color:var(--ok)}
.spot-opt[disabled]{cursor:default}
/* 解析里的「怎么认出」：一句话说清「先看哪里 → 怎么判断」 */
.fb-cue{background:#f6f3ff;border-radius:8px;padding:6px 9px;margin:6px 0}
.fb-cue b{color:#5b4bb5}
.rv-cue{background:#f6f3ff;border-radius:8px;padding:6px 9px}
.rv-cue b{color:#5b4bb5}
.fb-peek{background:#fff8ec;border-left-color:#d99a2b}
.fb-peek .fb-head{color:#9a6a12}
.fb-peek .fb-line b{color:#7a5a14}
.fb-note{margin:0;font-size:11.5px;line-height:1.45;color:#9a6a12}
/* 换题条：上一题 / 答题卡 / 下一题（在题卡下方，不占题卡空间） */
.qnav{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:2px 0 0}
.navbtn{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px;padding:4px 8px;
  border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);
  font-size:12.5px;font-weight:600;line-height:1.2;cursor:pointer;white-space:nowrap}
.navbtn:active{transform:scale(.98)}
.navbtn.sheet{flex:1.6 1 0;color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.navbtn b{font-variant-numeric:tabular-nums;font-weight:700}
/* 答题卡弹窗：题号网格，状态一眼可见 */
.sheet-sub{margin:0 0 10px;font-size:12px;color:var(--muted);line-height:1.5}
.sheet-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 10px;font-size:11.5px;color:var(--muted)}
.sheet-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;
  vertical-align:-1px;border:1px solid transparent}
.sheet-legend .l-ok{background:var(--ok-soft);border-color:#b9e2c9}
.sheet-legend .l-bad{background:var(--bad-soft);border-color:#f2c4be}
.sheet-legend .l-peek{background:#fff8ec;border-color:#e8c98a}
.sheet-legend .l-cur{background:#fff;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
.sheet-cell{min-height:40px;padding:4px 2px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
  color:var(--ink-2);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.sheet-cell:active{transform:scale(.95)}
.sheet-cell.is-ok{background:var(--ok-soft);border-color:#b9e2c9;color:var(--ok)}
.sheet-cell.is-bad{background:var(--bad-soft);border-color:#f2c4be;color:var(--bad)}
.sheet-cell.is-peek{background:#fff8ec;border-color:#e8c98a;color:#8a6410}
.sheet-cell.is-cur{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
@media(max-width:380px){.navbtn{font-size:12px;padding:4px 3px}.navbtn.sheet{flex:1.9 1 0}}

/* ── 结算屏 ───────────────────────────── */
.rt-hero{text-align:center;padding:26px 0 6px}
.rt-pct{font-size:clamp(48px,15vw,72px);font-weight:800;line-height:1;letter-spacing:-1px;color:var(--accent);
  font-variant-numeric:tabular-nums}
.rt-pct.is-weak{color:var(--bad)}
.rt-sub{margin-top:10px;font-size:14px;color:var(--ink-2)}
.rt-sub b{font-variant-numeric:tabular-nums}
.rt-note{margin:16px 0 4px;padding:11px 13px;border-radius:11px;background:var(--accent-soft);
  color:#4b3a86;font-size:13.5px;line-height:1.6;border:1px solid var(--accent-line)}
.rt-note.warn{background:#fdf0ee;border-color:#f3cfc9;color:#8d2f24}
.rt-peek{display:none;margin:9px 0 0;font-size:12.5px;line-height:1.5;color:#9a6a12;text-align:center}
.rt-peek.show{display:block}
/* 结算屏「考点识别」一行：只判考点模式才有 */
.rt-spot{display:none;margin:10px 0 0;padding:9px 12px;border-radius:10px;background:#faf9ff;
  border:1px solid var(--accent-line);font-size:12.8px;line-height:1.6;color:#4b3a86;text-align:center;
  font-variant-numeric:tabular-nums}
.rt-spot.show{display:block}
.rt-spot b{font-weight:800;color:var(--accent)}
.rt-spot .rt-spot-wt{display:block;margin-top:3px;font-size:11.8px;color:#8d2f24}
.rt-chips{display:none;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.rt-chips.show{display:flex}
.rt-chips .ct{flex:0 0 100%;font-size:11.5px;color:var(--muted);margin-bottom:1px}
.chip{min-height:30px;padding:4px 11px;border-radius:999px;border:1px solid #e8c98a;background:#fff8ec;
  color:#8a6410;font-size:12px;font-weight:600;line-height:1.25;cursor:pointer;text-align:left}
.chip:active{transform:scale(.97)}
.rt-h2{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin:20px 0 8px}
table.rt-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,20,40,.05);font-size:13px}
table.rt-table th,table.rt-table td{padding:8px 9px;text-align:left;border-bottom:1px solid #f0f0f5;vertical-align:middle}
table.rt-table th{font-size:11.5px;color:var(--muted);font-weight:600;background:#fafafc;white-space:nowrap}
table.rt-table th.num{text-align:right}
table.rt-table td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.rt-table tr:last-child td{border-bottom:0}
table.rt-table tr.weak td{color:var(--bad);background:#fff9f8}
table.rt-table tr.weak td.tp{font-weight:600}
table.rt-table .rate{font-weight:700}
.rt-actions{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.rt-back{margin-top:10px;display:flex;gap:9px}
.rt-back .btn{flex:1 1 0;min-width:0}
@media(min-width:620px){
  .rt-actions{flex-direction:row;flex-wrap:wrap}
  .rt-actions .btn{flex:1 1 0}
}

/* 开始屏「考前看」文档入口 */
.docsrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:16px 0 0;padding:10px 12px;
  background:#fff;border:1.5px solid var(--line);border-radius:12px}
.docsrow .t{font-size:12px;color:var(--muted);margin-right:auto;white-space:nowrap}
.doclink{flex:0 0 auto;min-height:32px;padding:4px 10px;font-size:12.5px;font-weight:600;border-radius:8px;
  border:1.5px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.doclink:active{transform:scale(.97)}

/* ── 文档阅读层 ───────────────────────── */
#scr-doc{padding-bottom:40px}
.docbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  background:rgba(246,246,248,.97);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.docbar h2{flex:1 1 auto;margin:0;font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docbody{background:#fff;border-radius:14px;padding:16px 14px;margin:12px 0 0;font-size:14px;line-height:1.72;
  color:var(--ink-2);box-shadow:0 1px 2px rgba(20,20,40,.05);overflow-wrap:break-word}
.docbody h1{font-size:20px;line-height:1.35;margin:4px 0 10px;color:var(--ink)}
.docbody h2{font-size:17px;line-height:1.4;margin:20px 0 8px;color:var(--ink);padding-bottom:5px;border-bottom:1px solid #f0f0f5}
.docbody h3{font-size:15px;line-height:1.4;margin:16px 0 6px;color:var(--ink)}
.docbody h4{font-size:14px;line-height:1.4;margin:14px 0 6px;color:var(--ink)}
.docbody p{margin:8px 0}
.docbody ul,.docbody ol{margin:8px 0;padding-left:22px}
.docbody li{margin:4px 0}
.docbody strong{color:var(--ink);font-weight:700}
.docbody code{background:#f3f2f8;border-radius:4px;padding:1px 5px;font-size:12.5px;color:#5b4a9a;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.docbody pre{background:#f7f7fa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  overflow-x:auto;margin:10px 0}
.docbody pre code{background:none;padding:0;color:var(--ink-2);font-size:12.5px;white-space:pre}
.docbody blockquote{margin:10px 0;padding:8px 12px;background:#faf9ff;border-left:3px solid var(--accent-line);
  border-radius:0 8px 8px 0;color:#5a5570}
.docbody blockquote p{margin:4px 0}
.docbody hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.docbody a{color:var(--accent)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
.docbody table{width:100%;border-collapse:collapse;font-size:13px}
.docbody th,.docbody td{border:1px solid #e6e6ee;padding:6px 8px;vertical-align:top;text-align:left}
.docbody th{background:#fafafc;font-weight:700;white-space:nowrap}

/* ── 打印：只印当前打开的文档（速查表 Ctrl+P 就是一页 A4） ── */
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff}
  #toast,#zh-tip,#modal,.docbar,.topbar,.qnav,.quitline,.foot,.docsrow,.rt-actions,.rt-back,.hero{display:none!important}
  .screen{display:none!important}
  .screen.is-active{display:block!important}
  #scr-doc .docbody{max-width:none;margin:0;padding:0;border-radius:0;font-size:10.4px;line-height:1.3}
  #scr-doc .docbody h1{font-size:15px;margin:0 0 2px}
  #scr-doc .docbody h2{font-size:10.8px;margin:6px 0 2px;padding-bottom:1.5px}
  #scr-doc .docbody h3{font-size:10.4px;margin:5px 0 2px}
  #scr-doc .docbody p{margin:3px 0}
  #scr-doc .docbody table{font-size:9.8px}
  #scr-doc .docbody th,#scr-doc .docbody td{padding:1.2px 4px}
  #scr-doc .docbody th{white-space:normal}
  #scr-doc .docbody code{background:none;padding:0}
  .tablewrap{overflow:visible!important;margin:0}
  tr{break-inside:avoid;page-break-inside:avoid}
  h2{break-after:avoid;page-break-after:avoid}
}

/* ── 弹窗 / toast ─────────────────────── */
.modal{position:fixed;inset:0;background:rgba(24,22,34,.42);display:none;align-items:center;justify-content:center;
  padding:20px;z-index:60}
.modal.is-open{display:flex}
.modal-card{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:86vh;overflow:auto;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.5)}
.modal-card h3{margin:0 0 8px;font-size:17px}
.modal-card p{margin:0 0 6px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.modal-card .modal-hint{font-size:12.5px;color:var(--muted)}
.modal-actions{display:flex;gap:9px;margin-top:14px}
.modal-actions .btn{flex:1 1 0}
/* 回看某道题（结算页 chips 点开） */
.rv-stem{font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--ink);margin:0 0 8px}
.rv-cn{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.6;color:#4d4a63;
  background:#faf9ff;border-left:3px solid var(--accent-line);border-radius:6px;padding:6px 9px;margin:0 0 8px}
.rv-opts{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.rv-opt{display:flex;align-items:center;gap:8px;min-height:34px;padding:5px 10px;border-radius:9px;
  border:1.5px solid var(--line);background:#fff;font-family:var(--serif);font-size:14px;line-height:1.35}
.rv-opt .badge{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #cfcfdc;color:#6b6b78;font-family:var(--sans);font-size:11.5px;font-weight:700}
.rv-opt.is-right{background:var(--ok-soft);border-color:var(--ok);font-weight:600}
.rv-opt.is-right .badge{background:var(--ok);border-color:var(--ok);color:#fff}
.rv-line{margin:0 0 5px;font-size:12.8px;line-height:1.55;color:#3f3f4a}
.rv-line b{color:#2d2d38}
.rv-src{margin:0;font-size:11.5px;color:#9a9aa5}
.rv-hist{margin:6px 0 0;font-size:11.5px;color:#7b7b8a;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:rgba(30,28,40,.94);color:#fff;
  font-size:13px;line-height:1.45;padding:9px 15px;border-radius:10px;max-width:86vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:80}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- 开始屏 -->
<section class="screen" id="scr-home">
  <header class="hero">
    <h1>语法闪练 · 九上 U1–U4</h1>
    <p class="sub">点一下就知道对不对，<span class="accent">错的今晚必须做对</span></p>
    <p class="home-stat" id="home-stat"></p>
  </header>
  <div id="home-banner"></div>
  <div class="actions">
    <button class="btn primary" data-act="plan" id="act-plan">开始今晚方案</button>
    <button class="btn ghost" data-act="wrong-queue" id="act-wrong">只刷我错过的题</button>
    <button class="btn ghost" data-act="spot" id="act-spot">只判考点（10 题）</button>
    <p class="hint" id="wrong-hint"></p>
  </div>
  <div class="block-grid" id="block-grid"></div>
  <div class="docsrow">
    <span class="t">明早考前看</span>
    <button class="doclink" data-act="doc" data-doc="card">考前口诀卡</button>
    <button class="doclink" data-act="doc" data-doc="pair">最小对立对卡</button>
    <button class="doclink" data-act="doc" data-doc="quick">考点识别速查表</button>
    <button class="doclink" data-act="doc" data-doc="plan">今晚复习方案</button>
    <button class="doclink" data-act="doc" data-doc="guide">使用说明</button>
  </div>
  <footer class="foot">
    <button class="btn" data-act="export">导出记录（JSON）</button>
    <button class="btn" data-act="import">导入记录（JSON）</button>
    <button class="btn" data-act="clear">清空记录</button>
    <p class="foot-note">记录存在本机浏览器；换设备或清理缓存前记得导出。</p>
  </footer>
</section>

<!-- 做题屏 -->
<section class="screen" id="scr-drill">
  <div class="topbar">
    <div class="tb-row">
      <button class="quit" data-act="quit">退出</button>
      <div class="pg"><i id="pg-fill"></i></div>
      <button class="auto" id="act-auto" data-act="auto" title="答对后是否 1 秒自动跳下一题">自动:关</button>
      <span class="tb-time">用时 <b id="bar-time">00:00</b></span>
    </div>
    <div class="tb-row2">
      <span class="tb-prog" id="bar-progress">0/0</span>
      <span class="tb-rate" id="bar-rate">正确率 —</span>
      <span class="topic-chip" id="bar-topic">—</span>
    </div>
  </div>
  <div class="qwrap"><div class="qcard" id="qcard"></div></div>
  <div class="qnav" id="qnav">
    <button type="button" class="navbtn" data-act="prev" id="nav-prev" title="上一题（←）">‹ 上一题</button>
    <button type="button" class="navbtn sheet" data-act="sheet" id="nav-sheet" title="打开答题卡，点题号切换">答题卡 <b id="nav-count">0/0</b></button>
    <button type="button" class="navbtn" data-act="next" id="nav-next" title="下一题（→）；还没作答时就是跳过">下一题 ›</button>
  </div>
  <p class="quitline" id="drill-line">← → 换题 · 1–4 / A–D 选答案 · Enter 下一题 · Esc 退出</p>
</section>

<!-- 结算屏 -->
<section class="screen" id="scr-result">
  <div class="rt-hero">
    <div class="rt-pct" id="rt-pct">0%</div>
    <div class="rt-sub" id="rt-sub"></div>
  </div>
  <div class="rt-note" id="rt-note"></div>
  <p class="rt-peek" id="rt-peek"></p>
  <p class="rt-spot" id="rt-spot"></p>
  <h2 class="rt-h2">考点表现（低于 60% 的排在最前面）</h2>
  <table class="rt-table">
    <thead><tr><th>考点</th><th class="num">题数</th><th class="num">正确</th><th class="num">正确率</th></tr></thead>
    <tbody id="rt-body"></tbody>
  </table>
  <div class="rt-chips" id="rt-chips"></div>
  <div class="rt-actions">
    <button class="btn primary" data-act="redo-wrong" id="act-redo">重练错题（0）</button>
    <button class="btn" data-act="again" id="act-again">再来一轮</button>
    <button class="btn ghost" data-act="copy">复制今晚小结</button>
  </div>
  <div class="rt-back">
    <button class="btn sm" data-act="doc" data-doc="card">考前口诀卡</button>
    <button class="btn sm" data-act="doc" data-doc="pair">最小对立对卡</button>
    <button class="btn sm" data-act="doc" data-doc="quick">考点识别速查表</button>
    <button class="btn sm" data-act="home">回到开始屏</button>
  </div>
</section>

<!-- 文档阅读层（考前口诀卡 / 今晚复习方案 / 使用说明） -->
<section class="screen" id="scr-doc">
  <div class="docbar">
    <button class="quit" data-act="doc-back">← 返回</button>
    <h2 id="doc-title">文档</h2>
  </div>

</section>

<div class="modal" id="modal"><div class="modal-card" id="modal-card"></div></div>

window.FLASH_DOCS = {"card":{"title":"考前口诀卡","html":"<h1>动词三件套 · 考前口诀卡</h1>\n<p><strong>2026-11-06 考前 15 分钟，只读这一页</strong>（B2 的 30 题 + B1 动词题里只留 20 行，全是「明天会考 + 你真会错」的）</p>\n<table><thead><tr><th>信号词</th><th>规则</th><th>口诀（照做）</th></tr></thead><tbody><tr><td>括号给词 <code>(apply)(need)(check)</code></td><td>先定这空是谓语还是非谓语：谓语看时态/三单/被动，非谓语看搭配</td><td>先定成分再变形：谓语看时态和三单，非谓语看搭配</td></tr><tr><td>空前后有 <code>by / without</code>、<code>be used to</code>、<code>addicted to</code></td><td>介词后只能接动名词</td><td>介词后一律 doing；to 当介词时也一样</td></tr><tr><td><code>enjoy / finish / mind / practise / keep</code> 后</td><td>只接 doing，不接 to do</td><td>这五个词后只放 doing</td></tr><tr><td><code>make sb do</code> 改成被动</td><td>to 必须还原：be made to do</td><td>主动不写 to，被动把 to 补回来</td></tr><tr><td>物作主语 + <code>need</code></td><td>need doing = need to be done</td><td>东西要修：need doing，不写 to do</td></tr><tr><td><code>remember / forget / stop / regret</code> 后</td><td>doing 指已做过，to do 指还没做</td><td>做过用 doing，还没做用 to do；找时间线索</td></tr><tr><td><code>ask / tell / want sb ___</code>；<code>too…to</code>；<code>enough to</code></td><td>这几处都接 to do，to 后是原形</td><td>求人做事、too…to、enough to 只放原形</td></tr><tr><td><code>is/are + ___</code>（every day）；<code>was/were + ___</code>（yesterday）</td><td>被动 = be + 过去分词，be 跟时态变</td><td>先问「谁被」：be 变时态，过去分词照抄</td></tr><tr><td><code>will + ___</code>（next year）；<code>have + ___</code>（so far）</td><td>将来 will be done；完成 have been done</td><td>will 后加 be，have 后加 been；少一个就成主动</td></tr><tr><td><code>if</code> 从句 + 主句有 <code>will</code></td><td>从句用一般现在时表将来</td><td>if 从句用现在时，will 只准放主句</td></tr><tr><td><code>for</code> / <code>since</code></td><td>since 接时间点，for 接时间段</td><td>since 跟点，for 跟段；2015 只配 since</td></tr><tr><td><code>have been to</code> / <code>have gone to</code></td><td>been 去过已回，gone 去了未回</td><td>twice、ever 只配 been；人不在现场用 gone</td></tr><tr><td><code>borrow / buy / die / leave</code> + <code>for/since</code></td><td>短暂动词换成延续动词 keep / have / be</td><td>「借了两周」写 has kept for，不写 has borrowed for</td></tr><tr><td>单数主语 + <code>every day / usually</code></td><td>一般现在时第三人称单数加 -s/-es</td><td>主语单数，动词加 s（collects 不是 collect）</td></tr><tr><td><code>said / told / announced</code> + 后面从句</td><td>从句退一步（will→would）；真理不退</td><td>主句过去，从句退一步；真理不退</td></tr><tr><td><code>while</code> + 两个动作同时</td><td>while 从句用 was/were doing</td><td>while 后 was doing，主句接 did</td></tr><tr><td><code>be made of</code> / <code>be made from</code></td><td>看得出原材料用 of，看不出用 from</td><td>看得出 of，看不出 from；纸、酒用 from</td></tr><tr><td><code>—Must I …?</code></td><td>否定答语用 needn't，mustn't 是禁止</td><td>must 问，needn't 答；mustn't 是「不许」</td></tr><tr><td><code>neither … nor</code> 连接主语</td><td>谓语跟 nor 后最近的主语一致</td><td>nor 后面跟谁，动词就跟谁</td></tr><tr><td><code>The number of</code> / <code>A number of</code></td><td>中心词是 number 用单数；A number of 用复数</td><td>The number 单数，A number 复数</td></tr></tbody></table>\n<p><strong>读不完就只看前三行。</strong></p>"},"pair":{"title":"最小对立对卡","html":"<h1>最小对立对卡</h1>\n<p><strong>怎么用</strong></p>\n<ol><li>遮住右列答案，只读左列句子，说出这张卡的口令（这两句怎么分）。</li><li>揭开答案列对一遍：两句答案的“形”不一样，说不出差别就是没分对。</li><li>错的卡明天先练它，对的卡隔三天再回头；一次只练一张。</li></ol>\n<p>来源：句子全部取自本工具 134 题题库，只把 <code>______</code> 换成正确选项，其余一个词都没改。</p>\n<hr>\n<h2>一、时态与语态</h2>\n<h3>01 一般过去时 ↔ 现在完成时</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>Yesterday our class ______ the science museum to learn about ancient inventions.</td><td>visited</td></tr><tr><td>Jenny ______ the Science Museum twice so far this year, and she says the robot show is fantastic.</td><td>has been to</td></tr></tbody></table>\n<p><strong>口令</strong>：先看有没有 yesterday：只说过去某一次，别用 have done</p>\n<h3>02 现在完成时 ↔ 过去进行时</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>Jenny ______ the library book since last Monday, so she must return it tomorrow.</td><td>has kept</td></tr><tr><td>While I ______ the science report last night, the lights suddenly went out.</td><td>was writing</td></tr></tbody></table>\n<p><strong>口令</strong>：看 since 还是 while：since 管到现在，while 只管那一刻</p>\n<h3>03 一般现在时 ↔ 被动语态（现在）</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>Our volunteer group ______ old clothes to families in need every winter.</td><td>collects</td></tr><tr><td>The lunar eclipse ______ by millions of people in Guangzhou every year.</td><td>is watched</td></tr></tbody></table>\n<p><strong>口令</strong>：先问主语能不能自己做；句尾有 by 就是被动</p>\n<h3>04 一般将来时 ↔ 被动语态（将来）</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>Look at the sky! It ______ rain soon, so let's move the plants inside.</td><td>is going to</td></tr><tr><td>A new science museum ______ in our district next year, and students can visit it free.</td><td>will be built</td></tr></tbody></table>\n<p><strong>口令</strong>：博物馆不会自己建：主语被建就写 will be done</p>\n<h3>05 被动语态（过去）↔ 被动语态（完成）</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>The first thermometer ______ by a scientist more than 400 years ago, and it changed medicine.</td><td>was invented</td></tr><tr><td>Up to now, three new bridges ______ across the river to connect the two villages.</td><td>have been built</td></tr></tbody></table>\n<p><strong>口令</strong>：数到现在的用 have been done，只到过去用 was done</p>\n<hr>\n<h2>二、非谓语</h2>\n<h3>06 动名词 ↔ 不定式（动词搭配）</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>The boy practises ______ the piano for an hour after school, even on busy days.</td><td>playing</td></tr><tr><td>The teacher asked the students ______ their phones away during the lecture about Internet addiction.</td><td>to put</td></tr></tbody></table>\n<p><strong>口令</strong>：先认空前的动词：practise 接 doing，ask sb 接 to do</p>\n<h3>07 remember doing ↔ forget to do</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>I clearly remember ______ the door, but now it is open, so I must go back and check.</td><td>locking</td></tr><tr><td>Don't forget ______ the windows before the storm comes, or the rain will get in.</td><td>to close</td></tr></tbody></table>\n<p><strong>口令</strong>：先问事情做了没：做过了接 doing，没做接 to do</p>\n<h3>08 make sb do ↔ be made to do</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>Optimism makes both you and other people ______ pleased.</td><td>feel</td></tr><tr><td>In Wang Zhenyi's time, most girls were made ______ at home instead of going to school.</td><td>to stay</td></tr></tbody></table>\n<p><strong>口令</strong>：主动 make 后不带 to，改成被动再把 to 补回来</p>\n<h3>09 介词 + doing ↔ 表目的 to do</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>By ______ the lunar eclipse herself, Wang Zhenyi proved that it was not a sign from heaven.</td><td>watching</td></tr><tr><td>Wang Zhenyi built a simple model of the lunar eclipse ______ the movement of the moon more clearly.</td><td>to explain</td></tr></tbody></table>\n<p><strong>口令</strong>：空前面是介词就填 doing；表“为了”就填 to do</p>\n<h3>10 be used to doing ↔ 不定式 to do</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>Grandma is used to ______ up early, though life in the city is quite different.</td><td>getting</td></tr><tr><td>When you step into a new environment, you must have a strong wish ______ in.</td><td>to fit</td></tr></tbody></table>\n<p><strong>口令</strong>：先看 to 是介词还是不定式：be used to 后接 doing，wish 后接 to do</p>\n<hr>\n<h2>三、从句</h2>\n<h3>11 if 从句 ↔ 主句（主将从现）</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>In her opinion, if you don't talk to someone about your problems, you ______ worse.</td><td>will feel</td></tr><tr><td>If the rain ______ tomorrow, we will visit the science museum with our foreign friends.</td><td>stops</td></tr></tbody></table>\n<p><strong>口令</strong>：看空在主句还是 if 从句：从句用现在，主句才用 will</p>\n<h3>12 宾语从句语序 ↔ 特殊疑问句</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>Could you tell me ______ the science museum tomorrow?</td><td>when we will visit</td></tr><tr><td>—______ will the new library be open to students? —In about two weeks, I think.</td><td>How soon</td></tr></tbody></table>\n<p><strong>口令</strong>：看是不是问句：问句把助动词提前，从句不提前</p>\n<h3>13 定语从句 ↔ 名词性从句</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>A few years ago, the young man ______ travelled on the same road decided to visit the family.</td><td>who</td></tr><tr><td>______ the ancient people believed about the eclipse turned out to be wrong.</td><td>What</td></tr></tbody></table>\n<p><strong>口令</strong>：空后句子完整就用 who/which，缺宾语才用 what</p>\n<h3>14 让步状语从句 ↔ 原因连词</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>______ her life was short, Wang Zhenyi still wrote many important books about the stars.</td><td>Although</td></tr><tr><td>Wang Zhenyi kept studying the stars ______ she was very interested in them.</td><td>because</td></tr></tbody></table>\n<p><strong>口令</strong>：前后意思相反填 although，后句讲原因填 because</p>\n<h3>15 宾语从句时态：客观真理 ↔ 时态呼应</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>In class, our science teacher told us that light ______ much faster than sound.</td><td>travels</td></tr><tr><td>The head teacher announced that the school ______ a science show the next Friday.</td><td>would hold</td></tr></tbody></table>\n<p><strong>口令</strong>：从句讲客观真理不退时态，讲将来就退成 would</p>\n<hr>\n<h2>四、词法</h2>\n<h3>16 冠词 an ↔ the</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>It took Archimedes less than ______ hour to solve the king's problem.</td><td>an</td></tr><tr><td>Her model was ______ first one that could show a lunar eclipse clearly.</td><td>the</td></tr></tbody></table>\n<p><strong>口令</strong>：空后元音音素开头用 an，后接序数词用 the</p>\n<h3>17 代词 her ↔ hers</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>Wang Zhenyi's father supported ______ when she wanted to study the stars.</td><td>her</td></tr><tr><td>This notebook isn't mine. It's ______, because her name is on the first page.</td><td>hers</td></tr></tbody></table>\n<p><strong>口令</strong>：空后有名词用 her，空后没名词用 hers</p>\n<h3>18 原级 as…as ↔ 比较级 than</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>The new model of the lunar eclipse is as ______ as the old one, and it is easier to carry.</td><td>beautiful</td></tr><tr><td>Developments in technology now tie us ______ than ever before.</td><td>closer</td></tr></tbody></table>\n<p><strong>口令</strong>：as … as 中间填原级，than 前面填比较级</p>\n<h3>19 形容词 ↔ 副词</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>After cleaning the whole house alone, my mother looked ______ and went to bed early.</td><td>tired</td></tr><tr><td>Nancy plays the piano very ______, and she dreams of becoming a musician.</td><td>well</td></tr></tbody></table>\n<p><strong>口令</strong>：空说的是主语状态填形容词，修饰动作填副词</p>\n<h3>20 不定代词 neither ↔ others</h3>\n<table><thead><tr><th>句子</th><th>答案</th></tr></thead><tbody><tr><td>My parents are both busy, so ______ of them can take me to the museum this weekend.</td><td>neither</td></tr><tr><td>And expecting ______ to be perfect can add to your stress level too.</td><td>others</td></tr></tbody></table>\n<p><strong>口令</strong>：两个都不 → neither；泛指别的人 → others</p>"},"quick":{"title":"考点识别速查表","html":"<h1>考点识别速查表 · 九上 U1–U4</h1><p class=\"lead\">每个考点一句「先看哪里 → 怎么判断」。做题时先用它归考点，再想规则；「题数」= 本题库里的题量，<code>0</code> 表示考纲里有、这次没出题。线索与 `data/topic-cues.json` 同源，改数据后重跑 build 即可。</p><h2>一、从句与句子类型 · Block 1</h2><table class=\"q\"><thead><tr><th>考点</th><th>题数</th><th>怎么认出</th></tr></thead><tbody><tr><td class=\"tp\">adj + that 从句</td><td class=\"n\">5</td><td>空前是 sure/glad 这类表确信或情感的形容词，空后成分齐全 → that</td></tr><tr><td class=\"tp\">it 作形式主语</td><td class=\"n\">3</td><td>句首 It 只是占位，真正内容在后面；空后是 sb + to do 时选 of/for，是 that 从句时用 that</td></tr><tr><td class=\"tp\">宾语从句</td><td class=\"n\">4</td><td>动词或介词后接一个句子：不缺成分用 that，表「是否」用 if/whether，缺成分用 what</td></tr><tr><td class=\"tp\">宾语从句语序</td><td class=\"n\">3</td><td>四个选项是同一疑问词的不同摆法 → 从句一律陈述语序，别把助动词提前</td></tr><tr><td class=\"tp\">宾语从句时态</td><td class=\"n\">3</td><td>主句是过去时，从句动词要退一步；但讲客观真理不退</td></tr><tr><td class=\"tp\">状语从句</td><td class=\"n\">4</td><td>两个完整句子用一个连词连起来、空在连词位 → 先判断逻辑关系</td></tr><tr><td class=\"tp\">条件状语从句</td><td class=\"n\">5</td><td>句中有 if / unless：先看空在从句还是主句，从句用现在时、主句才用 will</td></tr><tr><td class=\"tp\">让步状语从句</td><td class=\"n\">3</td><td>前后意思相反 → although/though；有 though 就不要再加 but（空可能是不填）</td></tr><tr><td class=\"tp\">名词性从句</td><td class=\"n\">2</td><td>空在句首或 be 动词后：从句缺主语/宾语 → what；不缺成分 → that</td></tr><tr><td class=\"tp\">定语从句</td><td class=\"n\">1</td><td>空紧跟在名词后 → 引导词代替那个名词：指人用 who，指物用 which</td></tr><tr><td class=\"tp\">感叹句</td><td class=\"n\">5</td><td>句首是 What 还是 How → 看空后面有没有名词：有名词用 What，没有用 How</td></tr><tr><td class=\"tp\">特殊疑问句</td><td class=\"n\">2</td><td>看答语：In two weeks → How soon，Once a month → How often；句式是倒装</td></tr><tr><td class=\"tp\">祈使句</td><td class=\"n\">2</td><td>没有主语、动词原形开头 → 祈使句；「祈使句 + and/or + 将来句」的空选 and 或 or</td></tr><tr><td class=\"tp\">附加疑问句</td><td class=\"n\">0</td><td>句末小尾巴 → 跟着前面主句的 be / 助动词 / 情态动词走</td></tr><tr><td class=\"tp\">直接引语间接引语</td><td class=\"n\">1</td><td>said / told 后面接别人说的话 → 时态退一步、语序改成陈述</td></tr></tbody></table><h2>二、动词三件套 · Block 2</h2><table class=\"q\"><thead><tr><th>考点</th><th>题数</th><th>怎么认出</th></tr></thead><tbody><tr><td class=\"tp\">不定式</td><td class=\"n\">7</td><td>空在 ask/tell/want sb 后、too…to、或表目的 → to do；make 变被动要补 to</td></tr><tr><td class=\"tp\">动名词</td><td class=\"n\">7</td><td>空在介词后，或在 enjoy / practise / finish / mind 后 → doing</td></tr><tr><td class=\"tp\">非谓语辨析</td><td class=\"n\">4</td><td>选项是 to do / doing / done → 先看空前的动词和搭配（need doing、make sb do）</td></tr><tr><td class=\"tp\">一般现在时</td><td class=\"n\">2</td><td>every day / usually 这类习惯，或客观真理 → 动词原形或三单</td></tr><tr><td class=\"tp\">一般过去时</td><td class=\"n\">3</td><td>yesterday / last week / ago / in 2010 → 过去式</td></tr><tr><td class=\"tp\">一般将来时</td><td class=\"n\">1</td><td>next year / soon / tomorrow → will 或 be going to</td></tr><tr><td class=\"tp\">现在完成时</td><td class=\"n\">5</td><td>so far / since / yet → have/has + 过去分词；空也可能考 since/for</td></tr><tr><td class=\"tp\">过去进行时</td><td class=\"n\">1</td><td>while / at that time，说某一刻正在做 → was / were doing</td></tr><tr><td class=\"tp\">被动语态（现在）</td><td class=\"n\">3</td><td>先看主语能不能自己做：不能 → is/are + 过去分词；be made of/from 也跟着时态</td></tr><tr><td class=\"tp\">被动语态（过去）</td><td class=\"n\">3</td><td>过去时间 + 有 by / 主语被做 → was / were + 过去分词</td></tr><tr><td class=\"tp\">被动语态（将来）</td><td class=\"n\">2</td><td>next year / in the future + 主语被做 → will be + 过去分词</td></tr><tr><td class=\"tp\">被动语态（完成）</td><td class=\"n\">1</td><td>so far / up to now + 主语被做 → have been + 过去分词</td></tr><tr><td class=\"tp\">情态动词</td><td class=\"n\">4</td><td>空在 can / must / may 后 → 动词原形；Must I 问就用 needn't 答</td></tr><tr><td class=\"tp\">主谓一致</td><td class=\"n\">3</td><td>主语是 The number of / neither…nor → 先找真正的主语再定单复数</td></tr></tbody></table><h2>三、词法速记 · Block 3</h2><table class=\"q\"><thead><tr><th>考点</th><th>题数</th><th>怎么认出</th></tr></thead><tbody><tr><td class=\"tp\">系动词</td><td class=\"n\">5</td><td>look/feel/sound/seem 后面：填形容词；或 seem to be / seem to do</td></tr><tr><td class=\"tp\">形容词副词</td><td class=\"n\">2</td><td>空修饰名词 → 形容词；修饰动词或形容词 → 副词</td></tr><tr><td class=\"tp\">形容词辨析</td><td class=\"n\">1</td><td>四个都是形容词、意思不同 → 看语境搭配选</td></tr><tr><td class=\"tp\">副词辨析</td><td class=\"n\">2</td><td>四个都是副词 → 看动作的方式和程度</td></tr><tr><td class=\"tp\">比较级</td><td class=\"n\">6</td><td>句中有 than，或空前有 much / even → 比较级；两个 as 之间用原级</td></tr><tr><td class=\"tp\">最高级</td><td class=\"n\">2</td><td>有 in / of 范围，且前面常带 the → -est 或 most</td></tr><tr><td class=\"tp\">冠词</td><td class=\"n\">5</td><td>空在名词前 → 元音音素用 an、特指用 the、泛指用 a/an；固定搭配可能不填</td></tr><tr><td class=\"tp\">代词</td><td class=\"n\">5</td><td>空在动词前用主格、动词后用宾格、名词前用形容词性物主</td></tr><tr><td class=\"tp\">不定代词</td><td class=\"n\">3</td><td>两者用 neither/either，三者以上用 none/all；something 类看语境，others 指别人</td></tr><tr><td class=\"tp\">介词</td><td class=\"n\">4</td><td>空在名词 / 动名词前 → 看固定搭配（be used to / be proud of）</td></tr><tr><td class=\"tp\">介词短语</td><td class=\"n\">3</td><td>四个都是介词短语 → 看固定搭配（in charge of / in addition to）和上下文</td></tr><tr><td class=\"tp\">连词</td><td class=\"n\">4</td><td>空在两句之间 → 判因果 / 转折 / 条件；so/such … that 看空后是形容词还是名词</td></tr><tr><td class=\"tp\">并列连词</td><td class=\"n\">2</td><td>not A but B、either … or … 这类 → 看前后结构，谓语就近一致</td></tr><tr><td class=\"tp\">名词单复数</td><td class=\"n\">1</td><td>空在冠词或数量词后 → 判断可数不可数与单复数</td></tr><tr><td class=\"tp\">量词</td><td class=\"n\">0</td><td>a piece of / a number of 这类 → 看后面的名词和中心词</td></tr><tr><td class=\"tp\">词形转换</td><td class=\"n\">4</td><td>四个选项是同一词根的不同词性 → 看空位要名词、形容词还是副词</td></tr><tr><td class=\"tp\">词义辨析</td><td class=\"n\">4</td><td>四个词性相同、意思不同 → 看语境</td></tr><tr><td class=\"tp\">短语动词</td><td class=\"n\">4</td><td>动词 + 介词 / 副词 → 看固定搭配</td></tr></tbody></table><h2>四、不规则动词闪刷 · Block 4</h2><table class=\"q\"><thead><tr><th>考点</th><th>题数</th><th>怎么认出</th></tr></thead><tbody><tr><td class=\"tp\">不规则动词·过去式</td><td class=\"n\">12</td><td>括号给原形、句子在讲过去（有 yesterday / last week 或 showed 这类）→ 过去式</td></tr><tr><td class=\"tp\">不规则动词·过去分词</td><td class=\"n\">12</td><td>空前是 have/has/be，或空后跟 by → 填过去分词</td></tr></tbody></table>"},"plan":{"title":"今晚复习方案","html":"<h1>语法闪练 · 今晚突击方案（广州越秀 · 九上期中 · 2026-11-06 考前夜）</h1>\n<ul><li>状态：<strong>已实施</strong>（2026-11-05 晚）；工具 <code>英语/语法闪练.html</code>，数据 <code>英语/语法闪练/data/g*.json</code></li><li>服务对象：广州市越秀区某校初三（九上），教材沪教牛津版（广州版）<strong>2024 新教材</strong>，期中范围 U1–U4</li><li>依据：① 老师发的《复习指引》（<code>英语/题库/</code>）② 学生期中模拟得分（<code>英语/题库/期中模拟考得分.png</code>）③ 仓库已有四张 U1–U4 过关卷题库（<code>英语/练习工具/data/</code>）④ 两轮外部调研（<code>docs/plans/广州九上英语期中-调研A-卷型与语法考点.md</code>、<code>…调研B-真题与命题特点.md</code>）</li></ul>\n<hr>\n<h2>一、一页纸结论</h2>\n<p><strong>今晚只做一件事：把语法类 25 分从\"几乎全丢\"救回到\"能拿一半以上\"。</strong></p>\n<p>模拟考 45/110。语法直接相关的三块（语法选择 15 + 语法填空 5 + 语篇填词 5 = 25 分）合计只拿了 <strong>3 分</strong>，丢了 22 分；这 22 分里有一大半是\"看到信号词就该条件反射\"的形式题，<strong>是一晚上能补回来的</strong>。阅读理解 16 分、作文 9 分的缺口不是今晚能补的，<strong>今晚不要碰</strong>。</p>\n<p>目标定在：语法选择 2/10 → 6~7/10（+6~7.5 分）、语法填空 0/5 → 2~3/5（+2~3 分）、语篇填词 0/5 → 1~2/5（+1~2 分），合计<strong>今晚争取捡回 9~12 分</strong>。</p>\n<h2>二、为什么是语法（把得分表摊开算账）</h2>\n<table><thead><tr><th>题型</th><th>满分</th><th>得分</th><th>丢分</th><th>今晚能不能补</th></tr></thead><tbody><tr><td>语法选择</td><td>15</td><td>3</td><td><strong>-12</strong></td><td>✅ 主力，形式识别一晚能通</td></tr><tr><td>语法填空（校本给词变形）</td><td>5</td><td>0</td><td><strong>-5</strong></td><td>✅ 两步判断法，最容易从 0 变 2~3</td></tr><tr><td>语篇填词（首字母）</td><td>5</td><td>0</td><td><strong>-5</strong></td><td>⚠️ 一半靠拼写，今晚只能抢回\"词性+变形\"那部分</td></tr><tr><td>完形填空</td><td>10</td><td>4</td><td>-6</td><td>❌ 考词义辨析，一晚练不出来</td></tr><tr><td>阅读理解</td><td>30</td><td>14</td><td>-16</td><td>❌ 慢工</td></tr><tr><td>阅读填空（六选五）</td><td>5</td><td>0</td><td>-5</td><td>❌ 语篇衔接，性价比最低</td></tr><tr><td>匹配阅读</td><td>10</td><td>6</td><td>-4</td><td>➖ 明早提醒一句\"先圈人名需求关键词\"即可</td></tr><tr><td>回答问题</td><td>10</td><td>7</td><td>-3</td><td>➖ 不动</td></tr><tr><td>书面表达</td><td>20</td><td>11</td><td>-9</td><td>❌ 一晚升不了格，明早只看作文结构清单</td></tr></tbody></table>\n<blockquote>同一份账，越算越清楚：<strong>把 25 分语法分补回一半，比在阅读上磨一小时划算得多。</strong></blockquote>\n<h2>三、广州卷到底怎么考（这决定闪练题长什么样）</h2>\n<p>调研结论（证据与链接见调研 A/B 两份文档）：</p>\n<ol><li><strong>语法选择不是 10 个独立单句，是一篇 190~260 词的语篇挖 10 个空</strong>（新卷 10 空 × 1.5 分 = 15 分，错一空掉 1.5 分，比旧卷更贵）。考点<strong>地毯式覆盖、同类最多 2 空</strong>。</li><li><strong>四个选项是\"同维度最小对立项\"</strong>：四个时态、主动 vs 被动×时态、<code>to do / doing / done</code>、同根派生（<code>special / specially / specialty</code>）、<code>a / an / the / 零冠词</code>、<code>other</code> 系列。<strong>它不考近义词辨析</strong>（那是完形填空的事）。</li><li><strong>每个空都有可指认的信号词</strong>：<code>than</code>、<code>as…as</code>、<code>much</code>、<code>for five years</code>、<code>recently</code>、<code>yesterday</code>、<code>if</code>、<code>every day</code>、<code>so far</code>。→ 学生 3/15 的根因不是读不懂语篇，而是<strong>\"信号词 → 形式\"的条件反射没建立</strong>。</li><li><strong>语篇结构几乎固定</strong>：叙事用一般过去时、结尾议论用一般现在时/现在完成时的\"双时态\"。</li><li><strong>新教材把三个语法点各占一个单元</strong>：U1 形容词+that 从句、U2 句子类型（含感叹句）、U3 系动词 —— 和老师复习指引点名的三个点<strong>完全对上</strong>。这解释了为什么广州卷特别爱考 <code>系动词+形容词</code> 和 <code>How/What 感叹句</code>。</li><li><strong>本校的\"语法填空 5 分\"不是广州中考题型</strong>（8 份真题卷 0 份有整段语法填空），实际是校本\"5 句 + 括号给词 + 变形\"；而<strong>语篇填词（首字母）是广州独有题型</strong>，考\"词义+拼写+变形\"三件事。</li><li>2025 广州中考语法选择 15 空实际考点分布：时态 3、非谓语 1、被动 1、从句连接词 1、比较级 1、形容词副词 1、<strong>冠词/代词/介词/连词/不定代词合计 5 空（7.5 分，纯记忆分）</strong>、情态动词 1、There be 1。</li></ol>\n<p><strong>所以闪练做成\"一句一信号词、四选项同维度\"的最小对立题</strong>——把语篇题里的单个空抽出来练反射，练的是同一个东西。</p>\n<h2>四、今晚 90 分钟时间表（标准版）</h2>\n<p>工具：双击 <code>英语/语法闪练.html</code>（离线、单文件、手机也能开）。5 个 block 一共 <strong>134 题</strong>。 开始屏底部（结算屏也有）有 <strong>考前口诀卡 / 今晚复习方案 / 使用说明</strong> 三个页内入口，不用去找文件——明早要看的口诀卡就在里面。</p>\n<table><thead><tr><th>时间</th><th>做什么</th><th>题量</th><th>为什么这个顺序</th></tr></thead><tbody><tr><td>20:00–20:05</td><td>摊开得分表，只看语法选择/语法填空/语篇填词三行，说清今晚只打这三行</td><td>—</td><td>先建立\"今晚有明确目标\"的心理契约</td></tr><tr><td>20:05–20:17</td><td><strong>Block 1 从句与句子类型</strong>（点「开始今晚方案」自动进）</td><td>30</td><td>送分题开场，先把手感和信心打出来</td></tr><tr><td>20:17–20:35</td><td><strong>Block 2 动词三件套</strong>（非谓语/时态/语态）</td><td>30</td><td>最大失分区，趁状态最好啃</td></tr><tr><td>20:35–20:50</td><td><strong>Block 3 词法速记</strong>（冠词/介词/代词/连词/比较级/系动词）</td><td>30</td><td>纯记忆小分，刷完立刻见正确率上升</td></tr><tr><td>20:50–20:58</td><td><strong>Block 4 不规则动词闪刷</strong></td><td>24</td><td>每个 15 秒，节奏快，背了就得分</td></tr><tr><td>20:58–21:08</td><td><strong>Block 5 广州卷真题同款</strong>（越秀执信/铁一/育才实验等往年期中真题原句）</td><td>20</td><td>用真卷验一遍：还差哪几个点一目了然</td></tr><tr><td>21:08–21:20</td><td>结算页点「重练错题」，<strong>一直重练到全对</strong></td><td>视错题</td><td>错题重练是今晚唯一\"把不会变成会\"的环节</td></tr><tr><td>21:20–21:30</td><td>看结算页「按考点正确率」，把 <strong>&lt;60% 的考点抄到一张纸上</strong>，明早带着走</td><td>—</td><td>明早只看这张纸，不再刷题</td></tr></tbody></table>\n<p><strong>如果今晚只剩 45 分钟（极限版）</strong>：跳过 Block 1 和 Block 3，只做 <strong>Block 2 → Block 4 → Block 5 → 重练错题</strong>（65 题）。理由：动词三件套是最大失分区，不规则动词是最便宜的送分，真题同款是最接近考场的检验。</p>\n<blockquote>表里的分钟数是按\"做对也要点一下看考点\"算的（每次多点一下，整轮比纯点选多 2~3 分钟）。真赶时间就开顶栏的 <code>自动:开</code>，做对的题会自动翻页。</blockquote>\n<h2>五、怎么用工具（三条铁律，比刷题量重要）</h2>\n<ol><li><strong>先点，再看。</strong> 不许先读解析再点选项——那就不是练反射，是练\"抄答案\"。点错了系统立刻停下来给你看 <code>规则</code> + <code>易错点</code>，<strong>只看这两句，10 秒内翻页</strong>，别读第三遍。</li><li><strong>错了的题必须重练到对。</strong> 本轮结束时点「重练错题」，重练时<strong>选项顺序不变</strong>（所以不能靠\"上次选 B\"蒙）。一次做对不算会，重练还能对才算。</li><li><strong>不许查书、不许问、不许停。</strong> 拿不准也先点一个（模拟真实考场）；不确定的题在真卷上是要先跳过的，但闪练里请<strong>先点再看</strong>，让错误暴露出来。<strong>真卡住了就点选项下方的「看答案」</strong>——它会直接亮答案和讲解，代价是这题不计入正确率、但要进重练队列。宁可点「看答案」，也不要蒙一个再骗自己\"我会了\"。</li></ol>\n<p><strong>关于\"做对要不要停\"</strong>：默认<strong>停</strong>。做对之后会显示这一空的 <code>考点</code> + <code>规则</code> + <code>出处</code>，点「下一题 →」（或 <code>Enter</code>）再走——这是给孩子\"看一眼要点\"的时间，别急着划过去。只剩 45 分钟想冲量时，把顶栏的 <code>自动:关</code> 点成 <code>自动:开</code>，做对的题 1 秒自动翻页（答错仍然必须手动点）。</p>\n<h2>六、明早考前 15 分钟（只做四件事，不做新题）</h2>\n<ol><li>看昨晚抄的那张 <strong>&lt;60% 考点纸</strong>（预计 3~6 个点），每个点默念一句 <code>rule</code>。</li><li>看 <strong>Block 4 里错过的不规则动词</strong>（页面「重练错题」→ 筛 block 4 也行，直接看错题即可），5~8 个词过一遍。</li><li>默念三条最容易丢的口诀：</li></ol>\n<ul><li><code>than</code> 就升级、<code>as…as</code> 就还原；<code>much</code> 只加比较级，不能 <code>much more better</code>。</li><li>物作主语先想被动；先定时态再定单复（<code>tickets → have been sold</code>）。</li><li>介词后必 <code>doing</code>；<code>make/let/have</code> 后光杆动词，<code>be made</code> 后补 <code>to</code>。</li></ul>\n<ol><li>只在脑子里过一遍考场流程（下一节），<strong>不要动笔做新题</strong>——早上做错一道会崩心态。</li></ol>\n<h2>七、考场上的做题流程（语法选择是语篇题，这一步比多刷 20 题有用）</h2>\n<p><strong>语法选择（10 空 × 1.5 分）</strong></p>\n<ol><li><strong>先通读全文 60 秒</strong>，只判断一件事：叙事基调是过去还是现在（决定全篇时态坐标）。</li><li>逐个空：先看<strong>空的左右有什么信号词</strong>（<code>than</code>/<code>as…as</code>/<code>for+时间段</code>/<code>recently</code>/<code>if</code>/<code>every day</code>），信号词决定形式。</li><li>看到 \"物 + 动词\" 先想<strong>被动</strong>；看到 <code>make/let/have/see</code> 后想<strong>光杆动词</strong>；看到介词后想 <strong>doing</strong>。</li><li>冠词/介词/连词/代词这四类不要纠结语感，用规则：可数单数必戴帽、再次提到用 the、后面有主谓用 <code>because/although</code>、只有名词短语用 <code>because of</code>。</li><li>一空最多给 40 秒，超了就凭第一直觉选一个并做个记号，最后再看。</li></ol>\n<p><strong>语法填空（校本 5 句给词变形）</strong> —— 两步判断法：</p>\n<ul><li><strong>有括号</strong>：先定词性（缺名词/动词/形容词/副词）→ 再定时态与语态 → 最后单复数/比较级变形。</li><li><strong>无括号</strong>：只可能是 冠词 / 介词 / 连词 / 代词 / 关系词 / 引导词 / 强调句 that / 助动词。</li></ul>\n<p><strong>语篇填词（首字母，5 × 1 分）</strong> —— 必须\"三查\"：</p>\n<ol><li>查<strong>词性</strong>（这空缺名词还是动词）；</li><li>查<strong>变形</strong>（时态 / 单复数 / 比较级）；</li><li>查<strong>拼写</strong>（<code>-ough</code>、双写辅音、<code>ie/ei</code>）。<strong>拼写错 = 0 分</strong>，首字母题不给词库，没词就是 0。</li></ol>\n<h2>八、明确不做（今晚的时间守卫）</h2>\n<ul><li>❌ 阅读理解推断题、六选五语篇填空：0/5 → 最多 2 分，两小时也练不出来。</li><li>❌ 作文升格：一晚改不出内容，明早只看结构清单（三段式 + 两个高级句型）。</li><li>❌ 完形填空的词义辨析：那是长期词汇积累，今晚碰了只会打击信心。</li><li>❌ 刷整套卷：一套 100 分钟，今晚没有这个预算。</li></ul>\n<h2>九、证据强度与没核实的事（别把推断当事实）</h2>\n<table><thead><tr><th>结论</th><th>证据强度</th></tr></thead><tbody><tr><td>笔试 110 分、语法选择 10 空 15 分、语篇填词 5 分首字母</td><td><strong>高</strong>：广州 2027 新中考官方口径（市教育局方案 + 羊城晚报）＋学生本人模拟卷实测逐项吻合</td></tr><tr><td>语法选择是语篇挖空、选项为同维度最小对立</td><td><strong>高</strong>：8 份广州/越秀往年期中真卷原文逐题统计（调研 B）</td></tr><tr><td>闪练里 Block 5 的 20 道题</td><td><strong>真题原文</strong>：<code>src</code> 逐题标了年份/学校（执信、铁一、育才实验、南沙、白云、广大附中、西关外国语），可回原卷核对</td></tr><tr><td>新教材 U1–U4 = 形容词+that / 句子类型 / 系动词 / 句子成分</td><td><strong>中高</strong>：教辅单元页 + 老师复习指引的三个点完全吻合；未核教材原页</td></tr><tr><td>越秀区今年期中真题</td><td><strong>未查到公开版本</strong>（区教研室不公开期中卷）。上文\"高频\"≠ 今年真题，是往年真卷 + 中考真题统计</td></tr><tr><td>每晚能捡回 9~12 分</td><td><strong>估算</strong>，不是承诺；取决于今晚实际投入时间</td></tr></tbody></table>\n<h2>十、工具侧（给维护者）</h2>\n<table><thead><tr><th>文件</th><th>作用</th></tr></thead><tbody><tr><td><code>英语/语法闪练.html</code></td><td><strong>产物</strong>，单文件离线版，双击即用（由 build 生成，不手改，ADR-0003）</td></tr><tr><td><code>英语/语法闪练/index.html</code></td><td>源码版（从 <code>data/bundle.js</code> 读 <code>window.FLASH_DATA</code>）</td></tr><tr><td><code>英语/语法闪练/build.mjs</code></td><td>校验 + 打数据包 + 生成单文件版；<code>--strict</code> 缺文件即失败</td></tr><tr><td><code>英语/语法闪练/data/SCHEMA.md</code></td><td>数据格式、受控考点词表、质量红线</td></tr><tr><td><code>英语/语法闪练/data/VOCAB.md</code></td><td>U1–U4 词汇语境、不规则动词表</td></tr><tr><td><code>英语/语法闪练/data/g1-clause.json</code> … <code>g5-verbform.json</code></td><td>五个 block 的题库</td></tr><tr><td><code>英语/语法闪练/qa.mjs</code></td><td>无头 Chrome 交互断言</td></tr><tr><td><code>docs/plans/语法闪练-审题报告.md</code></td><td>独立审题员的逐题复核报告</td></tr></tbody></table>\n<p>验收口径：<code>node 英语/语法闪练/build.mjs --strict</code> 全绿（<strong>134 题 / 5 个 block / 43 个考点</strong>）· <code>qa.mjs</code> <strong>97 条断言 0 失败</strong>（源码版 / 单文件版 / <code>file://</code> 离线三种入口各跑一遍）· lead 另做了端到端验收（真跑 Block 4 一整轮：故意错 3 题 → 展开讲解 → 错题重练 → 结算 → 记录写入，14 项断言全过）· 数据校验覆盖\"id 唯一 / 选项 4 个不重复 / 答案在选项内 / 题干只有一个空 / rule≤60 字 / trap≤50 字 / 考点在受控词表 / level3≤15% / 答案分布不偏\"。</p>\n<p>审题：<code>docs/plans/语法闪练-审题报告.md</code>（独立审题员逐题复核 134/134，查出「必须改 4 题」已全部修掉，处置记录见该报告第七节）。</p>\n<h3>后续（不急，等考完再做）</h3>\n<ol><li>~~<code>开始.html</code> 增加「语法闪练」入口~~ <strong>已做（2026-11-05）</strong>：入口卡片「⚡ 语法闪练」+ <code>RECORD_KEYS</code> 加 <code>eng9a-flash-v1</code>（备份会带上它）+ <code>collect()</code> 加一段统计；站点发布清单 <code>tools/publish.ps1</code> 的 training 项也加了 <code>英语/语法闪练.html</code>，已随 <code>-Only training -Prune -Commit -Push</code> 上线（站点仓库 <code>4eb6cff</code>）。契约文档 §一/§二/§四 已同步。</li><li>训练台（<code>工具/dsh-plugin/records.js</code>）认识 <code>eng9a-flash-v1</code>：现在导出的快照只能当存档，<code>BACKUP_APPS</code> 白名单还没有这个键（未知键会被跳过、不报错）。</li><li>受控考点拆细：<code>冠词·不定/定冠词/零冠词</code>、<code>比较级·同级/程度修饰/特殊结构</code>，以及新增 <code>主将从现</code>、<code>be used to / used to</code>（现在分别被迫挂在 <code>条件状语从句</code>、<code>动名词</code> 下，结算页会把两种错因并成一行）。</li><li>补 1–2 题附加疑问句（本次 30 题上限已满，按广州卷频率排在 13 个考点之后）。</li><li><strong>既有问题（与本次无关）</strong>：<code>node 工具/dsh-plugin/selfcheck.mjs</code> 当前失败 1 条 —— <code>recent 应按导出时间倒序</code>（实际拿到「物理」，期望「道德与法治」）。用本次改动之前的 <code>开始.html</code> 复跑同样失败，属插件/固定样本的既有问题，<code>工具/dsh-plugin/</code> 本次未改动。</li></ol>"},"guide":{"title":"使用说明","html":"<h1>语法闪练 · 使用说明</h1>\n<p>给「九上英语期中考前一晚」用的一次性突击工具：<strong>点一下就知道对错</strong>，判完立刻给「考点 + 规则 +（答错时）易错点 + 出处」，看完点「下一题 →」再走；本轮结束时错的题自动重练到做对为止。刷新页面不会丢进度。刷完给一张「考点正确率」表，看哪几个点明早还得扫一眼。</p>\n<ul><li>配套方案：<code>docs/plans/语法闪练与今晚复习方案.md</code>（时间表、考场流程、明确不做的事）</li><li>考前口诀卡：<code>英语/语法闪练/考前口诀卡.md</code>（明早 15 分钟只看这一页）</li><li>题库出处与命题依据：<code>docs/plans/广州九上英语期中-调研A-卷型与语法考点.md</code>、<code>…调研B-真题与命题特点.md</code></li></ul>\n<h2>一、怎么打开</h2>\n<p><strong>直接双击 <code>英语/语法闪练.html</code></strong>（单文件、离线、不用服务器；手机用浏览器打开同一个文件也行）。</p>\n<p><strong>网页版</strong>（手机/平板直接开，不用传文件）：&lt;https://ataotao.github.io/1/英语/语法闪练.html&gt; —— 也可以从站点首页 &lt;https://ataotao.github.io/1/&gt; 的「⚡ 语法闪练」卡片进。发布走站点仓库 <code>tools/publish.ps1</code>（清单里必须有这个文件，见 <code>docs/plans/开始页与深链契约.md</code> §四）。</p>\n<ul><li>这个 <code>.html</code> 是<strong>产物</strong>，由 <code>node 英语/语法闪练/build.mjs</code> 从 <code>index.html</code> + <code>data/</code> 生成，<strong>不要手改</strong>（ADR-0003）。</li><li>源码版要先起服务：<code>node 英语/练习工具/serve.mjs 4312</code>，再开 <code>http://127.0.0.1:4312/英语/语法闪练/index.html</code>。</li><li>数据存在本机浏览器（<code>localStorage</code>，键 <code>eng9a-flash-v1</code>），换设备/清缓存会丢，记得导出。<strong>网页版与本地版是两份记录</strong>（不同源），互不同步。</li></ul>\n<h2>二、开始屏：两个入口</h2>\n<table><thead><tr><th>按钮</th><th>作用</th></tr></thead><tbody><tr><td><strong>开始今晚方案</strong></td><td>按 Block 1 → 2 → 3 → 4 → 5 串成一整轮（现在共 <strong>134 题</strong>，弹窗会报预计时长）。今晚就用这个</td></tr><tr><td><strong>只判考点（10 题）</strong></td><td>专项练「这题在考什么」：第一屏<strong>不给 A/B/C/D</strong>，只有 4 个考点按钮；判完考点再看选项选答案，两条正确率分开算。<strong>一组 10 题</strong>，做完结算，点「下一组 10 题」继续（错题/看答案的题最多优先插 5 题）</td></tr><tr><td><strong>只刷我错过的题</strong></td><td>把所有做错过或看过答案（<code>wrong &gt; 0</code> 或 <code>peek &gt; 0</code>）的题捞出来重刷；都没「错过」时是灰的</td></tr></tbody></table>\n<p>下面的 block 卡片可以<strong>单独点进去</strong>只刷这一组（这张卡也在提示这组考什么）：</p>\n<table><thead><tr><th>Block</th><th>内容</th><th>题数</th><th>依据</th></tr></thead><tbody><tr><td>1</td><td>从句与句子类型（<code>adj + that</code>、宾语从句语序/时态、感叹句、疑问句、祈使句）</td><td>30</td><td>复习指引 U1/U2 语法点</td></tr><tr><td>2</td><td>动词三件套（非谓语 / 时态 / 主动被动四时态）</td><td>30</td><td>模拟考最大失分区</td></tr><tr><td>3</td><td>词法速记（系动词、形容词副词、比较级、冠词、代词、介词、连词）</td><td>30</td><td>广州卷「纯记忆分」占 5 空</td></tr><tr><td>4</td><td>不规则动词闪刷（过去式 / 过去分词）</td><td>24</td><td>课本 P142–143</td></tr><tr><td>5</td><td><strong>广州卷真题同款</strong>（越秀执信/铁一/育才实验、南沙、白云、广大附中、西关外国语往年期中真题原句）</td><td>20</td><td>调研 B 摘录的真题</td></tr></tbody></table>\n<h2>三、做题屏：点一下就是判分，看完要点再走</h2>\n<ul><li><strong>题卡顶部有一行「历史」</strong>（做过才显示，没做过不占版面）：<code>历史：做对 3 次 · 做错 2 次 · 看答案 1 次（共 6 次）</code>。</li></ul>\n<p>它来自本机累计记录，<strong>刷新、换题、重练都还在</strong>；鼠标悬停能看到「上次作答：…」。判完一次这一行立刻 +1，所以每道题\"错过几次\"一目了然。</p>\n<ul><li><strong>没有提交按钮</strong>。点 A/B/C/D 立刻判：</li><li><strong>对</strong>：变绿打勾，展开 <strong>考点 + 规则 + 出处</strong>，<strong>等你点「下一题 →」或按 <code>Enter</code></strong> 才翻页（做对了也要看一眼要点）。想让会的题自己翻过去，把顶栏的 <code>自动:关</code> 点成 <code>自动:开</code>，之后做对 1.0 秒自动翻页（这个开关会被记住）。</li><li><strong>错</strong>：所选项变红、正确项标绿，下方展开 <strong>考点 + 规则 + 易错点 + 出处</strong>，点「记住了 →」或按 <code>Enter</code> 继续。<strong>这题会进本轮末尾的重练队列</strong>。</li><li>反馈块固定是这个顺序：<code>✓/✗</code> → <strong>考点</strong>（例：比较级）→ <strong>怎么认出</strong>（一句「先看哪里 → 怎么判断」，如「有 than，或空前有 much/even → 比较级」）→ 规则 → 易错点（仅答错）→ 出处。<strong>先看「怎么认出」那一行</strong>：它教的是入口，规则只是入口之后的动作。</li><li><strong>卡住了可以点选项下方的「看答案」</strong>：直接亮出正确项 + 完整讲解，不用再猜。代价是 <strong>这题不计入正确率</strong>（避免刷答案把分数抬高），但<strong>会进本轮末尾的重练队列</strong>——没自己想起来就算没掌握，最后必须再做一次。结算页会单列「另有 N 题看了答案（没计入正确率，已加入重练）」。<strong>看过答案的题也会被开始屏的「只刷我错过的题」收进去。</strong></li><li><strong>想换题不用退出</strong>：题卡下方有一条 <code>‹ 上一题</code> ｜ <code>答题卡 1/20</code> ｜ <code>下一题 ›</code>，键盘 <code>←</code> / <code>→</code> 也能换。</li><li>点「答题卡」会弹出本轮所有题的题号网格，格子上标着<strong>做对（绿）/ 做错（红）/ 看答案（琥珀）/ 未做</strong>，点哪个题号就切到哪题（一轮 134 题也能滚动）。</li><li><strong>换题本身不判分、不计数</strong>：进度条与正确率只按真做了的题算。</li><li>已作答的题切回去是<strong>只读回看</strong>：当时的讲解还在，但不能重复判分、也不会重复计分。</li><li>有跳过的题时本轮不会结束；点讲解里的「下一题 →」会跳到下一道还没做的题，跳过的题最后绕回来。想结束/放弃本轮仍点「退出」。</li><li>顶栏：<code>退出</code> · 进度条 <code>x/134</code> · 正确率 · 用时 · 当前考点（右上角小标签）·<code>自动:关/开</code>。正确率的分母是<strong>判过的题</strong>，不含看答案的题。</li><li><strong>刷新/误关页面不会丢进度</strong>：本轮做到第几题、做对几题、哪些题看过答案都存在本机，重新打开会<strong>自动接着上次那一题</strong>继续（toast 会提示「接着上次：已做 x/y」），答题卡上的对/错/看答案状态也一并恢复。点「退出」才算放弃本轮。</li><li>本轮全部做完后自动进入<strong>重练轮</strong>（只做刚才错的题，选项顺序不变，做对才放你走）；重练再错继续重来。</li><li>键盘：<code>1 2 3 4</code> / <code>A B C D</code> 选，<code>←</code> / <code>→</code> 换题，<code>Enter</code> 继续，<code>Esc</code> 退出（会先确认）。</li></ul>\n<h3>看不懂句子？答完看译文，没答时悬停看词义</h3>\n<ul><li><strong>答完题（或点「看答案」）之后</strong>，英文句子<strong>正下方</strong>会出现一行浅紫底的中文整句译文（左侧带一个「译」小标）。切到别的题再切回来，译文还在；刷新续做也在。<strong>没作答时译文不显示</strong>——译文里含着答案的意思，先露出来就等于泄题。</li><li><strong>没作答时</strong>，把鼠标移到题干里的<strong>任何一个英文单词或短语</strong>上，会浮出深色小气泡：上面是中文释义，下面是原词。短语（如 <code>in order to</code>、<code>is made up of</code>、<code>get rid of</code>）是<strong>整块</strong>显示的，鼠标放在短语里任何一个词上都会给出整块的意思，不会拆成逐词直译。</li><li>手机上没有鼠标：<strong>点一下单词/短语</strong>同样出词义，点空白处收起。</li><li>词义来自 <code>data/glossary.json</code>（全局词表）+ 每题的 <code>gloss</code>（语境义覆盖）。<strong>每道题的每个词都有释义</strong>是构建时校验的（见下文）；答案所在的那个空不会给词义，避免把答案漏出来。</li><li>做题屏底部提示行也写着「悬停英文词看中文」，忘了就瞄一眼。</li></ul>\n<h3>「只判考点」模式怎么走（专项）</h3>\n<ul><li>第一屏<strong>不显示 A/B/C/D</strong>，只给 4 个考点按钮：判对判错都立刻给「考点 + 这道题的规则」；点「看选项，选答案 →」才出现选项。</li><li><strong>按「组」走</strong>：一组固定 10 题，做完出结算；结算页那个按钮是 <strong>「下一组 10 题」</strong>，顺着题库往后开新一组（110 题轮完再从头），相邻两组不重复；错题/看答案的题最多先插 5 题。<strong>不是随机抽题</strong>——同一个记录状态重开拿到的还是同一组，方便你陪她对照同一组前后两次。</li><li>考点判错不影响答案分：顶部正确率与 <code>store.stat</code> 只算答案；考点另有「考点识别 X/Y」一行（结算页，低于 80% 会点名判错的考点）。</li><li>换题、答题卡、刷新续做都照常；重练轮只重练<strong>答案</strong>错的题，不再判考点。</li><li>用法建议：<strong>每天 10 题</strong>（约 5 分钟），先把「考点识别」练到 8/10，再回普通模式刷速度。判考点拿不准时，去看「最小对立对卡」里对应那一组。</li></ul>\n<h2>四、结算屏</h2>\n<ul><li>大号正确率 + <code>对 X / Y</code> + 用时（<code>Y</code> 是<strong>判过的题数</strong>，不含看答案的题）。</li><li><strong>考点正确率表</strong>：按考点聚合，<strong>低于 60% 的排最前面</strong>——这就是明早要再看一眼的那几个点。表里的「题数」和顶部「对 X / Y」同口径，<strong>都不含看答案的题</strong>（某个考点全看了答案，该行显示 <code>0 题 / —</code> 并排在最前）。</li><li>看答案的题会单列一行 <code>另有 N 题看了答案（没计入正确率，已加入重练）</code>，并在错题区用琥珀色「看答案」标签标出来，可点跳题。</li><li><strong>考点识别</strong>（只有「只判考点」模式才出现）：<code>考点识别 对 X/Y（Z%）· 答案 对 A/B（W%）</code>；Z 低于 80% 时列出判错的考点名（最多 5 个）。这一行就是「先练判考点，再练速度」的信号——答案分低但考点识别高，说明是规则没记牢；两个都低，说明入口还没建立。</li><li>四个按钮：<code>重练错题（N）</code>、<code>再来一轮</code>、<code>复制今晚小结</code>（markdown 进剪贴板，含正确率、弱考点、错题 id·考点·出处）、<code>回到开始屏</code>；另有一个 <code>考前口诀卡</code> 入口（明早 15 分钟要看的就是它）。</li></ul>\n<h2>五、页内资料：方案 / 口诀卡 / 对比卡 / 速查表 / 本说明</h2>\n<p>开始屏底部（结算屏也有）有一行入口：<strong>考前口诀卡 ｜ 最小对立对卡 ｜ 考点识别速查表 ｜ 今晚复习方案 ｜ 使用说明</strong>，点开在<strong>页面内直接读</strong>，不用去找文件、也不用联网。</p>\n<ul><li><strong>考点识别速查表</strong>：49 个考点各一行「怎么认出」（43 个本次有题 + 6 个考纲里有、这次没出题），按 4 个 block 分组，带「题数」列（<code>0</code> = 本题库没出题）。由 <code>data/topic-cues.json</code> 生成，改线索后重跑 <code>build.mjs</code> 自动更新，不手改。</li><li><strong>打印版</strong>：同一份表另有单文件 <code>考点识别速查表.html</code>（构建产物），双击打开 → <code>Ctrl+P</code> → A4 一页。页内阅读时直接 <code>Ctrl+P</code> 也只会印当前这份文档（打印样式已处理）。</li></ul>\n<ul><li>这三份文档在 <code>build.mjs</code> 构建时从仓库里的 <code>.md</code> 转成 HTML 一起打进 <code>data/bundle.js</code>（<code>window.FLASH_DOCS</code>），所以单文件离线版也带着它们。</li><li>为什么不直接链 <code>.md</code>：浏览器打开 <code>.md</code> 只会下载或显示成源码，页内渲染才叫\"方便查看\"。</li><li>改了文档要重新 <code>node build.mjs</code> 才会同步进页面。</li></ul>\n<h2>六、记录：导出 / 导入 / 清空</h2>\n<p>存在 <code>localStorage</code> 的 <code>eng9a-flash-v1</code>：</p>\n<pre><code>{ stat: { \"vf-001\": { att: 2, ok: 1, wrong: 1, peek: 1, at: \"ISO 时间\" }, ... },  // 单题累计：作答/对/错/看答案\n  rounds: [ { mode: \"plan|block|redo|spot\", startAt, endAt, costMs, total, ok, wrongIds: [],\n              peek: 2, peekIds: [\"wd-011\", \"gz-003\"],\n              spot: { total: 10, ok: 7, wrongTopics: [\"比较级\", \"宾语从句语序\"] } } ],  // spot 只在「只判考点」轮出现\n  last:   { ...上一轮结算，结算屏读它；只有 spot 轮才带 spot 字段 },\n  current:{ mode, title, ids: [...], idx, done, ok, phase, wrongIds, pendingRedoIds,\n            phaseOk, phaseDone, perTopic, peekIds, spot,   // spot = 考点屏的进度快照（旧记录没有）\n            results: { \"cl-003\": { picked: 1, peek: false, correct: true }, ... },  // 每题结果，切题/刷新用\n            startAt },  // 进行中本轮；刷新靠它恢复，退出/结算时清空\n  settings:{ autoNext: false } }                               // 「自动跳题」开关</code></pre>\n<ul><li><code>stat</code> 就是题卡顶部那行「历史」的来源：<code>att</code> 作答次数、<code>ok</code> 做对、<code>wrong</code> 做错、<code>peek</code> 看答案、<code>at</code> 最近一次时间。<strong>看答案只加 <code>peek</code>，不动 <code>att/ok/wrong</code></strong>，所以正确率口径不受影响。</li><li><code>current.results</code> 是「进行中本轮」每道题的结果（<code>picked</code> 选的选项、<code>peek</code> 是否看答案、<code>correct</code> 对错），答题卡的颜色与「切回已作答的题只读回看」都靠它；旧版记录没有这个字段时按旧逻辑恢复。</li><li>正确率口径：<code>正确率 = 答对 / 判过题数</code>，<strong>判过题数 = 进度 − 看答案的题</strong>。看答案的题不算对也不算错，只保证它最后一定进重练。</li></ul>\n<ul><li><strong>导出记录（JSON）</strong>：<code>英语-语法闪练-YYYY-MM-DD.json</code>，外壳是仓库统一格式 <code>{ \"schema\": \"lt.practice-records/1\", \"subject\": \"英语\", \"tool\": \"语法闪练\", \"exportedAt\", \"data\": {...} }</code>（ADR-0001）。导出后放进仓库 <code>学习记录/</code> 即可进档案。</li><li><strong>导入记录</strong>：<strong>整份覆盖</strong>本机记录，先弹确认；文件坏了只提示「导入失败」，不动原记录。导入的是旧版文件（没有 <code>current</code> / <code>settings</code>）也正常。</li><li><strong>清空记录</strong>：连 <code>stat</code> / <code>rounds</code> / <code>last</code> / <code>current</code> 一起清，不可撤销。</li><li>注意：训练台（<code>工具/dsh-plugin/</code>）目前还不认识 <code>eng9a-flash-v1</code>，导出的快照暂时只当存档；要纳入统计得改 <code>records.js</code> 的解析。</li></ul>\n<h2>七、深链（打开就落到指定位置）</h2>\n<p>只在启动时读一次，运行中不回写地址栏。</p>\n<table><thead><tr><th>深链</th><th>落到</th></tr></thead><tbody><tr><td><code>#block=1</code> … <code>#block=5</code></td><td>直接开这一组（<strong>注意</strong>：如果上一轮还没「退出」，刷新带 hash 也会先接着上次——想换组请先点「退出」）</td></tr><tr><td><code>#view=drill</code></td><td>接着上次继续；没有进行中的本轮就从第一题开始</td></tr><tr><td><code>#view=result</code></td><td>打开上次结算</td></tr><tr><td><code>#list=wrong</code></td><td>只刷错过的题（做错或看过答案都算；这是明确指令，<strong>会覆盖</strong>进行中的本轮）</td></tr><tr><td>`#view=doc&amp;doc=card\\</td><td>pair\\</td><td>plan\\</td><td>guide`</td><td>直接打开页内文档（口诀卡 / 最小对立对卡 / 今晚复习方案 / 使用说明）</td></tr></tbody></table>\n<p>非法值按 key 静默忽略、回默认，不报错。</p>\n<h2>八、改题库 / 重建</h2>\n<pre><code>cd 英语/语法闪练\nnode build.mjs              # 校验 + 生成 data/bundle.js 与 ../语法闪练.html\nnode build.mjs --strict     # 缺题库文件也算失败（发布前用）</code></pre>\n<p><code>build.mjs</code> 强制校验：<code>id</code> 唯一且格式对 · 考点在<strong>受控词表</strong>内 · <code>options</code> 恰好 4 个不重复 · <code>answer</code> ∈ A–D · <code>stem</code> 恰好一个 <code>______</code> · <code>rule</code> ≤60 字 · <code>trap</code> ≤50 字 · 文件内与全库题干不重复 · <code>level:3</code> ≤15% · <strong><code>cn</code> 整句译文必填</strong>（缺了警告，<code>--strict</code> 下报错）· <strong><code>gloss</code> 键必须能在题干里逐词匹配</strong> · <strong>悬停词表覆盖率</strong>（构建汇总会打印 <code>悬停词表 … 覆盖 x/y（%）</code>，缺词会按文件点名）。</p>\n<ul><li>数据格式、受控考点词表、质量红线：<code>data/SCHEMA.md</code></li><li>悬停词义：<code>data/glossary.json</code>（题干里每个词形都要有词条；短语键用题干实际词形）。改题干/加题后，跑 build 看覆盖率，缺哪个词补哪个（个别语境义放该题的 <code>gloss</code>）</li><li>「只判考点」的干扰项来源：<code>data/near-topics.json</code>（每个考点给 3 个最易混的邻近考点；加考点时要补一行，<code>build.mjs</code> 会校验）</li><li>解析里的「怎么认出」线索：<code>data/topic-cues.json</code>（每个考点一句「先看哪里 → 怎么判断」；<strong>每个题库考点都必须有</strong>，缺一条 build 直接报错）</li><li>词汇与话题范围、不规则动词表：<code>data/VOCAB.md</code></li><li>block 标题 / 预计分钟 / 一句话提示：<code>data/blocks.json</code></li><li>加一组题：在 <code>data/</code> 放一个新的 <code>gN-xxx.json</code>（<code>group</code> 必须是 <code>clause|verb|word|gz|verbform</code>），再在 <code>build.mjs</code> 的 <code>TOPICS</code> 与 <code>SPEC</code> 里登记；<strong>产物只能由 build 生成</strong>。</li></ul>\n<h2>九、已知取舍（不是 bug）</h2>\n<ol><li><strong>单句而不是语篇</strong>：广州语法选择真卷是一篇 200 词短文挖 10 空。闪练把每个空抽成一句，练的是「信号词 → 形式」的反射；<strong>考场流程（先通读定时态基调）写在方案文档第七节</strong>，别指望闪练代替它。</li><li><strong>语篇填词（首字母）练不了</strong>：那题要写出完整单词，考拼写；闪练只覆盖它的「词性 + 变形」部分。拼写靠明早看单词表。</li><li><strong>完形填空不做</strong>：广州完形四选项是<strong>同词性不同词义</strong>，属词汇辨析，和语法闪练不是一个东西。</li><li><strong>不判「得分」</strong>：题库没有分值口径，只算正确率。</li><li><strong>「出处」不是真题原文的承诺</strong>：Block 5 的题干取自真卷原文并在 <code>src</code> 标了年份/学校，可回原卷核对；其余 block 是自编题，<code>src</code> 只标「哪个单元的哪个语法点」。</li></ol>\n<h2>十、出问题了怎么查</h2>\n<table><thead><tr><th>现象</th><th>原因 / 处理</th></tr></thead><tbody><tr><td>刷新后没接着上次</td><td>说明这一轮已经点过「退出」或已结算（<code>current</code> 被清）；重新点「开始今晚方案」即可。想保留进度就别中途退出</td></tr><tr><td>点「考前口诀卡」提示「文档还没打包」</td><td>文档是构建期注入的：跑一次 <code>node build.mjs</code></td></tr><tr><td>打开后显示「题库还没生成」</td><td><code>data/bundle.js</code> 没生成：跑 <code>node build.mjs</code></td></tr><tr><td>开始屏有灰色「题库待生成」卡片</td><td>对应 <code>data/g*.json</code> 缺失（<code>build.mjs</code> 的警告里会写缺哪个）</td></tr><tr><td>记录不见了</td><td>换了浏览器/设备，或清了缓存；用「导入记录」恢复</td></tr><tr><td>手机上点选项没反应</td><td>先确认页面没被「退出确认」弹窗挡住；<code>Esc</code> 或点「再看看」关掉</td></tr><tr><td>想看某题为什么这么判</td><td>判完的反馈里依次是 <code>考点</code> + <code>规则</code> + <code>易错点</code>（仅答错）+ <code>出处</code>；题库原文在 <code>data/g*.json</code></td></tr></tbody></table>"}};
</script>
<script>
(function () {
  "use strict";

  var STORE_KEY = "eng9a-flash-v1";
  var BLOCK_TITLES = { 1: "从句与句子类型", 2: "动词三件套", 3: "词法速记", 4: "不规则动词闪刷", 5: "广州卷真题同款" };
  var EXPECTED_BLOCKS = 5;   // 数据里最多出现到 Block 5；多了会自动扩展
  var LETTERS = "ABCD";

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  /* ══ 数据 ══════════════════════════════════ */
  var blocks = [];
  var itemById = {};

  function initData() {
    blocks = [];
    itemById = {};
    var raw = window.FLASH_DATA;
    if (!raw || !Array.isArray(raw.blocks)) return;
    raw.blocks.forEach(function (b) {
      if (!b || !Array.isArray(b.items) || !b.items.length) return;
      var items = b.items.filter(function (it) {
        return it && typeof it.id === "string" && Array.isArray(it.options) && it.options.length >= 2 &&
          typeof it.answer === "string" && LETTERS.indexOf(it.answer.toUpperCase()) >= 0;
      });
      if (!items.length) return;
      var blk = {
        block: Number(b.block) || 0,
        title: b.title || BLOCK_TITLES[b.block] || "",
        minutes: Number(b.minutes) || 0,
        hint: typeof b.hint === "string" ? b.hint : "",
        items: items
      };
      items.forEach(function (it) {
        it.block = blk.block;
        it.topic = it.topic || "未分类";
        it.answer = it.answer.toUpperCase();
        itemById[it.id] = it;
      });
      blocks.push(blk);
    });
    blocks.sort(function (a, b) { return a.block - b.block; });
  }
  var blockByNo = {};
  function indexBlocks() {
    blockByNo = {};
    blocks.forEach(function (b) { blockByNo[b.block] = b; });
  }
  function allItems() {
    var out = [];
    blocks.forEach(function (b) { out = out.concat(b.items); });
    return out;
  }
  function itemsOfBlocks(nos) {
    var out = [];
    nos.forEach(function (n) { var b = blockByNo[n]; if (b) out = out.concat(b.items); });
    return out;
  }
  function planItems() {
    return itemsOfBlocks(blocks.map(function (b) { return b.block; }));
  }
  /* 「错过」= 做错过 或 看过答案（用户口径：看过答案等于没掌握） */
  function wrongItems() {
    return allItems().filter(function (it) {
      var s = store.stat[it.id];
      return s && (Number(s.wrong) > 0 || Number(s.peek) > 0);
    });
  }
  function planMinutes() {
    var m = 0;
    blocks.forEach(function (b) { m += b.minutes > 0 ? b.minutes : Math.ceil(b.items.length * 0.35); });
    return m;
  }

  /* ══ 记录 ══════════════════════════════════ */
  function blankStore() {
    return { stat: {}, rounds: [], last: null, settings: { autoNext: false }, current: null };
  }
  function num(v) { v = Number(v); return isFinite(v) && v > 0 ? v : 0; }
  function strList(v) { return Array.isArray(v) ? v.filter(function (x) { return typeof x === "string"; }) : []; }
  function normMode(m) { return ["plan", "block", "redo", "spot"].indexOf(m) >= 0 ? m : "block"; }
  /* 考点模式的两份快照：comp = 结算/轮次记录（只有计数），current = 进行中本轮（含每题选项顺序） */
  function normSpotComp(v) {
    if (!v || typeof v !== "object") return null;
    var total = Math.floor(num(v.total));
    return { total: total, ok: Math.min(Math.floor(num(v.ok)), total), wrongTopics: strList(v.wrongTopics).slice(0, 20) };
  }
  function normSpotCurrent(v) {
    if (!v || typeof v !== "object") return null;
    var picked = {}, order = {};
    if (v.picked && typeof v.picked === "object") {
      Object.keys(v.picked).forEach(function (id) {
        var i = Number(v.picked[id]);
        if (isFinite(i) && i >= 0 && i <= 3) picked[id] = Math.floor(i);
      });
    }
    if (v.order && typeof v.order === "object") {
      Object.keys(v.order).forEach(function (id) {
        var arr = Array.isArray(v.order[id]) ? v.order[id].filter(function (t) { return typeof t === "string" && t; }) : [];
        if (arr.length >= 2) order[id] = arr.slice(0, 6);
      });
    }
    return {
      total: Math.floor(num(v.total)), ok: Math.floor(num(v.ok)),
      picked: picked, order: order, wrongTopics: strList(v.wrongTopics).slice(0, 20), hold: null
    };
  }
  /* 进行中本轮的快照（刷新后接着做）。题库改过、id 失效时由 resumeRound 丢条目，不在这里崩。 */
  function normalizeCurrent(c) {
    if (!c || typeof c !== "object") return null;
    var ids = strList(c.ids);
    if (!ids.length) return null;
    var perTopic = {};
    if (c.perTopic && typeof c.perTopic === "object") {
      Object.keys(c.perTopic).forEach(function (k) {
        var t = c.perTopic[k];
        if (!t || typeof t !== "object") return;
        perTopic[k] = { topic: k, total: num(t.total), ok: num(t.ok), peek: num(t.peek) };
      });
    }
    var mainIds = strList(c.mainIds);
    var idx = Math.floor(num(c.idx));
    // 每题结果（新版快照才有；旧快照没有 results，resumeRound 里按旧逻辑补）
    var results = {};
    var hasResults = !!(c.results && typeof c.results === "object");
    if (hasResults) {
      Object.keys(c.results).forEach(function (id) {
        var r = c.results[id];
        if (!r || typeof r !== "object") return;
        var picked = Number(r.picked);
        if (!isFinite(picked) || picked < -1 || picked > 3) picked = -1;
        results[id] = {
          picked: Math.floor(picked),
          peek: r.peek === true,
          correct: r.correct === true ? true : (r.correct === false ? false : null)
        };
      });
    }
    return {
      mode: normMode(c.mode),
      title: typeof c.title === "string" ? c.title : "",
      ids: ids,
      mainIds: mainIds.length ? mainIds : ids.slice(),
      idx: Math.min(idx, ids.length),
      done: Math.min(Math.floor(num(c.done)), ids.length),
      ok: Math.floor(num(c.ok)),
      phase: c.phase === "redo" ? "redo" : "main",
      wrongIds: strList(c.wrongIds),
      pendingRedoIds: strList(c.pendingRedoIds),
      peekIds: strList(c.peekIds),
      phaseOk: Math.floor(num(c.phaseOk)),
      phaseDone: Math.floor(num(c.phaseDone)),
      perTopic: perTopic,
      results: results,
      spot: normSpotCurrent(c.spot),
      legacy: !hasResults,
      startAt: typeof c.startAt === "string" ? c.startAt : new Date().toISOString(),
      autoNext: c.autoNext === true
    };
  }
  function normalizeStore(raw) {
    var out = blankStore();
    if (!raw || typeof raw !== "object") return out;
    var stat = raw.stat && typeof raw.stat === "object" ? raw.stat : {};
    Object.keys(stat).forEach(function (id) {
      var s = stat[id];
      if (!s || typeof s !== "object") return;
      out.stat[id] = { att: num(s.att), ok: num(s.ok), wrong: num(s.wrong),
        peek: num(s.peek), at: typeof s.at === "string" ? s.at : "" };
    });
    var rounds = Array.isArray(raw.rounds) ? raw.rounds : [];
    rounds.slice(-200).forEach(function (r) {
      if (!r || typeof r !== "object") return;
      out.rounds.push({
        mode: normMode(r.mode),
        startAt: typeof r.startAt === "string" ? r.startAt : "",
        endAt: typeof r.endAt === "string" ? r.endAt : "",
        costMs: num(r.costMs),
        total: num(r.total),
        ok: num(r.ok),
        wrongIds: strList(r.wrongIds),
        peek: num(r.peek),
        peekIds: strList(r.peekIds),
        spot: normSpotComp(r.spot)
      });
    });
    var L = raw.last;
    if (L && typeof L === "object") {
      out.last = {
        mode: normMode(L.mode),
        startAt: typeof L.startAt === "string" ? L.startAt : "",
        endAt: typeof L.endAt === "string" ? L.endAt : "",
        costMs: num(L.costMs),
        total: num(L.total),
        ok: num(L.ok),
        wrongIds: strList(L.wrongIds),
        itemIds: strList(L.itemIds),
        spot: normSpotComp(L.spot),
        perTopic: Array.isArray(L.perTopic) ? L.perTopic.filter(function (t) { return t && typeof t.topic === "string"; })
          .map(function (t) { return { topic: t.topic, total: num(t.total), ok: num(t.ok), peek: num(t.peek) }; }) : []
      };
    }
    out.settings = { autoNext: !!(raw.settings && raw.settings.autoNext === true) };
    out.current = normalizeCurrent(raw.current);
    return out;
  }
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return blankStore();
      return normalizeStore(JSON.parse(raw));
    } catch (e) { return blankStore(); }
  }
  function saveStore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
  }
  function recordAttempt(item, correct) {
    var s = store.stat[item.id] || (store.stat[item.id] = { att: 0, ok: 0, wrong: 0, at: "" });
    s.att += 1;
    if (correct) s.ok += 1; else s.wrong += 1;
    s.at = new Date().toISOString();

  /* ══ 本轮引擎 ══════════════════════════════ */
  function makeRound(o) {

  function startRound(mode, items, opts) {

  /* ══ 只判考点（spot）：先判考点，再回原题选答案 ═══════════
