<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数学错题本 · 2026-11-13</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#1b2333; --muted:#6b7280; --line:#e6e9f2;
  --brand:#3b6fe0; --brand-soft:#eaf0fe; --ok:#0f9d58; --ok-soft:#e8f6ee;
  --half:#c26a00; --half-soft:#fff4e2; --bad:#d93025; --bad-soft:#fdecea;
  --r:14px; --shadow:0 1px 2px rgba(20,30,60,.05),0 8px 24px rgba(20,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 72px}
header.top{
  position:sticky;top:0;z-index:20;background:rgba(245,247,251,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px}
.ver{font-size:11px;color:var(--muted);font-weight:600;border:1px solid var(--line);border-radius:20px;padding:1px 7px}
.top-note{font-size:12px;color:var(--muted);margin-left:auto}
nav.tabs{max-width:860px;margin:0 auto;padding:8px 16px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
  padding:8px 12px;border-radius:10px 10px 0 0;cursor:pointer;border-bottom:2px solid transparent;
}
nav.tabs button:hover{color:var(--ink);background:#eef1f8}
nav.tabs button.active{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}
main{padding-top:18px}
h2{font-size:19px;margin:26px 0 10px;letter-spacing:.2px}
h3{font-size:16px;margin:18px 0 8px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:11px;cursor:pointer;
  transition:transform .06s ease,background .12s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#3260c8}
.btn-ghost{background:transparent;border-color:transparent;color:var(--brand);padding:6px 8px}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-half{background:var(--half);border-color:var(--half);color:#fff}
.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.half{background:var(--half-soft);color:var(--half)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gray{background:#eef1f8;color:var(--muted)}
.hero{
  background:linear-gradient(135deg,#eaf0fe 0%,#f7f9ff 55%,#fff 100%);
  border:1px solid #dbe5fb;border-radius:18px;padding:20px;box-shadow:var(--shadow);
}
.hero h1{font-size:22px;margin:0 0 6px;letter-spacing:.3px}
.hero .sub{color:var(--muted);font-size:13px;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;line-height:1.25}
.stat span{font-size:12px;color:var(--muted)}
.topicbars{display:grid;gap:10px}
.tb{display:grid;grid-template-columns:86px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.tb .bar{height:8px;background:#edf0f7;border-radius:6px;overflow:hidden}
.tb .bar i{display:block;height:100%;background:linear-gradient(90deg,#5b8cf0,#3b6fe0);border-radius:6px}
.tb .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s ease,transform .06s ease}
.item:hover{border-color:#c9d6f5}
.item:active{transform:scale(.995)}
.item+.item{margin-top:10px}
.item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .no{font-weight:800;font-size:13px;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:1px 7px}
.item .src{font-size:12px;color:var(--muted)}
.item .stem{margin:6px 0 2px;font-size:14px;color:#2b3446;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.item .foot{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-size:13px;padding:5px 11px;border-radius:20px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.search{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font:inherit;background:#fff;color:var(--ink)}
.search:focus{outline:2px solid #c9d9fb;border-color:#b9cdf8}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qhead .no{font-weight:800;color:var(--brand)}
.qmeta{font-size:12px;color:var(--muted)}
.stem{font-size:16px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.note{font-size:12px;color:var(--muted);background:#f8f9fd;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:10px 0}
.orig{margin:12px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fafbff}
.orig img{display:block;width:100%;height:auto}
.orig figcaption{font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line);background:#fff}
.hintbox{background:#fffaf0;border:1px solid #f3dfb6;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.hintbox b{color:var(--half)}
.sol{background:#f7faff;border:1px solid #dbe5fb;border-radius:12px;padding:12px 14px;margin:10px 0}
.sol h4{margin:0 0 8px;font-size:14px;color:var(--brand)}
.step{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.step:last-child{border-bottom:0}
.step .t{font-weight:700;color:#2b3446;margin-bottom:2px}
.step .d{color:#374151;white-space:pre-wrap}
.answer{background:var(--ok-soft);border:1px solid #bfe6cf;border-radius:12px;padding:12px 14px;margin:10px 0}
.answer b{color:var(--ok)}
.answer .v{font-size:18px;font-weight:800;margin:2px 0 4px}
.why{background:var(--bad-soft);border:1px solid #f3c7c2;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px}
.why b{color:var(--bad)}
.method{background:#f4f6fc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px}
.method b{color:var(--brand)}
.assess{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.assess .btn{padding:11px 8px;font-size:14px}
.progress{height:6px;background:#e9edf6;border-radius:6px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#5b8cf0,#3b6fe0)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;font-size:13px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
table.tb2{width:100%;border-collapse:collapse;font-size:13px}
table.tb2 th,table.tb2 td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.tb2 th{color:var(--muted);font-weight:600;font-size:12px}
table.tb2 td.n{font-variant-numeric:tabular-nums;text-align:right}
.rec{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rec:last-child{border-bottom:0}
.rec .when{color:var(--muted);font-size:12px;min-width:92px}
.footer{color:var(--muted);font-size:12px;text-align:center;margin:28px 0 8px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#1b2333;color:#fff;font-size:13px;padding:9px 16px;border-radius:22px;
  opacity:0;pointer-events:none;transition:all .2s ease;z-index:60;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .tb{grid-template-columns:70px 1fr 52px}
  .stem{font-size:15px}
}
/* 打印：只显示重做卷 */
.print-sheet{display:none}
@media print{
  body{background:#fff}
  header.top,main,.toast{display:none!important}
  .print-sheet{display:block;max-width:720px;margin:0 auto;color:#000;font-size:13px}
  .p-title{font-size:20px;font-weight:800;text-align:center;margin:0 0 2px}
  .p-sub{text-align:center;font-size:12px;color:#444;margin:0 0 14px}
  .p-item{border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin:0 0 10px;page-break-inside:avoid}
  .p-item .p-no{font-weight:800;margin-bottom:4px}
  .p-item .p-src{font-size:11px;color:#555;margin-bottom:4px}
  .p-item .p-stem{white-space:pre-wrap;line-height:1.7}
  .p-item img{display:block;width:100%;max-height:300px;object-fit:contain;margin:6px 0;border:1px solid #eee}
  .p-lines{margin-top:8px}
  .p-lines div{border-bottom:1px solid #ccc;height:22px}
  .p-answers{page-break-before:always;margin-top:16px}
  .p-answers h3{font-size:15px;margin:0 0 8px}
  .p-ans{border-bottom:1px dashed #ccc;padding:4px 0;font-size:12px}
  .p-ans b{display:inline-block;min-width:34px}
}
</style>
</head>

  var DATA = {"meta":{"title":"数学错题本","batch":"20261113","created":"2026-11-13","source":"2026-11-13 错题照片 9 张（圆·反比例函数·方程与函数·几何变换）","note":"题干按印刷体还原，不采信手写答案；每题附原图，识别有疑问以原图为准。"},"topics":["圆","反比例函数","方程与函数","几何变换"],"items":[{"id":"p01","no":"01","img":"002","topic":"圆","kp":["垂径定理","勾股定理","分类讨论"],"type":"fill","source":"29.2.1 垂直于弦的直径 · 易错点睛（教材 P143 T1(1) 变式）","difficulty":2,"errorTags":["分类讨论","辅助线"],"stem":"如图，CD 是 ⊙O 的直径，AB 是 ⊙O 的弦，AB⊥CD 于点 M。若 AB=8，OM∶OC=3∶5，则 AC 的长为 ______。","note":"原题有红色批改与手写答案，题干按印刷体还原。","options":[],"answer":"2√5 或 4√5","answerNote":"两个值都要写；只写一个只算半对。","hints":["直径垂直于弦，先用垂径定理：AM=BM=4。","OM∶OC=3∶5，设 OM=3k、OC=5k；半径 OA=OC=5k，在 Rt△AOM 里用勾股定理求 k。","弦 AB 可以在圆心 O 的左侧，也可以在右侧——CM 有两种，别漏。"],"steps":[{"t":"① 用垂径定理","d":"CD 过圆心且 AB⊥CD，所以 AM=BM=½AB=4。"},{"t":"② 设 k 求半径","d":"设 OM=3k，OC=5k（k>0）。因为 OA=OC=5k，在 Rt△AOM 中：OA²=OM²+AM²，即 25k²=9k²+16，解得 k=1。所以 OM=3，半径 OC=5。"},{"t":"③ 分类讨论 CM","d":"① M 在 O 与 C 之间时，CM=OC−OM=2，AC²=AM²+CM²=16+4=20，AC=2√5；② M 在 O 的另一侧（O 在 C、M 之间）时，CM=OC+OM=8，AC²=16+64=80，AC=4√5。"},{"t":"④ 结论","d":"所以 AC=2√5 或 4√5。"}],"keyPoints":["垂径定理：垂直于弦的直径平分弦","同圆半径相等 OA=OC","弦在圆心两侧 → 两解"],"whyWrong":"只画了 M 在 O、C 之间的一种图，漏掉 M 在 O 另一侧的情况；或把 OM∶OC 直接当成 OM=3、OC=5（本题 k 恰好为 1，换数就错）。","method":"垂径定理 + 勾股定理 + 分类讨论。看到「弦、直径、垂直」先想垂径定理；看到「位置关系」先想两解。"},{"id":"p02","no":"02","img":"003","topic":"圆","kp":["直径所对的圆周角","圆心角与圆周角","弦长公式"],"type":"solve","source":"第 13 题（教材 P146 T13 变式）· 半圆 O","difficulty":2,"errorTags":["概念","辅助线"],"stem":"如图，以 △ABC 的边 AB 为直径作半圆 O，分别交 AC、BC 于点 D、E。\n(1)【问题背景】如图 1，若 AC=BC，∠C=70°，则 ∠DOE 的度数为 ______；\n(2)【迁移应用】如图 2，连接 DE，若 AB=√2·DE，求 ∠C 的度数。","note":"原题有红色批改（A+ 与日期）和手写作答，题干按印刷体还原。","options":[],"answer":"(1) 40°；(2) 45°","answerNote":"第(2)问的关键是把「弦长比」翻译成「圆心角」。","hints":["AB 是直径 → 直径所对的圆周角是直角：∠ADB=∠AEB=90°。","圆心角 ∠DOE 与圆周角 ∠DAE 对同一条弧 DE：∠DOE=2∠DAE。","(1) 用等腰三角形求 ∠A，再在 Rt△ACE 中求 ∠CAE；(2) 由 AB=√2·DE 先求 ∠DOE，再倒推 ∠C。"],"steps":[{"t":"(1) 求 ∠A","d":"因为 AC=BC，∠C=70°，所以 ∠A=∠B=(180°−70°)/2=55°。"},{"t":"(1) 找 ∠DAE","d":"AB 为直径，所以 ∠AEB=90°。在 Rt△ACE 中，∠CAE=90°−∠C=20°。又 D 在 AC 上，所以 ∠DAE=∠CAE=20°。"},{"t":"(1) 圆心角","d":"∠DOE 与 ∠DAE 对同一条弧 DE，所以 ∠DOE=2∠DAE=40°。"},{"t":"(2) 弦长转角度","d":"设半径为 R，则 AB=2R。弦 DE=2R·sin(∠DOE/2)。由 AB=√2·DE 得 2R=√2·2R·sin(∠DOE/2)，所以 sin(∠DOE/2)=√2/2，∠DOE/2=45°，∠DOE=90°。"},{"t":"(2) 倒推 ∠C","d":"所以 ∠DAE=½∠DOE=45°。而 ∠DAE=∠CAE=90°−∠C，所以 90°−∠C=45°，∠C=45°。"}],"keyPoints":["直径所对圆周角=90°","同弧圆心角=2×圆周角","弦长 DE=2R·sin(圆心角/2)"],"whyWrong":"(1) 把 ∠DOE 当成圆周角；或没有发现 D 在 AC 上，∠DAE=∠CAE。(2) 不敢用弦长公式，或把 AB=√2·DE 直接当成角度关系。","method":"圆中角度两条主线：①直径 → 直角；②同弧 → 圆心角是圆周角的 2 倍。第(2)问用「弦长 ↔ 圆心角」把长度条件翻译成角度。"},{"id":"p03","no":"03","img":"004","topic":"圆","kp":["扇形","等腰直角三角形","勾股定理"],"type":"solve","source":"第 12 题 · 扇形 AOB 与弦 AB","difficulty":2,"errorTags":["辅助线","计算"],"stem":"如图，在扇形 AOB 中，∠AOB=90°，P 为弧 AB 上的一点，PC⊥OA 于点 C，交 AB 于点 D。若 PD=3，CD=2，求 ⊙O 的半径。","note":"原题有白色涂改/裁剪痕迹，题干按印刷体还原；图形以原图为准。","options":[],"answer":"29/4","answerNote":"半径写成 7.25 或 29/4 都对；关键方程是 (R−2)²+5²=R²。","hints":["CD 是竖直的，而 AB 是等腰直角三角形的斜边——先看 △ACD。","∠A=45° 且 ∠ACD=90°，所以 △ACD 是等腰直角三角形：CD=AC=2。","PC=PD+DC=5，在 Rt△OCP 中：OC²+PC²=OP²，而 OC=OA−AC=R−2。"],"steps":[{"t":"① 找 45°","d":"扇形中 OA=OB=R，∠AOB=90°，所以 △AOB 是等腰直角三角形，∠OAB=45°。"},{"t":"② 等腰直角三角形","d":"PC⊥OA，所以 ∠ACD=90°。在 Rt△ACD 中，∠CAD=∠OAB=45°，所以 △ACD 是等腰直角三角形，AC=CD=2。"},{"t":"③ 用 R 表示 OC、PC","d":"于是 OC=OA−AC=R−2。又 P、D、C 共线，PC=PD+DC=3+2=5。"},{"t":"④ 勾股方程","d":"在 Rt△OCP 中，OC²+PC²=OP²，即 (R−2)²+25=R²。展开：R²−4R+4+25=R²，解得 4R=29，R=29/4。"},{"t":"⑤ 结论","d":"所以 ⊙O 的半径为 29/4。"}],"keyPoints":["等腰直角三角形 AC=CD","OC=R−AC","Rt△OCP 勾股定理"],"whyWrong":"看不出 △ACD 是等腰直角三角形，把 CD 当成弧长或半径的一部分；或把 PC 当成 PD=3。","method":"把「垂直 + 45°」翻译成等腰直角三角形，用半径 R 表示 OC，再在一个直角三角形里列勾股方程。"},{"id":"p04","no":"04","img":"005","topic":"圆","kp":["点与圆的位置关系","矩形的对角线"],"type":"choice","source":"第 8 题（2026 广州）· 矩形与圆","difficulty":1,"errorTags":["审题"],"stem":"如图，矩形 ABCD 的边 AB=15，BC=20。以点 B 为圆心作圆，使 A、C、D 三点至少有一点在 ⊙B 内，且至少有一点在 ⊙B 外，则 ⊙B 的半径 r 的取值范围是（　）","note":"原题有学生选项与红笔批改，题干按印刷体还原。","options":["r>15","15<r<20","15<r<25","20<r<25"],"answer":"C","answerNote":"选 15<r<25；注意 r=15、r=25 时点落在圆上，不算「内/外」。","hints":["先算 B 到 A、C、D 的距离：BA=15，BC=20，BD 是矩形对角线。","「至少一点在圆内」看最近的点，「至少一点在圆外」看最远的点。"],"steps":[{"t":"① 三个距离","d":"矩形中 BA=15，BC=20；BD=√(15²+20²)=25。"},{"t":"② 翻译条件","d":"点 P 在 ⊙B 内 ⇔ BP<r；在 ⊙B 外 ⇔ BP>r。"},{"t":"③ 至少一点在内","d":"r 要大于最近距离 15，即 r>15（r=15 时 A 在圆上，不算内）。"},{"t":"④ 至少一点在外","d":"r 要小于最远距离 25，即 r<25（r=25 时 D 在圆上，不算外）。"},{"t":"⑤ 结论","d":"综上 15<r<25，选 C。"}],"keyPoints":["点到圆心的距离与半径比较","最近点/最远点","端点取不取到"],"whyWrong":"选 B（只比较了 A、C 两点，漏了 D）；或把「内/外」的等号算进去。","method":"圆与点的位置关系 → 比较距离；「至少一个」找极端点：最近决定内，最远决定外。"},{"id":"p05","no":"05","img":"006","topic":"圆","kp":["圆综合","角平分线","弦长公式","三角函数"],"type":"solve","source":"第 12 题 · C 综合题探究（圆综合）","difficulty":3,"errorTags":["辅助线","过程规范"],"stem":"如图，AB 是 ⊙O 的直径，C、D 为 ⊙O 上的点，且 BC∥OD，过点 D 作 DE⊥AB 于点 E。\n(1) 求证：BD 平分 ∠ABC；\n(2) 若 BC=3，DE=2，求 ⊙O 的半径长。","note":"原题有手写作图与批改痕迹，题干按印刷体还原。","options":[],"answer":"(1) 证明见解析；(2) 5/2","answerNote":"第(2)问设 θ 把两个长度条件都写成 R·三角函数，再联立消 θ。","hints":["半径 OD=OB → 等腰三角形，先找等角。","BC∥OD → 内错角相等。","(2) 设 ∠ABD=∠DBC=θ，把 BC、DE 都用 R 和 θ 表示。"],"steps":[{"t":"(1) 等半径","d":"因为 OD=OB，所以 ∠ODB=∠OBD。"},{"t":"(1) 平行内错角","d":"又 BC∥OD，所以 ∠ODB=∠CBD。因此 ∠OBD=∠CBD。因为 O 在 AB 上，∠OBD 就是 ∠ABD，所以 ∠ABD=∠CBD，即 BD 平分 ∠ABC。"},{"t":"(2) 设角","d":"由(1)设 ∠ABD=∠CBD=θ，则 ∠ABC=2θ。在等腰 △OBD 中，∠BOD=180°−2θ。"},{"t":"(2) 表示 BC","d":"∠ABC=2θ 即 ∠OBC=2θ；OB=OC，所以 ∠OCB=2θ，∠BOC=180°−4θ。于是 BC=2R·sin(∠BOC/2)=2R·sin(90°−2θ)=2R·cos2θ=3。①"},{"t":"(2) 表示 DE","d":"BD=2R·sin(∠BOD/2)=2R·sin(90°−θ)=2R·cosθ。在 Rt△BDE 中，DE=BD·sinθ=2R·cosθ·sinθ=R·sin2θ=2。②"},{"t":"(2) 联立消 θ","d":"由①②：cos2θ=3/(2R)，sin2θ=2/R。用 sin²2θ+cos²2θ=1：4/R²+9/(4R²)=1，即 25/(4R²)=1，R²=25/4，R=5/2。"},{"t":"结论","d":"所以 ⊙O 的半径为 5/2。"}],"keyPoints":["等半径 → 等角","平行 → 内错角","弦长=2R·sin(圆心角/2)","Rt△BDE 中 DE=BD·sinθ"],"whyWrong":"(1) 找不到 ∠ODB 与 ∠CBD 的内错角关系；(2) 不会把 BC、DE 统一成 R 与 θ 的式子，卡在「两个条件怎么用」。","method":"圆内证角平分线常用「半径等腰 + 平行内错角」；求半径时设一个角 θ，把已知长度都写成 R·三角函数，再联立消 θ。"},{"id":"p06","no":"06","img":"007","topic":"圆","kp":["垂径定理","轴截面建模","勾股定理"],"type":"fill","source":"第 8 题（教材 P125 T3 变式）· 球形灯罩","difficulty":2,"errorTags":["建模","审题"],"stem":"图1 是一个球形灯罩，图2 是球形灯罩的轴截面示意图。过最高点 H 的直线 HF 经过圆心，且垂直底座 CD 于点 F，点 A、B 在圆上，AC、BD 都垂直于 CD。已知 AC=BD=1 cm，CD=12 cm，HF=31 cm，则灯罩轴截面所在圆的半径为 ______ cm。","note":"原题有手写答案与红色批改，题干按印刷体还原。","options":[],"answer":"15.6","answerNote":"15.6 即 78/5；注意 HF 不是直径。","hints":["HF 过圆心且垂直 CD → 垂径定理：CF=FD=6。","设半径为 R，圆心 O 在 HF 上，OF=d，则 R+d=31。","A 在圆上，A 到轴的距离是 6，A 比 CD 高 1，到 O 的竖直距离是 d−1。"],"steps":[{"t":"① 垂径定理","d":"HF⊥CD 且过圆心 O，所以 F 是 CD 的中点，CF=FD=½×12=6。"},{"t":"② 表示 OF","d":"设半径为 R，OF=d。因为 H 是最高点，H、O、F 共线，HF=HO+OF=R+d=31，所以 d=31−R。"},{"t":"③ 建坐标","d":"以 F 为原点、CD 为 x 轴：A(−6,1)，O(0,d)。A 在圆上：6²+(d−1)²=R²。"},{"t":"④ 解方程","d":"代入 d=31−R：36+(30−R)²=R²，展开 36+900−60R+R²=R²，60R=936，R=15.6。"},{"t":"⑤ 结论","d":"所以半径是 15.6 cm。"}],"keyPoints":["垂径定理平分弦","R+d=HF","圆上点的坐标/勾股"],"whyWrong":"把 HF 当成直径（HF=2R）；或忘记 A 比 CD 高 1，竖直距离写成 d 而不是 d−1。","method":"轴截面问题先建坐标：把圆心、弦中点放在轴上，用 R 表示圆心位置，再用圆上一点列勾股方程。"},{"id":"p07","no":"07","img":"008","topic":"反比例函数","kp":["反比例函数","k 的几何意义","面积转化"],"type":"choice","source":"第 3 题 · 双曲线 y=m/x 与 y=n/x","difficulty":2,"errorTags":["符号","面积"],"stem":"如图，点 A 是反比例函数 y=m/x（x<0）图象上一点，AC⊥x 轴于点 C，与反比例函数 y=n/x（x<0）的图象交于点 B，AB=2BC，连接 OA、OB。若 △OAB 的面积为 3，则 m+n=（　）","note":"原题有手写过程与红笔批改，题干按印刷体还原。","options":["−4","−6","−8","−12"],"answer":"D","answerNote":"选 −12；关键是先由 AB=2BC 得 m=3n，再用面积得 n−m=6。","hints":["A、B 在同一条竖直线上，AB、BC 都是竖直线段。","AB=2BC → AB=⅔AC，所以 S△OAB=⅔S△OAC。","S△OAC 与 m 的关系：½·|OC|·AC=−m/2（注意 x<0、m<0）。"],"steps":[{"t":"① 设坐标","d":"设 A(a, m/a)、C(a,0)，则 B 在 AC 上，B(a, n/a)。因为 x<0 且 A 在 B 上方，所以 m<n<0。"},{"t":"② 用 AB=2BC","d":"AB=(m−n)/a，BC=n/a（都为正）。由 AB=2BC 得 m−n=2n，即 m=3n。"},{"t":"③ 面积转化","d":"△OAB 与 △OAC 同底（都在竖直线 AC 上）、同高（O 到 AC 的距离 |a|），且 AB=⅔AC，所以 S△OAB=⅔S△OAC。"},{"t":"④ 求 m","d":"S△OAC=½·|a|·(m/a)=−m/2，所以 S△OAB=⅔·(−m/2)=−m/3=3，得 m=−9。"},{"t":"⑤ 求 m+n","d":"由 m=3n 得 n=−3，所以 m+n=−12，选 D。"}],"keyPoints":["反比例函数上点的坐标设 a","同底等高三角形面积比=底边比","k 的几何意义 S=|k|/2"],"whyWrong":"把 AB=2BC 当成 AB=2AC；或忽略 x<0、m<0 的符号，算出 m+n=12 找不到选项；或直接用 |m|、|n| 丢符号。","method":"反比例函数 + 竖直线段：设横坐标 a，所有线段用 a 表示；面积用「同底等高」转化，符号由象限决定。"},{"id":"p08","no":"08","img":"009","topic":"反比例函数","kp":["待定系数法","三角形面积","图象法解不等式"],"type":"solve","source":"第 10 题 · 反比例函数与一次函数","difficulty":2,"errorTags":["过程规范","面积"],"stem":"如图，双曲线 y=k/x（x>0）上有一点 A(1,5)，过点 A 的直线 y=−mx+n 与该双曲线交于点 B，且点 B 的纵坐标为 1。\n(1) 求反比例函数和一次函数的解析式；\n(2) 连接 OA、OB，求 △AOB 的面积；\n(3) 根据图象直接写出在第一象限内一次函数的值大于反比例函数的值时，x 的取值范围。","note":"原题有学生完整解答与红笔批改；本题按「过程规范」收录，解析给出更简洁的写法。","options":[],"answer":"(1) y=5/x，y=−x+6；(2) 12；(3) 1<x<5","answerNote":"第(3)问端点不取等号；第(2)问用坐标公式最快。","hints":["A(1,5) 在 y=k/x 上 → k=5；B 的纵坐标 1 → 横坐标 5。","把 A、B 代入 y=−mx+n 求 m、n。","△AOB 用「坐标公式」或「割补」：½|x_A·y_B−x_B·y_A|。"],"steps":[{"t":"(1) 反比例函数","d":"把 A(1,5) 代入 y=k/x 得 k=5，所以 y=5/x。B 在 y=5/x 上且纵坐标为 1，所以 1=5/x，x=5，B(5,1)。"},{"t":"(1) 一次函数","d":"把 A(1,5)、B(5,1) 代入 y=−mx+n：−m+n=5，−5m+n=1。两式相减得 4m=4，m=1；代回得 n=6。所以 y=−x+6。"},{"t":"(2) 面积（底×高）","d":"AB=√[(5−1)²+(1−5)²]=4√2。O 到直线 x+y−6=0 的距离 d=|0+0−6|/√2=3√2。所以 S△AOB=½·4√2·3√2=12。"},{"t":"(2) 面积（坐标公式）","d":"另法：S=½|x_A·y_B−x_B·y_A|=½|1×1−5×5|=12。"},{"t":"(3) 图象法","d":"一次函数值大于反比例函数值，即直线在双曲线上方；两交点横坐标为 1 和 5，在第一象限内观察图象得 1<x<5。"}],"keyPoints":["待定系数法","三角形面积：底×高÷2 或坐标公式","图象法解不等式"],"whyWrong":"第(2)问割补时正负号/底高找错（原卷过程较乱）；第(3)问漏写端点或写成 1≤x≤5。","method":"反比例 + 一次函数：先求交点，再用「坐标公式」算面积最快；比较大小看「谁在上方」，端点由交点横坐标定（不取等号）。"},{"id":"p09","no":"09","img":"010-12","topic":"方程与函数","kp":["一元三次方程","根与系数关系","多项式展开"],"type":"choice","source":"B 篇 第 12 题 · 一元三次方程根与系数","difficulty":3,"errorTags":["概念","符号"],"stem":"若关于 x 的一元三次方程 ax³+bx²+cx+d=0（a≠0）的三个实数根为 x₁、x₂、x₃，方程可以写成因式乘积形式：a(x−x₁)(x−x₂)(x−x₃)=0。将左边展开，对比 ax³+bx²+cx+d=0 的系数，就得到一元三次方程根与系数的关系。已知方程 3x³−9x²+2=0 的三个实数根为 x₁、x₂、x₃，下列说法正确的是（　）","note":"原题无手写痕迹，题干按印刷体还原。","options":["x₁+x₂+x₃=−3，1/x₁+1/x₂+1/x₃=−3/2","x₁+x₂+x₃=3，x₁x₂+x₂x₃+x₃x₁=0","x₁+x₂+x₃=−3，1/x₁+1/x₂+1/x₃=0","x₁+x₂+x₃=3，x₁x₂x₃=2"],"answer":"B","answerNote":"选 B；注意 x₁+x₂+x₃=−b/a=3，x₁x₂x₃=−d/a=−2/3。","hints":["先展开 a(x−x₁)(x−x₂)(x−x₃)，对比系数。","本题 a=3，b=−9，c=0，d=2。","注意常数项是 −a·x₁x₂x₃，不是 +a·x₁x₂x₃。"],"steps":[{"t":"① 展开","d":"a(x−x₁)(x−x₂)(x−x₃)=a[x³−(x₁+x₂+x₃)x²+(x₁x₂+x₂x₃+x₃x₁)x−x₁x₂x₃]。"},{"t":"② 对比系数","d":"对比 ax³+bx²+cx+d：x₁+x₂+x₃=−b/a；x₁x₂+x₂x₃+x₃x₁=c/a；x₁x₂x₃=−d/a。"},{"t":"③ 代入本题","d":"a=3，b=−9，c=0，d=2，所以 x₁+x₂+x₃=9/3=3；x₁x₂+x₂x₃+x₃x₁=0/3=0；x₁x₂x₃=−2/3。"},{"t":"④ 判断选项","d":"所以 B 正确；A、C 的「和为 −3」错，D 的「积为 2」错。"}],"keyPoints":["多项式展开对比系数","韦达定理的三次推广","常数项符号"],"whyWrong":"把 x₁+x₂+x₃ 写成 b/a（漏负号）；把 x₁x₂x₃ 写成 d/a（漏负号）；或没注意 c=0。","method":"根与系数关系不用背：展开后逐项对比，符号由「常数项=−a·积」决定。"},{"id":"p10","no":"10","img":"010-13","topic":"方程与函数","kp":["中心对称","周期","二次函数","直线与抛物线相切"],"type":"fill","source":"B 篇 第 13 题 · 双中心对称函数","difficulty":3,"errorTags":["数形结合","分类讨论"],"stem":"小执同学发现一个函数具有以下性质：\n① 当 0≤x≤2 时，函数解析式为 y=−x²+2x；\n② 该函数图象既关于原点中心对称，又关于点(2,0)中心对称。\n(1) 若点(3,m)在该函数图象上，则 m=______；\n(2) 若直线 y=kx+2（k<0）与该函数图象有两个交点，k 的值为______。","note":"本题关键在「图象范围」：由两条中心对称可推出 f(x+4)=f(x)，严格说是整个实数轴上的周期函数。严格按周期 4 数交点，第(2)问有 3 个 k；按初中常规只画 [−2,4] 一段（命题常见口径）只有前两个；只考虑 [0,2] 段切线则只有第一个。考试以老师/答案为准，建议先写前两个，再说明第三个。","options":[],"answer":"(1) −1；(2) k=2−2√2 或 2√6−6（按 [−2,4] 一段；严格周期延拓再加 2√46−14）","answerNote":"两个口径：常见考试口径取前两个；严格按周期 4 的图象还有第三个（切点在 [6,8] 段）。","hints":["关于点(2,0)中心对称：(x,y) ↔ (4−x,−y)。用 (1,1) 求 (3,m)。","两条中心对称 → 图象周期为 4；先把 [−2,4] 上的图象画出来：−2≤x≤0 是 y=x²+2x，0≤x≤2 是 y=−x²+2x，2≤x≤4 是 y=x²−6x+8。","直线过 (0,2)，k<0 往下斜；要恰有两个交点，只能是「与某一段相切 + 与另一段相交」，令判别式 Δ=0。"],"steps":[{"t":"(1) 用对称求 m","d":"关于点(2,0)中心对称：(3,m) 的对称点是 (1,−m)。因为 0≤1≤2，f(1)=−1+2=1，所以 −m=1，m=−1。"},{"t":"(2) 画出图象","d":"由两条中心对称可推出周期 4：f(4−x)=−f(x)，f(−x)=−f(x) ⇒ f(x+4)=f(x)。在 [−2,4] 上：−2≤x≤0 时 y=x²+2x；0≤x≤2 时 y=−x²+2x；2≤x≤4 时 y=x²−6x+8。直线 y=kx+2 恒过 (0,2)。"},{"t":"(2) 排除左段","d":"−2≤x≤0 时直线在 x 轴上方、图象在 x 轴下方，无交点；所以只需看 [0,2] 与 [2,4] 两段。"},{"t":"(2) 与 [0,2] 段相切","d":"−x²+2x=kx+2 → x²+(k−2)x+2=0，Δ=(k−2)²−8=0，k=2±2√2；取 k<0 得 k=2−2√2（切点 x=√2）。k 比它大时只有 1 个交点，比它小时有 3 个，所以此时恰有 2 个交点（另一个在 [2,4] 段，x≈3.41）。"},{"t":"(2) 与 [2,4] 段相切","d":"x²−6x+8=kx+2 → x²−(6+k)x+6=0，Δ=(6+k)²−24=0，k=−6±2√6；取 k<0 且切点在 [2,4] 得 k=2√6−6（切点 x=√6）。同理此时恰有 2 个交点（另一个在 [0,2] 段，x≈0.92）。"},{"t":"(2) 严格周期延拓","d":"若把图象按周期 4 继续画到 [6,8]（谷），f=(x−7)²−1，与 y=kx+2 联立：x²−(14+k)x+46=0，Δ=(14+k)²−184=0，取 k<0 得 k=2√46−14≈−0.435（切点 x=√46≈6.78）。此时另一交点在 [4,6] 段 x≈4.11，也恰有 2 个交点。所以严格说还有第三个值。"},{"t":"(2) 结论","d":"按 [−2,4] 一段：k=2−2√2 或 2√6−6；严格按周期 4：再加 k=2√46−14。"}],"keyPoints":["中心对称 ↔ 坐标代换","两条中心对称 → 周期 4","直线与抛物线相切 Δ=0","数形结合数交点","严格周期延拓会多一个相切解"],"whyWrong":"只画了 [0,2] 一段，或没意识到还要看 [2,4]；相切时只算一个 k（漏掉另一段的相切）；忘记 k<0 舍去正根；没讨论「图象范围」，漏掉第三个值。","method":"对称性先翻译成坐标/周期，再画一个周期的图；「恰有两个交点」= 相切（1 个）+ 相交（1 个），用 Δ=0 找临界。遇到「该函数图象」没给范围时，先按一个周期作答，再补一句严格周期延拓的结果。"},{"id":"p11","no":"11","img":"010-14","topic":"几何变换","kp":["平行四边形","等腰直角三角形","旋转","等腰三角形分类"],"type":"solve","source":"B 篇 第 14 题 · 平行四边形与旋转","difficulty":3,"errorTags":["分类讨论","辅助线"],"stem":"如图，在平行四边形 ABCD 中，∠DAB=45°，DE⊥AB 于点 E，DE=2√2，AE=2EB。\n(1) 填空：AE=______，AD=______；\n(2) 已知点 F 是线段 AD 上的动点（不与 A、D 重合），连接 EF。将 △AFE 绕点 A 顺时针旋转得到 △AF′E′（点 E′、F′ 分别与点 E、F 对应），且满足 E、F′、E′ 三点在同一直线上。记此时的旋转角为 α（45°<α<180°）。当 △AEF′ 是等腰三角形时，求旋转角 α。","note":"原题无手写痕迹；第(2)问的关键是旋转不变量与角度推导。","options":[],"answer":"(1) AE=2√2，AD=4；(2) α=90° 或 120°","answerNote":"第(2)问等腰三角形要分三种情况，其中「AE=AF′」不可能，另外两种各得一解。","hints":["(1) △ADE 是直角三角形，∠A=45° → 等腰直角，AE=DE。","(2) 旋转保长：AE′=AE=2√2，AF′=AF；且 ∠F′AE′=∠FAE=45°。","(2) E、F′、E′ 共线且 F′ 在线段 EE′ 上 → 用 △AEE′ 的底角把 △AEF′ 的三个角都用 α 表示。"],"steps":[{"t":"(1) 等腰直角三角形","d":"DE⊥AB，∠DAE=45°，所以 Rt△ADE 是等腰直角三角形：AE=DE=2√2，AD=√2·AE=4。又 AE=2EB，EB=√2。"},{"t":"(2) 旋转不变量","d":"设 AF=s（0<s<4）。旋转后 AE′=AE=2√2，AF′=AF=s，∠F′AE′=∠FAE=45°，∠EAE′=α。"},{"t":"(2) 求 △AEF′ 的角","d":"在等腰 △AEE′ 中，∠AE′E=(180°−α)/2=90°−α/2。由 E、F′、E′ 共线且 F′ 在线段 EE′ 上，得 ∠AE′F′=90°−α/2。在 △AF′E′ 中，∠AF′E′=180°−45°−(90°−α/2)=45°+α/2。于是 △AEF′ 中：∠AF′E=135°−α/2，∠AEF′=90°−α/2，∠EAF′=α−45°。"},{"t":"(2) 分类讨论","d":"① AE=AF′：需 ∠AEF′=∠AF′E，即 90°−α/2=135°−α/2，不可能。② AE=EF′：需 ∠AF′E=∠EAF′，即 135°−α/2=α−45°，解得 α=120°。③ AF′=EF′：需 ∠AEF′=∠EAF′，即 90°−α/2=α−45°，解得 α=90°。"},{"t":"(2) 结论","d":"所以 α=90° 或 120°。"}],"keyPoints":["等腰直角三角形","旋转保长、保角","三点共线 → 角度关系","等腰三角形分类讨论"],"whyWrong":"只想到一种等腰情况；不会把「三点共线   var KEY = 'mathwrong_v1';
  var DAY = 86400000;
  var GAPS = [1, 3, 7, 14, 30];
  var ITEMS = DATA.items;
  var BY = {};
  ITEMS.forEach(function (it) { BY[it.id] = it; });
  var TOPICS = DATA.topics;

  // ---------- 工具 ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtDay(ts) {
    var d = new Date(ts);
    return todayKey(d);
  }
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  // ---------- 记录 ----------
  function blankDB() {
    return { v: 1, recs: [], wrong: {}, days: {}, meta: { created: Date.now() } };
  }
  var DB = loadDB();
  function loadDB() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return blankDB();
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return blankDB();
      o.recs = Array.isArray(o.recs) ? o.recs : [];
      o.wrong = o.wrong && typeof o.wrong === 'object' ? o.wrong : {};
      o.days = o.days && typeof o.days === 'object' ? o.days : {};
      o.meta = o.meta && typeof o.meta === 'object' ? o.meta : { created: Date.now() };
      return o;
    } catch (e) { return blankDB(); }
  }
  var SAVE_FAIL = false;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); SAVE_FAIL = false; }
    catch (e) { SAVE_FAIL = true; toast('⚠ 记录没能存进本机（隐私模式或空间满），请先到「报告」导出 JSON'); }
  }
  function wOf(id) { return DB.wrong[id] || null; }
  function statusOf(id) {
    var w = wOf(id);
    if (!w) return 'new';
    if (w.due <= Date.now()) return 'due';
    if ((w.streak || 0) >= 3) return 'mastered';
    return 'learning';
  }
  function statusText(s) {
    return { new: '未复习', due: '到期', learning: '复习中', mastered: '已掌握' }[s] || s;
  }
  function statusPill(s) {
    var cls = { new: 'gray', due: 'bad', learning: 'half', mastered: 'ok' }[s] || 'gray';
    return '<span class="pill ' + cls + '">' + statusText(s) + '</span>';
  }
  function dueIds() {
    return ITEMS.filter(function (it) { return statusOf(it.id) === 'due'; }).map(function (it) { return it.id; });
  }
  function newIds() {
    return ITEMS.filter(function (it) { return statusOf(it.id) === 'new'; }).map(function (it) { return it.id; });
  }
  function autoQueue() {
    var due = dueIds();
    var never = newIds();
    var rest = ITEMS.map(function (it) { return it.id; }).filter(function (id) { return due.indexOf(id) < 0 && never.indexOf(id) < 0; });
    rest.sort(function (a, b) {
      var wa = wOf(a), wb = wOf(b);
      return (wa ? wa.last : 0) - (wb ? wb.last : 0);
    });
    return due.concat(never, rest);
  }
  function wrongQueue() {
    return ITEMS.filter(function (it) {
      var w = wOf(it.id);
      return w && (w.lastResult !== 'ok' || (w.streak || 0) < 2);
    }).map(function (it) { return it.id; });
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // 自评：ok / half / bad
  function record(id, result) {
    var now = Date.now();
    var w = DB.wrong[id] || { n: 0, ok: 0, half: 0, bad: 0, streak: 0, first: now, last: 0, due: now };
    w.n += 1;
    w.last = now;
    w.lastResult = result;
    if (result === 'ok') {
      w.ok += 1;
      w.streak = (w.streak || 0) + 1;
      var gap = GAPS[Math.min(w.streak - 1, GAPS.length - 1)];
      w.due = now + gap * DAY;
    } else if (result === 'half') {
      w.half += 1;
      w.streak = Math.max(0, (w.streak || 0) - 1);
      w.due = now + 1 * DAY;
    } else {
      w.bad += 1;
      w.streak = 0;
      w.due = now + 1 * DAY;
    }
    DB.wrong[id] = w;
    DB.recs.push({ ts: now, id: id, result: result });
    if (DB.recs.length > 800) DB.recs = DB.recs.slice(-800);
    var dk = todayKey();
    DB.days[dk] = DB.days[dk] || { n: 0, ok: 0 };
    DB.days[dk].n += 1;
    if (result === 'ok') DB.days[dk].ok += 1;
    save();
  }
  function streakDays() {
    var n = 0;
    var d = new Date();
    for (var i = 0; i < 400; i++) {
      var k = todayKey(d);
      if (!DB.days[k] || !DB.days[k].n) break;
      n += 1;
      d.setDate(d.getDate() - 1);
    }
    return n;
  }
  function dueLabel(w) {
    if (!w) return '未复习';
    var ms = w.due - Date.now();
    if (ms <= 0) return '已到期';
    var days = Math.ceil(ms / DAY);
    return '还有 ' + days + ' 天';
  }

  // ---------- 通用片段 ----------
  function topicColor(t) {
    return { '圆': '#3b6fe0', '反比例函数': '#0f9b8e', '方程与函数': '#7c5cd6', '几何变换': '#c26a00' }[t] || '#3b6fe0';
  }
  function topicPill(t) {
    var c = topicColor(t);
    return '<span class="pill" style="background:' + c + '1a;color:' + c + '">' + esc(t) + '</span>';
  }
  function tagPills(tags) {
    return (tags || []).map(function (x) { return '<span class="pill gray">' + esc(x) + '</span>'; }).join(' ');
  }
  function itemCard(it) {
    var s = statusOf(it.id);
    var w = wOf(it.id);
    return '<div class="item" onclick="openDetail(\'' + it.id + '\')">' +
      '<div class="top"><span class="no">' + esc(it.no) + '</span>' + topicPill(it.topic) +
      '<span class="src">' + esc(it.source) + '</span></div>' +
      '<div class="stem">' + esc(String(it.stem).replace(/\n+/g, ' ')) + '</div>' +
      '<div class="foot">' + statusPill(s) + '<span class="small muted">' + (s === 'new' ? '今天先做' : esc(dueLabel(w))) + '</span>' +
      '<span class="small muted">难度 ' + '★'.repeat(it.difficulty) + '</span>' +
      '<span class="grow"></span><span class="btn btn-sm" onclick="event.stopPropagation();practiceOne(\'' + it.id + '\')">重做</span></div></div>';
  }
  function origBlock(it) {
    var src = IMG[it.img];
    if (!src) return '';
    return '<figure class="orig"><img src="' + src + '" alt="第 ' + esc(it.no) + ' 题原图" loading="lazy">' +
      '<figcaption>原题图（含批改/涂改痕迹；先自己做完再对照，识别有疑问以这张为准）</figcaption></figure>';
  }
  function hintsBlock(it, n) {
    var h = (it.hints || []).slice(0, n);
    if (!h.length) return '';
    return h.map(function (x, i) {
      return '<div class="hintbox"><b>提示 ' + (i + 1) + '：</b>' + esc(x) + '</div>';
    }).join('');
  }
  function solBlock(it) {
    var steps = (it.steps || []).map(function (s) {
      return '<div class="step"><div class="t">' + esc(s.t) + '</div><div class="d">' + esc(s.d) + '</div></div>';
    }).join('');
    var opts = '';
    if (it.options && it.options.length) {
      var letters = ['A', 'B', 'C', 'D'];
      opts = '<div class="kv" style="display:grid;grid-template-columns:1fr;gap:2px;margin-bottom:8px">' +
        it.options.map(function (o, i) {
          var on = String(it.answer).toUpperCase().indexOf(letters[i]) >= 0;
          return '<div style="justify-content:flex-start;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0' +
            (on ? ';color:var(--ok);font-weight:700' : '') + '"><b>' + letters[i] + '.</b> ' + esc(o) + (on ? '  ✓' : '') + '</div>';
        }).join('') + '</div>';
    }
    return '<div class="sol"><h4>详细解析</h4>' + opts + steps + '</div>' +
      '<div class="answer"><b>答案</b><div class="v">' + esc(it.answer) + '</div>' +
      (it.answerNote ? '<div class="small">' + esc(it.answerNote) + '</div>' : '') + '</div>' +
      (it.keyPoints && it.keyPoints.length ? '<div class="method"><b>关键点：</b>' + it.keyPoints.map(esc).join(' · ') + '</div>' : '') +
      (it.whyWrong ? '<div class="why"><b>错因提醒：</b>' + esc(it.whyWrong) + '</div>' : '') +
      (it.method ? '<div class="method"><b>方法总结：</b>' + esc(it.method) + '</div>' : '');
  }
  function assessBlock(it) {
    return '<div class="assess">' +
      '<button class="btn btn-ok" onclick="assess(\'' + it.id + '\',\'ok\')">会了 ✓</button>' +
      '<button class="btn btn-half" onclick="assess(\'' + it.id + '\',\'half\')">半会</button>' +
      '<button class="btn btn-bad" onclick="assess(\'' + it.id + '\',\'bad\')">还不会</button>' +
      '</div><div class="small muted" style="margin-top:6px">自评后自动安排下次复习：会了 → 1/3/7/14/30 天；半会 → 明天；还不会 → 明天。</div>';
  }

  // ---------- 视图 ----------
  var S = { view: 'today', topic: '全部', status: '全部', q: '', detailId: null, detailFrom: 'list', practice: null, printAns: false };

  function go(view) {
    S.view = view;
    if (view === 'practice') { if (!S.practice) startPractice('auto'); else render(); return; }
    render();
  }
  function render() {
    var app = $('app');
    if (S.view === 'today') app.innerHTML = viewToday();
    else if (S.view === 'list') app.innerHTML = viewList();
    else if (S.view === 'detail') app.innerHTML = viewDetail();
    else if (S.view === 'practice') app.innerHTML = viewPractice();
    else if (S.view === 'report') app.innerHTML = viewReport();
    else if (S.view === 'doc') app.innerHTML = viewDoc();
    else app.innerHTML = viewToday();
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === S.view);
    });
    window.scrollTo(0, 0);
  }

  function viewToday() {

      '<button class="btn" onclick="go(\'list\')">看全部错题</button>' +
      '</div></div>' +
      '<div class="card"><h2 style="margin:0 0 10px">板块掌握度</h2><div class="topicbars">' +
      topicStats.map(function (x) {
        return '<div class="tb"><span>' + esc(x.t) + '</span><span class="bar"><i style="width:' + x.pct + '%"></i></span><span class="pct">' + x.m + '/' + x.n + '</span></div>';

      '<div class="card"><h2 style="margin:0 0 10px">打印重做卷</h2>' +
      '<p class="small muted">只印题干 + 原图（解析不印），在纸上重做；答案可附在最后，方便对答案。</p>' +
      '<div class="row"><label class="small"><input type="radio" name="pwhich" value="due" checked> 只印到期/新题</label>' +

  function recentRecs(n) {

      (it.note ? '<div class="note">' + esc(it.note) + '</div>' : '') +

  function toggleOrig() { S.showOrig = !S.showOrig; render(); }
  function revealHints() {

    S.hints = Math.min((S.hints || 0) + 1, (it.hints || []).length);
    render();
  }
  function revealSol() { S.sol = true; render(); }

  // ---------- 重做 ----------
  function startPractice(mode) {
    var queue;
    if (mode === 'wrong') queue = wrongQueue();
    else if (mode === 'all') queue = ITEMS.map(function (it) { return it.id; });
    else queue = autoQueue();
    if (!queue.length) {
      if (mode === 'wrong') { queue = autoQueue(); toast('还没有「没掌握」的题，先按今日复习走'); }
      else { queue = shuffle(ITEMS.map(function (it) { return it.id; })).slice(0, 3); toast('没有需要复习的题，随机抽 3 题'); }
    }
    if (mode === 'auto') queue = queue.slice(0, 6);
    S.practice = { queue: queue, i: 0, hints: 0, sol: false, t0: Date.now(), done: [], from: mode };
    S.showOrig = true; S.hints = 0; S.sol = false;
    S.view = 'practice';
    render();
  }
  function practiceOne(id) {
    S.practice = { queue: [id], i: 0, hints: 0, sol: false, t0: Date.now(), done: [], from: 'one' };
    S.view = 'practice';
    render();
  }
  function randomPractice() {
    S.practice = { queue: shuffle(ITEMS.map(function (it) { return it.id; })).slice(0, 3), i: 0, hints: 0, sol: false, t0: Date.now(), done: [], from: 'random' };
    S.view = 'practice';
    render();
  }
  function viewPractice() {
    var P = S.practice;
    if (!P) return viewToday();
    if (P.i >= P.queue.length) return viewPracticeDone();
    var it = BY[P.queue[P.i]];
    var pct = Math.round(P.i / P.queue.length * 100);
    return '<div class="card"><div class="row"><span class="pill">第 ' + (P.i + 1) + ' / ' + P.queue.length + ' 题</span>' +
      '<span class="small muted">' + esc(P.from === 'wrong' ? '错题重做' : P.from === 'one' ? '单题重做' : P.from === 'random' ? '随机抽题' : '今日复习') + '</span>' +
      '<span class="grow"></span><button class="btn btn-sm" onclick="quitPractice()">结束本轮</button></div>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="qhead"><span class="no">第 ' + esc(it.no) + ' 题</span>' + topicPill(it.topic) + statusPill(statusOf(it.id)) + '</div>' +
      '<div class="qmeta">' + esc(it.source) + ' · 难度 ' + '★'.repeat(it.difficulty) + '</div>' +
      '<div class="stem" style="margin-top:10px">' + esc(it.stem) + '</div>' +
      (it.note ? '<div class="note">' + esc(it.note) + '</div>' : '') +
      '<div class="row" style="margin:10px 0">' +
      '<button class="btn btn-sm" onclick="pToggleOrig()">' + (S.showOrig ? '收起原图' : '看原题图') + '</button>' +
      '<button class="btn btn-sm" onclick="pHint()">提示 ' + (P.hints || 0) + '/' + (it.hints || []).length + '</button>' +
      '<button class="btn btn-sm btn-primary" onclick="pSol()">' + (P.sol ? '已显示解析' : '对答案 / 看解析') + '</button></div>' +
      (S.showOrig ? origBlock(it) : '') +
      (P.hints ? hintsBlock(it, P.hints) : '') +
      (P.sol ? solBlock(it) : '<div class="note">先在纸上写完整过程，再点「对答案 / 看解析」。写不出来可以先点「提示」。</div>') +
      (P.sol ? assessBlock(it) : '') +
      '</div>';
  }
  function pToggleOrig() { S.showOrig = !S.showOrig; render(); }
  function pHint() {
    var P = S.practice; var it = BY[P.queue[P.i]];
    P.hints = Math.min((P.hints || 0) + 1, (it.hints || []).length);
    render();
  }
  function pSol() { S.practice.sol = true; render(); }
  function quitPractice() {
    if (S.practice && S.practice.done.length) toast('本轮已完成 ' + S.practice.done.length + ' 题，记录已保存');
    S.practice = null; S.view = 'today'; render();
  }
  function assess(id, result) {
    record(id, result);
    if (S.view === 'detail') {
      S.sol = true;
      toast(result === 'ok' ? '已记「会了」，下次复习：' + dueLabel(wOf(id)) : result === 'half' ? '已记「半会」，明天再练' : '已记「还不会」，明天再练');
      render();
      return;
    }
    var P = S.practice;
    if (!P) return;
    P.done.push({ id: id, result: result });
    P.i += 1;
    P.hints = 0; P.sol = false; S.showOrig = true;
    if (P.i < P.queue.length) render();
    else { S.view = 'practice'; render(); }
  }
  function viewPracticeDone() {
    var P = S.practice;
    var ok = P.done.filter(function (x) { return x.result === 'ok'; }).length;
    var half = P.done.filter(function (x) { return x.result === 'half'; }).length;
    var bad = P.done.filter(function (x) { return x.result === 'bad'; }).length;
    var sec = Math.max(1, Math.round((Date.now() - P.t0) / 1000));
    return '<div class="card" style="text-align:center;padding:26px 16px">' +
      '<h2 style="margin:0 0 6px">本轮完成 🎉</h2>' +
      '<p class="muted">' + P.done.length + ' 题 · 用时 ' + Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒</p>' +
      '<div class="stats" style="grid-template-columns:repeat(3,1fr);max-width:520px;margin:14px auto">' +
      '<div class="stat"><b style="color:var(--ok)">' + ok + '</b><span>会了</span></div>' +
      '<div class="stat"><b style="color:var(--half)">' + half + '</b><span>半会</span></div>' +
      '<div class="stat"><b style="color:var(--bad)">' + bad + '</b><span>还不会</span></div></div>' +
      '<div class="row" style="justify-content:center"><button class="btn btn-primary" onclick="startPractice(\'auto\')">再来一轮</button>' +
      '<button class="btn" onclick="go(\'today\')">回今日复习</button>' +
      '<button class="btn" onclick="go(\'list\')">看全部错题</button></div></div>';
  }

  // ---------- 报告 ----------
  function viewReport() {
    var total = ITEMS.length;
    var done = ITEMS.filter(function (it) { return wOf(it.id); }).length;
    var due = dueIds().length;
    var mastered = ITEMS.filter(function (it) { return statusOf(it.id) === 'mastered'; }).length;
    var attempts = DB.recs.length;
    var okN = DB.recs.filter(function (r) { return r.result === 'ok'; }).length;
    var rate = attempts ? Math.round(okN / attempts * 100) : 0;
    var rows = TOPICS.map(function (t) {
      var list = ITEMS.filter(function (it) { return it.topic === t; });
      var recs = DB.recs.filter(function (r) { var it = BY[r.id]; return it && it.topic === t; });
      var ok = recs.filter(function (r) { return r.result === 'ok'; }).length;
      var m = list.filter(function (it) { var w = wOf(it.id); return w && (w.streak || 0) >= 2; }).length;
      return '<tr><td>' + esc(t) + '</td><td class="n">' + list.length + '</td><td class="n">' + recs.length + '</td>' +
        '<td class="n">' + (recs.length ? Math.round(ok / recs.length * 100) + '%' : '—') + '</td><td class="n">' + m + '/' + list.length + '</td></tr>';
    }).join('');
    return '<div class="card"><h2 style="margin:0 0 10px">学习报告</h2>' +
      '<div class="stats">' +
      '<div class="stat"><b>' + done + '/' + total + '</b><span>已复习题数</span></div>' +
      '<div class="stat"><b style="color:var(--bad)">' + due + '</b><span>到期</span></div>' +
      '<div class="stat"><b style="color:var(--ok)">' + mastered + '</b><span>已掌握</span></div>' +
      '<div class="stat"><b>' + rate + '%</b><span>自评正确率</span></div>' +
      '</div>' +
      '<div class="kv" style="margin-top:12px">' +
      '<div><span>累计练习</span><b>' + attempts + ' 次</b></div>' +
      '<div><span>连续复习</span><b>' + streakDays() + ' 天</b></div>' +
      '<div><span>记录开始</span><b>' + fmtDay(DB.meta.created || Date.now()) + '</b></div>' +
      '<div><span>本批题数</span><b>' + total + ' 题</b></div></div></div>' +
      '<div class="card"><h2 style="margin:0 0 10px">分板块</h2><table class="tb2"><thead><tr><th>板块</th><th class="n">题数</th><th class="n">练习</th><th class="n">正确率</th><th class="n">掌握</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="card"><h2 style="margin:0 0 10px">最近记录</h2>' + recentRecs(30) + '</div>' +
      '<div class="card"><h2 style="margin:0 0 10px">记录管理</h2>' +
      '<p class="small muted">记录只存这台设备的浏览器。换电脑、清缓存前先「导出 JSON」，放进仓库 <code>学习记录/</code>。</p>' +
      '<div class="row"><button class="btn btn-primary" onclick="exportJSON()">导出 JSON</button>' +
      '<button class="btn" onclick="document.getElementById(\'import-file\').click()">导入 JSON</button>' +
      '<button class="btn" onclick="clearAll()">清空记录</button></div>' +
      (SAVE_FAIL ? '<p class="small" style="color:var(--bad)">⚠ 上次保存失败：记录可能没写进本机，请立即导出。</p>' : '') +
      '</div>' +
      '<div class="footer">数据格式：{v, recs[], wrong{}, days{}, meta{}} · 键 ' + KEY + '</div>';
  }
  function exportJSON() {
    var out = { schema: 'lt.wrongbook/1', app: '数学错题本', batch: DATA.meta.batch, exportedAt: new Date().toISOString(), db: DB };
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '数学错题本记录-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast('已导出 JSON，请放进 学习记录/');
  }
  function importJSON(text) {
    var o = JSON.parse(text);
    var db = o && o.db ? o.db : (o && o.kind === 'backup' && o.apps && o.apps[KEY]) ? o.apps[KEY] : o;
    if (!db || !Array.isArray(db.recs) || typeof db.wrong !== 'object') throw new Error('不是有效的错题本记录');
    if (!confirm('导入会合并到本机记录（同题取更晚的复习时间），继续？')) return;
    var seen = {};
    DB.recs.forEach(function (r) { seen[r.ts + '|' + r.id] = true; });
    db.recs.forEach(function (r) {
      if (!r || !BY[r.id] || typeof r.ts !== 'number') return;
      if (seen[r.ts + '|' + r.id]) return;
      seen[r.ts + '|' + r.id] = true;
      DB.recs.push(r);
    });
    DB.recs.sort(function (a, b) { return a.ts - b.ts; });
    Object.keys(db.wrong || {}).forEach(function (id) {
      if (!BY[id]) return;
      var w = db.wrong[id];
      if (!w || typeof w.due !== 'number') return;
      var old = DB.wrong[id];
      if (!old || (w.last || 0) > (old.last || 0)) DB.wrong[id] = w;
    });
    Object.keys(db.days || {}).forEach(function (k) {
      if (!DB.days[k]) DB.days[k] = db.days[k];
    });
    save(); render(); toast('导入完成');
  }
  function clearAll() {
    if (!confirm('清空所有练习记录和错题状态？建议先导出 JSON。')) return;
    if (!confirm('再确认一次：清空后不可恢复。')) return;
    DB = blankDB(); save(); render(); toast('已清空');
  }

  // ---------- 打印 ----------
  function doPrint() {
    var which = 'due';
    document.querySelectorAll('input[name="pwhich"]').forEach(function (r) { if (r.checked) which = r.value; });
    var ans = $('print-ans') && $('print-ans').checked;
    var ids = which === 'all' ? ITEMS.map(function (it) { return it.id; }) : dueIds().concat(newIds());
    if (!ids.length) { toast('没有到期/新题；可改选「全部 11 题」'); return; }
    var html = '<div class="p-title">数学错题重做卷</div>' +
      '<div class="p-sub">' + todayKey() + ' · ' + ids.length + ' 题 · 先写过程，再对答案</div>';
    ids.forEach(function (id, i) {
      var it = BY[id];
      html += '<div class="p-item"><div class="p-no">第 ' + (i + 1) + ' 题（错题本 ' + esc(it.no) + '）</div>' +
        '<div class="p-src">' + esc(it.source) + ' · ' + esc(it.topic) + '</div>' +
        '<div class="p-stem">' + esc(it.stem) + '</div>';
      if (IMG[it.img]) html += '<img src="' + IMG[it.img] + '" alt="原题图">';
      html += '<div class="p-lines"><div></div><div></div><div></div><div></div></div></div>';
    });
    if (ans) {
      html += '<div class="p-answers"><h3>答案与要点</h3>';
      ids.forEach(function (id, i) {
        var it = BY[id];
        html += '<div class="p-ans"><b>第 ' + (i + 1) + ' 题</b>' + esc(it.answer) +
          (it.keyPoints && it.keyPoints.length ? '　｜　' + it.keyPoints.map(esc).join(' · ') : '') + '</div>';
      });
      html += '</div>';
    }
    $('print-sheet').innerHTML = html;
    window.print();
  }

  // ---------- 说明 ----------
  function viewDoc() {
    return '<div class="card"><h2 style="margin:0 0 10px">怎么用</h2>' +
      '<p>1. 点「今日复习」→「开始今日复习」：系统按到期时间排队（先到期、再没复习过的）。</p>' +
      '<p>2. 一题一屏：<b>先在纸上完整写一遍</b>；写不动再点「提示」，最后点「对答案 / 看解析」。</p>' +
      '<p>3. 自评「会了 / 半会 / 还不会」：会了 → 1、3、7、14、30 天后再复习；半会/还不会 → 明天再来。</p>' +
      '<p>4. 「错题列表」可按板块/状态筛；点卡片看解析，点「重做」直接练一题。</p>' +
      '<p>5. 「打印重做卷」：只印题干 + 原图，纸上重做；可勾选附答案页。</p></div>' +
      '<div class="card"><h2 style="margin:0 0 10px">复习间隔为什么是 1/3/7/14/30</h2>' +
      '<p class="small muted">这是「间隔重复」的简化版：第一次会了隔 1 天，再会对隔 3 天，之后 7、14、30 天。目的是在「快忘还没忘」的时候再见面，比集中刷 10 遍省时间。半会/不会的题不要硬拉长间隔，明天再来。</p></div>' +
      '<div class="card"><h2 style="margin:0 0 10px">原图与识别</h2>' +
      '<p class="small muted">每题都保留原题照片（含手写、批改、涂改痕迹），文字题干是按印刷体重新录入的。<b>详情页和重做页默认展开原图</b>，点「收起原图」可以遮住；原图里可能有手写答案，建议先自己做完再对照。遇到文字与图不一致、或题干有疑问，<b>以原图为准</b>。原图来源：' + esc(DATA.meta.source) + '。</p>' +
      '<p class="small muted">本页是单文件离线页：题目、解析、图片全部内联，不联网、不用安装；手机浏览器也能打开。</p></div>' +
      '<div class="card"><h2 style="margin:0 0 10px">怎么加新错题（给家长/维护者）</h2>' +
      '<p class="small">在 HTML 里找到 <code>var DATA = </code> 那一行，把新题按同样结构加进 <code>items</code> 数组；图片用 base64 内联到 <code>IMG</code>。字段：</p>' +
      '<pre class="small" style="background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto">{\n  "id":"p12", "no":"12", "img":"011",\n  "topic":"圆", "kp":["垂径定理"],\n  "type":"fill", "source":"来源", "difficulty":2,\n  "errorTags":["分类讨论"],\n  "stem":"题干（挖空写 ______）",\n  "note":"原图说明", "options":[],\n  "answer":"答案", "answerNote":"提醒",\n  "hints":["提示1","提示2"],\n  "steps":[{"t":"① 标题","d":"这一步的讲解"}],\n  "keyPoints":["关键点"], "whyWrong":"错因", "method":"方法总结"\n}</pre>' +
      '<p class="small muted">加完把新图压成 webp 再转 base64（控制在 80KB/张以内），页面体积别超过 2MB（仓库容量闸门）。</p></div>' +
      '<div class="card"><h2 style="margin:0 0 10px">深链</h2>' +
      '<p class="small muted"><code>#view=today|list|practice|report|doc</code>；<code>#list=wrong</code> 只练做错过的；<code>#id=p01</code> 直接打开某题。开始页「数学错题」卡片会带 <code>#view=practice</code> 或 <code>#view=practice&amp;list=wrong</code>。</p></div>' +
      '<div class="footer">数学错题本 · 2026-11-13 批次 · 记录键 ' + KEY + ' · 单文件离线</div>';
  }

  // ---------- 启动 ----------
  function initFromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    var p = new URLSearchParams(h);
    var view = p.get('view') || 'today';
    if (view === 'practice') {
      var list = p.get('list');
      startPractice(list === 'wrong' ? 'wrong' : 'auto');
      return;
    }
    if (view === 'list' && p.get('id') && BY[p.get('id')]) { S.view = 'list'; openDetail(p.get('id')); return; }
    if (['today', 'list', 'report', 'doc'].indexOf(view) >= 0) { S.view = view; render(); return; }
    S.view = 'today'; render();
  }

  // 事件绑定
  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.addEventListener('click', function () { S.practice = null; S.detailId = null; S.showOrig = false; S.hints = 0; S.sol = false; go(b.getAttribute('data-view')); });
  });
  $('import-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try { importJSON(String(r.result)); } catch (err) { alert('导入失败：' + err.message); }
    };
    r.readAsText(f);
    e.target.value = '';
  });

  // 暴露给 onclick
  window.S = S;
  window.go = go; window.openDetail = openDetail; window.startPractice = startPractice;
  window.practiceOne = practiceOne; window.randomPractice = randomPractice; window.quitPractice = quitPractice;
  window.toggleOrig = toggleOrig; window.revealHints = revealHints; window.revealSol = revealSol;
  window.pToggleOrig = pToggleOrig; window.pHint = pHint; window.pSol = pSol; window.assess = assess;
  window.exportJSON = exportJSON; window.clearAll = clearAll; window.doPrint = doPrint; window.importJSON = importJSON;
  window.render = render; window.renderListOnly = renderListOnly;

  initFromHash();
})();
</script>
